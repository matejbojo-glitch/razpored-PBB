}

// ---------------------------------------------------------------------
// Bralni prikaz še ne povezane (neregistrirane) osebe — vidna vsem, na
// izrecno željo, z istimi vidnostnimi pravili kot pri registriranih
// profilih. contact_imports_public (glej schema.sql) že vrne null za
// stolpce, ki jih klicatelj po vlogi ne sme videti (phone/HR polja), zato
// se tu samo prikaže, kar je prišlo.
// ---------------------------------------------------------------------
function PendingProfil({ oseba, myRole, oddelki, onNazaj }){
  const hr = oseba.hr || {};
  const imaHr = hr.employee_code || hr.birth_date || hr.position_name || hr.manager_name || hr.parental_leave || hr.annual_leave_total != null || hr.leave_balance_days != null;
  return (
    <div>
      <button className="backlink no-print" onClick={onNazaj}>‹ Nazaj na imenik</button>
      <div className="card" style={{marginTop:10, textAlign:"center"}}>
        <div className="avatarBig" style={{margin:"0 auto 10px"}}>{initials(oseba.full_name)}</div>
        <div className="name" style={{fontSize:18, fontWeight:800}}>{oseba.full_name}</div>
        <div style={{marginTop:6}}><span className="pill pending">še ni registriran</span></div>
      </div>

      <div className="card">
        <EmailRow email={oseba.email} />
        <PhoneRow phone={oseba.phone} />
        {oseba.dept_codes.length > 0 && (
          <div className="rowline">
            <div className="lbl">Oddelek</div>
            <div className="val">{oseba.dept_codes.map(k => (oddelki.find(o => o.code === k) || {}).name || k).join(" · ")}</div>
          </div>
        )}
        {!oseba.phone && <p className="empty" style={{marginTop:6}}>Telefonska številka ni vidna ali ni vnesena.</p>}
      </div>

      {imaHr && (
        <div className="card">
          {hr.employee_code && <div className="rowline"><div className="lbl">Šifra</div><div className="val">{hr.employee_code}</div></div>}
          {hr.birth_date && <div className="rowline"><div className="lbl">Rojstvo</div><div className="val">{hr.birth_date}</div></div>}
          {hr.position_name && <div className="rowline"><div className="lbl">Del. mesto</div><div className="val">{hr.position_name}</div></div>}
          {hr.manager_name && <div className="rowline"><div className="lbl">Vodja</div><div className="val">{hr.manager_name}</div></div>}
          {hr.parental_leave && <div className="rowline"><div className="lbl">Starš. varstvo</div><div className="val">{hr.parental_leave}</div></div>}
          {hr.annual_leave_total != null && <div className="rowline"><div className="lbl">Letni dopust</div><div className="val">{hr.annual_leave_total} dni</div></div>}
          {hr.leave_balance_days != null && (
            <div className="rowline">
              <div className="lbl">Stanje dopusta</div>
              <div className="val">{hr.leave_balance_days} dni{hr.leave_balance_asof ? " (na dan " + hr.leave_balance_asof + ")" : ""}</div>
            </div>
          )}
          <DopustNapredek skupaj={hr.annual_leave_total} preostanek={hr.leave_balance_days} naDan={hr.leave_balance_asof} />
          <p className="hint" style={{marginTop:8, marginBottom:0}}>HR podatki — vidni samo adminu.</p>
        </div>
      )}

      {myRole === "admin" && (
        <p className="hint no-print">Za povezovanje s pravim profilom (ko se oseba registrira) ali urejanje pojdi na dno strani v razdelek "Uvoz zaposlenih".</p>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// Admin: uvoz seznama zaposlenih (še neregistriranih) + povezovanje z
// dejanskimi profili, ko se oseba sama registrira.
// ---------------------------------------------------------------------
// Mapiranje "Naziv enote organizacijske strukture" (uraden HR izvoz) na
// department_code, kadar datoteka nima ločenega stolpca department_code.
// Samo za 6 negovalnih oddelkov z znano, stabilno poimenovanje enote — za
// vodstvo/druge enote department_code ostane prazen, admin ga dopolni ročno.
const UNIT_TO_DEPT = {
  "zn - oddelek b": "B", "zn - oddelek c": "C", "zn - oddelek c1 (intenziva)": "C1",
  "zn - oddelek d (intenziva)": "D", "zn - oddelek e1": "E1", "zn - oddelek e2": "E2",
  "zn - oddelek a, mt": "A",
};

// Kanonična polja, ki jih zna uvoz prepoznati po glavi stolpca (poljuben
// vrstni red, case-insensitive) — pokriva tako preprosto CSV obliko
// (full_name,email,...) kot uraden HR izvoz v slovenščini.
const GLAVE_MAPA = {
  full_name: ["full_name","priimek in ime","ime in priimek","ime"],
  email: ["email","elektronska pošta","elektronska posta","e-pošta","e-posta"],
  phone: ["phone","telefon"],
  // "vloga" dodan nazaj (v. 1 tega uvoza je bil namenoma izpuščen, ker bi
  // generičen HR izvoz lahko tu imel delovno-mestno klasifikacijo namesto
  // aplikacijske vloge) - v resničnih datotekah admin/vodja/user vrednosti
  // uporablja, in obstoječa zaščita spodaj (le "admin"/"vodja"/"user" so
  // veljavne, sicer "user") vsako neveljavno vrednost varno prestreže.
  role: ["role","vloga"],
  department_code: ["department_code","oddelek"],
  employee_code: ["employee_code","šifra zaposlenega","sifra zaposlenega"],
  birth_date: ["birth_date","datum rojstva"],
  position_name: ["position_name","naziv delovnega mesta"],
  org_unit_name: ["org_unit_name","naziv enote organizacijske strukture"],
  manager_name: ["manager_name","vodja (naziv)","vodja"],
  // Šifra neposrednega vodje (ne ime) — če jo znamo razrešiti na obstoječ
  // profil (prek profile_hr_details.employee_code), uvoz samodejno nastavi
  // profiles.vodja_id (glej vodjaPari spodaj v uvoziVrsticeObjekte). To je
  // ločeno od manager_name zgoraj (tisto je samo prosto besedilo za prikaz).
  vodja_sifra: ["vodja_sifra","vodja (šifra)","vodja (sifra)"],
  parental_leave: ["parental_leave","starševsko varstvo","starsevsko varstvo"],
  annual_leave_total: ["annual_leave_total","letni dopust 2026 (skupaj)","letni dopust (skupaj)","letni dopust"],
  // Tekoče stanje dopusta (preostanek dni) - ločeno od letne kvote zgoraj,
  // ker se to spreminja med letom in ga admin redno posodablja z uvozom.
  leave_balance_days: ["leave_balance_days","stanje dopusta","stanje dopusta (dni)","preostanek dopusta","preostanek dopusta (dni)","dopust stanje"],
  leave_balance_asof: ["leave_balance_asof","stanje na dan","dopust na dan"],
};

const PRAZEN_NOV = { full_name:"", email:"", phone:"", role:"user", department_code:"",
  employee_code:"", birth_date:"", position_name:"", manager_name:"", parental_leave:"", annual_leave_total:"",
  leave_balance_days:"", leave_balance_asof:"" };

function AdminUvoz({ osebe, oddelki, onSpremenjeno }){
  const [uvozi, setUvozi] = useState(null);
  const [uvozMsg, setUvozMsg] = useState(null);
  const [uvozBusy, setUvozBusy] = useState(false);
  const [novo, setNovo] = useState(PRAZEN_NOV);
  const [dodajBusy, setDodajBusy] = useState(false);
  const [gsheetUrl, setGsheetUrl] = useState("");
  const [pdfBesedilo, setPdfBesedilo] = useState(null); // surovo besedilo iz PDF, čaka na ročni pregled/uvoz
  const fileRef = useRef();

  const nalozi = () => {
    client.from("contact_imports").select("*").order("created_at", { ascending:false }).then(({ data }) => setUvozi(data || []));
  };
  useEffect(() => { nalozi(); }, []);

  const dodajVrstico = async (vrstica) => {
    const { error } = await client.from("contact_imports").insert(vrstica);
    return error;
  };

  // Če je oseba (po e-pošti) že v seznamu "še ne povezani", POSODOBI to
  // vrstico namesto da doda podvojeno — na izrecno željo, ker se ista, še
  // neregistrirana oseba lahko pojavi v več zaporednih uvozih (posodobljeni
  // podatki čez čas), prej je vsak tak uvoz ustvaril nov, podvojen zapis.
  const dodajAliPosodobiVrstico = async (vrstica) => {
    const obstojeci = uvozi.find(u => !u.linked_profile_id && (u.email || "").toLowerCase() === vrstica.email.toLowerCase());
    if (obstojeci) {
      const { error } = await client.from("contact_imports").update(vrstica).eq("id", obstojeci.id);
      return error;
    }
    return dodajVrstico(vrstica);
  };

  const vrsticaVZapis = (v) => {
    const full_name = (v.full_name || "").trim();
    const email = (v.email || "").trim();
    if (!full_name || !email) return null;
    const role = ["admin","vodja","user"].includes(v.role) ? v.role : "user";
    let department_code = (v.department_code || "").trim() || null;
    if (!department_code && v.org_unit_name) {
      department_code = UNIT_TO_DEPT[v.org_unit_name.trim().toLowerCase()] || null;
    }
    const annual_leave_total = v.annual_leave_total !== undefined && v.annual_leave_total !== "" && !isNaN(Number(v.annual_leave_total))
      ? Number(v.annual_leave_total) : null;
    const leave_balance_days = v.leave_balance_days !== undefined && v.leave_balance_days !== "" && !isNaN(Number(v.leave_balance_days))
      ? Number(v.leave_balance_days) : null;
    // Če je stanje dopusta podano brez lastnega datuma, privzemi 1. v
    // tekočem mesecu (na izrecno željo: "dodatno stanje dopusta na 1 dan v
    // mesecu") - admin lahko datum kasneje ročno popravi v profilu osebe.
    let leave_balance_asof = window.ImportUtils.normalizirajDatum(v.leave_balance_asof) || null;
    if (leave_balance_days != null && !leave_balance_asof) {
      const zdaj = new Date();
      leave_balance_asof = `${zdaj.getFullYear()}-${String(zdaj.getMonth()+1).padStart(2,"0")}-01`;
    }
    return {
      full_name, email, phone: (v.phone || "").trim() || null, role, department_code,
      employee_code: (v.employee_code || "").trim() || null,
      birth_date: window.ImportUtils.normalizirajDatum(v.birth_date) || null,
      position_name: (v.position_name || "").trim() || null,
      manager_name: (v.manager_name || "").trim() || null,
      vodja_sifra: (v.vodja_sifra || "").trim() || null,
      parental_leave: (v.parental_leave || "").trim() || null,
      annual_leave_total, leave_balance_days, leave_balance_asof,
    };
  };

  // Prenese podatke (vloga/oddelek/telefon/HR polja, vključno s stanjem
  // dopusta) neposredno na ŽE registriran profil. Skupno za "Poveži" (prvič)
  // IN za ponoven uvoz posodobljenega stanja pri osebah, ki so že povezane —
  // na izrecno željo: admin redno uvozi novo Excel tabelo, obstoječi
  // zaposleni naj bodo takoj na tekočem, brez ročnega "Poveži" vsakič znova.
  const prenesiPodatkeNaProfil = async (zapis, profileId) => {
    // Najprej preberi trenutno stanje: splošen HR izvoz pogosto nima WARDS_META
    // kode oddelka (samo splošno organizacijsko enoto, ki se ne preslika prek
    // UNIT_TO_DEPT) — brez tega bi uvoz vsakič povozil ročno/SQL nastavljen
    // oddelek z null. Enako varuje vlogo: uvoz nikoli ne povrne admina/vodje
    // nazaj na "user", tudi če je izvorni stolpec "vloga" tam prazen/drugačen.
    const { data: trenutni } = await client.from("profiles").select("role, department_code").eq("id", profileId).single();
    const novaVloga = trenutni && trenutni.role !== "user" ? trenutni.role : (zapis.role || "user");
    const noviOddelek = zapis.department_code || (trenutni && trenutni.department_code) || null;
    // full_name se vedno prepiše z izvozom — vrsticaVZapis() zgoraj zajame
    // vrstico samo, če ima neprazno ime IN e-pošto, izvor pa je uraden HR
    // izvoz, torej zanesljivejši od morebitne napačne vrednosti v bazi (npr.
    // če je handle_new_user() sprožilec ob ustvarjanju računa padel nazaj na
    // e-pošto namesto imena, ker takrat ni dobil pravih metapodatkov).
    const { error: e1 } = await client.from("profiles").update({
      full_name: zapis.full_name, role: novaVloga, department_code: noviOddelek,
    }).eq("id", profileId);
    if (e1) return e1;
    if (zapis.phone) {
      await client.from("contact_phones").upsert({ profile_id: profileId, phone: zapis.phone, updated_at: new Date().toISOString() });
    }
    const imaHrPodatke = zapis.employee_code || zapis.birth_date || zapis.position_name || zapis.manager_name
      || zapis.parental_leave || zapis.annual_leave_total != null || zapis.leave_balance_days != null;
    if (imaHrPodatke) {
      await client.from("profile_hr_details").upsert({
        profile_id: profileId,
        employee_code: zapis.employee_code || null, birth_date: zapis.birth_date || null,
        position_name: zapis.position_name || null, manager_name: zapis.manager_name || null,
        parental_leave: zapis.parental_leave || null, annual_leave_total: zapis.annual_leave_total,
        leave_balance_days: zapis.leave_balance_days, leave_balance_asof: zapis.leave_balance_asof,
        updated_at: new Date().toISOString(),
      });
    }
    return null;
  };

  // Skupno za CSV / Excel / Google Sheets / ročno urejeno PDF-besedilo. Če
  // se e-pošta ujema z že registriranim profilom, se podatki posodobijo
  // NANJ neposredno (glej prenesiPodatkeNaProfil); sicer gredo v
  // contact_imports kot doslej (čaka na registracijo + ročno "Poveži").
  const uvoziVrsticeObjekte = async (vrsticeObj) => {
    let dodanih = 0, posodobljenih = 0, napak = 0;
    // Zbrano med glavno zanko, razrešeno šele po njej (glej spodaj) — vodja
    // je lahko naveden s svojo šifro PREDEN je njegova/njena vrstica sploh
    // obdelana, zato mora biti razrešitev ločen drugi prehod čez že
    // posodobljene profile, ne del posamezne iteracije.
    const vodjaPari = [];
    for (const v of vrsticeObj) {
      const zapis = vrsticaVZapis(v);
      if (!zapis) { napak++; continue; }
      const obstojeci = osebe.find(o => (o.email || "").toLowerCase() === zapis.email.toLowerCase());
      if (obstojeci) {
        const err = await prenesiPodatkeNaProfil(zapis, obstojeci.id);
        if (err) { napak++; } else {
          posodobljenih++;
          if (zapis.vodja_sifra) vodjaPari.push({ profileId: obstojeci.id, vodjaSifra: zapis.vodja_sifra });
        }
      } else {
        const err = await dodajAliPosodobiVrstico(zapis);
        if (err) napak++; else dodanih++;
      }
    }

    let vodjaPosodobljenih = 0;
    if (vodjaPari.length > 0) {
      const { data: hrVrstice } = await client.from("profile_hr_details")
        .select("profile_id, employee_code").not("employee_code", "is", null);
      const sifraNaProfil = {};
      (hrVrstice || []).forEach(r => { sifraNaProfil[r.employee_code] = r.profile_id; });
      for (const par of vodjaPari) {
        const vodjaProfilId = sifraNaProfil[par.vodjaSifra];
        // Preskoči, če šifra vodje ne pripada nikomur z računom v aplikaciji
        // (npr. direktor izven Službe za ZN) ali bi oseba postala sama sebi
        // vodja (napaka v izvoru).
        if (!vodjaProfilId || vodjaProfilId === par.profileId) continue;
        const { error } = await client.from("profiles").update({ vodja_id: vodjaProfilId }).eq("id", par.profileId);
        if (!error) vodjaPosodobljenih++;
      }
    }

    setUvozMsg(`${posodobljenih} že registriranih posodobljenih neposredno`
      + (vodjaPosodobljenih ? ` (od tega ${vodjaPosodobljenih} z nastavljenim neposrednim vodjo)` : "")
      + `, ${dodanih} novih dodanih/posodobljenih v seznamu za uvoz`
      + (napak ? `, ${napak} preskočenih (manjkajo obvezna polja ali napaka).` : "."));
    nalozi();
    onSpremenjeno();
  };

  const STOLPCI = ["full_name","email","phone","role","department_code"];
  const GLAVE = ["full_name","ime"];

  // Prebere surove vrstice v vrstice-objekte: najprej poskusi prepoznati
  // glavo po imenu (poljuben vrstni red, tudi uraden HR izvoz z več stolpci),
  // če ne prepozna NOBENEGA stolpca pa pade nazaj na preprosto pozicijsko
  // obliko full_name,email,phone,role,department_code (brez/z glavo).
  const vVrsticeObjekteSplosno = (vrsteVrstic) => {
    const { objekti, najdeniStolpci } = window.ImportUtils.vVrsticeObjekteGlave(vrsteVrstic, GLAVE_MAPA);
    if (najdeniStolpci.length > 0) return objekti;
    return window.ImportUtils.vVrsticeObjekte(vrsteVrstic, STOLPCI, GLAVE);
  };

  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null); setPdfBesedilo(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") {
        // PDF nima zanesljivih stolpcev (glej opombo v import-utils.js) — samo
        // izvlečemo golo besedilo in ga damo v urejljivo polje spodaj, admin
        // ga preoblikuje v CSV vrstice in klikne "Uvozi urejeno besedilo".
        setPdfBesedilo(vrsteVrstic.map(v => v[0]).join("\n"));
        setUvozMsg(`Iz PDF-ja izvlečenih ${vrsteVrstic.length} vrstic golega besedila — preveri/uredi spodaj v obliko "full_name,email,phone,role,department_code" pred uvozom.`);
      } else {
        await uvoziVrsticeObjekte(vVrsticeObjekteSplosno(vrsteVrstic));
      }
    } catch (e) {
      setUvozMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziIzGoogleSheet = async () => {
    if (!gsheetUrl.trim()) return;
    setUvozBusy(true); setUvozMsg(null);
    try {
      const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(gsheetUrl.trim());
      await uvoziVrsticeObjekte(vVrsticeObjekteSplosno(vrsteVrstic));
    } catch (e) {
      setUvozMsg("Napaka pri branju Google Sheets: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziUrejenoPdfBesedilo = async () => {
    if (!pdfBesedilo) return;
    setUvozBusy(true);
    try {
      const vrsteVrstic = window.ImportUtils.csvBesedilaVVrstice(pdfBesedilo);
      await uvoziVrsticeObjekte(vVrsticeObjekteSplosno(vrsteVrstic));
      setPdfBesedilo(null);
    } catch (e) {
      setUvozMsg("Napaka pri uvozu: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const dodajRocno = async () => {
    const zapis = vrsticaVZapis(novo);
    if (!zapis) return;
    setDodajBusy(true);
    const obstojeci = osebe.find(o => (o.email || "").toLowerCase() === zapis.email.toLowerCase());
    const err = obstojeci ? await prenesiPodatkeNaProfil(zapis, obstojeci.id) : await dodajAliPosodobiVrstico(zapis);
    setDodajBusy(false);
    if (!err) {
      setNovo(PRAZEN_NOV); nalozi();
      if (obstojeci) onSpremenjeno();
    }
    else alert(err.message || String(err));
  };

  const odstraniUvoz = async (id) => {
    if (!confirm("Odstranim to vrstico iz seznama za uvoz?")) return;
    const { error } = await client.from("contact_imports").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    nalozi();
  };

  const poveziZProfilom = async (uvoz, profileId) => {
    if (!profileId) return;
    const err = await prenesiPodatkeNaProfil(uvoz, profileId);
    if (err) { alert(err.message); return; }
    const { error } = await client.from("contact_imports").update({ linked_profile_id: profileId }).eq("id", uvoz.id);
    if (error) { alert(error.message); return; }
    nalozi();
    onSpremenjeno();
  };

  if (uvozi === null) return <p className="hint">Nalagam …</p>;
  const nepovezani = uvozi.filter(u => !u.linked_profile_id);

  return (
    <div className="no-print">
      <h2 className="section">Uvoz zaposlenih (admin)</h2>
      <p className="hint">
        Naloži seznam vseh zaposlenih. Če je oseba že registrirana (e-pošta se ujema), se telefon in HR podatki
        (rojstni datum, delovno mesto, vodja, starševsko varstvo, letni dopust, stanje dopusta) posodobijo NANJO
        TAKOJ, brez ročnega koraka — tudi če jih uvoziš znova čez mesec z novo tabelo (npr. posodobljeno stanje
        dopusta). Če oseba še ni registrirana, gre v spodnji seznam "Še ne povezani" in jo povežeš ročno, ko se
        prijavi. HR podatke vidi samo ta oseba sama in admin — nikoli vodja ali drugi.
      </p>
      <div className="card">
        <RazporedUvozVir ikona="📇" naziv="Imenik zaposlenih"
          opis="CSV / Excel / JSON — kadrovski izvoz"
          onClick={() => fileRef.current && fileRef.current.click()} />
        <input ref={fileRef} type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}}
          onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
        <button className="submitBtn" disabled={uvozBusy} onClick={() => fileRef.current && fileRef.current.click()}>
          {uvozBusy ? "Nalagam …" : "📤 Uvoz iz datoteke (CSV / Excel / PDF)"}
        </button>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>
          Datoteka mora imeti glavo (prva vrstica z imeni stolpcev) — prepozna tako preprosto obliko
          (<code>full_name,email,phone,role,department_code</code>) kot uraden HR izvoz v slovenščini ("Priimek in
          ime", "Elektronska pošta", "Datum rojstva", "Naziv delovnega mesta", "Vodja (naziv)", "Starševsko varstvo",
          "Letni dopust 2026 (skupaj)" …) — vrstni red stolpcev ni pomemben. Oddelek se, če ni izrecnega stolpca,
          poskusi razbrati iz "Naziv enote organizacijske strukture" (samo za 6 negovalnih oddelkov). PDF nima
          zanesljivih stolpcev, zato se iz njega samo izvleče golo besedilo — uredi ga spodaj v isto obliko pred
          uvozom.
        </p>
        <div className="field" style={{marginTop:10}}>
          <label>… ali povezava do Google Sheets (deljeno kot "vsak, ki ima povezavo, lahko ogleda")</label>
          <div style={{display:"flex", gap:8}}>
            <input type="url" value={gsheetUrl} onChange={e => setGsheetUrl(e.target.value)}
              placeholder="https://docs.google.com/spreadsheets/d/..." style={{flex:1}} />
            <button className="submitBtn" disabled={uvozBusy || !gsheetUrl.trim()} onClick={uvoziIzGoogleSheet}>Uvozi</button>
          </div>
        </div>
        {pdfBesedilo !== null && (
          <div className="field" style={{marginTop:10}}>
            <label>Golo besedilo iz PDF — preoblikuj v vrstice "full_name,email,phone,role,department_code" (ena oseba na vrstico)</label>
            <textarea rows={10} value={pdfBesedilo} onChange={e => setPdfBesedilo(e.target.value)} style={{width:"100%", fontFamily:"monospace"}} />
            <button className="submitBtn" style={{marginTop:8}} disabled={uvozBusy} onClick={uvoziUrejenoPdfBesedilo}>Uvozi urejeno besedilo</button>
          </div>
        )}
        {uvozMsg && <p className="okMsg">{uvozMsg}</p>}
      </div>

      <div className="card">
        <p className="hint" style={{marginTop:0}}>Ali dodaj eno osebo ročno:</p>
        <div className="field"><label>Priimek in ime</label><input type="text" placeholder="npr. Rozman Anka" value={novo.full_name} onChange={e => setNovo(n => ({...n, full_name:e.target.value}))} /></div>
        <div className="field"><label>E-pošta</label><input type="email" value={novo.email} onChange={e => setNovo(n => ({...n, email:e.target.value}))} /></div>
        <div className="field"><label>Telefon</label><input type="tel" value={novo.phone} onChange={e => setNovo(n => ({...n, phone:e.target.value}))} /></div>
        <div className="field"><label>Vloga</label>
          <select value={novo.role} onChange={e => setNovo(n => ({...n, role:e.target.value}))}>
            <option value="user">Zaposleni</option><option value="vodja">Vodja ekipe</option><option value="admin">Administrator</option>
          </select>
        </div>
        <div className="field"><label>Oddelek</label>
          <select value={novo.department_code} onChange={e => setNovo(n => ({...n, department_code:e.target.value}))}>
            <option value="">— brez —</option>
            {oddelki.map(o => <option key={o.code} value={o.code}>{o.name}</option>)}
          </select>
        </div>
        <details>
          <summary style={{cursor:"pointer", fontSize:12.5, color:"var(--muted)", fontWeight:700, marginBottom:8}}>
            + Dodatni HR podatki (neobvezno — po povezavi vidna samo osebi in adminu)
          </summary>
          <div className="field"><label>Šifra zaposlenega</label><input type="text" value={novo.employee_code} onChange={e => setNovo(n => ({...n, employee_code:e.target.value}))} /></div>
          <div className="field"><label>Datum rojstva</label><input type="date" value={novo.birth_date} onChange={e => setNovo(n => ({...n, birth_date:e.target.value}))} /></div>
          <div className="field"><label>Naziv delovnega mesta</label><input type="text" value={novo.position_name} onChange={e => setNovo(n => ({...n, position_name:e.target.value}))} /></div>
          <div className="field"><label>Vodja (naziv)</label><input type="text" value={novo.manager_name} onChange={e => setNovo(n => ({...n, manager_name:e.target.value}))} /></div>
          <div className="field"><label>Starševsko varstvo</label><input type="text" value={novo.parental_leave} onChange={e => setNovo(n => ({...n, parental_leave:e.target.value}))} /></div>
          <div className="field"><label>Letni dopust 2026 (skupaj)</label><input type="number" value={novo.annual_leave_total} onChange={e => setNovo(n => ({...n, annual_leave_total:e.target.value}))} /></div>
          <div className="field"><label>Stanje dopusta (preostanek, dni)</label><input type="number" value={novo.leave_balance_days} onChange={e => setNovo(n => ({...n, leave_balance_days:e.target.value}))} /></div>
          <div className="field"><label>Stanje na dan</label><input type="date" value={novo.leave_balance_asof} onChange={e => setNovo(n => ({...n, leave_balance_asof:e.target.value}))} /></div>
        </details>
        <button className="submitBtn" onClick={dodajRocno} disabled={dodajBusy}>{dodajBusy ? "Dodajam …" : "+ Dodaj v seznam za uvoz"}</button>
      </div>

      <h2 className="section">Še ne povezani ({nepovezani.length})</h2>
      {nepovezani.length === 0 && <p className="empty">Vsi uvoženi zapisi so povezani z registriranimi profili.</p>}
      {nepovezani.map(u => {
        const ujemanje = osebe.find(o => (o.email || "").toLowerCase() === (u.email || "").toLowerCase());
        return (
          <div className="card" key={u.id}>
            <div className="person" style={{cursor:"default"}}>
              <div className="av">{initials(u.full_name)}</div>
              <div className="info" style={{cursor:"default"}}>
                <div className="name">{u.full_name}</div>
                <div className="meta"><span className="pill pending">še ni registriran</span><span>{u.email}</span></div>
                {(u.position_name || u.manager_name) && (
                  <div className="meta">{[u.position_name, u.manager_name && ("vodja: " + u.manager_name)].filter(Boolean).join(" · ")}</div>
                )}
              </div>
            </div>
            {ujemanje ? (
              <p className="hint" style={{margin:"8px 0"}}>
                Ujema se z že registriranim profilom <b>{ujemanje.full_name}</b> (ista e-pošta).
                <button className="iconBtn" style={{marginLeft:8}} onClick={() => poveziZProfilom(u, ujemanje.id)}>Poveži</button>
              </p>
            ) : (
              <div className="field" style={{marginTop:8}}>
                <label>Ali ročno poveži z obstoječim profilom (če se e-pošta ne ujema natančno)</label>
                <select defaultValue="" onChange={e => e.target.value && poveziZProfilom(u, e.target.value)}>
                  <option value="">Izberi profil …</option>
                  {osebe.map(o => <option key={o.id} value={o.id}>{o.full_name} ({o.email})</option>)}
                </select>
              </div>
            )}
            <button className="dangerBtn" onClick={() => odstraniUvoz(u.id)}>Odstrani iz seznama za uvoz</button>
          </div>
        );
      })}
    </div>
  );
}

// ---------------------------------------------------------------------
// Zbirni pregled stanja dopusta (admin) — kontrolni seznam, razdelek 7:
// doslej je bilo stanje dopusta vidno samo po posamezniku (na njegovem
// profilu), tu je zbrano na enem mestu za vse. Bere isti profile_hr_details
// vir, ki ga PR #15 že polni/posodablja ob uvozu HR podatkov.
// ---------------------------------------------------------------------
// Mesečna razpredelnica stanja po osebah — kdo je na dani dan na delu, na
// dežurstvu, na dopustu, na bolniški ali prost. Uporabnikova izrecna
// zahteva: pet stanj, en pogled, brez brskanja po posameznih profilih.
//
// Podatki pridejo iz DVEH virov, ki se dopolnjujeta:
//   - schedule_entries: objavljen razpored (izmena ali dežurstvo);
//   - leave_entries: barvna razpredelnica Želje (letni dopust, bolniška,
//     študijski dopust) - ta pokriva tudi ljudi, ki objavljenega razporeda
//     po osebi nimajo (NZV/vodje).
// Kjer je za isti dan oboje, ima razpored prednost (dežurstvo/izmena je
// dejansko opravljeno delo), razen odsotnosti, ki so izrecnejše od
// privzete prisotnosti.
// Pet stanj, po katerih so kratice razvrščene v legendi (uporabnikova
// zahteva iz prejšnjega kroga). Barva celice zdaj pride iz KRATICE, ne iz
// stanja - stanje ostane kot naslov skupine, da je legenda pregledna.
const STANJE_BARVA = {
  delo:     { oznaka: "D",   naziv: "Na delu",    barva: "#4F9B6B" },
  dezurstvo:{ oznaka: "DEŽ", naziv: "Dežurstvo",  barva: "#B3402A" },
  dopust:   { oznaka: "LD",  naziv: "Dopust",     barva: "#E06666" },
  bolniska: { oznaka: "BS",  naziv: "Bolniška",   barva: "#3F8F86" },
  prosto:   { oznaka: "",    naziv: "Prosto / ni v razporedu", barva: "#D8D2BE" },
};

// URADNA legenda kratic - stolpec "kratica za aplikacijo" v delovnik.xlsx
// ("Razpored delovnega časa - Služba za ZN in oskrbo", veljavnost od
// 1. 7. 2022). Kratice so največ 3 znaki; edina izjema je DF12
// (Dnevna 12 (7-19)), ki ima po dogovoru 4.
//
// Časi so vzeti iz LEGENDE na DNU datoteke, ne iz stolpca "Prisotnost" v
// sredinski tabeli: pri N12/D12/DF12 sta si zapisa nasprotovala (videti je,
// kot da so se vrstice zamaknile za eno), spodnja legenda pa je sama s
// seboj skladna - nočna izmena je res ponoči, "(7-19)" je res 07:00-19:00 -
// in se ujema z vrstico za pripravnike. Uporabnik je to izbiro potrdil.
//
// Vrstni red JE pomemben: prvo ujemanje obvelja, zato daljše/bolj določne
// kode stojijo pred krajšimi ("DNEVNA12F" pred "DNEVNA12", "NOČNA12" in
// "NOČNA od 19" pred "NOČNA", "popoldan do 19" pred "popoldan").
//
// Zapis: [vzorec, kratica, naziv, delovni čas, barva, stanje]
const IZMENA_KRATICE = [
  [/^dežurstvo|^dezurstvo/,  "DEŽ",  "Dežurstvo (NZV)",         "PON-PET 15:30-07:00 · SO/NE in prazniki 07:00-07:00", "#B3402A", "dezurstvo"],
  // "DNEVNA12 (7-19)" je v predlogi zapisana tudi tako (49-krat v
  // 2026_SMS_RAZPORED); MORA stati pred /^dnevna12/, sicer pade na D12,
  // kar je DRUGA izmena (05:50-18:00 namesto 07:00-19:00).
  [/^dnevna12\(7-19\)|^dnevna12f/, "DF12", "Dnevna 12 (7-19)",  "SO/NE in prazniki 07:00-19:00", "#B49BD0", "delo"],
  [/^dnevna12/,              "D12",  "Dnevna 12",               "SO/NE in prazniki 05:50-18:00", "#8560A8", "delo"],
  [/^nočna12|^nocna12/,      "N12",  "Nočna 12",                "SO/NE in prazniki 17:50-06:00", "#2F4785", "delo"],
  [/^nočnaod19|^nocnaod19|^nočna11|^nocna11/, "N11", "Nočna 11 (od 19)", "PON-PET 18:50-06:00", "#7C90CE", "delo"],
  [/^nočna|^nocna/,          "N10",  "Nočna",                   "PON-PET 20:50-06:00", "#4A67B0", "delo"],
  [/^popoldando19/,          "PO5",  "Popoldan do 19",          "PON-PET 13:50-19:00", "#E8A867", "delo"],
  // "popoldan do 20" (10x v 2026_SMS_RAZPORED_2) je v uradni legendi NI.
  // Uporabnik je potrdil novo kratico po istem vzorcu kot obstoječi dve:
  // PO5 = 5 ur (do 19), PO6 = 6 ur (do 20), PO7 = 7 ur (do 21).
  [/^popoldando20/,          "PO6",  "Popoldan do 20",          "PON-PET 13:50-20:00", "#D98E4E", "delo"],
  // Omejen delovni čas (zdravstvena/zakonska omejitev na 4 oz. 6 ur na
  // dan). Vzorec /^dop\D*6/ ujame zapise kot "dopoldan (6h)",
  // "dopoldan 6 ur", "dop. 6h" - ne ujame pa "dop. 7.h-13.h" ali
  // "dopoldan (7-15h)", ker \D* ne more preskočiti števke.
  // MORA stati pred splošnima /^dopoldan/ in /^popoldan/.
  [/^dop\D*6/,               "DO6",  "Dopoldan 6 ur",           "omejitev 6 ur/dan", "#63B588", "delo"],
  [/^dop\D*4/,               "DO4",  "Dopoldan 4 ure",          "omejitev 4 ur/dan", "#A7DCC0", "delo"],
  [/^pop\D*4/,               "PO4",  "Popoldan 4 ure",          "omejitev 4 ur/dan", "#F0C08A", "delo"],
  [/^popoldan/,              "PO7",  "Popoldan",                "PON-PET 13:50-21:00", "#C9713F", "delo"],
  // Delni FLEXI izmeni: v oddelčnih zavihkih preglednice sta zapisani kot
  // "dop. 7.h-13.h" in "pop. 14.h-20.h" (navzkrižno pokrivanje drugega
  // oddelka). Nista isti kot navadni DOP/PO7 - 14:00-20:00 ni 13:50-21:00 -
  // zato imata svoji kratici in svoji barvi.
  [/^dop7h?-?13/,            "DF7",  "Flexi dopoldne",          "07:00-13:00", "#2E7D5B", "delo"],
  [/^pop14h?-?20/,           "DP7",  "Flexi popoldne",          "14:00-20:00", "#A85A2A", "delo"],
  [/^do7|^dopoldan7/,        "DO7",  "Dopoldan (pripravnik)",   "PON-PET 07:00-14:00", "#8FCBA4", "delo"],
  // "PRISOTEN" je koda, ki jo aplikacija zapiše za NZV/vodje - to je po
  // uradni datoteki prva vrstica (DMS, PON-PET 07:00-15:00), torej DOP.
  // Ločene kratice "PRI" zato ni (uporabnikova izrecna zahteva).
  [/^dopoldan|^prisoten/,    "DOP",  "Dopoldan",                "PON-PET 05:50-14:00 · DMS/vodje 07:00-15:00", "#4F9B6B", "delo"],
  // "POMOČ DRUGJE" ni izmena iz uradne datoteke, ampak oznaka, ki jo
  // ustvari generator, kadar nekdo cel teden pomaga na drugem oddelku.
  // Oseba TA DAN dela, zato celica ne sme ostati prazna - prazen dan bi
  // pomenil, da jo koordinator lahko po nesreči razporedi še enkrat.
  [/^pomoč|^pomoc/,          "POM",  "Pomoč na drugem oddelku", "", "#C9A227", "delo"],
  [/^kpu/,                   "KPU",  "Koriščenje prostih ur",   "", "#B8B29C", "prosto"],
  [/^ld/,                    "LD",   "Letni dopust",            "", "#E06666", "dopust"],
  [/^por/,                   "POR",  "Porodniški dopust",       "", "#E8A0C8", "dopust"],
  [/^sti/,                   "STI",  "Strokovno izobraževanje", "", "#B4A7D6", "dopust"],
  [/^bs/,                    "BS",   "Bolniški stalež",         "", "#3F8F86", "bolniska"],
];

// Koda izmene (schedule_entries.shift_code) -> vrstica iz legende.
// Kode so v bazi prosto besedilo (uradne predloge jih pišejo različno:
// "NOČNA od 19h", "pop. 14.h-20.h", "DNEVNA12"), zato pred primerjavo
// odstranimo presledke in pike.
function izmenaVnos(sifra){
  const t = String(sifra || "").toLowerCase().replace(/[\s.]+/g, "");
  if (!t) return null;
  // "prost" se v predlogi pojavi kot izrecna beseda, pomeni pa isto kot
  // prazna celica - ne sme dobiti kratice "PRO", ki bi izgledala kot
  // neznana izmena.
  if (t === "prost" || t === "prosto") return null;
  for (let i = 0; i < IZMENA_KRATICE.length; i++) {
    if (IZMENA_KRATICE[i][0].test(t)) return IZMENA_KRATICE[i];
  }
  return null;
}

// Vrstica legende po kratici (za odsotnosti iz Želja, ki nimajo kode
// izmene - tam poznamo samo "LD"/"BS"/"STI").
function vnosPoKratici(kratica){
  for (let i = 0; i < IZMENA_KRATICE.length; i++) {
    if (IZMENA_KRATICE[i][1] === kratica) return IZMENA_KRATICE[i];
  }
  return null;
}

// Kratica za prikaz v celici. Neznana koda se NE izgubi: skrajša se na
// prve tri znake, da se vidi, da je tam nekaj vpisano - tiho prazna celica
// bi izgledala kot prost dan, kar je pri razporedu nevarno.
function izmenaKratica(sifra){
  const v = izmenaVnos(sifra);
  if (v) return v[1];
  if (jeProst(sifra)) return "";
  return String(sifra || "").trim().slice(0, 3).toUpperCase();
}

// "prost" v predlogi = prost dan, isto kot prazna celica.
function jeProst(sifra){
  const t = String(sifra || "").toLowerCase().replace(/[\s.]+/g, "");
  return t === "prost" || t === "prosto";
}

// Barva celice; neznana koda dobi nevtralno sivo, da se loči od znanih.
function izmenaBarva(sifra){
  const v = izmenaVnos(sifra);
  if (v) return v[4];
  return (String(sifra || "").trim() && !jeProst(sifra)) ? "#8B8672" : STANJE_BARVA.prosto.barva;
}

// Iz kode izmene izpelje eno od petih stanj. Vir je ista tabela kot za
// kratice, da stanje in barva ne moreta razhajati.
function stanjeIzKode(sifra){
  const v = izmenaVnos(sifra);
  if (v) return v[5];
  if (jeProst(sifra)) return "prosto";
  return String(sifra || "").trim() ? "delo" : "prosto";
}

// Bela ali temna pisava glede na svetlost podlage (ITU-R BT.601) - brez
// tega bi bila kratica na temni modri (N12) skoraj neberljiva.
function barvaBesedila(hex){
  const h = String(hex || "").replace("#", "");
  if (h.length < 6) return "#2B2717";
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#2B2717" : "#FFFFFF";
}

// leave_entries.kind -> kratica iz uradne legende. "omejitev" (rumena
// želja) NI odsotnost - oseba je na delu, le z omejitvijo - zato null.
const KIND_KRATICA = { ld: "LD", bs: "BS", sti: "STI", omejitev: null };

function StanjeRazpredelnica({ oddelki }){
  const [mesec, setMesec] = useState(() => new Date().toISOString().slice(0, 7));
  const [oddelek, setOddelek] = useState("");
  const [osebe, setOsebe] = useState(null);
  // "id|datum" -> { stanje, kratica, barva } - kratica in barva sta iz
  // uradne legende (IZMENA_KRATICE), stanje pa služi razvrstitvi v legendi.
  const [poDnevih, setPoDnevih] = useState({});
  // "id|datum" za dneve, ki jih je spremenila POTRJENA menjava. Sama izmena
  // je v schedule_entries že zamenjana (to naredi obrazec_potrdi_koordinator
  // v bazi), tu gre samo za vidno oznako, da se menjava tudi opazi.
  // Vidna je vsem zaposlenim in za vse mesece (pogled menjave_javno).
  const [menjani, setMenjani] = useState({});
  // Legenda je privzeto zložena: na telefonu je odprta zavzela skoraj cel
  // prvi zaslon in tabela je padla pod rob.
  const [legendaOdprta, setLegendaOdprta] = useState(false);

  const dnevi = useMemo(() => {
    const [y, m] = mesec.split("-").map(Number);
    const zadnji = new Date(y, m, 0).getDate();
    const out = [];
    for (let d = 1; d <= zadnji; d++) {
      const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dow = new Date(iso + "T00:00:00").getDay();
      out.push({ iso, dan: d, vikend: dow === 0 || dow === 6 });
    }
    return out;
  }, [mesec]);

  useEffect(() => {
    let cancelled = false;
    setOsebe(null); setPoDnevih({});
    const [y, m] = mesec.split("-").map(Number);
    const startISO = `${y}-${String(m).padStart(2, "0")}-01`;
    const endISO = `${y}-${String(m).padStart(2, "0")}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
    Promise.all([
      client.from("profiles").select("id, full_name, department_code").order("full_name"),
      // "profiles!employee_id" je nujno: schedule_entries ima več tujih
      // ključev na profiles, zato bi nedoločen vgnezden zapis PostgREST
      // zavrnil kot dvoumen (glej preveri-vgnezdeni-join.mjs).
      client.from("schedule_entries").select("employee_id, work_date, shift_code")
        .gte("work_date", startISO).lte("work_date", endISO),
      client.from("leave_entries").select("full_name, work_date, kind")
        .gte("work_date", startISO).lte("work_date", endISO),
      // Potrjene menjave - samo za oznako v celici. Beremo iz pogleda
      // menjave_javno (shema, sekcija 33), ne iz obrazci: RLS na obrazci
      // navadnemu uporabniku pokaže tuje menjave le za TEKOČI mesec, zato
      // je oznaka za druge mesece manjkala. Pogled izpostavi samo kdo/s
      // kom/katera dva dneva - brez opomb in razlogov iz obrazca - in
      // vsebuje izključno potrjene menjave.
      client.from("menjave_javno").select("vlagatelj_id, sodelavec_id, datum_a, datum_b")
        .or(`and(datum_a.gte.${startISO},datum_a.lte.${endISO}),and(datum_b.gte.${startISO},datum_b.lte.${endISO})`),
    ]).then(([{ data: profili }, { data: vpisi }, { data: odsotnosti }, { data: menjave }]) => {
      if (cancelled) return;
      const seznam = profili || [];
      setOsebe(seznam);
      const m2 = {};
      (vpisi || []).forEach(v => {
        m2[v.employee_id + "|" + v.work_date] = {
          stanje: stanjeIzKode(v.shift_code),
          kratica: izmenaKratica(v.shift_code),
          barva: izmenaBarva(v.shift_code),
          sifra: v.shift_code,
        };
      });
      // Odsotnosti se vpisujejo po IMENU (leave_entries nima employee_id),
      // zato jih povežemo prek imena; razpored ima prednost samo tam, kjer
      // je izmena/dežurstvo - odsotnost prepiše privzeto "delo".
      const poImenu = {};
      seznam.forEach(p => { poImenu[(p.full_name || "").trim().toUpperCase()] = p.id; });
      (odsotnosti || []).forEach(o => {
        const kratica = KIND_KRATICA[o.kind];
        if (!kratica) return;
        const id = poImenu[(o.full_name || "").trim().toUpperCase()];
        if (!id) return;
        const k = id + "|" + o.work_date;
        if (m2[k] && m2[k].stanje === "dezurstvo") return; // dežurstvo je dejansko opravljeno delo
        // Odsotnost iz Želja nima kode izmene, poznamo pa vrsto, zato jo
        // preslikamo v isto uradno kratico (LD / BS / STI).
        const vnos = vnosPoKratici(kratica);
        m2[k] = { stanje: vnos ? vnos[5] : "dopust", kratica, barva: vnos ? vnos[4] : "#E06666", sifra: kratica };
      });
      setPoDnevih(m2);

      const mm = {};
      (menjave || []).forEach(o => {
        if (o.vlagatelj_id && o.datum_a) mm[o.vlagatelj_id + "|" + o.datum_a] = true;
        if (o.sodelavec_id && o.datum_b) mm[o.sodelavec_id + "|" + o.datum_b] = true;
      });
      setMenjani(mm);
    });
    return () => { cancelled = true; };
  }, [mesec]);

  const prikazane = useMemo(() => {
    if (!osebe) return [];
    return oddelek ? osebe.filter(o => o.department_code === oddelek) : osebe;
  }, [osebe, oddelek]);

  return (
    <React.Fragment>
      <h2 className="section">Razpredelnica stanja</h2>
      <p className="hint" style={{marginTop:0}}>
        Kdo je na dani dan na delu, na dežurstvu, na dopustu, na bolniški ali prost. Združuje objavljen razpored in
        vpise iz Želja, vključno s <b>potrjenimi menjavami</b> za vse mesece (te so v razporedu že zamenjane, v celici pa označene z ↔).
        Kratice so uradne, iz dokumenta <i>Razpored delovnega časa</i> — vsaka ima svojo barvo, glej legendo spodaj.
      </p>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:10}}>
        <div className="field" style={{marginBottom:0, maxWidth:200}}>
          <label htmlFor="stanjeMesec">Mesec</label>
          <input id="stanjeMesec" type="month" value={mesec} onChange={e => setMesec(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0, maxWidth:220}}>
          <label htmlFor="stanjeOddelek">Oddelek</label>
          <select id="stanjeOddelek" value={oddelek} onChange={e => setOddelek(e.target.value)}>
            <option value="">Vsi oddelki</option>
            {(oddelki || []).map(o => <option key={o.code} value={o.code}>{o.code} — {o.name}</option>)}
          </select>
        </div>
      </div>

      {/* Legenda je privzeto zložena za gumbom "i", da tabela ostane na
          vrhu zaslona - na telefonu je zavzela skoraj cel prvi zaslon.
          Odprta je mreža z DVEMA stolpcema (kratica | razlaga), da so vse
          vrstice enako poravnane: kratica vedno prva in vedno enako
          široka, razlaga vedno na isti navpičnici. */}
      <div className="card" style={{marginBottom:10, padding:"10px 12px"}}>
        <button type="button" onClick={() => setLegendaOdprta(o => !o)}
          aria-expanded={legendaOdprta}
          style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none",
            padding:0, cursor:"pointer", font:"inherit", color:"inherit"}}>
          <span className="infoToggle" aria-hidden="true">i</span>
          <span style={{fontSize:12, fontWeight:700}}>Legenda kratic</span>
          <span style={{fontSize:11, color:"var(--muted)"}}>{legendaOdprta ? "skrij" : "pokaži"}</span>
        </button>

        {legendaOdprta && (
          <div className="infoPanel">
            {["delo", "dezurstvo", "dopust", "bolniska", "prosto"].map(skupina => {
              const vnosi = IZMENA_KRATICE.filter(v => v[5] === skupina);
              if (!vnosi.length) return null;
              return (
                <div key={skupina} style={{marginBottom:10}}>
                  <div style={{fontSize:11, color:"var(--muted)", marginBottom:4}}>{STANJE_BARVA[skupina].naziv}</div>
                  <div style={{display:"grid", gridTemplateColumns:"48px 1fr", gap:"5px 10px", alignItems:"baseline"}}>
                    {vnosi.map(([, kratica, naziv, cas, barva]) => (
                      <React.Fragment key={kratica}>
                        <b style={{background:barva, color:barvaBesedila(barva), borderRadius:4,
                          padding:"2px 0", fontSize:11, textAlign:"center", letterSpacing:".02em"}}>{kratica}</b>
                        <span style={{fontSize:12}}>
                          {naziv}
                          {cas ? <span style={{color:"var(--muted)"}}> · {cas}</span> : null}
                        </span>
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              );
            })}
            <div style={{fontSize:11, color:"var(--muted)", paddingTop:8, borderTop:"1px solid var(--line)"}}>
              Prazna celica = prost dan oz. oseba ta dan ni v razporedu. <b>Siva</b> celica pomeni kodo izmene, ki je ni
              v tej legendi — postavi kazalec nanjo za izvirni zapis. Kotna oznaka <b>↔</b> pomeni, da je bila
              izmena zamenjana s potrjeno menjavo. Vir kratic:
              <i> Razpored delovnega časa — Služba za ZN in oskrbo</i> (velja od 1. 7. 2022).
            </div>
          </div>
        )}
      </div>

      {osebe === null && <p className="hint">Nalagam …</p>}
      {osebe !== null && prikazane.length === 0 && <p className="hint">Za izbrani oddelek ni oseb.</p>}
      {osebe !== null && prikazane.length > 0 && (
        <div className="tableScroller">
          <table className="wardTable">
            <thead>
              <tr>
                <th className="name">Zaposleni</th>
                {dnevi.map(d => (
                  <th key={d.iso} style={d.vikend ? {color:"var(--pop)"} : null}>{d.dan}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {prikazane.map(o => (
                <tr key={o.id}>
                  <td className="name">{o.full_name}</td>
                  {dnevi.map(d => {
                    const zapis = poDnevih[o.id + "|" + d.iso];
                    const kratica = zapis ? zapis.kratica : "";
                    const barva = zapis ? zapis.barva : STANJE_BARVA.prosto.barva;
                    const vnos = kratica ? vnosPoKratici(kratica) : null;
                    const zamenjano = !!menjani[o.id + "|" + d.iso];
                    const opis = vnos ? vnos[2] + (vnos[3] ? " · " + vnos[3] : "")
                      : (zapis ? zapis.sifra : "Prosto / ni v razporedu");
                    return (
                      <td key={d.iso}
                        title={`${o.full_name} · ${d.dan}. — ${opis}${zamenjano ? " (po potrjeni menjavi)" : ""}`}
                        style={{background: zapis ? barva : barva + "55", position:"relative",
                          textAlign:"center", fontSize:10, fontWeight:700,
                          color: zapis ? barvaBesedila(barva) : "#2B2717"}}>
                        {kratica}
                        {zamenjano && (
                          <span aria-hidden="true" style={{position:"absolute", top:0, right:1, fontSize:8,
                            lineHeight:1, opacity:.85}}>↔</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </React.Fragment>
  );
}

function DopustPregled({ oddelki }){
  const [vrstice, setVrstice] = useState(null);
  const [q, setQ] = useState("");

  useEffect(() => {
    client.from("profiles")
      .select("id, full_name, department_code, profile_hr_details(annual_leave_total, leave_balance_days, leave_balance_asof)")
      .order("full_name")
      .then(({ data }) => {
        setVrstice((data || []).map(p => {
          const hr = Array.isArray(p.profile_hr_details) ? p.profile_hr_details[0] : p.profile_hr_details;
          return {
            id: p.id, full_name: p.full_name, department_code: p.department_code,
            annual_leave_total: hr ? hr.annual_leave_total : null,
            leave_balance_days: hr ? hr.leave_balance_days : null,
            leave_balance_asof: hr ? hr.leave_balance_asof : null,
          };
        }));
      });
  }, []);

  const imeOddelka = useMemo(() => {
    const m = {}; oddelki.forEach(o => { m[o.code] = o.name; }); return m;
  }, [oddelki]);

  const filtrirano = useMemo(() => {
    if (!vrstice) return [];
    const s = q.trim().toLowerCase();
    if (!s) return vrstice;
    return vrstice.filter(v =>
      (v.full_name || "").toLowerCase().includes(s) ||
      (imeOddelka[v.department_code] || "").toLowerCase().includes(s)
    );
  }, [vrstice, q, imeOddelka]);

  const manjkaPodatek = filtrirano.filter(v => v.leave_balance_days == null).length;

  if (!vrstice) return <p className="hint">Nalagam …</p>;

  return (
    <React.Fragment>
      <div className="searchWrap no-print">
        <span className="ic">🔍</span>
        <input type="search" placeholder="Išči po imenu ali oddelku …" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <p className="hint no-print">
        {filtrirano.length} oseb{manjkaPodatek > 0 ? ` — ${manjkaPodatek} brez vnesenega stanja dopusta (dopolni ob uvozu HR podatkov ali ročno na profilu osebe)` : ""}.
      </p>
      <div className="card" style={{overflowX:"auto"}}>
        <table className="fairTable">
          <thead>
            <tr><th>Zaposleni</th><th>Oddelek</th><th>Letni dopust</th><th>Preostanek (dni)</th><th>Stanje na dan</th></tr>
          </thead>
          <tbody>
            {filtrirano.map(v => (
              <tr key={v.id}>
                <td>{v.full_name}</td>
                <td>{imeOddelka[v.department_code] || v.department_code || "—"}</td>
                <td>{v.annual_leave_total != null ? v.annual_leave_total : "—"}</td>
                <td>{v.leave_balance_days != null ? <b>{v.leave_balance_days}</b> : <span className="hint" style={{margin:0}}>ni podatka</span>}</td>
                <td>{v.leave_balance_asof || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </React.Fragment>
  );
}

// Pregled paraf — viden VSEM prijavljenim (izrecna zahteva uporabnika).
// Parafa je kratka oznaka, ki jo uradne predloge in NZV razpored
// uporabljajo namesto polnega imena; doslej jo je bilo mogoče videti samo
// posamično, na profilu ene osebe, in samo adminu.
//
// Pregled hkrati pokaže dve stvari, ki tiho lomita uvoz razporeda:
//   1. TRK - dve osebi imata isto parafo. Uvoz take oznake ne more
//      enolično pripisati osebi, zato jo (pravilno) zavrne in vpis
//      odpade; v poročilu se pokaže kot "parafa se ujema z več osebami".
//   2. IZPELJANA parafa - oseba nima izrecno nastavljene, zato se vzame
//      prve tri črke priimka. Prav to je najpogostejši vir trkov (dva
//      Pogačnika -> oba "POG").
function ParafePregled({ osebe }){
  // Parafa je vezana na DATUM razporeda (prenova z veljavnostjo od
  // 1.10.2026), ne na današnji dan - zato izbirnik meseca: pri uvozu
  // starejšega meseca velja stara parafa.
  const [mesec, setMesec] = useState(() => new Date().toISOString().slice(0, 7));
  const vrstice = useMemo(() => {
    return (osebe || []).map(o => ({
      oseba: o,
      parafa: window.Parafa.zaDatum(o, mesec),
      izpeljana: window.Parafa.jeIzpeljana(o, mesec),
    })).sort((a, b) => a.parafa.localeCompare(b.parafa, "sl") || a.oseba.full_name.localeCompare(b.oseba.full_name, "sl"));
  }, [osebe, mesec]);
  const trki = useMemo(() => window.Parafa.trki(osebe || [], mesec), [osebe, mesec]);
  const trkKljuci = Object.keys(trki);

  return (
    <React.Fragment>
      <h2 className="section">Parafe ({vrstice.length})</h2>
      <p className="hint" style={{marginTop:0}}>
        Kratka oznaka, ki jo razpored NZV in uradne predloge uporabljajo namesto polnega imena. Parafo lahko
        spremeni administrator na profilu osebe.
      </p>
      <div className="field" style={{maxWidth:220}}>
        <label htmlFor="parafaMesec">Velja za mesec</label>
        <input id="parafaMesec" type="month" value={mesec} onChange={e => setMesec(e.target.value)} />
      </div>

      {trkKljuci.length > 0 && (
        <div className="card" style={{borderColor:"var(--danger)", marginBottom:12}}>
          <b style={{color:"var(--danger)"}}>⚠ {trkKljuci.length} parafa/e pripada/jo več osebam</b>
          <p className="hint" style={{marginBottom:0}}>
            Uvoz razporeda take oznake ne more pripisati eni osebi, zato jo preskoči in vpis odpade
            (v poročilu uvoza se pokaže kot "parafa se ujema z več osebami"). Administrator naj vsaj eni od
            navedenih oseb nastavi drugačno parafo na njenem profilu.
          </p>
          <ul style={{margin:"8px 0 0", paddingLeft:18}}>
            {trkKljuci.sort().map(k => (
              <li key={k} style={{fontSize:13}}>
                <b>{k}</b> — {trki[k].map(o => o.full_name).join(", ")}
              </li>
            ))}
          </ul>
        </div>
      )}

      <div className="card" style={{padding:0}}>
        {vrstice.map(({ oseba, parafa, izpeljana }) => (
          <div key={oseba.id} style={{display:"flex", alignItems:"center", gap:12, padding:"9px 14px",
            borderBottom:"1px solid var(--line)"}}>
            <span style={{
              fontWeight:800, fontVariantNumeric:"tabular-nums", minWidth:52,
              color: trki[parafa.toUpperCase()] ? "var(--danger)" : "var(--text)",
            }}>{parafa}</span>
            <span style={{flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
              {oseba.full_name}
            </span>
            {izpeljana && <span className="pill muted" title="Ni izrecno nastavljena — izpeljana iz priimka">izpeljana</span>}
            {trki[parafa.toUpperCase()] && <span className="pill danger">trk</span>}
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function App(){
  const [auth, setAuth] = useState(null);
  const [osebe, setOsebe] = useState([]);
  const [cakajoce, setCakajoce] = useState([]); // še ne povezane osebe (contact_imports_public) — vidne VSEM, na izrecno željo
  const [oddelki, setOddelki] = useState([]);
  const [odprtId, setOdprtId] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [pogled, setPogled] = useState("seznam"); // "seznam" | "dopust" (slednje samo admin)
  const [napakaOsebe, setNapakaOsebe] = useState(null);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setAuth(res);
      const params = new URLSearchParams(location.search);
      if (params.get("id")) setOdprtId(params.get("id"));
    });
  }, []);

  useEffect(() => {
    if (!auth) return;
    client.from("profiles")
      .select("id, full_name, role, department_code, rotation_slot, vodja_id, is_koordinator, parafa, parafa_pred_oktobrom_2026, job_title, email, contact_phones(phone), profile_departments(department_code, sort_order)")
      .order("full_name")
      .then(({ data, error }) => {
        if (error) {
          console.error("Nalaganje seznama oseb ni uspelo:", error);
          // Najverjetnejši vzrok: manjka stolpec profiles.is_koordinator, ker
          // še ni bila pognana zadnja različica supabase/schema.sql v
          // Supabase SQL Editorju (dodan v PR "Menjava: enostopenjska
          // koordinatorska odobritev ..."). Brez preverjanja napake bi to
          // tiho izpraznilo cel seznam (data ostane undefined) - zato jasno
          // sporočilo namesto praznega imenika.
          setNapakaOsebe(
            "Nalaganje seznama oseb ni uspelo (" + (error.message || String(error)) + "). "
            + "Najverjetneje je treba v Supabase SQL Editorju znova pognati celoten supabase/schema.sql "
            + "(dodaja stolpec profiles.is_koordinator)."
          );
          return;
        }
        setNapakaOsebe(null);
        setOsebe((data || []).map(o => ({
          ...o,
          phone: Array.isArray(o.contact_phones) ? (o.contact_phones[0] && o.contact_phones[0].phone) : (o.contact_phones ? o.contact_phones.phone : null),
          dept_codes: (o.profile_departments || []).slice().sort((a, b) => a.sort_order - b.sort_order).map(d => d.department_code),
        })));
      });
    client.from("departments").select("code, name").in("code", VSI_DODELJIVI).order("code")
      .then(({ data }) => setOddelki(data || []));
    client.from("contact_imports_public").select("*").is("linked_profile_id", null).order("full_name")
      .then(({ data }) => {
        setCakajoce((data || []).map(u => ({
          id: u.id, full_name: u.full_name, role: u.role || "user",
          dept_codes: u.department_code ? [u.department_code] : [],
          email: u.email, phone: u.phone, pending: true,
          hr: {
            employee_code: u.employee_code, birth_date: u.birth_date, position_name: u.position_name,
            manager_name: u.manager_name, parental_leave: u.parental_leave,
            annual_leave_total: u.annual_leave_total, leave_balance_days: u.leave_balance_days,
            leave_balance_asof: u.leave_balance_asof,
          },
        })));
      });
  }, [auth, reloadKey]);

  const odpri = (id) => {
    setOdprtId(id);
    const url = new URL(location.href);
    url.searchParams.set("id", id);
    history.pushState(null, "", url);
  };
  const zapri = () => {
    setOdprtId(null);
    const url = new URL(location.href);
    url.searchParams.delete("id");
    history.pushState(null, "", url);
  };

  // POZOR: useMemo mora biti PRED "if (!auth) return null" spodaj — vse
  // kljuke (Hooks) se morajo klicati v enakem vrstnem redu na vsakem izrisu,
  // sicer React neha izrisovati sploh karkoli (bela stran) takoj, ko auth
  // preide iz null v nastavljeno (prej-in-po različno število klicanih
  // kljuk). To je bil pravi vzrok "Imenik sploh ne deluje, vse je belo".
  const vsi = useMemo(() => osebe.concat(cakajoce), [osebe, cakajoce]);

  if (!auth) return null;
  const { profile } = auth;
  const myId = auth.session.user.id;
  const myRole = profile ? profile.role : "user";
  const oseba = odprtId ? osebe.find(o => o.id === odprtId) : null;
  const cakajocaOseba = !oseba && odprtId ? cakajoce.find(o => o.id === odprtId) : null;

  return (
    <div className="wrap wide">
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout pred={<React.Fragment><RazporedUvozIkona/><RazporedOrodja/></React.Fragment>}/>
      <header className="top">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Imenik</span></div>
        <p className="sub">{profile ? profile.full_name : ""} · {RazporedAuth.ROLE_LABEL[myRole]}</p>
      </header>

      <p className="hint no-print">
        {myRole === "admin" && "Vidiš vse podatke vseh zaposlenih, vključno s telefonskimi številkami."}
        {myRole === "vodja" && "Vidiš e-pošto in telefonsko številko vseh zaposlenih."}
        {myRole === "user" && "Vidiš e-pošto vseh sodelavcev; telefonske številke vidita samo admin in vodja (razen tvoje lastne)."}
      </p>

      {napakaOsebe && <p className="err no-print">{napakaOsebe}</p>}

      {odprtId && oseba && (
        <Profil oseba={oseba} myId={myId} myRole={myRole} oddelki={oddelki} ogled={!!auth.ogled} onNazaj={zapri} onSpremenjeno={() => setReloadKey(k => k+1)} />
      )}
      {odprtId && cakajocaOseba && (
        <PendingProfil oseba={cakajocaOseba} myRole={myRole} oddelki={oddelki} onNazaj={zapri} />
      )}
      {odprtId && !oseba && !cakajocaOseba && vsi.length > 0 && (
        <div><button className="backlink no-print" onClick={zapri}>‹ Nazaj na imenik</button><p className="empty">Osebe ni bilo mogoče najti.</p></div>
      )}

      {/* Zavihka "Seznam" in "Parafe" sta na voljo VSEM prijavljenim
          (parafe na izrecno zahtevo uporabnika); "Stanje dopusta" ostaja
          samo adminu, ker prikazuje kadrovske podatke. */}
      {!odprtId && (
        <div className="tabs no-print" role="tablist" style={{marginBottom:14}}>
          <button role="tab" aria-selected={pogled==="seznam"} onClick={() => setPogled("seznam")}>Seznam</button>
          <button role="tab" aria-selected={pogled==="parafe"} onClick={() => setPogled("parafe")}>Parafe</button>
          <button role="tab" aria-selected={pogled==="stanje"} onClick={() => setPogled("stanje")}>Razpredelnica</button>
          {myRole === "admin" && (
            <button role="tab" aria-selected={pogled==="dopust"} onClick={() => setPogled("dopust")}>Stanje dopusta</button>
          )}
        </div>
      )}

      {!odprtId && pogled === "seznam" && (
        <React.Fragment>
          <Seznam osebe={vsi} oddelki={oddelki} onOdpri={odpri} />
          {myRole === "admin" && <DodajUporabnika oddelki={oddelki} onSpremenjeno={() => setReloadKey(k => k+1)} />}
          {myRole === "admin" && <AdminUvoz osebe={osebe} oddelki={oddelki} onSpremenjeno={() => setReloadKey(k => k+1)} />}
        </React.Fragment>
      )}

      {!odprtId && pogled === "parafe" && <ParafePregled osebe={osebe} />}

      {!odprtId && pogled === "stanje" && <StanjeRazpredelnica oddelki={oddelki} />}

      {!odprtId && pogled === "dopust" && myRole === "admin" && (
        <DopustPregled oddelki={oddelki} />
      )}

      <footer className="foot no-print">
        <p><b>Imenik.</b> Klik na osebo kjerkoli v aplikaciji te pripelje sem, na njen profil. E-pošto lahko kopiraš z gumbom, na telefonsko številko pa klikneš za klic.</p>
      </footer>

      <RazporedNav active="imenik" role={myRole} unread={0} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
