<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Želje · Begunje</title>
<meta name="theme-color" content="#FAF8F1" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="theme.css" />

<style>
  :root{
    --bg: #FAF8F1; --bg-grad: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2EEDF;
    --line: #E1D9C2; --text: #2B2712; --muted: #8A7F5E; --accent: #A79448; --accent-2: #6E5F2A; --accent-ink: #2B2712;
    --danger: #B3402A; --ok: #4C8C63;
    --radius: 16px; --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width: 720px; margin:0 auto; padding: 0 16px 60px; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  /* Ozadje mora biti NEPROSOJNO. Prej je bilo linear-gradient(... , transparent),
     zato je vsebina, ki je pri drsenju zašla pod spodnjih 22 % glave, prosvetila
     skozi njeno lastno besedilo (ime prijavljenega se je prekrivalo z besedilom
     strani). Mehak prehod je zdaj ločen element POD glavo. */
  header.top{ position:sticky; top:0; z-index:20; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  header.top::after{ content:""; position:absolute; left:0; right:0; top:100%; height:14px;
    background: linear-gradient(180deg, var(--bg), transparent); pointer-events:none; }
  .wordmark{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wordmark .logoSmall{ height:28px; width:auto; }
  .wordmark .mark{ font-weight:800; font-size:20px; letter-spacing:-0.02em; }
  .wordmark .tag{ font-size:11.5px; color:var(--accent-ink); background:var(--accent); font-weight:800;
    padding:2px 8px; border-radius:999px; }
  .sub{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  .backlink{ display:inline-block; margin: 8px 14px 0 0; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px; text-decoration-color:var(--line); }

  h2.section{ font-size:15px; font-weight:800; margin: 22px 0 4px; letter-spacing:-0.01em; }
  p.hint{ color:var(--muted); font-size:13px; margin: 4px 0 14px; line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  select, input[type=text], textarea{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius: var(--radius-sm); font-size:14.5px; width:100%; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  optgroup{ font-weight:800; }

  .fileRow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .fileBtn{ background: var(--surface-2); border:1px solid var(--line); color:var(--text); font-weight:700;
    padding:10px 14px; border-radius: var(--radius-sm); font-size:13px; cursor:pointer; flex:0 0 auto; }
  .fileBtn input{ display:none; }
  .thumbPreview{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--line); }
  .clearImg{ background:none; border:0; color:var(--danger); font-size:12px; cursor:pointer; text-decoration:underline; }

  .submitBtn{ margin-top:6px; width:100%; background: var(--accent); color: var(--accent-ink); border:0;
    padding:13px; border-radius: var(--radius-sm); font-weight:800; font-size:15px; cursor:pointer; }
  .submitBtn:disabled{ opacity:.5; cursor:default; }

  .toolRow{ display:flex; gap:8px; flex-wrap:wrap; margin: 14px 0; }
  .toolBtn{ background: transparent; border:1px solid var(--line); color:var(--text); font-weight:700;
    padding:8px 13px; border-radius:999px; font-size:12.5px; cursor:pointer; }
  .toolBtn input{ display:none; }

  .groupHead{ display:flex; align-items:baseline; gap:8px; margin: 20px 0 8px; }
  .groupHead .n{ font-weight:800; font-size:15px; }
  .groupHead .g{ font-size:11px; color:var(--muted); background:var(--surface-2); padding:2px 8px; border-radius:999px; }

  .entry{ background:var(--surface); border:1px solid var(--line); border-radius: var(--radius-sm); padding:12px 14px; margin-bottom:8px; }
  .entry .top2{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .entry .obdobje{ font-weight:700; font-size:13.5px; color: var(--accent-2); }
  .entry .datum{ font-size:11px; color: var(--muted); }
  .entry .opis{ font-size:13.5px; margin-top:6px; line-height:1.5; white-space:pre-wrap; }
  .entry img.thumb{ margin-top:8px; max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; }
  .delBtn{ background:none; border:0; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px; flex:0 0 auto; }
  .delBtn:hover{ color: var(--danger); }

  .empty{ color:var(--muted); font-size:13.5px; padding: 20px 0; text-align:center; }
  .err{ color:var(--danger); font-size:13px; margin-top:8px; }

  .modalOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:50; display:flex;
    align-items:center; justify-content:center; padding:20px; }
  .modalOverlay img{ max-width:100%; max-height:90vh; border-radius:8px; }

  footer.foot{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); padding:4px;
    border-radius: var(--radius-sm); margin: 14px 0; }
  .tabs button{ flex:1; border:0; background:transparent; color:var(--muted); padding:10px 10px;
    border-radius:8px; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }

  .penRow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
  .penHint{ font-size:12px; color:var(--muted); margin-right:2px; }
  .penBtn{ display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--surface);
    border-radius:999px; padding:6px 12px 6px 8px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text); }
  .penBtn.active{ border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(167,148,72,.22); }
  .penSwatch{ width:14px; height:14px; border-radius:5px; display:inline-block; border:1px solid rgba(0,0,0,.12); }
  .penBtn.eraser .penSwatch{ background:repeating-linear-gradient(45deg,#fff,#fff 3px,#eee 3px,#eee 6px); }

  .monthRow{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .monthNav{ display:flex; align-items:center; gap:8px; }
  .navBtn{ border:1px solid var(--line); background:var(--surface); border-radius:8px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--text); }
  .navBtn:hover{ background:var(--surface-2); border-color:var(--accent); }
  .monthLbl{ font-size:14.5px; font-weight:800; min-width:130px; text-align:center; }

  .gridScroll{ overflow:auto; max-height:66vh; border:1px solid var(--line); border-radius:var(--radius-sm); }
  table.grid{ border-collapse:separate; border-spacing:0; font-size:11.5px; min-width:100%; }
  table.grid thead th{ position:sticky; top:0; background:var(--surface); z-index:3; border-bottom:1px solid var(--line);
    padding:4px 2px; font-weight:700; color:var(--muted); text-align:center; min-width:24px; }
  table.grid thead tr.dnr th{ top:0; font-size:11px; padding-top:7px; }
  table.grid thead tr.dwr th{ top:22px; font-size:9px; text-transform:uppercase; padding-bottom:7px; color:var(--muted); }
  table.grid th.corner{ position:sticky; left:0; top:0; z-index:5; background:var(--surface); text-align:left; padding:6px 10px; min-width:140px; font-weight:800; color:var(--text); }
  table.grid th.we, table.grid td.we{ background: rgba(167,148,72,.10); }
  table.grid th.hol, table.grid td.hol{ background: rgba(179,64,42,.08); }
  table.grid th.tot{ position:sticky; top:0; z-index:3; min-width:44px; }
  table.grid tbody th.nm{ position:sticky; left:0; z-index:2; background:var(--surface); text-align:left; padding:5px 10px;
    font-weight:700; color:var(--text); border-right:1px solid var(--line); white-space:nowrap; font-size:12px; }
  table.grid tbody tr:nth-child(even) th.nm{ background:var(--surface-2); }
  table.grid tbody tr:nth-child(even) td.tot{ background:var(--surface-2); }
  table.grid td.cell{ width:24px; height:22px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); cursor:pointer; }
  table.grid td.cell:hover{ outline:2px solid var(--accent-2); outline-offset:-2px; }
  table.grid td.tot{ text-align:center; color:var(--muted); font-weight:700; border-bottom:1px solid var(--line); }

  table.grid tr.oddGroup th.oddGroupLbl{ position:sticky; left:0; top:44px; z-index:4; background:var(--surface-2);
    text-align:left; padding:6px 10px; font-weight:800; font-size:11.5px; color:var(--accent-2);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line); white-space:nowrap; }

  /* Spletna/namizna različica (≥900px, isti prag kot nav.js top-nav): mreža
     naj pokaže VSE dni meseca brez vodoravnega drsenja - tabela dobi
     table-layout:fixed in polno širino vsebnika, dnevni stolpci si
     enakomerno razdelijo preostali prostor (po odštetju stalnih stolpcev
     imena/oddelka in "LD dni"). Na ožjih zaslonih (telefon/tablica) ostane
     prvotno vodoravno drsenje z minimalno širino celice. */
  @media (min-width: 900px){
    .wrap.wide{ max-width: 1320px; }
    .gridScroll{ overflow-x:visible; }
    table.grid{ width:100%; table-layout:fixed; }
    table.grid th.corner{ width:170px; min-width:0; }
    table.grid th.tot, table.grid td.tot{ width:50px; min-width:0; }
    table.grid thead th{ min-width:0; }
    table.grid td.cell{ width:auto; }
  }

  /* Preklop Mreža/Po dnevih — "Po dnevih" je prilagojen telefonu: en dan
     naenkrat, kartice namesto ozkih stolpcev, urejanje prek spodnjega
     drsnega menija (sheet) namesto tapkanja po majhnih celicah. */
  .viewToggle{ display:flex; gap:8px; margin: 4px 0 10px; }
  .viewToggle button{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-weight:700;
    padding:8px; border-radius:var(--radius-sm); font-size:12.5px; cursor:pointer; }
  .viewToggle button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .dayNav{ display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0; }
  .dayNav .dayLbl{ font-weight:800; font-size:15px; min-width:170px; text-align:center; }
  .dayNav .dayLbl .dow{ color:var(--muted); font-weight:700; font-size:12px; margin-left:6px; }
  .dayCards{ display:flex; flex-direction:column; gap:8px; }
  .dayCard{ display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; width:100%; font-family:inherit; }
  .dayCard .pill{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; color:#2A1608; }

  .sheetOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; display:flex; align-items:flex-end; }
  .sheet{ background:var(--surface); width:100%; border-radius:18px 18px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:80vh; overflow-y:auto; }
  .sheetHandle{ width:40px; height:4px; background:var(--line); border-radius:999px; margin:0 auto 12px; }
  .sheetGrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .sheetOpt{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:10px; font-size:13px; font-weight:700; color:var(--text); cursor:pointer; font-family:inherit; }
  .sheetOpt .dot{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .sheetOpt.active{ outline:2px solid var(--accent-2); outline-offset:-2px; }
  .sheetOpt.erase{ grid-column:1 / -1; background:transparent; color:var(--danger); }
  .sheetOpt:disabled{ opacity:.4; cursor:not-allowed; }

  .logList{ list-style:none; margin:0; padding:0; max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; }
  .logList li{ padding:7px 11px; font-size:12px; border-bottom:1px solid var(--surface-2); color:var(--text); }
  .logList li:last-child{ border-bottom:0; }
  .logList li .t{ color:var(--muted); font-weight:700; margin-right:5px; }
  .logList li .who{ color:var(--accent-2); font-weight:800; }

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    /* Razpredelnica (koledar) gre na 1 A4 stran ne glede na dni v mesecu/
       število osebja — PrintFit.natisni izračuna --print-scale; "zoom" (ne
       transform) dejansko zmanjša zaseden prostor za pravilen izračun. */
    .gridScroll{ overflow:visible !important; max-height:none !important; border:none !important;
      zoom: var(--print-scale, 1); }
    table.grid thead th, table.grid th.corner, table.grid tbody th.nm, table.grid td.tot{ position:static !important; }
    table.grid tr{ break-inside:avoid; page-break-inside:avoid; }
  }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------------------------------------------------------------------
// Skupni seznam vseh zaposlenih (za Razpredelnico dopusti/omejitve in za
// Seznam želja) — oddelki za kreiranje/generiranje razporeda so na
// izrecno željo omejeni na natanko teh 8: B/C/C1/D/E1/E2/FLEXI za vse z
// vlogo "user" (razvrščeni po primarnem oddelku, ki šteje za generator
// razporeda), in NZV za vse z vlogo "vodja" ali "admin" (ne glede na
// njihov department_code — NZV vključuje tudi dežurstva, glej admin.html
// zavihek "NZV"). Stare kode oddelkov (DEZ, NEDEZ, PDZN, SOBO, ZO, MO, PO,
// A, B1B2, DB, SA, URGENCA, U2) tu niso več uporabljene.
// ---------------------------------------------------------------------
const RAZPOREDNICA_ODDELKI = [
  ["B", "B - oddelek (SMS/TZN)"],
  ["C", "C - oddelek (SMS/TZN)"],
  ["C1", "C1 - oddelek (SMS/TZN)"],
  ["D", "D - oddelek (SMS/TZN)"],
  ["E1", "E1 - oddelek (SMS/TZN)"],
  ["E2", "E2 - oddelek (SMS/TZN)"],
  ["FLEXI", "FLEXI — plavajoče osebje"],
  ["NZV", "NZV — vodje in administratorji"],
];

async function nalozizRoster(){
  const { data, error } = await RazporedAuth.client
    .from("profiles").select("full_name, role, department_code")
    .order("full_name");
  if (error) throw error;
  const skupine = RAZPOREDNICA_ODDELKI.map(([koda, naziv]) => ({ koda, naziv, ljudje: [] }));
  const poKodi = Object.fromEntries(skupine.map(s => [s.koda, s]));
  (data || []).forEach(p => {
    const koda = (p.role === "vodja" || p.role === "admin") ? "NZV" : p.department_code;
    if (koda && poKodi[koda]) poKodi[koda].ljudje.push(p.full_name);
  });
  const vsiLjudje = skupine.reduce((acc, g) => acc.concat(g.ljudje.map(ime => ({ ime, skupina: g.naziv }))), []);
  return { skupine, vsiLjudje };
}

// Pomanjša sliko na največ 1600 px in jo pretvori v JPEG — telefonske
// fotografije so sicer lahko več MB, kar bi bazo po nekaj vnosih napihnilo.
function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------------------------------------------------------------------
// Razpredelnica dopustov/omejitev — barvna, po dnevih, vezana na Supabase
// (leave_entries). Nadomešča prejšnji ročni vnos "2026-09-01, 2026-09-02"
// v admin.html: koordinator tu klikne/povleče čez dneve, generator
// dežurstev pa te vnose samodejno prebere (glej admin.html "Osveži iz Želje").
// ---------------------------------------------------------------------

const PEN_META = {
  omejitev: { label: "Omejitev", barva: "#FFD966" },
  ld: { label: "LD (dopust)", barva: "#E06666" },
  bs: { label: "BS (bolniška)", barva: "#93C47D" },
  sti: { label: "STI (štud. dopust)", barva: "#B4A7D6" },
};
const DOW_SL = ["NED","PON","TOR","SRE","ČET","PET","SOB"];
const MESECI_SL = ["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];

function easterSunday(year){
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
const FIXED_HOLIDAYS = [
  [1,1],[1,2],[2,8],[4,27],[5,1],[5,2],[6,25],[8,15],[10,31],[11,1],[12,25],[12,26],
];
const holidayCache = {};
function holidaySetFor(year){
  if (holidayCache[year]) return holidayCache[year];
  const set = new Set(FIXED_HOLIDAYS.map(([m,d]) => m+"-"+d));
  const es = easterSunday(year);
  set.add((es.getMonth()+1)+"-"+es.getDate());
  const em = new Date(es); em.setDate(es.getDate()+1);
  set.add((em.getMonth()+1)+"-"+em.getDate());
  holidayCache[year] = set;
  return set;
}
function jeDanPraznik(y,m,d){ return holidaySetFor(y).has((m+1)+"-"+d); }
function danovVMesecu(y,m){ return new Date(y,m+1,0).getDate(); }
function dowZa(y,m,d){ return DOW_SL[new Date(y,m,d).getDay()]; }
function jeVikend(y,m,d){ const l = dowZa(y,m,d); return l==="SOB"||l==="NED"; }
function pad2(n){ return String(n).padStart(2,"0"); }
function isoZa(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }

// Slovenska sklanjatev za število (dvojina/množina): 1 vnos, 2 vnosa, 3-4 vnosi, 5+ vnosov.
function steviloVnosov(n){
  if (n === 1) return "vnos";
  if (n === 2) return "vnosa";
  if (n === 3 || n === 4) return "vnosi";
  return "vnosov";
}

function normalizirajIme(s){ return (s||"").trim().toUpperCase().replace(/\s+/g," "); }
function imenaSeUjemata(a, b){
  // Primerja kot "vrečo besed" (ne glede na vrstni red) — roster uporablja
  // "PRIIMEK IME" (npr. "MAVRI TRATNIK MAGDALENA"), profiles.full_name pa
  // karkoli je oseba vpisala ob registraciji (npr. "Magdalena Mavri Tratnik").
  const na = normalizirajIme(a), nb = normalizirajIme(b);
  if (!na || !nb) return false;
  return na.split(" ").sort().join(" ") === nb.split(" ").sort().join(" ");
}

// ---------------------------------------------------------------------
// Uvoz barvnega koledarja odsotnosti (Kadris) — glej uvoziBarvniExcel spodaj.
// Nekateri oddelki v profiles.full_name uporabljajo okrajšano ime ("VREVC M."), Kadris
// pa vedno polno ("VREVC MARJETA"), zato navadno imenaSeUjemata (vreča
// besed, cele besede) tu ne zadošča — beseda z "." na koncu šteje kot
// ujemanje po prvih črkah (okrajšava), ne kot cela beseda.
function osnovaBesede(s){
  return (s||"").toString().toUpperCase()
    .replace(/Č/g,"C").replace(/Ć/g,"C").replace(/Š/g,"S").replace(/Ž/g,"Z").replace(/Đ/g,"D")
    .trim();
}
function besedeImena(s){ return osnovaBesede(s).split(/\s+/).filter(Boolean); }
function imeSeUjemaZRosterjem(rosterIme, uvozenoIme){
  const r = besedeImena(rosterIme), u = besedeImena(uvozenoIme);
  if (!r.length || !u.length) return false;
  const zasedeno = new Array(u.length).fill(false);
  return r.every(rw => {
    const okrajsava = rw.endsWith(".");
    const osnova = okrajsava ? rw.slice(0, -1) : rw;
    const idx = u.findIndex((uw, i) => !zasedeno[i] && (okrajsava ? uw.startsWith(osnova) : uw === osnova));
    if (idx === -1) return false;
    zasedeno[idx] = true;
    return true;
  });
}
function najdiOsebo(vsiLjudje, uvozenoIme){
  return vsiLjudje.find(o => imeSeUjemaZRosterjem(o.ime, uvozenoIme));
}

// Barva celice -> stabilen ključ za preslikavo (ARGB hex; bela/brez polnila
// se šteje kot "brez odsotnosti ta dan", ne kot barva za preslikavo).
function barvaKljuc(fill){
  if (!fill || fill.type !== "pattern" || fill.pattern === "none") return null;
  const c = fill.fgColor;
  if (!c) return null;
  if (c.argb) return (c.argb === "FFFFFFFF" || c.argb === "00000000") ? null : c.argb;
  if (c.theme != null) return "theme:" + c.theme + ":" + (c.tint || 0);
  return null;
}
function barvaCSS(barva){
  if (barva.indexOf("theme:") === 0) return "#CCCCCC";
  const hex = barva.length === 8 ? barva.slice(2) : barva;
  return "#" + hex;
}

// Prebere Kadris-slog barvni koledar: vrstica glave se poišče sama med
// prvimi 15 vrsticami (tista z največ celoštevilskimi dnevi 1–31 v
// stolpcih), prvi stolpec vsake naslednje vrstice je ime osebe, barva
// vsake dnevne celice pa določa vrsto odsotnosti (preslikava se določi
// pozneje, glede na absence_color_map).
async function parsirajBarvniExcel(file){
  const buf = await file.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  const ws = wb.worksheets[0];
  if (!ws) throw new Error("Datoteka ne vsebuje delovnega lista.");
  const meja = Math.min(ws.rowCount, 15);
  let glavaR = null, stolpciDni = {}, najboljsi = 0;
  for (let r = 1; r <= meja; r++) {
    const row = ws.getRow(r);
    const dnevi = {};
    row.eachCell({ includeEmpty:false }, (cell, col) => {
      const v = cell.value;
      let n = null;
      if (typeof v === "number") n = v;
      else if (v instanceof Date) n = v.getDate();
      else if (typeof v === "string") { const m = v.trim().match(/^(\d{1,2})\.?$/); if (m) n = Number(m[1]); }
      if (n != null && n >= 1 && n <= 31) dnevi[col] = n;
    });
    const stevilo = Object.keys(dnevi).length;
    if (stevilo > najboljsi) { najboljsi = stevilo; glavaR = r; stolpciDni = dnevi; }
  }
  if (!glavaR || najboljsi < 5) {
    throw new Error("V datoteki ni bilo mogoče najti vrstice z dnevi v mesecu (1–31) — pričakovan je koledarski izpis z dnevi v stolpcih glave.");
  }
  const vrstice = [];
  for (let r = glavaR + 1; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    const imeRaw = (row.getCell(1).value || "").toString().trim();
    if (!imeRaw) continue;
    const zaznamki = [];
    Object.keys(stolpciDni).forEach(colStr => {
      const col = Number(colStr);
      const dan = stolpciDni[col];
      const barva = barvaKljuc(row.getCell(col).fill);
      if (barva) zaznamki.push({ dan, barva });
    });
    if (zaznamki.length) vrstice.push({ imeRaw, zaznamki });
  }
  return vrstice;
}

// Spodnji drsni meni (bottom sheet) za urejanje enega vnosa (oseba + dan) —
// nadomešča tapkanje po majhnih celicah mreže na telefonu z večjimi,

// "kandidati" (seznam oseb brez vnosa ta dan) se uporabi za "+ Dodaj", kjer
// admin/uporabnik najprej izbere osebo.
function UrediSheet({ ime: imeProp, kandidati, dan, dowLabel, mesecLbl, trenutnaVrednost, iso, smemUrejati, onPotrdi, onClose }){
  const [ime, setIme] = useState(imeProp || (kandidati && kandidati[0] ? kandidati[0].ime : ""));
  const trenutna = ime ? trenutnaVrednost(ime, iso) : null;
  const dovoljeno = !!ime && smemUrejati(ime);
  return (
    <div className="sheetOverlay no-print" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheetHandle"></div>
        <h3 style={{margin:"0 0 8px"}}>{dan}. {mesecLbl} <span style={{color:"var(--muted)", fontWeight:700, fontSize:13}}>{dowLabel}</span></h3>
        {imeProp ? (
          <p className="hint" style={{marginTop:0, fontWeight:700, color:"var(--text)"}}>{imeProp}</p>
        ) : (
          <div className="field">
            <label htmlFor="sheetIme">Oseba</label>
            <select id="sheetIme" value={ime} onChange={e => setIme(e.target.value)}>
              {(kandidati || []).map(o => <option key={o.ime} value={o.ime}>{o.ime}</option>)}
            </select>
          </div>
        )}
        {ime && !dovoljeno && <p className="hint" style={{color:"var(--danger)"}}>Ni dovoljeno urejati te vrstice (ali je rok za vnos potekel).</p>}
        <div className="sheetGrid">
          {Object.keys(PEN_META).map(k => (
            <button key={k} className={"sheetOpt" + (trenutna===k ? " active" : "")} disabled={!dovoljeno}
              onClick={() => onPotrdi(ime, trenutna === k ? null : k)}>
              <span className="dot" style={{background: PEN_META[k].barva}}></span>{PEN_META[k].label}
            </button>
          ))}
          <button className="sheetOpt erase" disabled={!dovoljeno || !trenutna} onClick={() => onPotrdi(ime, null)}>Izbriši vnos</button>
        </div>
        <button className="fileBtn" style={{marginTop:12, width:"100%", textAlign:"center"}} onClick={onClose}>Zapri</button>
      </div>
    </div>
  );
}

// Pogled "Po dnevih" — en dan naenkrat, kartice namesto ozke mreže; misljen
// za telefon ("hitro preverjanje na poti"), a deluje povsod. Urejanje gre
// prek UrediSheet zgoraj.
// Koledar na dotik za SVOJE vnose (telefon). Mesečna mreža 7x5/6, tap
// nastavi izbrano vrsto, ponoven tap na isti dan jo odstrani. Za daljši
// dopust je tu še "obseg": tapneš prvi in zadnji dan, vmesni se izpolnijo
// naenkrat (masovni vnos brez 14 posamičnih tapov).
function MojKoledar({ view, mojeIme, trenutnaVrednost, smemUrejati, nastaviCelico }){
  const [pero, setPero] = useState("ld");
  const [obsegOd, setObsegOd] = useState(null);
  const [busy, setBusy] = useState(false);

  const nd = danovVMesecu(view.year, view.month);
  const smem = smemUrejati(mojeIme);
  // Ponedeljek kot prvi stolpec (slovenska navada), zato zamik (dow+6)%7.
  const prviDow = (new Date(view.year, view.month, 1).getDay() + 6) % 7;
  const danes = new Date();
  const danesISO = `${danes.getFullYear()}-${String(danes.getMonth()+1).padStart(2,"0")}-${String(danes.getDate()).padStart(2,"0")}`;

  const nastavi = async (dnevi, vrednost) => {
    setBusy(true);
    try {
      for (const d of dnevi) await nastaviCelico(mojeIme, isoZa(view.year, view.month, d), vrednost);
    } finally { setBusy(false); }
  };

  const tap = (d) => {
    if (!smem || busy) return;
    const iso = isoZa(view.year, view.month, d);
    const trenutno = trenutnaVrednost(mojeIme, iso);

    // -1 = "obseg je vklopljen, a prvi dan še ni izbran"
    if (obsegOd === -1) { setObsegOd(d); return; }
    if (obsegOd != null) {
      const od = Math.min(obsegOd, d), doo = Math.max(obsegOd, d);
      const dnevi = [];
      for (let x = od; x <= doo; x++) dnevi.push(x);
      setObsegOd(null);
      nastavi(dnevi, pero);
      return;
    }
    // Ponoven tap na dan z isto vrsto = brisanje.
    nastavi([d], trenutno === pero ? null : pero);
  };

  const celice = [];
  for (let i = 0; i < prviDow; i++) celice.push(<div key={"p"+i} className="dan prazen"></div>);
  for (let d = 1; d <= nd; d++) {
    const iso = isoZa(view.year, view.month, d);
    const val = trenutnaVrednost(mojeIme, iso);
    const dow = (new Date(view.year, view.month, d).getDay() + 6) % 7;
    const razredi = ["dan"];
    if (dow >= 5) razredi.push("vikend");
    if (val) razredi.push("izbran-" + val);
    if (iso === danesISO) razredi.push("danes");
    if (obsegOd === d) razredi.push("danes");
    celice.push(
      <button key={d} type="button" className={razredi.join(" ")} disabled={!smem || busy}
        onClick={() => tap(d)}
        title={val ? PEN_META[val].label : "brez vnosa"}>
        {d}
      </button>
    );
  }

  return (
    <div>
      <div className="card no-print">
        <label className="eyebrow">Kaj vpisujem</label>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", marginTop:6}}>
          {Object.keys(PEN_META).map(k => (
            <button key={k} type="button" className="pill" aria-pressed={pero === k}
              style={{
                cursor:"pointer",
                border: "1px solid " + (pero === k ? "var(--text)" : "var(--line)"),
                background: PEN_META[k].barva,
                color: "#2B2712", fontWeight: pero === k ? 800 : 600,
              }}
              onClick={() => { setPero(k); setObsegOd(null); }}>
              {PEN_META[k].label}
            </button>
          ))}
        </div>
        <div style={{display:"flex", gap:8, marginTop:10, flexWrap:"wrap", alignItems:"center"}}>
          <button type="button" className="btn btn-ghost btn-sm" disabled={!smem}
            onClick={() => setObsegOd(obsegOd == null ? -1 : null)}>
            {obsegOd == null ? "📆 Označi obseg (od–do)" : "✕ Prekliči obseg"}
          </button>
          {obsegOd === -1 && <span className="hint" style={{margin:0}}>Tapni PRVI dan obsega …</span>}
          {obsegOd > 0 && <span className="hint" style={{margin:0}}>Tapni ZADNJI dan obsega …</span>}
        </div>
        <p className="hint" style={{marginBottom:0}}>
          Tap na dan vpiše izbrano vrsto, ponoven tap na isti dan jo odstrani.
          {!smem && " Urejanje za tvoje ime tu ni mogoče (rok je pretekel ali ime ni prepoznano)."}
        </p>
      </div>

      <div className="koledar">
        {["PO","TO","SR","ČE","PE","SO","NE"].map(d => <div key={d} className="glavaDan">{d}</div>)}
        {celice}
      </div>
      {busy && <p className="hint">Shranjujem …</p>}
    </div>
  );
}

function DnevniPogled({ view, vsiLjudje, trenutnaVrednost, smemUrejati, nastaviCelico }){
  const nd = danovVMesecu(view.year, view.month);
  const [dan, setDan] = useState(() => Math.min(new Date().getDate(), nd));
  const [sheet, setSheet] = useState(null); // { ime: string|null, kandidati: [...] }
  useEffect(() => { setDan(d => Math.min(d, nd)); }, [nd]);

  const iso = isoZa(view.year, view.month, dan);
  const dowLabel = dowZa(view.year, view.month, dan);
  const oznaceni = vsiLjudje.filter(({ ime }) => trenutnaVrednost(ime, iso));
  const proste = vsiLjudje.filter(({ ime }) => !trenutnaVrednost(ime, iso));

  const potrdiSheet = (ime, vrednost) => {
    if (!ime) return;
    nastaviCelico(ime, iso, vrednost);
    setSheet(null);
  };

  return (
    <div>
      <div className="dayNav no-print">
        <button className="navBtn" onClick={() => setDan(d => Math.max(1, d - 1))}>‹</button>
        <div className="dayLbl">{dan}. {MESECI_SL[view.month]} <span className="dow">{dowLabel}</span></div>
        <button className="navBtn" onClick={() => setDan(d => Math.min(nd, d + 1))}>›</button>
      </div>

      {oznaceni.length === 0 ? (
        <p className="hint">Ta dan nima nihče vnosa (dopust/omejitev/bolniška/študijski dopust).</p>
      ) : (
        <div className="dayCards">
          {oznaceni.map(({ ime }) => {
            const val = trenutnaVrednost(ime, iso);
            return (
              <button key={ime} className="dayCard" style={{borderLeftColor: PEN_META[val].barva}}
                onClick={() => setSheet({ ime, kandidati: null })}>
                <span>{ime}</span>
                <span className="pill" style={{background: PEN_META[val].barva}}>{PEN_META[val].label}</span>
              </button>
            );
          })}
        </div>
      )}

      {proste.length > 0 && (
        <button className="fileBtn no-print" style={{marginTop:10, width:"100%", textAlign:"center"}}
          onClick={() => setSheet({ ime: null, kandidati: proste })}>
          + Dodaj osebo za ta dan
        </button>
      )}

      {sheet && (
        <UrediSheet
          ime={sheet.ime} kandidati={sheet.kandidati}
          dan={dan} dowLabel={dowLabel} mesecLbl={MESECI_SL[view.month]}
          trenutnaVrednost={trenutnaVrednost} iso={iso} smemUrejati={smemUrejati}
          onPotrdi={potrdiSheet} onClose={() => setSheet(null)}
        />
      )}
    </div>
  );
}

function Razpredelnica({ role, myId, myFullName, vsiLjudje }){
  const jeKoordinator = role === "admin" || role === "vodja"; // dostop do zavihkov/strani
  const jeAdmin = role === "admin"; // edini, ki ureja katero koli vrstico, kadar koli
  const [view, setView] = useState(() => {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  });
  const [cells, setCells] = useState({}); // "IME|ISO" -> kind
  const [pen, setPen] = useState("omejitev");
  const [nacin, setNacin] = useState(() => (
    typeof window !== "undefined" && window.innerWidth <= 640 ? "dnevi" : "mreza"
  )); // "mreza" (cela tabela) | "dnevi" (1 dan, kartice — za telefon); na ozkih zaslonih privzeto "dnevi"
  const [nalagam, setNalagam] = useState(true);
  const [status, setStatus] = useState("");
  const [log, setLog] = useState([]);
  const isDragging = useRef(false);
  const dragValue = useRef(null);
  const skipClick = useRef(false);
  const uvozRef = useRef();
  const [uvozMsg, setUvozMsg] = useState(null);
  const [uvozBusy, setUvozBusy] = useState(false);

  // Uvoz barvnega koledarja odsotnosti (Kadris) — glej uvoziBarvniExcel spodaj.
  const barvniRef = useRef();
  const gridRef = useRef();
  const [barvnaMapa, setBarvnaMapa] = useState(null); // { [barva]: {kind, prezri} }
  const [barvniBusy, setBarvniBusy] = useState(false);
  const [barvniMsg, setBarvniMsg] = useState(null);
  const [barvniPredogled, setBarvniPredogled] = useState(null);
  const [izbireBarv, setIzbireBarv] = useState({});

  const rokPretekel = useMemo(() => {
    let dm = view.month - 1, dy = view.year;
    if (dm < 0) { dm = 11; dy -= 1; }
    const rok = new Date(dy, dm, 10, 23, 59, 59);
    return new Date() > rok;
  }, [view.year, view.month]);

  const smemUrejati = (ime) => jeAdmin || (imenaSeUjemata(ime, myFullName) && !rokPretekel);

  const nd = danovVMesecu(view.year, view.month);
  const dnevi = useMemo(() => Array.from({length: nd}, (_, i) => i+1), [nd]);
  const startISO = isoZa(view.year, view.month, 1);
  const endISO = isoZa(view.year, view.month, nd);

  const nalozi = () => {
    setNalagam(true);
    RazporedAuth.client.from("leave_entries").select("full_name, work_date, kind")
      .gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => {
        const m = {};
        (data || []).forEach(r => { m[r.full_name + "|" + r.work_date] = r.kind; });
        setCells(m);
        setNalagam(false);
      });
    RazporedAuth.client.from("leave_entries_log").select("*").order("created_at", { ascending:false }).limit(80)
      .then(({ data }) => setLog(data || []));
  };
  useEffect(() => { nalozi(); }, [view.year, view.month]);

  const trenutnaVrednost = (ime, iso) => cells[ime+"|"+iso] || null;

  const nastaviCelico = async (ime, iso, vrednost) => {
    const key = ime+"|"+iso;
    setCells(c => {
      const novo = { ...c };
      if (vrednost) novo[key] = vrednost; else delete novo[key];
      return novo;
    });
    setStatus("Shranjujem …");
    try {
      let error;
      if (vrednost) {
        ({ error } = await RazporedAuth.client.from("leave_entries").upsert(
          { full_name: ime, work_date: iso, kind: vrednost, created_by: myId },
          { onConflict: "full_name,work_date" }
        ));
      } else {
        ({ error } = await RazporedAuth.client.from("leave_entries").delete().eq("full_name", ime).eq("work_date", iso));
      }
      if (error) throw error;
      setStatus("Shranjeno " + new Date().toLocaleTimeString("sl-SI", {hour:"2-digit", minute:"2-digit"}));
    } catch (e) {
      setStatus("Napaka: " + (e.message || String(e)));
    }
  };

  // Množičen uvoz iz datoteke (samo admin, gumb spodaj je gatiran na jeAdmin) —
  // ista oblika kot v admin.html DezurstvaTab: ime,dopust,omejitve (datumi v
  // enem polju ločeni s podpičjem). Piše neposredno v Supabase (leave_entries),
  // zato ga takoj vidijo vsi uporabniki, ne samo lokalni generator.
  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setUvozMsg("PDF ni podprt za ta uvoz (ni stolpcev) — uporabi CSV/Excel."); return; }
      const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["ime","dopust","omejitve"], ["ime","full_name"]);
      const zapisi = [];
      objekti.forEach(o => {
        const ime = (o.ime || "").trim().toUpperCase();
        if (!ime) return;
        (o.dopust || "").split(";").map(s => s.trim()).filter(Boolean).forEach(iso => {
          zapisi.push({ full_name: ime, work_date: iso, kind: "ld", created_by: myId });
        });
        (o.omejitve || "").split(";").map(s => s.trim()).filter(Boolean).forEach(iso => {
          zapisi.push({ full_name: ime, work_date: iso, kind: "omejitev", created_by: myId });
        });
      });
      if (!zapisi.length) { setUvozMsg("Datoteka ne vsebuje uporabnih vrstic (pričakovano: ime,dopust,omejitve)."); return; }
      const { error } = await RazporedAuth.client.from("leave_entries").upsert(zapisi, { onConflict: "full_name,work_date" });
      if (error) throw error;
      setUvozMsg(`Uvoženih ${zapisi.length} vnosov iz "${file.name}".`);
      nalozi();
    } catch (e) {
      setUvozMsg("Napaka: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  useEffect(() => {
    if (!jeAdmin) return;
    RazporedAuth.client.from("absence_color_map").select("*").then(({ data }) => {
      const m = {};
      (data || []).forEach(r => { m[r.barva] = { kind: r.kind, prezri: r.prezri }; });
      setBarvnaMapa(m);
    });
  }, [jeAdmin]);

  // Uvoz barvnega koledarja (Kadris): prebere datoteko, poišče znane barve
  // (absence_color_map) in prikaže predogled + nove, še ne preslikane barve
  // za potrditev spodaj — glej potrdiBarvniUvoz.
  const uvoziBarvniExcel = async (file) => {
    if (!file || !barvnaMapa) return;
    setBarvniBusy(true); setBarvniMsg(null); setBarvniPredogled(null);
    try {
      const vrstice = await parsirajBarvniExcel(file);
      if (!vrstice.length) { setBarvniMsg("Datoteka ne vsebuje uporabnih vrstic z obarvanimi celicami."); return; }
      const barveVDatoteki = new Set();
      vrstice.forEach(v => v.zaznamki.forEach(z => barveVDatoteki.add(z.barva)));
      const barveNove = [...barveVDatoteki].filter(b => !barvnaMapa[b]);
      const neujemanja = [];
      let steviloUjemanj = 0;
      vrstice.forEach(v => { if (najdiOsebo(vsiLjudje, v.imeRaw)) steviloUjemanj++; else neujemanja.push(v.imeRaw); });
      setBarvniPredogled({
        vrstice, leto: view.year, mesec: view.month,
        barveNove, neujemanja, steviloOseb: vrstice.length, steviloUjemanj,
      });
      setIzbireBarv({});
      setBarvniMsg(`Prebranih ${vrstice.length} vrstic (osebe) iz "${file.name}" — preveri predogled spodaj pred potrditvijo.`);
    } catch (e) {
      setBarvniMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setBarvniBusy(false);
    }
  };

  const potrdiBarvniUvoz = async () => {
    if (!barvniPredogled) return;
    const { vrstice, leto, mesec, barveNove, neujemanja } = barvniPredogled;
    if (barveNove.some(b => !izbireBarv[b])) {
      setBarvniMsg('Za vse nove barve spodaj izberi vrsto odsotnosti (ali "Ignoriraj").');
      return;
    }
    setBarvniBusy(true);
    try {
      const noveMape = barveNove.map(b => ({
        barva: b,
        kind: izbireBarv[b] === "prezri" ? null : izbireBarv[b],
        prezri: izbireBarv[b] === "prezri",
        posodobil: myId,
      }));
      if (noveMape.length) {
        const { error } = await RazporedAuth.client.from("absence_color_map").upsert(noveMape, { onConflict: "barva" });
        if (error) throw error;
      }
      const polnaMapa = { ...barvnaMapa };
      noveMape.forEach(m => { polnaMapa[m.barva] = { kind: m.kind, prezri: m.prezri }; });

      const dniVMesecu = danovVMesecu(leto, mesec);
      const zapisi = [];
      vrstice.forEach(v => {
        const oseba = najdiOsebo(vsiLjudje, v.imeRaw);
        if (!oseba) return;
        v.zaznamki.forEach(z => {
          if (z.dan > dniVMesecu) return; // npr. 31. stolpec v mesecu s 30 dnevi
          const vnos = polnaMapa[z.barva];
          if (!vnos || vnos.prezri || !vnos.kind) return;
          zapisi.push({ full_name: oseba.ime, work_date: isoZa(leto, mesec, z.dan), kind: vnos.kind, created_by: myId });
        });
      });
      if (!zapisi.length) {
        setBarvniMsg("Ni bilo vnosov za uvoz (vse barve so ignorirane ali ni ujemanja imen s seznamom osebja).");
        setBarvnaMapa(polnaMapa);
        setBarvniPredogled(null);
        return;
      }
      for (let i = 0; i < zapisi.length; i += 200) {
        const { error } = await RazporedAuth.client.from("leave_entries").upsert(zapisi.slice(i, i + 200), { onConflict: "full_name,work_date" });
        if (error) throw error;
      }
      setBarvnaMapa(polnaMapa);
      setBarvniMsg(
        `Uvoženih ${zapisi.length} vnosov za ${MESECI_SL[mesec]} ${leto}.` +
        (neujemanja.length ? ` Brez ujemanja v seznamu osebja (preveri črkovanje v datoteki): ${neujemanja.join(", ")}.` : "")
      );
      setBarvniPredogled(null);
      nalozi();
    } catch (e) {
      setBarvniMsg("Uvoz ni uspel: " + (e.message || String(e)));
    } finally {
      setBarvniBusy(false);
    }
  };

  const izracunajNovo = (trenutna) => (pen === "erase" ? null : (trenutna === pen ? null : pen));

  const zavrniUrejanje = (ime) => {
    setStatus(
      !jeAdmin && !imenaSeUjemata(ime, myFullName)
        ? "Ni dovoljeno — lahko urejaš samo svojo vrstico."
        : "Rok za vnos za ta mesec je potekel (10. v prejšnjem mesecu)."
    );
  };

  const onCellClick = (ime, iso) => {
    if (skipClick.current) { skipClick.current = false; return; }
    if (!smemUrejati(ime)) { zavrniUrejanje(ime); return; }
    nastaviCelico(ime, iso, izracunajNovo(trenutnaVrednost(ime, iso)));
  };
  const onCellPointerDown = (e, ime, iso) => {
    if (e.pointerType !== "mouse") return;
    if (!smemUrejati(ime)) { zavrniUrejanje(ime); return; }
    skipClick.current = true;
    isDragging.current = true;
    dragValue.current = izracunajNovo(trenutnaVrednost(ime, iso));
    nastaviCelico(ime, iso, dragValue.current);
  };
  useEffect(() => {
    const onMove = (e) => {
      if (!isDragging.current) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest && el.closest("[data-cell]");
      if (!cell || !smemUrejati(cell.dataset.ime)) return;
      nastaviCelico(cell.dataset.ime, cell.dataset.iso, dragValue.current);
    };
    const onUp = () => { isDragging.current = false; };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    return () => { document.removeEventListener("pointermove", onMove); document.removeEventListener("pointerup", onUp); };
  }, [pen]);

  const ldStevilo = (ime) => dnevi.filter(d => trenutnaVrednost(ime, isoZa(view.year, view.month, d)) === "ld").length;

  const pojdiNaMesec = (y, m) => setView({ year: y, month: m });

  return (
    <div>
      <p className="hint">
        Klikni barvo spodaj, nato klikni ali povleci čez dneve. Generator dežurstev (admin.html) te vnose prebere
        samodejno ob izbiri meseca ali s klikom "🔄 Osveži iz Želje" — LD (dopust) samodejno blokira tudi dan pred
        začetkom strnjenega bloka, ostale tri (Omejitev, BS, STI) blokirajo samo označen dan. Mreža je razdeljena po
        primarnem oddelku vsake osebe (isti oddelek, ki šteje za generator razporeda) — če za osebo v tem mesecu ni
        nobenega vnosa, se šteje, da je na voljo cel mesec.
        {jeAdmin
          ? " Kot administrator lahko urejaš vrstico kogar koli, kadar koli."
          : " Vidiš celotno razpredelnico vseh, urejaš pa lahko samo svojo vrstico — in to do 10. v mesecu pred prikazanim mesecem (po tem roku je zaklenjena tudi zate)."}
      </p>
      {jeAdmin && (
        <div className="card no-print" style={{marginBottom:10}}>
          <input ref={uvozRef} type="file" accept=".csv,text/csv,.xlsx,.xls,.pdf" style={{display:"none"}}
            onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
          <button className="submitBtn" disabled={uvozBusy} onClick={() => uvozRef.current && uvozRef.current.click()}>
            {uvozBusy ? "Nalagam …" : "📤 Množičen uvoz dopusta/omejitev (CSV/Excel/PDF)"}
          </button>
          <p className="hint" style={{marginTop:8, marginBottom:0}}>
            Oblika: <code>ime,dopust,omejitve</code> (datumi ločeni s podpičjem, npr. <code>2026-09-01;2026-09-02</code>).
            Piše neposredno v razpredelnico (Supabase) — takoj vidno vsem.
          </p>
          {uvozMsg && <p className="hint" style={{marginTop:6, marginBottom:0}}>{uvozMsg}</p>}
        </div>
      )}
      {jeAdmin && (
        <div className="card no-print" style={{marginBottom:10}}>
          <input ref={barvniRef} type="file" accept=".xlsx,.xls" style={{display:"none"}}
            onChange={e => { uvoziBarvniExcel(e.target.files[0]); e.target.value = ""; }} />
          <button className="submitBtn" disabled={barvniBusy || !barvnaMapa} onClick={() => barvniRef.current && barvniRef.current.click()}>
            {barvniBusy ? "Nalagam …" : `📅 Uvoz barvnega koledarja (Kadris) — v ${MESECI_SL[view.month]} ${view.year}`}
          </button>
          <p className="hint" style={{marginTop:8, marginBottom:0}}>
            Vrstica z dnevi 1–31 se poišče sama, prvi stolpec je ime osebe (Priimek Ime). Barva celice določa vrsto
            odsotnosti — nove barve admin ob prvem uvozu enkrat določi spodaj, potem si jih aplikacija zapomni.
            Uvozi se v TRENUTNO prikazani mesec — po potrebi najprej preklopi mesec zgoraj/spodaj.
          </p>
          {barvniMsg && <p className="hint" style={{marginTop:6, marginBottom:0}}>{barvniMsg}</p>}

          {barvniPredogled && (
            <div style={{marginTop:12, borderTop:"1px solid var(--line)", paddingTop:12}}>
              <p className="hint" style={{margin:"0 0 8px"}}>
                {barvniPredogled.steviloUjemanj} od {barvniPredogled.steviloOseb} oseb najdenih v seznamu osebja.
                {barvniPredogled.neujemanja.length > 0 && ` Brez ujemanja: ${barvniPredogled.neujemanja.join(", ")}.`}
              </p>
              {barvniPredogled.barveNove.length > 0 && (
                <div style={{display:"flex", flexDirection:"column", gap:8, marginBottom:10}}>
                  <p className="hint" style={{margin:0, fontWeight:700}}>Nove barve — določi vrsto odsotnosti:</p>
                  {barvniPredogled.barveNove.map(b => (
                    <div key={b} style={{display:"flex", alignItems:"center", gap:8}}>
                      <span style={{width:22, height:22, borderRadius:6, border:"1px solid var(--line)", background:barvaCSS(b), display:"inline-block", flex:"0 0 auto"}}></span>
                      <select value={izbireBarv[b] || ""} onChange={e => setIzbireBarv(s => ({...s, [b]: e.target.value}))}>
                        <option value="">— izberi —</option>
                        {Object.keys(PEN_META).map(k => <option key={k} value={k}>{PEN_META[k].label}</option>)}
                        <option value="prezri">Ignoriraj (ni odsotnost)</option>
                      </select>
                    </div>
                  ))}
                </div>
              )}
              <button className="submitBtn" disabled={barvniBusy} onClick={potrdiBarvniUvoz}>
                {barvniBusy ? "Uvažam …" : "Potrdi uvoz"}
              </button>
              <button className="fileBtn" style={{marginLeft:8}} onClick={() => setBarvniPredogled(null)}>Prekliči</button>
            </div>
          )}
        </div>
      )}
      <div className="viewToggle no-print">
        <button aria-pressed={nacin==="mreza"} onClick={() => setNacin("mreza")}>🗓 Mreža (cel mesec)</button>
        <button aria-pressed={nacin==="dnevi"} onClick={() => setNacin("dnevi")}>📱 Po dnevih</button>
        <button aria-pressed={nacin==="koledar"} onClick={() => setNacin("koledar")}>✍️ Moj koledar</button>
      </div>

      {nacin==="mreza" && (
        <div className="penRow no-print">
          <span className="penHint">Barva:</span>
          {Object.keys(PEN_META).map(k => (
            <button key={k} className={"penBtn" + (pen===k ? " active" : "")} onClick={() => setPen(k)}>
              <span className="penSwatch" style={{background: PEN_META[k].barva}}></span>{PEN_META[k].label}
            </button>
          ))}
          <button className={"penBtn eraser" + (pen==="erase" ? " active" : "")} onClick={() => setPen("erase")}>
            <span className="penSwatch"></span>Izbriši
          </button>
        </div>
      )}

      <div className="monthRow no-print">
        <div className="monthNav">
          <button className="navBtn" onClick={() => { let m=view.month-1,y=view.year; if(m<0){m=11;y--;} pojdiNaMesec(y,m); }}>‹</button>
          <div className="monthLbl">{MESECI_SL[view.month][0].toUpperCase()+MESECI_SL[view.month].slice(1)} {view.year}</div>
          <button className="navBtn" onClick={() => { let m=view.month+1,y=view.year; if(m>11){m=0;y++;} pojdiNaMesec(y,m); }}>›</button>
        </div>
        {nacin==="mreza" && (
          <button className="toolBtn" style={{width:"auto"}} onClick={() => PrintFit.natisni(gridRef.current, { orientacija:"landscape" })}>📄 Izvozi v PDF (A4 ležeče, 1 stran)</button>
        )}
        <span className="hint" style={{margin:0}}>{nalagam ? "Nalagam …" : status}</span>
      </div>

      {nacin==="mreza" && (
        <RazporedIzvoz
          naslov={`zelje-${view.year}-${String(view.month+1).padStart(2,"0")}`}
          pripravi={() => [{
            ime: MESECI_SL[view.month] + " " + view.year,
            glave: ["Ime", ...dnevi.map(d => isoZa(view.year, view.month, d)), "LD dni"],
            vrstice: vsiLjudje.map(({ ime }) => [
              ime,
              ...dnevi.map(d => { const val = trenutnaVrednost(ime, isoZa(view.year, view.month, d)); return val ? PEN_META[val].label : ""; }),
              ldStevilo(ime),
            ]),
          }]}
        />
      )}

      {nacin==="dnevi" && (
        <DnevniPogled view={view} vsiLjudje={vsiLjudje} trenutnaVrednost={trenutnaVrednost} smemUrejati={smemUrejati} nastaviCelico={nastaviCelico} />
      )}

      {nacin==="koledar" && (
        myFullName
          ? <MojKoledar view={view} mojeIme={myFullName} trenutnaVrednost={trenutnaVrednost}
              smemUrejati={smemUrejati} nastaviCelico={nastaviCelico} />
          : <p className="hint">Tvojega imena ni bilo mogoče prebrati iz profila, zato osebnega koledarja ni mogoče prikazati.</p>
      )}

      {nacin==="mreza" && (
      <div className="gridScroll" ref={gridRef}>
        <table className="grid">
          <thead>
            <tr className="dnr">
              <th className="corner">{MESECI_SL[view.month]} {view.year}</th>
              {dnevi.map(d => {
                const cls = jeDanPraznik(view.year, view.month, d) ? "hol" : (jeVikend(view.year, view.month, d) ? "we" : "");
                return <th key={d} className={cls}>{d}</th>;
              })}
              <th className="tot">LD dni</th>
            </tr>
            <tr className="dwr">
              <th className="corner" style={{top:22}}></th>
              {dnevi.map(d => {
                const cls = jeDanPraznik(view.year, view.month, d) ? "hol" : (jeVikend(view.year, view.month, d) ? "we" : "");
                return <th key={d} className={cls}>{dowZa(view.year, view.month, d)}</th>;
              })}
              <th className="tot"></th>
            </tr>
          </thead>
          <tbody>
            {vsiLjudje.map(({ ime, skupina }, i) => {
              const jeMoja = imenaSeUjemata(ime, myFullName);
              const prejsnjaSkupina = i > 0 ? vsiLjudje[i - 1].skupina : null;
              const zacetekSkupine = skupina !== prejsnjaSkupina;
              return (
                <React.Fragment key={ime}>
                  {zacetekSkupine && (
                    <tr className="oddGroup">
                      <th className="oddGroupLbl" colSpan={dnevi.length + 2}>{skupina}</th>
                    </tr>
                  )}
                  <tr style={!jeAdmin && !jeMoja ? {opacity:.6} : null}>
                    <th className="nm">{ime}{jeMoja && !jeAdmin ? " (jaz)" : ""}</th>
                  {dnevi.map(d => {
                    const iso = isoZa(view.year, view.month, d);
                    const val = trenutnaVrednost(ime, iso);
                    const cls = jeDanPraznik(view.year, view.month, d) ? "hol" : (jeVikend(view.year, view.month, d) ? "we" : "");
                    const urejeno = smemUrejati(ime);
                    return (
                      <td key={d} className={"cell " + cls} data-cell data-ime={ime} data-iso={iso}
                        style={{
                          backgroundColor: val ? PEN_META[val].barva : undefined,
                          cursor: urejeno ? "pointer" : "not-allowed",
                        }}
                        title={ime + " — " + d + ". " + MESECI_SL[view.month] + ": " + (val ? PEN_META[val].label : "brez vnosa") + (urejeno ? "" : " (ni urejljivo)")}
                        onClick={() => onCellClick(ime, iso)}
                        onPointerDown={(e) => onCellPointerDown(e, ime, iso)}
                      />
                    );
                  })}
                  <td className="tot">{ldStevilo(ime)}</td>
                  </tr>
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      )}

      {role === "admin" && (
        <React.Fragment>
          <h2 className="section no-print">Zgodovina sprememb</h2>
          <p className="hint no-print">Vidno samo administratorjem — vsak vnos/sprememba se beleži ne glede na to, kdo jo naredi.</p>
          <ul className="logList no-print">
            {log.length === 0 && <li className="log-empty">Ni še zabeleženih sprememb.</li>}
            {log.map(entry => {
              const dt = new Date(entry.created_at);
              return (
                <li key={entry.id}>
                  <span className="t">{dt.toLocaleDateString("sl-SI")} {dt.toLocaleTimeString("sl-SI",{hour:"2-digit",minute:"2-digit"})}</span>
                  <span className="who">{entry.editor_name || "Neznano"}</span>: {entry.full_name}, {new Date(entry.work_date+"T00:00:00").getDate()}. {MESECI_SL[new Date(entry.work_date+"T00:00:00").getMonth()]}:{" "}
                  {entry.from_kind ? PEN_META[entry.from_kind].label : "brez"} → {entry.to_kind ? PEN_META[entry.to_kind].label : "brez"}
                </li>
              );
            })}
          </ul>
        </React.Fragment>
      )}
    </div>
  );
}

// Seznam želja je zdaj razdeljen po oddelkih (glej SeznamZeljTab spodaj) —
// 6 SMS/TZN oddelkov + FLEXI + NZV (na izrecno navodilo). Imena oseb za
// izbirnik (samo za admina/vodjo, ki lahko vnese željo za kogar koli)
// pridobimo iz živega seznama oddelkov (skupine, glej nalozizRoster) — NZV
// je tam že pravilno napolnjen (vsi z vlogo vodja/admin), enako kot
// ostalih 7 skupin, zato ni več potreben poseben primer za lead_departments.
function VnosForma({ oddelek, skupine, myId, myFullName, jeKoordinator, onAdded }){
  const [imena, setImena] = useState(null); // null dokler se ne naloži
  useEffect(() => {
    const skupina = skupine.find(g => g.koda === oddelek);
    setImena(skupina ? skupina.ljudje : []);
  }, [oddelek, skupine]);

  const [ime, setIme] = useState(myFullName || "");
  useEffect(() => {
    if (jeKoordinator) setIme(imena && imena.length ? imena[0] : "");
    else setIme(myFullName || "");
  }, [imena, jeKoordinator, myFullName]);

  const [obdobje, setObdobje] = useState("");
  const [opis, setOpis] = useState("");
  const [slika, setSlika] = useState(null); // data URL
  const [nalaga, setNalaga] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const fileRef = useRef();

  const onFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setNalaga(true);
    try { setSlika(await compressImage(file)); }
    finally { setNalaga(false); }
    e.target.value = "";
  };

  const shrani = async () => {
    if (!obdobje.trim() && !opis.trim() && !slika) return;
    setBusy(true); setMsg(null);
    try {
      const { error } = await RazporedAuth.client.from("employee_wishes").insert({
        profile_id: jeKoordinator ? null : myId,
        full_name: (ime || myFullName || "").trim(),
        department_code: oddelek,
        obdobje: obdobje.trim() || null, opis: opis.trim() || null, slika,
        created_by: myId,
      });
      if (error) throw error;
      setObdobje(""); setOpis(""); setSlika(null);
      onAdded();
    } catch (e) {
      setMsg(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="card">
      {jeKoordinator ? (
        <div className="field">
          <label htmlFor="ime">Zaposleni</label>
          <select id="ime" value={ime} onChange={e => setIme(e.target.value)} disabled={!imena}>
            {(imena || []).map(l => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
      ) : (
        <p className="hint" style={{marginTop:0}}>Vnašaš željo zase: <b>{myFullName}</b></p>
      )}
      <div className="field">
        <label htmlFor="obd">Obdobje</label>
        <input id="obd" type="text" placeholder="npr. 9.–15. november, ali cel december"
          value={obdobje} onChange={e => setObdobje(e.target.value)} />
      </div>
      <div className="field">
        <label htmlFor="op">Želja / opomba (neobvezno, če je slika dovolj)</label>
        <textarea id="op" placeholder="npr. želi prost vikend, ne more delati nočnih ..."
          value={opis} onChange={e => setOpis(e.target.value)} />
      </div>
      <div className="field">
        <label>Fotografija (neobvezno)</label>
        <div className="fileRow">
          <label className="fileBtn">
            {nalaga ? "Obdelujem …" : "⬆ Dodaj fotografijo"}
            <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={onFile} />
          </label>
          {slika && <img className="thumbPreview" src={slika} alt="predogled" />}
          {slika && <button className="clearImg" onClick={() => setSlika(null)}>odstrani sliko</button>}
        </div>
      </div>
      <button className="submitBtn" onClick={shrani} disabled={nalaga || busy}>{busy ? "Shranjujem …" : "Shrani željo"}</button>
      {msg && <p className="err">{msg}</p>}
    </div>
  );
}

const ZELJE_ODDELKI = ["B", "C", "C1", "D", "E1", "E2", "FLEXI", "NZV"];

function SeznamZeljTab({ role, myId, myFullName, myDept, skupine }){
  const jeKoordinator = role === "admin" || role === "vodja";
  const [oddelek, setOddelek] = useState(() => (
    jeKoordinator ? ZELJE_ODDELKI[0] : (ZELJE_ODDELKI.includes(myDept) ? myDept : null)
  ));
  const [zapisi, setZapisi] = useState([]);
  const [nalagam, setNalagam] = useState(true);
  const [filter, setFilter] = useState("");
  const [lightbox, setLightbox] = useState(null);

  const nalozi = () => {
    if (!oddelek) { setZapisi([]); setNalagam(false); return; }
    setNalagam(true);
    RazporedAuth.client.from("employee_wishes").select("*").eq("department_code", oddelek)
      .order("created_at", { ascending: false })
      .then(({ data }) => { setZapisi(data || []); setNalagam(false); });
  };
  useEffect(() => { nalozi(); }, [oddelek]);

  const obrisi = async (id) => {
    const { error } = await RazporedAuth.client.from("employee_wishes").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    nalozi();
  };

  const grouped = useMemo(() => {
    const f = filter.trim().toLowerCase();
    const filtered = zapisi.filter(e =>
      !f || e.full_name.toLowerCase().includes(f) || (e.obdobje||"").toLowerCase().includes(f) || (e.opis||"").toLowerCase().includes(f)
    );
    const byIme = {};
    filtered.forEach(e => { (byIme[e.full_name] = byIme[e.full_name] || []).push(e); });
    return Object.keys(byIme).sort().map(ime => ({ ime, list: byIme[ime] }));
  }, [zapisi, filter]);

  const skupajSlik = zapisi.filter(e => e.slika).length;

  if (!oddelek) {
    return <p className="hint">Seznam želja ni na voljo za tvoj oddelek.</p>;
  }

  return (
    <div>
      {jeKoordinator && (
        <div className="tabs no-print" role="tablist" style={{marginBottom:14}}>
          {ZELJE_ODDELKI.map(k => (
            <button key={k} role="tab" aria-selected={oddelek===k} onClick={() => setOddelek(k)}>{k}</button>
          ))}
        </div>
      )}

      <div className="no-print">
        <h2 className="section">Nov vnos — {oddelek === "NZV" ? "NZV" : "oddelek " + oddelek}</h2>
        <VnosForma oddelek={oddelek} skupine={skupine} myId={myId} myFullName={myFullName} jeKoordinator={jeKoordinator} onAdded={nalozi} />
      </div>

      <div className="toolRow no-print">
        <input type="text" placeholder="Iskanje po imenu, obdobju ali besedilu …" value={filter}
          onChange={e => setFilter(e.target.value)}
          style={{flex:"1 1 200px", background:"var(--surface-2)", border:"1px solid var(--line)", color:"var(--text)",
            padding:"9px 12px", borderRadius:"999px", fontSize:13}} />
        <button className="toolBtn" onClick={() => PrintFit.natisni(null, { orientacija:"portrait" })}>📄 Izvozi v PDF (A4 pokončno)</button>
      </div>

      <h2 className="section">Vneseni seznam {skupajSlik > 0 && <span style={{fontWeight:400, color:"var(--muted)", fontSize:12}}>({skupajSlik} s fotografijo)</span>}</h2>

      {nalagam && <p className="hint">Nalagam …</p>}
      {!nalagam && grouped.length === 0 && <p className="empty">Ni vnesenih želja{filter ? " za ta iskalni niz" : ""}.</p>}

      {grouped.map(g => (
        <div key={g.ime}>
          <div className="groupHead">
            <span className="n">{g.ime}</span>
            <span className="g">{g.list.length} {steviloVnosov(g.list.length)}</span>
          </div>
          {g.list.map(e => (
            <div className="entry" key={e.id}>
              <div className="top2">
                <div>
                  {e.obdobje && <div className="obdobje">{e.obdobje}</div>}
                  <div className="datum">{new Date(e.created_at).toLocaleString("sl-SI", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"})}</div>
                </div>
                {(jeKoordinator || e.profile_id === myId) && (
                  <button className="delBtn no-print" onClick={() => obrisi(e.id)} title="Izbriši">✕</button>
                )}
              </div>
              {e.opis && <div className="opis">{e.opis}</div>}
              {e.slika && <img className="thumb" src={e.slika} onClick={() => setLightbox(e.slika)} alt="priložena fotografija" />}
            </div>
          ))}
        </div>
      ))}

      <Lightbox src={lightbox} onClose={() => setLightbox(null)} />
    </div>
  );
}

function Lightbox({ src, onClose }){
  if (!src) return null;
  return (
    <div className="modalOverlay" onClick={onClose}>
      <img src={src} alt="fotografija želje v polni velikosti" />
    </div>
  );
}

function App({ role, myId, myFullName, myDept, ogled, profil }){
  const [tab, setTab] = useState("razpredelnica");
  const [roster, setRoster] = useState(null); // { skupine, vsiLjudje } — glej nalozizRoster
  useEffect(() => { nalozizRoster().then(setRoster).catch(() => setRoster({ skupine: [], vsiLjudje: [] })); }, []);

  return (
    <div className="wrap wide">
      <RazporedOgledTrak aktivno={ogled} profil={profil}/>
      <RazporedLogout/>
      <header className="top">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Želje zaposlenih</span><span className="tag">za koordinatorje</span></div>
        <p className="sub">Psihiatrična bolnišnica Begunje · vnos po zaposlenem, besedilo ali fotografija</p>
      </header>

      <div className="tabs no-print" role="tablist">
        <button role="tab" aria-selected={tab==="razpredelnica"} onClick={() => setTab("razpredelnica")}>Razpredelnica dopusti/omejitve</button>
        <button role="tab" aria-selected={tab==="zelje"} onClick={() => setTab("zelje")}>Seznam želja</button>
      </div>

      {!roster && <p className="hint">Nalagam seznam osebja …</p>}

      {roster && tab === "razpredelnica" && (
        <Razpredelnica role={role} myId={myId} myFullName={myFullName} vsiLjudje={roster.vsiLjudje} />
      )}

      {roster && tab === "zelje" && (
        <SeznamZeljTab role={role} myId={myId} myFullName={myFullName} myDept={myDept} skupine={roster.skupine} />
      )}

      <footer className="foot no-print">
        <p><b>Razpredelnica dopusti/omejitve</b> je shranjena v Supabase (leave_entries) in jo generator dežurstev (admin.html) prebere samodejno.</p>
        <p><b>Seznam želja</b> je razdeljen po oddelkih (B, C, C1, D, E1, E2, Vodje) — zaposleni vidi in vnaša samo v svoj oddelek, administrator in vodja pa vse.</p>
      </footer>

      <RazporedNav active="zelje" role={role} unread={0} />
    </div>
  );
}
function Gate(){
  const [ok, setOk] = useState(false);
  const [role, setRole] = useState("user");
  const [myId, setMyId] = useState(null);
  const [myFullName, setMyFullName] = useState("");
  const [myDept, setMyDept] = useState(null);
  const [ogled, setOgled] = useState(false);
  const [profil, setProfil] = useState(null);
  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setRole(res.profile ? res.profile.role : "user");
      setMyId(res.session.user.id);
      setMyFullName(res.profile ? res.profile.full_name : "");
      setMyDept(res.profile ? res.profile.department_code : null);
      setOgled(!!res.ogled);
      setProfil(res.profile);
      setOk(true);
    });
  }, []);
  return ok ? <App role={role} myId={myId} myFullName={myFullName} myDept={myDept} ogled={ogled} profil={profil}/> : null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Gate/>);
</script>
</body>
</html>
