                      return (
                        <td key={dn.datum}>
                          <input type="text" value={sifra} onChange={e => nastaviPopravek(z, dn, e.target.value)}
                            title={naslov}
                            style={{width:48, minHeight:40, textAlign:"center", background:BARVE[cls]+"33", color:"var(--text)",
                              border:obroba, borderRadius:6, fontSize:13, padding:"3px 2px"}} />
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* Vsi izvozi so v meniju ikone ⬇ zgoraj desno. */}
          <RazporedIzvozVir
            naziv="Kalup"
            pdf={{ label: "Izvozi v PDF (A4 ležeče, 1 stran)",
                   onClick: () => PrintFit.natisni(wardRef.current, { orientacija:"landscape" }) }}
            dodatno={[
              { label: "Izvozi CSV", onClick: izvoziCSV },
              { label: "Prenesi JSON za mobilno aplikacijo", onClick: prenesi },
            ]}
            naslov={rezultat ? `kalup-${rezultat.koda}-${rezultat.mesec}` : "kalup"}
            pripravi={() => {
              if (!rezultat) throw new Error("Najprej ustvari kalup.");
              return [{
                ime: rezultat.koda,
                glave: ["Zaposleni", ...rezultat.dnevi.map(dn => window.Datum.slo(dn.datum))],
                vrstice: rezultat.staff.map(z => [z.ime, ...rezultat.dnevi.map(dn => celica(z, dn))]),
              }];
            }}
          />

          <h2 className="section no-print">4c · Zapiši predogled v Google Sheets</h2>
          <p className="hint no-print">
            Predogled zgoraj (z vsemi ročnimi popravki) lahko zapišeš nazaj v obstoječi, deljeni dokument (npr. "2026
            SMS RAZPORED") - ŠE PRED objavo v Supabase, da ga lahko sproti pregledaš/popraviš v pravi obliki, ki jo
            uporabljajo drugi. Odpri zavihek ZA TA ODDELEK v Google Sheets in šele nato kopiraj povezavo iz naslovne
            vrstice (mora vsebovati "#gid=…") - piše samo v obstoječe celice, nikoli ne doda vrstice/stolpca.
          </p>
          <div className="field no-print" style={{ marginTop: 8, marginBottom: 8 }}>
            <label htmlFor="kalupSheetsUrl">Povezava do Google Sheets za oddelek {koda}</label>
            <input id="kalupSheetsUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..."
              value={sheetsUrl} onChange={e => spremeniSheetsUrl(e.target.value)} />
          </div>
          <button className="dlBtn no-print" type="button" onClick={zapisiPredogledVSheets} disabled={sheetsBusy}>
            {sheetsBusy ? "Zapisujem …" : "📤 Zapiši predogled v Sheets"}
          </button>
          {sheetsMsg && <p className="hint no-print" style={{color: sheetsMsg.ok ? "var(--ok)" : "var(--danger)"}}>{sheetsMsg.text}</p>}

          <button className="genBtn no-print" onClick={objavi} disabled={publishBusy} style={{marginTop:8}}>
            {publishBusy ? "Objavljam …" : "📤 Objavi neposredno v Supabase"}
          </button>
          {publishMsg && <p className="hint no-print" style={{color: publishMsg.ok ? "var(--ok)" : "var(--danger)"}}>{publishMsg.text}</p>}
        </React.Fragment>
      )}
    </div>
  );
}

// Pravičnost dežurstev – kontrolni seznam, razdelek 7: doslej je bilo
// skupno število dežurstev vidno samo znotraj rezultata generiranja
// ("4 · Pravičnost – novo stanje" spodaj), ne pa kadarkoli, brez generiranja.
// Uporabi isti roster.stevilo, ki ga nalozizDezurniKader že računa živo.
// Dežurni krog šteje 14 ljudi (zaprta zgodovina jan.-avg. 2026). Če jih
// je na seznamu manj, je vzrok vedno isti: manjka jim članstvo "DEZ" v
// Imeniku. Brez tega opozorila je to tiha napaka – generator pravičnosti
// in razporeda bi delal videti pravilno, le nad premajhnim krogom, zato
// bi prisotni dobili preveč dežurstev.
function ManjkajociDezurni({ roster }){
  // Prav tako po vreči besed, ne po točnem zapisu – sicer bi vsak, ki je v
  // Imeniku zapisan kot "Ime Priimek", padel med "manjkajoče".
  const naSeznamu = new Set((roster || []).map(r => kljucImena(r.ime)));
  const manjkajo = Object.keys(DEZURNI_OSNOVA_DO_31_8_2026).filter(ime => !naSeznamu.has(kljucImena(ime)));
  if (!manjkajo.length) return null;
  return (
    <div className="card no-print" style={{marginBottom:12, borderLeft:"4px solid #C9713F"}}>
      <p style={{marginTop:0, fontWeight:600}}>
        ⚠ Na seznamu je {(roster || []).length} od 14 dežurnih – manjka {manjkajo.length}
      </p>
      <p className="hint" style={{marginTop:0}}>{manjkajo.join(" · ")}</p>
      <p className="hint" style={{marginBottom:0}}>
        Tem osebam v <b>Imeniku</b> med oddelke dodajte še »Dežurni kader (DMS/DZN)« – <b>poleg</b> domačega
        oddelka, ne namesto njega. Za vseh 14 naenkrat poženite <code>supabase/dezurni-kader.sql</code>.
        Dokler manjkajo, generator razdeli dežurstva samo med prisotne in jim jih naloži preveč.
      </p>
    </div>
  );
}

function PravicnostPregled({ roster }){
  const povprecje = roster.length ? roster.reduce((s, z) => s + (Number(z.stevilo) || 0), 0) / roster.length : 0;
  const maxStevilo = Math.max(1, ...roster.map(z => Number(z.stevilo) || 0));
  const sortirano = roster.slice().sort((a, b) => (Number(b.stevilo) || 0) - (Number(a.stevilo) || 0));
  return (
    <div className="card no-print" style={{marginBottom:12}}>
      <div style={{fontWeight:800, marginBottom:4}}>⚖ Pravičnost dežurstev – trenutno stanje</div>
      <p className="hint" style={{marginTop:0}}>
        Skupno število dežurstev doslej (zaprta zgodovina do 31. 8. 2026 + živo objavljeno), povprečje
        oddelka: <b>{povprecje.toFixed(1)}</b>. Kdor ima bistveno več od povprečja, je kandidat za manj
        naslednjih dežurstev; kdor ima manj, za več.
      </p>
      <table className="fairTable">
        <thead><tr><th>Zaposleni</th><th>Skupaj</th><th>Odstopanje od povprečja</th></tr></thead>
        <tbody>
          {sortirano.map(z => {
            const st = Number(z.stevilo) || 0;
            const odstopanje = st - povprecje;
            return (
              <tr key={z.ime}>
                <td><ImeOsebe id={z.id}>{z.ime}</ImeOsebe></td>
                <td><b>{st}</b><div className="bar"><i style={{width:(100*st/maxStevilo)+"%"}}></i></div></td>
                <td style={{color: odstopanje > 0.5 ? "var(--danger)" : odstopanje < -0.5 ? "var(--ok)" : "var(--muted)"}}>
                  {odstopanje > 0 ? "+" : ""}{odstopanje.toFixed(1)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ---------------------------------------------------------------------
function DezurstvaTab({ zacetniMesec }){
  const [roster, setRoster] = useState(null);
  const [month, setMonth] = useState(zacetniMesec || "2026-09");
  const [minRazmik, setMinRazmik] = useState(3);
  const [prostDan, setProstDan] = useState(true);
  const [maxVikend, setMaxVikend] = useState(true);
  const [rezultat, setRezultat] = useState(null);
  // Že objavljeni dnevi se ob ponovnem generiranju ne premešajo.
  const [zakleniObjavljeno, setZakleniObjavljeno] = useState(true);
  const [zaklenjeni, setZaklenjeni] = useState({});
  const [publishBusy, setPublishBusy] = useState(false);
  const [publishMsg, setPublishMsg] = useState(null);
  const [uvozMsg, setUvozMsg] = useState(null);
  const [uvozBusy, setUvozBusy] = useState(false);
  const [gsheetUrl, setGsheetUrl] = useState("");
  const [pdfBesedilo, setPdfBesedilo] = useState(null);
  const uvozRef = useRef();
  const printRef = useRef();

  const { startISO, endISO } = monthRange(month);

  const updateField = (ime, field, value) => {
    setRoster(r => r.map(z => z.ime===ime ? {...z, [field]: value} : z));
  };

  // Prebere barvno razpredelnico "Želje" (leave_entries) za izbrani mesec in
  // vrne { IME: { dopust:[iso,...], omejitve:[iso,...] } }. "bs"/"sti" se
  // obravnavata kot omejitve (blokiran samo ta dan, brez pravila "dan prej").
  const nalozitIzZelja = async (mesec) => {
    const { startISO: s, endISO: e } = monthRange(mesec);
    const { data, error } = await client.from("leave_entries").select("full_name, work_date, kind")
      .gte("work_date", s).lte("work_date", e);
    if (error || !data) return null;
    // Ključ prek imena.js in NE surovega imena z velikimi črkami: v
    // leave_entries so imena zapisana različno - ročni vnos v Razpredelnici
    // jih shrani tako, kot so v Imeniku ("Bojić Matej"), uvoz iz CSV pa z
    // VELIKIMI ("BOJIĆ MATEJ"). Prej se je iskalo z izZelja[z.ime], torej
    // surovo ime proti velikim črkam - ujemanja ni bilo NIKOLI in dopusti
    // ter omejitve se v razpored dežurstev sploh niso prenesli.
    const grouped = {};
    data.forEach(row => {
      const key = kljucImena(row.full_name);
      if (!key) return;
      if (!grouped[key]) grouped[key] = { dopust: [], omejitve: [] };
      if (row.kind === "ld") grouped[key].dopust.push(row.work_date);
      else grouped[key].omejitve.push(row.work_date);
    });
    return grouped;
  };

  const uporabiVZelja = (izZelja) => {
    setRoster(r => r.map(z => {
      let dopust = "", omejitve = "";
      const zadetek = izZelja && izZelja[kljucImena(z.ime)];
      if (zadetek) {
        dopust = zadetek.dopust.join(",");
        omejitve = zadetek.omejitve.join(",");
      }
      return { ...z, dopust, omejitve, odsotnosti:"" };
    }));
  };

  useEffect(() => {
    nalozizDezurniKader(startISO).then(r => {
      setRoster(r);
      nalozitIzZelja(month).then(izZelja => { if (izZelja && Object.keys(izZelja).length) uporabiVZelja(izZelja); });
    });
    // eslint-disable-next-line
  }, []);

  // Skupno za CSV / Excel / Google Sheets / ročno urejeno PDF-besedilo.
  const uporabiVrsticeOmejitev = (vrsteVrstic, viraOpis) => {
    const posodobitve = {};
    vrsteVrstic.forEach(deli => {
      const ime = (deli[0] || "").trim().toUpperCase();
      if (!ime || ["IME","FULL_NAME"].includes(ime)) return; // preskoči morebitno glavo
      const dopust = (deli[1] || "").trim().split(";").map(s => s.trim()).filter(Boolean).join(",");
      const omejitve = (deli[2] || "").trim().split(";").map(s => s.trim()).filter(Boolean).join(",");
      posodobitve[ime] = { dopust, omejitve };
    });
    setRoster(r => r.map(z => posodobitve[z.ime] ? { ...z, dopust: posodobitve[z.ime].dopust, omejitve: posodobitve[z.ime].omejitve } : z));
    const neujemajoci = Object.keys(posodobitve).filter(ime => !roster.some(z => z.ime === ime));
    setUvozMsg(`Uvoženo ${Object.keys(posodobitve).length} vrstic iz ${viraOpis}.` + (neujemajoci.length ? ` Neprepoznana imena (preskočeno): ${neujemajoci.join(", ")}.` : ""));
  };

  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null); setPdfBesedilo(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") {
        setPdfBesedilo(vrsteVrstic.map(v => v[0]).join("\n"));
        setUvozMsg(`Iz PDF-ja izvlečenih ${vrsteVrstic.length} vrstic golega besedila – preveri/uredi spodaj v obliko "ime,dopust,omejitve" pred uvozom. Če je PDF povsem barvna preglednica brez besedilnih datumov (kot "Letni dopusti in omejitve"), to ne bo delovalo – pošlji jo Claude Code seji.`);
      } else {
        uporabiVrsticeOmejitev(vrsteVrstic, `datoteke "${file.name}"`);
      }
    } catch (e) {
      setUvozMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziIzGoogleSheet = async () => {
    if (!gsheetUrl.trim()) return;
    setUvozBusy(true); setUvozMsg(null);
    try {
      const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(gsheetUrl.trim());
      uporabiVrsticeOmejitev(vrsteVrstic, "Google Sheets");
    } catch (e) {
      setUvozMsg("Napaka pri branju Google Sheets: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziUrejenoPdfBesedilo = () => {
    if (!pdfBesedilo) return;
    const vrsteVrstic = window.ImportUtils.csvBesedilaVVrstice(pdfBesedilo);
    uporabiVrsticeOmejitev(vrsteVrstic, "urejenega PDF besedila");
    setPdfBesedilo(null);
  };

  // Kaj je za ta mesec ŽE objavljeno - te dneve generator ne premeša.
  // Brez tega je ponovno generiranje sredi meseca prerazporedilo tudi
  // tisti del, ki je bil že potrjen in sporočen ljudem.
  const nalozitObjavljena = async (mesec) => {
    const { startISO: s2, endISO: e2 } = monthRange(mesec);
    const { data } = await client.from("schedule_entries")
      .select("work_date, shift_code, profiles!employee_id(full_name)")
      .eq("department_code", "DEZ").gte("work_date", s2).lte("work_date", e2);
    const m = {};
    (data || []).forEach(r => {
      if (!r.profiles || !jeDezurstvoSifra(r.shift_code)) return;
      m[r.work_date] = (r.profiles.full_name || "").toUpperCase();
    });
    return m;
  };

  const generiraj = async () => {
    const staff = roster.map(z => ({
      ime: z.ime,
      obstojeceStevilo: Number(z.stevilo) || 0,
      zadnjeDezurstvo: z.zadnje || null,
      odsotnosti: z.odsotnosti.split(",").map(s => s.trim()).filter(Boolean),
      dopust: z.dopust.split(",").map(s => s.trim()).filter(Boolean),
      omejitve: z.omejitve.split(",").map(s => s.trim()).filter(Boolean),
      prostDanVTednu: z.prostDanVTednu || null,
      minMesecno: z.minMesecno === "" ? null : Number(z.minMesecno),
      maxMesecno: z.maxMesecno === "" ? null : Number(z.maxMesecno),
      samoMedTednom: !!z.samoMedTednom,
    }));
    const zakleni = zakleniObjavljeno ? await nalozitObjavljena(month) : {};
    setZaklenjeni(zakleni);
    const res = Generator.generirajDezurstva({
      startISO, endISO, minRazmikDni: Number(minRazmik), prostDanPoDezurstvu: prostDan,
      maxVikendMesecno: maxVikend, staff, zaklenjeni: zakleni,
    });
    setRezultat({ mesec: month, staff, ...res });
  };

  // Ročni popravek posameznega dne. Kršitve se preračunajo za CEL mesec -
  // ena zamenjava spremeni razmike tudi pri drugih dnevih iste osebe.
  const nastaviDezurnega = (datum, ime) => {
    setRezultat(r => {
      if (!r) return r;
      const razpored = r.razpored.map(x => x.datum === datum
        ? Object.assign({}, x, { zaposleni: ime || null, rocno: true, sila: false }) : x);
      const preverba = {};
      Generator.preveriDezurstva({
        razpored, staff: r.staff, minRazmikDni: Number(minRazmik), maxVikendMesecno: maxVikend,
      }).forEach(p => { preverba[p.datum] = p.krsitve; });
      return Object.assign({}, r, {
        razpored: razpored.map(x => Object.assign({}, x, { krsitve: preverba[x.datum] || [] })),
      });
    });
    setPublishMsg(null);
  };

  const prenesi = () => {
    if (!rezultat) return;
    download(`dezurstva-${rezultat.mesec}.json`, JSON.stringify(rezultat, null, 1));
  };

  const objavi = async () => {
    if (!rezultat) return;
    setPublishBusy(true); setPublishMsg(null);
    try {
      // Objavi se UREJEN razpored (r.zaposleni je lahko ročno popravljen).
      const brezDezurnega = rezultat.razpored.filter(r => !r.zaposleni).length;
      const rows = rezultat.razpored.filter(r => r.zaposleni).map(r => ({ ime: r.zaposleni, datum: r.datum, sifra: "DEŽURSTVO" }));
      const { objavljeno, manjkajo, oddelekNapaka, obvestilaNapaka } = await publishScheduleRows("DEZ", rows);
      setPublishMsg({ ok:true, text: `Objavljeno ${objavljeno} dežurstev v Supabase.`
        + (brezDezurnega ? ` Pozor: ${brezDezurnega} dni je ostalo brez dežurnega.` : "") + (manjkajo.length ? ` Brez računa (preskočeno): ${manjkajo.join(", ")}.` : "") + (oddelekNapaka ? ` Opozorilo: samodejna nastavitev oddelka ni uspela (${oddelekNapaka}).` : "") + (obvestilaNapaka ? ` Opozorilo: obvestila zaposlenim niso bila poslana (${obvestilaNapaka}).` : "") });
    } catch (e) {
      setPublishMsg({ ok:false, text: e.message || String(e) });
    } finally {
      setPublishBusy(false);
    }
  };

  const maxNovih = rezultat ? Math.max(1, ...rezultat.stanje.map(s => s.novih)) : 1;

  return (
    <div>
      <h2 className="section no-print">1 · Dežurni kader – stanje ob začetku meseca</h2>
      <p className="hint no-print">Članstvo (kdo je dežurni kader) pride živo iz Imenika (oddelek »DEZ«). Število in datum zadnjega dežurstva se izračunata samodejno: zaprta zgodovina do 31. 8. 2026 + vse, kar je od takrat objavljeno v Supabase – po potrebi ju spodaj ročno popravite samo za to generiranje. Dopust/omejitve pridejo iz razpredelnice Želje in se ob spremembi meseca samodejno znova naložijo. "Enota" z vrednostjo "?" pomeni, da domači oddelek osebe ni nastavljen v Imeniku. Ločite "Dopust (rdeče)" od "Omejitve (rumeno)": pri dopustu generator samodejno blokira tudi dan pred začetkom vsakega strnjenega bloka (in petek, če se blok začne v ponedeljek – sobota vmes ostane prosta), pri navadnih omejitvah pa samo naveden dan. "Min/Maks na mesec" in "Prost dan"/"Samo med tednom" so privzeto iz Imenika (HR podatki), tu jih lahko za to generiranje spremenite.</p>
      {!roster ? <p className="hint no-print">Nalagam dežurni kader …</p> : (
      <React.Fragment>
      <ManjkajociDezurni roster={roster} />
      <PravicnostPregled roster={roster} />
      <div className="card no-print" style={{marginBottom:12}}>
        <RazporedUvozVir ikona="📄" naziv="Omejitve za dežurstva"
          opis="CSV / Excel / PDF – ime, dopust, omejitve"
          onClick={() => uvozRef.current && uvozRef.current.click()} />
        <input ref={uvozRef} type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}}
          onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={uvozBusy} onClick={() => uvozRef.current && uvozRef.current.click()}>
          {uvozBusy ? "Nalagam …" : "📤 Uvoz omejitev iz datoteke (CSV / Excel / PDF)"}
        </button>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>
          Oblika CSV/Excel: vsaka vrstica <code>ime,dopust,omejitve</code> (ime kot v tabeli spodaj; več datumov v enem
          polju ločenih s podpičjem, npr. <code>2026-09-01;2026-09-02</code>). Primer:
          roster/omejitve-september-2026.csv. PDF z besedilnimi datumi se da uvoziti prek spodnjega pregleda; povsem
          barvna preglednica brez besedila (kot "Letni dopusti in omejitve") žal še vedno ni samodejno berljiva –
          pošlji jo Claude Code seji.
        </p>

// ---------------------------------------------------------------------
// VodjeTab – mesečna zasedenost 22 vodij/nosilcev oddelkov (iz "Predloga
// razporeda vodje NZV"). Za razliko od Kalupa/Dežurstev to ni rotacijski
// generator: vsak vodja je vsak delavnik privzeto na SVOJIH ENOTAH
// (stolpec lead_departments.enote, ki je lahko sestavljen: "UA/SA/B2"),
// razen če ima za ta dan LD/BS/STI vnos v razpredelnici "Želje"
// (leave_entries) – takrat se to prikaže v ustreznem stolpcu namesto
// oddelka. Stolpec DEŽURSTVO se prekriva z generatorjem dežurstev (če je
// bil za ta mesec že objavljen v Supabase, se prebere od tam).
function kratica(imePolno){
  const prvaBeseda = (imePolno || "").trim().split(/\s+/)[0] || "";
  return prvaBeseda.slice(0, 3).toUpperCase();
}
const LEAVE_KOLONA = { ld: "LD", bs: "BS", sti: "IZOB" }; // "omejitev" nima lastnega stolpca (glej opombo v UI)
// Isti trije stolpci, gledani z druge strani: kateri stolpec v mreži NI
// enota, ampak odsotnost. Pri ročnem popravku odloči, ali gre oseba na
// enoto ("PRISOTEN" + oddelek stolpca) ali v odsotnost (šifra = stolpec).
const ODSOTNOSTNI_STOLPCI = Object.fromEntries(Object.values(LEAVE_KOLONA).map(k => [k, true]));

// Ročno prepisane celice mreže NZV -> zapisi za objavo.
//
// Koordinator v mreži celico prepiše na roko (tako je delal v Sheets in tako
// dela naprej). Doslej je tak popravek spremenil samo prikaz in izvoz, objava
// pa je šla po IZRAČUNANEM - na zaslonu si torej videl eno, zaposleni pa je
// dobil drugo. Da se popravek lahko objavi, ga je treba prebrati nazaj v
// konkretne osebe (skupni NzvZasedba.razberiCelico: kratica "BOJ" ali celo
// ime "Bojić Matej").
//
// Vrne:
//   spremenjene  ključi "datum|stolpec", ki jih je človek prepisal - za te
//                se IZRAČUNANI zapisi umaknejo (tudi kadar je celico
//                izpraznil: prazno pomeni "tu ni nikogar", ne "pusti staro"),
//   vrstice      zapisi, prebrani iz prepisanega besedila,
//   tezave       kar ni bilo ENOLIČNO prepoznano; to se NE objavi in se
//                izrecno pove - tiho ugibanje, kdo je "BOJ", je pri
//                razporedu nevarnejše od jasnega opozorila.
function rocniPopravkiVMrezi(opts){
  const dnevi = opts.dnevi || [], stolpci = opts.stolpci || [];
  const popravki = opts.popravki || {}, nosilci = opts.nosilci || [];
  const spremenjene = new Set();
  const vrstice = [];
  const tezave = [];
  const kljuc = window.Imena.kljuc;
  const lastniOddelek = {};
  nosilci.forEach(v => { lastniOddelek[kljuc(v.full_name)] = v.department_code; });

  dnevi.forEach(dn => {
    stolpci.forEach(stolpec => {
      const key = dn.datum + "|" + stolpec;
      if (popravki[key] == null) return;
      const besedilo = String(popravki[key]).trim();
      if (besedilo === String(dn.celice[stolpec] || "").trim()) return;
      spremenjene.add(key);
      if (!besedilo) return;                     // izpraznjena celica: samo umik
      if (stolpec === "DEZURSTVO") {
        tezave.push(window.Datum.slo(dn.datum) + " · DEŽURSTVO: dežurstva se objavijo v zavihku »Dežurstva«, tu ne");
        return;
      }
      const razbrano = window.NzvZasedba.razberiCelico({ besedilo, nosilci, kljuc, kratica });
      razbrano.neznani.forEach(t => tezave.push(window.Datum.slo(dn.datum) + " · " + stolpec + ": »" + t + "« – ni prepoznano ime ali kratica"));
      razbrano.dvoumni.forEach(t => tezave.push(window.Datum.slo(dn.datum) + " · " + stolpec + ": »" + t + "« – kratica ustreza več osebam"));
      razbrano.osebe.forEach(ime => {
        vrstice.push(ODSOTNOSTNI_STOLPCI[stolpec]
          ? { ime, datum: dn.datum, sifra: stolpec, department_code: lastniOddelek[kljuc(ime)], predlog: false, stolpec }
          : { ime, datum: dn.datum, sifra: "PRISOTEN", department_code: stolpec, predlog: false, stolpec, jeEnota: true });
      });
    });
  });
  return { spremenjene, vrstice, tezave };
}

function VodjeTab({ zacetniMesec }){
  const [month, setMonth] = useState(zacetniMesec || "2026-09");
  const [vodje, setVodje] = useState(null);
  const [oddelki, setOddelki] = useState([]);
  const [rezultat, setRezultat] = useState(null);
  const [nalagam, setNalagam] = useState(false);
  const [publishBusy, setPublishBusy] = useState(false);
  const [publishMsg, setPublishMsg] = useState(null);
  // Ročni popravki po izračunu: "datum|stolpec" -> besedilo (prepiše prikaz
  // in izvoz, NE pa objave v Supabase, ker se poljubnega besedila ne da
  // zanesljivo preslikati nazaj na eno osebo/employee_id).
  const [popravki, setPopravki] = useState({});
  // Prosto besedilo "Izjeme in opombe" na dan (ne na osebo/stolpec).
  const [izjeme, setIzjeme] = useState({});
  // Nadomeščanja, ki jih je izračunal generator, so PREDLOGI: v mrežo se
  // izpišejo (z vprašajem in rumeno), objavijo pa se šele, ko jih
  // koordinator potrdi. Tako je razpored povsod izračunan po istih
  // pravilih, v bazo pa nič ne gre mimo človeka.
  const [potrjeni, setPotrjeni] = useState({});
  const [vrzeliMsg, setVrzeliMsg] = useState(null);
  const wardRef = useRef();

  useEffect(() => {
    client.from("lead_departments").select("*").order("full_name").then(({ data }) => setVodje(data || []));
    client.from("departments").select("code, name").order("code").then(({ data }) => setOddelki(data || []));
  }, []);

  const imeOddelka = {};
  oddelki.forEach(o => { imeOddelka[o.code] = o.name; });

  const generiraj = async () => {
    if (!vodje) return;
    setNalagam(true);
    const { startISO, endISO } = monthRange(month);
    const [{ data: leaveRows }, { data: dezRows }, { data: pariRows }, { data: nastRows }] = await Promise.all([
      client.from("leave_entries").select("full_name, work_date, kind").gte("work_date", startISO).lte("work_date", endISO),
      // "profiles!employee_id(...)": schedule_entries ima tri tuje ključe na
      // profiles (employee_id, created_by, updated_by), zato nedoločen
      // vgnezden zapis PostgREST zavrne kot dvoumen in vrne napako namesto
      // vrstic - dežurstva v razporedu vodij so zato ostala prazna. Isti
      // popravek kot v nalozizPodatkeNzv (index.html).
      client.from("schedule_entries").select("work_date, profiles!employee_id(full_name)").eq("department_code", "DEZ")
        .gte("work_date", startISO).lte("work_date", endISO),
      // Nadomeščanja in nastavitve SA: doslej ju generator NI bral, zato je
      // delal po drugih pravilih kot prikaz v Imeniku/Razporedu.
      client.from("nadomescanja").select("*").then(r => r, () => ({ data: [] })),
      client.from("nzv_nastavitve").select("*").then(r => r, () => ({ data: [] })),
    ]);
    // Ključ prek imena.js in NE surovega imena: lead_departments ima imena
    // z VELIKIMI črkami ("ALUKIĆ DINO"), leave_entries pa tako, kot so v
    // Imeniku ("Alukić Dino"). Iskalo se je z leaveMap[v.full_name + "|" +
    // iso], torej ime iz ene tabele proti ključu iz druge - zadetka ni bilo
    // NIKOLI in generator NZV je osebo na dopustu vseeno razporedil na
    // enoto. Uporabnik je to opazil na oktobru 2026: Alukić, Arnež in
    // Džamastagić so bili 1. in 2. 10. rdeči (LD), v razporedu pa na
    // svojih enotah.
    const leaveMap = {};
    (leaveRows || []).forEach(r => {
      leaveMap[window.Imena.kljuc(r.full_name) + "|" + r.work_date] = r.kind;
    });
    const dezMap = {};
    (dezRows || []).forEach(r => { if (r.profiles) dezMap[r.work_date] = r.profiles.full_name; });
    const saNast = window.NzvZasedba.saNastavitveIz(nastRows || []);

    const kljucIme = window.Imena.kljuc;
    const NZ = window.NzvZasedba;
    const veljavne = NZ.KODE_STOLPCEV;

    // Odsotnost za izračun: enodnevni LD/BS/STI iz Želja + daljša
    // odsotnost (porodniška …) iz lead_departments. "Omejitev" (rumena)
    // NI odsotnost - tisti dan oseba dela, koordinator le presodi obseg.
    const poImenu = {};
    vodje.forEach(v => { poImenu[kljucIme(v.full_name)] = v; });
    const jeOdsotenNa = (ime, iso) => {
      const v = poImenu[kljucIme(ime)];
      if (v && NZ.trajnoOdsoten(v, iso)) return true;
      const kind = leaveMap[kljucIme(ime) + "|" + iso];
      return !!(kind && LEAVE_KOLONA[kind]);
    };

    // Stalna (nemotena) zasedba istega dne - potrebujemo jo, da vemo, KAJ
    // je predlog: enota, na kateri oseba tisti dan ne bi bila, če ne bi
    // nihče manjkal.
    const lastneKode = {};
    vodje.forEach(v => { lastneKode[kljucIme(v.full_name)] = new Set(NZ.enoteVKode(v.enote, null, veljavne)); });

    const nd = danovVMesecu2(month);
    const dnevi = [];
    const objavaVrstice = [];
    const predlogi = [];
    for (let d = 1; d <= nd; d++) {
      const iso = isoZaMesec(month, d);
      const isVikend = window.Prazniki.jeVikend(iso);
      const isPraznik = window.Prazniki.jePraznik(iso);
      const vrstica = { datum: iso, dan: window.Datum.dan3(iso), celice: {}, predlogCelice: {} };
      const dodaj = (kol, besedilo) => {
        vrstica.celice[kol] = ((vrstica.celice[kol] || "") + " " + besedilo).trim();
      };

      // Odsotnosti gredo v svoje stolpce (LD/IZOB/BS) ne glede na vikend.
      vodje.forEach(v => {
        if (NZ.trajnoOdsoten(v, iso)) {
          const kol = NZ.dolgaOdsotnostKratica(v) || "LD";
          dodaj(kol, kratica(v.full_name) + "*");
          return;
        }
        if (isVikend || isPraznik) return;
        const kind = leaveMap[window.Imena.kljuc(v.full_name) + "|" + iso];
        if (kind && LEAVE_KOLONA[kind]) {
          const kol = LEAVE_KOLONA[kind];
          dodaj(kol, kratica(v.full_name));
          objavaVrstice.push({ ime: v.full_name, datum: iso, sifra: kol, department_code: v.department_code, predlog: false, stolpec: kol });
        }
      });

      // Zasedenost enot: ISTO pravilo kot v Imeniku in na Razporedu.
      if (!isVikend && !isPraznik) {
        NZ.razporedDneva({
          nosilci: vodje,
          pari: pariRows || [],
          kljuc: kljucIme,
          jeOdsoten: ime => jeOdsotenNa(ime, iso),
          saKoda: NZ.saStolpec(iso, saNast),
          veljavne,
        }).forEach(({ nosilec, kode }) => {
          const svoje = lastneKode[kljucIme(nosilec.full_name)] || new Set();
          kode.forEach(kol => {
            // Enota, ki ni njegova, je posledica nadomeščanja - to je
            // PREDLOG in se objavi šele, ko ga koordinator potrdi.
            const jePredlog = !svoje.has(kol);
            dodaj(kol, kratica(nosilec.full_name) + (jePredlog ? "?" : ""));
            const kljucCelice = iso + "|" + kol + "|" + nosilec.full_name;
            if (jePredlog) {
              vrstica.predlogCelice[kol] = true;
              predlogi.push({ kljuc: kljucCelice, datum: iso, stolpec: kol, ime: nosilec.full_name });
            }
            objavaVrstice.push({
              ime: nosilec.full_name, datum: iso, sifra: "PRISOTEN",
              department_code: kol, predlog: jePredlog, kljuc: kljucCelice, stolpec: kol, jeEnota: true,
            });
          });
        });
      }

      const dezOseba = dezMap[iso];
      if (dezOseba) vrstica.celice["DEZURSTVO"] = kratica(dezOseba);
      dnevi.push(vrstica);
    }
    // Stolpci: vsi iz uradne predloge, ki so ta mesec dejansko v uporabi.
    const uporabljeni = new Set();
    dnevi.forEach(dn => Object.keys(dn.celice).forEach(k => uporabljeni.add(k)));
    const stolpciOddelkov = veljavne.filter(k => uporabljeni.has(k));

    setRezultat({ mesec: month, stolpci: stolpciOddelkov, dnevi, objavaVrstice, predlogi, saNast, jeOdsotenNa });
    setPotrjeni({});
    setPopravki({});
    setIzjeme({});
    setVrzeliMsg(null);
    setNalagam(false);
  };

  const celica = (dn, k) => {
    const key = dn.datum + "|" + k;
    return popravki[key] != null ? popravki[key] : (dn.celice[k] || "");
  };
  const nastaviPopravek = (dn, k, vrednost) => {
    setPopravki(p => ({ ...p, [dn.datum + "|" + k]: vrednost }));
  };

  // Ročni popravki: preračun je v rocniPopravkiVMrezi (nad komponento),
  // da se ga da preizkusiti brez brskalnika.
  const spremenjeneCelice = () => rezultat
    ? rocniPopravkiVMrezi({ dnevi: rezultat.dnevi, stolpci: stolpciPrikaz, popravki, nosilci: vodje }).spremenjene
    : new Set();
  const vrsticeIzPopravkov = () => rezultat
    ? rocniPopravkiVMrezi({ dnevi: rezultat.dnevi, stolpci: stolpciPrikaz, popravki, nosilci: vodje })
    : { vrstice: [], tezave: [], spremenjene: new Set() };

  // "Predlagaj mesec": poišče vrzeli (enota, ki je ta mesec v uporabi, a je
  // tisti delovni dan nihče ne pokriva) in za vsako predlaga osebo. Uporabnik:
  // "načeloma je tako, da se na koncu Denis Džamastagić odloči in izpolni
  // manjkajoče vrzeli" - zato ostane odločitev njegova: predlogi se izpišejo
  // v mrežo z vprašajem in rumeno ter se objavijo šele po potrditvi.
  const predlagajVrzeli = () => {
    if (!rezultat) return;
    const noviPredlogi = window.NzvZasedba.predlagajZapolnitev({
      dnevi: rezultat.dnevi,
      stolpci: stolpciPrikaz,
      nosilci: vodje,
      kljuc: window.Imena.kljuc,
      kratica,
      jeOdsoten: rezultat.jeOdsotenNa,
      saKodaZa: (iso) => window.NzvZasedba.saStolpec(iso, rezultat.saNast),
      jeProstDan: (iso) => window.Prazniki.jeVikend(iso) || window.Prazniki.jePraznik(iso),
    });
    if (!noviPredlogi.length) { setVrzeliMsg("Ni vrzeli – vsaka enota ima ta mesec vsak delovni dan pokritje."); return; }
    // Predlogi gredo po ISTI poti kot predlogi nadomeščanja: v mrežo, v
    // seznam za potrditev in šele od tam v objavo.
    setRezultat(r => {
      const poDatumu = {};
      r.dnevi.forEach(dn => { poDatumu[dn.datum] = dn; });
      const dodaniPredlogi = [];
      const dodaneVrstice = [];
      noviPredlogi.forEach(pr => {
        const dn = poDatumu[pr.datum];
        if (!dn) return;
        const kljucCelice = pr.datum + "|" + pr.stolpec + "|" + pr.ime;
        dn.celice[pr.stolpec] = kratica(pr.ime) + "?";
        dn.predlogCelice[pr.stolpec] = true;
        dodaniPredlogi.push({ kljuc: kljucCelice, datum: pr.datum, stolpec: pr.stolpec, ime: pr.ime, vrzel: true });
        dodaneVrstice.push({ ime: pr.ime, datum: pr.datum, sifra: "PRISOTEN", department_code: pr.stolpec,
                             predlog: true, kljuc: kljucCelice, stolpec: pr.stolpec, jeEnota: true });
      });
      return { ...r,
        dnevi: r.dnevi.map(dn => ({ ...dn })),
        predlogi: [...r.predlogi, ...dodaniPredlogi],
        objavaVrstice: [...r.objavaVrstice, ...dodaneVrstice] };
    });
    setVrzeliMsg(`Predlaganih zapolnitev: ${noviPredlogi.length}. V mreži so rumene z vprašajem – potrdi tiste, ki jih želiš objaviti.`);
  };

  const izvoziCSV = () => {
    if (!rezultat) return;
    const glava = ["Datum", "Dan", ...stolpciPrikaz, "Izjeme in opombe"];
    const vrstice = rezultat.dnevi.map(dn => [
      dn.datum, dn.dan,
      ...stolpciPrikaz.map(k => celica(dn, k)),
      izjeme[dn.datum] || "",
    ]);
    const csv = [glava, ...vrstice]
      .map(vrsta => vrsta.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
      .join("\r\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `vodje-${rezultat.mesec}.csv`; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const objavi = async () => {
    if (!rezultat) return;
    setPublishBusy(true); setPublishMsg(null);
    try {
      // Kar je človek prepisal na roko, prevlada nad izračunanim za TISTO
      // celico - izračunani zapisi zanjo se umaknejo, na njihovo mesto
      // stopi prebrano besedilo. Ostale celice ostanejo izračunane.
      const spremenjene = spremenjeneCelice();
      const { vrstice: rocne, tezave } = vrsticeIzPopravkov();
      const izracunane = rezultat.objavaVrstice
        .filter(v => !spremenjene.has(v.datum + "|" + v.stolpec))
        // Nepotrjeni predlogi (nadomeščanja in zapolnitve vrzeli) se NE objavijo.
        .filter(v => !v.predlog || potrjeni[v.kljuc]);
      const preskoceniPredlogi = rezultat.objavaVrstice
        .filter(v => v.predlog && !potrjeni[v.kljuc] && !spremenjene.has(v.datum + "|" + v.stolpec)).length;
      const zaObjavo = [...izracunane, ...rocne];
      const { objavljeno, manjkajo, obvestilaNapaka } = await publishLeadScheduleRows(zaObjavo);
      setPublishMsg({ ok: tezave.length === 0, text: `Objavljeno ${objavljeno} vnosov v Supabase.`
        + (rocne.length ? ` Od tega iz ročnih popravkov: ${rocne.length}.` : "")
        + (preskoceniPredlogi ? ` Nepotrjenih predlogov (neobjavljenih): ${preskoceniPredlogi}.` : "")
        + (manjkajo.length ? ` Brez profila (preskočeno): ${manjkajo.join(", ")}.` : "")
        + (tezave.length ? ` Neobjavljeni ročni popravki – ${tezave.join("; ")}.` : "")
        + (obvestilaNapaka ? ` Opozorilo: obvestila zaposlenim niso bila poslana (${obvestilaNapaka}).` : "") });
    } catch (e) {
      setPublishMsg({ ok:false, text: e.message || String(e) });
    } finally {
      setPublishBusy(false);
    }
  };

  if (vodje === null) return <p className="hint">Nalagam …</p>;

  const stolpciPrikaz = rezultat ? [...rezultat.stolpci, "LD", "IZOB", "BS", "DEZURSTVO"] : [];

  return (
    <div>
      <h2 className="section">Vodje / nosilci oddelkov – mesečna zasedenost</h2>
      <p className="hint">
        22 vodij/nosilcev oddelkov (iz »Predloga razporeda vodje NZV«). Vsak je ob delavnikih privzeto na svojih
        enotah; LD/BS/STI vnosi iz razpredelnice »Želje« ga premaknejo v ustrezen stolpec namesto enote
        (STI je prikazan pod »IZOB«). »Omejitev« (rumena) nima lastnega stolpca v izvirni predlogi – te dni presodi
        koordinator ročno. Ob odsotnosti se nadomeščanje izračuna po istih pravilih kot v Imeniku → Razpredelnica:
        nadomeščevalec prevzame enoto odsotnega, in če njegove lastne enote nima kdo prevzeti, jo obdrži poleg
        prevzete. Taka celica je označena z vprašajem in rumeno – to je PREDLOG in se objavi šele, ko ga potrdiš
        v seznamu nad mrežo. Zvezdica (*) ob kratici pomeni daljšo odsotnost (npr. porodniška), ne enodnevno LD/BS.
        Stolpec DEŽURSTVO se prekriva z dežurnim generatorjem, če je ta mesec že objavljen. Po izračunu lahko
        katero koli celico ročno prepišeš (npr. za nadomeščanje) – <b>tak popravek se tudi objavi</b>. Vpišeš lahko
        kratico (»BOJ«) ali celo ime (»Bojić Matej«), več oseb v isti celici loči presledek ali vejica; prazna celica
        pomeni, da tam ni nikogar. Česar ni mogoče enolično prepoznati, se ne objavi in ti to piše po objavi. Stolpec "Izjeme in opombe" je za splošne dnevne opombe.
      </p>
      <div className="card no-print">
        <div className="row">
          <div className="field"><label htmlFor="vmonth">Mesec</label>
            <input id="vmonth" type="month" value={month} onChange={e => { setMonth(e.target.value); setRezultat(null); }} />
          </div>
        </div>
        <button className="genBtn" style={{marginTop:10}} onClick={generiraj} disabled={nalagam}>{nalagam ? "Nalagam …" : "Izračunaj zasedenost"}</button>
      </div>

      {rezultat && (
        <div className="card no-print">
          <button className="btn" onClick={predlagajVrzeli}>🧩 Predlagaj mesec (zapolni vrzeli)</button>
          <p className="hint" style={{margin:"8px 0 0"}}>
            Poišče enote, ki jih ta mesec kak delovni dan nihče ne pokriva, in za vsako predlaga osebo, ki je
            tisti dan prisotna in ima najmanj enot. Predlogi se izpišejo rumeno z vprašajem in se objavijo
            <b> šele, ko jih potrdiš</b> – zadnja beseda ostane tvoja.
          </p>
          {vrzeliMsg && <p className="hint" style={{marginBottom:0}}>{vrzeliMsg}</p>}
        </div>
      )}

      {rezultat && rezultat.predlogi.length > 0 && (
        <div className="card no-print" style={{borderColor:"var(--accent)"}}>
          <h3 style={{margin:"0 0 6px", fontSize:15}}>
            Predlogi nadomeščanja ({rezultat.predlogi.filter(pr => potrjeni[pr.kljuc]).length}/{rezultat.predlogi.length} potrjenih)
          </h3>
          <p className="hint" style={{marginTop:0}}>
            Te enote so izračunane po pravilih nadomeščanja (ista, kot jih kaže Imenik → Razpredelnica).
            V mreži so označene z vprašajem in rumeno. <b>Objavijo se šele, ko jih potrdiš.</b>
          </p>
          <div style={{display:"flex", gap:8, marginBottom:8}}>
            <button className="btn btn-sm" onClick={() => {
              const vsi = {}; rezultat.predlogi.forEach(pr => { vsi[pr.kljuc] = true; }); setPotrjeni(vsi);
            }}>Potrdi vse</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setPotrjeni({})}>Počisti</button>
          </div>
          <div style={{maxHeight:220, overflowY:"auto"}}>
            {rezultat.predlogi.map(pr => (
              <label key={pr.kljuc} style={{display:"flex", alignItems:"center", gap:8, fontSize:12, padding:"3px 0"}}>
                <input type="checkbox" checked={!!potrjeni[pr.kljuc]}
                  onChange={e => setPotrjeni(t => ({ ...t, [pr.kljuc]: e.target.checked }))} />
                <span><b>{window.Datum.slo(pr.datum)}</b> · {pr.stolpec} · {pr.ime}
                  {pr.vrzel && <span className="hint" style={{marginLeft:6}}>(vrzel)</span>}</span>
              </label>
            ))}
          </div>
        </div>
      )}

      {rezultat && (
        <React.Fragment>
          <div className="wardScroller" ref={wardRef}>
            <table className="wardTable">
              <thead>
                <tr>
                  <th className="name">Datum</th>
                  {stolpciPrikaz.map(k => <th key={k}>{imeOddelka[k] ? k : k}</th>)}
                  <th>Izjeme in opombe</th>
                </tr>
              </thead>
              <tbody>
                {rezultat.dnevi.map(dn => (
                  <tr key={dn.datum}>
                    <td className="name">{window.Datum.slo(dn.datum)} {dn.dan}</td>
                    {stolpciPrikaz.map(k => (
                      <td key={k}>
                        <input type="text" value={celica(dn, k)} onChange={e => nastaviPopravek(dn, k, e.target.value)}
                          title={dn.predlogCelice[k] ? "Predlog nadomeščanja – objavi se šele po potrditvi zgoraj" : undefined}
                          style={{width:44, textAlign:"center",
                            background: dn.predlogCelice[k] ? "rgba(var(--predlog-rgb),.55)"
                              : (celica(dn,k) ? "rgba(var(--accent-rgb),.18)" : "transparent"),
                            border: dn.predlogCelice[k] ? "1px solid var(--accent)" : "1px solid var(--line)",
                            borderRadius:6, fontSize:11, padding:"3px 2px"}} />
                      </td>
                    ))}
                    <td>
                      <input type="text" value={izjeme[dn.datum] || ""} onChange={e => setIzjeme(iz => ({...iz, [dn.datum]: e.target.value}))}
                        placeholder="–" style={{width:150, background:"transparent", border:"1px solid var(--line)", borderRadius:6, fontSize:11, padding:"3px 6px"}} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <RazporedIzvozVir
            naziv="NZV / vodje"
            pdf={{ label: "Izvozi v PDF (A4 ležeče, 1 stran)",
                   onClick: () => PrintFit.natisni(wardRef.current, { orientacija:"landscape" }) }}
            dodatno={[{ label: "Izvozi CSV", onClick: izvoziCSV }]}
            naslov={rezultat ? `vodje-${rezultat.mesec}` : "vodje"}
            pripravi={() => {
              if (!rezultat) throw new Error("Najprej ustvari razpored.");
              return [{
                ime: "Vodje",
                glave: ["Datum", "Dan", ...stolpciPrikaz, "Izjeme in opombe"],
                vrstice: rezultat.dnevi.map(dn => [
                  window.Datum.slo(dn.datum), dn.dan,
                  ...stolpciPrikaz.map(k => celica(dn, k)),
                  izjeme[dn.datum] || "",
                ]),
              }];
            }}
          />
          <button className="genBtn no-print" onClick={objavi} disabled={publishBusy} style={{marginTop:8}}>
            {publishBusy ? "Objavljam …" : "📤 Objavi neposredno v Supabase (z ročnimi popravki)"}
          </button>
          {publishMsg && <p className="hint no-print" style={{color: publishMsg.ok ? "var(--ok)" : "var(--danger)"}}>{publishMsg.text}</p>}
        </React.Fragment>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// Ujemanje imen med viri je v imena.js - en sam vir za vse zaslone. Ta
// različica je bila najbolj stroga od štirih (ni prenesla ne izgubljenih
// strešic ne potrjenih tipkarskih napak iz uradnih predlog), zato je tu
// kdo ostal nepovezan, čeprav se je na drugih zaslonih našel.
const imenaSeUjemataAdmin = window.Imena.seUjemata;

// Trije stalni administratorji (na izrecno, trajno navodilo) – nikoli se ne
// ponastavijo na "Zaposleni", tudi ne pri množičnem ponastavljanju spodaj.
const STALNI_ADMINI = ["ALUKIĆ DINO", "BOJIĆ MATEJ", "DŽAMASTAGIĆ DENIS"];

// Barvne značke vlog: administrator izstopa (rdeče), vodja poudarjeno
// (zlato), zaposleni nevtralno - da je v dolgem seznamu na prvi pogled
// vidno, kdo ima povišane pravice.
const VLOGA_NAZIV = { user: "Zaposleni", vodja: "Vodja", admin: "Administrator" };

function UporabnikiTab(){
  const [profili, setProfili] = useState(null);
  const [oddelki, setOddelki] = useState([]);
  const [status, setStatus] = useState({});
  const [uvozMsg, setUvozMsg] = useState(null);
  const [uvozBusy, setUvozBusy] = useState(false);
  const [ponastaviBusy, setPonastaviBusy] = useState(false);
  const [ponastaviMsg, setPonastaviMsg] = useState(null);
  const uvozRef = useRef();

  const reload = () => {
    client.from("profiles").select("id, full_name, role, department_code").order("full_name").then(({ data }) => setProfili(data || []));
    client.from("departments").select("code, name").in("code", RAZPORED_ODDELKI).order("code")
      .then(({ data }) => setOddelki(data || []));
  };
  useEffect(() => { reload(); }, []);

  const posodobi = async (id, patch) => {
    setStatus(s => ({ ...s, [id]: "shranjujem …" }));
    const { error } = await client.from("profiles").update(patch).eq("id", id);
    setStatus(s => ({ ...s, [id]: error ? ("napaka: " + error.message) : "shranjeno" }));
    setProfili(list => list.map(p => p.id === id ? { ...p, ...patch } : p));
    return error;
  };

  // Množično ponastavi vlogo/oddelek vsem RAZEN treh stalnih administratorjev
  // (na izrecno željo). Prijava (e-pošta/geslo) ostane nedotaknjena – ureja se
  // samo public.profiles prek te iste, že delujoče prijavljene povezave, zato
  // ni tveganja napačnega Supabase projekta kot pri ročnem SQL.
  const ponastaviVse = async () => {
    if (profili === null) return;
    const cilj = profili.filter(p => !STALNI_ADMINI.some(a => imenaSeUjemataAdmin(p.full_name, a)));
    if (!cilj.length) { setPonastaviMsg("Ni koga ponastaviti."); return; }
    if (!confirm(`Vsem uporabnikom RAZEN treh stalnih administratorjev (${cilj.length} oseb) bo vloga ponastavljena na "Zaposleni" in oddelek izbrisan. Prijava (e-pošta/geslo) ostane nespremenjena. Nadaljuj?`)) return;
    setPonastaviBusy(true); setPonastaviMsg(null);
    let ok = 0, napak = 0;
    for (const p of cilj) {
      const err = await posodobi(p.id, { role: "user", department_code: null });
      if (err) napak++; else ok++;
    }
    setPonastaviBusy(false);
    setPonastaviMsg(`Ponastavljenih ${ok} uporabnikov.` + (napak ? ` ${napak} napak.` : ""));
  };

  const uvoziVlogeOddelke = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setUvozMsg("V tem PDF-ju ni bilo mogoče prepoznati stolpcev (videti je kot navadno besedilo, ne preglednica) – uporabi CSV/Excel ali PDF s pravo tabelo."); return; }
      const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["full_name","role","department_code"], ["full_name","ime"]);
      let ok = 0, neujemajoci = [];
      for (const o of objekti) {
        if (!o.full_name) continue;
        const p = profili.find(pr => imenaSeUjemataAdmin(pr.full_name, o.full_name));
        if (!p) { neujemajoci.push(o.full_name); continue; }
        const patch = {};
        if (o.role && ["admin","vodja","user"].includes(o.role)) patch.role = o.role;
        if (o.department_code !== undefined && o.department_code !== "") patch.department_code = o.department_code;
        if (Object.keys(patch).length) { await posodobi(p.id, patch); ok++; }
      }
      setUvozMsg(`Posodobljenih ${ok} obstoječih uporabnikov.` + (neujemajoci.length ? ` Ni najdenih (oseba se še ni registrirala – uporabi Imenik): ${neujemajoci.join(", ")}.` : ""));
    } catch (e) {
      setUvozMsg("Napaka: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  if (profili === null) return <p className="hint">Nalagam …</p>;

  // Razvrsti po trenutnem (primarnem) oddelku, tako da premik nekoga v drug
  // oddelek spodaj takoj premakne njegovo vrstico v pravo skupino.
  const imeOddelka = { "": "Brez dodeljenega oddelka" };
  oddelki.forEach(o => { imeOddelka[o.code] = o.name; });
  const skupine = {};
  profili.forEach(p => {
    const k = p.department_code || "";
    (skupine[k] = skupine[k] || []).push(p);
  });
  const vrstniRedKod = [""].concat(oddelki.map(o => o.code)).filter((k, i, arr) => arr.indexOf(k) === i);
  const vseKode = Object.keys(skupine).sort((a, b) => vrstniRedKod.indexOf(a) - vrstniRedKod.indexOf(b));

  // Trenutna koda je lahko ena od starih, ki jih spodaj ne ponujamo več za
  // novo dodeljevanje (glej RAZPORED_ODDELKI) – če je oseba še ni ročno
  // popravila, jo prikažemo kot dodatno možnost, da izbirnik ne pade na
  // prazno/napačno vrednost.
  const OddelekSelect = ({ p }) => {
    const trenutnaZunaj = p.department_code && !oddelki.some(o => o.code === p.department_code);
    return (
      <select value={p.department_code || ""} onChange={e => posodobi(p.id, { department_code: e.target.value || null })}>
        <option value="">– brez oddelka –</option>
        {trenutnaZunaj && <option value={p.department_code}>{p.department_code} (opuščen – izberi nov oddelek)</option>}
        {oddelki.map(o => <option key={o.code} value={o.code}>{o.name}</option>)}
      </select>
    );
  };

  return (
    <div>
      <h2 className="section">Uporabniki in vloge</h2>
      <p className="hint">

        </p>

          Vsem RAZEN Alukić Dino, Bojić Matej in Džamastagić Denis ponastavi vlogo na "Zaposleni" in izbriše oddelek –
          kot da jih admin še ni uredil. Prijava (e-pošta/geslo) ostane nespremenjena.

            {imeOddelka[k] || k} <span style={{fontWeight:400, textTransform:"none"}}>({skupine[k].length})</span>
          </h3>
          <div className="card">
            {skupine[k].map(p => (
              <RazporedOsebaVrstica
                key={p.id}
                ime={p.full_name}
                naProfil={() => { window.location.href = "imenik.html?id=" + p.id; }}
                otroci={
                  <React.Fragment>
                    <div className="ovMeta">
                      <span className={"pill " + (p.role === "admin" ? "danger" : p.role === "vodja" ? "warn" : "muted")}>
                        {VLOGA_NAZIV[p.role] || p.role}
                      </span>
                      {status[p.id] && <span>{status[p.id]}</span>}
                    </div>
                    <div className="uporabnikPolja">
                      <div className="field">
                        <label>Vloga</label>
                        <select value={p.role} onChange={e => posodobi(p.id, { role: e.target.value })}>
                          <option value="user">Zaposleni</option>
                          <option value="vodja">Vodja ekipe</option>
                          <option value="admin">Administrator</option>

                      <div className="field">

            ))}
          </div>
        </div>
      ))}

  );
}

// ---------------------------------------------------------------------
// Dopust: mesečni uvoz stanja dopusta iz Kadrisa (ime, šifra zaposlenega/
// "Mat.št", leto, mesec, DOPUST) + pregled z mesečnim trendom. employee_code
// je edini stabilen ključ med meseci (zaporedna št. se spreminja, imena se
// včasih zapišejo drugače) - povezuje se s profile_hr_details.employee_code,
// če je znan, sicer poskusi ujemanje po imenu (vreča besed). Ob vsakem uvozu
// sprožilec v shemi drži profile_hr_details.leave_balance_days/asof
// usklajena z najnovejšim mesecem (Imenik torej vedno kaže isto stanje).
// ---------------------------------------------------------------------
const DOPUST_GLAVE_MAPA = {
  full_name: ["full_name", "priimek in ime", "ime in priimek", "ime"],
  employee_code: ["employee_code", "mat.št", "mat št", "mat.st", "mat st", "šifra zaposlenega", "sifra zaposlenega"],
  leto: ["leto", "year"],
  mesec: ["mesec", "month"],
  dnevi: ["dnevi", "dopust", "stanje", "stanje dopusta"],
};
const MESECI_SL2 = ["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];

function DopustTab(){
  const [obdobja, setObdobja] = useState(null);
  const [obdobje, setObdobje] = useState("");
  const [vrstice, setVrstice] = useState([]);
  const [iskanje, setIskanje] = useState("");
  const [sort, setSort] = useState({ polje: "full_name", smer: 1 });
  const [uvozBusy, setUvozBusy] = useState(false);
  const [uvozMsg, setUvozMsg] = useState(null);
  const [predogled, setPredogled] = useState(null); // { zapisi, leto, mesec, novih, spremenjenih, enakih, manjkajoci }
  const fileRef = useRef();

  const nalozi = async () => {
    const { data } = await client.from("leave_balance_obdobja").select("*");
    setObdobja(data || []);
    if (data && data.length && !obdobje) setObdobje(data[0].leto + "-" + data[0].mesec);
  };
  useEffect(() => { nalozi(); }, []);

  useEffect(() => {
    if (!obdobje) { setVrstice([]); return; }
    const [leto, mesec] = obdobje.split("-").map(Number);
    client.from("leave_balance_pregled").select("*").eq("leto", leto).eq("mesec", mesec)
      .then(({ data }) => setVrstice(data || []));
  }, [obdobje]);

  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null); setPredogled(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setUvozMsg("V tem PDF-ju ni bilo mogoče prepoznati stolpcev (videti je kot navadno besedilo, ne preglednica) – uporabi CSV/Excel ali PDF s pravo tabelo."); return; }
      const { objekti, najdeniStolpci } = window.ImportUtils.vVrsticeObjekteGlave(vrsteVrstic, DOPUST_GLAVE_MAPA);
      if (!najdeniStolpci.includes("employee_code") || !najdeniStolpci.includes("dnevi")) {
        setUvozMsg("V datoteki ni bilo mogoče najti stolpcev za šifro zaposlenega (Mat.št) in DOPUST.");
        return;
      }
      const zapisi = objekti
        .map(o => ({
          full_name: (o.full_name || "").trim().toUpperCase(),
          employee_code: (o.employee_code || "").trim(),
          leto: Number(o.leto) || null,
          mesec: Number(o.mesec) || null,
          dnevi: o.dnevi !== "" && !isNaN(Number(o.dnevi)) ? Number(o.dnevi) : null,
        }))
        .filter(z => z.employee_code && z.dnevi != null);
      if (!zapisi.length) { setUvozMsg("Datoteka ne vsebuje uporabnih vrstic."); return; }

      // Obdobje: iz datoteke, če ga ima; sicer trenutni mesec (admin lahko
      // pred potrditvijo popravi spodaj).
      const zdaj = new Date();
      const leto = zapisi.find(z => z.leto)?.leto || zdaj.getFullYear();
      const mesec = zapisi.find(z => z.mesec)?.mesec || (zdaj.getMonth() + 1);

      // Zadnje znano stanje vsake osebe (za primerjavo novo/spremenjeno/enako).
      const { data: zgodovina } = await client.from("leave_balance_history")
        .select("employee_code, leto, mesec, dnevi")
        .order("leto", { ascending: false }).order("mesec", { ascending: false });
      const zadnje = new Map();
      (zgodovina || []).forEach(r => { if (!zadnje.has(r.employee_code)) zadnje.set(r.employee_code, Number(r.dnevi)); });

      // Poveži z obstoječimi profili: najprej po employee_code
      // (profile_hr_details), sicer po imenu (vreča besed).
      const { data: hrPodatki } = await client.from("profile_hr_details").select("profile_id, employee_code");
      const { data: profili } = await client.from("profiles").select("id, full_name");
      const poEmployeeCode = new Map((hrPodatki || []).filter(h => h.employee_code).map(h => [h.employee_code, h.profile_id]));

      const zVsebino = zapisi.map(z => {
        let profile_id = poEmployeeCode.get(z.employee_code) || null;
        if (!profile_id) {
          const ujemanje = (profili || []).find(p => imenaSeUjemataAdmin(p.full_name, z.full_name));
          if (ujemanje) profile_id = ujemanje.id;
        }
        const prej = zadnje.has(z.employee_code) ? zadnje.get(z.employee_code) : undefined;
        const vrsta = prej === undefined ? "nov" : (prej !== z.dnevi ? "sprem" : "enako");
        return { ...z, leto, mesec, profile_id, prej, vrsta };
      });

      const obstojeci = await client.from("leave_balance_history").select("employee_code").then(r => new Set((r.data || []).map(x => x.employee_code)));
      const vNovem = new Set(zVsebino.map(z => z.employee_code));
      const { data: vsiZgodovina } = await client.from("leave_balance_history").select("employee_code, full_name").order("full_name");
      const znaniZaEnkrat = new Map();
      (vsiZgodovina || []).forEach(r => { if (!znaniZaEnkrat.has(r.employee_code)) znaniZaEnkrat.set(r.employee_code, r.full_name); });
      const manjkajoci = [...znaniZaEnkrat.entries()].filter(([koda]) => !vNovem.has(koda)).map(([, ime]) => ime);

      setPredogled({
        zapisi: zVsebino, leto, mesec,
        novih: zVsebino.filter(z => z.vrsta === "nov").length,
        spremenjenih: zVsebino.filter(z => z.vrsta === "sprem").length,
        enakih: zVsebino.filter(z => z.vrsta === "enako").length,
        manjkajoci,
      });
      setUvozMsg(`Prebranih ${zVsebino.length} vrstic iz "${file.name}" – preveri predogled spodaj pred potrditvijo.`);
    } catch (e) {
      setUvozMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const potrdiUvoz = async () => {
    if (!predogled) return;
    setUvozBusy(true);
    try {
      const { data: { user } } = await client.auth.getUser();
      const zapisi = predogled.zapisi.map(z => ({
        employee_code: z.employee_code, full_name: z.full_name, leto: predogled.leto, mesec: predogled.mesec,
        dnevi: z.dnevi, profile_id: z.profile_id, uvozeno: new Date().toISOString(), uvozil: user ? user.id : null,
      }));
      for (let i = 0; i < zapisi.length; i += 200) {
        const { error } = await client.from("leave_balance_history").upsert(zapisi.slice(i, i + 200), { onConflict: "employee_code,leto,mesec" });
        if (error) throw error;
      }
      setUvozMsg(`Uvoženih ${zapisi.length} vrstic za ${MESECI_SL2[predogled.mesec - 1]} ${predogled.leto}.`);
      setPredogled(null);
      await nalozi();
      setObdobje(predogled.leto + "-" + predogled.mesec);
    } catch (e) {
      setUvozMsg("Uvoz ni uspel: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const razvrsti = (polje) => setSort(s => ({ polje, smer: s.polje === polje ? -s.smer : 1 }));

  const filtrirano = useMemo(() => {
    const s = iskanje.trim().toLowerCase();
    let v = !s ? vrstice : vrstice.filter(r =>
      (r.full_name || "").toLowerCase().includes(s) || String(r.employee_code).includes(s)
    );
    v = v.slice().sort((a, b) => {
      const x = a[sort.polje], y = b[sort.polje];
      if (typeof x === "string") return sort.smer * String(x).localeCompare(String(y), "sl");
      return sort.smer * ((x == null ? -1e9 : Number(x)) - (y == null ? -1e9 : Number(y)));
    });
    return v;
  }, [vrstice, iskanje, sort]);

  const izvoziCSV = () => {
    if (!filtrirano.length) return;
    const [leto, mesec] = obdobje.split("-");
    const csv = "full_name,employee_code,dnevi,sprememba\n" + filtrirano.map(r =>
      [`"${(r.full_name||"").replace(/"/g,'""')}"`, r.employee_code, r.dnevi, r.sprememba ?? ""].join(",")
    ).join("\n") + "\n";
    download(`dopust-${leto}-${String(mesec).padStart(2,"0")}.csv`, csv);
  };

  const skupaj = filtrirano.reduce((s, r) => s + Number(r.dnevi), 0);
  const maxDnevi = Math.max(1, ...filtrirano.map(r => Number(r.dnevi) || 0));
  const brezRacuna = filtrirano.filter(r => !r.profile_id).length;
  const brezDopusta = filtrirano.filter(r => Number(r.dnevi) === 0).length;

  return (
    <div>
      <h2 className="section no-print">Mesečno stanje dopusta (Kadris)</h2>
      <p className="hint no-print">
        Vsak mesec naloži izvoz iz Kadrisa (stolpci: Priimek in ime, Mat.št/šifra zaposlenega, Leto, Mesec, DOPUST).
        Šifra zaposlenega je edini stabilen ključ med meseci – ista oseba se ne podvoji, tudi če se ime kdaj zapiše
        drugače. Ponoven uvoz istega meseca obstoječo vrstico posodobi, ne podvoji. Stanje se samodejno prikaže tudi
        v Imeniku pri posamezni osebi (najnovejši mesec).
      </p>
      <div className="card no-print">
        <RazporedUvozVir ikona="🏖" naziv="Stanje dopusta (Kadris)"
          opis="CSV / Excel – mat. št., leto, mesec, dnevi"
          onClick={() => fileRef.current && fileRef.current.click()} />
        <input ref={fileRef} type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}}
          onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={uvozBusy} onClick={() => fileRef.current && fileRef.current.click()}>
          {uvozBusy ? "Nalagam …" : "📤 Uvoz mesečnega stanja iz datoteke"}
        </button>
        {uvozMsg && <p className="hint" style={{marginTop:8, marginBottom:0}}>{uvozMsg}</p>}
      </div>

      {predogled && (
        <div className="card no-print">
          <h3 style={{marginTop:0}}>Predogled – {MESECI_SL2[predogled.mesec - 1]} {predogled.leto}</h3>
          <p className="hint">{predogled.novih} novih · {predogled.spremenjenih} spremenjenih · {predogled.enakih} nespremenjenih</p>
          {predogled.manjkajoci.length > 0 && (
            <p className="hint">V tem izvozu jih ni (bodo iz prejšnjih uvozov, podatki ostanejo): {predogled.manjkajoci.join(", ")}</p>
          )}
          <button className="genBtn" onClick={potrdiUvoz} disabled={uvozBusy}>{uvozBusy ? "Uvažam …" : "Potrdi uvoz"}</button>
          <button className="dlBtn" style={{marginLeft:8}} onClick={() => setPredogled(null)}>Prekliči</button>
        </div>
      )}

      <div className="card">
        <div className="row" style={{alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div className="field">
            <label htmlFor="dobd">Obdobje</label>
            <select id="dobd" value={obdobje} onChange={e => setObdobje(e.target.value)}>
              {(obdobja || []).length === 0 && <option value="">– ni podatkov –</option>}
              {(obdobja || []).map(o => (
                <option key={o.leto+"-"+o.mesec} value={o.leto+"-"+o.mesec}>{MESECI_SL2[o.mesec-1]} {o.leto} – {o.stevilo_oseb} oseb</option>
              ))}
            </select>
          </div>
          <div className="field" style={{flex:1, minWidth:180}}>
            <label htmlFor="disc">Iskanje</label>
            <input id="disc" type="text" placeholder="Ime ali šifra zaposlenega …" value={iskanje} onChange={e => setIskanje(e.target.value)} />
          </div>
        </div>
        <RazporedIzvozVir
          naziv="Stanje dopusta"
          dodatno={[{ label: "Izvozi CSV", onClick: izvoziCSV }]}
          naslov={(() => { const [leto, mesec] = obdobje.split("-"); return `dopust-${leto}-${String(mesec).padStart(2,"0")}`; })()}
          pripravi={() => {
            if (!filtrirano.length) throw new Error("Ni podatkov za izvoz.");
            return [{
              ime: "Dopust",
              glave: ["Priimek in ime", "Šifra zaposlenega", "Dnevi", "Sprememba"],
              vrstice: filtrirano.map(r => [r.full_name || "", r.employee_code || "", r.dnevi, r.sprememba ?? ""]),
            }];
          }}
        />

        {vrstice.length > 0 && (
          <p className="hint" style={{marginTop:10}}>
            {filtrirano.length} zaposlenih · skupaj {Math.round(skupaj*10)/10} dni ·
            povprečje {(skupaj/(filtrirano.length||1)).toFixed(1)} · brez dopusta {brezDopusta} · brez računa {brezRacuna}
          </p>
        )}

        {vrstice.length === 0 ? (
          <p className="hint">Za to obdobje ni podatkov.</p>
        ) : (
          <div style={{overflowX:"auto"}}>
            <table className="roster">
              <thead>
                <tr>
                  <th className="weekToggle" style={{cursor:"pointer"}} onClick={() => razvrsti("full_name")}>Priimek in ime</th>
                  <th style={{cursor:"pointer"}} onClick={() => razvrsti("employee_code")}>Šifra</th>
                  <th style={{cursor:"pointer"}} onClick={() => razvrsti("dnevi")}>Dnevi</th>
                  <th style={{cursor:"pointer"}} onClick={() => razvrsti("sprememba")}>Sprememba</th>
                  <th>Račun</th>
                </tr>
              </thead>
              <tbody>
                {filtrirano.map(r => {
                  const s = r.sprememba == null ? null : Number(r.sprememba);
                  const barva = s == null || s === 0 ? "var(--muted)" : (s > 0 ? "var(--ok)" : "var(--danger)");
                  const besedilo = s == null ? "–" : (s > 0 ? "+" : "") + s;
                  return (
                    <tr key={r.id}>
                      <td>{r.full_name}</td>
                      <td>{r.employee_code}</td>
                      <td style={{minWidth:120}}>
                        <strong>{r.dnevi}</strong>
                        {/* Vrstica napredka je relativna glede na NAJVEČJE stanje v
                            tem mesecu - kvota po osebi (annual_leave_total) v tem
                            izvozu ni na voljo, zato bi bil odstotek izmišljen. */}
                        <div className="bar" title={`${r.dnevi} dni · najvišje stanje ta mesec: ${maxDnevi}`}>
                          <i style={{width: (maxDnevi > 0 ? 100 * Number(r.dnevi) / maxDnevi : 0) + "%"}}></i>
                        </div>
                      </td>
                      <td style={{color:barva, fontWeight:700}}>{besedilo}</td>
                      <td>{r.profile_id ? "povezan" : "ni računa"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// NZV – oddelek za vodje in administratorje (glej supabase/schema.sql
// sekcija 23). Na izrecno željo združuje vodstveno pokritost in dežurstva
// na enem mestu ("bo skupaj naredi da bo pregledno in razumljivo") – sama
// logika generiranja obeh (VodjeTab/DezurstvaTab) ostaja nespremenjena,
// samo dostop je zdaj pod enim skupnim zavihkom namesto dveh ločenih.
function NzvTab({ zacetniPod, zacetniMesec }){
  const [pod, setPod] = useState(zacetniPod || "vodje"); // "vodje" | "dez"
  return (
    <div>
      <div className="tabs no-print" role="tablist" style={{marginBottom:14}}>
        <button role="tab" aria-selected={pod==="vodje"} onClick={() => setPod("vodje")}>Vodstvena pokritost</button>
        <button role="tab" aria-selected={pod==="dez"} onClick={() => setPod("dez")}>Dežurstva</button>
      </div>
      {pod==="vodje" && <VodjeTab zacetniMesec={zacetniMesec}/>}
      {pod==="dez" && <DezurstvaTab zacetniMesec={zacetniMesec}/>}
    </div>
  );
}

// ---------------------------------------------------------------------
// Plače: zbirni izvoz ur za obračun (redno delo/nočne ure/nedelje/
// prazniki/dežurstva), po vzoru urne legende iz uradnega delovnika (glej
// DELOVNI_ČAS v index.html). NAMENOMA konzervativen pri dežurstvih: samo
// ŠTEVILO dežurstev, ne ur - uradna shema dežurstvenih ur je odvisna od
// dneva v tednu/praznika (delavnik 15.30-07.00, vikend/praznik 24h) in te
// aplikacija (še) ne modelira natančno, zato bi izmišljena ura pomenila
// napačen podatek pri obračunu plač - raje jasna vrzel kot tiha napaka.
// Prazniki se NE prepišejo ročno, ampak izračunajo (velika noč po Meeus/
// Jones/Butcher algoritmu), da se izognemo napaki pri ročno vtipkanem
// datumu premičnega praznika.
// ---------------------------------------------------------------------
// Trajanje in vrsta izmene prideta iz skupnega delovni-cas.js (edini vir
// resnice) – prej je bila ista tabela zapisana še enkrat tu in še enkrat v
// index.html, kar bi se ob spremembi urnika zlahka razšlo.
const TRAJANJE_UR = Object.fromEntries(
  Object.entries(window.DelovniCas.IZMENE)
    .filter(([, v]) => v.ure != null)
    .map(([k, v]) => [k, v.ure])
);
function jeNocnaSifra(sifra){ const i = window.DelovniCas.podatkiIzmene(sifra); return !!(i && i.nocna); }
function jeDezurstvoSifra(sifra){ const t = (sifra || "").toLowerCase(); return t.startsWith("dežurstvo") || t.startsWith("dezurstvo"); }

function velikaNoc(leto){
  const a = leto % 19, b = Math.floor(leto / 100), c = leto % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mesec = Math.floor((h + l - 7 * m + 114) / 31), dan = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(leto, mesec - 1, dan));
}
function slovenskiPrazniki(leto){
  const vn = velikaNoc(leto);
  const vnPon = new Date(vn); vnPon.setUTCDate(vn.getUTCDate() + 1);
  const iso = (d) => d.toISOString().slice(0, 10);
  const p = String(leto);
  return new Set([
    p + "-01-01", p + "-01-02", p + "-02-08", iso(vnPon), p + "-04-27",
    p + "-05-01", p + "-05-02", p + "-06-25", p + "-08-15", p + "-10-31",
    p + "-11-01", p + "-12-25", p + "-12-26",
  ]);
}
function jeNedelja(iso){ return new Date(iso + "T00:00:00Z").getUTCDay() === 0; }

function PlaceTab(){
  const [obdobje, setObdobje] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; });
  const [vrstice, setVrstice] = useState(null); // null = ni naloženo
  const [neznane, setNeznane] = useState([]); // šifre izmen, ki jih obračun ne pozna
  const [busy, setBusy] = useState(false);
  const [napaka, setNapaka] = useState(null);

  const nalozi = async () => {
    setBusy(true); setNapaka(null); setVrstice(null); setNeznane([]);
    try {
      const [leto, mesec] = obdobje.split("-").map(Number);
      const startISO = `${leto}-${String(mesec).padStart(2, "0")}-01`;
      const endISO = `${leto}-${String(mesec).padStart(2, "0")}-${String(new Date(leto, mesec, 0).getDate()).padStart(2, "0")}`;
      const prazniki = slovenskiPrazniki(leto);
      const [{ data: entries, error }, { data: profili }] = await Promise.all([
        client.from("schedule_entries").select("employee_id, work_date, shift_code").gte("work_date", startISO).lte("work_date", endISO),
        // Matična številka je ključ, po katerem osebo prepozna računovodstvo
        // in Kadris - ime ni zanesljivo (podvojena/različno zapisana imena).
        client.from("profiles").select("id, full_name, profile_hr_details(employee_code)"),
      ]);
      if (error) throw error;
      const imePoId = {}, matPoId = {};
      (profili || []).forEach(p => {
        imePoId[p.id] = p.full_name;
        const hr = Array.isArray(p.profile_hr_details) ? p.profile_hr_details[0] : p.profile_hr_details;
        matPoId[p.id] = (hr && hr.employee_code) || "";
      });
      const zbir = {}; // employee_id -> { redno, nocne, nedelje, prazniki, dezurstva }
      const neznaneKode = {}; // koda -> [imena], glej razlago v zanki spodaj
      const prazenZapis = () => ({ redno: 0, nocne: 0, nedelje: 0, prazniki: 0, dezurstva: 0 });
      (entries || []).forEach(r => {
        if (jeDezurstvoSifra(r.shift_code)) {
          const z = zbir[r.employee_id] || (zbir[r.employee_id] = prazenZapis());
          z.dezurstva += 1;
          return;
        }
        const ure = TRAJANJE_UR[r.shift_code];
        if (!ure) {
          // LD/KPU/BS/prosto pravilno NE štejejo kot delo. NEZNANE kode pa so
          // druga stvar: doslej so tiho izpadle iz obračuna, kar pomeni
          // neplačano izmeno, ki je nihče ne opazi. Zbiramo jih, da se
          // izpišejo - tiho izgubljanje ur je hujše od napačnega seštevka,
          // ker se ne pozna nikjer.
          const s = (r.shift_code || "").trim();
          if (s && !window.DelovniCas.NI_DELO.includes(s)) {
            (neznaneKode[s] = neznaneKode[s] || []).push(imePoId[r.employee_id] || r.employee_id);
          }
          return;
        }
        const z = zbir[r.employee_id] || (zbir[r.employee_id] = prazenZapis());
        if (jeNocnaSifra(r.shift_code)) z.nocne += ure; else z.redno += ure;
        if (jeNedelja(r.work_date)) z.nedelje += ure;
        if (prazniki.has(r.work_date)) z.prazniki += ure;
      });
      const zaokrozi = (n) => Math.round(n * 10) / 10;
      const rezultat = Object.keys(zbir).map(id => ({
        employee_id: id, full_name: imePoId[id] || "(neznana oseba)",
        employee_code: matPoId[id] || "",
        redno: zaokrozi(zbir[id].redno), nocne: zaokrozi(zbir[id].nocne),
        nedelje: zaokrozi(zbir[id].nedelje), prazniki: zaokrozi(zbir[id].prazniki),
        dezurstva: zbir[id].dezurstva,
      })).sort((a, b) => a.full_name.localeCompare(b.full_name, "sl"));
      setVrstice(rezultat);
      setNeznane(Object.keys(neznaneKode).sort().map(k => ({
        koda: k,
        koliko: neznaneKode[k].length,
        osebe: Array.from(new Set(neznaneKode[k])).sort((a, b) => a.localeCompare(b, "sl")),
      })));
    } catch (e) {
      setNapaka(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div>
      <h2 className="section">Zbirni izvoz ur za obračun plač</h2>
      <p className="hint">
        Osnutek za računovodstvo - preveri pred oddajo. "Dežurstva" je namenoma prikazano kot ŠTEVILO (ne ur), ker
        se dežurstvene ure razlikujejo glede na dan v tednu/praznik in tega izvoz (še) ne izračunava natančno.
        Nočne/nedeljske/praznične ure se lahko prekrivajo (isto uro lahko šteje v več stolpcih hkrati, kot ločeni
        dodatki) - to je namerno, ne napaka seštevanja.
      </p>
      <div className="card">
        <div className="row" style={{alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div className="field">
            <label htmlFor="placeObdobje">Mesec</label>
            <input id="placeObdobje" type="month" value={obdobje} onChange={e => setObdobje(e.target.value)} />
          </div>
          <button className="genBtn" onClick={nalozi} disabled={busy}>{busy ? "Nalagam …" : "Izračunaj"}</button>
        </div>
        {napaka && <p className="err">{napaka}</p>}
        {neznane.length > 0 && (
          <div className="warnBox" style={{marginTop:10, borderColor:"var(--danger)"}}>
            <div className="t">
              ⚠ Neprepoznane šifre izmen: {neznane.length} – te ure NISO v obračunu
            </div>
            <ul style={{margin:"6px 0 0", paddingLeft:18}}>
              {neznane.map(n => (
                <li key={n.koda} style={{fontSize:12.5, marginBottom:3}}>
                  <b>{n.koda}</b> – {n.koliko}× ({n.osebe.slice(0, 4).join(", ")}
                  {n.osebe.length > 4 ? " in še " + (n.osebe.length - 4) : ""})
                </li>
              ))}
            </ul>
            <p className="hint" style={{margin:"8px 0 0"}}>
              Obračun pozna samo šifre iz <code>delovni-cas.js</code>. Zgornje niso med njimi, zato se
              ne štejejo nikamor – če gre za resnično delo, je izmena neplačana. Preveri, ali je šifra
              napačno zapisana (npr. presledek ali velika/mala črka), ali pa je treba dodati nov tip izmene.
            </p>
          </div>
        )}
        {vrstice && vrstice.some(r => !r.employee_code) && (
          <div className="warnBox" style={{marginTop:10}}>
            <div className="t">
              ⚠ Brez matične številke: {vrstice.filter(r => !r.employee_code).length} oseb
            </div>
            <p className="hint" style={{margin:"6px 0 0"}}>
              Računovodstvo in Kadris osebo prepoznata po matični številki, ne po imenu. Te vrstice bo treba
              povezati ročno. Številko vpiši v Imeniku (klikni "manjka" v razpredelnici spodaj), nato znova
              pritisni "Izračunaj".
            </p>
          </div>
        )}
        {vrstice && vrstice.length > 0 && (
          <RazporedIzvozVir
            naziv="Plače"
            naslov={"place-" + obdobje}
            pripravi={() => [{
              ime: "Plače",
              glave: ["Matična številka", "Priimek in ime", "Redno delo (h)", "Nočne ure (h)", "Nedelje (h)", "Prazniki (h)", "Dežurstva (št.)"],
              vrstice: vrstice.map(r => [r.employee_code, r.full_name, r.redno, r.nocne, r.nedelje, r.prazniki, r.dezurstva]),
            }]}
          />
        )}
        {vrstice && vrstice.length === 0 && <p className="hint">Za ta mesec ni objavljenega razporeda.</p>}
        {vrstice && vrstice.length > 0 && (
          <div className="tableScroller" style={{marginTop:10}}>
            <table className="fairTable">
              <thead>
                <tr><th>Mat. št.</th><th>Priimek in ime</th><th>Redno (h)</th><th>Nočne (h)</th><th>Nedelje (h)</th><th>Prazniki (h)</th><th>Dežurstva</th></tr>
              </thead>
              <tbody>
                {vrstice.map(r => (
                  <tr key={r.employee_id}>
                    <td>{r.employee_code
                      ? r.employee_code
                      : <a href={"imenik.html?id=" + r.employee_id} className="pill danger" style={{textDecoration:"none"}}>manjka</a>}</td>
                    <td style={{textAlign:"left"}}>{r.full_name}</td>
                    <td>{r.redno}</td><td>{r.nocne}</td><td>{r.nedelje}</td><td>{r.prazniki}</td><td>{r.dezurstva}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}
