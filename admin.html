<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />

<style>
  :root{
    --bg: #FAF8F1; --bg-grad: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2EEDF;
    --line: #E1D9C2; --text: #2B2712; --muted: #8A7F5E; --accent: #A79448; --accent-2: #6E5F2A; --accent-ink: #2B2712;
    --dop: #4F9B6B; --pop: #C9713F; --noc: #4A67B0; --h12: #8560A8; --off: #8B8672; --off-text:#6B6656;
    --danger: #B3402A; --danger-bg: #FBEAE6; --ok: #4C8C63;
    --radius: 16px; --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width: 780px; margin:0 auto; padding: 0 16px 60px; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  header.top{ position:sticky; top:0; z-index:20; background: linear-gradient(180deg, var(--bg) 75%, transparent);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  .wordmark{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wordmark .logoSmall{ height:28px; width:auto; }
  .wordmark .mark{ font-weight:800; font-size:20px; letter-spacing:-0.02em; }
  .wordmark .tag{ font-size:11.5px; color:var(--accent-ink); background:var(--accent); font-weight:800;
    padding:2px 8px; border-radius:999px; }
  .sub{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  .backlink{ display:inline-block; margin-top:10px; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px; text-decoration-color:var(--line); }

  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); padding:4px;
    border-radius:999px; margin-top:14px; }
  .tabs button{ flex:1; border:0; background:transparent; color:var(--muted); padding:10px 10px;
    border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }

  h2.section{ font-size:15px; font-weight:800; margin: 24px 0 10px; letter-spacing:-0.01em; }
  p.hint{ color:var(--muted); font-size:13px; margin: -4px 0 14px; line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  input[type=month], input[type=number], input[type=text], select{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px; min-width:0;
  }
  select{ min-width: 90px; }
  .chk{ display:flex; align-items:center; gap:8px; font-size:13.5px; }
  .chk input{ width:17px; height:17px; accent-color: var(--accent); }

  .deptRow{ display:flex; gap:8px; flex-wrap:wrap; margin: 10px 0 4px; }
  .deptBtn{ border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-weight:800;
    padding:9px 16px; border-radius:999px; cursor:pointer; font-size:14px; }
  .deptBtn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  table.roster{ width:100%; border-collapse:separate; border-spacing:0; margin-top:10px; font-size:13px; }
  table.roster th{ text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase;
    letter-spacing:.03em; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.roster td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.roster tr:last-child td{ border-bottom:0; }
  .weekToggle{ border:1px solid var(--line); background:transparent; color:var(--muted); font-size:12px;
    font-weight:800; padding:9px 11px; min-height:40px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .weekToggle[aria-pressed="true"]{ background: var(--danger); border-color:var(--danger); color:#2A1608; }

  .genBtn{ margin-top:16px; width:100%; background: var(--accent); color: var(--accent-ink); border:0;
    padding:13px; border-radius: var(--radius-sm); font-weight:800; font-size:15px; cursor:pointer; }
  .genBtn:disabled{ opacity:.5; cursor:default; }
  .dlBtn{ margin-top:10px; width:100%; background: transparent; color: var(--text); border:1px solid var(--line);
    padding:11px; border-radius: var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; }

  .warnBox{ margin-top:14px; background: var(--danger-bg); border:1px solid var(--danger); border-radius: var(--radius-sm);
    padding:12px 14px; font-size:13px; }
  .warnBox .t{ font-weight:800; color: var(--danger); margin-bottom:6px; }
  .warnBox li{ margin: 3px 0; }

  .wardScroller{ margin-top:16px; overflow-x:auto; border:1px solid var(--line); border-radius: var(--radius);
    -webkit-overflow-scrolling:touch; }
  table.wardTable{ border-collapse:separate; border-spacing:0; width:max-content; }
  table.wardTable th, table.wardTable td{ padding:8px 9px; font-size:12px; text-align:center; white-space:nowrap;
    border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  table.wardTable thead th{ background:var(--surface-2); color:var(--muted); font-weight:700; position:sticky; top:0; font-size:11px; }
  table.wardTable td.name, table.wardTable th.name{ position:sticky; left:0; background:var(--surface); text-align:left;
    font-weight:700; min-width:118px; max-width:118px; overflow:hidden; text-overflow:ellipsis; z-index:2; }
  table.wardTable thead th.name{ z-index:3; background:var(--surface-2); }
  .swatch{ display:inline-block; padding:3px 6px; border-radius:6px; font-size:10.5px; font-weight:700; }

  .dutyTable{ width:100%; border-collapse:separate; border-spacing:0; margin-top:14px; font-size:13px; }
  .dutyTable th{ text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; padding:6px 8px;
    border-bottom:1px solid var(--line); }
  .dutyTable td{ padding:8px; border-bottom:1px solid var(--line); }
  .dutyTable tr.we td{ background: rgba(201,113,63,0.08); }
  .dutyTable tr.warn td{ background: var(--danger-bg); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:800; }
  .pill.ok{ background: rgba(76,140,99,.16); color: var(--ok); }

  .fairTable{ width:100%; border-collapse:separate; border-spacing:0; margin-top:12px; font-size:13px; }
  .fairTable th{ text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  .fairTable td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  .bar{ height:6px; border-radius:3px; background: var(--surface-2); overflow:hidden; margin-top:4px; }
  .bar i{ display:block; height:100%; background: var(--accent); }

  footer.foot{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  @media print{
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th, table.roster th{ background:#f2f2f2 !important; }
    /* Izvoz v PDF (Kalup/Vodje) mora iti na 1 A4 stran ne glede na število
       zaposlenih/dni v mesecu — PrintFit.natisni() izračuna --print-scale in
       pokliče window.print(); "zoom" (ne transform) dejansko zmanjša zaseden
       prostor, kar brskalnik potrebuje za pravilen izračun 1 strani. Sticky
       stolpci/vrstice na 1 strani niso potrebni in bi lahko motili tisk. */
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important;
      zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr, table.dutyTable tr{ break-inside:avoid; page-break-inside:avoid; }
    .printBlok{ zoom: var(--print-scale, 1); }
    table.wardTable input[type="text"]{ border:none !important; color:#000 !important; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const { client } = RazporedAuth;

// ---------------------------------------------------------------------
// Objava generiranega razporeda naravnost v Supabase (schedule_entries),
// poleg obstoječega ročnega prenosa JSON. Zaposlene poveže po polnem
// imenu (profiles.full_name) — kdor se še ni registriral, se ne objavi
// in je izpisan kot manjkajoč.
// ---------------------------------------------------------------------
async function publishScheduleRows(deptCode, rows){
  const imena = [...new Set(rows.map(r => r.ime))];
  const { data: profili, error: perr } = await client.from("profiles").select("id, full_name, department_code").in("full_name", imena);
  if (perr) throw perr;
  const byIme = {};
  profili.forEach(p => { byIme[p.full_name] = p; });
  const manjkajo = imena.filter(i => !byIme[i]);
  const vrstice = rows.filter(r => byIme[r.ime]).map(r => ({
    employee_id: byIme[r.ime].id, department_code: deptCode, work_date: r.datum, shift_code: r.sifra || "",
  }));
  if (vrstice.length > 0){
    const { error } = await client.from("schedule_entries").upsert(vrstice, { onConflict: "employee_id,work_date" });
    if (error) throw error;
  }
  const brezOddelka = profili.filter(p => !p.department_code).map(p => p.id);
  let oddelekNapaka = null;
  if (brezOddelka.length > 0){
    const { error } = await client.from("profiles").update({ department_code: deptCode }).in("id", brezOddelka);
    if (error) oddelekNapaka = error.message;
  }
  return { objavljeno: vrstice.length, manjkajo, oddelekNapaka };
}

// Kot publishScheduleRows, a vsaka vrstica nosi SVOJ department_code
// (vsak vodja ima svojo domačo enoto) — uporablja VodjeTab.
async function publishLeadScheduleRows(rows){
  const imena = [...new Set(rows.map(r => r.ime))];
  const { data: profili, error: perr } = await client.from("profiles").select("id, full_name").in("full_name", imena);
  if (perr) throw perr;
  const byIme = {};
  profili.forEach(p => { byIme[p.full_name] = p; });
  const manjkajo = imena.filter(i => !byIme[i]);
  const vrstice = rows.filter(r => byIme[r.ime] && r.department_code).map(r => ({
    employee_id: byIme[r.ime].id, department_code: r.department_code, work_date: r.datum, shift_code: r.sifra || "",
  }));
  if (vrstice.length > 0){
    const { error } = await client.from("schedule_entries").upsert(vrstice, { onConflict: "employee_id,work_date" });
    if (error) throw error;
  }
  return { objavljeno: vrstice.length, manjkajo };
}

// ---------------------------------------------------------------------
// Statični podatki o oddelkih (SMS/TZN) — enaki kot pri generiranju
// oktobra 2026. Črka je stanje kalupa v tednu 28. 9. 2026 (sidro).
// ---------------------------------------------------------------------
const ANCHOR_MONDAY = "2026-09-28";
// Oddelčna struktura (kode, nazivi, hsuffix) je stalna nastavitev — 6
// SMS/TZN oddelkov se ne spreminja. Članstvo in rotacijska črka (A-E) sta
// PREJ bila tu trdo kodirana skupaj s to strukturo (glej git zgodovino),
// zdaj pa prihajata živo iz Supabase (profiles.department_code +
// profiles.rotation_slot, urejljivo v Imeniku) — glej nalozizOddelek spodaj.
const WARDS_META = {
  B:  { naziv:"B - ODDELEK",  hsuffix:false },
  C:  { naziv:"C - ODDELEK",  hsuffix:false },
  C1: { naziv:"C1 - ODDELEK", hsuffix:false },
  D:  { naziv:"D - ODDELEK",  hsuffix:false },
  E1: { naziv:"E1 - ODDELEK", hsuffix:true },
  E2: { naziv:"E2 - ODDELEK", hsuffix:false },
};

// Vrne [[ime, rotacijskaČrka], ...] za en oddelek — ista oblika, kot jo je
// prej vračal WARDS_META[koda].staff, da ostane vsa nadaljnja koda (Kalup,
// PrednostniPanel) nespremenjena. Manjkajoč rotation_slot (nova oseba, še
// ne nastavljena v Imeniku) privzeto pade na "A", vidno označeno spodaj.
async function nalozizOddelek(koda){
  const { data } = await client.from("profiles").select("full_name, rotation_slot")
    .eq("department_code", koda).order("full_name");
  return (data || []).map(p => [p.full_name, p.rotation_slot || "A", !p.rotation_slot]);
}

// Dnevne "rumene" omejitve (Razpredelnica Želje, leave_entries.kind="omejitev")
// za dani razpon — Kalup generator jih uporabi za samodejno iskanje
// nadomestila (glej generirajKalup v generator-core.js).
async function nalozizOmejitve(startISO, endISO){
  const { data } = await client.from("leave_entries").select("full_name, work_date")
    .eq("kind", "omejitev").gte("work_date", startISO).lte("work_date", endISO);
  const map = {};
  (data || []).forEach(r => { (map[r.full_name] = map[r.full_name] || []).push(r.work_date); });
  return map;
}

// Dežurni kader DMS/DZN — ZAPRTA zgodovina do 31. 8. 2026 (iz uradnega
// seznama dežurstev jan.–avg. 2026, posredoval uporabnik, 243 vnosov,
// preverjeno v celoti — glej roster/dezurstva-jan-avg-2026.tsv in
// roster/analiza-razporedov.md §1a). To obdobje je pred obstojem te
// aplikacije, zato ostaja tu kot fiksna osnova (se ne bo več spreminjalo) —
// vse OD 1. 9. 2026 naprej nalozizDezurniKader spodaj prišteje živo iz
// schedule_entries, tako da se stevilo/zadnje ne bosta nikoli več ročno
// prepisovala. Članstvo (kdo je dežurni kader) in osebne nastavitve
// (min/maks mesečno, prost dan, samo med tednom) so od te spremembe dalje v
// Supabase (profiles.department_code="DEZ" + profile_hr_details.duty_*).
const DEZURNI_OSNOVA_DO_31_8_2026 = {
  "ALUKIĆ DINO": { stevilo:21, zadnje:"2026-08-20" },
  "ARNEŽ GREGA": { stevilo:18, zadnje:"2026-08-03" },
  "BOJIĆ MATEJ": { stevilo:21, zadnje:"2026-08-26" },
  "DŽAMASTAGIĆ DENIS": { stevilo:21, zadnje:"2026-08-29" },
  "PERVIZ AMAL": { stevilo:21, zadnje:"2026-08-21" },
  "TOMAŽEVIČ SIMONA": { stevilo:18, zadnje:"2026-08-31" },
  "TORKAR TANJA": { stevilo:19, zadnje:"2026-08-16" },
  "HROVAT NINA": { stevilo:18, zadnje:"2026-08-23" },
  "ŠUBIC PETRA": { stevilo:18, zadnje:"2026-08-19" },
  "LUNAR MATEJA": { stevilo:18, zadnje:"2026-08-28" },
  "MAVRI TRATNIK MAGDALENA": { stevilo:18, zadnje:"2026-08-30" },
  "VELUŠČEK METKA": { stevilo:17, zadnje:"2026-08-10" },
  "SALKIĆ MARUŠA": { stevilo:7, zadnje:"2026-08-24" },
  "TRPIN SAŠA": { stevilo:8, zadnje:"2026-08-27" },
};

// Vrne polni začetni roster za DezurstvaTab: članstvo iz profiles (primarni
// department_code ali profile_departments "DEZ" — nekdo je lahko hkrati na
// svojem oddelku IN v dežurnem kadru), stevilo/zadnje = zaprta osnova do
// 31. 8. 2026 + živo prišteti schedule_entries od 1. 9. 2026 do startISO
// (izključno), osebne nastavitve iz profile_hr_details.duty_*.
async function nalozizDezurniKader(startISO){
  const { data: profili } = await client.from("profiles")
    .select("id, full_name, department_code, profile_departments(department_code), profile_hr_details(duty_min_monthly, duty_max_monthly, duty_day_off, duty_weekdays_only)")
    .order("full_name");
  const dezurni = (profili || []).filter(p =>
    p.department_code === "DEZ" || (p.profile_departments || []).some(d => d.department_code === "DEZ")
  );
  const { data: entries } = await client.from("schedule_entries").select("employee_id, work_date")
    .eq("department_code", "DEZ").gte("work_date", "2026-09-01").lt("work_date", startISO);
  const odZivih = {};
  (entries || []).forEach(e => {
    const s = odZivih[e.employee_id] || (odZivih[e.employee_id] = { stevilo:0, zadnje:null });
    s.stevilo += 1;
    if (!s.zadnje || e.work_date > s.zadnje) s.zadnje = e.work_date;
  });
  return dezurni.map(p => {
    const hr = Array.isArray(p.profile_hr_details) ? p.profile_hr_details[0] : p.profile_hr_details;
    const osnova = DEZURNI_OSNOVA_DO_31_8_2026[p.full_name] || { stevilo:0, zadnje:null };
    const ziv = odZivih[p.id] || { stevilo:0, zadnje:null };
    return {
      ime: p.full_name, enota: p.department_code || "?",
      stevilo: osnova.stevilo + ziv.stevilo,
      zadnje: (ziv.zadnje && (!osnova.zadnje || ziv.zadnje > osnova.zadnje)) ? ziv.zadnje : (osnova.zadnje || ""),
      odsotnosti:"", dopust:"", omejitve:"",
      prostDanVTednu: (hr && hr.duty_day_off) || "",
      minMesecno: hr && hr.duty_min_monthly != null ? String(hr.duty_min_monthly) : "",
      maxMesecno: hr && hr.duty_max_monthly != null ? String(hr.duty_max_monthly) : "",
      samoMedTednom: !!(hr && hr.duty_weekdays_only),
    };
  });
}

function classify(sifra){
  const t=(sifra||"").toLowerCase();
  if (t.startsWith("ld")) return "off";
  if (t.startsWith("kpu")) return "off";
  if (t.includes("nočna12")) return "h12";
  if (t.includes("dnevna12")) return "h12";
  if (t.startsWith("nočna")) return "noc";
  if (t.startsWith("dopoldan")) return "dop";
  if (t.startsWith("popoldan")) return "pop";
  return "off";
}
const BARVE = { dop:"#4F9B6B", pop:"#C9713F", noc:"#4A67B0", h12:"#8560A8", off:"#8B8672" };

function monthRange(monthStr){ // "2026-11" -> {startISO, endISO}
  const [y,m] = monthStr.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { startISO:start, endISO:end };
}
// Pomožne funkcije za VodjeTab (dnevi v mesecu, ISO datum, slovenski prazniki
// 2026+) — ista logika kot v zelje.html, tu podvojena, ker ni skupnega
// JS modula med statičnimi stranmi.
const DNI_KRATKO = ["NED","PON","TOR","SRE","ČET","PET","SOB"];
function danovVMesecu2(monthStr){ const [y,m] = monthStr.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function isoZaMesec(monthStr, d){ const [y,m] = monthStr.split("-").map(Number); return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function easterSunday2(year){
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(year, month-1, day));
}
const FIXED_HOLIDAYS2 = [[1,1],[1,2],[2,8],[4,27],[5,1],[5,2],[6,25],[8,15],[10,31],[11,1],[12,25],[12,26]];
const holidayCache2 = {};
function jeDanPraznik2(iso){
  const [y,m,d] = iso.split("-").map(Number);
  if (!holidayCache2[y]) {
    const set = new Set(FIXED_HOLIDAYS2.map(([mm,dd]) => mm+"-"+dd));
    const es = easterSunday2(y);
    set.add((es.getUTCMonth()+1)+"-"+es.getUTCDate());
    const em = new Date(es.getTime()); em.setUTCDate(es.getUTCDate()+1);
    set.add((em.getUTCMonth()+1)+"-"+em.getUTCDate());
    holidayCache2[y] = set;
  }
  return holidayCache2[y].has(m+"-"+d);
}
function mondaysInRange(startISO, endISO){
  const { toDate, mondayOfWeek, fromDate, addDays } = Generator.util;
  const out = [];
  let d = mondayOfWeek(toDate(startISO));
  const end = toDate(endISO);
  while (d.getTime() <= end.getTime()){
    out.push(fromDate(d));
    d = addDays(d, 7);
  }
  return out;
}
function fmtShort(iso){
  const d = new Date(iso+"T00:00:00Z");
  return d.getUTCDate() + "." + (d.getUTCMonth()+1) + ".";
}
function download(filename, text){
  const blob = new Blob([text], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------
// Predlog prednosti za prost teden — na podlagi dejanske obremenjenosti
// (nočne ure, nedelje/prazniki) iz nadzorne plošče (modul 3), ne iz
// ugibanja. Kvota letnega dopusta ni znana vnaprej (ni je v Kadrisu, ki
// smo ga analizirali) — vnese jo koordinator ročno, po zaposlenem.
// ---------------------------------------------------------------------
function PrednostniPanel({ staff, stanje, tedni, onPredlagaj, kvote, setKvote }){
  const [baseline, setBaseline] = useState(null);
  const [err, setErr] = useState(null);
  const [sortKey, setSortKey] = useState("nedpraz");
  const [sortDir, setSortDir] = useState(-1);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    fetch("dashboard-baseline.json").then(r => r.json())
      .then(d => setBaseline(d.osnova_sms.podatki))
      .catch(() => setErr("Ni mogoče naložiti dashboard-baseline.json — panel prikazuje samo imena, brez podatkov o obremenjenosti."));
  }, []);

  const rows = useMemo(() => {
    return staff.map(([ime]) => {
      const b = (baseline || []).find(z => z.ime === ime);
      const dosedanjiLD = b ? b.ld : null;
      const novihTaSeja = tedni.filter(mo => stanje[ime + "|" + mo] === "LD").length;
      const kvota = kvote[ime] !== undefined && kvote[ime] !== "" ? Number(kvote[ime]) : null;
      const preostane = (kvota != null && dosedanjiLD != null) ? kvota - dosedanjiLD - novihTaSeja : null;
      return {
        ime,
        nocne: b ? b.nocne : null,
        nedpraz: b ? b.nedpraz : null,
        ld: dosedanjiLD,
        novihTaSeja,
        kvota,
        preostane,
      };
    });
  }, [staff, baseline, kvote, stanje, tedni]);

  const sorted = useMemo(() => {
    const arr = rows.slice();
    arr.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * sortDir;
    });
    return arr;
  }, [rows, sortKey, sortDir]);

  const onSort = (k) => { if (k === sortKey) setSortDir(d => -d); else { setSortKey(k); setSortDir(-1); } };
  const maxNedpraz = Math.max(1, ...rows.map(r => r.nedpraz || 0));

  const predlagaj = (ime) => {
    const prostTeden = tedni.find(mo => !stanje[ime + "|" + mo]);
    if (!prostTeden) { setMsg(ime + ": vsi vidni tedni so že označeni."); return; }
    onPredlagaj(ime, prostTeden);
    setMsg(null);
  };

  return (
    <div className="card" style={{overflowX:"auto", marginTop:10}}>
      {err && <p className="hint" style={{color:"var(--danger)"}}>{err}</p>}
      <table className="roster">
        <thead>
          <tr>
            <th>Zaposleni</th>
            <th style={{cursor:"pointer"}} onClick={() => onSort("nocne")}>Nočne ure{sortKey==="nocne"?" ▾":""}</th>
            <th style={{cursor:"pointer"}} onClick={() => onSort("nedpraz")}>Ned.+praz.{sortKey==="nedpraz"?" ▾":""}</th>
            <th>Doslej LD</th>
            <th>Letna kvota</th>
            <th>Preostane</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {sorted.map(r => (
            <tr key={r.ime}>
              <td>{r.ime}</td>
              <td>
                {r.nocne != null ? r.nocne : "–"}
                {r.nedpraz != null && <div className="bar"><i style={{width:(100*(r.nedpraz||0)/maxNedpraz)+"%"}}></i></div>}
              </td>
              <td>{r.nedpraz != null ? r.nedpraz : "–"}</td>
              <td>{r.ld != null ? r.ld : "–"}</td>
              <td>
                <input type="number" style={{width:56}} min="0" placeholder="?"
                  value={kvote[r.ime] !== undefined ? kvote[r.ime] : ""}
                  onChange={e => setKvote(k => ({...k, [r.ime]: e.target.value}))} />
              </td>
              <td>{r.preostane != null ? r.preostane : <span style={{color:"var(--muted)"}}>vnesi kvoto</span>}</td>
              <td><button className="weekToggle" onClick={() => predlagaj(r.ime)}>Predlagaj teden</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      {msg && <p className="hint" style={{marginTop:8, marginBottom:0}}>{msg}</p>}
      <p className="hint" style={{marginTop:10, marginBottom:0}}>
        Nočne ure in nedelje/prazniki so kumulativni podatki iz nadzorne plošče (modul 3) — kdor ima
        največ (obarvan vrh razvrstitve), je najbolj upravičen do prostega tedna. Kvoto letnega dopusta
        vnesite ročno po zaposlenem (ni je bilo mogoče razbrati iz analize prisotnosti). Gumb "Predlagaj
        teden" samo označi prvi še neoznačeni teden spodaj — vi ga potrdite ali spremenite pred generiranjem.
      </p>
    </div>
  );
}

// ---------------------------------------------------------------------
// Pokritost po dnevih — kontrolni seznam, razdelek 7, predlog 3: primerja
// dejansko zasedbo (po dopustu/pomoči/nadomestilih) s tem, kar bi kalup
// običajno zasedel ta dan brez odsotnosti. Prag je samodejno izračunan,
// a ostaja ročno popravljiv na dan, ker "pričakovano" ni vedno enoznačno
// (npr. namerno tanjša zasedba ob znanih mirnejših dnevih).
function PokritostPoDnevih({ rezultat, celica, pragPopravki, setPragPopravki }){
  const vrstice = rezultat.dnevi.map(dn => {
    const dejansko = rezultat.staff.filter(z => {
      const v = celica(z, dn);
      return v && v !== "LD" && v !== "POMOČ DRUGJE";
    }).length;
    const samodejniPrag = rezultat.pricakovanoPoDnevih[dn.datum] || 0;
    const prag = pragPopravki[dn.datum] != null ? pragPopravki[dn.datum] : samodejniPrag;
    return { dn, dejansko, prag, samodejniPrag, primanjkljaj: prag - dejansko };
  }).filter(v => v.primanjkljaj > 0);

  if (vrstice.length === 0) {
    return <p className="hint no-print">Ni zaznanih vrzeli — dejanska zasedba ustreza pričakovani zasedbi kalupa na vsak dan.</p>;
  }

  return (
    <div className="card no-print" style={{overflowX:"auto"}}>
      <table className="roster">
        <thead><tr><th>Dan</th><th>Dejansko</th><th>Pričakovano</th><th>Primanjkljaj</th></tr></thead>
        <tbody>
          {vrstice.map(({ dn, dejansko, prag, samodejniPrag, primanjkljaj }) => (
            <tr key={dn.datum}>
              <td>{dn.dan} {dn.datum}</td>
              <td>{dejansko}</td>
              <td>
                <input type="number" min="0" style={{width:56}} value={prag}
                  onChange={e => setPragPopravki(p => ({ ...p, [dn.datum]: e.target.value === "" ? samodejniPrag : Number(e.target.value) }))}
                  title="Samodejno izračunano iz kalupa, ročno popravljivo" />
              </td>
              <td style={{color:"var(--danger)", fontWeight:800}}>-{primanjkljaj}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function KalupTab(){
  const [koda, setKoda] = useState("B");
  const [month, setMonth] = useState("2026-11");
  const [letters, setLetters] = useState({}); // override startLetter po imenu
  // "ime|monday" -> "LD" (letni dopust) | "POMOC" (začasno pomaga drugemu
  // oddelku, ni na voljo za svoj kalup) | undefined (navadna rotacija).
  const [tedenskoStanje, setTedenskoStanje] = useState({});
  const [kvote, setKvote] = useState({}); // letna kvota dopusta po imenu (ročni vnos, ni v Kadrisu)
  const [rezultat, setRezultat] = useState(null);
  const [publishBusy, setPublishBusy] = useState(false);
  const [publishMsg, setPublishMsg] = useState(null);
  const [kvoteUvozMsg, setKvoteUvozMsg] = useState(null);
  const [kvoteUvozBusy, setKvoteUvozBusy] = useState(false);
  const kvoteFileRef = useRef();
  const wardRef = useRef();
  // Ročni popravki po izračunu: "ime|datum" -> besedilo. Podobna logika kot v
  // zavihku Vodje, a tu se (za razliko od Vodje) popravek upošteva TUDI ob
  // objavi v Supabase - vsaka celica tu je natanko ena oseba/en dan, zato se
  // zanesljivo preslika nazaj na eno izmeno (v Vodje en stolpec združuje več
  // ljudi v eno prosto besedilo, zato tam to ni varno).
  const [popravki, setPopravki] = useState({});
  // Pokritost po dnevih (razdelek 7, predlog 3): samodejno pričakovano
  // število po dnevu (iz kalupa) je le izhodišče — admin ga lahko tu
  // ročno popravi, če se za posamezen dan ne zdi pravilno.
  const [pragPopravki, setPragPopravki] = useState({});
  const [staffList, setStaffList] = useState(null); // [[ime, rotacijskaČrka, manjkaNastavitev], ...]
  useEffect(() => { setStaffList(null); nalozizOddelek(koda).then(setStaffList); }, [koda]);
  const [genBusy, setGenBusy] = useState(false);

  const meta = WARDS_META[koda];
  const { startISO, endISO } = monthRange(month);
  const tedni = useMemo(() => mondaysInRange(startISO, endISO), [startISO, endISO]);

  // Klik kroži: navadna rotacija -> LD -> Pomoč drugje -> navadna rotacija.
  const cikliTeden = (ime, monday) => {
    const key = ime + "|" + monday;
    setTedenskoStanje(t => {
      const trenutno = t[key];
      const novo = trenutno === "LD" ? "POMOC" : trenutno === "POMOC" ? undefined : "LD";
      const kopija = { ...t };
      if (novo) kopija[key] = novo; else delete kopija[key];
      return kopija;
    });
  };
  // "Predlagaj teden" iz spodnjega panela vedno predlaga LD, ne kroži.
  const predlagajLD = (ime, monday) => {
    setTedenskoStanje(t => ({ ...t, [ime + "|" + monday]: "LD" }));
  };

  const uvoziKvote = async (file) => {
    if (!file) return;
    setKvoteUvozBusy(true); setKvoteUvozMsg(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setKvoteUvozMsg("PDF ni podprt za uvoz kvot (ni stolpcev) — uporabi CSV/Excel."); return; }
      const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["ime","kvota"], ["ime","full_name"]);
      const nove = {};
      objekti.forEach(o => { if (o.ime && o.kvota !== "") nove[o.ime.toUpperCase()] = o.kvota; });
      setKvote(k => ({ ...k, ...nove }));
      setKvoteUvozMsg(`Uvoženih ${Object.keys(nove).length} kvot iz "${file.name}".`);
    } catch (e) {
      setKvoteUvozMsg("Napaka: " + (e.message || String(e)));
    } finally {
      setKvoteUvozBusy(false);
    }
  };

  const generiraj = async () => {
    setGenBusy(true);
    try {
      const omejitveMap = await nalozizOmejitve(startISO, endISO);
      const staff = staffList.map(([ime, defLetter]) => ({
        ime,
        startLetter: letters[ime] || defLetter,
        hsuffix: meta.hsuffix,
        dopustTedni: tedni.filter(mo => tedenskoStanje[ime + "|" + mo] === "LD"),
        pomocTedni: tedni.filter(mo => tedenskoStanje[ime + "|" + mo] === "POMOC"),
        omejitve: omejitveMap[ime] || [],
      }));
      const res = Generator.generirajKalup({ anchorMondayISO: ANCHOR_MONDAY, startISO, endISO, staff });
      // Pokritost po dnevih: kar bi kalup ta dan običajno zasedel, ČE nihče
      // ne bi bil na dopustu/pomoči drugje (isto osebje/rotacija, brez
      // odsotnosti) — izhodišče za primerjavo z dejansko zasedbo spodaj.
      const staffBazni = staff.map(z => ({ ...z, dopustTedni: [], pomocTedni: [], omejitve: [] }));
      const bazno = Generator.generirajKalup({ anchorMondayISO: ANCHOR_MONDAY, startISO, endISO, staff: staffBazni });
      const pricakovanoPoDnevih = {};
      bazno.dnevi.forEach(dn => {
        pricakovanoPoDnevih[dn.datum] = Object.values(dn.izmene).filter(v => v).length;
      });
      setRezultat({ koda, naziv: meta.naziv, mesec: month, dnevi: res.dnevi, opozorila: res.opozorila, staff: staffList.map(([ime]) => ({ime, vloga:"SMS / TZN"})), pricakovanoPoDnevih });
      setPopravki({});
      setPragPopravki({});
    } finally {
      setGenBusy(false);
    }
  };

  const celica = (z, dn) => {
    const key = z.ime + "|" + dn.datum;
    return popravki[key] != null ? popravki[key] : (dn.izmene[z.ime] || "");
  };
  const nastaviPopravek = (z, dn, vrednost) => {
    setPopravki(p => ({ ...p, [z.ime + "|" + dn.datum]: vrednost }));
  };

  const izvoziCSV = () => {
    if (!rezultat) return;
    const glava = ["Zaposleni", ...rezultat.dnevi.map(dn => dn.datum)];
    const vrstice = rezultat.staff.map(z => [z.ime, ...rezultat.dnevi.map(dn => celica(z, dn))]);
    const csv = [glava, ...vrstice]
      .map(vrsta => vrsta.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
      .join("\r\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `kalup-${rezultat.koda}-${rezultat.mesec}.csv`; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const prenesi = () => {
    if (!rezultat) return;
    const data = { mesec: rezultat.mesec, oddelki: [{ koda: rezultat.koda, naziv: rezultat.naziv, zaposleni: rezultat.staff, dnevi: rezultat.dnevi }] };
    download(`data-${rezultat.koda}-${rezultat.mesec}.json`, JSON.stringify(data, null, 1));
  };

  const objavi = async () => {
    if (!rezultat) return;
    setPublishBusy(true); setPublishMsg(null);
    try {
      const rows = [];
      rezultat.dnevi.forEach(dn => {
        Object.keys(dn.izmene).forEach(ime => {
          const key = ime + "|" + dn.datum;
          const sifra = popravki[key] != null ? popravki[key] : dn.izmene[ime];
          rows.push({ ime, datum: dn.datum, sifra });
        });
      });
      const { objavljeno, manjkajo, oddelekNapaka } = await publishScheduleRows(rezultat.koda, rows);
      setPublishMsg({ ok:true, text: `Objavljeno ${objavljeno} vnosov v Supabase.` + (manjkajo.length ? ` Brez računa (preskočeno): ${manjkajo.join(", ")}.` : "") + (oddelekNapaka ? ` Opozorilo: samodejna nastavitev oddelka ni uspela (${oddelekNapaka}).` : "") });
    } catch (e) {
      setPublishMsg({ ok:false, text: e.message || String(e) });
    } finally {
      setPublishBusy(false);
    }
  };

  return (
    <div>
      <h2 className="section">1 · Oddelek in mesec</h2>
      <div className="deptRow">
        {Object.keys(WARDS_META).map(k => (
          <button key={k} className="deptBtn" aria-pressed={k===koda} onClick={() => { setKoda(k); setRezultat(null); }}>{k}</button>
        ))}
      </div>
      <div className="row" style={{marginTop:10}}>
        <div className="field">
          <label htmlFor="mm">Mesec</label>
          <input id="mm" type="month" value={month} onChange={e => { setMonth(e.target.value); setRezultat(null); }} />
        </div>
      </div>

      {!staffList ? <p className="hint">Nalagam osebje …</p> : (
      <React.Fragment>
      <h2 className="section">2 · Predlog prednosti za prost teden</h2>
      <p className="hint">Razvrstitev po dejanski obremenjenosti (od januarja do zdaj). Kliknite "Predlagaj teden", da za izbrano osebo označite naslednji prosti teden spodaj — potrdite ali spremenite pred generiranjem.</p>
      <div className="card no-print" style={{marginBottom:10}}>
        <input ref={kvoteFileRef} type="file" accept=".csv,text/csv,.xlsx,.xls" style={{display:"none"}}
          onChange={e => { uvoziKvote(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={kvoteUvozBusy} onClick={() => kvoteFileRef.current && kvoteFileRef.current.click()}>
          {kvoteUvozBusy ? "Nalagam …" : "📤 Uvozi letne kvote dopusta (CSV/Excel)"}
        </button>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>Oblika: <code>ime,kvota</code> (ime kot spodaj v tabeli).</p>
        {kvoteUvozMsg && <p className="hint" style={{marginTop:6, marginBottom:0}}>{kvoteUvozMsg}</p>}
      </div>
      <PrednostniPanel staff={staffList} stanje={tedenskoStanje} tedni={tedni} kvote={kvote} setKvote={setKvote}
        onPredlagaj={(ime, teden) => predlagajLD(ime, teden)} />

      <h2 className="section">3 · Kalup in dopust po zaposlenih</h2>
      <p className="hint">Črka je izhodiščno stanje 5-tedenskega kalupa (samodejno izračunano od sidra 28. 9. 2026 naprej, privzeto iz Imenika). Kliknite teden, da med LD (letni dopust), POM (začasna pomoč drugemu oddelku — cilj oddelek osebo za ta teden doda ročno) in navadno rotacijo kroži. Rumene omejitve (Razpredelnica Želje) generator samodejno pokrije z nadomestilom, če je kdo na oddelku ta dan prost — sicer opozori spodaj.</p>
      <div className="card" style={{overflowX:"auto"}}>
        <table className="roster">
          <thead>
            <tr>
              <th>Zaposleni</th>
              <th>Kalup</th>
              {tedni.map(mo => <th key={mo}>Teden {fmtShort(mo)}</th>)}
            </tr>
          </thead>
          <tbody>
            {staffList.map(([ime, defLetter, manjka]) => (
              <tr key={ime}>
                <td>{ime}{manjka && <span className="hint" style={{color:"var(--danger)", marginLeft:6}} title="Rotacijska črka ni nastavljena v Imeniku — privzeto A">⚠</span>}</td>
                <td>
                  <select value={letters[ime] || defLetter} onChange={e => setLetters(l => ({...l, [ime]: e.target.value}))}>
                    {["A","B","C","D","E"].map(l => <option key={l} value={l}>{l}</option>)}
                  </select>
                </td>
                {tedni.map(mo => (
                  <td key={mo}>
                    <button className="weekToggle" aria-pressed={!!tedenskoStanje[ime+"|"+mo]} onClick={() => cikliTeden(ime, mo)}>
                      {tedenskoStanje[ime+"|"+mo] === "LD" ? "LD" : tedenskoStanje[ime+"|"+mo] === "POMOC" ? "POM" : "—"}
                    </button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <button className="genBtn" onClick={generiraj} disabled={genBusy}>{genBusy ? "Generiram …" : "Generiraj razpored"}</button>
      </React.Fragment>
      )}

      {rezultat && (
        <React.Fragment>
          <h2 className="section">4 · Rezultat — {rezultat.naziv}, {rezultat.mesec}</h2>
          {rezultat.opozorila && rezultat.opozorila.length > 0 && (
            <div className="warnBox no-print">
              <div className="t">⚠ {rezultat.opozorila.length} omejitev brez samodejnega nadomestila</div>
              <ul>{rezultat.opozorila.map((o, i) => <li key={i}>{o.datum}: {o.sporocilo}</li>)}</ul>
            </div>
          )}
          <p className="hint no-print">
            Vsako celico lahko ročno prepišeš (npr. za nadomeščanje) — sprememba se upošteva povsod: v prikazu,
            izvozu (PDF/CSV) IN ob objavi v Supabase (vsaka celica je ena oseba/en dan, zato se popravek zanesljivo
            preslika nazaj na eno izmeno).
          </p>

          <h2 className="section no-print">4b · Pokritost po dnevih</h2>
          <p className="hint no-print">Primerjava dejanske zasedbe (po dopustu/pomoči/nadomestilih) s tem, kar bi kalup običajno zasedel ta dan brez odsotnosti. Prikazani so samo dnevi s primanjkljajem; pričakovano število lahko ročno popraviš.</p>
          <PokritostPoDnevih rezultat={rezultat} celica={celica} pragPopravki={pragPopravki} setPragPopravki={setPragPopravki} />

          <div className="wardScroller" ref={wardRef}>
            <table className="wardTable">
              <thead>
                <tr>
                  <th className="name">Zaposleni</th>
                  {rezultat.dnevi.map(dn => (
                    <th key={dn.datum} style={dn.dan==="SO"||dn.dan==="NE" ? {color:"var(--pop)"} : null}>
                      {new Date(dn.datum+"T00:00:00Z").getUTCDate()}<br/>{dn.dan}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rezultat.staff.map(z => (
                  <tr key={z.ime}>
                    <td className="name">{z.ime}</td>
                    {rezultat.dnevi.map(dn => {
                      const sifra = celica(z, dn); const cls = classify(sifra);
                      return (
                        <td key={dn.datum}>
                          <input type="text" value={sifra} onChange={e => nastaviPopravek(z, dn, e.target.value)}
                            title={sifra}
                            style={{width:48, minHeight:40, textAlign:"center", background:BARVE[cls]+"33", color:"var(--text)",
                              border:"1px solid var(--line)", borderRadius:6, fontSize:13, padding:"3px 2px"}} />
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button className="dlBtn no-print" onClick={prenesi}>⬇ Prenesi JSON za mobilno aplikacijo</button>
          <button className="dlBtn no-print" onClick={izvoziCSV}>⬇ Izvozi CSV (za Google Sheets/Excel)</button>
          <button className="dlBtn no-print" onClick={() => PrintFit.natisni(wardRef.current, { orientacija:"landscape" })}>📄 Izvozi v PDF (A4 ležeče, 1 stran)</button>
          <button className="genBtn no-print" onClick={objavi} disabled={publishBusy} style={{marginTop:8}}>
            {publishBusy ? "Objavljam …" : "📤 Objavi neposredno v Supabase"}
          </button>
          {publishMsg && <p className="hint no-print" style={{color: publishMsg.ok ? "var(--ok)" : "var(--danger)"}}>{publishMsg.text}</p>}
        </React.Fragment>
      )}
    </div>
  );
}

// Pravičnost dežurstev — kontrolni seznam, razdelek 7: doslej je bilo
// skupno število dežurstev vidno samo znotraj rezultata generiranja
// ("4 · Pravičnost — novo stanje" spodaj), ne pa kadarkoli, brez generiranja.
// Uporabi isti roster.stevilo, ki ga nalozizDezurniKader že računa živo.
function PravicnostPregled({ roster }){
  const povprecje = roster.length ? roster.reduce((s, z) => s + (Number(z.stevilo) || 0), 0) / roster.length : 0;
  const maxStevilo = Math.max(1, ...roster.map(z => Number(z.stevilo) || 0));
  const sortirano = roster.slice().sort((a, b) => (Number(b.stevilo) || 0) - (Number(a.stevilo) || 0));
  return (
    <div className="card no-print" style={{marginBottom:12}}>
      <div style={{fontWeight:800, marginBottom:4}}>⚖ Pravičnost dežurstev — trenutno stanje</div>
      <p className="hint" style={{marginTop:0}}>
        Skupno število dežurstev doslej (zaprta zgodovina do 31. 8. 2026 + živo objavljeno), povprečje
        oddelka: <b>{povprecje.toFixed(1)}</b>. Kdor ima bistveno več od povprečja, je kandidat za manj
        naslednjih dežurstev; kdor ima manj, za več.
      </p>
      <table className="fairTable">
        <thead><tr><th>Zaposleni</th><th>Skupaj</th><th>Odstopanje od povprečja</th></tr></thead>
        <tbody>
          {sortirano.map(z => {
            const st = Number(z.stevilo) || 0;
            const odstopanje = st - povprecje;
            return (
              <tr key={z.ime}>
                <td>{z.ime}</td>
                <td><b>{st}</b><div className="bar"><i style={{width:(100*st/maxStevilo)+"%"}}></i></div></td>
                <td style={{color: odstopanje > 0.5 ? "var(--danger)" : odstopanje < -0.5 ? "var(--ok)" : "var(--muted)"}}>
                  {odstopanje > 0 ? "+" : ""}{odstopanje.toFixed(1)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ---------------------------------------------------------------------
function DezurstvaTab(){
  const [roster, setRoster] = useState(null);
  const [month, setMonth] = useState("2026-09");
  const [minRazmik, setMinRazmik] = useState(3);
  const [prostDan, setProstDan] = useState(true);
  const [maxVikend, setMaxVikend] = useState(true);
  const [rezultat, setRezultat] = useState(null);
  const [publishBusy, setPublishBusy] = useState(false);
  const [publishMsg, setPublishMsg] = useState(null);
  const [uvozMsg, setUvozMsg] = useState(null);
  const [uvozBusy, setUvozBusy] = useState(false);
  const [gsheetUrl, setGsheetUrl] = useState("");
  const [pdfBesedilo, setPdfBesedilo] = useState(null);
  const uvozRef = useRef();
  const printRef = useRef();

  const { startISO, endISO } = monthRange(month);

  const updateField = (ime, field, value) => {
    setRoster(r => r.map(z => z.ime===ime ? {...z, [field]: value} : z));
  };

  // Prebere barvno razpredelnico "Želje" (leave_entries) za izbrani mesec in
  // vrne { IME: { dopust:[iso,...], omejitve:[iso,...] } }. "bs"/"sti" se
  // obravnavata kot omejitve (blokiran samo ta dan, brez pravila "dan prej").
  const nalozitIzZelja = async (mesec) => {
    const { startISO: s, endISO: e } = monthRange(mesec);
    const { data, error } = await client.from("leave_entries").select("full_name, work_date, kind")
      .gte("work_date", s).lte("work_date", e);
    if (error || !data) return null;
    const grouped = {};
    data.forEach(row => {
      const key = (row.full_name || "").toUpperCase();
      if (!grouped[key]) grouped[key] = { dopust: [], omejitve: [] };
      if (row.kind === "ld") grouped[key].dopust.push(row.work_date);
      else grouped[key].omejitve.push(row.work_date);
    });
    return grouped;
  };

  const uporabiVZelja = (izZelja) => {
    setRoster(r => r.map(z => {
      let dopust = "", omejitve = "";
      if (izZelja && izZelja[z.ime]) {
        dopust = izZelja[z.ime].dopust.join(",");
        omejitve = izZelja[z.ime].omejitve.join(",");
      }
      return { ...z, dopust, omejitve, odsotnosti:"" };
    }));
  };

  useEffect(() => {
    nalozizDezurniKader(startISO).then(r => {
      setRoster(r);
      nalozitIzZelja(month).then(izZelja => { if (izZelja && Object.keys(izZelja).length) uporabiVZelja(izZelja); });
    });
    // eslint-disable-next-line
  }, []);

  // Skupno za CSV / Excel / Google Sheets / ročno urejeno PDF-besedilo.
  const uporabiVrsticeOmejitev = (vrsteVrstic, viraOpis) => {
    const posodobitve = {};
    vrsteVrstic.forEach(deli => {
      const ime = (deli[0] || "").trim().toUpperCase();
      if (!ime || ["IME","FULL_NAME"].includes(ime)) return; // preskoči morebitno glavo
      const dopust = (deli[1] || "").trim().split(";").map(s => s.trim()).filter(Boolean).join(",");
      const omejitve = (deli[2] || "").trim().split(";").map(s => s.trim()).filter(Boolean).join(",");
      posodobitve[ime] = { dopust, omejitve };
    });
    setRoster(r => r.map(z => posodobitve[z.ime] ? { ...z, dopust: posodobitve[z.ime].dopust, omejitve: posodobitve[z.ime].omejitve } : z));
    const neujemajoci = Object.keys(posodobitve).filter(ime => !roster.some(z => z.ime === ime));
    setUvozMsg(`Uvoženo ${Object.keys(posodobitve).length} vrstic iz ${viraOpis}.` + (neujemajoci.length ? ` Neprepoznana imena (preskočeno): ${neujemajoci.join(", ")}.` : ""));
  };

  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null); setPdfBesedilo(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") {
        setPdfBesedilo(vrsteVrstic.map(v => v[0]).join("\n"));
        setUvozMsg(`Iz PDF-ja izvlečenih ${vrsteVrstic.length} vrstic golega besedila — preveri/uredi spodaj v obliko "ime,dopust,omejitve" pred uvozom. Če je PDF povsem barvna preglednica brez besedilnih datumov (kot "Letni dopusti in omejitve"), to ne bo delovalo — pošlji jo Claude Code seji.`);
      } else {
        uporabiVrsticeOmejitev(vrsteVrstic, `datoteke "${file.name}"`);
      }
    } catch (e) {
      setUvozMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziIzGoogleSheet = async () => {
    if (!gsheetUrl.trim()) return;
    setUvozBusy(true); setUvozMsg(null);
    try {
      const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(gsheetUrl.trim());
      uporabiVrsticeOmejitev(vrsteVrstic, "Google Sheets");
    } catch (e) {
      setUvozMsg("Napaka pri branju Google Sheets: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const uvoziUrejenoPdfBesedilo = () => {
    if (!pdfBesedilo) return;
    const vrsteVrstic = window.ImportUtils.csvBesedilaVVrstice(pdfBesedilo);
    uporabiVrsticeOmejitev(vrsteVrstic, "urejenega PDF besedila");
    setPdfBesedilo(null);
  };

  const generiraj = () => {
    const staff = roster.map(z => ({
      ime: z.ime,
      obstojeceStevilo: Number(z.stevilo) || 0,
      zadnjeDezurstvo: z.zadnje || null,
      odsotnosti: z.odsotnosti.split(",").map(s => s.trim()).filter(Boolean),
      dopust: z.dopust.split(",").map(s => s.trim()).filter(Boolean),
      omejitve: z.omejitve.split(",").map(s => s.trim()).filter(Boolean),
      prostDanVTednu: z.prostDanVTednu || null,
      minMesecno: z.minMesecno === "" ? null : Number(z.minMesecno),
      maxMesecno: z.maxMesecno === "" ? null : Number(z.maxMesecno),
      samoMedTednom: !!z.samoMedTednom,
    }));
    const res = Generator.generirajDezurstva({
      startISO, endISO, minRazmikDni: Number(minRazmik), prostDanPoDezurstvu: prostDan,
      maxVikendMesecno: maxVikend, staff,
    });
    setRezultat({ mesec: month, ...res });
  };

  const prenesi = () => {
    if (!rezultat) return;
    download(`dezurstva-${rezultat.mesec}.json`, JSON.stringify(rezultat, null, 1));
  };

  const objavi = async () => {
    if (!rezultat) return;
    setPublishBusy(true); setPublishMsg(null);
    try {
      const rows = rezultat.razpored.filter(r => r.zaposleni).map(r => ({ ime: r.zaposleni, datum: r.datum, sifra: "DEŽURSTVO" }));
      const { objavljeno, manjkajo, oddelekNapaka } = await publishScheduleRows("DEZ", rows);
      setPublishMsg({ ok:true, text: `Objavljeno ${objavljeno} dežurstev v Supabase.` + (manjkajo.length ? ` Brez računa (preskočeno): ${manjkajo.join(", ")}.` : "") + (oddelekNapaka ? ` Opozorilo: samodejna nastavitev oddelka ni uspela (${oddelekNapaka}).` : "") });
    } catch (e) {
      setPublishMsg({ ok:false, text: e.message || String(e) });
    } finally {
      setPublishBusy(false);
    }
  };

  const maxNovih = rezultat ? Math.max(1, ...rezultat.stanje.map(s => s.novih)) : 1;

  return (
    <div>
      <h2 className="section no-print">1 · Dežurni kader — stanje ob začetku meseca</h2>
      <p className="hint no-print">Članstvo (kdo je dežurni kader) pride živo iz Imenika (oddelek "DEZ"). Število in datum zadnjega dežurstva se izračunata samodejno: zaprta zgodovina do 31. 8. 2026 + vse, kar je od takrat objavljeno v Supabase — po potrebi ju spodaj ročno popravite samo za to generiranje. Dopust/omejitve pridejo iz razpredelnice Želje in se ob spremembi meseca počistijo (znova jih uvozite ali osvežite spodaj). "Enota" z vrednostjo "?" pomeni, da domači oddelek osebe ni nastavljen v Imeniku. Ločite "Dopust (rdeče)" od "Omejitve (rumeno)": pri dopustu generator samodejno blokira tudi dan pred začetkom vsakega strnjenega bloka (in petek, če se blok začne v ponedeljek — sobota vmes ostane prosta), pri navadnih omejitvah pa samo naveden dan. "Min/Maks na mesec" in "Prost dan"/"Samo med tednom" so privzeto iz Imenika (HR podatki), tu jih lahko za to generiranje spremenite.</p>
      {!roster ? <p className="hint no-print">Nalagam dežurni kader …</p> : (
      <React.Fragment>
      <PravicnostPregled roster={roster} />
      <div className="card no-print" style={{marginBottom:12}}>
        <input ref={uvozRef} type="file" accept=".csv,text/csv,.xlsx,.xls,.pdf" style={{display:"none"}}
          onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={uvozBusy} onClick={() => uvozRef.current && uvozRef.current.click()}>
          {uvozBusy ? "Nalagam …" : "📤 Uvoz omejitev iz datoteke (CSV / Excel / PDF)"}
        </button>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>
          Oblika CSV/Excel: vsaka vrstica <code>ime,dopust,omejitve</code> (ime kot v tabeli spodaj; več datumov v enem
          polju ločenih s podpičjem, npr. <code>2026-09-01;2026-09-02</code>). Primer:
          roster/omejitve-september-2026.csv. PDF z besedilnimi datumi se da uvoziti prek spodnjega pregleda; povsem
          barvna preglednica brez besedila (kot "Letni dopusti in omejitve") žal še vedno ni samodejno berljiva —
          pošlji jo Claude Code seji.
        </p>
        <div className="field" style={{marginTop:10}}>
          <label>… ali povezava do Google Sheets (deljeno kot "vsak, ki ima povezavo, lahko ogleda")</label>
          <div style={{display:"flex", gap:8}}>
            <input type="url" value={gsheetUrl} onChange={e => setGsheetUrl(e.target.value)}
              placeholder="https://docs.google.com/spreadsheets/d/..." style={{flex:1}} />
            <button className="dlBtn" disabled={uvozBusy || !gsheetUrl.trim()} onClick={uvoziIzGoogleSheet}>Uvozi</button>
          </div>
        </div>
        {pdfBesedilo !== null && (
          <div className="field" style={{marginTop:10}}>
            <label>Golo besedilo iz PDF — preoblikuj v vrstice "ime,dopust,omejitve" (ena oseba na vrstico)</label>
            <textarea rows={10} value={pdfBesedilo} onChange={e => setPdfBesedilo(e.target.value)} style={{width:"100%", fontFamily:"monospace"}} />
            <button className="dlBtn" style={{marginTop:8}} disabled={uvozBusy} onClick={uvoziUrejenoPdfBesedilo}>Uvozi urejeno besedilo</button>
          </div>
        )}
        {uvozMsg && <p className="hint" style={{marginTop:8, marginBottom:0}}>{uvozMsg}</p>}
      </div>
      <div className="card no-print" style={{overflowX:"auto"}}>
        <table className="roster">
          <thead><tr><th>Zaposleni</th><th>Enota</th><th>Št. dežurstev</th><th>Zadnje</th><th>Odsotnosti</th><th>Dopust (rdeče)</th><th>Omejitve (rumeno)</th><th>Prost dan v tednu</th><th>Min/mes</th><th>Maks/mes</th><th>Samo med tednom</th></tr></thead>
          <tbody>
            {roster.map(z => (
              <tr key={z.ime}>
                <td>{z.ime}</td>
                <td>{z.enota}</td>

                <td><input type="text" style={{width:110}} value={z.zadnje} onChange={e => updateField(z.ime,"zadnje",e.target.value)} placeholder="LLLL-MM-DD" /></td>
                <td><input type="text" style={{width:150}} value={z.odsotnosti} onChange={e => updateField(z.ime,"odsotnosti",e.target.value)} placeholder="2026-08-10, 2026-08-11" /></td>
                <td><input type="text" style={{width:150}} value={z.dopust} onChange={e => updateField(z.ime,"dopust",e.target.value)} placeholder="2026-10-14, 2026-10-15" /></td>
                <td><input type="text" style={{width:150}} value={z.omejitve} onChange={e => updateField(z.ime,"omejitve",e.target.value)} placeholder="2026-10-22, 2026-10-23" /></td>
                <td>
                  <select value={z.prostDanVTednu} onChange={e => updateField(z.ime,"prostDanVTednu",e.target.value)}>
                    <option value="">—</option>
                    {["PO","TO","SR","ČE","PE","SO","NE"].map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </td>
                <td><input type="number" min="0" style={{width:50}} value={z.minMesecno} onChange={e => updateField(z.ime,"minMesecno",e.target.value)} /></td>
                <td><input type="number" min="0" style={{width:50}} value={z.maxMesecno} onChange={e => updateField(z.ime,"maxMesecno",e.target.value)} /></td>
                <td style={{textAlign:"center"}}><input type="checkbox" checked={!!z.samoMedTednom} onChange={e => updateField(z.ime,"samoMedTednom",e.target.checked)} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h2 className="section no-print">2 · Mesec in pravila</h2>
      <div className="card no-print">
        <div className="row">
          <div className="field"><label htmlFor="dmonth">Mesec</label>
            <input id="dmonth" type="month" value={month} onChange={async e => {
              const noviMesec = e.target.value;
              setMonth(noviMesec); setRezultat(null); setRoster(null);
              const { startISO: noviStart } = monthRange(noviMesec);
              setRoster(await nalozizDezurniKader(noviStart));
              const izZelja = await nalozitIzZelja(noviMesec);
              uporabiVZelja(izZelja);
            }} />
          </div>
          <div className="field"><label>&nbsp;</label>
            <button className="dlBtn" type="button" onClick={async () => {
              const izZelja = await nalozitIzZelja(month);
              uporabiVZelja(izZelja);
              setUvozMsg("Osveženo iz razpredelnice Želje.");
            }}>🔄 Osveži iz Želje</button>
          </div>
          <div className="field"><label htmlFor="mr">Min. razmik (dni)</label>
            <input id="mr" type="number" min="0" style={{width:70}} value={minRazmik} onChange={e => setMinRazmik(e.target.value)} />
          </div>
        </div>
        <div className="chk" style={{marginTop:12}}>
          <input id="pd" type="checkbox" checked={prostDan} onChange={e => setProstDan(e.target.checked)} />
          <label htmlFor="pd">Dan takoj po dežurstvu naj se ne razporeja na redno izmeno</label>
        </div>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>
          To neposredno naslavlja ugotovitev iz analize: doslej je 65&nbsp;% dežurstev takoj sledila redna izmena brez počitka.
        </p>
        <div className="chk" style={{marginTop:12}}>
          <input id="mv" type="checkbox" checked={maxVikend} onChange={e => setMaxVikend(e.target.checked)} />
          <label htmlFor="mv">Največ 1 sobota/nedelja na osebo na koledarski mesec</label>
        </div>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>
          Pravilo iz analize "Dežurstva 2026" (uporabljeno za september): noben zaposleni naj nima obeh vikend dni
          (sobote in nedelje) v istem mesecu. Stolpec "Prost dan v tednu" zgoraj je stalna omejitev osebe (npr. Matej
          Bojić nikoli ne dežura ob ponedeljkih) — ni vezan na posamezen mesec.
        </p>
      </div>

      <button className="genBtn no-print" onClick={generiraj}>Generiraj razpored dežurstev</button>
      </React.Fragment>
      )}

      {rezultat && (
        <React.Fragment>
          {rezultat.opozorila.length > 0 && (
            <div className="warnBox no-print">
              <div className="t">⚠ {rezultat.opozorila.length} dni brez samodejne rešitve</div>
              <ul>{rezultat.opozorila.map(o => <li key={o.datum}>{o.datum}: {o.sporocilo}</li>)}</ul>
            </div>
          )}

          <div className="printBlok" ref={printRef}>
            <h2 className="section">3 · Predlagan razpored — {rezultat.mesec}</h2>
            <table className="dutyTable">
              <thead><tr><th>Datum</th><th>Dan</th><th>Zaposleni</th></tr></thead>
              <tbody>
                {rezultat.razpored.map(r => (
                  <tr key={r.datum} className={(r.dan==="SO"||r.dan==="NE" ? "we " : "") + (!r.zaposleni ? "warn" : "")}>

                    <td>{r.zaposleni || <span className="pill" style={{background:"var(--danger)",color:"#2A1608"}}>ni rešitve</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>

          <h2 className="section no-print">4 · Pravičnost — novo stanje</h2>
          <table className="fairTable no-print">
            <thead><tr><th>Zaposleni</th><th>Prej</th><th>Novih</th><th>Skupaj</th></tr></thead>
            <tbody>

                  </td>
