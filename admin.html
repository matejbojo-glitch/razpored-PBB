<!-- Pisava Fraunces neblokirno: media="print" pomeni, da datoteka ne
     zadržuje izrisa; ko se naloži, jo onload preklopi na "all". Če se
     ne naloži (požarni zid, ni signala), stran deluje naprej z
     rezervno pisavo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      media="print" onload="this.media='all'" />

<style>
  /* Barve, radiji in sence so v theme.css (naložen zgoraj) - tu jih NE
     podvajamo. Prej je imela vsaka stran svojo kopijo in te so se
     razšle: --ok je bil tu #4C8C63, v theme.css #4F9B6B, --ok-rgb pa
     se ni podvajal - zato sta imeli znački .pill.ok ozadje iz ene
     zelene in besedilo iz druge. */
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  /* širina: theme.css (.wrap / .wrap.wide / .wrap.polna) */
  .wrap{ padding-bottom: 60px; }
  header.top{ position:sticky; top:0; z-index:20; background: linear-gradient(180deg, var(--bg) 75%, transparent);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  .wordmark .tag{ font-size:11.5px; color:var(--accent-ink); background:var(--accent); font-weight:800;
    padding:2px 8px; border-radius:999px; }
  .backlink{ display:inline-block; margin-top:10px; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px; text-decoration-color:var(--line); }

  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); padding:4px;
    border-radius:999px; margin-top:14px; }
  .tabs button{ flex:1; border:0; background:transparent; color:var(--muted); padding:10px 10px;
    border-radius:999px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=month], input[type=number], input[type=text], select{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px; min-width:0;
  }
  select{ min-width: 90px; }
  .chk{ display:flex; align-items:center; gap:8px; font-size:13.5px; }
  .chk input{ width:17px; height:17px; accent-color: var(--accent); }

  .deptRow{ display:flex; gap:8px; flex-wrap:wrap; margin: 10px 0 4px; }
  .deptBtn{ border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-weight:800;
    padding:9px 16px; border-radius:999px; cursor:pointer; font-size:14px; }
  .deptBtn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  table.roster{ width:100%; border-collapse:separate; border-spacing:0; margin-top:10px; font-size:13px; }
  table.roster th{ text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase;
    letter-spacing:.03em; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.roster td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.roster tr:last-child td{ border-bottom:0; }
  /* Prvi stolpec (ime/datum) ostane viden pri vodoravnem drsenju - te tabele
     imajo stolpec na teden, zato se na telefonu vedno drsi. Neprozorno
     ozadje, da vsebina pod njim ne presveti. */
  table.roster th:first-child, table.roster td:first-child{
    position:sticky; left:0; z-index:1; background:var(--surface);
  }
  table.roster thead th:first-child{ z-index:2; background:var(--surface-2); }
  .weekToggle{ border:1px solid var(--line); background:transparent; color:var(--muted); font-size:12px;
    font-weight:800; padding:9px 11px; min-height:40px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .weekToggle[aria-pressed="true"]{ background: var(--danger); border-color:var(--danger); color:#2A1608; }

  .genBtn{ margin-top:16px; width:100%; background: var(--accent); color: var(--accent-ink); border:0;
    padding:13px; border-radius: var(--radius-sm); font-weight:800; font-size:15px; cursor:pointer; }
  .genBtn:disabled{ opacity:.5; cursor:default; }
  .dlBtn{ margin-top:10px; width:100%; background: transparent; color: var(--text); border:1px solid var(--line);
    padding:11px; border-radius: var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; }

  .warnBox{ margin-top:14px; background: var(--danger-bg); border:1px solid var(--danger); border-radius: var(--radius-sm);
    padding:12px 14px; font-size:13px; }
  .warnBox .t{ font-weight:800; color: var(--danger); margin-bottom:6px; }
  .warnBox li{ margin: 3px 0; }

  .wardScroller{ margin-top:16px; overflow-x:auto; border:1px solid var(--line); border-radius: var(--radius);
    -webkit-overflow-scrolling:touch; }
  table.wardTable{ border-collapse:separate; border-spacing:0; width:max-content; }
  table.wardTable th, table.wardTable td{ padding:8px 9px; font-size:12px; text-align:center; white-space:nowrap;
    border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  table.wardTable thead th{ background:var(--surface-2); color:var(--muted); font-weight:700; position:sticky; top:0; font-size:11px; }
  table.wardTable td.name, table.wardTable th.name{ position:sticky; left:0; background:var(--surface); text-align:left;
    font-weight:700; min-width:118px; max-width:118px; overflow:hidden; text-overflow:ellipsis; z-index:2; }
  table.wardTable thead th.name{ z-index:3; background:var(--surface-2); }
  .swatch{ display:inline-block; padding:3px 6px; border-radius:6px; font-size:10.5px; font-weight:700; }

  .dutyTable{ width:100%; border-collapse:separate; border-spacing:0; margin-top:14px; font-size:13px; }
  .dutyTable th{ text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; padding:6px 8px;
    border-bottom:1px solid var(--line); }
  .dutyTable td{ padding:8px; border-bottom:1px solid var(--line); }
  .dutyTable tr.we td{ background: rgba(201,113,63,0.08); }
  .dutyTable tr.warn td{ background: var(--danger-bg); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:800; }
  .pill.ok{ background: rgba(var(--ok-rgb),.16); color: var(--ok); }

  /* Vrstico osebe riše skupna komponenta (oseba-vrstica.js) – tu ostane
     samo postavitev polj za urejanje, ki se pokažejo ob razprtju: dve
     koloni na širokem, ena na ozkem zaslonu. */
  .uporabnikPolja{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  @media (max-width: 560px){ .uporabnikPolja{ grid-template-columns:1fr; } }

  /* Revizija pravic: vpis kot kartica, ne vrstica tabele – najpomembnejši
     podatek (kaj se je spremenilo in ali gre za povišanje) mora biti viden
     brez vodoravnega drsenja na telefonu. */
  .revVnos{ padding:10px 0; border-bottom:1px solid var(--line); }
  .revVnos:last-child{ border-bottom:0; }
  .revGlava{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:14px; }
  .revSprememba{ font-size:13px; margin-top:3px; }
  .revNoga{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  .fairTable{ width:100%; border-collapse:separate; border-spacing:0; margin-top:12px; font-size:13px; }
  .fairTable th{ text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  .fairTable td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  .bar{ height:6px; border-radius:3px; background: var(--surface-2); overflow:hidden; margin-top:4px; }
  .bar i{ display:block; height:100%; background: var(--accent); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  @media print{
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th, table.roster th{ background:#f2f2f2 !important; }
    /* Izvoz v PDF (Kalup/Vodje) mora iti na 1 A4 stran ne glede na število
       zaposlenih/dni v mesecu – PrintFit.natisni() izračuna --print-scale in
       pokliče window.print(); "zoom" (ne transform) dejansko zmanjša zaseden
       prostor, kar brskalnik potrebuje za pravilen izračun 1 strani. Sticky
       stolpci/vrstice na 1 strani niso potrebni in bi lahko motili tisk. */
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important;
      zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr, table.dutyTable tr{ break-inside:avoid; page-break-inside:avoid; }
    .printBlok{ zoom: var(--print-scale, 1); }
    table.wardTable input[type="text"]{ border:none !important; color:#000 !important; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const { client } = RazporedAuth;

// Oddelki za kreiranje/generiranje razporeda – na izrecno željo omejeno na
// natanko teh 8 (glej supabase/schema.sql sekcija 23, isti seznam kot v
// imenik.html/zelje.html). Stare kode ostanejo v bazi (schedule_entries jih
// zgodovinsko referencira), samo tu se jih ne ponuja več za dodeljevanje.
const RAZPORED_ODDELKI = ["B", "C", "C1", "D", "E1", "E2", "FLEXI", "NZV"];

// ---------------------------------------------------------------------
// Objava generiranega razporeda naravnost v Supabase (schedule_entries),
// poleg obstoječega ročnega prenosa JSON. Zaposlene poveže po polnem
// imenu (profiles.full_name) – kdor se še ni registriral, se ne objavi
// in je izpisan kot manjkajoč.
// ---------------------------------------------------------------------
// Po uspešni objavi obvesti vse prizadete zaposlene (obvestilo v
// aplikaciji + potisno obvestilo na telefon, glej schema.sql sekcija 27).
// Namenoma NE prekine objave, če obveščanje spodleti - razpored je takrat
// že objavljen in to je pomembnejše od obvestila; napako samo vrnemo, da
// jo klicatelj lahko pokaže.
async function obvestiOObjavi(rows, deptCode){
  const datumi = rows.map(r => r.datum).filter(Boolean).sort();
  if (!datumi.length) return null;
  try {
    const { error } = await client.rpc("obvesti_o_objavi_razporeda", {
      p_start: datumi[0], p_end: datumi[datumi.length - 1], p_oddelek: deptCode || null,
    });
    if (error) throw error;
    return null;
  } catch (e) {
    return e.message || String(e);
  }
}

async function publishScheduleRows(deptCode, rows){
  const imena = [...new Set(rows.map(r => r.ime))];
  // Osebo poišči prek skupnega kazala (matična številka, ime kot rezerva
  // prek Imena.kljuc) - ne z dobesednim ujemanjem imena. Glej razlago pri
  // publishLeadScheduleRows: dobesedna primerjava tiho izgubi človeka, ki
  // je drugod zapisan z velikimi črkami ali brez strešic.
  const { data: profili, error: perr } = await client.from("profiles").select("id, full_name, department_code");
  if (perr) throw perr;
  const kazalo = window.Imena.kazalo(profili || []);
  const byIme = {};
  imena.forEach(ime => { const p = kazalo.najdi(ime, null); if (p) byIme[ime] = p; });
  const manjkajo = imena.filter(i => !byIme[i]);
  const vrstice = rows.filter(r => byIme[r.ime]).map(r => ({
    employee_id: byIme[r.ime].id, department_code: deptCode, work_date: r.datum, shift_code: r.sifra || "",
  }));
  if (vrstice.length > 0){
    const { error } = await client.from("schedule_entries").upsert(vrstice, { onConflict: "employee_id,work_date" });
    if (error) throw error;
  }
  // POZOR: samo med ljudmi IZ TEGA RAZPOREDA. Poizvedba zgoraj zdaj vrne
  // vse profile (iskanje po imenu je preseljeno v kazalo), zato bi
  // filtriranje čez "profili" oddelek nastavilo vsem v bolnišnici.
  const brezOddelka = Object.values(byIme).filter(p => !p.department_code).map(p => p.id);
  let oddelekNapaka = null;
  if (brezOddelka.length > 0){
    const { error } = await client.from("profiles").update({ department_code: deptCode }).in("id", brezOddelka);
    if (error) oddelekNapaka = error.message;
  }
  const obvestilaNapaka = vrstice.length > 0 ? await obvestiOObjavi(rows, deptCode) : null;
  return { objavljeno: vrstice.length, manjkajo, oddelekNapaka, obvestilaNapaka };
}

// Kot publishScheduleRows, a vsaka vrstica nosi SVOJ department_code
// (vsak vodja ima svojo domačo enoto) – uporablja VodjeTab.
async function publishLeadScheduleRows(rows){
  const imena = [...new Set(rows.map(r => r.ime))];
  // Osebo poišči po MATIČNI ŠTEVILKI, ime šele kot rezerva - in po imenu
  // prek Imena.kljuc, ne dobesedno.
  //
  // Doslej je bilo tu .in("full_name", imena) proti PROFILES. Imena za
  // razpored NZV pa prihajajo iz lead_departments, kjer so zapisana z
  // velikimi črkami ("ALUKIĆ DINO"), v profiles pa so "Priimek Ime"
  // ("Alukić Dino", glej supabase/imena-priimek-prvi.sql, ki popravi samo
  // profiles). Dobesedna primerjava zato ni našla nikogar: objava je
  // "uspela" z 0 zapisi, vsi pa so bili poročani kot "brez profila".
  // Ista past čaka pri strešicah (Bećirović/Becirovic) in dvobesednih
  // priimkih.
  const [{ data: profili, error: perr }, { data: hrVrstice }, { data: vodjeVrstice }] = await Promise.all([
    client.from("profiles").select("id, full_name"),
    client.from("profile_hr_details").select("profile_id, employee_code")
      .then(r => r, () => ({ data: [] })),
    // Matična številka vodje (supabase/nzv-maticne-stevilke-vodij.sql). Če
    // stolpca še ni, poizvedba pade - takrat se preprosto išče po imenu,
    // objava pa vseeno dela.
    client.from("lead_departments").select("full_name, employee_code")
      .then(r => (r.error ? { data: [] } : r), () => ({ data: [] })),
  ]);
  if (perr) throw perr;
  const sifraZaProfil = {};
  (hrVrstice || []).forEach(r => { if (r.employee_code) sifraZaProfil[r.profile_id] = r.employee_code; });
  const kazalo = window.Imena.kazalo((profili || []).map(p => ({ ...p, employee_code: sifraZaProfil[p.id] })));
  const sifraZaIme = {};
  (vodjeVrstice || []).forEach(r => { if (r.employee_code) sifraZaIme[window.Imena.kljuc(r.full_name)] = r.employee_code; });
  const byIme = {};
  imena.forEach(ime => {
    const najden = kazalo.najdi(ime, sifraZaIme[window.Imena.kljuc(ime)]);
    if (najden) byIme[ime] = najden;
  });
  const manjkajo = imena.filter(i => !byIme[i]);
  // Ista oseba je isti dan pogosto na VEČ enotah (npr. Džamastagić na PDZN,
  // SOBO in U2), schedule_entries pa ima unique (employee_id, work_date).
  // Brez združevanja je vsaka nadaljnja enota tiho prepisala prejšnjo -
  // razpored je pokazal eno enoto, druge pa so izginile. Isto pravilo in
  // ista koda kot pri uvozu NZV iz Sheets (nzv-zasedba.js): prva enota gre
  // v department_code, ostale v pokriva_oddelek.
  const vrstice = window.NzvZasedba.zdruziNzvZapise(
    rows.filter(r => byIme[r.ime] && r.department_code).map(r => ({
      employee_id: byIme[r.ime].id, department_code: r.department_code,
      work_date: r.datum, shift_code: r.sifra || "",
      // Odsotnost (LD/IZOB/BS) ni enota - brez "stolpec" ostane v shift_code
      // in ne zasede mesta enote.
      stolpec: r.jeEnota ? r.stolpec : undefined,
    })));
  if (vrstice.length > 0){
    let { error } = await client.from("schedule_entries").upsert(vrstice, { onConflict: "employee_id,work_date" });
    // Če stolpec pokriva_oddelek v bazi še ne obstaja (supabase/
    // dodaj-pokriva-oddelek.sql še ni bil pognan), Postgres zavrne CEL
    // upsert. To ne sme pomeniti, da objava sploh ne dela: shrani brez
    // tega polja (ena enota na osebo/dan, kot je bilo doslej).
    if (error && /pokriva_oddelek/i.test((error.message || "") + (error.details || ""))) {
      const brez = vrstice.map(({ pokriva_oddelek, ...ostalo }) => ostalo);
      ({ error } = await client.from("schedule_entries").upsert(brez, { onConflict: "employee_id,work_date" }));
    }
    if (error) throw error;
  }
  const obvestilaNapaka = vrstice.length > 0 ? await obvestiOObjavi(rows, null) : null;
  return { objavljeno: vrstice.length, manjkajo, obvestilaNapaka };
}

// ---------------------------------------------------------------------
// Statični podatki o oddelkih (SMS/TZN) – enaki kot pri generiranju
// oktobra 2026. Črka je stanje kalupa v tednu 28. 9. 2026 (sidro).
// ---------------------------------------------------------------------
const ANCHOR_MONDAY = "2026-09-28";
// Oddelčna struktura (kode, nazivi, hsuffix) je stalna nastavitev – 6
// SMS/TZN oddelkov se ne spreminja. Članstvo in rotacijska črka (A-E) sta
// PREJ bila tu trdo kodirana skupaj s to strukturo (glej git zgodovino),
// zdaj pa prihajata živo iz Supabase (profiles.department_code +
// profiles.rotation_slot, urejljivo v Imeniku) – glej nalozizOddelek spodaj.
const WARDS_META = {
  B:  { naziv:"B – oddelek",  hsuffix:false },
  C:  { naziv:"C – oddelek",  hsuffix:false },
  C1: { naziv:"C1 – oddelek", hsuffix:false },
  D:  { naziv:"D – oddelek",  hsuffix:false },
  E1: { naziv:"E1 – oddelek", hsuffix:true },
  E2: { naziv:"E2 – oddelek", hsuffix:false },
};

// ---------------------------------------------------------------------
// Napotilo iz Želja: "admin.html?tab=kalup&oddelek=C1&mesec=2026-10" ali
// "admin.html?tab=nzv&pod=dez&mesec=2026-10". Stran Želje pošlje sem s tem
// naslovom, da koordinatorju ni treba istega oddelka in meseca izbirati
// znova - tam je pravkar vpisal dopuste in omejitve, generator pa jih
// prebere iz baze sam.
//
// Naslov je ZUNANJI vhod (uporabnik ga lahko poljubno spremeni ali deli
// naprej), zato se vsako polje preveri proti znanim vrednostim, namesto da
// bi se mu zaupalo. Neveljavna vrednost pomeni "uporabi privzeto", ne
// napake - enako kot pri "index.html?uvoz=1&…" (glej preberiUvozIzNaslova
// v index.html). Ta funkcija NIČESAR ne generira in ne objavi: samo
// prednastavi zavihek, oddelek in mesec, sprožiti pa mora uporabnik sam.
const NAPOTILO_ZAVIHKI = ["kalup", "nzv", "uporabniki", "dopust", "place", "revizija"];
function preberiNapotiloIzNaslova(search){
  const p = new URLSearchParams(search || "");
  const tab = (p.get("tab") || "").trim().toLowerCase();
  const oddelek = (p.get("oddelek") || "").trim().toUpperCase();
  const pod = (p.get("pod") || "").trim().toLowerCase();
  const mesec = (p.get("mesec") || "").trim();
  const veljaven = {
    tab: NAPOTILO_ZAVIHKI.includes(tab) ? tab : null,
    // Generator rotacije pozna samo 6 SMS/TZN oddelkov (WARDS_META).
    // FLEXI in NZV se tu NE generirata - Želje za FLEXI napotijo drugam.
    oddelek: Object.prototype.hasOwnProperty.call(WARDS_META, oddelek) ? oddelek : null,
    pod: (pod === "vodje" || pod === "dez") ? pod : null,
    mesec: /^\d{4}-(0[1-9]|1[0-2])$/.test(mesec) ? mesec : null,
  };
  // Brez enega samega veljavnega podatka naslov ni napotilo - stran se
  // odpre povsem po svoje, kot doslej.
  return Object.keys(veljaven).some(k => veljaven[k]) ? veljaven : null;
}

// Vrne [[ime, rotacijskaČrka], ...] za en oddelek – ista oblika, kot jo je
// prej vračal WARDS_META[koda].staff, da ostane vsa nadaljnja koda (Kalup,
// PrednostniPanel) nespremenjena. Manjkajoč rotation_slot (nova oseba, še
// ne nastavljena v Imeniku) privzeto pade na "A", vidno označeno spodaj.
async function nalozizOddelek(koda){
  // "id" je tu zato, da je ime v mreži lahko povezava na profil osebe
  // (imenik.html?id=...). Generator sam ga ne potrebuje.
  const { data } = await client.from("profiles").select("id, full_name, rotation_slot")
    .eq("department_code", koda).order("full_name");
  return (data || []).map(p => [p.full_name, p.rotation_slot || "A", !p.rotation_slot, p.id]);
}

// Dnevne "rumene" omejitve (Razpredelnica Želje, leave_entries.kind="omejitev")
// za dani razpon – Kalup generator jih uporabi za samodejno iskanje
// nadomestila (glej generirajKalup v generator-core.js).
// "imena" so imena osebja, kot jih pozna kalup - izid se vrne pod TEMI
// imeni, ne pod tistimi iz leave_entries. Ujemanje gre prek imena.js
// (isti modul kot NZV), ker so imena v leave_entries zapisana različno:
// ročni vnos v Razpredelnici tako kot v Imeniku, uvoz iz CSV pa z velikimi
// črkami. Z dobesedno primerjavo se je prenesel le tisti del, ki se je
// slučajno ujemal črko v črko.
// Katere vrste odsotnosti pomenijo "ta dan ne more delati na oddelku".
// Poleg rumene omejitve tudi BOLNIŠKA in STROKOVNO IZOBRAŽEVANJE: prej ju
// kalup sploh ni bral, zato je osebo na bolniški vseeno razporedil na
// izmeno in zanjo ni iskal nadomestila. Letni dopust ima svojo pot
// (nalozizLdTedne), ker se šteje v CELIH tednih.
const KALUP_ODSOTNOST_KIND = ["omejitev", "bs", "sti"];

async function nalozizOmejitve(startISO, endISO, imena){
  const { data } = await client.from("leave_entries").select("full_name, work_date")
    .in("kind", KALUP_ODSOTNOST_KIND).gte("work_date", startISO).lte("work_date", endISO);
  const poKljucu = {};
  (imena || []).forEach(ime => { poKljucu[kljucImena(ime)] = ime; });
  const map = {};
  (data || []).forEach(r => {
    const ime = poKljucu[kljucImena(r.full_name)];
    if (!ime) return;
    (map[ime] = map[ime] || []).push(r.work_date);
  });
  return map;
}

// Letni dopust (Razpredelnica Želje, leave_entries.kind="ld") za dani
// razpon, pretvorjen v CELE tedne, kot jih pričakuje generator kalupa.
// Teden šteje za dopustniški, če ima oseba v njem vsaj 3 dni LD - en sam
// dan LD sredi tedna je odsotnost, ne "prosti teden", in bi po nepotrebnem
// izpraznil cel teden rotacije.
async function nalozizLdTedne(startISO, endISO, tedni, imena){
  const { data } = await client.from("leave_entries").select("full_name, work_date")
    .eq("kind", "ld").gte("work_date", startISO).lte("work_date", endISO);
  const poKljucu = {};
  (imena || []).forEach(ime => { poKljucu[kljucImena(ime)] = ime; });
  const stetje = {}; // "ime|ponedeljek" -> stevilo dni LD
  (data || []).forEach(r => {
    const d = new Date(r.work_date + "T00:00:00Z");
    const zamik = (d.getUTCDay() + 6) % 7;          // 0 = ponedeljek
    d.setUTCDate(d.getUTCDate() - zamik);
    const mo = d.toISOString().slice(0, 10);
    if (!tedni.includes(mo)) return;
    // Ključ pod IMENOM OSEBJA (ne pod imenom iz leave_entries) - ročni
    // popravki v razpredelnici uporabljajo isti zapis in se morajo z
    // izpeljanimi tedni sešteti, ne izključevati.
    const ime = poKljucu[kljucImena(r.full_name)];
    if (!ime) return;
    const k = ime + "|" + mo;
    stetje[k] = (stetje[k] || 0) + 1;
  });
  const out = {};
  Object.keys(stetje).forEach(k => { if (stetje[k] >= 3) out[k] = "LD"; });
  return out;
}

// Vrne polni začetni roster za DezurstvaTab: članstvo iz profiles (primarni
// department_code ali profile_departments "DEZ" – nekdo je lahko hkrati na

// 31. 8. 2026 + živo prišteti schedule_entries od 1. 9. 2026 do startISO
// (izključno), osebne nastavitve iz profile_hr_details.duty_*.
async function nalozizDezurniKader(startISO){
  const { data: profili } = await client.from("profiles")
    .select("id, full_name, department_code, profile_departments(department_code), profile_hr_details(duty_min_monthly, duty_max_monthly, duty_day_off, duty_weekdays_only)")
    .order("full_name");
  const dezurni = (profili || []).filter(p =>
    p.department_code === "DEZ" || (p.profile_departments || []).some(d => d.department_code === "DEZ")
  );
  const { data: entries } = await client.from("schedule_entries").select("employee_id, work_date")
    .eq("department_code", "DEZ").gte("work_date", "2026-09-01").lt("work_date", startISO);
  const odZivih = {};
  (entries || []).forEach(e => {
    const s = odZivih[e.employee_id] || (odZivih[e.employee_id] = { stevilo:0, zadnje:null });
    s.stevilo += 1;
    if (!s.zadnje || e.work_date > s.zadnje) s.zadnje = e.work_date;
  });
  return dezurni.map(p => {
    const hr = Array.isArray(p.profile_hr_details) ? p.profile_hr_details[0] : p.profile_hr_details;
    const osnova = DEZURNI_OSNOVA_PO_KLJUCU[kljucImena(p.full_name)] || { stevilo:0, zadnje:null };
    const ziv = odZivih[p.id] || { stevilo:0, zadnje:null };
    return {
      id: p.id, ime: p.full_name, enota: p.department_code || "?",
      stevilo: osnova.stevilo + ziv.stevilo,
      zadnje: (ziv.zadnje && (!osnova.zadnje || ziv.zadnje > osnova.zadnje)) ? ziv.zadnje : (osnova.zadnje || ""),
      odsotnosti:"", dopust:"", omejitve:"",
      prostDanVTednu: (hr && hr.duty_day_off) || "",
      minMesecno: hr && hr.duty_min_monthly != null ? String(hr.duty_min_monthly) : "",
      maxMesecno: hr && hr.duty_max_monthly != null ? String(hr.duty_max_monthly) : "",
      samoMedTednom: !!(hr && hr.duty_weekdays_only),
    };
  });
}

function shiftBucket(sifra){
  const t=(sifra||"").toLowerCase().replace(/\s+/g, "");
  if (t.startsWith("ld") || t.startsWith("kpu") || t === "pomočdrugje" || !t) return null;
  if (t.includes("nočna12")) return "PONOCI";
  if (t.includes("dnevna12")) return "DOPOLDNE";
  if (t.startsWith("nočna")) return "PONOCI";
  // Obe pisavi: stari zapisi v bazi ("dopoldan") in novi iz kalupa
  // ("Dopoldne").
  if (t.startsWith("dopoldan") || t.startsWith("dopoldne")) return "DOPOLDNE";
  if (t.startsWith("popoldan") || t.startsWith("popoldne")) return "POPOLDNE";
  return null;
}

}

// Koledarski izračuni so v datum.js - en sam vir za vse strani (ta
// različica je edina računala v UTC, ostale v lokalnem času).
const monthRange = window.Datum.obseg;
// Dnevi v mesecu in sestava ISO datuma prav tako iz datum.js. Kratica
// dneva ostane trigla ("PON", "TOR" ...), kot je bila v tem pogledu.
function danovVMesecu2(monthStr){ const [y,m] = monthStr.split("-").map(Number); return window.Datum.zadnjiDan(y, m); }
function isoZaMesec(monthStr, d){ const [y,m] = monthStr.split("-").map(Number); return window.Datum.iso(y, m, d); }
// Prazniki so v prazniki.js - en sam vir za vse zaslone. Tu je bila
// doslej ČETRTA kopija izračuna (lasten velikonočni algoritem + svoj
// seznam datumov). Ravno tako razpršeno pravilo je že trikrat povzročilo
// napačen razpored, zato tudi generator zdaj bere iz skupnega vira.
function mondaysInRange(startISO, endISO){
  const { toDate, mondayOfWeek, fromDate, addDays } = Generator.util;
  const out = [];
  let d = mondayOfWeek(toDate(startISO));
  const end = toDate(endISO);
  while (d.getTime() <= end.getTime()){
    out.push(fromDate(d));
    d = addDays(d, 7);
  }
  return out;
}
function fmtShort(iso){
  const d = new Date(iso+"T00:00:00Z");
  return d.getUTCDate() + "." + (d.getUTCMonth()+1) + ".";
}
function download(filename, text){
  const blob = new Blob([text], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------
// Predlog prednosti za prost teden – na podlagi dejanske obremenjenosti
// (nočne ure, nedelje/prazniki) iz nadzorne plošče (modul 3), ne iz
// ugibanja. Kvota letnega dopusta ni znana vnaprej (ni je v Kadrisu, ki
// smo ga analizirali) – vnese jo koordinator ročno, po zaposlenem.
// ---------------------------------------------------------------------
function PrednostniPanel({ staff, stanje, tedni, onPredlagaj, kvote, setKvote }){
  const [baseline, setBaseline] = useState(null);
  const [err, setErr] = useState(null);
  const [sortKey, setSortKey] = useState("nedpraz");
  const [sortDir, setSortDir] = useState(-1);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    fetch("dashboard-baseline.json").then(r => r.json())
      .then(d => setBaseline(d.osnova_sms.podatki))
      .catch(() => setErr("Ni mogoče naložiti dashboard-baseline.json – panel prikazuje samo imena, brez podatkov o obremenjenosti."));
  }, []);

  const rows = useMemo(() => {
    return staff.map(([ime]) => {
      const b = (baseline || []).find(z => z.ime === ime);
      const dosedanjiLD = b ? b.ld : null;
      const novihTaSeja = tedni.filter(mo => stanje[ime + "|" + mo] === "LD").length;
      const kvota = kvote[ime] !== undefined && kvote[ime] !== "" ? Number(kvote[ime]) : null;
      const preostane = (kvota != null && dosedanjiLD != null) ? kvota - dosedanjiLD - novihTaSeja : null;
      return {
        ime,
        nocne: b ? b.nocne : null,
        nedpraz: b ? b.nedpraz : null,
        ld: dosedanjiLD,
        novihTaSeja,
        kvota,
        preostane,
      };
    });
  }, [staff, baseline, kvote, stanje, tedni]);

  const sorted = useMemo(() => {
    const arr = rows.slice();
    arr.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * sortDir;
    });
    return arr;
  }, [rows, sortKey, sortDir]);

  const onSort = (k) => { if (k === sortKey) setSortDir(d => -d); else { setSortKey(k); setSortDir(-1); } };
  const maxNedpraz = Math.max(1, ...rows.map(r => r.nedpraz || 0));

  const predlagaj = (ime) => {
    const prostTeden = tedni.find(mo => !stanje[ime + "|" + mo]);
    if (!prostTeden) { setMsg(ime + ": vsi vidni tedni so že označeni."); return; }
    onPredlagaj(ime, prostTeden);
    setMsg(null);
  };

  return (
    <div className="card" style={{overflowX:"auto", marginTop:10}}>
      {err && <p className="hint" style={{color:"var(--danger)"}}>{err}</p>}
      <table className="roster">
        <thead>
          <tr>
            <th>Zaposleni</th>
            <th style={{cursor:"pointer"}} onClick={() => onSort("nocne")}>Nočne ure{sortKey==="nocne"?" ▾":""}</th>
            <th style={{cursor:"pointer"}} onClick={() => onSort("nedpraz")}>Ned.+praz.{sortKey==="nedpraz"?" ▾":""}</th>
            <th>Doslej LD</th>
            <th>Letna kvota</th>
            <th>Preostane</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {sorted.map(r => (
            <tr key={r.ime}>
              <td>{r.ime}</td>
              <td>
                {r.nocne != null ? r.nocne : "–"}
                {r.nedpraz != null && <div className="bar"><i style={{width:(100*(r.nedpraz||0)/maxNedpraz)+"%"}}></i></div>}
              </td>
              <td>{r.nedpraz != null ? r.nedpraz : "–"}</td>
              <td>{r.ld != null ? r.ld : "–"}</td>
              <td>
                <input type="number" style={{width:56}} min="0" placeholder="?"
                  value={kvote[r.ime] !== undefined ? kvote[r.ime] : ""}
                  onChange={e => setKvote(k => ({...k, [r.ime]: e.target.value}))} />
              </td>
              <td>{r.preostane != null ? r.preostane : <span style={{color:"var(--muted)"}}>vnesi kvoto</span>}</td>
              <td><button className="weekToggle" onClick={() => predlagaj(r.ime)}>Predlagaj teden</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      {msg && <p className="hint" style={{marginTop:8, marginBottom:0}}>{msg}</p>}
      <p className="hint" style={{marginTop:10, marginBottom:0}}>
        Nočne ure in nedelje/prazniki so kumulativni podatki iz nadzorne plošče (modul 3) – kdor ima
        največ (obarvan vrh razvrstitve), je najbolj upravičen do prostega tedna. Kvoto letnega dopusta
        vnesite ročno po zaposlenem (ni je bilo mogoče razbrati iz analize prisotnosti). Gumb "Predlagaj
        teden" samo označi prvi še neoznačeni teden spodaj – vi ga potrdite ali spremenite pred generiranjem.
      </p>
    </div>
  );
}

// ---------------------------------------------------------------------
// Pokritost po dnevih – kontrolni seznam, razdelek 7, predlog 3: primerja
// dejansko zasedbo (po dopustu/pomoči/nadomestilih) s tem, kar bi kalup
// običajno zasedel ta dan brez odsotnosti. Prag je samodejno izračunan,
// a ostaja ročno popravljiv na dan, ker "pričakovano" ni vedno enoznačno
// (npr. namerno tanjša zasedba ob znanih mirnejših dnevih).
// Urejevalnik minimumov (department_shift_minimums) – admin ureja natančen
// minimum po izmeni za trenutni oddelek. Osnutek vrednosti je bil seed-an
// prek schema.sql (§17, iz starega analiznega prototipa) – ni potrjen,
// zato je tu vedno urejljiv, ne prikazan kot trdno pravilo.
function MinimumiUrejevalnik({ koda, minimumi, setMinimumi }){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const polje = (bucket, key, vrednost) => {
    setMinimumi(m => ({ ...m, [bucket]: { ...(m[bucket] || { shift_bucket: bucket }), [key]: vrednost } }));
  };

  const shrani = async () => {
    setBusy(true); setMsg(null);
    try {
      const rows = ["DOPOLDNE", "POPOLDNE", "PONOCI"].map(b => {
        const v = minimumi[b] || {};
        return {
          department_code: koda, shift_bucket: b,
          min_dms: v.min_dms === "" || v.min_dms == null ? null : Number(v.min_dms),
          min_sms: v.min_sms === "" || v.min_sms == null ? null : Number(v.min_sms),
          min_flexi: v.min_flexi === "" || v.min_flexi == null ? null : Number(v.min_flexi),
          note: v.note || null,
          updated_at: new Date().toISOString(),
        };
      });
      const { error } = await client.from("department_shift_minimums").upsert(rows, { onConflict: "department_code,shift_bucket" });
      if (error) throw error;
      setMsg({ ok: true, text: "Minimumi shranjeni." });
    } catch (e) {
      setMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="card no-print" style={{overflowX:"auto", marginBottom:10}}>
      <table className="roster">
        <thead><tr><th>Izmena</th><th>Min. DMS</th><th>Min. SMS</th><th>Min. FLEXI</th><th>Opomba</th></tr></thead>
        <tbody>
          {["DOPOLDNE", "POPOLDNE", "PONOCI"].map(b => {
            const v = minimumi[b] || {};
            return (
              <tr key={b}>
                <td>{IZMENA_LABEL[b]}</td>
                {["min_dms", "min_sms", "min_flexi"].map(key => (
                  <td key={key}>
                    <input type="number" min="0" style={{width:56}} value={v[key] ?? ""}
                      onChange={e => polje(b, key, e.target.value)} />
                  </td>
                ))}
                <td><input type="text" style={{width:"100%"}} value={v.note || ""} onChange={e => polje(b, "note", e.target.value)} /></td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <button className="dlBtn" style={{marginTop:8}} disabled={busy} onClick={shrani}>{busy ? "Shranjujem …" : "Shrani minimume"}</button>
      {msg && <p className="hint" style={{marginTop:6, color: msg.ok ? "inherit" : "var(--danger)"}}>{msg.text}</p>}
    </div>
  );
}

// Vrne seznam vrzeli v pokritosti (isti izračun kot PokritostPoDnevih -
// tu izluščen, da ga lahko uporabi tudi vizualni povzetek pravil, brez
// podvajanja logike).
function izracunajVrzeli({ rezultat, celica, pragPopravki, minimumi }){
  const imaMinimume = minimumi && ["DOPOLDNE", "POPOLDNE", "PONOCI"].some(b => {
    const v = minimumi[b];
    return v && (v.min_dms || v.min_sms || v.min_flexi);
  });
  const vrzeli = [];
  if (imaMinimume) {
    rezultat.dnevi.forEach(dn => {
      ["DOPOLDNE", "POPOLDNE", "PONOCI"].forEach(b => {
        const v = minimumi[b];
        const minVsota = v ? (Number(v.min_dms) || 0) + (Number(v.min_sms) || 0) + (Number(v.min_flexi) || 0) : 0;
        if (!minVsota) return;
        const dejansko = rezultat.staff.filter(z => shiftBucket(celica(z, dn)) === b).length;
        // "bucket" pove, KATERE izmene zmanjka - brez tega se vrzeli da
        // samo prešteti, ne pa tudi predlagati, kdo naj jo zapolni.
        if (dejansko < minVsota) vrzeli.push({ datum: dn.datum, bucket: b, primanjkljaj: minVsota - dejansko });
      });
    });
  } else {
    rezultat.dnevi.forEach(dn => {
      const dejansko = rezultat.staff.filter(z => {
        const v = celica(z, dn);
        return v && v !== "LD";
      }).length;
      const samodejniPrag = rezultat.pricakovanoPoDnevih[dn.datum] || 0;
      const prag = pragPopravki[dn.datum] != null ? pragPopravki[dn.datum] : samodejniPrag;
      // Brez nastavljenih minimumov se ve le, da tisti dan manjka toliko
      // ljudi - ne pa, v kateri izmeni. Predlog zato takrat ni mogoč
      // (bucket ostane null) in gumb to pove.
      if (prag - dejansko > 0) vrzeli.push({ datum: dn.datum, bucket: null, primanjkljaj: prag - dejansko });
    });
  }
  return { vrzeli, imaMinimume };
}

// Vizualni povzetek pravil namesto dolgih besedilnih pojasnil:
// [✓] izpolnjeno · [!] manjše opozorilo · [✗] kritična kršitev.
// Zložljiv razdelek - dolga pojasnila in napredne nastavitve so privzeto
// skrita, da je na vrhu vidno samo bistvo (izberi → generiraj → rezultat).
// Slovenska sklanjatev: 1 teden, 2 tedna, 3-4 tedni, 5+ tednov.
function tedniBesedilo(n){
  const d = n % 10, s = n % 100;
  if (s >= 11 && s <= 14) return n + " tednov";
  if (d === 1) return n + " teden";
  if (d === 2) return n + " tedna";
  if (d === 3 || d === 4) return n + " tedni";
  return n + " tednov";
}

  const opozorila = rezultat.opozorila || [];

  // Delovnopravna pravila (počitek med izmenama, zaporedne nočne, prost dan
  // v tednu) – krsitve prihajajo od zunaj (KalupTab), izračunane nad
  // DEJANSKIM razporedom (vključno z ročnimi popravki celic), tako da jih

          `${vrzeli.length} ${vrzeli.length === 1 ? "vrzel" : "vrzeli"} v pokritosti – glej razdelek "Pokritost po dnevih" spodaj.` },

    opozorila.length === 0
      ? { stanje: "ok", naslov: "Želje in omejitve", opis: "Vse vnesene omejitve so samodejno pokrite z nadomestilom." }
      : { stanje: "opozorilo", naslov: "Omejitve brez nadomestila", opis:
          `${opozorila.length} ${opozorila.length === 1 ? "omejitev" : "omejitev"} ni bilo mogoče samodejno pokriti – potreben ročen pregled.` },

    imaMinimume
      ? { stanje: "ok", naslov: "Minimumi po izmenah", opis: "Za ta oddelek so nastavljeni natančni minimumi, zato je zaznava vrzeli natančna." }
      : { stanje: "opozorilo", naslov: "Minimumi niso nastavljeni", opis: "Uporablja se groba primerjava s kalupom. Za natančno zaznavo nastavi minimume po izmenah zgoraj." },

    pov.kriticnih > 0

      : pov.opozoril > 0

        : { stanje: "ok", naslov: "Delovnopravna pravila", opis: "Počitek med izmenama, zaporedne nočne in prost dan v tednu so v mejah." },

    { stanje: "ok", naslov: "Obseg razporeda", opis: `${rezultat.staff.length} zaposlenih × ${rezultat.dnevi.length} dni.` },
  ];

  const IKONA = { ok: "✓", opozorilo: "!", kriticno: "✗" };

  return (
    <div className="card no-print">
      {pravila.map(pr => (

          )}

}

function PokritostPoDnevih({ rezultat, celica, pragPopravki, setPragPopravki, minimumi }){
  const imaMinimume = minimumi && ["DOPOLDNE", "POPOLDNE", "PONOCI"].some(b => {
    const v = minimumi[b];
    return v && (v.min_dms || v.min_sms || v.min_flexi);
  });

  if (imaMinimume) {
    const vrstice = [];
    rezultat.dnevi.forEach(dn => {
      ["DOPOLDNE", "POPOLDNE", "PONOCI"].forEach(b => {
        const v = minimumi[b];
        const minVsota = v ? (Number(v.min_dms) || 0) + (Number(v.min_sms) || 0) + (Number(v.min_flexi) || 0) : 0;
        if (!minVsota) return;
        const dejansko = rezultat.staff.filter(z => shiftBucket(celica(z, dn)) === b).length;
        if (dejansko < minVsota) vrstice.push({ dn, b, dejansko, minVsota, primanjkljaj: minVsota - dejansko });
      });
    });
    if (vrstice.length === 0) {
      return <p className="hint no-print">Ni zaznanih vrzeli – dejanska zasedba po izmenah ustreza nastavljenim minimumom na vsak dan.</p>;
    }
    return (
      <div className="card no-print" style={{overflowX:"auto"}}>
        <table className="roster">
          <thead><tr><th>Dan</th><th>Izmena</th><th>Dejansko</th><th>Minimum</th><th>Primanjkljaj</th></tr></thead>
          <tbody>
            {vrstice.map(({ dn, b, dejansko, minVsota, primanjkljaj }) => (
              <tr key={dn.datum + b}>
                <td>{dn.dan} {window.Datum.slo(dn.datum)}</td>
                <td>{IZMENA_LABEL[b]}</td>
                <td>{dejansko}</td>
                <td>{minVsota}</td>
                <td style={{color:"var(--danger)", fontWeight:800}}>-{primanjkljaj}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  // Brez nastavljenih minimumov za ta oddelek: pade nazaj na prvotno
  // primerjavo z "bazni kalup" (brez odsotnosti), da ni regresije.
  const vrstice = rezultat.dnevi.map(dn => {
    const dejansko = rezultat.staff.filter(z => {
      const v = celica(z, dn);
      return v && v !== "LD";
    }).length;
    const samodejniPrag = rezultat.pricakovanoPoDnevih[dn.datum] || 0;
    const prag = pragPopravki[dn.datum] != null ? pragPopravki[dn.datum] : samodejniPrag;
    return { dn, dejansko, prag, samodejniPrag, primanjkljaj: prag - dejansko };
  }).filter(v => v.primanjkljaj > 0);

  if (vrstice.length === 0) {
    return <p className="hint no-print">Ni zaznanih vrzeli – dejanska zasedba ustreza pričakovani zasedbi kalupa na vsak dan. (Nasvet: nastavi natančne minimume po izmeni zgoraj za bolj natančno zaznavo.)</p>;
  }

  return (
    <div className="card no-print" style={{overflowX:"auto"}}>
      <table className="roster">
        <thead><tr><th>Dan</th><th>Dejansko</th><th>Pričakovano</th><th>Primanjkljaj</th></tr></thead>
        <tbody>
          {vrstice.map(({ dn, dejansko, prag, samodejniPrag, primanjkljaj }) => (
            <tr key={dn.datum}>
              <td>{dn.dan} {window.Datum.slo(dn.datum)}</td>
              <td>{dejansko}</td>
              <td>
                <input type="number" min="0" style={{width:56}} value={prag}
                  onChange={e => setPragPopravki(p => ({ ...p, [dn.datum]: e.target.value === "" ? samodejniPrag : Number(e.target.value) }))}
                  title="Samodejno izračunano iz kalupa, ročno popravljivo" />
              </td>
              <td style={{color:"var(--danger)", fontWeight:800}}>-{primanjkljaj}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function KalupTab({ zacetniOddelek, zacetniMesec }){
  const [koda, setKoda] = useState(zacetniOddelek || "B");
  const [month, setMonth] = useState(zacetniMesec || "2026-11");
  const [letters, setLetters] = useState({}); // override startLetter po imenu
  // "ime|monday" -> "LD" (letni dopust) | undefined (navadna rotacija).
  // Oznaka "POMOC" ("Pomoč na drugem oddelku") je bila odstranjena na
  // uporabnikovo zahtevo - navzkrižno pokrivanje se ne vodi več prek
  // generatorja, ampak z razporedom na ciljnem oddelku.
  const [tedenskoStanje, setTedenskoStanje] = useState({});
  const [samodejnoLdSt, setSamodejnoLdSt] = useState(0); // koliko tednov LD je bilo samodejno prebranih iz baze
  const [kvote, setKvote] = useState({}); // letna kvota dopusta po imenu (ročni vnos, ni v Kadrisu)
  const [rezultat, setRezultat] = useState(null);
  const [publishBusy, setPublishBusy] = useState(false);
  const [publishMsg, setPublishMsg] = useState(null);
  const [kvoteUvozMsg, setKvoteUvozMsg] = useState(null);
  const [kvoteUvozBusy, setKvoteUvozBusy] = useState(false);
  const kvoteFileRef = useRef();
  const wardRef = useRef();
  // Zapis PREDOGLEDA (še ne objavljenega) nazaj v Google Sheets – ista
  // povezava/dokument, ki ga admin že uporablja za ta oddelek, zato se
  // shrani ločeno po oddelku (localStorage), enako kot v index.html.
  const [sheetsUrl, setSheetsUrl] = useState(() => { try { return localStorage.getItem("kalup-sheets-url-" + koda) || ""; } catch (e) { return ""; } });
  const [sheetsBusy, setSheetsBusy] = useState(false);
  const [sheetsMsg, setSheetsMsg] = useState(null);
  useEffect(() => {
    setSheetsMsg(null);
    try { setSheetsUrl(localStorage.getItem("kalup-sheets-url-" + koda) || ""); } catch (e) { setSheetsUrl(""); }
  }, [koda]);
  const spremeniSheetsUrl = (v) => {
    setSheetsUrl(v);
    try { localStorage.setItem("kalup-sheets-url-" + koda, v); } catch (e) { /* zasebni način ipd. - ni usodno */ }
  };
  // Ročni popravki po izračunu: "ime|datum" -> besedilo. Podobna logika kot v
  // zavihku Vodje, a tu se (za razliko od Vodje) popravek upošteva TUDI ob
  // objavi v Supabase - vsaka celica tu je natanko ena oseba/en dan, zato se
  // zanesljivo preslika nazaj na eno izmeno (v Vodje en stolpec združuje več
  // ljudi v eno prosto besedilo, zato tam to ni varno).
  const [popravki, setPopravki] = useState({});
  // Pokritost po dnevih (razdelek 7, predlog 3): samodejno pričakovano
  // število po dnevu (iz kalupa) je le izhodišče – admin ga lahko tu
  // ročno popravi, če se za posamezen dan ne zdi pravilno.
  const [pragPopravki, setPragPopravki] = useState({});
  // "Predlagaj mesec": predlogi za vrzeli. Enako kot pri mreži NZV so to
  // PREDLOGI - v razpored se vpišejo šele, ko jih koordinator potrdi.
  const [predlogiVrzeli, setPredlogiVrzeli] = useState(null);
  const [potrjeneVrzeli, setPotrjeneVrzeli] = useState({});
  const [staffList, setStaffList] = useState(null); // [[ime, rotacijskaČrka, manjkaNastavitev, id], ...]
  // Generator kalupa ID-ja ne prenaša skozi (dela samo z imeni in vzorci),
  // zato ga za povezavo na profil poiščemo nazaj po imenu. Imena v tem
  // seznamu prihajajo iz istega vira kot mreža, zato je ujemanje točno.
  const idPoImenu = useMemo(() => {
    const m = {};
    (staffList || []).forEach(([ime, , , id]) => { if (id) m[ime] = id; });
    return m;
  }, [staffList]);
  useEffect(() => { setStaffList(null); nalozizOddelek(koda).then(setStaffList); }, [koda]);
  const [genBusy, setGenBusy] = useState(false);
  // Minimumi po izmeni (department_shift_minimums) – natančnejša osnova za
  // "Pokritost po dnevih" kot bazni-kalup primerjava, glej PokritostPoDnevih.
  const [minimumi, setMinimumi] = useState({});
  useEffect(() => { setMinimumi({}); nalozizMinimume(koda).then(setMinimumi); }, [koda]);

  const meta = WARDS_META[koda];
  const { startISO, endISO } = monthRange(month);
  const tedni = useMemo(() => mondaysInRange(startISO, endISO), [startISO, endISO]);

  // Klik preklaplja: navadna rotacija <-> LD.
  const cikliTeden = (ime, monday) => {
    const key = ime + "|" + monday;
    setTedenskoStanje(t => {
      const kopija = { ...t };
      if (t[key] === "LD") delete kopija[key]; else kopija[key] = "LD";
      return kopija;
    });
  };
  // "Predlagaj teden" iz spodnjega panela vedno predlaga LD, ne kroži.
  const predlagajLD = (ime, monday) => {
    setTedenskoStanje(t => ({ ...t, [ime + "|" + monday]: "LD" }));
  };

  const uvoziKvote = async (file) => {
    if (!file) return;
    setKvoteUvozBusy(true); setKvoteUvozMsg(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setKvoteUvozMsg("V tem PDF-ju ni bilo mogoče prepoznati stolpcev (videti je kot navadno besedilo, ne preglednica) – uporabi CSV/Excel ali PDF s pravo tabelo."); return; }
      const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["ime","kvota"], ["ime","full_name"]);
      const nove = {};
      objekti.forEach(o => { if (o.ime && o.kvota !== "") nove[o.ime.toUpperCase()] = o.kvota; });
      setKvote(k => ({ ...k, ...nove }));
      setKvoteUvozMsg(`Uvoženih ${Object.keys(nove).length} kvot iz "${file.name}".`);
    } catch (e) {
      setKvoteUvozMsg("Napaka: " + (e.message || String(e)));
    } finally {
      setKvoteUvozBusy(false);
    }
  };

  const generiraj = async () => {
    setGenBusy(true);
    try {
      // "Generiraj takoj": vse iz baze naenkrat - omejitve IN letni dopust.
      // Ročno nastavljeni tedni (klik v razpredelnici spodaj) imajo prednost
      // pred samodejno zaznanimi, da samodejno branje nikoli ne povozi
      // odločitve koordinatorja.
      const [omejitveMap, samodejniLd] = await Promise.all([
        nalozizOmejitve(startISO, endISO, staffList.map(([ime]) => ime)),
        nalozizLdTedne(startISO, endISO, tedni, staffList.map(([ime]) => ime)),
      ]);
      const zdruzenoStanje = { ...samodejniLd, ...tedenskoStanje };
      setTedenskoStanje(zdruzenoStanje);
      setSamodejnoLdSt(Object.keys(samodejniLd).filter(k => tedenskoStanje[k] == null).length);

      const staff = staffList.map(([ime, defLetter]) => ({
        ime,
        startLetter: letters[ime] || defLetter,
        hsuffix: meta.hsuffix,
        dopustTedni: tedni.filter(mo => zdruzenoStanje[ime + "|" + mo] === "LD"),
        omejitve: omejitveMap[ime] || [],
      }));
      const res = Generator.generirajKalup({ anchorMondayISO: ANCHOR_MONDAY, startISO, endISO, staff });
      // Pokritost po dnevih: kar bi kalup ta dan običajno zasedel, ČE nihče
      // ne bi bil na dopustu/pomoči drugje (isto osebje/rotacija, brez
      // odsotnosti) – izhodišče za primerjavo z dejansko zasedbo spodaj.
      const staffBazni = staff.map(z => ({ ...z, dopustTedni: [], omejitve: [] }));
      const bazno = Generator.generirajKalup({ anchorMondayISO: ANCHOR_MONDAY, startISO, endISO, staff: staffBazni });
      const pricakovanoPoDnevih = {};
      bazno.dnevi.forEach(dn => {
        pricakovanoPoDnevih[dn.datum] = Object.values(dn.izmene).filter(v => v).length;
      });
      setRezultat({ koda, naziv: meta.naziv, mesec: month, dnevi: res.dnevi, opozorila: res.opozorila, staff: staffList.map(([ime]) => ({ime, vloga:"SMS / TZN"})), pricakovanoPoDnevih });
      setPredlogiVrzeli(null);
      setPotrjeneVrzeli({});
      setPopravki({});
      setPragPopravki({});
    } finally {
      setGenBusy(false);
    }
  };

  const celica = (z, dn) => {
    const key = z.ime + "|" + dn.datum;
    return popravki[key] != null ? popravki[key] : (dn.izmene[z.ime] || "");
  };
  // Katero oznako izmene predlagati za to izmeno na ta dan. Namenoma se
  // NE ugane iz seznama kod, ampak se prebere, kaj ta oddelek za to izmeno
  // TISTI TIP DNEVA (delavnik/vikend) dejansko uporablja - E1 ima "do 19h"
  // namesto "do 19", vikendi pa 12-urne izmene. Če za tak dan ni primera,
  // se vzame osnovna oznaka.
  const OSNOVNA_SIFRA = { DOPOLDNE: "dopoldan", POPOLDNE: "popoldan", PONOCI: "NOČNA" };
  const sifraZaBucket = (datum, bucket) => {
    if (!rezultat || !bucket) return null;
    const vikend = (iso) => { const d = window.Datum.dan3(iso); return d === "SO" || d === "NE"; };
    const jeVikend = vikend(datum);
    const stevec = {};
    rezultat.dnevi.forEach(dn => {
      if (vikend(dn.datum) !== jeVikend) return;
      rezultat.staff.forEach(z => {
        const sifra = celica(z, dn);
        if (shiftBucket(sifra) !== bucket) return;
        stevec[sifra] = (stevec[sifra] || 0) + 1;
      });
    });
    const najpogostejsa = Object.keys(stevec).sort((a, b) =>
      stevec[b] - stevec[a] || (a < b ? -1 : a > b ? 1 : 0))[0];
    return najpogostejsa || OSNOVNA_SIFRA[bucket] || null;
  };

  const predlagajVrzeli = () => {
    if (!rezultat) return;
    const { vrzeli, imaMinimume } = izracunajVrzeli({ rezultat, celica, pragPopravki, minimumi });
    if (!imaMinimume) {
      setPredlogiVrzeli({ napaka: "Za ta oddelek minimumi po izmenah niso nastavljeni, zato se ne ve, KATERE izmene zmanjka. Nastavi jih zgoraj (»Minimalna zasedba po izmenah«) in poskusi znova." });
      return;
    }
    if (!vrzeli.length) { setPredlogiVrzeli({ prazno: true }); return; }
    const predlogi = window.Generator.predlagajZapolnitevOddelka({
      vrzeli,
      staff: rezultat.staff.map(z => z.ime),
      dnevi: rezultat.dnevi.map(dn => dn.datum),
      sifraZa: (ime, datum) => {
        const key = ime + "|" + datum;
        const dn = rezultat.dnevi.find(d => d.datum === datum);
        return popravki[key] != null ? popravki[key] : ((dn && dn.izmene[ime]) || "");
      },
      vBucket: shiftBucket,
      sifraZaBucket,
      preveriPravila: (vnosi) => window.DelovniCas.preveriPravila(vnosi),
    });
    setPredlogiVrzeli({ seznam: predlogi });
    setPotrjeneVrzeli({});
  };

  const kljucPredloga = (pr) => pr.oseba + "|" + pr.datum;
  const vnesiPotrjeneVrzeli = () => {
    const seznam = (predlogiVrzeli && predlogiVrzeli.seznam) || [];
    const izbrani = seznam.filter(pr => potrjeneVrzeli[kljucPredloga(pr)]);
    if (!izbrani.length) return;
    setPopravki(p => {
      const novi = { ...p };
      izbrani.forEach(pr => { novi[kljucPredloga(pr)] = pr.sifra; });
      return novi;
    });
    // Vpisani predlogi so od tu naprej navadni ročni popravki (vidni v
    // mreži, gredo v izvoz in objavo), zato se seznam počisti - sicer bi
    // isti predlog ostal ponujen, čeprav je že v razporedu.
    setPredlogiVrzeli({ seznam: seznam.filter(pr => !potrjeneVrzeli[kljucPredloga(pr)]), vneseno: izbrani.length });
    setPotrjeneVrzeli({});
  };

  const nastaviPopravek = (z, dn, vrednost) => {
    setPopravki(p => ({ ...p, [z.ime + "|" + dn.datum]: vrednost }));
  };

  // Zapiše PREDOGLED (rezultat + ročni popravki, torej natanko to, kar je
  // trenutno prikazano v mreži spodaj) nazaj v obstoječi Google Sheets
  // dokument – ŠE PRED objavo v Supabase, da lahko admin sprotno popravlja
  // in vidi rezultat v svojem pravem, deljenem dokumentu. Piše na iste
  // koordinate kot bi kasneje pisal "Zapiši nazaj v Sheets" iz Razporeda za
  // že objavljen razpored (glej sheets-mreza.js) – samo obstoječe celice,
  // nikoli nova vrstica/stolpec, da imena/vloge/podpisni blok ostanejo
  // nedotaknjeni.
  const zapisiPredogledVSheets = async () => {
    if (!rezultat) return;
    if (!sheetsUrl.trim()) { setSheetsMsg({ ok: false, text: "Vnesi povezavo do Google Sheets." }); return; }
    if (!window.GSheetsExport || !window.GSheetsExport.jeNastavljeno()) {
      setSheetsMsg({ ok: false, text: "Pisanje v Google Sheets še ni nastavljeno – manjka Google Client ID (glej GSHEETS-SETUP.md)." });
      return;
    }
    if (!window.confirm(
      `To bo prepisalo obstoječe celice s podatki za ${rezultat.mesec} v zavihku, na katerega kaže zgornja povezava, s TRENUTNIM PREDOGLEDOM (vključno z ročnimi popravki) - razpored za ${rezultat.naziv} ŠE NI objavljen v Supabase.\n\n` +
      "Imena/nazivi stolpcev, oblika in podpisni blok ostanejo nedotaknjeni - spremenijo se samo celice s podatki. To dejanje ni mogoče razveljaviti (razen ročno, v Google Sheets prek Zgodovina različic).\n\nNadaljujem?"
    )) return;
    setSheetsBusy(true); setSheetsMsg(null);
    try {
      const { naslovLista, vrsteVrstic } = await window.GSheetsExport.preberiVrednosti(sheetsUrl.trim());
      const staff = rezultat.staff.map(z => ({ ime: z.ime }));
      const vrednostZa = (ime, datum) => {
        const z = rezultat.staff.find(s => s.ime === ime);
        const dn = rezultat.dnevi.find(d => d.datum === datum);
        return z && dn ? celica(z, dn) : "";
      };
      const { posodobitve, najdenDatum, najdenaGlava, neujemanja } =
        window.SheetsMreza.pripraviPosodobitveOddelkaIzMreze(vrsteVrstic, rezultat.mesec, staff, vrednostZa);
      if (!posodobitve.length) {
        if (!najdenDatum) throw new Error(`V zavihku "${naslovLista}" ni najdenih vrstic za ${rezultat.mesec} - preveri, da povezava kaže na pravi zavihek (klikni zavihek za ta oddelek, šele nato kopiraj povezavo).`);
        if (!najdenaGlava) throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nad njimi ni najti vrstice z imeni oseb.`);
        throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nobeno ime v listu se ni ujemalo z osebo v predogledu: ` + [...neujemanja].join(", "));
      }
      const rez = await window.GSheetsExport.zapisiVObstojeciList(sheetsUrl.trim(), posodobitve);
      setSheetsMsg({ ok: true, text: `Zapisanih ${rez.stevilo} celic v zavihek "${rez.list}" (predogled, še ni objavljeno v Supabase).`
        + (neujemanja.size ? ` Brez ujemanja imena (celica v Sheetsu ni bila spremenjena): ${[...neujemanja].join(", ")}.` : "") });
    } catch (e) {
      setSheetsMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setSheetsBusy(false);
    }
  };

  // Delovnopravne kršitve (počitek med izmenama, zaporedne nočne, prost dan v
  // tednu) – izračunane enkrat tu nad DEJANSKIM razporedom (torej vključno z
  // ročnimi popravki celic), da isti seznam napaja tako povzetek v
  // StatusPravil kot obarvanje posameznih celic v mreži spodaj.
  const krsitve = useMemo(() => {
    if (!rezultat) return [];
    const vnosi = [];
    rezultat.staff.forEach(z => {
      rezultat.dnevi.forEach(dn => vnosi.push({ oseba: z.ime, datum: dn.datum, sifra: celica(z, dn) }));
    });
    return window.DelovniCas.preveriPravila(vnosi);
  }, [rezultat, celica]);
  // "oseba|datum" -> najhujša kršitev na tej celici (kritično prekrije opozorilo).
  const krsitveMap = useMemo(() => {
    const m = new Map();
    krsitve.forEach(k => {
      const key = k.oseba + "|" + k.datum;
      const obstojeca = m.get(key);
      if (!obstojeca || (k.resnost === "kriticno" && obstojeca.resnost !== "kriticno")) m.set(key, k);
    });
    return m;
  }, [krsitve]);

  const izvoziCSV = () => {
    if (!rezultat) return;
    const glava = ["Zaposleni", ...rezultat.dnevi.map(dn => dn.datum)];
    const vrstice = rezultat.staff.map(z => [z.ime, ...rezultat.dnevi.map(dn => celica(z, dn))]);
    const csv = [glava, ...vrstice]
      .map(vrsta => vrsta.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
      .join("\r\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `kalup-${rezultat.koda}-${rezultat.mesec}.csv`; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const prenesi = () => {
    if (!rezultat) return;
    const data = { mesec: rezultat.mesec, oddelki: [{ koda: rezultat.koda, naziv: rezultat.naziv, zaposleni: rezultat.staff, dnevi: rezultat.dnevi }] };
    download(`data-${rezultat.koda}-${rezultat.mesec}.json`, JSON.stringify(data, null, 1));
  };

  const objavi = async () => {
    if (!rezultat) return;
    setPublishBusy(true); setPublishMsg(null);
    try {
      const rows = [];
      rezultat.dnevi.forEach(dn => {
        Object.keys(dn.izmene).forEach(ime => {
          const key = ime + "|" + dn.datum;
          const sifra = popravki[key] != null ? popravki[key] : dn.izmene[ime];
          rows.push({ ime, datum: dn.datum, sifra });
        });
      });
      const { objavljeno, manjkajo, oddelekNapaka, obvestilaNapaka } = await publishScheduleRows(rezultat.koda, rows);
      setPublishMsg({ ok:true, text: `Objavljeno ${objavljeno} vnosov v Supabase.` + (manjkajo.length ? ` Brez računa (preskočeno): ${manjkajo.join(", ")}.` : "") + (oddelekNapaka ? ` Opozorilo: samodejna nastavitev oddelka ni uspela (${oddelekNapaka}).` : "") + (obvestilaNapaka ? ` Opozorilo: obvestila zaposlenim niso bila poslana (${obvestilaNapaka}).` : "") });
    } catch (e) {
      setPublishMsg({ ok:false, text: e.message || String(e) });
    } finally {
      setPublishBusy(false);
    }
  };

  return (
    <div>
      {/* Nadzorna plošča: oddelek + mesec + generiranje na enem mestu.
          Vse ostalo (kvote, kalup po zaposlenih) je spodaj v zložljivih
          razdelkih - generiranje samo po sebi ne potrebuje nobenega od njih,
          ker želje/dopust/omejitve prebere naravnost iz baze. */}
      <div className="orodjaVrh no-print">
        <div className="field">
          <label htmlFor="odd">Oddelek</label>
          <select id="odd" value={koda} onChange={e => { setKoda(e.target.value); setRezultat(null); }}>
            {Object.keys(WARDS_META).map(k => <option key={k} value={k}>{k} – {WARDS_META[k].naziv}</option>)}
          </select>
        </div>
        <div className="field">
          <label htmlFor="mm">Mesec in leto</label>
          <input id="mm" type="month" value={month} onChange={e => { setMonth(e.target.value); setRezultat(null); }} />
        </div>
        <button className="genBtn" style={{marginTop:0, flex:"0 0 auto"}} onClick={generiraj} disabled={genBusy || !staffList}>
          {genBusy ? "Generiram …" : "⚡ Generiraj takoj"}
        </button>
      </div>
      <p className="hint no-print">
        Ob kliku se želje, letni dopust in omejitve preberejo naravnost iz baze – vmesnih potrditev ni.
        Ročni popravki spodaj imajo vedno prednost pred samodejno prebranimi.
      </p>

      <UvozRazporedaNapotek koda={koda} month={month} />

      {!staffList ? <p className="hint">Nalagam osebje …</p> : (
      <React.Fragment>
      <Zlozljivo naslov="Predlog prednosti za prost teden" opis="Razvrstitev po dejanski obremenjenosti – neobvezno">
      <p className="hint">Razvrstitev po dejanski obremenjenosti (od januarja do zdaj). Kliknite »Predlagaj teden«, da za izbrano osebo označite naslednji prosti teden spodaj – potrdite ali spremenite pred generiranjem.</p>
      <div className="card no-print" style={{marginBottom:10}}>
        <RazporedUvozVir ikona="🏖" naziv="Kvote letnega dopusta"
          opis="CSV / Excel – mat. št. in dnevi"
          onClick={() => kvoteFileRef.current && kvoteFileRef.current.click()} />
        <input ref={kvoteFileRef} type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}}
          onChange={e => { uvoziKvote(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={kvoteUvozBusy} onClick={() => kvoteFileRef.current && kvoteFileRef.current.click()}>
          {kvoteUvozBusy ? "Nalagam …" : "📤 Uvozi letne kvote dopusta (CSV/Excel)"}
        </button>
        <p className="hint" style={{marginTop:8, marginBottom:0}}>Oblika: <code>ime,kvota</code> (ime kot spodaj v tabeli).</p>
        {kvoteUvozMsg && <p className="hint" style={{marginTop:6, marginBottom:0}}>{kvoteUvozMsg}</p>}
      </div>
      <PrednostniPanel staff={staffList} stanje={tedenskoStanje} tedni={tedni} kvote={kvote} setKvote={setKvote}
        onPredlagaj={(ime, teden) => predlagajLD(ime, teden)} />
      </Zlozljivo>

      <Zlozljivo naslov="Kalup in dopust po zaposlenih"
        opis={samodejnoLdSt > 0 ? `Iz baze samodejno prebran dopust: ${tedniBesedilo(samodejnoLdSt)} – po potrebi popravi` : "Ročni popravki rotacije in dopusta – neobvezno"}>
      <p className="hint">Črka je izhodiščno stanje 5-tedenskega kalupa (samodejno izračunano od sidra 28. 9. 2026 naprej, privzeto iz Imenika). Kliknite teden, da med LD (letni dopust), POM (začasna pomoč drugemu oddelku – cilj oddelek osebo za ta teden doda ročno) in navadno rotacijo kroži. Rumene omejitve (Razpredelnica Želje) generator samodejno pokrije z nadomestilom, če je kdo na oddelku ta dan prost – sicer opozori spodaj.</p>
      <div className="card" style={{overflowX:"auto"}}>
        <table className="roster">
          <thead>
            <tr>
              <th>Zaposleni</th>
              <th>Kalup</th>
              {tedni.map(mo => <th key={mo}>Teden {fmtShort(mo)}</th>)}
            </tr>
          </thead>
          <tbody>
            {staffList.map(([ime, defLetter, manjka]) => (
              <tr key={ime}>
                <td>{ime}{manjka && <span className="hint" style={{color:"var(--danger)", marginLeft:6}} title="Rotacijska črka ni nastavljena v Imeniku – privzeto A">⚠</span>}</td>
                <td>
                  <select value={letters[ime] || defLetter} onChange={e => setLetters(l => ({...l, [ime]: e.target.value}))}>
                    {["A","B","C","D","E"].map(l => <option key={l} value={l}>{l}</option>)}
                  </select>
                </td>
                {tedni.map(mo => (
                  <td key={mo}>
                    <button className="weekToggle" aria-pressed={!!tedenskoStanje[ime+"|"+mo]} onClick={() => cikliTeden(ime, mo)}>
                      {tedenskoStanje[ime+"|"+mo] === "LD" ? "LD" : "–"}
                    </button>
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      </Zlozljivo>

      <button className="genBtn no-print" onClick={generiraj} disabled={genBusy}>{genBusy ? "Generiram …" : "⚡ Generiraj takoj"}</button>
      </React.Fragment>
      )}

      {rezultat && (
        <React.Fragment>
          <h2 className="section">4 · Rezultat – {rezultat.naziv}, {rezultat.mesec}</h2>
          <StatusPravil rezultat={rezultat} celica={celica} pragPopravki={pragPopravki} minimumi={minimumi} krsitve={krsitve} />
          {rezultat.opozorila && rezultat.opozorila.length > 0 && (
            <div className="warnBox no-print">
              <div className="t">⚠ {rezultat.opozorila.length} omejitev brez samodejnega nadomestila</div>
              <ul>{rezultat.opozorila.map((o, i) => <li key={i}>{window.Datum.slo(o.datum)}: {o.sporocilo}</li>)}</ul>
            </div>
          )}
          <p className="hint no-print">
            Vsako celico lahko ročno prepišeš (npr. za nadomeščanje) – sprememba se upošteva povsod: v prikazu,
            izvozu (PDF/CSV) IN ob objavi v Supabase (vsaka celica je ena oseba/en dan, zato se popravek zanesljivo
            preslika nazaj na eno izmeno).
          </p>

          <h2 className="section no-print">4b · Pokritost po dnevih</h2>
          <p className="hint no-print">Minimum po izmeni (spodaj) je osnutek, ročno urejaj po potrebi – ko je nastavljen za ta oddelek, se uporabi za natančno zaznavo primanjkljaja po izmeni namesto grobe primerjave z osnovnim kalupom.</p>
          <MinimumiUrejevalnik koda={koda} minimumi={minimumi} setMinimumi={setMinimumi} />
          <PokritostPoDnevih rezultat={rezultat} celica={celica} pragPopravki={pragPopravki} setPragPopravki={setPragPopravki} minimumi={minimumi} />

          {/* "Predlagaj mesec" - enaka pot kot pri mreži NZV: aplikacija
              vrzel najde in za vsako predlaga osebo, v razpored pa se
              vpiše šele po potrditvi. */}
          <div className="card no-print">
            <button className="btn" onClick={predlagajVrzeli}>🧩 Predlagaj mesec (zapolni vrzeli)</button>
            <p className="hint" style={{margin:"8px 0 0"}}>
              Za vsako nepokrito izmeno predlaga osebo, ki tisti dan ne dela (prost dan po vzorcu, šele nato KPU).
              Dopusta in »POMOČ DRUGJE« ne dotakne, predlog, ki bi kršil delovnopravno pravilo, pa preskoči –
              in če drugega ni, ga označi. Predlogi se vpišejo <b>šele, ko jih potrdiš</b>.
            </p>
            {predlogiVrzeli && predlogiVrzeli.napaka && (
              <p className="hint" style={{marginBottom:0, color:"var(--danger)"}}>{predlogiVrzeli.napaka}</p>
            )}
            {predlogiVrzeli && predlogiVrzeli.prazno && (
              <p className="hint" style={{marginBottom:0}}>Ni vrzeli – vsaka izmena dosega nastavljeni minimum.</p>
            )}
            {predlogiVrzeli && predlogiVrzeli.vneseno > 0 && (
              <p className="hint" style={{marginBottom:0, color:"var(--ok)"}}>
                Vnesenih v razpored: {predlogiVrzeli.vneseno}. Vidne so v mreži spodaj in jih lahko še popraviš.
              </p>
            )}
            {predlogiVrzeli && predlogiVrzeli.seznam && predlogiVrzeli.seznam.length > 0 && (
              <div style={{marginTop:10}}>
                <div style={{display:"flex", gap:8, marginBottom:8, flexWrap:"wrap"}}>
                  <button className="btn btn-sm" onClick={() => {
                    const vsi = {};
                    predlogiVrzeli.seznam.forEach(pr => { vsi[kljucPredloga(pr)] = true; });
                    setPotrjeneVrzeli(vsi);
                  }}>Potrdi vse</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => setPotrjeneVrzeli({})}>Počisti</button>
                  <button className="btn btn-sm" onClick={vnesiPotrjeneVrzeli}
                    disabled={!Object.values(potrjeneVrzeli).some(Boolean)}>
                    Vnesi potrjene v razpored
                  </button>
                </div>
                <div style={{maxHeight:240, overflowY:"auto"}}>
                  {predlogiVrzeli.seznam.map(pr => (
                    <label key={kljucPredloga(pr)} style={{display:"flex", alignItems:"flex-start", gap:8, fontSize:12, padding:"3px 0"}}>
                      <input type="checkbox" checked={!!potrjeneVrzeli[kljucPredloga(pr)]}
                        onChange={e => setPotrjeneVrzeli(t => ({ ...t, [kljucPredloga(pr)]: e.target.checked }))} />
                      <span>
                        <b>{window.Datum.slo(pr.datum)}</b> · {IZMENA_LABEL[pr.bucket] || pr.bucket} · {pr.oseba} → <b>{pr.sifra}</b>

                      </span>
                    </label>
                  ))}
                </div>
              </div>

          <div className="wardScroller" ref={wardRef}>

                <tr>
                  <th className="name">Zaposleni</th>
                  {rezultat.dnevi.map(dn => (

              <tbody>
                {rezultat.staff.map(z => (

                    {rezultat.dnevi.map(dn => {
