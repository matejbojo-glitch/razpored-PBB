// Ločena od revizije razporeda spodaj, ker odgovarja na drugo vprašanje:
// ne "kdo je komu spremenil izmeno", ampak "kdo je komu podelil ali
// odvzel dostop". Tudi tu piše izključno sprožilec v bazi.
// ---------------------------------------------------------------------
const POLJE_NAZIV = {
  role: "Vloga",
  department_code: "Oddelek",
  vodja_id: "Nadrejeni",
  is_koordinator: "Koordinator menjav",
};
// Povišanje pravic je varnostno pomembnejše od znižanja - v dolgem
// seznamu mora izstopati.
const VLOGA_MOC = { user: 0, vodja: 1, admin: 2 };
function jePovisanje(v){
  if (v.polje === "role") return (VLOGA_MOC[v.nova_vrednost] ?? -1) > (VLOGA_MOC[v.stara_vrednost] ?? -1);
  if (v.polje === "is_koordinator") return v.nova_vrednost === "true";
  return false;
}

function RevizijaPravic(){
  const [vnosi, setVnosi] = useState(null);
  const [napaka, setNapaka] = useState(null);
  const [iskanje, setIskanje] = useState("");
  const [samoPovisanja, setSamoPovisanja] = useState(false);

  useEffect(() => {
    let cancelled = false;
    client.from("profiles_log").select("*").order("changed_at", { ascending: false }).limit(300)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) { setNapaka(error.message); setVnosi([]); return; }
        setVnosi(data || []);
      });
    return () => { cancelled = true; };
  }, []);

  const filtrirani = useMemo(() => {
    if (!vnosi) return [];
    const s = iskanje.trim().toLowerCase();
    return vnosi.filter(v => {
      if (samoPovisanja && !jePovisanje(v)) return false;
      if (!s) return true;
      return (v.profile_name || "").toLowerCase().includes(s)
        || (v.changed_by_name || "").toLowerCase().includes(s);
    });
  }, [vnosi, iskanje, samoPovisanja]);

  const povisanjSkupaj = useMemo(() => (vnosi || []).filter(jePovisanje).length, [vnosi]);
  const AKCIJA_NAZIV = { insert: "Nov račun", update: "Sprememba", delete: "Izbris računa" };
  const prikaz = (x) => (x === null || x === undefined || x === "") ? "–" : (x === "true" ? "da" : x === "false" ? "ne" : x);

  return (
    <div>
      <p className="hint">
        Zadnjih 300 sprememb pravic (vloga, oddelek, nadrejeni, koordinator). Piše samodejno sprožilec v bazi –
        iz aplikacije tega ni mogoče izklopiti ali popraviti za nazaj. Vpisi o razporedu so v drugem pogledu zgoraj.
      </p>
      <div style={{display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap", marginBottom:10}}>
        <div className="field" style={{flex:1, minWidth:200}}>
          <input type="text" placeholder="Išči po osebi ali uredniku …" value={iskanje} onChange={e => setIskanje(e.target.value)} />
        </div>
        <label style={{display:"flex", alignItems:"center", gap:6, fontSize:13, paddingBottom:8}}>
          <input type="checkbox" checked={samoPovisanja} onChange={e => setSamoPovisanja(e.target.checked)} />
          Samo povišanja pravic{povisanjSkupaj ? " (" + povisanjSkupaj + ")" : ""}
        </label>
      </div>
      {napaka && <p className="err">Napaka: {napaka} (najverjetneje je treba pognati zadnjo različico supabase/schema.sql).</p>}
      {vnosi === null ? <p className="hint">Nalagam …</p> : (
        <div className="card">
          {filtrirani.length === 0 && <p className="hint" style={{margin:0}}>Brez rezultatov.</p>}
          {filtrirani.map(v => (
            <div className="revVnos" key={v.id}>
              <div className="revGlava">
                <b>{v.profile_name || v.profile_id}</b>
                {jePovisanje(v) && <span className="pill danger">povišanje</span>}
                {v.action !== "update" && <span className="pill muted">{AKCIJA_NAZIV[v.action] || v.action}</span>}
              </div>
              <div className="revSprememba">
                {POLJE_NAZIV[v.polje] || v.polje}: {prikaz(v.stara_vrednost)} → <b>{prikaz(v.nova_vrednost)}</b>
              </div>
              <div className="revNoga">
                {window.Datum.sloSCasom(v.changed_at)} · spremenil: {v.changed_by_name || "(sistem)"}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RevizijaRazporeda(){
  const [vnosi, setVnosi] = useState(null);
  const [napaka, setNapaka] = useState(null);
  const [iskanje, setIskanje] = useState("");

  useEffect(() => {
    let cancelled = false;
    client.from("schedule_entries_log").select("*").order("changed_at", { ascending: false }).limit(300)
      .then(async ({ data, error }) => {
        if (cancelled) return;
        if (error) { setNapaka(error.message); setVnosi([]); return; }
        const { data: profili } = await client.from("profiles").select("id, full_name");
        const imePoId = {}; (profili || []).forEach(p => { imePoId[p.id] = p.full_name; });
        setVnosi((data || []).map(v => ({
          ...v,
          zaposleni: imePoId[v.employee_id] || v.employee_id,
          urednik: imePoId[v.changed_by] || "(neznano)",
        })));
      });
    return () => { cancelled = true; };
  }, []);

  const filtrirani = useMemo(() => {
    if (!vnosi) return [];
    const s = iskanje.trim().toLowerCase();
    if (!s) return vnosi;
    return vnosi.filter(v => (v.zaposleni || "").toLowerCase().includes(s) || (v.urednik || "").toLowerCase().includes(s) || (v.department_code || "").toLowerCase().includes(s));
  }, [vnosi, iskanje]);

  const AKCIJA_NAZIV = { insert: "Nov vnos", update: "Sprememba", delete: "Izbris" };

  return (
    <div>
      <p className="hint">Zadnjih 300 sprememb v razporedu (schedule_entries) - kdo, kdaj in kaj. Piše samodejno sprožilec v bazi, ne da bi bilo to mogoče izklopiti iz aplikacije.</p>
      <div className="field"><input type="text" placeholder="Išči po zaposlenem, uredniku ali oddelku …" value={iskanje} onChange={e => setIskanje(e.target.value)} /></div>
      {napaka && <p className="err">Napaka: {napaka} (najverjetneje je treba pognati zadnjo različico supabase/schema.sql).</p>}
      {vnosi === null ? <p className="hint">Nalagam …</p> : (
        <div className="tableScroller" style={{marginTop:10}}>
          <table className="fairTable">
            <thead>
              <tr><th>Ko</th><th>Kdo</th><th>Kaj</th><th>Zaposleni</th><th>Oddelek</th><th>Datum</th><th>Iz → V</th></tr>
            </thead>
            <tbody>
              {filtrirani.map(v => (
                <tr key={v.id}>
                  <td style={{whiteSpace:"nowrap"}}>{window.Datum.sloSCasom(v.changed_at)}</td>
                  <td>{v.urednik}</td>
                  <td>{AKCIJA_NAZIV[v.action] || v.action}</td>
                  <td style={{textAlign:"left"}}>{v.zaposleni}</td>
                  <td>{v.department_code}</td>
                  <td>{window.Datum.slo(v.work_date)}</td>
                  <td>{(v.old_shift_code || "prosto") + " → " + (v.new_shift_code || "prosto")}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtrirani.length === 0 && <p className="hint">Brez rezultatov.</p>}
        </div>
      )}
    </div>
  );
}

function Gate(){
  const [ok, setOk] = useState(false);
  const [ogled, setOgled] = useState(false);
  const [profil, setProfil] = useState(null);
  useEffect(() => {
    RazporedAuth.requireRole(["admin"]).then(res => {
      if (res) { setOgled(!!res.ogled); setProfil(res.profile); setOk(true); }
    });
  }, []);
  return ok ? <App ogled={ogled} profil={profil}/> : null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Gate/>);
</script>
</body>
</html>
