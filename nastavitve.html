<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Nastavitve · Begunje</title>
<meta name="theme-color" content="#FAF8F1" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="theme.css" />

<style>
  :root{
    --bg: #FAF8F1; --bg-grad: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2EEDF;
    --line: #E1D9C2; --text: #2B2712; --muted: #8A7F5E; --accent: #A79448; --accent-2: #6E5F2A; --accent-ink: #2B2712;
    --danger: #B3402A; --danger-bg: #FBEAE6; --ok: #4C8C63; --ok-bg: #EAF3EC;
    --radius: 16px; --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width: 640px; margin:0 auto; padding: 0 16px 60px; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  header.top{ position:sticky; top:0; z-index:20; background: linear-gradient(180deg, var(--bg) 78%, transparent);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  .wordmark{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wordmark .logoSmall{ height:28px; width:auto; }
  .wordmark .mark{ font-weight:800; font-size:20px; letter-spacing:-0.02em; }
  .sub{ margin:2px 0 0; font-size:13px; color:var(--muted); }

  h2.section{ font-size:15px; font-weight:800; margin: 24px 0 4px; letter-spacing:-0.01em; }
  p.hint{ color:var(--muted); font-size:13px; margin: 4px 0 14px; line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:10px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  input[type=tel], input[type=text]{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px; width:100%; font-family:inherit;
  }

  .avatarBig{ width:56px; height:56px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:var(--accent-2); margin-bottom:10px; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
  .pill.admin{ background: var(--danger-bg); color: var(--danger); }
  .pill.vodja{ background: rgba(167,148,72,.18); color: var(--accent-2); }
  .pill.user{ background: var(--ok-bg); color: var(--ok); }

  .rowline{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .rowline:last-child{ border-bottom:0; }
  .rowline .lbl{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; width:70px; flex:0 0 auto; }
  .rowline .val{ flex:1; min-width:0; font-size:14.5px; word-break:break-word; }

  .linkRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 2px;
    border-bottom:1px solid var(--line); text-decoration:none; color:var(--text); }
  .linkRow:last-child{ border-bottom:0; }
  .linkRow .t{ font-weight:700; font-size:14px; }
  .linkRow .d{ font-size:12px; color:var(--muted); margin-top:2px; }
  .linkRow .chev{ color:var(--muted); font-size:15px; flex:0 0 auto; }

  .submitBtn{ margin-top:6px; width:100%; background: var(--accent); color: var(--accent-ink); border:0;
    padding:13px; border-radius: var(--radius-sm); font-weight:800; font-size:15px; cursor:pointer; }
  .submitBtn:disabled{ opacity:.5; cursor:default; }
  .dangerBtn{ margin-top:6px; width:100%; background: var(--danger-bg); color: var(--danger); border:1px solid var(--danger);
    padding:11px; border-radius: var(--radius-sm); font-weight:800; font-size:13.5px; cursor:pointer; }

  .okMsg{ color:var(--ok); font-size:13px; margin-top:8px; }
  .err{ color:var(--danger); font-size:13px; margin-top:8px; }

  footer.foot{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6; }
</style>
</head>
<body>
<div id="root"></div>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="babel.min.js"></script>
<script src="supabase-js.min.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const { client } = RazporedAuth;

function initials(ime){
  return (ime || "?").trim().split(/\s+/).slice(0,2).map(s => s[0]).join("").toUpperCase();
}

function MojProfil({ profile, myId }){
  const [telefon, setTelefon] = useState("");
  const [nalozeno, setNalozeno] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    client.from("contact_phones").select("phone").eq("profile_id", myId).maybeSingle()
      .then(({ data }) => { setTelefon(data ? (data.phone || "") : ""); setNalozeno(true); });
  }, [myId]);

  const shrani = async () => {
    setBusy(true); setMsg(null);
    try {
      const { error } = await client.from("contact_phones")
        .upsert({ profile_id: myId, phone: telefon.trim() || null, updated_at: new Date().toISOString() });
      if (error) throw error;
      setMsg({ ok:true, text:"Shranjeno." });
    } catch (e) {
      setMsg({ ok:false, text: e.message || String(e) });
    } finally { setBusy(false); }
  };

  return (
    <div className="card">
      <div style={{textAlign:"center"}}>
        <div className="avatarBig" style={{margin:"0 auto 10px"}}>{initials(profile.full_name)}</div>
        <div style={{fontSize:17, fontWeight:800}}>{profile.full_name}</div>
        <div style={{marginTop:6}}><span className={"pill " + profile.role}>{RazporedAuth.ROLE_LABEL[profile.role] || profile.role}</span></div>
      </div>
      <div style={{marginTop:14}}>
        <div className="rowline"><div className="lbl">E-pošta</div><div className="val">{profile.email || "—"}</div></div>
      </div>
      <div className="field" style={{marginTop:10}}>
        <label htmlFor="mytel">Telefon (viden adminu, vodjem in tebi)</label>
        <input id="mytel" type="tel" value={telefon} onChange={e => setTelefon(e.target.value)}
          placeholder="npr. 041 234 567" disabled={!nalozeno} />
      </div>
      <button className="submitBtn" onClick={shrani} disabled={busy || !nalozeno}>{busy ? "Shranjujem …" : "Shrani telefon"}</button>
      {msg && <p className={msg.ok ? "okMsg" : "err"}>{msg.text}</p>}
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => { if (res) setAuth(res); });
  }, []);

  if (!auth) return null;
  const { profile } = auth;
  const myId = auth.session.user.id;
  const role = profile ? profile.role : "user";

  return (
    <div className="wrap">
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout/>
      <header className="top">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Nastavitve</span></div>
        <p className="sub">{profile ? profile.full_name : ""} · {RazporedAuth.ROLE_LABEL[role]}</p>
      </header>

      <h2 className="section">Moj profil</h2>
      {profile ? <MojProfil profile={profile} myId={myId} /> : <p className="hint">Nalagam …</p>}

      <h2 className="section">Povezave</h2>
      <div className="card">
        <a className="linkRow" href={"imenik.html?id=" + myId}>
          <div><div className="t">Poln profil v Imeniku</div><div className="d">Vsi tvoji podatki, kot jih vidijo drugi</div></div>
          <span className="chev">›</span>
        </a>
        <a className="linkRow" href="imenik.html">
          <div><div className="t">Imenik zaposlenih</div><div className="d">Iskanje, kontakti, oddelki</div></div>
          <span className="chev">›</span>
        </a>
        {role === "admin" && (
          <a className="linkRow" href="admin.html">
            <div><div className="t">Uporabniki in vloge</div><div className="d">Urejanje vlog, oddelkov, uvoz zaposlenih</div></div>
            <span className="chev">›</span>
          </a>
        )}
      </div>

      <h2 className="section">Račun</h2>
      <div className="card">
        <button className="dangerBtn" onClick={() => RazporedAuth.signOut()}>🚪 Odjava</button>
      </div>

      <footer className="foot">
        <p><b>Razpored PBB.</b> Psihiatrična bolnišnica Begunje — aplikacija za razpored, dežurstva in menjave izmen.</p>
      </footer>

      <RazporedNav active="nastavitve" role={role} unread={0} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
