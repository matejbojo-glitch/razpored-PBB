<!-- Pisava Fraunces neblokirno: media="print" pomeni, da datoteka ne
     zadržuje izrisa; ko se naloži, jo onload preklopi na "all". Če se
     ne naloži (požarni zid, ni signala), stran deluje naprej z
     rezervno pisavo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"

<style>
  /* Barve, radiji in sence so v theme.css (naložen zgoraj) - tu jih NE
     podvajamo. Prej je imela vsaka stran svojo kopijo in te so se
     razšle: --ok je bil tu #4C8C63, v theme.css #4F9B6B, --ok-rgb pa
     se ni podvajal - zato sta imeli znački .pill.ok ozadje iz ene
     zelene in besedilo iz druge. */
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  /* širina: theme.css (.wrap / .wrap.wide / .wrap.polna) */
  .wrap{ padding-bottom: 60px; }
  /* Ozadje mora biti NEPROSOJNO. Prej je bilo linear-gradient(... , transparent),
     zato je vsebina, ki je pri drsenju zašla pod spodnjih 22 % glave, prosvetila
     skozi njeno lastno besedilo (ime prijavljenega se je prekrivalo z besedilom
     strani). Mehak prehod je zdaj ločen element POD glavo. */
  header.top{ position:sticky; top:0; z-index:20; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  header.top::after{ content:""; position:absolute; left:0; right:0; top:100%; height:14px;
    background: linear-gradient(180deg, var(--bg), transparent); pointer-events:none; }
  .tabs{ display:flex; gap:6px; margin: 10px 0 16px; background:var(--surface-2); border-radius:999px; padding:4px; }
  .tabs button{ flex:1; border:0; background:none; padding:10px 8px; border-radius:999px; font-weight:800; font-size:12.5px;
    color:var(--muted); cursor:pointer; font-family:inherit; min-height:40px; }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
  select, input[type=date], input[type=time], input[type=text], textarea{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px; width:100%; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:60px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .shiftPreview{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  /* Kdo s kom in kaj za kaj - pred oddajo mora biti menjava vidna na en
     pogled (uporabnikova pripomba: "ni vidno kdo in s kom želi menjavo"). */
  .povzetekMenjave > div{ font-size:13.5px; }
  .povzetekMenjave{ background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:10px 12px; }
  .ghostBtn{ width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    padding:11px; border-radius:var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; min-height:44px; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
  .pill.wait{ background: rgba(167,148,72,.18); color: var(--accent-2); }
  .pill.ok{ background: var(--ok-bg); color: var(--ok); }
  .pill.no{ background: var(--danger-bg); color: var(--danger); }

  .entry{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .entry:last-child{ border-bottom:0; }
  .entry .who{ font-weight:700; font-size:13.5px; }
  .entry .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .entry .actions{ display:flex; gap:6px; flex:0 0 auto; }
  .actBtn{ border:0; border-radius:8px; padding:11px 14px; min-height:40px; font-size:13px; font-weight:800; cursor:pointer; }
  .actBtn.yes{ background: var(--ok); color:#12281A; }
  .actBtn.no{ background: var(--danger); color:#2A1608; }
  .candidate{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .candidate:last-child{ border-bottom:0; }
  .candBtn{ border:1px solid var(--line); background:var(--surface-2); border-radius:var(--radius-sm); padding:8px 12px;
    font-weight:700; font-size:12.5px; cursor:pointer; min-height:40px; }
  .candBtn[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .err{ color:var(--danger); font-size:13px; margin-top:8px; }
  .backBtn{ background:none; border:0; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; padding:0; margin-bottom:10px; font-family:inherit; }

  .timeline{ list-style:none; margin:0; padding:0; }
  .timeline li{ position:relative; padding:0 0 18px 26px; border-left:2px solid var(--line); margin-left:6px; }
  .timeline li:last-child{ border-color:transparent; padding-bottom:0; }
  .timeline li .dot{ position:absolute; left:-7px; top:0; width:12px; height:12px; border-radius:50%; background:var(--line); border:2px solid var(--surface); }
  .timeline li.done .dot{ background:var(--ok); }
  .timeline li.rejected .dot{ background:var(--danger); }
  .timeline li .step{ font-weight:800; font-size:13.5px; }
  .timeline li .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .timeline li.pending .step{ color:var(--muted); }

  .printHead{ display:none; }
  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    .printHead{ display:block; margin-bottom:14px; }
    .printHead h1{ font-size:18px; margin:0 0 4px; }
    .printHead p{ font-size:11px; color:#444; margin:0; line-height:1.5; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const { client } = RazporedAuth;

const VRSTA_LABEL = {
  rocno_evidentiranje: "Ročno evidentiranje",
  menjava_sluzbe: "Menjava službe",
  drugo: "Drugo",
};
// "oddaja_dezurstva" NAMENOMA ni v VRSTA_LABEL zgoraj - ta objekt tudi
// določa zavihke v "Nov obrazec" (Object.keys spodaj), oddaja pa ni svoj
// zavihek, ampak izjema znotraj "Menjava službe" (glej NovObrazec). Za
// prikaz obstoječih obrazcev te vrste uporabi to funkcijo namesto
// neposrednega VRSTA_LABEL[...].
function vrstaLabel(v){
  return VRSTA_LABEL[v] || (v === "oddaja_dezurstva" ? "Oddaja dežurstva" : v);
}
const STATUS_LABEL = {
  osnutek: { text: "Osnutek", cls: "wait" },
  caka_sodelavca: { text: "Čaka sodelavca", cls: "wait" },
  caka_vodjo: { text: "Čaka vodjo", cls: "wait" },
  caka_koordinatorja: { text: "Čaka koordinatorja", cls: "wait" },
  zakljucen: { text: "Zaključen", cls: "ok" },
  zavrnjen: { text: "Zavrnjen", cls: "no" },
  preklican: { text: "Preklican", cls: "no" },
};
const DEJANJE_STOPNJA = ["ODDANO", "SODELAVEC_POTRDIL/ZAVRNIL", "VODJA_ODOBRIL/ZAVRNIL", "KOORDINATOR_POTRDIL/ZAVRNIL"];

// Kar uporabnik VIDI namesto surove šifre iz baze: naziv iz uradne
// legende (izmene.js) - "Dopoldne", "Popoldne", "Nočna". Šifra v bazi
// ostane nespremenjena.
function oznakaIzmene(sifra){
  if (!sifra) return "prosto";
  return (window.Izmene && window.Izmene.naziv(sifra)) || sifra;
}

function fmtDatum(iso){
  return window.Datum.slo(iso);
}
function fmtCas(iso){
  return window.Datum.sloSCasom(iso);
}

// Vsak vidi samo tisto, kar je zanj relevantno - namesto enega dolgega
// opisa celotne verige (vseh vlog) za vse.
function opisVerige(profile){
  const rola = profile ? profile.role : "user";
  const jeKoordinator = !!(profile && profile.is_koordinator);

  if (jeKoordinator) {
    return "Kot koordinator dokončno potrjuješ menjave dežurstva – po potrditvi sodelavca gredo naravnost k tebi, brez vmesnega koraka pri vodji. Navadne menjave službe (in ročno evidentiranje/drugo) dokončno potrdi kdorkoli ima vlogo administrator.";
  }
  if (rola === "admin") {
    return "Kot administrator dokončno potrjuješ navadne menjave službe (po potrditvi sodelavca in vodje) ter ročno evidentiranje/drugo (po vodji). Menjave dežurstva namesto tega dokončno potrdi izključno koordinator – te se v tvojem seznamu \"Čaka name\" ne bodo pojavile.";
  }
  if (rola === "vodja") {
    return "Zahtevke oseb, ki imajo tebe nastavljenega za neposrednega vodjo, odobriš na vmesni stopnji (po sodelavcu, pred administratorjem) – razen menjav dežurstva, ki to stopnjo preskočijo in gredo naravnost h koordinatorju. Tvoje lastne zahtevke odobrava enaka veriga, samo s tvojim neposrednim vodjo namesto tebe.";
  }
  return "Tvoj zahtevek gre v odobritev: pri menjavi službe najprej potrdi sodelavec, nato (razen pri menjavi dežurstva) tvoj neposredni vodja, nazadnje administrator – pri menjavi dežurstva namesto vodje dokončno odloči koordinator. Ročno evidentiranje in drugo gresta brez sodelavca skozi vodjo do administratorja. Šele po zadnji potrditvi se izmeni dejansko zamenjata v razporedu.";
}

// Katero dejanje na tem obrazcu čaka TO osebo. Pravilo je v skupnem
// supabase-client.js, ker ga potrebuje tudi značka na gumbu "Menjava"
// (nav.js) - dve kopiji bi se prej ali slej razšli in značka bi kazala
// drugače kot seznam pod njo.
//
// Ključna razlika do pogleda obrazci_moja_naloga: ta vpraša bazo "kdo sem"
// (auth.uid()), tu pa vprašamo, KOGA zaslon trenutno prikazuje. Med
// "Ogledom kot uporabnik" sta to dve različni osebi in samo druga je prava.
//
// To je izključno PRIKAZ. Dejansko odobritev vedno preveri baza sama
// (obrazec_potrdi_* zavrne klic, če klicatelj ni ta oseba), zato ogled tudi
// po tej spremembi ne more odobriti ničesar v tujem imenu.
const mojeDejanje = RazporedAuth.mojeDejanjeNaObrazcu;

// Delovnopravno preverjanje menjave (ZDR-1, glej delovni-cas.js): počitek
// 10,7 h, zaporedne nočne, prost dan v tednu in največ 56 ur v 7 dneh.
//
// EN SAM izračun za obe rabi: predlagatelj ga vidi pred oddajo, vodja in
// administrator pa znova ob odločanju. Dve kopiji bi se razšli in vodja bi
// odločal po drugem pravilu, kot je videl predlagatelj.
//
// Vrne [] (brez kršitev) ali seznam kršitev; null pomeni "ni bilo mogoče
// izračunati" (npr. ni podatkov) - takrat se opozorilo NE prikaže kot "vse v
// redu", ker to ne bi bilo res.
async function izracunajKrsitveMenjave({ jazId, jazIme, jazDatum, jazIzmena, onId, onIme, onDatum, onIzmena }) {
  if (!window.DelovniCas || !jazId || !onId || !jazDatum || !onDatum) return null;
  const dodaj = (iso, n) => {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  // Okno ±3 dni okoli obeh datumov zajame vsa pravila, ki jih preverjamo.
  const dnevi = [jazDatum, onDatum].sort();
  const od = dodaj(dnevi[0], -3), doo = dodaj(dnevi[dnevi.length - 1], 3);

  const { data, error } = await client.from("razpored")
    .select("employee_id, work_date, shift_code")
    .in("employee_id", [jazId, onId])
    .gte("work_date", od).lte("work_date", doo);
  if (error) return null;

  // Mreža oseba|datum -> šifra, da uveljavitev menjave PREPIŠE obstoječi
  // vnos namesto da bi mu dodala drugega. Dvojni vnos za isti dan bi pravila
  // brala kot dve izmeni in javil izmišljeno kršitev počitka.
  const mreza = {};
  const kljuc = (oseba, dan) => oseba + "|" + dan;
  (data || []).forEach(r => {
    const oseba = r.employee_id === jazId ? jazIme : onIme;
    mreza[kljuc(oseba, r.work_date)] = { oseba, datum: r.work_date, sifra: r.shift_code };
  });
  // Uveljavi menjavo: moja izmena gre njemu, njegova pride meni.
  mreza[kljuc(jazIme, jazDatum)] = { oseba: jazIme, datum: jazDatum, sifra: "" };
  mreza[kljuc(onIme, onDatum)] = { oseba: onIme, datum: onDatum, sifra: "" };
  mreza[kljuc(jazIme, onDatum)] = { oseba: jazIme, datum: onDatum, sifra: onIzmena || "" };
  mreza[kljuc(onIme, jazDatum)] = { oseba: onIme, datum: jazDatum, sifra: jazIzmena || "" };
  return window.DelovniCas.preveriPravila(Object.values(mreza));
}

function StatusPill({ status }){
  const s = STATUS_LABEL[status] || { text: status, cls: "wait" };
  return <span className={"pill " + s.cls}>{s.text}</span>;
}

// Segmentna izbira vrste + dinamična polja + oddaja.
function NovObrazec({ myId, profil, onOddano, prednapolni }){
  const [vrsta, setVrsta] = useState((prednapolni && prednapolni.vrsta) || "menjava_sluzbe");
  const [datum, setDatum] = useState((prednapolni && prednapolni.datum) || "");
  const [prihod, setPrihod] = useState("");
  const [odhod, setOdhod] = useState("");
  const [razlog, setRazlog] = useState("");
  const [opomba, setOpomba] = useState("");
  const [mojaIzmena, setMojaIzmena] = useState(undefined);
  // Oddelek, na katerega je oseba TA DAN razporejena - določa, med kom se
  // sme menjati (glej mozni_sodelavci v shemi). Če za ta dan vrstice ni,
  // velja domači oddelek iz profila.
  const [mojOddelek, setMojOddelek] = useState("");
  const [izbranSodelavec, setIzbranSodelavec] = useState(null); // { profile_id, full_name, njihova_izmena, njihov_datum }
  // ROČNO iskanje sodelavca (uporabnikova zahteva, september 2026):
  // najprej datum, nato iskalnik oseb, nato razpored IZBRANE osebe, iz
  // katerega se izbere dan za menjavo. Prej je bil tu samodejni predlog
  // parov (dan + oseba), ki je marsikoga izločil, preden ga je predlagatelj
  // sploh videl.
  const [iskanje, setIskanje] = useState("");
  const [osebe, setOsebe] = useState(null);        // nabor, med katerim se sme menjati
  const [osebeBusy, setOsebeBusy] = useState(false);
  const [krogPoln, setKrogPoln] = useState(true);   // je krog dežurnih znan iz baze?
  const [izbranaOseba, setIzbranaOseba] = useState(null);   // { id, full_name }
  const [razporedOsebe, setRazporedOsebe] = useState(null); // dnevi izbrane osebe
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  // Administrator lahko v SKRAJNEM primeru (zaposleni sam ne utegne/ne more
  // iti skozi navadni postopek) menjavo izvede namesto njega - isto iskanje
  // sodelavcev in isti predogled kot pri navadni oddaji, samo da se "zase"
  // zamenja za izbranega zaposlenega, gumb pa namesto v odobritev IZVEDE
  // menjavo takoj (glej izvediTakoj spodaj). Trde varovalke (počitek, spol
  // C1/D, razmik dežurstev) ostanejo - te preveri baza sama, tudi tu.
  const jeAdmin = !!(profil && profil.role === "admin");
  const [zaDrugega, setZaDrugega] = useState(false); // stikalo je vključeno
  const [zaKogaId, setZaKogaId] = useState(""); // izbrani zaposleni ("" = še ni izbran)
  const [zaposleni, setZaposleni] = useState(null);
  const [zaposleniBusy, setZaposleniBusy] = useState(false);
  const actingId = (zaDrugega && zaKogaId) ? zaKogaId : myId;
  const actingIme = (zaDrugega && zaKogaId)
    ? ((zaposleni || []).find(z => z.id === zaKogaId) || {}).full_name || "Izbrani zaposleni"
    : (profil && profil.full_name) || "Ti";

  const nalozizZaposlene = async () => {
    if (zaposleni !== null) return;
    setZaposleniBusy(true);
    try {
      const { data } = await client.from("profili").select("id, full_name, department_code").order("full_name");
      setZaposleni(data || []);
    } finally {
      setZaposleniBusy(false);
    }
  };

  // Domači oddelek osebe, za katero se obrazec izpolnjuje (pri administratorju
  // je to lahko kdo drug) - rezerva, kadar za izbrani dan ni vrstice.
  const domaciOddelek = (zaDrugega && zaKogaId)
    ? (((zaposleni || []).find(z => z.id === zaKogaId) || {}).department_code || "")
    : ((profil && profil.department_code) || "");

  useEffect(() => {
    if (vrsta !== "menjava_sluzbe" || !datum){ setMojaIzmena(undefined); setMojOddelek(""); return; }
    client.from("razpored").select("shift_code, department_code").eq("employee_id", actingId).eq("work_date", datum).maybeSingle()
      .then(({ data }) => {
        setMojaIzmena(data ? data.shift_code : "");
        setMojOddelek((data && data.department_code) || domaciOddelek);
      });
    setIzbranSodelavec(null); setIzbranaOseba(null); setRazporedOsebe(null); setOsebe(null); setIskanje("");
  }, [vrsta, datum, actingId, domaciOddelek]);

  const jeDezurstvoDan = (mojaIzmena || "").toLowerCase().startsWith("dežurstvo");

  // Med kom se sme menjati:
  //   dežurstvo  -> VSI iz NZV (vodje in administratorji) - uporabnikova
  //                 zahteva; dežurstvo zahteva pooblastilo, zato oddelčni
  //                 kader tu ne pride v poštev,
  //   sicer      -> isti oddelek tistega dne; FLEXI je izjema v obe smeri
  //                 (floaterji menjajo s komerkoli).
  // Trde varovalke (počitek, spolno pravilo C1/D, razmik dežurstev) preveri
  // baza sama ob potrditvi in menjavo, ki bi jih kršila, zavrne - pred
  // oddajo pa se izpišejo kot opozorila (glej izracunajKrsitveMenjave).
  useEffect(() => {
    if (vrsta !== "menjava_sluzbe" || !datum || mojaIzmena === undefined){ setOsebe(null); return; }
    let cancelled = false;
    setOsebeBusy(true);
    // Pri DEŽURSTVU je nabor natanko KROG DEŽURNIH - 14 oseb, ki jih
    // našteva pokriva_oddelek z department_code = 'DEZ' (glej
    // supabase/dezurni-kader.sql). To je isti vir, iz katerega generator
    // sestavlja razpored dežurstev, zato se seznama ne moreta raziti.
    // NZV je širši od tega kroga (vsi vodje in administratorji), zato
    // vloga tu ni dovolj: dežurstvo zahteva pooblastilo.
    const kljucniKrog = jeDezurstvoDan
      ? client.from("pokriva_oddelek").select("profile_id").eq("department_code", "DEZ")
          .then(r => (r.error ? null : (r.data || []).map(v => v.profile_id)), () => null)
      : Promise.resolve(null);
    Promise.all([
      client.from("profili").select("id, full_name, role, department_code").order("full_name"),
      kljucniKrog,
    ]).then(([{ data }, krog]) => {
      if (cancelled) return;
      const vsi = (data || []).filter(o => o.id !== actingId);
      if (!jeDezurstvoDan) {
        setOsebe(vsi.filter(o => !mojOddelek || o.department_code === mojOddelek
          || o.department_code === "FLEXI" || mojOddelek === "FLEXI"));
        return;
      }
      // Če kroga (še) ni v bazi - nova namestitev, dezurni-kader.sql še ni
      // pognan - se raje vrnemo na vlogo, kot da bi seznam ostal prazen in
      // menjava dežurstva sploh ne bi bila mogoča. Da to ni tiho, se pod
      // iskalnikom izpiše opozorilo (glej krogNepopoln spodaj).
      const vKrogu = krog && krog.length ? new Set(krog) : null;
      setKrogPoln(!!vKrogu);
      setOsebe(vKrogu
        ? vsi.filter(o => vKrogu.has(o.id))
        : vsi.filter(o => window.NzvZasedba.jeNzvVloga(o.role) || o.department_code === "NZV"));
    }).finally(() => { if (!cancelled) setOsebeBusy(false); });
    return () => { cancelled = true; };
  }, [vrsta, datum, mojaIzmena, mojOddelek, jeDezurstvoDan, actingId]);

  // Okno razporeda izbrane osebe. Dežurstvo pride na vrsto vsakih nekaj dni
  // (krog ~14 ljudi), zato je ozko okno skoraj vedno prazno - enako kot v
  // mozni_sodelavci: ±45 dni za dežurstvo, ±7 sicer. Preteklih dni ni
  // mogoče ponuditi (izmene se za nazaj ne da odslužiti).
  useEffect(() => {
    if (!izbranaOseba || !datum){ setRazporedOsebe(null); return; }
    let cancelled = false;
    setRazporedOsebe(null);
    const okno = jeDezurstvoDan ? 45 : 7;
    const premakni = (n) => {
      const d = new Date(datum + "T00:00:00");
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    };
    const danes = new Date().toISOString().slice(0, 10);
    const od = premakni(-okno) < danes ? danes : premakni(-okno);
    client.from("razpored").select("work_date, shift_code")
      .eq("employee_id", izbranaOseba.id).gte("work_date", od).lte("work_date", premakni(okno))
      .order("work_date")
      .then(({ data }) => {
        if (cancelled) return;
        // Samo dnevi, ko je oseba res na delu - dopusta, bolniške ali
        // prostega dne ni mogoče prevzeti.
        setRazporedOsebe((data || []).filter(d => {
          const st = window.Izmene.stanje(d.shift_code);
          return d.shift_code && (st === "delo" || st === "dezurstvo");
        }));
      });
    return () => { cancelled = true; };
  }, [izbranaOseba, datum, jeDezurstvoDan]);

  // Iskanje po imenu: brez strešic in velikih črk, po delu besede
  // ("kova" najde "Kovač"). Vrstni red besed se NE spreminja, zato "kovač a"
  // najde "Kovač Ana" - drugače kot pri window.Imena.kljuc, ki besede
  // razvrsti in je namenjen ujemanju dveh CELIH imen, ne iskanju.
  const iskalniKljuc = (t) => String(t || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d")
    .replace(/\s+/g, " ").trim();
  const najdene = (osebe || []).filter(o =>
    !iskanje.trim() || iskalniKljuc(o.full_name).includes(iskalniKljuc(iskanje)));

  // Samo informativno (dejansko zaznavanje je server-side v obrazec_oddaj) -
  // menjava dežurstva preskoči vodjo in gre naravnost h koordinatorju
  // (izključno Denis Džamastagić), zato je prav, da to vidiš že pred oddajo.
  const jeDezurstvo = vrsta === "menjava_sluzbe" && (
    (mojaIzmena || "").toLowerCase().startsWith("dežurstvo")
    || (izbranSodelavec && (izbranSodelavec.njihova_izmena || "").toLowerCase().startsWith("dežurstvo"))
  );

  // Delovnopravno preverjanje menjave (ZDR-1) – generator je te omejitve
  // upošteval, ročna menjava pa jih je doslej lahko tiho podrla: npr.
  // popoldanska izmena zamenjana za jutranjo naslednji dan pomeni manj kot
  // 10,7 h počitka (glej PRIVZETA_PRAVILA.minPocitekUr v delovni-cas.js).
  // Preveri se razpored OBEH oseb, kakršen bo PO menjavi.
  const [krsitve, setKrsitve] = useState(null);
  useEffect(() => {
    if (vrsta !== "menjava_sluzbe" || !izbranSodelavec || !datum){
      setKrsitve(null);
      return;
    }
    let cancelled = false;
    izracunajKrsitveMenjave({
      jazId: actingId, jazIme: actingIme,
      jazDatum: datum, jazIzmena: mojaIzmena || "",
      onId: izbranSodelavec.profile_id, onIme: izbranSodelavec.full_name,
      onDatum: izbranSodelavec.njihov_datum, onIzmena: izbranSodelavec.njihova_izmena,
    }).then(k => { if (!cancelled) setKrsitve(k); });
    return () => { cancelled = true; };
  }, [vrsta, datum, izbranSodelavec, mojaIzmena, actingId, actingIme]);

  const oddaj = async () => {
    setErr(null);
    if (!datum){ setErr("Izberi datum."); return; }
    let polja = { opomba: opomba.trim() || undefined };
    let sodelavec_id = null;
    // Vrsta "oddaja_dezurstva" (enosmerna predaja dežurstva brez povratne
    // izmene) se od septembra 2026 ne ustvarja več - uporabnikova odločitev.
    // Stari obrazci te vrste se še vedno prikažejo in dokončajo, zato ostajata
    // izpis in shema nespremenjena.
    const vrstaZaOddajo = vrsta;
    if (vrsta === "menjava_sluzbe"){
      if (!izbranSodelavec){ setErr("Izberi sodelavca in dan za menjavo."); return; }
      sodelavec_id = izbranSodelavec.profile_id;
      polja = { ...polja, datum_a: datum, izmena_a: mojaIzmena || "", datum_b: izbranSodelavec.njihov_datum, izmena_b: izbranSodelavec.njihova_izmena };
      // Opozorila (56 ur, zaporedne nočne, prost dan) se shranijo Z obrazcem:
      // brez tega ju vodja in administrator ob odločanju ne bi videla, čeprav
      // se ravno od njiju pričakuje, da o njih presodita. Shrani se to, kar
      // je videl predlagatelj; ob odločanju se izračun še osveži (glej
      // OpozorilaMenjave), da se pozna, če se je razpored vmes spremenil.
      if (krsitve && krsitve.length) {
        polja.opozorila = krsitve.map(k => ({
          oseba: k.oseba, datum: k.datum, vrsta: k.vrsta,
          resnost: k.resnost, sporocilo: k.sporocilo,
        }));
      }
    } else if (vrsta === "rocno_evidentiranje"){
      if (!prihod || !odhod){ setErr("Vnesi prihod in odhod."); return; }
      polja = { ...polja, datum, prihod, odhod };
    } else {
      if (!razlog.trim()){ setErr("Vnesi razlog."); return; }
      polja = { ...polja, datum, prihod: prihod || null, odhod: odhod || null, razlog: razlog.trim() };
    }

    setBusy(true);
    try {
      const { data, error } = await client.from("obrazci").insert({
        vrsta: vrstaZaOddajo, status: "osnutek", vlagatelj_id: myId, sodelavec_id, polja,
      }).select().single();
      if (error) throw error;
      const { error: e2 } = await client.rpc("obrazec_oddaj", { p_id: data.id });
      if (e2) throw e2;
      setDatum(""); setPrihod(""); setOdhod(""); setRazlog(""); setOpomba("");
      setIzbranSodelavec(null); setIzbranaOseba(null); setRazporedOsebe(null); setIskanje("");
      onOddano();
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  // Administratorska takojšnja izvedba (glej komentar ob jeAdmin/zaKogaId
  // zgoraj) - mimo obrazec_oddaj/sodelavec/vodja, naravnost
  // obrazec_admin_izvedi_menjavo. Baza sama zavrne, če bi menjava kršila
  // trdo varovalko (počitek, spol C1/D, razmik dežurstev) - enako kot pri
  // navadni potrditvi, tu se to samo pokaže kot napaka namesto opozorila.
  const izvediTakoj = async () => {
    setErr(null);
    if (!izbranSodelavec){ setErr("Izberi sodelavca za menjavo."); return; }
    const potrjeno = confirm(
      `Administratorska takojšnja menjava, MIMO potrditev sodelavca in vodje:\n\n`
      + `${actingIme} (${fmtDatum(datum)}, ${oznakaIzmene(mojaIzmena)})\n⇄\n`
      + `${izbranSodelavec.full_name} (${fmtDatum(izbranSodelavec.njihov_datum)}, ${oznakaIzmene(izbranSodelavec.njihova_izmena)})\n\n`
      + `Menjava se izvede takoj, v razporedu. Nadaljujem?`
    );
    if (!potrjeno) return;
    setBusy(true);
    try {
      const { error } = await client.rpc("obrazec_admin_izvedi_menjavo", {
        p_vlagatelj_id: actingId, p_sodelavec_id: izbranSodelavec.profile_id,
        p_dan_a: datum, p_dan_b: izbranSodelavec.njihov_datum,
        p_razlog: opomba.trim() || null,
      });
      if (error) throw error;
      setDatum(""); setOpomba(""); setIzbranSodelavec(null); setIzbranaOseba(null); setRazporedOsebe(null);
      setIskanje(""); setZaDrugega(false); setZaKogaId("");
      onOddano();
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  const prikazOddelka = profil && profil.department_code
    ? (typeof window !== "undefined" && typeof window.formatirajOddelke === "function" ? window.formatirajOddelke(profil.department_code, null) : String(profil.department_code).split(/[\/,+]/)
        .map(v => String(v).trim()).filter(Boolean).map(v => v.replace(/ZO/gi, "ŽO").replace(/B1B2/gi, "B1,B2")).filter((v, idx, arr) => arr.indexOf(v) === idx).join(", "))
    : "";

  return (
    <div>
      <div className="tabs no-print" role="tablist">
        {Object.keys(VRSTA_LABEL).map(v => (
          <button key={v} role="tab" aria-selected={vrsta === v} onClick={() => { setVrsta(v); setErr(null); }}>{VRSTA_LABEL[v]}</button>
        ))}
      </div>
      <div className="card">
        <div className="field">
          <label htmlFor="ip">Ime, priimek, oddelek</label>
          <input id="ip" type="text" value={profil ? `${profil.full_name}${prikazOddelka ? " · " + prikazOddelka : ""}` : "Nalagam …"} disabled />
        </div>

        {vrsta === "menjava_sluzbe" && jeAdmin && (
          <div className="field adminTakoj">
            <label htmlFor="zaDrugega" style={{display:"flex", alignItems:"center", gap:8, fontWeight:"normal"}}>
              <input id="zaDrugega" type="checkbox" checked={zaDrugega}
                onChange={e => {
                  const v = e.target.checked;
                  setZaDrugega(v); setZaKogaId(""); setDatum(""); setIzbranSodelavec(null);
                  setIzbranaOseba(null); setRazporedOsebe(null); setIskanje(""); setErr(null);
                  if (v) nalozizZaposlene();
                }} />
              Izvedi menjavo namesto drugega zaposlenega (skrajni primer – sam ne utegne/ne more)
            </label>
            {zaDrugega && (
              <React.Fragment>
                <select value={zaKogaId} onChange={e => { setZaKogaId(e.target.value); setDatum(""); setIzbranSodelavec(null); setIzbranaOseba(null); setRazporedOsebe(null); }}
                  disabled={zaposleniBusy} style={{marginTop:6}}>
                  <option value="">{zaposleniBusy ? "Nalagam …" : "– izberi zaposlenega –"}</option>
                  {(zaposleni || []).map(z => <option key={z.id} value={z.id}>{z.full_name}</option>)}
                </select>
                <p className="hint" style={{marginTop:6}}>
                  Spodaj boš namesto svojega videl(a) razpored izbranega zaposlenega. Gumb bo namesto "Oddaj obrazec"
                  ponudil "Izvedi takoj" – menjava se izvede TAKOJ, brez čakanja na potrditev sodelavca ali vodje.
                  Trde varovalke (počitek, spolno pravilo C1/D, razmik dežurstev) ostanejo enake in menjavo, ki bi
                  jih kršila, sistem zavrne enako kot pri navadni menjavi.
                </p>
              </React.Fragment>
            )}
          </div>
        )}

        {vrsta === "menjava_sluzbe" && (!jeAdmin || !zaDrugega || zaKogaId) && (
          <React.Fragment>
            <div className="field">
              <label htmlFor="da">{zaDrugega ? `Datum (${actingIme})` : "Moj datum"}</label>
              <input id="da" type="date" value={datum} onChange={e => setDatum(e.target.value)} />
              {mojaIzmena !== undefined && <div className="shiftPreview">Trenutno: {oznakaIzmene(mojaIzmena)}</div>}
              {(mojaIzmena || "").toLowerCase().startsWith("dežurstvo") && (
                <p className="hint" style={{marginTop:4}}>
                  Dežurstvo: spodaj so vsi iz NZV, razpored izbrane osebe pa se izpiše za 45 dni naprej in nazaj
                  (dežurstvo pride na vrsto vsakih nekaj dni, zato je ožje okno skoraj vedno prazno).
                </p>
              )}
            </div>
            {/* ROČNO iskanje sodelavca (uporabnikova zahteva, september 2026).
                Prej je bil tu gumb, ki je sam predlagal pare (oseba + dan) in
                marsikoga izločil, preden ga je predlagatelj sploh videl. Zdaj:
                poiščeš osebo, vidiš NJEN razpored in izbereš dan. */}
            {datum && mojaIzmena !== undefined && !izbranaOseba && (
              <div className="field">
                <label htmlFor="isc">Poišči sodelavca</label>
                <input id="isc" type="search" value={iskanje} autoComplete="off"
                  onChange={e => setIskanje(e.target.value)}
                  placeholder="Vpiši priimek ali ime …" />
                <p className="hint" style={{marginTop:4}}>
                  {jeDezurstvoDan
                    ? (krogPoln
                        ? "Dežurstvo: na voljo je krog dežurnih (" + (osebe ? osebe.length : "…") + " oseb). Drugih ni mogoče izbrati."
                        : "Dežurstvo: kroga dežurnih ni v bazi (poženi supabase/dezurni-kader.sql), zato so začasno na voljo vsi NZV vodje.")
                    : (mojOddelek ? "Sodelavci oddelka " + mojOddelek + " (in FLEXI)." : "Sodelavci tvojega oddelka.")}
                </p>
                {osebeBusy && <p className="empty">Nalagam …</p>}
                {!osebeBusy && osebe !== null && najdene.length === 0 && (
                  <p className="empty">Ni zadetkov.</p>
                )}
                {!osebeBusy && najdene.slice(0, 40).map(o => (
                  <div className="candidate" key={o.id}>
                    <div>
                      <div className="who">
                        <a href={"imenik.html?id=" + o.id} style={{color:"inherit"}} title="Odpri profil">{o.full_name}</a>
                      </div>
                      {o.department_code && <div className="meta">{o.department_code}</div>}
                    </div>
                    <button type="button" className="candBtn"
                      onClick={() => { setIzbranaOseba(o); setIzbranSodelavec(null); }}>Izberi</button>
                  </div>
                ))}
                {!osebeBusy && najdene.length > 40 && (
                  <p className="hint">Prikazanih je prvih 40 – zoži iskanje.</p>
                )}
              </div>
            )}

            {izbranaOseba && (
              <div className="field">
                <label>Razpored – {izbranaOseba.full_name}</label>
                <button type="button" className="ghostBtn no-print" style={{marginBottom:8}}
                  onClick={() => { setIzbranaOseba(null); setIzbranSodelavec(null); setRazporedOsebe(null); }}>
                  ‹ Izberi drugega sodelavca
                </button>
                {razporedOsebe === null && <p className="empty">Nalagam …</p>}
                {razporedOsebe !== null && razporedOsebe.length === 0 && (
                  <p className="empty">
                    {izbranaOseba.full_name} v tem obdobju ({jeDezurstvoDan ? "±45" : "±7"} dni od izbranega datuma)
                    nima nobene izmene, ki bi jo bilo mogoče zamenjati.
                  </p>
                )}
                {(razporedOsebe || []).map(d => (
                  <div className="candidate" key={d.work_date}>
                    <div>
                      <div className="who">{fmtDatum(d.work_date)}</div>
                      <div className="meta">{oznakaIzmene(d.shift_code)}</div>
                    </div>
                    <button type="button" className="candBtn"
                      aria-pressed={!!izbranSodelavec && izbranSodelavec.njihov_datum === d.work_date}
                      onClick={() => setIzbranSodelavec({
                        profile_id: izbranaOseba.id, full_name: izbranaOseba.full_name,
                        njihova_izmena: d.shift_code, njihov_datum: d.work_date,
                      })}>Izberi</button>
                  </div>
                ))}
              </div>
            )}

            {/* Kdo s kom in kaj za kaj - da je pred oddajo jasno vidno,
                kaj se bo zgodilo (uporabnikova pripomba). */}
            {izbranSodelavec && (
              <div className="field povzetekMenjave">
                <label>Menjava</label>
                <div>
                  <b>{actingIme}</b> · {fmtDatum(datum)} · {oznakaIzmene(mojaIzmena)}
                </div>
                <div style={{textAlign:"center", fontSize:18, lineHeight:1.2}}>⇅</div>
                <div>
                  <b>{izbranSodelavec.full_name}</b> · {fmtDatum(izbranSodelavec.njihov_datum)} ·{" "}
                  {oznakaIzmene(izbranSodelavec.njihova_izmena)}
                </div>
              </div>
            )}
          </React.Fragment>
        )}

        {vrsta === "rocno_evidentiranje" && (
          <React.Fragment>
            <div className="field"><label htmlFor="d1">Datum</label><input id="d1" type="date" value={datum} onChange={e => setDatum(e.target.value)} /></div>
            <div className="row2">
              <div className="field"><label htmlFor="pr">Prihod</label><input id="pr" type="time" value={prihod} onChange={e => setPrihod(e.target.value)} /></div>
              <div className="field"><label htmlFor="od">Odhod</label><input id="od" type="time" value={odhod} onChange={e => setOdhod(e.target.value)} /></div>
            </div>
          </React.Fragment>
        )}

        {vrsta === "drugo" && (
          <React.Fragment>
            <div className="field"><label htmlFor="d2">Datum</label><input id="d2" type="date" value={datum} onChange={e => setDatum(e.target.value)} /></div>
            <div className="row2">
              <div className="field"><label htmlFor="pr2">Prihod (neobvezno)</label><input id="pr2" type="time" value={prihod} onChange={e => setPrihod(e.target.value)} /></div>
              <div className="field"><label htmlFor="od2">Odhod (neobvezno)</label><input id="od2" type="time" value={odhod} onChange={e => setOdhod(e.target.value)} /></div>
            </div>
            <div className="field">
              <label htmlFor="rz">Razlog</label>
              <textarea id="rz" value={razlog} onChange={e => setRazlog(e.target.value)} placeholder="npr. kasnejši prihod, nadomestni prihod zaradi odsotnosti razporejenega delavca" />
            </div>
          </React.Fragment>
        )}

        {/* Pri "Drugo" polja Opomba ni več (uporabnikova zahteva, september
            2026): razlog je tam obvezen in pove isto, dve prosti polji sta
            samo podvajali vnos. Pri menjavi službe in ročnem evidentiranju
            ostane. */}
        {vrsta !== "drugo" && (
          <div className="field">
            <label htmlFor="op">{vrsta === "menjava_sluzbe" ? "Razlog menjave (neobvezno)" : "Opomba (neobvezno)"}</label>
            <textarea id="op" value={opomba} onChange={e => setOpomba(e.target.value)} />
          </div>
        )}
        {jeDezurstvo && !(zaDrugega && zaKogaId) && (
          <p className="hint" style={{marginTop:-6}}>
            🔁 Menjava dežurstva: po potrditvi sodelavca gre predlog naravnost h koordinatorju
            (Denis Džamastagić), brez vmesnega koraka pri vodji.
          </p>
        )}
        {krsitve && krsitve.length > 0 && (
          <div className="warnBox" style={{marginTop:4}}>
            <div className="t">
              ⚠ Ta menjava bi kršila delovnopravna pravila ({krsitve.length})
            </div>
            <ul style={{margin:"6px 0 0", paddingLeft:18}}>
              {krsitve.map((k, i) => (
                <li key={i} style={{fontSize:12.5, marginBottom:2}}>
                  <b>{k.oseba}</b> ({fmtDatum(k.datum)}): {k.sporocilo}
                </li>
              ))}
            </ul>
            <p className="hint" style={{margin:"8px 0 0"}}>
              {(zaDrugega && zaKogaId)
                ? "Kljub temu opozorilu lahko menjavo izvedeš takoj - to NI trda varovalka (tiste sistem zavrne sam)."
                : "Menjavo lahko vseeno oddaš – opozorilo si bosta ogledala še vodja in koordinator, ki menjavo potrdita ali zavrneta."}
            </p>
          </div>
        )}
        {vrsta === "menjava_sluzbe" && zaDrugega && zaKogaId ? (
          <button className="btn btn-danger btn-block" onClick={izvediTakoj} disabled={busy || !izbranSodelavec}>
            {busy ? "Izvajam …" : "⚡ Izvedi takoj (mimo potrditev)"}
          </button>
        ) : (
          <button className="submitBtn" onClick={oddaj} disabled={busy || (vrsta === "menjava_sluzbe" && zaDrugega && !zaKogaId)}>
            {busy ? "Oddajam …" : "Oddaj obrazec"}
          </button>
        )}
        {err && <p className="err">{err}</p>}
      </div>
    </div>
  );
}

// Opozorila na obrazcu za tistega, ki o njem odloča (vodja, administrator).
// Pokaže OBOJE: kaj je bilo shranjeno ob oddaji in kakšno je stanje ZDAJ -
// med oddajo in odločitvijo se razpored lahko spremeni (druga menjava, ročni
// popravek) in takrat je pomembno, da vodja ne odloča po zastarelem podatku.
function OpozorilaMenjave({ obrazec }){
  const p = obrazec.polja || {};
  const shranjena = Array.isArray(p.opozorila) ? p.opozorila : [];
  const [sveza, setSveza] = useState(undefined); // undefined = še računam

  useEffect(() => {
    if (obrazec.vrsta !== "menjava_sluzbe" || !p.datum_a || !p.datum_b) { setSveza(null); return; }
    let cancelled = false;
    izracunajKrsitveMenjave({
      jazId: obrazec.vlagatelj_id, jazIme: "Vlagatelj",
      jazDatum: p.datum_a, jazIzmena: p.izmena_a,
      onId: obrazec.sodelavec_id, onIme: "Sodelavec",
      onDatum: p.datum_b, onIzmena: p.izmena_b,
    }).then(k => { if (!cancelled) setSveza(k); });
    return () => { cancelled = true; };
  }, [obrazec.id]);

  if (shranjena.length === 0 && (!sveza || sveza.length === 0)) return null;

  // Kar je bilo ob oddaji in zdaj ni več (ali obratno) - to je za odločitev
  // najbolj povedno, zato posebej izpostavljeno.
  const kljuc = k => k.vrsta + "|" + k.datum;
  const seSveza = (sveza || []).map(kljuc);
  const seShran = shranjena.map(kljuc);
  const odpadla = shranjena.filter(k => sveza && !seSveza.includes(kljuc(k)));
  const nova = (sveza || []).filter(k => !seShran.includes(kljuc(k)));

  return (
    <div style={{margin:"6px 0 10px", padding:"8px 10px", borderRadius:8,
      background:"var(--danger-bg)", border:"1px solid var(--danger)"}}>
      <div style={{fontWeight:800, fontSize:13, color:"var(--danger)"}}>
        ⚠ Delovnopravna opozorila – presodi pred odobritvijo
      </div>
      <ul style={{margin:"6px 0 0", paddingLeft:18, fontSize:12.5}}>
        {(sveza && sveza.length ? sveza : shranjena).map((k, i) => (
          <li key={i}>{k.sporocilo}{k.datum ? " (" + fmtDatum(k.datum) + ")" : ""}</li>
        ))}
      </ul>
      {sveza === undefined && <p className="hint" style={{margin:"6px 0 0"}}>Preverjam trenutno stanje …</p>}
      {sveza === null && shranjena.length > 0 && (
        <p className="hint" style={{margin:"6px 0 0"}}>
          Zgoraj je stanje ob oddaji; trenutnega ni bilo mogoče preveriti.
        </p>
      )}
      {nova.length > 0 && (
        <p className="hint" style={{margin:"6px 0 0", color:"var(--danger)"}}>
          Pozor: {nova.length === 1 ? "1 opozorilo je nastalo" : nova.length + " opozoril je nastalo"} šele
          po oddaji – razpored se je vmes spremenil.
        </p>
      )}
      {odpadla.length > 0 && (
        <p className="hint" style={{margin:"6px 0 0"}}>
          {odpadla.length === 1 ? "1 opozorilo z oddaje ne velja več" : odpadla.length + " opozoril z oddaje ne velja več"} –
          razpored se je vmes spremenil.
        </p>
      )}
    </div>
  );
}

// Kdo s kom in kaj za kaj - v enem samem zapisu za vse sezname obrazcev
// ("Čaka name", "Moji obrazci"). Prej je vsak izpisal le številko in vrsto,
// zato iz seznama ni bilo videti, čigava menjava je to (uporabnikova
// pripomba, september 2026). Pri obrazcih, ki menjave ne opisujejo (ročno
// evidentiranje, drugo), ostane samo datum.
function UdelezencaMenjave({ obrazec }){
  const p = obrazec.polja || {};
  const jeMenjava = obrazec.vrsta === "menjava_sluzbe" || obrazec.vrsta === "oddaja_dezurstva";
  const kdo = obrazec.vlagatelj ? obrazec.vlagatelj.full_name : null;
  const sKom = obrazec.sodelavec ? obrazec.sodelavec.full_name : null;
  if (!jeMenjava || (!kdo && !sKom)) {
    const d = p.datum_a || p.datum;
    return d ? <div className="meta">{fmtDatum(d)}</div> : null;
  }
  return (
    <React.Fragment>
      <div className="meta">
        <b>{kdo || "?"}</b>{obrazec.vrsta === "oddaja_dezurstva" ? " → " : " ↔ "}<b>{sKom || "?"}</b>
      </div>
      <div className="meta">
        {obrazec.vrsta === "oddaja_dezurstva"
          ? (p.datum ? fmtDatum(p.datum) + " · dežurstvo (brez povratne izmene)" : "")
          : (p.datum_a ? fmtDatum(p.datum_a) + " · " + oznakaIzmene(p.izmena_a) : "")
            + " ⇄ "
            + (p.datum_b ? fmtDatum(p.datum_b) + " · " + oznakaIzmene(p.izmena_b) : "")}
      </div>
    </React.Fragment>
  );
}

function CakaName({ rows, onOdloceno, ogled }){
  const [busyId, setBusyId] = useState(null);
  const [opombaId, setOpombaId] = useState(null);
  const [opombaBesedilo, setOpombaBesedilo] = useState("");

  if (rows.length === 0) return <p className="empty">Trenutno ni zahtevkov, ki čakajo tvojo odločitev.</p>;

  const funkcijaZa = (dejanje) => ({
    potrdi_kot_sodelavec: "obrazec_potrdi_sodelavec",
    odobri_kot_vodja: "obrazec_potrdi_vodja",
    potrdi_kot_koordinator: "obrazec_potrdi_koordinator",
  })[dejanje];

  const odloci = async (row, sprejmi) => {
    if (!sprejmi && opombaId !== row.id){ setOpombaId(row.id); setOpombaBesedilo(""); return; }
    setBusyId(row.id);
    try {
      const fn = funkcijaZa(row.moje_dejanje);
      const { error } = await client.rpc(fn, { p_id: row.id, p_sprejmi: sprejmi, p_opomba: sprejmi ? null : (opombaBesedilo.trim() || null) });
      if (error) throw error;
      setOpombaId(null); setOpombaBesedilo("");
      onOdloceno();
    } catch (e) { alert(e.message || String(e)); }
    finally { setBusyId(null); }
  };

  return (
    <div className="card">
      {ogled && (
        <p className="hint" style={{marginTop:0}}>
          Gledaš kot druga oseba, zato je spodaj njen seznam - odločiti pa mora ona sama (baza
          odobritve v tujem imenu ne dovoli), zato sta gumba tu izklopljena.
        </p>
      )}
      {rows.map(r => (
        <div key={r.id}>
          <div className="entry" style={{cursor:"default"}}>
            <div>
              <div className="who">{r.stevilka} · {vrstaLabel(r.vrsta)}</div>
              {/* Kdo s kom in kaj za kaj. Prej sta bili tu samo številka
                  obrazca in datum, zato iz seznama ni bilo videti, čigavo
                  menjavo sploh odobravaš (uporabnikova pripomba). */}
              <UdelezencaMenjave obrazec={r} />
              {r.polja && r.polja.opomba && <div className="meta">{r.polja.opomba}</div>}
              <OpozorilaMenjave obrazec={r} />
            </div>
            <div className="actions">
              <button className="actBtn yes" disabled={ogled || busyId === r.id} onClick={() => odloci(r, true)}>Odobri</button>
              <button className="actBtn no" disabled={ogled || busyId === r.id} onClick={() => odloci(r, false)}>Zavrni</button>
            </div>
          </div>
          {opombaId === r.id && (
            <div style={{padding:"0 0 12px"}}>
              <textarea placeholder="Razlog zavrnitve (obvezno)" value={opombaBesedilo} onChange={e => setOpombaBesedilo(e.target.value)} />
              <button className="ghostBtn" style={{marginTop:6}} disabled={!opombaBesedilo.trim() || busyId === r.id} onClick={() => odloci(r, false)}>Potrdi zavrnitev</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function Casovnica({ obrazec, dnevnik }){
  // Menjava dežurstva preskoči korak "Neposredni vodja" (glej
  // obrazec_potrdi_sodelavec v supabase/schema.sql) - v časovnici se zato
  // sploh ne prikaže, da ne izgleda kot "čaka", čeprav do tja nikoli ne pride.
  const koraki = [
    { stopnja: 1, naslov: "Oddano", kratko: "Oddano" },
    ...((obrazec.vrsta === "menjava_sluzbe" || obrazec.vrsta === "oddaja_dezurstva") ? [{ stopnja: 2, naslov: "Sodelavec", kratko: "Sodelavec" }] : []),
    ...(obrazec.je_dezurstvo ? [] : [{ stopnja: 3, naslov: "Neposredni vodja", kratko: "Vodja" }]),
    { stopnja: 4, naslov: obrazec.je_dezurstvo ? "Koordinator (Denis Džamastagić)" : "Koordinator", kratko: "Koordinator" },
  ];
  // Prvi korak brez vnosa v dnevniku je "aktiven" (tam zahtevek trenutno
  // stoji) - vsi za njim so šele v prihodnosti.
  const koncan = koraki.filter(k => dnevnik.some(d => d.stopnja === k.stopnja)).length;
  const jeZavrnjen = dnevnik.some(d => d.dejanje.includes("ZAVRNIL"));

  return (
    <div>
      {/* Vodoravna časovna premica - stanje na prvi pogled. Podroben
          dnevnik (kdo/kdaj/opomba) ostaja pod njo. */}
      <div className="premica">
        {koraki.map((k, i) => {
          const vnos = dnevnik.find(d => d.stopnja === k.stopnja);
          const zavrnjen = vnos && vnos.dejanje.includes("ZAVRNIL");
          const razred = zavrnjen ? "zavrnjen"
            : vnos ? "koncan"
            : (i === koncan && !jeZavrnjen) ? "aktiven" : "";
          return (
            <div key={k.stopnja} className={"korak " + razred}>
              <div className="pika">{zavrnjen ? "✗" : vnos ? "✓" : (i === koncan && !jeZavrnjen) ? "●" : i + 1}</div>
              <div className="oznaka">{k.kratko || k.naslov}</div>
            </div>
          );
        })}
      </div>

      <ul className="timeline">
        {koraki.map(k => {
          const vnos = dnevnik.find(d => d.stopnja === k.stopnja);
          const zavrnjen = vnos && vnos.dejanje.includes("ZAVRNIL");
          return (
            <li key={k.stopnja} className={vnos ? (zavrnjen ? "rejected" : "done") : "pending"}>
              <span className="dot"></span>
              <div className="step">{k.naslov}{vnos ? (zavrnjen ? " – zavrnjeno" : " – potrjeno") : " – čaka"}</div>
              {vnos && <div className="meta">{vnos.ime_ob_dejanju} ({vnos.vloga_ob_dejanju}) · {fmtCas(vnos.cas)}{vnos.opomba ? " · " + vnos.opomba : ""}</div>}
            </li>
          );
        })}
      </ul>
    </div>
  );
}

// september 2026; prej je bil to seznam vseh menjav v bolnišnici.
// Pregled po oddelkih je pod razporedom oddelka (index.html -> Oddelki).
function MenjaveMeseca({ rows }){
  if (rows === null) return <p className="empty">Nalagam …</p>;
  if (rows.length === 0) return <p className="empty">V tem mesecu nisi vključen(a) v nobeno menjavo.</p>;
  return (
    <div className="card">
      {rows.map(r => {
        const p = r.polja || {};
        return (
          <div className="entry" style={{cursor:"default"}} key={r.id}>
            <div>
              <div className="who">
                {r.vlagatelj ? r.vlagatelj.full_name : "?"}
                {r.vrsta === "oddaja_dezurstva" ? " → " : " ↔ "}
                {r.sodelavec ? r.sodelavec.full_name : "?"}
                {r.vrsta === "oddaja_dezurstva"
                  ? <span className="pill wait" style={{marginLeft:6}}>oddaja dežurstva</span>
                  : r.je_dezurstvo && <span className="pill wait" style={{marginLeft:6}}>dežurstvo</span>}
              </div>
              <div className="meta">
                {r.vrsta === "oddaja_dezurstva"
                  ? (p.datum ? fmtDatum(p.datum) : "")
                  : (p.datum_a ? fmtDatum(p.datum_a) : "") + " ⇄ " + (p.datum_b ? fmtDatum(p.datum_b) : "")}
              </div>
            </div>
            <StatusPill status={r.status} />
          </div>
        );
      })}
    </div>
  );
}

// Seznam neprebranih obvestil, vezanih na menjave (url="obrazec.html") -
// prej ni bilo NOBENEGA mesta v aplikaciji, kjer bi jih bilo mogoče videti
// ali označiti kot prebrana, zato je rdeč znak na "Menjava" (RazporedNav)
// ostal trajno prižgan že po prvem obvestilu. Ob prikazu se vse vidno
// naštete vrstice takoj označijo kot prebrane (read_at), da se znak
// dejansko pobriše - enako kot pri "prebranih" obvestilih povsod drugje.
function NotifikacijePanel({ myId }){
  const [obvestila, setObvestila] = useState([]);
  const [skrito, setSkrito] = useState(false);

  useEffect(() => {
    if (!myId) return;
    let zivo = true;
    client.from("obvestila").select("id, title, message, created_at")
      .eq("user_id", myId).eq("url", "obrazec.html").is("read_at", null)
      .order("created_at", { ascending: false })
      .then(({ data }) => {
        if (!zivo || !data || data.length === 0) return;
        setObvestila(data);
        const idji = data.map(o => o.id);
        client.from("obvestila").update({ read_at: new Date().toISOString() }).in("id", idji).then(() => {});
      });
    return () => { zivo = false; };
  }, [myId]);

  if (obvestila.length === 0 || skrito) return null;
  return (
    <div className="card no-print" style={{marginBottom:12}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <b>Novo pri menjavah</b>
        <button className="ghostBtn" onClick={() => setSkrito(true)}>Skrij</button>
      </div>
      {obvestila.map(o => (
        <div key={o.id} className="rowline">
          <div className="lbl">{fmtCas(o.created_at)}</div>
          <div className="val">{o.title ? <b>{o.title}: </b> : null}{o.message}</div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null);
  const [zavihek, setZavihek] = useState("nov"); // nov | caka | moji | mesec
  const [caka, setCaka] = useState([]);
  const [moji, setMoji] = useState([]);
  const [mesec, setMesec] = useState(null);
  const [odprt, setOdprt] = useState(null);
  const [reloadKey, setReloadKey] = useState(0);
  const [prednapolni, setPrednapolni] = useState(null);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => { if (res) setAuth(res); });
    const params = new URLSearchParams(location.search);
    if (params.get("vrsta") || params.get("datum")) {
      setPrednapolni({ vrsta: params.get("vrsta") || undefined, datum: params.get("datum") || undefined });
      setZavihek("nov");
    }
  }, []);

  const reload = useCallback(() => setReloadKey(k => k + 1), []);

  useEffect(() => {
    if (!auth) return;
    const myId = auth.session.user.id;
    // "Čaka name" se NE bere več iz pogleda obrazci_moja_naloga: ta izračuna
    // nalogo v bazi prek auth.uid(), kar je narobe med "Ogledom kot
    // uporabnik" - ogled je SAMO lokalna preslikava, prava seja (in s tem
    // auth.uid()) ostane administratorjeva. Posledica je bila, da je admin,
    // ki je preveril "ali je predlog res prišel do sodelavca", videl PRAZEN
    // seznam - svoje naloge, ne sodelavčevih - čeprav je predlog pravilno
    // čakal. Zato nalogo določimo iz osebe, ki je DEJANSKO prikazana (myId +
    // njen profil); pravila so enaka kot v pogledu (glej obrazci_moja_naloga
    // v schema.sql). Vrstice pripelje RLS, ki je nespremenjen.
    client.from("obrazci").select("*, vlagatelj:profili!obrazci_vlagatelj_id_fkey(full_name), sodelavec:profili!obrazci_sodelavec_id_fkey(full_name)").neq("status", "osnutek").order("ustvarjen")
      .then(({ data }) => setCaka((data || [])
        .map(r => ({ ...r, moje_dejanje: mojeDejanje(r, myId, auth.profile) }))
        .filter(r => r.moje_dejanje)));
    client.from("obrazci").select("*, vlagatelj:profili!obrazci_vlagatelj_id_fkey(full_name), sodelavec:profili!obrazci_sodelavec_id_fkey(full_name)").or(`vlagatelj_id.eq.${myId},sodelavec_id.eq.${myId}`).order("ustvarjen", { ascending: false })
      .then(({ data }) => setMoji(data || []));

    const zdaj = new Date();
    const prviDan = new Date(zdaj.getFullYear(), zdaj.getMonth(), 1).toISOString().slice(0, 10);
    const naslednjiPrviDan = new Date(zdaj.getFullYear(), zdaj.getMonth() + 1, 1).toISOString().slice(0, 10);
    // Menjava (polja.datum_a) IN enosmerna oddaja dežurstva (polja.datum) -
    // oboje šteje kot "menjava izmen" za namen te mesečne preglednice.
    //
    // Samo menjave, v katere je uporabnik VKLJUČEN (uporabnikova zahteva,
    // september 2026). Prej je bil to bolnišnični seznam vseh menjav
    // meseca; pregled po oddelkih je pod razporedom oddelka
    // (index.html -> Oddelki), kjer sodi.
    client.from("obrazci")
      .select("*, vlagatelj:profili!obrazci_vlagatelj_id_fkey(full_name), sodelavec:profili!obrazci_sodelavec_id_fkey(full_name)")
      .neq("status", "osnutek")
      .or(`vlagatelj_id.eq.${myId},sodelavec_id.eq.${myId}`)
      .or(`and(vrsta.eq.menjava_sluzbe,polja->>datum_a.gte.${prviDan},polja->>datum_a.lt.${naslednjiPrviDan}),`
        + `and(vrsta.eq.oddaja_dezurstva,polja->>datum.gte.${prviDan},polja->>datum.lt.${naslednjiPrviDan})`)
      .order("ustvarjen", { ascending: false })
      .then(({ data, error }) => { if (error) console.error("Nalaganje menjav meseca ni uspelo:", error); setMesec(data || []); });
  }, [auth, reloadKey]);

  if (!auth) return null;
  const { profile } = auth;
  const myId = auth.session.user.id;

  return (
    <div className="wrap wide">
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout pred={<RazporedOrodja/>}/>
      <header className="top no-print">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Menjava</span></div>
        <p className="sub">Menjave izmen in evidentiranje prisotnosti · {profile ? profile.full_name : ""}</p>
      </header>

      <NotifikacijePanel myId={myId} />

      {!odprt && (
        <React.Fragment>
          <div className="tabs no-print" role="tablist">
            <button role="tab" aria-selected={zavihek === "nov"} onClick={() => setZavihek("nov")}>Nov obrazec</button>
            <button role="tab" aria-selected={zavihek === "caka"} onClick={() => setZavihek("caka")}>Čaka name{caka.length > 0 ? " (" + caka.length + ")" : ""}</button>
            <button role="tab" aria-selected={zavihek === "moji"} onClick={() => setZavihek("moji")}>Moji obrazci</button>
            <button role="tab" aria-selected={zavihek === "mesec"} onClick={() => setZavihek("mesec")}>V tem mesecu</button>
          </div>

          {zavihek === "nov" && (
            <div style={{maxWidth:560}}>
              <NovObrazec myId={myId} profil={profile} onOddano={() => { reload(); setZavihek("moji"); }} prednapolni={prednapolni} />
            </div>
          )}
          {zavihek === "caka" && <CakaName rows={caka} onOdloceno={reload} ogled={!!auth.ogled} />}
          {zavihek === "moji" && (
            <React.Fragment>
              <MojiObrazci rows={moji} onOdpri={setOdprt} />
              <RazporedIzvozVir
                naziv="Moji obrazci"
                naslov="moji-obrazci"
                pripravi={() => [{
                  ime: "Obrazci",
                  glave: ["Številka", "Vrsta", "Ustvarjen", "Status"],
                  vrstice: moji.map(r => [
                    r.stevilka, vrstaLabel(r.vrsta),
                    window.Datum.slo(r.ustvarjen),
                    (STATUS_LABEL[r.status] || { text: r.status }).text,
                  ]),
                }]}
              />
            </React.Fragment>
          )}
          {zavihek === "mesec" && (
            <React.Fragment>
              <p className="hint no-print">Menjave izmen za tekoči mesec, v katere si vključen(a) – kot predlagatelj ali kot sodelavec.</p>
              <MenjaveMeseca rows={mesec} />
              {mesec && mesec.length > 0 && (
                <RazporedIzvozVir
                  naziv="Menjave meseca"
                  naslov="menjave-meseca"
                  pripravi={() => [{
                    ime: "Menjave",
                    glave: ["Predlagatelj", "Sodelavec", "Datum 1", "Datum 2", "Dežurstvo", "Status"],
                    vrstice: mesec.map(r => [
                      r.vlagatelj ? r.vlagatelj.full_name : "?",
                      r.sodelavec ? r.sodelavec.full_name : "?",
                      r.polja && (r.polja.datum_a || r.polja.datum) ? fmtDatum(r.polja.datum_a || r.polja.datum) : "",
                      r.polja && r.polja.datum_b ? fmtDatum(r.polja.datum_b) : (r.vrsta === "oddaja_dezurstva" ? "oddaja (brez povratne)" : ""),
                      r.je_dezurstvo ? "da" : "ne",
                      (STATUS_LABEL[r.status] || { text: r.status }).text,
                    ]),
                  }]}
                />
              )}
            </React.Fragment>
          )}
        </React.Fragment>
      )}
      {odprt && <DetajlObrazca obrazec={odprt} profil={profile} onNazaj={() => setOdprt(null)} />}

      <footer className="foot no-print">
        <p>Digitalna različica obrazca »Zahtevek za spremembo evidence delovnega časa in razporeda«.</p>
        <p>{opisVerige(profile)}</p>
      </footer>

      <RazporedNav active="menjava" role={profile ? profile.role : "user"} unread={0} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
