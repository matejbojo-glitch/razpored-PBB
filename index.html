<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Razpored · Begunje</title>
<meta name="description" content="Mesečni razpored dela zdravstvene nege, Psihiatrična bolnišnica Begunje" />
<meta name="theme-color" content="#12192B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Razpored" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<style>
  :root{
    --bg: #0d1322;
    --bg-grad: #12192B;
    --surface: #1B2540;
    --surface-2: #212C4C;
    --line: #2B375C;
    --text: #F1F0EA;
    --muted: #8B93A8;
    --accent: #E8A33D;
    --accent-ink: #2A1C05;
    --dop: #7FB88F;
    --pop: #E0916B;
    --noc: #6E8FD1;
    --h12: #A78BC9;
    --off: #4A5270;
    --off-text: #B9BFD1;
    --danger: #D97757;
    --radius: 16px;
    --radius-sm: 10px;
    --tabular: "tnum" 1, "lnum" 1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }
  a, button{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  header.top{
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px;
  }
  .wordmark{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .wordmark .mark{
    font-weight: 800; font-size: 20px; letter-spacing: -0.02em;
  }
  .wordmark .dept{
    font-size: 13px; color: var(--accent); font-weight: 700;
    letter-spacing: 0.02em;
  }
  .sub{ margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .whoRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .whoRow .who{ font-size:12.5px; color:var(--muted); }
  .whoRow .who b{ color:var(--text); }
  .navLinks{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .navLink{ font-size:12px; color:var(--muted); text-decoration:underline; text-underline-offset:3px;
    text-decoration-color:var(--line); background:none; border:0; cursor:pointer; padding:0; font-family:inherit; }
  .navLink:hover{ color:var(--text); }
  .badge{ display:inline-block; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    background:var(--danger); color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center; margin-left:4px; }

  .segmented{
    display:flex; gap:4px; background: var(--surface); border:1px solid var(--line);
    padding:4px; border-radius: 999px; margin-top: 14px;
  }
  .segmented button{
    flex:1; border:0; background:transparent; color: var(--muted);
    padding: 9px 10px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    cursor:pointer; transition: background .15s ease, color .15s ease;
  }
  .segmented button[aria-selected="true"]{ background: var(--accent); color: var(--accent-ink); }

  .field{ display:flex; flex-direction:column; gap:5px; margin-top:12px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  select, input[type=month]{
    background: var(--surface); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px;
  }

  /* ---------- my schedule ---------- */
  .todayCard{
    margin-top:16px; background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border:1px solid var(--line); border-radius: var(--radius); padding:16px;
  }
  .todayCard .lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
  .todayCard .shift{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .dot{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .todayCard .shiftName{ font-size: 19px; font-weight: 800; letter-spacing:-0.01em; }
  .todayCard .shiftTime{ font-size:12.5px; color: var(--muted); margin-top:2px; }

  .weekLabel{
    font-size: 12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color: var(--muted); margin: 22px 2px 8px;
  }
  .dayRow{
    display:flex; align-items:center; gap:12px; padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .dayRow:last-child{ border-bottom:0; }
  .dayRow .dnum{
    width: 40px; flex: 0 0 auto; text-align:center; font-variant-numeric: tabular-nums;
  }
  .dayRow .dnum .n{ font-size:18px; font-weight:800; line-height:1; }
  .dayRow .dnum .d{ font-size:10px; color: var(--muted); text-transform:uppercase; margin-top:2px; }
  .dayRow.today{ background: rgba(232,163,61,0.08); border-radius: 10px; }
  .dayRow.today .dnum .n{ color: var(--accent); }
  .dayRow.weekend .dnum .d{ color: var(--pop); }
  .chip{
    flex:1; display:flex; align-items:center; gap:8px; padding: 8px 12px;
    border-radius: 999px; font-size: 13.5px; font-weight:700; min-width:0;
  }
  .chip .txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.off{ color: var(--off-text); }

  /* ---------- ward table ---------- */
  .wardScroller{
    margin-top: 16px; overflow-x:auto; border:1px solid var(--line); border-radius: var(--radius);
    -webkit-overflow-scrolling: touch;
  }
  table.wardTable{ border-collapse:separate; border-spacing:0; width:max-content; }
  table.wardTable th, table.wardTable td{
    padding: 8px 9px; font-size: 12px; text-align:center; white-space:nowrap;
    border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  table.wardTable thead th{
    background: var(--surface-2); color: var(--muted); font-weight:700; position:sticky; top:0; z-index:2;
    font-size: 11px;
  }
  table.wardTable thead th.weekend{ color: var(--pop); }
  table.wardTable td.name, table.wardTable th.name{
    position:sticky; left:0; z-index:3; background: var(--surface); text-align:left;
    font-weight:700; min-width:118px; max-width:118px; overflow:hidden; text-overflow:ellipsis;
  }
  table.wardTable thead th.name{ z-index:4; background: var(--surface-2); }
  table.wardTable td.cell{ min-width:46px; }
  table.wardTable td.me{ box-shadow: inset 0 0 0 2px var(--accent); }
  .swatch{
    display:inline-block; padding:3px 6px; border-radius:6px; font-size:10.5px; font-weight:700;
  }

  .legend{
    margin-top:16px; display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color: var(--muted);
  }
  .legend .li{ display:flex; align-items:center; gap:6px; }
  .legend .dot{ width:9px; height:9px; }

  footer.foot{
    margin-top: 30px; padding-top:16px; border-top:1px solid var(--line);
    font-size: 11.5px; color: var(--muted); line-height:1.6;
  }
  footer.foot b{ color: var(--text); }

  .installBar{
    position: sticky; bottom: 0; margin-top: 20px; background: var(--surface);
    border:1px solid var(--accent); border-radius: var(--radius-sm); padding: 12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .installBar .t{ font-size:13px; font-weight:700; }
  .installBar .s{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .installBtn{
    background: var(--accent); color: var(--accent-ink); border:0; border-radius:999px;
    padding: 8px 14px; font-weight:800; font-size:12.5px; cursor:pointer; flex:0 0 auto;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .pdfBtn{ margin-top:12px; width:100%; background: transparent; color: var(--text); border:1px solid var(--line);
    padding:10px; border-radius: var(--radius-sm); font-weight:700; font-size:13px; cursor:pointer; }

  @media print{
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    body{ background:#fff !important; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th{ background:#f2f2f2 !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="babel.min.js"></script>
<script src="supabase-js.min.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const { client } = RazporedAuth;

const DAN_IME = { PO:"ponedeljek", TO:"torek", SR:"sreda", ČE:"četrtek", PE:"petek", SO:"sobota", NE:"nedelja" };
const DNI = ["PO","TO","SR","ČE","PE","SO","NE"];
const DELOVNI_ČAS = {
  "dopoldan": "05.50–14.00",
  "popoldan": "13.50–21.00",
  "popoldan do 19": "13.50–19.00",
  "popoldan do 19h": "13.50–19.00",
  "NOČNA": "20.50–06.00",
  "NOČNA od 19": "18.50–06.00",
  "NOČNA od 19h": "18.50–06.00",
  "NOČNA12": "17.50–06.00",
  "DNEVNA12": "05.50–18.00",
  "KPU": "koriščenje prostih ur",
  "LD": "letni dopust",
};

function classify(sifra){
  const t = (sifra || "").toLowerCase();
  if (t.startsWith("ld")) return "off";
  if (t.startsWith("kpu")) return "off";
  if (t.includes("nočna12")) return "h12";
  if (t.includes("dnevna12")) return "h12";
  if (t.startsWith("nočna")) return "noc";
  if (t.startsWith("dopoldan")) return "dop";
  if (t.startsWith("popoldan")) return "pop";
  return "off";
}
const BARVE = { dop:"#7FB88F", pop:"#E0916B", noc:"#6E8FD1", h12:"#A78BC9", off:"#4A5270" };

function shiftLabel(sifra){
  if (!sifra) return "Prosto";
  return sifra;
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthRange(monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { startISO:start, endISO:end };
}
function daysInRange(startISO, endISO){
  const out = [];
  let d = new Date(startISO + "T00:00:00");
  const end = new Date(endISO + "T00:00:00");
  while (d.getTime() <= end.getTime()){
    const wd = (d.getDay() + 6) % 7; // 0=PO..6=NE
    const p = n => String(n).padStart(2,"0");
    out.push({ datum: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, dan: DNI[wd] });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function MyScheduleView({ userId, month }){
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEntries(null);
    client.from("schedule_entries").select("work_date, shift_code")
      .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  const byDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.work_date] = e.shift_code; });
    return m;
  }, [entries]);

  const iso = todayISO();
  const todaySifra = byDate[iso];
  const todayCls = classify(todaySifra);

  const tedni = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach(dn => {
      if (dn.dan === "PO" || !cur){ cur = []; out.push(cur); }
      cur.push(dn);
    });
    return out;
  }, [days]);

  if (entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div>
      {startISO <= iso && iso <= endISO && (
        <div className="todayCard">
          <div className="lbl">Danes · {new Date(iso+"T00:00:00").toLocaleDateString("sl-SI",{day:"numeric",month:"long"})}</div>
          <div className="shift">
            <span className="dot" style={{background: BARVE[todayCls]}}></span>
            <div>
              <div className="shiftName">{shiftLabel(todaySifra)}</div>
              <div className="shiftTime">{DELOVNI_ČAS[todaySifra] || ""}</div>
            </div>
          </div>
        </div>
      )}

      {tedni.map((teden, i) => (
        <div key={i}>
          <div className="weekLabel">Teden {i+1}</div>
          {teden.map(dn => {
            const sifra = byDate[dn.datum];
            const cls = classify(sifra);
            const isToday = dn.datum === iso;
            const isWeekend = dn.dan === "SO" || dn.dan === "NE";
            const d = new Date(dn.datum + "T00:00:00");
            return (
              <div key={dn.datum} className={"dayRow" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "")}>
                <div className="dnum">
                  <div className="n">{d.getDate()}</div>
                  <div className="d">{dn.dan}</div>
                </div>
                <div className={"chip" + (cls==="off" ? " off" : "")} style={{background: cls==="off" ? "transparent" : (BARVE[cls] + "26"), border: "1px solid " + (cls==="off" ? "var(--line)" : BARVE[cls])}}>
                  <span className="dot" style={{background: BARVE[cls]}}></span>
                  <span className="txt">{shiftLabel(sifra)}</span>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function WardView({ deptCode, month, myId }){
  const [employees, setEmployees] = useState(null);
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEmployees(null); setEntries(null);
    client.from("profiles").select("id, full_name").eq("department_code", deptCode).order("full_name")
      .then(({ data }) => { if (!cancelled) setEmployees(data || []); });
    client.from("schedule_entries").select("employee_id, work_date, shift_code")
      .eq("department_code", deptCode).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [deptCode, startISO, endISO]);

  const byEmpDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.employee_id + "|" + e.work_date] = e.shift_code; });
    return m;
  }, [entries]);

  if (employees === null || entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;
  if (employees.length === 0) return <p className="sub" style={{marginTop:16}}>Za ta oddelek še ni dodeljenih zaposlenih.</p>;

  return (
    <div>
      <div className="wardScroller">
        <table className="wardTable">
          <thead>
            <tr>
              <th className="name">Zaposleni</th>
              {days.map(dn => (
                <th key={dn.datum} className={dn.dan==="SO"||dn.dan==="NE" ? "weekend" : ""}>
                  {new Date(dn.datum+"T00:00:00").getDate()}<br/>{dn.dan}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {employees.map(z => (
              <tr key={z.id}>
                <td className="name">{z.full_name}</td>
                {days.map(dn => {
                  const sifra = byEmpDate[z.id + "|" + dn.datum];
                  const cls = classify(sifra);
                  const isMe = z.id === myId;
                  return (
                    <td key={dn.datum} className={"cell" + (isMe ? " me" : "")}>
                      <span className="swatch" style={{background: BARVE[cls] + "33", color: "var(--text)"}} title={sifra}>
                        {cls==="off" ? "–" : (sifra||"").slice(0,3)}
                      </span>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="li"><span className="dot" style={{background:"var(--dop)"}}></span>Dopoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--pop)"}}></span>Popoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--noc)"}}></span>Nočna</span>
        <span className="li"><span className="dot" style={{background:"var(--h12)"}}></span>12-urna</span>
        <span className="li"><span className="dot" style={{background:"var(--off)"}}></span>LD / KPU / prosto</span>
      </div>
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null); // { session, profile }
  const [depts, setDepts] = useState([]);
  const [view, setView] = useState("my");
  const [month, setMonth] = useState(currentMonthStr());
  const [wardCode, setWardCode] = useState(null);
  const [unread, setUnread] = useState(0);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setAuth(res);
      setWardCode(res.profile ? res.profile.department_code : null);
      RazporedAuth.unreadNotificationCount(res.session.user.id).then(setUnread);
    });
  }, []);

  useEffect(() => {
    client.from("departments").select("code, name").order("code").then(({ data }) => setDepts(data || []));
  }, []);

  useEffect(() => {
    if ("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
    setShowInstall(false);
  };

  if (!auth) return null; // requireAuth preusmeri, če ni prijave

  const { session, profile } = auth;

  return (
    <div className="wrap">
      <header className="top">
        <div className="wordmark">
          <span className="mark">Razpored</span>
        </div>
        <p className="sub">{new Date(month+"-01").toLocaleDateString("sl-SI",{month:"long", year:"numeric"})} · Psihiatrična bolnišnica Begunje</p>
        <div className="whoRow no-print">
          <span className="who">Prijavljen: <b>{profile ? profile.full_name : session.user.email}</b></span>
          <div className="navLinks">
            <button className="navLink" onClick={() => RazporedAuth.signOut()}>Odjava</button>
          </div>
        </div>

        <div className="segmented no-print" role="tablist">
          <button role="tab" aria-selected={view==="my"} onClick={() => setView("my")}>Moj razpored</button>
          <button role="tab" aria-selected={view==="ward"} onClick={() => setView("ward")}>Po oddelkih</button>
        </div>

        {view==="ward" && (
          <div className="field no-print">
            <label htmlFor="wd">Oddelek</label>
            <select id="wd" value={wardCode || ""} onChange={e => setWardCode(e.target.value)}>
              <option value="" disabled>Izberi oddelek …</option>
              {depts.map(d => <option key={d.code} value={d.code}>{d.name}</option>)}
            </select>
          </div>
        )}
        <div className="field no-print">
          <label htmlFor="mm">Mesec</label>
          <input id="mm" type="month" value={month} onChange={e => setMonth(e.target.value)} />
        </div>
        <button className="pdfBtn no-print" onClick={() => window.print()}>📄 Izvozi v PDF</button>
      </header>

      {view==="my" && <MyScheduleView userId={session.user.id} month={month} />}
      {view==="ward" && wardCode && <WardView deptCode={wardCode} month={month} myId={session.user.id} />}
      {view==="ward" && !wardCode && <p className="sub" style={{marginTop:16}}>Izberi oddelek zgoraj.</p>}

      {showInstall && (
        <div className="installBar no-print">
          <div>
            <div className="t">Namesti na domači zaslon</div>
            <div className="s">Odpira se kot samostojna aplikacija, brez brskalnika.</div>
          </div>
          <button className="installBtn" onClick={install}>Namesti</button>
        </div>
      )}

      <footer className="foot">
        <p><b>Razpored PBB</b> — prijavljen dostop. Za spremembe ali zamenjave uporabi "Menjave" spodaj.</p>
        <p>Razpored temelji na osnovnem kalupu; dejanske spremembe (bolniška, odobrene menjave) se odražajo sproti. Preverite tudi na oglasni deski oddelka.</p>
      </footer>

      <RazporedNav active="index" role={profile ? profile.role : "user"} unread={unread} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
