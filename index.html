<!doctype html>
<html lang="sl">
<head>

<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  /* Stran-specifično za index.html: samo tisk v PDF na točno 1 stran
     (PrintFit.natisni izračuna --print-scale). Vse ostalo (barve,
     gumbi, kartice, tabela …) prihaja iz theme.css. */
  @media print{
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th{ background:#f2f2f2 !important; }
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important; }
    .wardPrintArea{ zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr{ break-inside:avoid; page-break-inside:avoid; }
    #printMy{ zoom: var(--print-scale, 1); }
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .wrap{ max-width:100% !important; }
  }

  /* "Moj razpored" na zaslonu ostane en stolpec pod drugim (nespremenjeno,
     ne glede na obračanje zaslona) - razred "pdfCols" se doda samo tik pred
     klicem PrintFit.natisni (glej App spodaj) in odstrani po tiskanju
     ("afterprint"), da so tedni v PDF izvozu razporejeni v več stolpcih in
     cel mesec pride na eno stran. Namenoma NI znotraj @media print zgoraj:
     PrintFit.natisni izmeri scrollHeight elementa PRED klicem window.print()
     (torej pred aktivacijo @media print), zato mora biti postavitev že
     spremenjena OB MERJENJU, ne šele med dejanskim tiskanjem. */
  #printMy.pdfCols .weeksGrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px; }

  /* "Po oddelkih" — tabela postavljena kot uradna predloga "2026 SMS
     RAZPORED": dnevi v vrsticah (stolpec "Dan" je zdaj samo datum, ne ime
     osebe), osebe v stolpcih glave. Vikend obarva celo vrstico (kot v
     predlogi), ne posamezne celice; lastni stolpec (bralec sam) je rahlo
     poudarjen. */
  /* Datum mora biti viden CEL ("1.8.2026 PO"). Splošno pravilo za td.name
     (theme.css) reže besedilo s "…", kar je pri 64 px pomenilo "1.8.20…". */
  table.wardTableT td.name, table.wardTableT th.name{
    width:88px; min-width:88px; text-align:center; white-space:nowrap;
    overflow:visible; text-overflow:clip;
  }
  /* FLEXI: kateri oddelek oseba ta dan pokriva (lahko dva, npr. "C/E2") -
     nad kodo izmene, v svoji vrstici, da se ne zamenja z izmeno. */
  .pokriva{
    display:block; font-size:9.5px; font-weight:800; letter-spacing:.03em;
    color: var(--accent-2); margin-bottom:1px;
  }
  table.wardTableT tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  table.wardTableT thead th.me{ background: rgba(var(--accent-rgb),.15); }

  /* Namizje (širši zaslon) IN ležeča postavitev telefona (manifest.json
     orientation zdaj "any", ne več zaklenjeno na pokončno) - na izrecno
     željo naj bo cela preglednica "Po oddelkih" prek celega zaslona in cel
     mesec viden brez vodoravnega drsenja: tabela dobi table-layout:fixed in
     polno širino namesto naravne širine na celico (isti vzorec kot mreža v
     zelje.html). Na ozkem pokončnem telefonu ostane naravna širina +
     vodoravno drsenje (fiksna postavitev bi tam stisnila stolpce oseb na
     neberljivo majhno). "Moj razpored" ostane nespremenjen ne glede na
     zaslon - glej "pdfCols" zgoraj za PDF izvoz. */
  @media (min-width:900px), (orientation: landscape){
    .wardScroller{ overflow-x:visible; }
    table.wardTableT{ width:100%; table-layout:fixed; }
    table.wardTableT th.name, table.wardTableT td.name{ width:88px; }
    table.wardTableT th:not(.name), table.wardTableT td:not(.name){ width:auto; min-width:0; }
    /* Cele kode izmen ("popoldan do 19", "NOČNA od 19") so predolge za
       enakomerno razdeljen stolpec pri table-layout:fixed - privzeti
       white-space:nowrap (theme.css) bi jih pustil vizualno preliti čez
       sosednje celice. Raje se prelomijo v dve vrstici znotraj SVOJEGA
       stolpca. */
    table.wardTableT td:not(.name){ white-space:normal; }
  }
  @media (min-width:900px){
  }
  /* "Širši prikaz" mora DEJANSKO zavrteti zaslon (ne samo prilepiti široko
     tabelo na ozek pokončni zaslon - to bi tabelo samo stisnilo, ne
     razširilo, kar se je zgodilo pri prvem poskusu, glej posnetek
     zaslona uporabnika). Zato na ozkem pokončnem zaslonu CELO stran
     (body) vizualno zavrtimo za 90° - klasičen "prisilno ležeče" trik za
     telefone s samodejnim obračanjem, izklopljenim v nastavitvah
     Androida. width/height sta zamenjana (100vh/100vw), da telefon
     DEJANSKO dobi širino svoje višine (~700-900px), ne samo CSS namig na
     nespremenjeni ozki širini. transform na body ustvari nov "containing
     block" tudi za position:fixed elemente znotraj njega (vrstica ikon,
     spodnji meni), zato se zavrtijo skupaj z ostalo vsebino. Na napravi,
     ki je JE dejansko ležeča (ali širši zaslon), se ta blok sploh ne
     uporabi (orientation:portrait pogoj) - gumb tam ni potreben, a ostane
     brez učinka, če bi ga kdo vseeno kliknil. */
  @media (orientation: portrait){
    html.sirsiPogled body{
      position: fixed;
      top: 0; left: 0;
      width: 100vh;
      height: 100vw;
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
  }
  /* Ista postavitev kot zgoraj, a NA ZAHTEVO prek gumba "Širši prikaz"
     (glej WideToggle v App), namesto da bi bila odvisna od tega, ali
     naprava DEJANSKO javi ležečo orientacijo - telefon s samodejnim
     obračanjem, izklopljenim v nastavitvah Androida, orientation:landscape
     nikoli ne sproži, ne glede na to, kako ga uporabnik drži. */
  html.sirsiPogled .wardScroller{ overflow-x:visible; }
  html.sirsiPogled table.wardTableT{ width:100%; table-layout:fixed; }
  html.sirsiPogled table.wardTableT th.name, html.sirsiPogled table.wardTableT td.name{ width:88px; }
  html.sirsiPogled table.wardTableT th:not(.name), html.sirsiPogled table.wardTableT td:not(.name){ width:auto; min-width:0; }
  html.sirsiPogled table.wardTableT td:not(.name){ white-space:normal; }

  /* NZV — dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe), po
     uradni predlogi "Letni dopusti in omejitve za NZV". Manjše pisave, ker
     je stolpcev veliko (17 enot + Dežurstvo); celica prikaže polno ime
     osebe, ki to enoto ta dan pokriva (ne ročno kodirane kratice iz
     predloge - zanesljive samodejne kratice iz "full_name" niso izvedljive
     brez ločenega polja za priimek). */
  table.wardTableNzv th, table.wardTableNzv td{ font-size:10.5px; padding:5px 3px; }
  table.wardTableNzv td.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; font-size:11px; }
  table.wardTableNzv td.enotaCell{ text-align:center; white-space:normal; word-break:break-word; }
  /* Izpeljana (ne objavljena) zasedba enote - stalni nosilec oz. njegov
     nadomeščevalec. Bledeje, da se na prvi pogled loči od objavljenega
     razporeda; glej nalozizPodatkeNzv. */
  table.wardTableNzv td.enotaCell.izpeljano{ opacity:.62; font-style:italic; }
  /* Vrstica z nastavitvijo izmenične zasedbe SA (samo administrator).
     Nad mrežo, ker je učinek takoj viden v stolpcih SA DOP/SA POP. */
  .saNastavitve{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin:0 0 10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:var(--radius-sm); background:var(--surface-2);
    color:var(--text); font-size:13px;
  }
  .saNastavitve select, .saNastavitve input{
    padding:4px 6px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font:inherit;
  }
  .saNastavitve .napaka{ color:var(--danger); flex-basis:100%; }
  @media print{ .saNastavitve{ display:none; } }
  table.wardTableNzv th.dez, table.wardTableNzv td.dez{ background: rgba(179,64,42,.07); font-weight:700; }
  table.wardTableNzv tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  @media (min-width:900px), (orientation: landscape){
    table.wardTableNzv{ width:100%; table-layout:fixed; }
    table.wardTableNzv td.name{ width:60px; }
    table.wardTableNzv th:not(.name):not(.dez), table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
    table.wardTableNzv th.dez, table.wardTableNzv td.dez{ width:90px; }
  }
  html.sirsiPogled table.wardTableNzv{ width:100%; table-layout:fixed; }
  html.sirsiPogled table.wardTableNzv td.name{ width:60px; }
  html.sirsiPogled table.wardTableNzv th:not(.name):not(.dez), html.sirsiPogled table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
  html.sirsiPogled table.wardTableNzv th.dez, html.sirsiPogled table.wardTableNzv td.dez{ width:90px; }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const { client } = RazporedAuth;

const DAN_IME = { PO:"ponedeljek", TO:"torek", SR:"sreda", ČE:"četrtek", PE:"petek", SO:"sobota", NE:"nedelja" };
const DNI = ["PO","TO","SR","ČE","PE","SO","NE"];
const MESECI = ["Januar","Februar","Marec","April","Maj","Junij","Julij","Avgust","September","Oktober","November","December"];

// Datum kot v uradnih predlogah ("1. 9. 2026", brez vodilnih ničel) namesto
// ISO - samo za PRIKAZ/izvoz na tej strani; interno (poizvedbe, ključi) se
// še vedno povsod uporablja ISO "YYYY-MM-DD".
// Ena sama oblika datuma za vso aplikacijo - glej datum.js.
function datumSlo(iso){ return window.Datum.slo(iso); }

// Kratko ime za prikaz na "Po oddelkih" (samo TA stran - full_name se nikjer
// drugje v aplikaciji ne skrajša), po vzoru uradne predloge "2026 SMS
// RAZPORED" ("DŽINIĆ A."): PRIIMEK (lahko iz več besed, npr. "Mavri
// Tratnik") + presledek + prva črka IMENA (zadnja beseda) + piko. full_name
// je v aplikaciji dosledno shranjen kot "Priimek Ime" (glej npr.
// DEZURNI_OSNOVA_DO_31_8_2026 v admin.html).
function priimekZacetnica(fullName){
  const deli = (fullName || "").trim().split(/\s+/);
  if (deli.length < 2) return (fullName || "").toUpperCase();
  const ime = deli[deli.length - 1];
  const priimek = deli.slice(0, -1).join(" ");
  return `${priimek} ${ime[0]}.`.toUpperCase();
}

// Parafa za NZV celice (po vzoru "Letni dopusti in omejitve za NZV" -
// "BOJ", "DŽA" ipd.) - uporabi ročno nastavljeno profiles.parafa (Imenik),
// sicer groba samodejna privzeta vrednost (prve 3 črke priimka), ki jo
// admin lahko ročno popravi, če se dve osebi ujemata.
// PREDPOSTAVKA: full_name je zapisan kot "Priimek Ime" (tako je povsod v
// aplikaciji), zato je priimek VSE RAZEN zadnje besede — s tem so zajeti
// tudi dvobesedni priimki ("Mavri Tratnik Magdalena" -> "MAV"). Dokler so
// bili nekateri zapisani obratno, je ta funkcija zanje vračala prve tri
// črke OSEBNEGA imena ("Aldin Gazibara" -> "ALD" namesto "GAZ").
// Logika paraf je v skupni parafa.js (edini vir resnice) - isto preslikavo
// oznaka → OSEBA potrebuje tudi Imenik (pregled paraf), podvojena pa bi
// bila nevarna: tiho razhajanje med kopijama bi pomenilo izmeno, pripisano
// napačnemu človeku. Tu ostaneta samo imeni, ki ju uporablja preostala koda
// te strani.
const PARAFA_PRESTOP = window.Parafa.PRESTOP;
function autoParafa(fullName){ return window.Parafa.auto(fullName); }
function parafaOd(profil, datum){ return window.Parafa.zaDatum(profil, datum); }
// Prikaz ur izmene pride iz skupnega delovni-cas.js (edini vir resnice) —
// prej je bila ista tabela zapisana še enkrat tu in še enkrat v admin.html.
const DELOVNI_ČAS = Object.fromEntries(
  Object.entries(window.DelovniCas.IZMENE)
    .filter(([, v]) => v.ure != null) // brez dežurstva: ure so odvisne od dneva v tednu
    .map(([k, v]) => [k, v.zacetek.replace(":", ".") + "\u2013" + v.konec.replace(":", ".")])
);
DELOVNI_ČAS["KPU"] = "koriščenje prostih ur";
DELOVNI_ČAS["LD"] = "letni dopust";

function classify(sifra){
  // Brez presledkov: iz Sheets pride tudi "DNEVNA 12F" ali "NOČNA 12".
  const t = (sifra || "").toLowerCase().replace(/\s+/g, "");
  if (t.startsWith("dežurstvo") || t.startsWith("dezurstvo")) return "dez";
  if (t.startsWith("ld")) return "ld"; // letni dopust - lastna (zelena) barva, ločeno od KPU/prostega (sivo)
  if (t.startsWith("kpu")) return "off";
  if (t.startsWith("prisoten")) return "dop"; // pogled "Vodje" - na svojem oddelku (ni odsoten)
  if (t.includes("nočna12")) return "h12";
  if (t.includes("dnevna12")) return "h12";
  if (t.startsWith("nočna")) return "noc";
  if (t.startsWith("dopoldan")) return "dop";
  if (t.startsWith("popoldan")) return "pop";
  return "off";
}
// LD je bil doslej "#2F6B4A" - temno zelena, skoraj neločljiva od dop
// ("#4F9B6B", ki ga dobi tudi PRISOTEN) pri 15% prosojnem ozadju v vrstici
// dneva. Zdaj rdeča "#E06666", enako kot letni dopust v uradnih preglednicah
// bolnišnice in v Želje → Razpredelnica (--ld) - torej barva, ki jo kader že
// pozna. Dežurstvo ostane svoja, temnejša opekasta rdeča IN se izriše polno
// zapolnjeno (glej dayRow spodaj), da se od LD loči tudi po teži, ne le
// odtenku.
const BARVE = { dop:"#4F9B6B", pop:"#C9713F", noc:"#4A67B0", h12:"#8560A8", off:"#8B8672", ld:"#E06666", dez:"#B3402A" };

function shiftLabel(sifra){
  if (!sifra) return "Prosto";
  return sifra;
}

// ---------------------------------------------------------------------
// Izvoz osebnega razporeda v .ics (iCal) - za sinhronizacijo z osebnim
// koledarjem na telefonu (Google Calendar, Apple Calendar …). Deluje
// izključno lokalno v brskalniku (generira in prenese datoteko, brez
// zunanje storitve/računa) - odpre se z gumbom "Uvozi" v koledarski
// aplikaciji uporabnika, ni žive dvosmerne sinhronizacije.
// ---------------------------------------------------------------------
function parsirajUrniObseg(niz){
  // "05.50–14.00" -> { start:"05:50", end:"14:00", cezPolnoc:false }
  if (!niz || !niz.includes("–")) return null;
  const [s, e] = niz.split("–").map(x => x.trim().replace(".", ":"));
  if (!/^\d{2}:\d{2}$/.test(s) || !/^\d{2}:\d{2}$/.test(e)) return null;
  return { start: s, end: e, cezPolnoc: e < s };
}
function icsDatumUra(iso, hhmm){
  return iso.replace(/-/g, "") + "T" + hhmm.replace(":", "") + "00";
}
function dodajDni(iso, n){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function icsPobegni(besedilo){
  return String(besedilo || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
}
function ustvariICS(dnevi, byDate){
  const zdaj = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const dogodki = [];
  dnevi.forEach(dn => {
    const sifra = byDate[dn.datum];
    if (!sifra) return; // prost dan - ni dogodka
    const obseg = parsirajUrniObseg(DELOVNI_ČAS[sifra]);
    const uid = "razpored-pbb-" + dn.datum + "-" + Math.random().toString(36).slice(2, 8) + "@razpored.netlify.app";
    if (obseg) {
      const konecDatum = obseg.cezPolnoc ? dodajDni(dn.datum, 1) : dn.datum;
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART:" + icsDatumUra(dn.datum, obseg.start),
        "DTEND:" + icsDatumUra(konecDatum, obseg.end),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    } else {
      // LD/KPU/DEŽURSTVO/neznana koda - brez natančnih ur, celodnevni dogodek
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART;VALUE=DATE:" + dn.datum.replace(/-/g, ""),
        "DTEND;VALUE=DATE:" + dodajDni(dn.datum, 1).replace(/-/g, ""),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    }
  });
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Razpored PBB//SL", "CALSCALE:GREGORIAN",
    ...dogodki, "END:VCALENDAR",
  ].join("\r\n");
}
function prenesiICS(vsebina, ime){
  const blob = new Blob([vsebina], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = ime; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthRange(monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { startISO:start, endISO:end };
}
function daysInRange(startISO, endISO){
  const out = [];
  let d = new Date(startISO + "T00:00:00");
  const end = new Date(endISO + "T00:00:00");
  while (d.getTime() <= end.getTime()){
    const wd = (d.getDay() + 6) % 7; // 0=PO..6=NE
    const p = n => String(n).padStart(2,"0");
    out.push({ datum: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, dan: DNI[wd] });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

// Delovnik NZV (vodje/administratorji) — pravilo, ki ga je uporabnik
// večkrat izrecno ponovil in ga prikaz doslej ni upošteval:
//
//   * redni delovnik je od PONEDELJKA DO PETKA;
//   * SOBOTA in NEDELJA sta PROSTI - razen če je tisti dan dežurstvo;
//   * letni dopust (LD) velja samo za delovne dni; vikend sredi dopusta
//     ni "dopust", ampak navaden prost dan;
//   * dežurstvo med tednom se opravlja PO redni prisotnosti (15:30-07:00,
//     glej delovni-cas.js), zato tak dan pomeni oboje: "PRISOTEN +
//     DEŽURSTVO". Vikend dežurstvo traja 07:00-07:00 in redne prisotnosti
//     ob njem ni, zato ostane samo "DEŽURSTVO".
//
// Zakaj je to prikazno pravilo in ne popravek podatkov: schedule_entries
// ima na (employee_id, work_date) en sam zapis, zato prisotnost in
// dežurstvo istega dne ne moreta obstajati kot dve vrstici - ob uvozu
// zadnji prepiše prejšnjega. Ker je "med tednom dežuren" po definiciji
// tudi "med tednom prisoten", je oboje mogoče pravilno izpeljati iz enega
// zapisa, brez spremembe sheme.
//
// Velja SAMO za NZV: oddelčni kader (B/C/C1/D/E1/E2/FLEXI) vikende dela
// normalno in ima prave kode izmen (dopoldan, NOČNA12 …), ki se jih to
// pravilo ne sme dotakniti.
// "datum" je neobvezen; kadar je podan, se poleg sobote/nedelje upošteva
// tudi dela prost PRAZNIK (uporabnikova izrecna dopolnitev pravila).
function nzvPrikaz(sifra, danKratica, jeNzv, datum){
  const vikend = danKratica === "SO" || danKratica === "NE"
    || (datum ? window.Prazniki.jePraznik(datum) : false);
  const jeDezurstvo = classify(sifra) === "dez";
  if (jeDezurstvo) return vikend ? "DEŽURSTVO" : "PRISOTEN + DEŽURSTVO";
  if (!jeNzv || !vikend) return sifra;
  return ""; // NZV vikend brez dežurstva: prosto (tudi sredi letnega dopusta)
}

// Zdravniki posameznega dne, pripravljeni za izpis. Uradni dokument ima
// dva stolpca in isti dan sta lahko zasedena z različnima zdravnikoma, zato
// se izpišeta oba, vsak s svojo kratico ("DEŽ" = Dežurstvo ZDR, "URG" =
// Urgenca ZDR). Dežurstvo gre prvo, ker je za dežurno medicinsko sestro
// najbolj neposredno relevantno.
function zdravnikiZaDan(zapis){
  if (!zapis) return [];
  const out = [];
  if (zapis.dezurstvo) out.push({ oznaka: "DEŽ", ime: zapis.dezurstvo });
  if (zapis.urgenca) out.push({ oznaka: "URG", ime: zapis.urgenca });
  return out;
}

// Zakaj imena dežurnega zdravnika ni - kot besedilo, ki ga vidi uporabnik.
// Vrne null, kadar opozorila NI treba prikazati.
//
// Brez tega je odpoved TIHA: če tabele duty_doctors ni (shema še ni
// pognana) ali za mesec ni naloženega PDF-ja, poizvedba ne vrne nič in
// poleg DEŽURSTVA se preprosto ne izpiše nič - uporabnik nima načina
// izvedeti, zakaj. Isti razred napake kot prazna NZV mreža ob dvoumnem
// PostgREST joinu.
//
// Opozorilo se prikaže SAMO, kadar ima oseba ta mesec res kakšno
// dežurstvo - sicer bi ga videli vsi, tudi tisti, ki jih zdravniki sploh
// ne zadevajo.
function zdravnikiOpozoriloBesedilo(imamDezurstvo, stanje){
  if (!imamDezurstvo) return null;
  if (stanje === "nalagam" || stanje === "ok") return null;
  if (stanje === "ni-tabele") {
    return "Imena dežurnega zdravnika še ni mogoče prikazati: v bazi manjka tabela dežurnih zdravnikov. " +
      "Administrator naj v Supabase (SQL Editor) požene supabase/schema.sql - razdelek 32.";
  }
  return "Za ta mesec ni naloženega razporeda dežurnih zdravnikov. Administrator ga naloži z ikono 📥 " +
    "zgoraj desno → »🩺 Naloži dežurstvo zdravnikov (PDF)« - uradni mesečni dokument " +
    "»Razporeditev zaposlenih v UA in DEŽ«.";
}

function MyScheduleView({ userId, month, jeNzv }){
  const [entries, setEntries] = useState(null);
  const [dopustiLD, setDopustiLD] = useState([]); // datumi (ISO), ko je oseba na LD po leave_entries
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEntries(null);
    client.from("schedule_entries").select("work_date, shift_code")
      .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  // LD (letni dopust) je za marsikoga vpisan samo v Želje → Razpredelnica
  // (leave_entries), ne v schedule_entries (za NZV/vodje objavljen razpored
  // ne piše po osebi kot pri SMS oddelkih, glej nalozizPodatkeNzv zgoraj) -
  // brez tega je "Moj razpored" za te osebe kazal dopust kot navaden prost
  // dan. Dopolnimo SAMO dneve, ki v schedule_entries še nimajo vrednosti
  // (glej byDate spodaj) - objavljene izmene se nikoli ne prepišejo.
  useEffect(() => {
    let cancelled = false;
    setDopustiLD([]);
    client.from("profiles").select("full_name").eq("id", userId).maybeSingle().then(({ data: profil }) => {
      if (cancelled || !profil) return Promise.resolve();
      return client.from("leave_entries").select("full_name, work_date")
        .eq("kind", "ld").gte("work_date", startISO).lte("work_date", endISO)
        .then(({ data }) => {
          if (cancelled) return;
          setDopustiLD((data || []).filter(d => imenaSeUjemataNzv(d.full_name, profil.full_name)).map(d => d.work_date));
        });
    });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  // Dežurni zdravniki (duty_doctors, glej uvoziZdravnike) - samo za prikaz
  // poleg DEŽURSTVA, niso vezani na osebo/employee_id (zdravniki nimajo
  // profila). Uradni dokument ima DVA ločena stolpca - "Urgenca ZDR" in
  // "Dežurstvo ZDR" - in isti dan sta lahko zasedena z RAZLIČNIMA
  // zdravnikoma. Prej se je izpisal samo eden (prednost "Dežurstvo ZDR"),
  // kar je za nekoga, ki je tisto noč dežuren, premalo: sodeluje z obema.
  // Zato hranimo oba, ključ je datum -> { dezurstvo, urgenca }.
  const [zdravnikiPoDatumu, setZdravnikiPoDatumu] = useState({});
  // Če te poizvedbe ni mogoče izvesti (tabela še ne obstaja) ali za mesec
  // ni podatkov, se je to doslej TIHO požrlo in ime zdravnika se preprosto
  // ni izpisalo - uporabnik ni imel načina izvedeti, zakaj. Stanje zato
  // hranimo in ga spodaj pojasnimo (ista past kot pri prazni NZV mreži).
  const [zdravnikiStanje, setZdravnikiStanje] = useState("nalagam"); // "nalagam" | "ok" | "ni-tabele" | "prazno"
  useEffect(() => {
    let cancelled = false;
    setZdravnikiPoDatumu({});
    setZdravnikiStanje("nalagam");
    client.from("duty_doctors").select("work_date, kind, full_name")
      .gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) {
          // 42P01 = relacija ne obstaja (shema še ni pognana).
          const manjkaTabela = error.code === "42P01" || /does not exist|schema cache/i.test(error.message || "");
          setZdravnikiStanje(manjkaTabela ? "ni-tabele" : "prazno");
          return;
        }
        const m = {};
        (data || []).forEach(r => {
          if (!r.full_name) return;
          if (!m[r.work_date]) m[r.work_date] = {};
          m[r.work_date][r.kind] = r.full_name;
        });
        setZdravnikiPoDatumu(m);
        setZdravnikiStanje(Object.keys(m).length ? "ok" : "prazno");
      });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  // Stalna zasedba nosilca enote: za vodje se dnevni razpored ne objavlja,
  // zato je "Moj razpored" tem osebam kazal prazne delovne dneve - isti
  // manjko kot v NZV mreži in v Imenik -> Razpredelnici. Pravilo je v
  // nzv-zasedba.js (en sam vir); tu preberemo samo SVOJ zapis nosilca.
  const [mojNosilec, setMojNosilec] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setMojNosilec(null);
    if (!jeNzv) return;
    client.from("profiles").select("full_name").eq("id", userId).maybeSingle().then(({ data: profil }) => {
      if (cancelled || !profil) return;
      return client.from("lead_departments").select("full_name, enote, odsotnost_tip, odsotnost_do")
        .then(({ data }) => {
          if (cancelled) return;
          const moj = (data || []).find(n => n.enote && imenaSeUjemataNzv(n.full_name, profil.full_name));
          setMojNosilec(moj || null);
        });
    });
    return () => { cancelled = true; };
  }, [userId, jeNzv]);

  const byDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.work_date] = e.shift_code; });
    dopustiLD.forEach(datum => { if (!m[datum]) m[datum] = "LD"; });
    // Izpeljana prisotnost zapolni samo prazne delovne dneve - objavljena
    // izmena, dežurstvo in dopust imajo vedno prednost.
    window.NzvZasedba.stalnaZasedba(mojNosilec, days.map(dn => dn.datum), d => !!m[d])
      .forEach(x => { m[x.datum] = x.sifra; });
    return m;
  }, [entries, dopustiLD, mojNosilec, days]);

  const iso = todayISO();
  const todayDan = (days.find(d => d.datum === iso) || {}).dan;
  const todaySifra = byDate[iso];
  const todayPrikaz = nzvPrikaz(todaySifra, todayDan, jeNzv, iso);
  const todayCls = classify(todayPrikaz === "" ? "" : todaySifra);

  const tedni = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach(dn => {
      if (dn.dan === "PO" || !cur){ cur = []; out.push(cur); }
      cur.push(dn);
    });
    return out;
  }, [days]);

  // Ime dežurnega zdravnika se izpiše samo ob dnevih z dežurstvom. Če ima
  // uporabnik ta mesec dežurstvo, imena pa ni nikjer, je to okvara, ki jo
  // je treba POJASNITI - drugače izgleda, kot da aplikacija ne dela.
  const imamDezurstvo = useMemo(
    () => days.some(dn => classify(byDate[dn.datum]) === "dez"),
    [days, byDate]
  );
  const zdravnikiOpozorilo = zdravnikiOpozoriloBesedilo(imamDezurstvo, zdravnikiStanje);

  if (entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div id="printMy">
      {startISO <= iso && iso <= endISO && (
        <div className="todayCard">
          <div className="lbl">Danes · {window.Datum.slo(iso)}</div>
          <div className="shift">
            <span className="dot" style={{background: BARVE[todayCls]}}></span>
            <div>
              <div className="shiftName">{shiftLabel(todayPrikaz)}</div>
              <div className="shiftTime">{DELOVNI_ČAS[todaySifra] || ""}</div>
              {todayCls === "dez" && zdravnikiZaDan(zdravnikiPoDatumu[iso]).map(z => (
                <div key={z.oznaka} className="shiftTime">🩺 {z.oznaka}: {z.ime}</div>
              ))}
            </div>
          </div>
        </div>
      )}

      {zdravnikiOpozorilo && (
        <div className="warnBox">🩺 {zdravnikiOpozorilo}</div>
      )}

      <div className="weeksGrid">
        {tedni.map((teden, i) => (
          <div key={i}>
            <div className="weekLabel">Teden {i+1}</div>
            {teden.map(dn => {
              const sifra = byDate[dn.datum];
              // Barva se vedno računa iz IZVIRNE kode (npr. "PRISOTEN +
              // DEŽURSTVO" se mora obarvati kot dežurstvo, ne kot prisotnost),
              // besedilo pa iz pravila NZV delovnika.
              const prikaz = nzvPrikaz(sifra, dn.dan, jeNzv, dn.datum);
              const cls = classify(prikaz === "" ? "" : sifra);
              const isToday = dn.datum === iso;
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              const d = new Date(dn.datum + "T00:00:00");
              return (
                <div key={dn.datum} className={"dayRow" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "")}>
                  <div className="dnum">
                    <div className="n">{d.getDate()}</div>
                    <div className="d">{dn.dan}</div>
                  </div>
                  {/* Dežurstvo je edina izmena, ki se izriše POLNO zapolnjeno
                      (bela pisava na opekasti podlagi) - tako se na prvi
                      pogled loči od letnega dopusta, ki je prav tako rdečkast,
                      a le rahlo obarvan. Ostale izmene ostanejo lahke
                      (15% podlaga + obroba v svoji barvi). */}
                  <div className={"chip" + (cls==="off" ? " off" : "") + (cls==="dez" ? " polna" : "")}
                    style={{
                      background: cls==="dez" ? BARVE.dez : (cls==="off" ? "transparent" : BARVE[cls] + "26"),
                      border: "1px solid " + (cls==="off" ? "var(--line)" : BARVE[cls]),
                      color: cls==="dez" ? "#fff" : undefined,
                    }}>
                    <span className="dot" style={{background: cls==="dez" ? "#fff" : BARVE[cls]}}></span>
                    <span style={{minWidth:0, overflow:"hidden"}}>
                      <span className="txt">{shiftLabel(prikaz)}</span>
                      {cls === "dez" && zdravnikiZaDan(zdravnikiPoDatumu[dn.datum]).map(z => (
                        <span key={z.oznaka} className="txt" style={{display:"block", fontSize:11, fontWeight:400, opacity:0.9, lineHeight:1.4}}>
                          🩺 {z.oznaka}: {z.ime}
                        </span>
                      ))}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// Skupen "podpisni" blok pod tabelo na "Po oddelkih" - po vzoru uradnih
// predlog (Datum objave + Zadnja sprememba + Pripravil/-a + Pregledal in
// odobril, vsi RESNIČNI, ne pogojno prikazani). "Datum objave"/"Pripravil"
// izhajata iz created_at/created_by NAJSTAREJŠEGA zapisa v mesecu (kdo je
// razpored prvič objavil); "Zadnja sprememba" iz max(updated_at); oboje
// samodejno vzdržuje schedule_entries_touch() sprožilec (schema.sql sekcija
// 25) - velja za VSE poti pisanja (generator v admin.html, ta uvoz), ne
// samo za novo kodo. "Pregledal in odobril" = koordinator (profiles.
// is_koordinator). Naziv za podpis (job_title) je admin-urejljiv v Imeniku.
function RazporedPodpisi({ entries }){
  const [koordinator, setKoordinator] = useState(null);
  const [pripravil, setPripravil] = useState(null);

  useEffect(() => {
    let cancelled = false;
    client.from("profiles").select("full_name, job_title").eq("is_koordinator", true).limit(1).maybeSingle()
      .then(({ data }) => { if (!cancelled) setKoordinator(data || null); });
    return () => { cancelled = true; };
  }, []);

  const objava = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((min, e) => (e.created_at && (!min || e.created_at < min.created_at)) ? e : min, null);
  }, [entries]);

  const zadnja = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((max, e) => (e.updated_at && (!max || e.updated_at > max)) ? e.updated_at : max, null);
  }, [entries]);

  const pripravilId = objava ? objava.created_by : null;
  useEffect(() => {
    let cancelled = false;
    if (!pripravilId) { setPripravil(null); return; }
    client.from("profiles").select("full_name, job_title").eq("id", pripravilId).maybeSingle()
      .then(({ data }) => { if (!cancelled) setPripravil(data || null); });
    return () => { cancelled = true; };
  }, [pripravilId]);

  const oblikujDatum = (iso) => iso
    ? new Date(iso).toLocaleString("sl-SI", {day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit"})
    : "ni podatka";

  return (
    <div className="card" style={{marginTop:10, fontSize:13}}>
      <p style={{margin:"0 0 6px"}}><b>Datum objave razporeda:</b> {oblikujDatum(objava && objava.created_at)}</p>
      <p style={{margin:"0 0 6px"}}><b>Zadnja sprememba v razporedu:</b> {oblikujDatum(zadnja)}</p>
      {pripravil && (
        <p style={{margin:"0 0 6px"}}><b>Pripravil/-a:</b> {pripravil.full_name}{pripravil.job_title ? ", " + pripravil.job_title : ""}</p>
      )}
      {koordinator && (
        <p style={{margin:0}}><b>Pregledal in odobril:</b> {koordinator.full_name}{koordinator.job_title ? ", " + koordinator.job_title : ""}</p>
      )}
    </div>
  );
}

// "Menjave v tem mesecu" POD mesečnim razporedom (samo admin) - doslej so
// bile menjave vidne izključno na ločeni strani "Menjava", ne pa ob
// razporedu, ki ga koordinator dejansko pregleduje. Ista poizvedba kot
// MenjaveMeseca v obrazec.html (obrazci, vrsta "menjava_sluzbe", brez
// osnutkov), le da je filtrirana na PRIKAZANI mesec (ne na tekoči).
//
// POMEMBNO: ko koordinator menjavo potrdi, se izmeni v schedule_entries
// zamenjata SAMODEJNO (obrazec_potrdi_koordinator, schema.sql sekcija 22) -
// ta seznam je torej pregled/revizija ("kdo je zamenjal s kom"), ne korak,
// ki bi ga bilo treba ročno prenesti v razpored. Zato je tudi tik pod
// tabelo: razpored zgoraj že vsebuje učinek teh menjav.
const MENJAVA_STATUS_NAZIV = {
  caka_sodelavca: "čaka sodelavca",
  caka_vodjo: "čaka vodjo",
  caka_koordinatorja: "čaka koordinatorja",
  zakljucen: "potrjeno",
  zavrnjen: "zavrnjeno",
  preklican: "preklicano",
};
function menjavaPillRazred(status){
  if (status === "zakljucen") return "pill ok";
  if (status === "zavrnjen" || status === "preklican") return "pill danger";
  return "pill warn"; // vse "caka_*" stopnje
}
function MenjaveVMesecu({ month }){
  const [vrstice, setVrstice] = useState(null);
  const { startISO, endISO } = monthRange(month);

  useEffect(() => {
    let cancelled = false;
    setVrstice(null);
    client.from("obrazci")
      .select("id, status, je_dezurstvo, polja, vlagatelj:profiles!obrazci_vlagatelj_id_fkey(full_name), sodelavec:profiles!obrazci_sodelavec_id_fkey(full_name)")
      .eq("vrsta", "menjava_sluzbe").neq("status", "osnutek")
      .filter("polja->>datum_a", "gte", startISO).filter("polja->>datum_a", "lte", endISO)
      .order("ustvarjen", { ascending: false })
      .then(({ data }) => { if (!cancelled) setVrstice(data || []); });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  const dan = (iso) => window.Datum.slo(iso) || "—";

  return (
    <div className="no-print" style={{marginTop:24}}>
      <h2 className="section">Menjave v tem mesecu</h2>
      <p className="hint" style={{marginTop:0}}>
        Potrjena menjava je v razporedu zgoraj že upoštevana — izmeni se zamenjata samodejno ob potrditvi koordinatorja.
      </p>
      {vrstice === null && <p className="sub">Nalagam …</p>}
      {vrstice !== null && vrstice.length === 0 && <p className="sub">V tem mesecu ni nobene menjave.</p>}
      {vrstice !== null && vrstice.length > 0 && (
        <div className="card" style={{padding:0}}>
          {vrstice.map(r => {
            const p = r.polja || {};
            return (
              <div key={r.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between",
                gap:12, padding:"10px 14px", borderBottom:"1px solid var(--line)"}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700, fontSize:14}}>
                    {r.vlagatelj ? r.vlagatelj.full_name : "?"} ↔ {r.sodelavec ? r.sodelavec.full_name : "?"}
                    {r.je_dezurstvo && <span className="pill muted" style={{marginLeft:6}}>dežurstvo</span>}
                  </div>
                  <div style={{fontSize:12, color:"var(--muted)", marginTop:2}}>
                    {dan(p.datum_a)} ⇄ {dan(p.datum_b)}
                  </div>
                </div>
                <span className={menjavaPillRazred(r.status)}>{MENJAVA_STATUS_NAZIV[r.status] || r.status}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function WardView({ deptCode, month, myId }){
  const [employees, setEmployees] = useState(null);
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEmployees(null); setEntries(null);
    client.from("profiles").select("id, full_name, role").eq("department_code", deptCode).order("full_name")
      .then(({ data }) => {
        if (cancelled) return;
        const osebe = data || [];
        setEmployees(osebe);
        if (!osebe.length) { setEntries([]); return; }
        // Vpisi se berejo po OSEBAH, ne po department_code vpisa.
        //
        // Prej je poizvedba iskala vpise z department_code = ta oddelek.
        // Posledica: kdor je v Imeniku v FLEXI, njegove izmene pa so bile
        // uvožene iz oddelčnega zavihka (Jereb S. iz zavihka C, Kogoj E.,
        // Vozel N. …), je imel v mreži FLEXI PRAZEN stolpec - podatek je
        // obstajal, le poizvedba ga ni videla. Enako bi se zgodilo vsakomur,
        // ki kak dan dela na drugem oddelku.
        //
        // Kje oseba tisti dan dejansko dela, se izpiše nad izmeno (glej
        // "pokriva" v celici spodaj).
        client.from("schedule_entries")
          .select("employee_id, work_date, shift_code, department_code, pokriva_oddelek, created_at, created_by, updated_at")
          .in("employee_id", osebe.map(o => o.id))
          .gte("work_date", startISO).lte("work_date", endISO)
          .then(({ data: vpisi }) => { if (!cancelled) setEntries(vpisi || []); });
      });
    return () => { cancelled = true; };
  }, [deptCode, startISO, endISO]);

  const byEmpDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.employee_id + "|" + e.work_date] = e; });
    return m;
  }, [entries]);

  if (employees === null || entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;
  if (employees.length === 0) return <p className="sub" style={{marginTop:16}}>Za ta oddelek še ni dodeljenih zaposlenih.</p>;

  // Dnevi v vrsticah, osebe v stolpcih - kot uradna predloga "2026 SMS
  // RAZPORED" (posneta iz posnetkov zaslona uporabnika), ne osebe v
  // vrsticah/dnevi v stolpcih kot prej. Z realnim mesecem (do 31 vrstic) je
  // to tudi lažje pregledati na enem zaslonu kot 31 stolpcev. Druga vrstica
  // glave (vloga SMS/TZN ali DMS/DZN) je po vzoru iste predloge.
  return (
    <div className="wardPrintArea">
      <div className="wardScroller">
        <table className="wardTable wardTableT">
          <thead>
            <tr>
              <th className="name">Dan</th>
              {employees.map(z => (
                <th key={z.id} className={z.id === myId ? "me" : ""}>
                  <a href={"imenik.html?id=" + z.id} style={{color:"inherit", textDecoration:"none"}}>{priimekZacetnica(z.full_name)}</a>
                </th>
              ))}
            </tr>
            <tr className="vloga">
              <th className="name"></th>
              {employees.map(z => (
                <th key={z.id} className={z.id === myId ? "me" : ""}>{z.role === "user" ? "SMS / TZN" : "DMS / DZN"}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={isWeekend ? "weekend" : ""}>
                  <td className="name">{datumSlo(dn.datum)} {dn.dan}</td>
                  {employees.map(z => {
                    const zapis = byEmpDate[z.id + "|" + dn.datum];
                    const sifra = zapis && zapis.shift_code;
                    // FLEXI kader pokriva vsak dan lahko drug oddelek (tudi
                    // dva hkrati, npr. "C/E2") - brez te oznake bi bila
                    // celica videti kot navadna izmena in ne bi bilo
                    // razvidno, KJE ta dan dela.
                    // Oznaka nad izmeno: kateri oddelek oseba TA DAN pokriva.
                    // Pri FLEXI pride iz pokriva_oddelek (lahko dvojna oznaka
                    // "C/E2"), sicer pa iz oddelka vpisa - a le, kadar se
                    // razlikuje od oddelka, ki ga gledamo, da se navadni
                    // stolpci ne zasujejo z odvečno oznako.
                    const pokriva = zapis && (zapis.pokriva_oddelek
                      || (zapis.department_code !== deptCode ? zapis.department_code : null));
                    const cls = classify(sifra);
                    const isMe = z.id === myId;
                    return (
                      <td key={z.id} className={"cell" + (isMe ? " me" : "")}>
                        {/* Prej je bilo tu vedno kvečjemu 3 znake ("dop", "NOČ") in vsaka
                            "off" celica (KPU ALI resnično prazna) je pokazala isti "–" —
                            KPU se torej ni dalo ločiti od praznega dneva. Zdaj: prazna
                            celica ne izriše ničesar (kot v uradni predlogi "2026 SMS
                            RAZPORED"), vsaka druga pokaže celotno kodo. */}
                        {pokriva && <span className="pokriva" title={"Ta dan pokriva: " + pokriva}>{pokriva}</span>}
                        {sifra && (
                          <span className={"swatch swatch-" + cls} title={sifra}>{sifra}</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="li"><span className="dot" style={{background:"var(--dop)"}}></span>Dopoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--pop)"}}></span>Popoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--noc)"}}></span>Nočna</span>
        <span className="li"><span className="dot" style={{background:"var(--h12)"}}></span>12-urna</span>
        <span className="li"><span className="dot" style={{background:"var(--ld)"}}></span>Letni dopust (LD)</span>
        <span className="li"><span className="dot" style={{background:"var(--off)"}}></span>KPU / prosto</span>
      </div>
      <RazporedPodpisi entries={entries} />
    </div>
  );
}

// NZV: dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe kot pri
// WardView) - po uradni predlogi "Letni dopusti in omejitve za NZV". Celica
// = kdo pokriva to enoto ta dan (schedule_entries.department_code je še
// vedno lahko ena od teh starih kod - glej supabase/schema.sql sekcija 23,
// namenoma niso izbrisane iz departments prav zaradi te uporabe). Ločeno
// od WardView, ker gre za popolnoma drugačno obliko (enote, ne osebe).
const NZV_ENOTE = [
  ["PDZN", "PDZN"], ["SOBO", "SOBO"], ["ZO", "ŽO"], ["E1", "E1"], ["E2", "E2"], ["D", "D"], ["MO", "MO"],
  ["B", "B"], ["C", "C"], ["C1", "C1"], ["PO", "PO"], ["A", "A"], ["B1B2", "B1,B2"], ["DB", "DB"],
  ["URGENCA", "URGENCA"], ["U2", "U2"],
];
// "SA" nima nobenega samodejnega generatorja (za razliko od ostalih enot) -
// v uradni predlogi je razdeljena na dva stolpca (dopoldan/popoldan), zato
// tu isto razdelimo po vsebini shift_code (glej razvrstiSA spodaj), namesto
// da bi uvajali dva nova department_code (SA ostaja ena sama koda v bazi).
function razvrstiSA(sifra){
  const t = (sifra || "").toLowerCase();
  if (t.includes("pop")) return "SAPOP";
  return "SADOP"; // privzeto dopoldan, če ni prepoznano drugače
}
// Vrstni red stolpcev v uradni predlogi ima "SA DOP"/"SA POP" MED "DB" in
// "URGENCA" (ne na koncu, kot bi bil naiven vrstni red NZV_ENOTE+dodatek) -
// zato tu sestavimo pravi prikazni vrstni red ločeno od NZV_ENOTE (ki ostaja
// nespremenjen, ker ga poizvedba in uvoz uporabljata brez odvisnosti od
// vrstnega reda stolpcev).
const NZV_STOLPCI = (() => {
  const brezUrgence = NZV_ENOTE.filter(([k]) => k !== "URGENCA" && k !== "U2");
  const urgencaU2 = NZV_ENOTE.filter(([k]) => k === "URGENCA" || k === "U2");
  return [...brezUrgence, ["SADOP", "SA DOP"], ["SAPOP", "SA POP"], ...urgencaU2];
})();
// Zadnji trije stolpci uradne predloge ("LD", "IZOB", "BS") niso enote, ampak
// POVZETEK odsotnosti tega dne (glej leave_entries.kind) - kdo je ta dan na
// letnem dopustu / strokovnem izobraževanju / bolniški. Isti vir kot Želje →
// Razpredelnica (zelje.html), tu prikazan skupaj s končnim razporedom, ker
// gre za "omejitve, ki se vežejo na razpored za določen mesec".
const NZV_KIND_KODA = { ld: "LD", sti: "IZOB", bs: "BS" };

// Kdo sodi v NZV razpored, je v nzv-zasedba.js - isti nabor potrebuje
// tudi Imenik -> Razpredelnica, zato en sam vir.
const JE_NZV_VLOGA = new Set(window.NzvZasedba.VLOGE);

// Ujemanje imen med viri je v imena.js - en sam vir za vse zaslone.
// Prej je imel vsak svojo, drugače strogo različico (ta je npr. poznala
// potrjeni tipkarski napaki "Horvat"/"Tomažević", ni pa prenesla
// izgubljenih strešic - Imenik pa ravno obratno), zato se je ista oseba
// na enem zaslonu našla, na drugem pa ne.
const imenaSeUjemataNzv = window.Imena.seUjemata;
const kljucImenaNzv = window.Imena.kljuc;

// Naziv stolpca (kot v uradni predlogi) -> notranja koda. Skupno za izris,
// izvoz, uvoz IN pisanje nazaj, da se štirje kraji ne razidejo.
function nzvNazivVKodo(){
  const m = { "Dežurstvo": "DEZ", "DEŽURSTVO": "DEZ", "SA DOP": "SADOP", "SA POP": "SAPOP", "LD": "LD", "IZOB": "IZOB", "BS": "BS" };
  NZV_ENOTE.forEach(([koda, naziv]) => { m[naziv] = koda; });
  return m;
}

// Izmenična zasedba SA in prevod enot nosilca v stolpce mreže živita v
// nzv-zasedba.js - isto pravilo potrebuje tudi Imenik -> Razpredelnica,
// zato je en sam vir (enaka odločitev kot pri prazniki.js). Tu so samo
// kratki lokalni ovoji, da klici spodaj ostanejo berljivi.
const saNastavitveIz = window.NzvZasedba.saNastavitveIz;
const saStolpec = window.NzvZasedba.saStolpec;
function nzvEnoteVKode(enote, saKoda){
  return window.NzvZasedba.enoteVKode(enote, saKoda, NZV_STOLPCI.map(([k]) => k));
}

// Skupno nalaganje podatkov za izris/izvoz/pisanje-nazaj NZV pogleda -
// "podatki" = { "KODA|datum": "parafa, parafa2" } za vse enote + DEZ +
// LD/IZOB/BS (iz leave_entries, ujemano po imenu na profiles).
async function nalozizPodatkeNzv(startISO, endISO){
  const kode = [...NZV_ENOTE.map(([k]) => k), "SA", "DEZ"];
  const [{ data: entries }, { data: dopusti }, { data: profili }, { data: vodje }, { data: nadomescanja }, { data: nastavitveVrstice }] = await Promise.all([
    // "profiles!employee_id(...)" in NE samo "profiles(...)": schedule_entries
    // ima TRI tuje ključe na profiles (employee_id, created_by, updated_by -
    // zadnja dva dodana pozneje, sekcija 30 sheme). Ob nedoločenem vgnezdenem
    // branju PostgREST ne more vedeti, po katerem naj pripne, in vrne napako
    // namesto vrstic - posledica je bila PRAZNA NZV mreža (enote in
    // DEŽURSTVO), medtem ko je stolpec LD deloval, ker se bere iz
    // leave_entries prek ločene poizvedbe. Namig mora ostati tudi ob
    // morebitnem preimenovanju omejitve, zato je vezan na IME STOLPCA, ne na
    // ime tujega ključa.
    client.from("schedule_entries").select("department_code, work_date, shift_code, created_at, created_by, updated_at, profiles!employee_id(full_name, role, parafa, parafa_pred_oktobrom_2026)")
      .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO),
    client.from("leave_entries").select("full_name, work_date, kind")
      .in("kind", ["ld", "sti", "bs"]).gte("work_date", startISO).lte("work_date", endISO),
    client.from("profiles").select("full_name, role, parafa, parafa_pred_oktobrom_2026"),
    // Nosilci enot in seznam pokrivanj - vir izpeljane prisotnosti spodaj.
    // Če stolpca/tabele (še) ni, PostgREST vrne napako in data = null;
    // "|| []" spodaj poskrbi, da mreža v tem primeru dela kot prej (samo
    // objavljeni vnosi), namesto da bi se sesula.
    client.from("lead_departments").select("full_name, enote, odsotnost_tip, odsotnost_do"),
    client.from("nadomescanja").select("nosilec, nadomesca, enota, prednost"),
    client.from("nzv_nastavitve").select("kljuc, vrednost"),
  ]);
  const saNast = saNastavitveIz(nastavitveVrstice);
  const podatki = {};
  // Katere celice so IZPELJANE (ne izrecno objavljene) - za bledejši izris
  // in za pojasnilo pod mrežo. Izvoz in pisanje v Sheets uporabljata samo
  // "podatki", ker gre tam za isto vsebino, le brez oblikovanja.
  const izpeljano = {};
  const objavljeno = new Set(); // "koda|datum" celice, ki imajo izrecen vnos - izpeljava vanje ne piše
  const zeVpisan = new Set(); // "kljucImenaNzv|datum" - kdo je že v mreži iz objavljenega razporeda
  (entries || []).forEach(r => {
    if (!r.profiles) return;
    // Delovnik NZV je PON-PET; sobota in nedelja sta prosti, razen če je
    // oseba tisti dan DEŽURNA. Isto pravilo kot nzvPrikaz v "Moj
    // razpored" - brez njega je mreža ob vikendih kazala vodje na
    // enotah, čeprav takrat ne delajo.
    if (window.Prazniki.jeDelaProstDan(r.work_date) && classify(r.shift_code) !== "dez"
        && r.department_code !== "DEZ") return;
    // V NZV razporedu so SAMO vodje in administratorji (uporabnikova
    // izrecna zahteva). Brez tega filtra se je mreža polnila z oddelčnim
    // kadrom: kode B/C/C1/D/E1/E2 so hkrati oddelki SMS/TZN kadra IN imena
    // stolpcev v NZV predlogi, zato je stolpec "D" prikazal vseh devet
    // sester oddelka D namesto vodij, ki to enoto tisti dan pokrivajo.
    if (!JE_NZV_VLOGA.has(r.profiles.role)) return;
    const koda = r.department_code === "SA" ? razvrstiSA(r.shift_code) : r.department_code;
    const key = koda + "|" + r.work_date;
    const parafa = parafaOd(r.profiles, r.work_date);
    zeVpisan.add(kljucImenaNzv(r.profiles.full_name) + "|" + r.work_date);
    objavljeno.add(key);
    podatki[key] = podatki[key] ? podatki[key] + ", " + parafa : parafa;
  });
  (dopusti || []).forEach(d => {
    const koda = NZV_KIND_KODA[d.kind];
    if (!koda) return;
    // Odsotnost (LD/IZOB/BS) se prav tako vodi samo za delovne dni -
    // "letni dopust v soboto" ni stvar; vikend je prost sam po sebi.
    if (window.Prazniki.jeDelaProstDan(d.work_date)) return;
    const ujem = (profili || []).find(p => imenaSeUjemataNzv(p.full_name, d.full_name));
    // Isto pravilo kot za enote zgoraj: stolpci LD/IZOB/BS uradne predloge
    // se nanašajo na NZV kader, ne na oddelčne sestre. Oseba, ki je v
    // leave_entries, a je ni med vodji/administratorji, sem ne sodi.
    if (!ujem || !JE_NZV_VLOGA.has(ujem.role)) return;
    const parafa = parafaOd(ujem, d.work_date);
    const key = koda + "|" + d.work_date;
    podatki[key] = podatki[key] ? podatki[key] + ", " + parafa : parafa;
  });

  // ---- Izpeljana prisotnost nosilcev enot -------------------------------
  // Mreža se je doslej polnila IZKLJUČNO iz objavljenih schedule_entries,
  // zato so stolpci enot (PDZN, SOBO, MO, ŽO …) ostajali prazni: za vodje
  // se dnevni razpored ne objavlja - njihova enota je stalna in znana iz
  // lead_departments.enote (glej supabase/nzv-nosilci-oddelkov.sql).
  // Zato jo tu izpeljemo: nosilec je na svoji enoti vsak DELOVNI dan, ob
  // njegovi odsotnosti pa se vpiše nadomeščevalec iz tabele nadomescanja
  // (prvi po "prednost", ki tisti dan ni tudi sam odsoten).
  //
  // Izrecno objavljen vnos ima VEDNO prednost - izpeljava zapolni samo
  // prazne celice in nikoli ne podvoji osebe, ki je tisti dan že v mreži.
  const nosilci = (vodje || []).filter(v => v.enote);
  if (nosilci.length) {
    const profilZaIme = ime => (profili || []).find(p => imenaSeUjemataNzv(p.full_name, ime));
    // Kdo je kdaj odsoten: posamezni dnevi iz leave_entries (LD/IZOB/BS) +
    // daljša odsotnost iz lead_departments (npr. porodniška do julija 2027).
    const odsotenDan = new Set();
    (dopusti || []).forEach(d => odsotenDan.add(kljucImenaNzv(d.full_name) + "|" + d.work_date));
    const vodjaZaIme = {};
    (vodje || []).forEach(v => { vodjaZaIme[kljucImenaNzv(v.full_name)] = v; });
    const jeOdsoten = (ime, datum) => {
      if (odsotenDan.has(kljucImenaNzv(ime) + "|" + datum)) return true;
      return window.NzvZasedba.trajnoOdsoten(vodjaZaIme[kljucImenaNzv(ime)], datum);
    };
    const nadomZa = {};
    (nadomescanja || []).forEach(n => {
      const k = kljucImenaNzv(n.nosilec);
      (nadomZa[k] = nadomZa[k] || []).push(n);
    });
    Object.keys(nadomZa).forEach(k => nadomZa[k].sort((a, b) => (a.prednost || 1) - (b.prednost || 1)));

    // Enoto lahko pokriva VEČ nosilcev hkrati (URGENCA: Bizjak, Trpin,
    // Mušič) - zato se izpeljane parafe seštevajo, tako kot se seštevajo
    // objavljeni vnosi. V celico z izrecnim vnosom pa izpeljava ne piše:
    // objavljen razpored je merodajen in ga izpeljana "stalna zasedba" ne
    // sme dopolnjevati.
    const vpisiIzpeljano = (koda, datum, parafa) => {
      const key = koda + "|" + datum;
      if (objavljeno.has(key)) return;
      const ze = podatki[key];
      if (ze && ze.split(", ").indexOf(parafa) >= 0) return;
      podatki[key] = ze ? ze + ", " + parafa : parafa;
      izpeljano[key] = true;
    };

    daysInRange(startISO, endISO).forEach(dn => {
      if (window.Prazniki.jeDelaProstDan(dn.datum)) return;
      const saKoda = saStolpec(dn.datum, saNast);
      nosilci.forEach(v => {
        const kode = nzvEnoteVKode(v.enote, saKoda);
        if (!kode.length) return;
        if (zeVpisan.has(kljucImenaNzv(v.full_name) + "|" + dn.datum)) return;
        if (!jeOdsoten(v.full_name, dn.datum)) {
          const profil = profilZaIme(v.full_name);
          if (!profil || !JE_NZV_VLOGA.has(profil.role)) return;
          const parafa = parafaOd(profil, dn.datum);
          kode.forEach(koda => vpisiIzpeljano(koda, dn.datum, parafa));
          return;
        }
        // Nosilec je odsoten - prvi nadomeščevalec po prednosti, ki tisti
        // dan ni odsoten tudi sam.
        const kandidati = nadomZa[kljucImenaNzv(v.full_name)] || [];
        for (let i = 0; i < kandidati.length; i++) {
          const n = kandidati[i];
          if (jeOdsoten(n.nadomesca, dn.datum)) continue;
          const profilN = profilZaIme(n.nadomesca);
          if (!profilN || !JE_NZV_VLOGA.has(profilN.role)) continue;
          const parafaN = parafaOd(profilN, dn.datum);
          // "enota" pove, katero enoto nadomeščevalec DEJANSKO prevzame -
          // ni nujno ves nabor enot odsotnega (Lelič ob Maglićevi
          // odsotnosti pokrije samo E1, ne E1/D). Kjer ni zapisana, velja
          // cel nabor odsotnega.
          const kodeN = nzvEnoteVKode(n.enota, saKoda);
          (kodeN.length ? kodeN : kode).forEach(koda => vpisiIzpeljano(koda, dn.datum, parafaN));
          break;
        }
      });
    });
  }
  return { podatki, entries: entries || [], izpeljano, saNast };
}

// Administrator ureja izmenično zasedbo SA kar nad mrežo, kjer je učinek
// takoj viden - dve kratki kontroli, brez posebnega zaslona z nastavitvami.
// Vsi ostali vidijo isto pravilo zapisano v razlagi pod mrežo.
function SaNastavitveUrejanje({ saNast, naShranjeno }){
  const [lihoTeden, setLihoTeden] = useState(saNast.lihoTeden);
  const [meseci, setMeseci] = useState((saNast.poletniMeseci || []).join(","));
  const [busy, setBusy] = useState(false);
  const [napaka, setNapaka] = useState(null);

  const spremenjeno = lihoTeden !== saNast.lihoTeden
    || meseci.replace(/\s/g, "") !== (saNast.poletniMeseci || []).join(",");

  const shrani = async () => {
    setBusy(true); setNapaka(null);
    const ocisceni = meseci.split(",").map(x => Number(x.trim()))
      .filter(n => n >= 1 && n <= 12).join(",");
    const { error } = await client.from("nzv_nastavitve").upsert([
      { kljuc: "sa_liho_teden", vrednost: lihoTeden },
      { kljuc: "sa_poletni_meseci", vrednost: ocisceni },
    ], { onConflict: "kljuc" });
    setBusy(false);
    if (error) {
      // Tabele še ni -> administrator mora pognati SQL. Povemo katerega.
      const manjkaTabela = error.code === "42P01" || /does not exist|schema cache/i.test(error.message || "");
      setNapaka(manjkaTabela
        ? "Tabele nzv_nastavitve še ni — v Supabase poženi supabase/nzv-nastavitve.sql."
        : (error.message || "Shranjevanje ni uspelo."));
      return;
    }
    setMeseci(ocisceni);
    naShranjeno();
  };

  return (
    <div className="saNastavitve">
      <span>SA se izmenjuje tedensko: v <b>lihem</b> tednu</span>
      <select value={lihoTeden} onChange={e => setLihoTeden(e.target.value)}>
        <option value="dop">dopoldne</option>
        <option value="pop">popoldne</option>
      </select>
      <span>· poleti samo dopoldne v mesecih</span>
      <input value={meseci} onChange={e => setMeseci(e.target.value)}
        placeholder="7,8" size={6} inputMode="numeric" aria-label="Poletni meseci, ločeni z vejico" />
      <button className="btn btn-ghost btn-sm" disabled={!spremenjeno || busy} onClick={shrani}>
        {busy ? "Shranjujem …" : "Shrani"}
      </button>

}

// Uradni dokument "Razporeditev zaposlenih v UA in DEŽ" ima tri kroge:
// Urgenca ZDR, Dežurstvo ZDR in Dežurstvo dipl. m.s./zn. Doslej se je iz
// njega bralo samo ime zdravnika ob DEŽURSTVU v "Moj razpored" - celotnega
// razporeda ni bilo videti nikjer, čeprav ga potrebuje ves NZV.
//
// Umeščen je POD mrežo NZV, v isti obliki kot uradni dokument (dan v
// vrstici, trije krogi v stolpcih), da je primerjava s papirjem
// neposredna. Viden je vsem, ki vidijo NZV razpored.
function DezurstvaZdravnikiTabela({ month }){
  const [vrstice, setVrstice] = useState(null);
  const [stanje, setStanje] = useState("nalagam"); // "nalagam" | "ok" | "ni-tabele" | "prazno"
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setVrstice(null); setStanje("nalagam");
    client.from("duty_doctors").select("work_date, kind, full_name")
      .gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) {
          const manjkaTabela = error.code === "42P01" || /does not exist|schema cache/i.test(error.message || "");
          setStanje(manjkaTabela ? "ni-tabele" : "prazno");
          setVrstice({});
          return;
        }
        const m = {};
        (data || []).forEach(r => {
          if (!m[r.work_date]) m[r.work_date] = {};
          m[r.work_date][r.kind] = r.full_name;
        });
        setVrstice(m);
        setStanje(Object.keys(m).length ? "ok" : "prazno");
      });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  if (stanje === "nalagam") return null;
  if (stanje !== "ok") {
    return (
      <div className="warnBox no-print" style={{marginTop:16}}>
        🩺 {stanje === "ni-tabele"
          ? "Tabele dežurnih zdravnikov še ni v bazi. Administrator naj v Supabase požene supabase/schema.sql (razdelek 32) in supabase/dodaj-dezurno-sestro.sql."
          : "Za ta mesec ni naloženega razporeda dežurstev. Administrator ga naloži z ikono 📥 zgoraj desno → »🩺 Naloži dežurstvo zdravnikov (PDF)«."}
      </div>
    );
  }

  return (
    <div style={{marginTop:20}}>
      <h3 className="section" style={{marginBottom:6}}>Dežurstva — urgenca in NZV</h3>
      <p className="hint" style={{marginTop:0}}>
        Iz uradnega dokumenta <i>Razporeditev zaposlenih v urgentno ambulanto in neprekinjeno zdravstveno varstvo</i>.
        Ob vikendih urgentne ambulante ni, zato je tisti stolpec prazen.
      </p>
      <div className="tableScroller">
        <table className="wardTable">
          <thead>
            <tr>
              <th className="name">Datum</th>
              <th>Urgenca ZDR</th>
              <th>Dežurstvo ZDR</th>
              <th>Dežurstvo dipl. m.s./zn.</th>
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const r = vrstice[dn.datum] || {};
              const vikend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={vikend ? "weekend" : ""}>
                  <td className="name">{window.Datum.slo(dn.datum)} {dn.dan}</td>
                  <td>{r.urgenca || ""}</td>
                  <td>{r.dezurstvo || ""}</td>
                  <td>{r.sestra || ""}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// "Po oddelkih" je na izrecno navodilo omejen na 6 SMS/TZN oddelkov + FLEXI
// + en virtualen "NZV" (vodje/admin, dežurstva vključena) - ostali oddelki
// (DEZ, NEDEZ, PDZN, SOBO ...) tu niso na voljo, ne glede na vlogo.
const PO_ODDELKIH_KODE = ["B", "C", "C1", "D", "E1", "E2", "FLEXI"];

// Uvoz razporeda živi samo tu (ena sama, testirana pot za VSE skupine -
// 6 oddelkov + FLEXI + NZV), zavihek "Oddelki" v admin.html pa nanj
// napoti prek "index.html?uvoz=1&oddelek=…&mesec=…". Vrne null, kadar
// naslov tega ne zahteva; sicer {oddelek, mesec}, kjer je posamezno polje
// null, če vrednost ni veljavna - naslov je zunanji vhod (uporabnik ga
// lahko poljubno spremeni ali deli naprej), zato se oddelek preveri proti
// znanim kodam, mesec pa proti obliki YYYY-MM, namesto da bi se mu
// zaupalo. Neveljavna vrednost pomeni "uporabi privzeto", ne napake.
function preberiUvozIzNaslova(search){
  const p = new URLSearchParams(search || "");
  if (p.get("uvoz") !== "1") return null;
  const oddelek = (p.get("oddelek") || "").trim().toUpperCase();
  const mesec = (p.get("mesec") || "").trim();
  return {
    oddelek: (PO_ODDELKIH_KODE.includes(oddelek) || oddelek === "NZV") ? oddelek : null,
    mesec: /^\d{4}-(0[1-9]|1[0-2])$/.test(mesec) ? mesec : null,
  };
}

// ---------------------------------------------------------------------
// Uvoz iz Google Sheets (admin) — javna povezava ("vsak s povezavo lahko
// ogleda"), brez OAuth, isti mehanizem kot imenik.html (ImportUtils.
// preberiGoogleSheet). Namenoma ISTA oblika, ki jo ta stran tudi izvozi
// (glava "Datum, Dan, ..."), da je krog izvozi→uredi v Sheets→uvozi
// nazaj preprost in predvidljiv. Piše naravnost v schedule_entries -
// dovoljeno samo adminu (RLS schedule_write_admin to tudi vsili na
// strežniku, ne samo tu).
// ---------------------------------------------------------------------
// Če stolpec pokriva_oddelek v bazi še ne obstaja (shema, razdelek 34 -
// supabase/dodaj-pokriva-oddelek.sql še ni bil pognan), Postgres zavrne
// CEL upsert. To ne sme pomeniti, da uvoz razporeda nenadoma sploh ne dela:
// v tem primeru zapise shranimo brez tega polja in to POVEMO, namesto da bi
// uporabnik dobil nerazumljivo napako o neznanem stolpcu.
let opozoriloPokrivaOddelek = null;
function jeManjkajocPokrivaOddelek(error){
  if (!error) return false;
  // 42703 = undefined_column; PostgREST vrne tudi PGRST204 s sporočilom o
  // stolpcu, ki ga ni v predpomnilniku sheme.
  return error.code === "42703" || error.code === "PGRST204"
    || /pokriva_oddelek/i.test((error.message || "") + (error.details || ""));
}
async function shraniZapiseRazporeda(zapisi){
  for (let i = 0; i < zapisi.length; i += 200) {
    const kos = zapisi.slice(i, i + 200);
    const { error } = await client.from("schedule_entries").upsert(kos, { onConflict: "employee_id,work_date" });
    if (!error) continue;
    if (!jeManjkajocPokrivaOddelek(error)) throw error;
    opozoriloPokrivaOddelek = "Stolpca za pokriti oddelek (FLEXI) v bazi še ni, zato je razpored shranjen brez njega. "
      + "Administrator naj v Supabase požene supabase/dodaj-pokriva-oddelek.sql in uvoz ponovi.";
    const brez = kos.map(({ pokriva_oddelek, ...ostalo }) => ostalo);
    const { error: e2 } = await client.from("schedule_entries").upsert(brez, { onConflict: "employee_id,work_date" });
    if (e2) throw e2;
  }
}

// Isti upsert vzorec kot zelje.html (leave_entries, ključ full_name+work_date) -
