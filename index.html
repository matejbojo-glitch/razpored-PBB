        <div className="tableScroller">
          {/* "razpPolna": cel mesec naj gre na en zaslon, brez vodoravnega
              vlečenja (uporabnikova zahteva). Stolpci dni so zato ozki in
              drobni, stolpec z imenom pa ohrani berljivo širino. Na telefonu
              31 stolpcev seveda ne gre - tam ostane drsenje kot doslej. */}
          <table className="wardTable razpPolna">
            <thead>
              <tr>
                <th className="name">Zaposleni</th>
                {dnevi.map(d => {
                  const praznik = window.Prazniki.naziv(d.iso);
                  return (
                    <th key={d.iso} title={praznik || undefined}
                      style={(d.vikend || praznik) ? {color:"var(--pop)"} : null}>
                      {d.dan}{praznik ? "*" : ""}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {prikazane.map(o => {
                const nosilec = nosilci[o.id];
                return (
                <tr key={o.id}>{/* nosilec = vrstica iz nosilci_oddelkov, če oseba to je */}
                  <td className="name">
                    <a href={"imenik.html?id=" + o.id} style={{color:"inherit"}}
                       title="Odpri profil">{o.full_name}</a>
                    {/* Pod imenom stoji SAMO stalna enota nosilca. Kdo koga
                        nadomešča, je v celoti spodaj v "Pregledu nadomeščanj"
                        pod razpredelnico - dve dodatni vrstici pri vsakem
                        imenu sta mrežo delali natrpano in nepregledno
                        (uporabnikova zahteva). Podatek se še vedno izračuna
                        in se ob dotiku celice pokaže tam, kjer je koristen:
                        pri dnevu z dopustom pove, kdo tisti dan pokriva. */}
                    {nosilec && nosilec.enote && (
                      <span style={{display:"block", fontSize:10, fontWeight:400, color:"var(--muted)", lineHeight:1.35}}>
                        {nosilec.enote}
                      </span>
                    )}
                  </td>
                  {dnevi.map(d => {
                    const zapis = poDnevih[o.id + "|" + d.iso];
                    const kratica = zapis ? zapis.kratica : "";
                    const barva = zapis ? zapis.barva : STANJE_BARVA.prosto.barva;
                    const vnos = kratica ? vnosPoKratici(kratica) : null;
                    const zamenjano = !!menjani[o.id + "|" + d.iso];
                    // NZV vodje in administratorji delajo vedno dopoldne
                    // (PON-PET 07:00-15:00), zato "DOP" v vsaki celici ne
                    // pove ničesar - pove pa enota. Kjer je enota znana,
                    // stoji namesto kratice. Druge kratice (DEŽ, LD, BS,
                    // STI) ostanejo, ker nosijo podatek, enota pa je nad
                    // njimi.
                    const samoEnota = !!(zapis && zapis.enota && kratica === "DOP");
                    const opis = vnos ? vnos[2] + (vnos[3] ? " · " + vnos[3] : "")
                      : (zapis ? zapis.sifra : "Prosto / ni v razporedu");
                    return (
                      <td key={d.iso}
                        title={`${o.full_name} · ${d.dan}. – ${opis}`
                          + (zapis && zapis.enota ? " · enota: " + zapis.enota : "")
                          + (zamenjano ? " (po potrjeni menjavi)" : "")
                          + (zapis && zapis.izpeljano ? " (stalna zasedba enote, ne objavljen vnos)" : "")
                          // Ob dopustu/bolniški je najbolj koristno vedeti, KDO
                          // ta dan pokriva njegov oddelek.
                          + ((nosilec && (nosilec.nadomescajoMene || []).length && zapis
                              && (zapis.stanje === "dopust" || zapis.stanje === "bolniska"))
                             ? " · nadomešča: " + nosilec.nadomescajoMene.join(", ") : "")}
                        style={{background: zapis ? barva : barva + "55", position:"relative",
                          textAlign:"center", fontSize:10, fontWeight:700,
                          // Izpeljana stalna zasedba (nosilec enote, brez
                          // objavljenega vnosa) je bledejša in ležeča -
                          // enako kot v NZV mreži, da se na prvi pogled
                          // loči od objavljenega razporeda.
                          opacity: zapis && zapis.izpeljano ? .7 : 1,
                          fontStyle: zapis && zapis.izpeljano ? "italic" : "normal",
                          color: zapis ? window.Izmene.barvaBesedila(barva) : "#2B2717"}}>
                        {/* Enota, na kateri je oseba TA DAN po dejanskem
                            razporedu - ne stalna enota. Ob nadomeščanju se
                            spremeni (Arnež gre s C na C1; ob Leličini
                            odsotnosti ima Maglić "E2, E1"), zato je edino
                            tu razvidno, kje kdo v resnici je. */}
                        {samoEnota ? zapis.enota : (
                          <React.Fragment>
                            {zapis && zapis.enota && (
                              <span style={{display:"block", fontSize:8, fontWeight:600, opacity:.85, lineHeight:1.1}}>
                                {zapis.enota}
                              </span>
                            )}
                            {kratica}
                          </React.Fragment>
                        )}
                        {zamenjano && (
                          <span aria-hidden="true" style={{position:"absolute", top:0, right:1, fontSize:8,
                            lineHeight:1, opacity:.85}}>↔</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
                );
              })}

              {/* Nosilci NZV za ta oddelek - v vrstici POD oddelčnim
                  kadrom. Niso člani oddelka, so pa zanj tisti dan
                  odgovorni. Celica se izpiše samo tam, kjer oseba res
                  pokriva TA oddelek: ob dopustu Salkićeve njena vrstica
                  tisti dan ostane prazna, Arneževa pa se pojavi - tudi
                  kadar gre za en sam dan. Vir je razpored NZV z
                  nadomeščanji (nzv-zasedba.js), ne oddelčni razpored. */}
              {nzvVrstice.length > 0 && (
                <tr className="nzvLocnica">
                  <td className="name">NZV – nosilec oddelka</td>
                  <td colSpan={dnevi.length}></td>
                </tr>
              )}
              {nzvVrstice.map(({ oseba, dnevi: pokriva }) => (
                <tr key={"nzv-" + oseba.id}>
                  <td className="name">
                    <a href={"imenik.html?id=" + oseba.id} style={{color:"inherit"}} title="Odpri profil">{oseba.full_name}</a>
                    <span style={{display:"block", fontSize:10, fontWeight:400, color:"var(--muted)", lineHeight:1.35}}>
                      NZV · {(nosilci[oseba.id] && nosilci[oseba.id].enote) || "—"}
                    </span>
                  </td>
                  {dnevi.map(d => {
                    const jeTu = pokriva.has(d.iso);
                    const zapis = poDnevih[oseba.id + "|" + d.iso];
                    const dezuren = zapis && zapis.stanje === "dezurstvo";
                    return (
                      <td key={d.iso}
                        title={jeTu ? `${oseba.full_name} · ${d.dan}. – pokriva ${oddelek}` + (dezuren ? " (in dežura)" : "")
                                    : `${oseba.full_name} · ${d.dan}. – ta dan ne pokriva oddelka ${oddelek}`}
                        style={{textAlign:"center", fontSize:10, fontWeight:700,
                          background: jeTu ? "var(--surface-2)" : "transparent",
                          color:"var(--text)"}}>
                        {jeTu ? (dezuren ? "DEŽ" : oddelek) : ""}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <NadomescanjaPregled />
    </React.Fragment>
  );
}

function WardView({ deptCode, month, myId }){
  const [employees, setEmployees] = useState(null);
  const [entries, setEntries] = useState(null);
  // "datum" -> [ime, ...]: kdo je iz NZV tisti dan zadolžen za TA oddelek.
  // Ne pride iz oddelčnega razporeda, ampak iz razporeda NZV - vodje se ob
  // odsotnosti sodelavca premaknejo (Salkić C1 na dopustu -> C1 pokriva
  // Arnež, njegov C pa Lunar, ki je tako hkrati na B in na C). Prej se je
  // to videlo samo v mreži NZV, oddelek pa ni vedel, kdo ga tisti dan
  // pokriva - tudi kadar je šlo za en sam dan.
  const [nzvPoDnevih, setNzvPoDnevih] = useState({});
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEmployees(null); setEntries(null);
    client.from("profili").select("id, full_name, role").eq("department_code", deptCode).order("full_name")
      .then(({ data }) => {
        if (cancelled) return;
        const osebe = data || [];
        setEmployees(osebe);
        if (!osebe.length) { setEntries([]); return; }
        // Vpisi se berejo po OSEBAH, ne po department_code vpisa.
        //
        // Prej je poizvedba iskala vpise z department_code = ta oddelek.
        // Posledica: kdor je v Imeniku v FLEXI, njegove izmene pa so bile
        // uvožene iz oddelčnega zavihka (Jereb S. iz zavihka C, Kogoj E.,
        // Vozel N. …), je imel v mreži FLEXI PRAZEN stolpec - podatek je
        // obstajal, le poizvedba ga ni videla. Enako bi se zgodilo vsakomur,
        // ki kak dan dela na drugem oddelku.
        //
        // Kje oseba tisti dan dejansko dela, se izpiše nad izmeno (glej
        // "pokriva" v celici spodaj).
        client.from("razpored")
          .select("employee_id, work_date, shift_code, department_code, pokriva_oddelek, created_at, created_by, updated_at")
          .in("employee_id", osebe.map(o => o.id))
          .gte("work_date", startISO).lte("work_date", endISO)
          .then(({ data: vpisi }) => { if (!cancelled) setEntries(vpisi || []); });
      });
    return () => { cancelled = true; };
  }, [deptCode, startISO, endISO]);

  // Nosilci NZV za ta oddelek. Izračun je v skupnem nzv-zasedba.js
  // (zasedbaEnot), da se ta stolpec in mreža NZV ne moreta razhajati.
  useEffect(() => {
    let cancelled = true;
    if (!window.NzvZasedba.jeDelovisce(deptCode)) { setNzvPoDnevih({}); return; }
    cancelled = false;
    Promise.all([
      client.from("nosilci_oddelkov").select("full_name, enote, odsotnost_tip, odsotnost_do"),
      client.from("nadomescanja").select("*").then(r => r, () => ({ data: [] })),
      client.from("odsotnosti").select("full_name, work_date, kind")
        .gte("work_date", startISO).lte("work_date", endISO),
      // OBJAVLJEN razpored NZV. Koordinator v mreži NZV marsikaj določi
      // ročno (vskoči nekdo tretji, dogovor se sklene sproti) - kar objavi,
      // mora veljati tudi tu, sicer bi oddelek kazal pravilo, mreža NZV pa
      // dejansko stanje. Pravilo nadomeščanja se uporabi le za dneve, za
      // katere objave še ni.
      RazporedAuth.vseStrani((od, doV) =>
        client.from("razpored")
          .select("work_date, department_code, pokriva_oddelek, profili!employee_id(full_name, role)")
          .gte("work_date", startISO).lte("work_date", endISO).range(od, doV)
      ).then(data => ({ data }), () => ({ data: [] })),
    ]).then(([{ data: nosilci }, { data: pari }, { data: odsotnosti }, { data: objavljeniVpisi }]) => {
      if (cancelled) return;
      const zEnotami = (nosilci || []).filter(n => n.enote);
      if (!zEnotami.length) { setNzvPoDnevih({}); return; }
      const kljuc = window.Imena.kljuc;
      const odsotenDan = new Set();
      (odsotnosti || []).forEach(o => {
        if (o.kind === "ld" || o.kind === "bs" || o.kind === "sti") {
          odsotenDan.add(kljuc(o.full_name) + "|" + o.work_date);
        }
      });
      // Objavljeni vnosi NZV oseb, po dnevih. Vikendi in prazniki se
      // izpustijo iz istega razloga kot pri izpeljavi: NZV takrat po
      // enotah ne dela, dežurstvo pa ni enota.
      const objavljeno = {};
      (objavljeniVpisi || []).forEach(r => {
        if (!r.profili || !JE_NZV_VLOGA.has(r.profili.role)) return;
        if (window.Prazniki.jeVikend(r.work_date) || window.Prazniki.jePraznik(r.work_date)) return;
        const kode = window.NzvZasedba.enoteIzZapisa(r);
        if (!kode.length) return;
        (objavljeno[r.work_date] = objavljeno[r.work_date] || []).push({ ime: r.profili.full_name, kode });
      });
      const poEnoti = window.NzvZasedba.zasedbaEnot({
        objavljeno,
        nosilci: zEnotami,
        pari: pari || [],
        kljuc,
        datumi: days.map(d => d.datum),
        jeOdsoten: (ime, datum) => odsotenDan.has(kljuc(ime) + "|" + datum)
          || window.NzvZasedba.trajnoOdsoten(
               zEnotami.find(v => kljuc(v.full_name) === kljuc(ime)), datum),
        jeProstDan: (datum) => window.Prazniki.jeVikend(datum) || window.Prazniki.jePraznik(datum),
      });
      const zaOddelek = {};
      days.forEach(d => {
        const imena = poEnoti[deptCode + "|" + d.datum];
        if (imena && imena.length) zaOddelek[d.datum] = imena;
      });
      setNzvPoDnevih(zaOddelek);
    });
    return () => { cancelled = true; };
  }, [deptCode, startISO, endISO, days]);

  const byEmpDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.employee_id + "|" + e.work_date] = e; });
    return m;
  }, [entries]);

  // Legenda pod tabelo: samo izmene, ki so ta mesec DEJANSKO v razporedu.
  // Vir barv in nazivov je uradna legenda (izmene.js), ista kot v
  // Imenik → Razpredelnica, zato se barva v legendi in barva v celici ne
  // moreta razhajati. Vrstni red je vrstni red uradne legende, ne vrstni
  // red pojavitve - da je seznam med meseci stabilen.
  const legendaIzmen = useMemo(() => {
    const videne = new Set();
    (entries || []).forEach(e => { if (e.shift_code) videne.add(e.shift_code); });
    const poKratici = new Map();
    videne.forEach(sifra => {
      const k = window.Izmene.kratica(sifra);
      if (!k || poKratici.has(k)) return;
      poKratici.set(k, {
        kratica: k,
        naziv: window.Izmene.naziv(sifra),
        cas: window.Izmene.cas(sifra),
        barva: window.Izmene.barva(sifra),
      });
    });
    const vrstniRed = window.Izmene.KRATICE.map(v => v[1]);
    return [...poKratici.values()].sort((a, b) => vrstniRed.indexOf(a.kratica) - vrstniRed.indexOf(b.kratica));
  }, [entries]);

  // Stolpec se pokaže samo, kadar za ta oddelek NZV nosilec sploh obstaja -
  // pri FLEXI in pri oddelkih brez nosilca bi bil prazen stolpec le šum.
  const imaNzvStolpec = Object.keys(nzvPoDnevih).length > 0;

  if (employees === null || entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;
  if (employees.length === 0) return <p className="sub" style={{marginTop:16}}>Za ta oddelek še ni dodeljenih zaposlenih.</p>;

  // Dnevi v vrsticah, osebe v stolpcih - kot uradna predloga "2026 SMS
  // RAZPORED" (posneta iz posnetkov zaslona uporabnika), ne osebe v
  // vrsticah/dnevi v stolpcih kot prej. Z realnim mesecem (do 31 vrstic) je
  // to tudi lažje pregledati na enem zaslonu kot 31 stolpcev. Druga vrstica
  // glave (vloga SMS/TZN ali DMS/DZN) je po vzoru iste predloge.
  return (
    <div className="wardPrintArea">
      <div className="wardScroller">
        <table className="wardTable wardTableT">
          <thead>
            <tr>
              <th className="name">Dan</th>
              {employees.map(z => (
                <th key={z.id} className={z.id === myId ? "me" : ""}>
                  <a href={"imenik.html?id=" + z.id} style={{color:"inherit", textDecoration:"none"}}>{priimekZacetnica(z.full_name)}</a>
                </th>
              ))}
              {imaNzvStolpec && <th className="nzvStolpec">NZV</th>}
            </tr>
            <tr className="vloga">
              <th className="name"></th>
              {employees.map(z => (
                <th key={z.id} className={z.id === myId ? "me" : ""}>{z.role === "user" ? "SMS / TZN" : "DMS / DZN"}</th>
              ))}
              {imaNzvStolpec && <th className="nzvStolpec">nosilec</th>}
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={isWeekend ? "weekend" : ""}>
                  <td className="name">{datumSlo(dn.datum)} {dn.dan}</td>
                  {employees.map(z => {
                    const zapis = byEmpDate[z.id + "|" + dn.datum];
                    const sifra = zapis && zapis.shift_code;
                    // FLEXI kader pokriva vsak dan lahko drug oddelek (tudi
                    // dva hkrati, npr. "C/E2") - brez te oznake bi bila
                    // celica videti kot navadna izmena in ne bi bilo
                    // razvidno, KJE ta dan dela.
                    // Oznaka nad izmeno: kateri oddelek oseba TA DAN pokriva.
                    // Pri FLEXI pride iz pokriva_oddelek (lahko dvojna oznaka
                    // "C/E2"), sicer pa iz oddelka vpisa - a le, kadar se
                    // razlikuje od oddelka, ki ga gledamo, da se navadni
                    // stolpci ne zasujejo z odvečno oznako.
                    // Samo prave oddelke: DEZ/NEDEZ/NZV/FLEXI so pripadnost
                    // skupini in ne povedo, kje oseba ta dan dela.
                    const pokrivaSurovo = zapis && (zapis.pokriva_oddelek
                      || (zapis.department_code !== deptCode ? zapis.department_code : null));
                    const pokriva = window.NzvZasedba.jeDelovisce(pokrivaSurovo) ? pokrivaSurovo : null;
                    // Barva je iz URADNE legende (izmene.js), enaka kot v
                    // Imenik -> Razpredelnica - prej je bila tu ena od
                    // sedmih grobih skupin, zato je bila ista izmena tu
                    // ena barva in tam druga. Besedilo v celici: delovne
                    // izmene s polnim nazivom ("Dopoldne"), odsotnosti in
                    // prosti dnevi s kratico ("LD", "KPU") - ta pogled ima
                    // sicer široke stolpce, a cel stavek "Letni dopust" bi
                    // jih razbil (uporabnikova odločitev, avgust 2026).
                    const barvaIzmene = window.Izmene.barva(sifra);
                    const opisIzmene = window.Izmene.naziv(sifra)
                      + (window.Izmene.cas(sifra) ? " · " + window.Izmene.cas(sifra) : "");
                    const isMe = z.id === myId;
                    return (
                      <td key={z.id} className={"cell" + (isMe ? " me" : "")}>
                        {/* Prej je bilo tu vedno kvečjemu 3 znake ("dop", "NOČ") in vsaka
                            "off" celica (KPU ALI resnično prazna) je pokazala isti "–" –
                            KPU se torej ni dalo ločiti od praznega dneva. Zdaj: prazna
                            celica ne izriše ničesar (kot v uradni predlogi "2026 SMS
                            RAZPORED"), vsaka druga pokaže celotno kodo. */}
                        {pokriva && <span className="pokriva" title={"Ta dan pokriva: " + pokriva}>{pokriva}</span>}
                        {sifra && (
                          <span className="swatch" title={opisIzmene}
                            style={{background: barvaIzmene, color: window.Izmene.barvaBesedila(barvaIzmene)}}>
                            {window.Izmene.nazivZaMrezo(sifra)}
                          </span>
                        )}
                      </td>
                    );
                  })}
                  {imaNzvStolpec && (
                    <td className="cell nzvStolpec">
                      {(nzvPoDnevih[dn.datum] || []).map(ime => (
                        <span key={ime} className="nzvNosilec" title={ime + " – nosilec oddelka " + deptCode + " ta dan (razpored NZV)"}>
                          {window.Imena.kratkoIme(ime)}
                        </span>
                      ))}
                    </td>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="li"><span className="dot" style={{background:"var(--dop)"}}></span>Dopoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--pop)"}}></span>Popoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--noc)"}}></span>Nočna</span>
        <span className="li"><span className="dot" style={{background:"var(--h12)"}}></span>12-urna</span>
        <span className="li"><span className="dot" style={{background:"var(--ld)"}}></span>Letni dopust (LD)</span>
        <span className="li"><span className="dot" style={{background:"var(--off)"}}></span>KPU / prosto</span>
        {imaNzvStolpec && <span className="li"><span className="dot" style={{background:"var(--accent)"}}></span>NZV – nosilec oddelka ta dan (iz razporeda NZV, z nadomeščanji)</span>}
      </div>
      <RazporedPodpisi entries={entries} />
    </div>
  );
}

// NZV: dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe kot pri
// WardView) - po uradni predlogi "Letni dopusti in omejitve za NZV". Celica
// = kdo pokriva to enoto ta dan (razpored.department_code je še
// vedno lahko ena od teh starih kod - glej supabase/schema.sql sekcija 23,
// namenoma niso izbrisane iz oddelki prav zaradi te uporabe). Ločeno
// od WardView, ker gre za popolnoma drugačno obliko (enote, ne osebe).
// Seznam enot je v skupnem nzv-zasedba.js, ker ga poleg tega prikaza
// potrebuje tudi generator (admin.html). Prej je bil samo tu in generator
// je zato delal po SVOJIH stolpcih - ena od stvari, zaradi katerih sta se
// prikaz in kreiranje razporeda razšla.
const NZV_ENOTE = window.NzvZasedba.ENOTE;
// "SA" nima nobenega samodejnega generatorja (za razliko od ostalih enot) -
// v uradni predlogi je razdeljena na dva stolpca (dopoldan/popoldan), zato
// tu isto razdelimo po vsebini shift_code (glej razvrstiSA spodaj), namesto
// da bi uvajali dva nova department_code (SA ostaja ena sama koda v bazi).
function razvrstiSA(sifra){
  const t = (sifra || "").toLowerCase();
  if (t.includes("pop")) return "SAPOP";
  return "SADOP"; // privzeto dopoldan, če ni prepoznano drugače
}
// Vrstni red stolpcev v uradni predlogi ima "SA DOP"/"SA POP" MED "DB" in
// "URGENCA" (ne na koncu, kot bi bil naiven vrstni red NZV_ENOTE+dodatek) -
// zato tu sestavimo pravi prikazni vrstni red ločeno od NZV_ENOTE (ki ostaja
// nespremenjen, ker ga poizvedba in uvoz uporabljata brez odvisnosti od
// vrstnega reda stolpcev).
const NZV_STOLPCI = window.NzvZasedba.STOLPCI;
// Zadnji trije stolpci uradne predloge ("LD", "IZOB", "BS") niso enote, ampak
// POVZETEK odsotnosti tega dne (glej odsotnosti.kind) - kdo je ta dan na
// letnem dopustu / strokovnem izobraževanju / bolniški. Isti vir kot Želje →
// Razpredelnica (zelje.html), tu prikazan skupaj s končnim razporedom, ker
// gre za "omejitve, ki se vežejo na razpored za določen mesec".
const NZV_KIND_KODA = window.NzvZasedba.KIND_KODA;

// Kdo sodi v NZV razpored, je v nzv-zasedba.js - isti nabor potrebuje
// tudi Imenik -> Razpredelnica, zato en sam vir.
const JE_NZV_VLOGA = new Set(window.NzvZasedba.VLOGE);

// Ujemanje imen med viri je v imena.js - en sam vir za vse zaslone.
// Prej je imel vsak svojo, drugače strogo različico (ta je npr. poznala
// potrjeni tipkarski napaki "Horvat"/"Tomažević", ni pa prenesla
// izgubljenih strešic - Imenik pa ravno obratno), zato se je ista oseba
// na enem zaslonu našla, na drugem pa ne.
const imenaSeUjemataNzv = window.Imena.seUjemata;
const kljucImenaNzv = window.Imena.kljuc;

// Naziv stolpca (kot v uradni predlogi) -> notranja koda. Skupno za izris,
// izvoz, uvoz IN pisanje nazaj, da se štirje kraji ne razidejo.
// Kode stolpcev NZV mreže (vključno z DEZ) - s tem se pokriva_oddelek bere
// samo takrat, ko res našteva stolpce te mreže.
const NZV_KODE_STOLPCEV = new Set([...NZV_STOLPCI.map(([k]) => k), "DEZ"]);

function nzvNazivVKodo(){
  const m = { "Dežurstvo": "DEZ", "DEŽURSTVO": "DEZ", "SA DOP": "SADOP", "SA POP": "SAPOP", "LD": "LD", "IZOB": "IZOB", "BS": "BS" };
  NZV_ENOTE.forEach(([koda, naziv]) => { m[naziv] = koda; });
  return m;
}

// Izmenična zasedba SA in prevod enot nosilca v stolpce mreže živita v
// nzv-zasedba.js - isto pravilo potrebuje tudi Imenik -> Razpredelnica,
// zato je en sam vir (enaka odločitev kot pri prazniki.js). Tu so samo
// kratki lokalni ovoji, da klici spodaj ostanejo berljivi.
const saNastavitveIz = window.NzvZasedba.saNastavitveIz;
const saStolpec = window.NzvZasedba.saStolpec;
function nzvEnoteVKode(enote, saKoda){
  return window.NzvZasedba.enoteVKode(enote, saKoda, NZV_STOLPCI.map(([k]) => k));
}

// Skupno nalaganje podatkov za izris/izvoz/pisanje-nazaj NZV pogleda -
// "podatki" = { "KODA|datum": "parafa, parafa2" } za vse enote + DEZ +
// LD/IZOB/BS (iz odsotnosti, ujemano po imenu na profili).
async function nalozizPodatkeNzv(startISO, endISO){
  const kode = [...NZV_ENOTE.map(([k]) => k), "SA", "DEZ"];
  const [{ data: entries }, { data: dopusti }, { data: profili }, { data: vodje }, { data: nadomescanja }, { data: nastavitveVrstice }] = await Promise.all([
    // "profili!employee_id(...)" in NE samo "profili(...)": razpored
    // ima TRI tuje ključe na profili (employee_id, created_by, updated_by -
    // zadnja dva dodana pozneje, sekcija 30 sheme). Ob nedoločenem vgnezdenem
    // branju PostgREST ne more vedeti, po katerem naj pripne, in vrne napako
    // namesto vrstic - posledica je bila PRAZNA NZV mreža (enote in
    // DEŽURSTVO), medtem ko je stolpec LD deloval, ker se bere iz
    // odsotnosti prek ločene poizvedbe. Namig mora ostati tudi ob
    // morebitnem preimenovanju omejitve, zato je vezan na IME STOLPCA, ne na
    // ime tujega ključa.
    // "pokriva_oddelek": ista oseba je isti dan pogosto na več enotah
    // (Džamastagić PDZN + SOBO + U2). Baza dovoli en zapis na osebo in dan,
    // zato so dodatne enote zapisane tu (glej zdruziNzvZapise). Brez branja
    // tega stolpca bi se v mreži videla samo prva enota. V starejših bazah
    // stolpca še ni - takrat poizvedbo ponovimo brez njega, da mreža deluje
    // kot prej, namesto da bi ostala prazna.
    client.from("razpored").select("department_code, pokriva_oddelek, work_date, shift_code, created_at, created_by, updated_at, profili!employee_id(full_name, role, parafa, parafa_pred_oktobrom_2026)")
      .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO)
      .then(r => r.error
        ? client.from("razpored").select("department_code, work_date, shift_code, created_at, created_by, updated_at, profili!employee_id(full_name, role, parafa, parafa_pred_oktobrom_2026)")
            .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO)
        : r),
    client.from("odsotnosti").select("full_name, work_date, kind")
      .in("kind", ["ld", "sti", "bs"]).gte("work_date", startISO).lte("work_date", endISO),
    client.from("profili").select("full_name, role, parafa, parafa_pred_oktobrom_2026"),
    // Nosilci enot in seznam pokrivanj - vir izpeljane prisotnosti spodaj.
    // Če stolpca/tabele (še) ni, PostgREST vrne napako in data = null;
    // "|| []" spodaj poskrbi, da mreža v tem primeru dela kot prej (samo
    // objavljeni vnosi), namesto da bi se sesula.
    // select("*") in ne naštetih stolpcev: pregled odstopanj potrebuje tudi
    // dezurstvo_dovoljeno (kdo je v krogu dežurnih), tabela pa dobiva nove
    // stolpce sproti. Z naštevanjem bi manjkajoč stolpec vrnil napako in
    // mreža bi ostala prazna, namesto da bi samo izpustila eno preverbo.
    client.from("nosilci_oddelkov").select("*"),
    client.from("nadomescanja").select("*"),
    client.from("nzv_nastavitve").select("kljuc, vrednost"),
  ]);
  const saNast = saNastavitveIz(nastavitveVrstice);
  const podatki = {};
  // Katere celice so IZPELJANE (ne izrecno objavljene) - za bledejši izris
  // in za pojasnilo pod mrežo. Izvoz in pisanje v Sheets uporabljata samo
  // "podatki", ker gre tam za isto vsebino, le brez oblikovanja.
  const izpeljano = {};
  const objavljeno = new Set(); // "koda|datum" celice, ki imajo izrecen vnos - izpeljava vanje ne piše
  const zeVpisan = new Set(); // "kljucImenaNzv|datum" - kdo je že v mreži iz objavljenega razporeda
  (entries || []).forEach(r => {
    if (!r.profili) return;
    // Delovnik NZV je PON-PET; sobota in nedelja sta prosti, razen če je
    // oseba tisti dan DEŽURNA. Isto pravilo kot nzvPrikaz v "Moj
    // razpored" - brez njega je mreža ob vikendih kazala vodje na
    // enotah, čeprav takrat ne delajo.
    if (window.Prazniki.jeDelaProstDan(r.work_date) && classify(r.shift_code) !== "dez"
        && r.department_code !== "DEZ") return;
    // V NZV razporedu so SAMO vodje in administratorji (uporabnikova
    // izrecna zahteva). Brez tega filtra se je mreža polnila z oddelčnim
    // kadrom: kode B/C/C1/D/E1/E2 so hkrati oddelki SMS/TZN kadra IN imena
    // stolpcev v NZV predlogi, zato je stolpec "D" prikazal vseh devet
    // sester oddelka D namesto vodij, ki to enoto tisti dan pokrivajo.
    if (!JE_NZV_VLOGA.has(r.profili.role)) return;
    const parafa = parafaOd(r.profili, r.work_date);
    zeVpisan.add(kljucImenaNzv(r.profili.full_name) + "|" + r.work_date);
    // Vse enote te osebe za ta dan: primarna iz department_code, dodatne iz
    // pokriva_oddelek. Dežurstvo se prebere iz IZMENE in ne iz oddelka -
    // dežurni vodja je med tednom hkrati na svoji enoti, zato njegov zapis
    // nosi enoto v department_code, dežurstvo pa v shift_code.
    // Če je pokriva_oddelek izpolnjen, je v njem CEL seznam stolpcev tega
    // dne in je merodajen; department_code je takrat le prvi od njih.
    // Sicer (starejši zapisi, en sam stolpec) velja department_code, pri SA
    // pa se dopoldan/popoldan razbere iz izmene.
    const izPokrivanja = String(r.pokriva_oddelek || "").split(/[\/,+]/)
      .map(x => x.trim().toUpperCase()).filter(x => NZV_KODE_STOLPCEV.has(x));
    const primarna = r.department_code === "SA" ? razvrstiSA(r.shift_code) : r.department_code;
    const kodeVrstice = izPokrivanja.length ? izPokrivanja.slice() : [primarna];
    if (classify(r.shift_code) === "dez" && kodeVrstice.indexOf("DEZ") < 0) kodeVrstice.push("DEZ");
    kodeVrstice.forEach(k => {
      const key = k + "|" + r.work_date;
      objavljeno.add(key);
      const ze = (podatki[key] || "").split(", ").filter(Boolean);
      if (ze.indexOf(parafa) < 0) podatki[key] = ze.concat([parafa]).join(", ");
    });
  });
  (dopusti || []).forEach(d => {
    const koda = NZV_KIND_KODA[d.kind];
    if (!koda) return;
    // Odsotnost (LD/IZOB/BS) se prav tako vodi samo za delovne dni -
    // "letni dopust v soboto" ni stvar; vikend je prost sam po sebi.
    if (window.Prazniki.jeDelaProstDan(d.work_date)) return;
    const ujem = (profili || []).find(p => imenaSeUjemataNzv(p.full_name, d.full_name));
    // Isto pravilo kot za enote zgoraj: stolpci LD/IZOB/BS uradne predloge
    // se nanašajo na NZV kader, ne na oddelčne sestre. Oseba, ki je v
    // odsotnosti, a je ni med vodji/administratorji, sem ne sodi.
    if (!ujem || !JE_NZV_VLOGA.has(ujem.role)) return;
    const parafa = parafaOd(ujem, d.work_date);
    const key = koda + "|" + d.work_date;
    podatki[key] = podatki[key] ? podatki[key] + ", " + parafa : parafa;
  });

  // ---- Izpeljana prisotnost nosilcev enot -------------------------------
  // Mreža se je doslej polnila IZKLJUČNO iz objavljenih razpored,
  // zato so stolpci enot (PDZN, SOBO, MO, ŽO …) ostajali prazni: za vodje
  // se dnevni razpored ne objavlja - njihova enota je stalna in znana iz
  // nosilci_oddelkov.enote (glej supabase/nzv-nosilci-oddelkov.sql).
  // Zato jo tu izpeljemo: nosilec je na svoji enoti vsak DELOVNI dan, ob
  // njegovi odsotnosti pa se vpiše nadomeščevalec iz tabele nadomescanja
  // (prvi po "prednost", ki tisti dan ni tudi sam odsoten).
  //
  // Izrecno objavljen vnos ima VEDNO prednost - izpeljava zapolni samo
  // prazne celice in nikoli ne podvoji osebe, ki je tisti dan že v mreži.
  // Kaj bi po PRAVILIH nadomeščanja moralo biti na posamezni enoti - ne
  // glede na to, ali je za tisti dan objavljen razpored ali ne. Iz tega se
  // spodaj izračunajo odstopanja (glej odstopanjaNzv).
  const poPravilu = {};
  // Enote, kjer je poleg izbranega sprejemljiv še kdo drug (enaka prednost).
  const dopustno = {};
  // Kdo je kateri dan odsoten (po parafah) - glej odstopanjaNzv.
  const odsotniPoDnevih = {};
  const nosilci = (vodje || []).filter(v => v.enote);
  if (nosilci.length) {
    const profilZaIme = ime => (profili || []).find(p => imenaSeUjemataNzv(p.full_name, ime));
    // Kdo je kdaj odsoten: posamezni dnevi iz odsotnosti (LD/IZOB/BS) +
    // daljša odsotnost iz nosilci_oddelkov (npr. porodniška do julija 2027).
    const odsotenDan = new Set();
    (dopusti || []).forEach(d => odsotenDan.add(kljucImenaNzv(d.full_name) + "|" + d.work_date));
    const vodjaZaIme = {};
    (vodje || []).forEach(v => { vodjaZaIme[kljucImenaNzv(v.full_name)] = v; });
    const jeOdsotenNa = (ime, datum) => {
      if (odsotenDan.has(kljucImenaNzv(ime) + "|" + datum)) return true;
      return window.NzvZasedba.trajnoOdsoten(vodjaZaIme[kljucImenaNzv(ime)], datum);
    };
    // Kdo je kateri dan odsoten - po parafah, za pregled odstopanj.
    // Če je oseba tisti dan odsotna IN vpisana v razpored, to ni "napačna
    // enota", ampak protislovje: na dopustu in hkrati na delu.
    daysInRange(startISO, endISO).forEach(dn => {
      if (window.Prazniki.jeDelaProstDan(dn.datum)) return;
      nosilci.forEach(v => {
        if (!jeOdsotenNa(v.full_name, dn.datum)) return;
        const profil = profilZaIme(v.full_name);
        if (!profil) return;
        (odsotniPoDnevih[dn.datum] = odsotniPoDnevih[dn.datum] || new Set())
          .add(parafaOd(profil, dn.datum));
      });
    });

    // Enoto lahko pokriva VEČ nosilcev hkrati (URGENCA: Bizjak, Trpin,
    // Mušič) - zato se izpeljane parafe seštevajo, tako kot se seštevajo
    // objavljeni vnosi. V celico z izrecnim vnosom pa izpeljava ne piše:
    // objavljen razpored je merodajen in ga izpeljana "stalna zasedba" ne
    // sme dopolnjevati.
    const vpisiIzpeljano = (koda, datum, parafa) => {
      const key = koda + "|" + datum;
      if (objavljeno.has(key)) return;
      const ze = podatki[key];
      if (ze && ze.split(", ").indexOf(parafa) >= 0) return;
      podatki[key] = ze ? ze + ", " + parafa : parafa;
      izpeljano[key] = true;
    };

    const veljavneKode = NZV_STOLPCI.map(([k]) => k);
    daysInRange(startISO, endISO).forEach(dn => {
      if (window.Prazniki.jeDelaProstDan(dn.datum)) return;
      // Kdo je ta dan na kateri enoti (vključno s preselitvijo ob
      // odsotnosti in prevzemom zapuščene enote) - eno samo pravilo v
      // nzv-zasedba.js, glej razporedDneva.
      const dneva = window.NzvZasedba.razporedDnevaPodrobno({
        nosilci,
        pari: nadomescanja || [],
        kljuc: kljucImenaNzv,
        jeOdsoten: ime => jeOdsotenNa(ime, dn.datum),
        saKoda: saStolpec(dn.datum, saNast),
        veljavne: veljavneKode,
      });
      // Kjer ima več nadomeščevalcev isto prednost, je katera koli od njih
      // pravilna ("Humar je prva SA, nadomesti jo Trpin ali Bizjak - se
      // določi sproti"). Razpored izbere prvo, pregled odstopanj pa mora
      // sprejeti vse, sicer javi napako pri vsaki, ki ni bila izbrana.
      Object.keys(dneva.enakovredni || {}).forEach(koda => {
        const kljuc = kljucOdstopanja(koda) + "|" + dn.datum;
        const ze = dopustno[kljuc] = dopustno[kljuc] || new Set();
        dneva.enakovredni[koda].forEach(ime => {
          const profil = profilZaIme(ime);
          if (profil) ze.add(parafaOd(profil, dn.datum));
        });
      });
      dneva.vrstice.forEach(({ nosilec, kode }) => {
        const profil = profilZaIme(nosilec.full_name);
        if (!profil || !JE_NZV_VLOGA.has(profil.role)) return;
        const parafa = parafaOd(profil, dn.datum);
        // Pričakovanje po pravilu se zabeleži VEDNO, tudi kadar je oseba
        // tisti dan že objavljena drugje - prav ta primer je odstopanje
        // ("po pravilu bi moral biti na E1, v razporedu je na D").
        const zaDan = poPravilu[dn.datum] = poPravilu[dn.datum] || {};
        const zaOsebo = zaDan[parafa] = zaDan[parafa] || new Set();
        kode.forEach(koda => zaOsebo.add(kljucOdstopanja(koda)));
        // Kdor je tisti dan že v mreži iz objavljenega razporeda, se ne
        // podvoji - objava je merodajna.
        if (zeVpisan.has(kljucImenaNzv(nosilec.full_name) + "|" + dn.datum)) return;
        kode.forEach(koda => vpisiIzpeljano(koda, dn.datum, parafa));
      });
    });
  }
  const preglednica = odstopanjaNzv({
    podatki, poPravilu, dopustno, odsotniPoDnevih, nosilci, startISO, endISO,
    profilZaIme: ime => (profili || []).find(p => imenaSeUjemataNzv(p.full_name, ime)),
  });
  return { podatki, entries: entries || [], izpeljano, saNast,
           odstopanja: preglednica.odstopanja, enoteBrezNosilca: preglednica.brezNosilca };
}

// SA DOP in SA POP štejeta pri primerjavi kot ENA enota. Kateri teden je
// dopoldanski, je nastavitev (nzv_nastavitve.sa_liho_teden) in ne trdo
// dejstvo; če bi ju ločevali, bi vsak teden javljalo lažno odstopanje.
function kljucOdstopanja(koda){
  return koda === "SADOP" || koda === "SAPOP" ? "SA" : koda;
}

// Enote, ki jih pravilo nadomeščanja NE pokriva in jih zato ne primerjamo:
// dežurstvo ima svoj generator, LD/IZOB/BS pa so odsotnosti, ne enote.
const ODSTOPANJA_PRESKOCI = new Set(["DEZ", "LD", "IZOB", "BS"]);

// Enote, ki jih po dogovoru OBČASNO pokrije kdor koli iz kroga dežurnih.
// Uporabnikova navedba, avgust 2026: "urgenco občasno pokrivamo vsi, ki
// dežuramo ... zato je tako". Vpis takega človeka tam torej ni napaka, in
// pravila zanj ni mogoče vnaprej zapisati - odloči se sproti.
//
// Kdo je v krogu, pove nosilci_oddelkov.dezurstvo_dovoljeno (isti podatek,
// po katerem se sestavlja razpored dežurstev).
const ENOTE_KROGA_DEZURNIH = new Set(["URGENCA"]);

// Kje se objavljen razpored razhaja s pravili nadomeščanja.
//
// Uporabnikova odločitev (avgust 2026): merodajna so PRAVILA, objavljen
// razpored (uvožen iz uradne preglednice) pa se ne popravlja sam od sebe -
// odstopanja se samo pokažejo, da jih administrator lahko pregleda.
//
// Primerjamo PO OSEBI in ne po celici. Razlog: nekateri nosilci imajo
// sestavljeno enoto ("UA/SA" = URGENCA in SA), kar pomeni "dela na eni od
// teh", ne "hkrati na obeh". Primerjava po celici je zato vsak dan javila
// lažno "manjka" na tisti od obeh, kjer osebe tisti dan ni bilo - v
// septembru 2026 je bilo takih 41 od 102 javljenih odstopanj.
//
// Vrste, ker ne pomenijo istega:
//   napacnaEnota  nosilec je na enoti, ki je pravilo zanj ne predvideva
//   niVRazporedu  pravilo ga postavi na enoto, v razporedu pa ga ni nikjer
//   nepokrita     enota z nosilcem, ki tisti dan nima nikogar
// FLEXI (kdor sploh ni nosilec enote) se NE šteje: vpisuje se ročno
// (uporabnikova odločitev), zato je v pregledu le kot pripis.
function odstopanjaNzv(opts){
  const podatki = opts.podatki, poPravilu = opts.poPravilu, nosilci = opts.nosilci;
  const dopustno = opts.dopustno || {};
  const odsotniPoDnevih = opts.odsotniPoDnevih || {};
  const startISO = opts.startISO, endISO = opts.endISO, profilZaIme = opts.profilZaIme;

  const parafeNosilcev = new Set();
  // Kdo je v krogu dežurnih - ti smejo občasno pokriti URGENCO.
  const parafeDezurnih = new Set();
  (nosilci || []).forEach(v => {
    const profil = profilZaIme(v.full_name);
    if (!profil) return;
    const parafa = parafaOd(profil, startISO);
    parafeNosilcev.add(parafa);
    if (v.dezurstvo_dovoljeno) parafeDezurnih.add(parafa);
  });

  // Enote, ki jih po nosilci_oddelkov sploh nima nihče (npr. U2, SA POP).
  // Zanje pravila NI, zato vpis tam ni odstopanje - to je vrzel v podatkih
  // o nosilcih in ne napaka v razporedu. Povemo jo posebej, enkrat.
  const zNosilcem = new Set();
  (nosilci || []).forEach(v => nzvEnoteVKode(v.enote, "SADOP")
    .forEach(k => zNosilcem.add(kljucOdstopanja(k))));
  const brezNosilca = NZV_STOLPCI.map(([k]) => k)
    .filter(k => !ODSTOPANJA_PRESKOCI.has(k) && !zNosilcem.has(kljucOdstopanja(k)))
    .map(k => kljucOdstopanja(k));
  const brezNosilcaSet = new Set(brezNosilca);

  const nazivEnote = {};
  NZV_STOLPCI.forEach(([k, naziv]) => { nazivEnote[kljucOdstopanja(k)] = kljucOdstopanja(k) === "SA" ? "SA" : naziv; });

  const out = [];
  daysInRange(startISO, endISO).forEach(dn => {
    if (window.Prazniki.jeDelaProstDan(dn.datum)) return;
    // Kje je kdo DEJANSKO (po objavljenem razporedu oz. izpeljavi).
    const dejansko = {};
    const vEnoti = {};
    NZV_STOLPCI.forEach(([k]) => {
      if (ODSTOPANJA_PRESKOCI.has(k)) return;
      const enota = kljucOdstopanja(k);
      const parafe = (podatki[k + "|" + dn.datum] || "").split(",").map(x => x.trim()).filter(Boolean);
      (vEnoti[enota] = vEnoti[enota] || []).push(...parafe);
      parafe.forEach(par => { (dejansko[par] = dejansko[par] || new Set()).add(enota); });
    });
    // Kje bi kdo moral biti PO PRAVILU.
    const pravilo = poPravilu[dn.datum] || {};

    Object.keys(pravilo).forEach(par => {
      const naj = pravilo[par], je = dejansko[par] || new Set();
      if (!naj.size) return;
      if (!je.size) {
        out.push({ vrsta: "niVRazporedu", datum: dn.datum, oseba: par,
                   poPravilu: [...naj].sort(), vRazporedu: [] });
      }
    });
    Object.keys(dejansko).forEach(par => {
      if (!parafeNosilcev.has(par)) return;         // FLEXI - ročno, ni odstopanje
      // Na dopustu (ali bolniški) IN hkrati v razporedu - to ni vprašanje
      // prave enote, ampak protislovje v samem razporedu. Zato svoja vrsta,
      // sicer se pokaže kot nerazumljivo "po pravilu: -".
      if ((odsotniPoDnevih[dn.datum] || new Set()).has(par)) {
        out.push({ vrsta: "odsotenAVRazporedu", datum: dn.datum, oseba: par,
                   poPravilu: [], vRazporedu: [...dejansko[par]].sort() });
        return;
      }
      const naj = pravilo[par] || new Set();
      // Enote brez nosilca (U2) izpustimo: pravila zanje ni, zato vpis tam
      // ne more biti "napačen".
      const napacne = [...dejansko[par]].filter(e => {
        if (naj.has(e) || brezNosilcaSet.has(e)) return false;
        // URGENCO občasno pokrije kdor koli iz kroga dežurnih - dogovor,
        // ne razpored, zato tega ni mogoče vnaprej zapisati kot pravilo.
        if (ENOTE_KROGA_DEZURNIH.has(e) && parafeDezurnih.has(par)) return false;
        // Enakovreden nadomeščevalec za to enoto ta dan - ni napaka.
        const dop = dopustno[e + "|" + dn.datum];
        return !(dop && dop.has(par));
      });
      if (!napacne.length) return;
      out.push({ vrsta: "napacnaEnota", datum: dn.datum, oseba: par,
                 poPravilu: [...naj].sort(), vRazporedu: [...dejansko[par]].sort(),
                 napacne: napacne.sort() });
    });
    Object.keys(vEnoti).forEach(enota => {
      if (brezNosilcaSet.has(enota)) return;
      if (vEnoti[enota].length) return;
      out.push({ vrsta: "nepokrita", datum: dn.datum, enota: nazivEnote[enota] || enota });
    });
  });
  out.sort((a, b) => a.datum.localeCompare(b.datum)
    || String(a.oseba || a.enota).localeCompare(String(b.oseba || b.enota)));
  return { odstopanja: out, brezNosilca: brezNosilca.map(k => nazivEnote[k] || k) };
}

// Administrator ureja izmenično zasedbo SA kar nad mrežo, kjer je učinek
// takoj viden - dve kratki kontroli, brez posebnega zaslona z nastavitvami.
// Vsi ostali vidijo isto pravilo zapisano v razlagi pod mrežo.
function SaNastavitveUrejanje({ saNast, naShranjeno }){
  const [lihoTeden, setLihoTeden] = useState(saNast.lihoTeden);
  const [meseci, setMeseci] = useState((saNast.poletniMeseci || []).join(","));
  const [busy, setBusy] = useState(false);
  const [napaka, setNapaka] = useState(null);

  const spremenjeno = lihoTeden !== saNast.lihoTeden
    || meseci.replace(/\s/g, "") !== (saNast.poletniMeseci || []).join(",");

  const shrani = async () => {
    setBusy(true); setNapaka(null);
    const ocisceni = meseci.split(",").map(x => Number(x.trim()))
      .filter(n => n >= 1 && n <= 12).join(",");
    const { error } = await client.from("nzv_nastavitve").upsert([
      { kljuc: "sa_liho_teden", vrednost: lihoTeden },
      { kljuc: "sa_poletni_meseci", vrednost: ocisceni },
    ], { onConflict: "kljuc" });
    setBusy(false);
    if (error) {
      // Tabele še ni -> administrator mora pognati SQL. Povemo katerega.
      const manjkaTabela = error.code === "42P01" || /does not exist|schema cache/i.test(error.message || "");
      setNapaka(manjkaTabela
        ? "Tabele nzv_nastavitve še ni – v Supabase poženi supabase/nzv-nastavitve.sql."
        : (error.message || "Shranjevanje ni uspelo."));
      return;
    }
    setMeseci(ocisceni);
    naShranjeno();
  };

  return (
    <div className="saNastavitve">
      <span>SA se izmenjuje tedensko: v <b>lihem</b> tednu</span>
      <select value={lihoTeden} onChange={e => setLihoTeden(e.target.value)}>
        <option value="dop">dopoldne</option>
        <option value="pop">popoldne</option>
      </select>
      <span>· poleti samo dopoldne v mesecih</span>
      <input value={meseci} onChange={e => setMeseci(e.target.value)}
        placeholder="7,8" size={6} inputMode="numeric" aria-label="Poletni meseci, ločeni z vejico" />
      <button className="btn btn-ghost btn-sm" disabled={!spremenjeno || busy} onClick={shrani}>
        {busy ? "Shranjujem …" : "Shrani"}
      </button>
      {napaka && <span className="napaka">{napaka}</span>}
    </div>
  );
}

// Berljiv opis ene vrstice odstopanja.
function opisOdstopanja(o){
  if (o.vrsta === "nepokrita") return "enota " + o.enota + " ta dan nima nikogar";
  if (o.vrsta === "odsotenAVRazporedu") {
    return o.oseba + ": ta dan je označen kot odsoten (dopust/bolniška), a je vpisan na "
      + o.vRazporedu.join(", ");
  }
  if (o.vrsta === "niVRazporedu") {
    return o.oseba + ": po pravilu na " + o.poPravilu.join(" / ") + ", v razporedu ga ni nikjer";
  }
  return o.oseba + ": v razporedu na " + o.napacne.join(", ")
    + (o.poPravilu.length ? ", po pravilu na " + o.poPravilu.join(" / ") : ", pravilo zanj tega dne ne predvideva enote");
}

// Pregled mest, kjer se objavljen razpored ne drži pravil nadomeščanja.
//
// Zakaj samo pregled in ne samodejni popravek: objavljen razpored je
// uradni dokument, ki ga pripravi in podpiše človek. Aplikacija ga zato ne
// prepisuje sama - pokaže pa, kje se razhaja s pravili, da administrator
// odloči (uporabnikova odločitev, avgust 2026).
function OdstopanjaNzv({ odstopanja, brezNosilca }){
  const [odprto, setOdprto] = useState(false);
  const opomba = brezNosilca && brezNosilca.length ? (
    <p className="sub" style={{margin:"6px 0 0"}}>
      Za {brezNosilca.length === 1 ? "enoto" : "enote"} <b>{brezNosilca.join(", ")}</b> v
      Imeniku ni nosilca, zato zanje pravila nadomeščanja ni – vpisi tam se ne preverjajo.
    </p>
  ) : null;
  if (!odstopanja || !odstopanja.length) {
    return (
      <div style={{margin:"8px 0 12px"}}>
        <p className="sub" style={{margin:0}}>✓ Razpored se povsod drži pravil nadomeščanja.</p>
        {opomba}
      </div>
    );
  }
  const stevec = { napacnaEnota: 0, niVRazporedu: 0, nepokrita: 0, odsotenAVRazporedu: 0 };
  odstopanja.forEach(o => { stevec[o.vrsta]++; });
  const povzetek = [
    stevec.nepokrita ? `${stevec.nepokrita}× enota brez nikogar` : null,
    stevec.napacnaEnota ? `${stevec.napacnaEnota}× na drugi enoti, kot pravi pravilo` : null,
    stevec.niVRazporedu ? `${stevec.niVRazporedu}× po pravilu bi moral delati, a ga ni v razporedu` : null,
    stevec.odsotenAVRazporedu ? `${stevec.odsotenAVRazporedu}× na dopustu in hkrati v razporedu` : null,
  ].filter(Boolean).join(" · ");
  return (
    <div className="opozorilnoPolje" style={{margin:"8px 0 12px"}}>
      <button className="btn btn-ghost btn-sm" onClick={() => setOdprto(v => !v)}>
        ⚠ Odstopanj od pravil nadomeščanja: {odstopanja.length} {odprto ? "▲" : "▼"}
      </button>
      <div className="sub" style={{marginTop:6}}>{povzetek}</div>
      {opomba}
      {odprto && (
        <div style={{overflowX:"auto", marginTop:10}}>
          <p className="sub" style={{margin:"0 0 8px"}}>
            Objavljen razpored ostane nespremenjen – to je samo pregled. FLEXI kader
            (kdor ni nosilec enote) se ne preverja, ker se vpisuje ročno.
          </p>
          <table className="wardTable" style={{minWidth:520}}>
            <thead>
              <tr><th className="name">Datum</th><th>Kdo / kaj</th><th>Po pravilu</th><th>V razporedu</th></tr>
            </thead>
            <tbody>
              {odstopanja.map((o, i) => (
                <tr key={i}>
                  <td className="name">{datumSlo(o.datum)}</td>
                  <td>{o.vrsta === "nepokrita" ? <b>{o.enota}</b> : <b>{o.oseba}</b>}</td>
                  <td>{o.vrsta === "nepokrita" ? "vsaj en nosilec"
                        : o.vrsta === "odsotenAVRazporedu" ? "odsoten (dopust/bolniška)"
                        : (o.poPravilu.join(", ") || "–")}</td>
                  <td>{o.vrsta === "nepokrita" ? "nihče"
                        : (o.vRazporedu && o.vRazporedu.length ? o.vRazporedu.join(", ") : "nikjer")}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Urejanje NZV mreže v aplikaciji.
//
// Zakaj: doslej NZV razporeda v aplikaciji ni bilo mogoče vnesti - mreža je
// bila samo za gledanje, zato je razpored nastajal v Excelu in se uvažal.
// Vse napake, ki smo jih lovili (izpadla oseba, dopust in razpored hkrati,
// napačno zapisana glava, ista oseba na dveh enotah), izvirajo iz tega, da
// Excel ne pozna pravil in ne ve, kdo manjka.
//
// Odslej: aplikacija predlaga mesec iz pravil, človek popravi izjeme,
// Excel pa nastane šele na koncu kot podpisan dokument (izvoz že obstaja).
//
// Uporabnikova odločitev (avgust 2026): opozori, a DOVOLI. Marsikaj se
// določi sproti in izjeme so normalne, zato vpis nikoli ni onemogočen -
// celica le pove, kaj ni v skladu s pravili.
// Kaj je s to celico narobe - preverbe, ki jih je mogoče narediti SPROTI,
// medtem ko človek tipka (polni pregled odstopanj se osveži po objavi).
//
// Namenoma ne prepreči vpisa: uporabnikova odločitev je "opozori, a dovoli".
function opozoriloCelice(besedilo, datum, poParafi, odsotni){
  if (!poParafi) return null;
  const parafe = String(besedilo || "").split(",").map(x => x.trim()).filter(Boolean);
  const neznane = parafe.filter(p => !poParafi[p.toUpperCase()]);
  if (neznane.length) return "Ne poznam parafe: " + neznane.join(", ");
  const naDopustu = parafe.filter(p => (odsotni[datum] || new Set()).has(p.toUpperCase()));
  if (naDopustu.length) {
    return naDopustu.join(", ") + " je ta dan na dopustu oz. bolniški – preveri, ali je vpis pravilen.";
  }
  return null;
}

function nzvUrejanjeStanje({ month, podatki, izpeljano, days, naObjavljeno }){
  const [urejeno, setUrejeno] = useState({});   // "koda|datum" -> besedilo celice
  const [busy, setBusy] = useState(false);
  const [sporocilo, setSporocilo] = useState(null);
  const [napaka, setNapaka] = useState(null);
  const [poParafi, setPoParafi] = useState(null);
  const [nzvIdji, setNzvIdji] = useState([]);   // brisanje se sme dotakniti SAMO teh
  const [odsotni, setOdsotni] = useState({});   // datum -> Set(parafa)

  const { startISO, endISO } = monthRange(month);
  const KODE = useMemo(() => NZV_STOLPCI.map(([k]) => k), []);

  useEffect(() => {
    let cancelled = false;
    setUrejeno({}); setSporocilo(null); setNapaka(null);
    Promise.all([
      client.from("profili").select("id, full_name, role, parafa, parafa_pred_oktobrom_2026"),
      client.from("odsotnosti").select("full_name, work_date, kind")
        .in("kind", ["ld", "sti", "bs"]).gte("work_date", startISO).lte("work_date", endISO),
    ]).then(([{ data: profili }, { data: dopusti }]) => {
      if (cancelled) return;
      // Samo NZV kader: parafa oddelčne sestre v tej mreži nima kaj iskati.
      const nzv = (profili || []).filter(p => JE_NZV_VLOGA.has(p.role));
      setPoParafi(parafaMapa(nzv, month).poParafi);
      setNzvIdji(nzv.map(p => p.id));
      const m = {};
      (dopusti || []).forEach(d => {
        const ujem = nzv.find(p => imenaSeUjemataNzv(p.full_name, d.full_name));
        if (!ujem) return;
        (m[d.work_date] = m[d.work_date] || new Set()).add(parafaOd(ujem, d.work_date));
      });
      setOdsotni(m);
    });
    return () => { cancelled = true; };
  }, [month, startISO, endISO]);

  const vrednost = (koda, datum) => {
    const k = koda + "|" + datum;
    return k in urejeno ? urejeno[k] : (podatki[k] || "");
  };
  const nastavi = (koda, datum, besedilo) => {
    setUrejeno(prej => Object.assign({}, prej, { [koda + "|" + datum]: besedilo }));
    setSporocilo(null); setNapaka(null);
  };

  // Predlog: izpeljane celice (aplikacija jih že računa iz pravil) postanejo
  // pravi vnos. Objavljenih celic ne dotakne - te je nekdo že potrdil.
  const predlagajMesec = () => {
    const m = {};
    Object.keys(izpeljano || {}).forEach(k => { if (podatki[k]) m[k] = podatki[k]; });
    setUrejeno(prej => Object.assign({}, m, prej));
    setSporocilo(`Predlaganih ${Object.keys(m).length} celic iz pravil. Preglej, popravi in objavi.`);
  };

  const spremenjenih = Object.keys(urejeno).filter(k => (urejeno[k] || "") !== (podatki[k] || "")).length;
  const predlaganih = Object.keys(urejeno).filter(k => izpeljano && izpeljano[k]).length;

  async function objavi(){
    if (!poParafi) return;
    setBusy(true); setNapaka(null); setSporocilo(null);
    try {
      const { zapisi, neznane } = nzvVnosiIzMreze({
        vrednost, datumi: days.map(d => d.datum), poParafi,
        kode: KODE.concat(["DEZ"]),   // dežurstvo se ohrani, sicer bi se ob objavi izgubilo
      });
      if (neznane.length) throw new Error("Teh paraf ne poznam: " + neznane.join(", ")
        + ". Popravi zapis ali nastavi parafo v Imeniku.");
      await shraniZapiseRazporeda(zapisi);
      // Kdor je bil prej v razporedu tega meseca, zdaj pa ga v mreži ni več,
      // mora iz razporeda izginiti - sicer bi ostal "duh" prejšnje objave.
      //
      // POZOR: omejitev na NZV kader je nujna, ne kozmetična. Kode stolpcev
      // NZV mreže (B, C, C1, D, E1, E2) so ISTE kot kode oddelkov SMS/TZN
      // kadra. Brisanje po samem department_code bi zato pobrisalo razpored
      // CELIH oddelkov za ta mesec, ne le vodij.
      const ostajajo = new Set(zapisi.map(z => z.employee_id + "|" + z.work_date));
      if (!nzvIdji.length) throw new Error("Ne najdem NZV kadra – objava prekinjena, da ne bi pobrisala razporeda oddelkov.");
      const { data: obstojeci, error: napakaBranja } = await client.from("razpored")
        .select("id, employee_id, work_date")
        .in("employee_id", nzvIdji)
        .gte("work_date", startISO).lte("work_date", endISO);
      if (napakaBranja) throw napakaBranja;
      const zaBrisanje = (obstojeci || [])
        .filter(r => !ostajajo.has(r.employee_id + "|" + r.work_date)).map(r => r.id);
      if (zaBrisanje.length) {
        const { error } = await client.from("razpored").delete().in("id", zaBrisanje);
        if (error) throw error;
      }
      setUrejeno({});
      setSporocilo(`Objavljeno: ${zapisi.length} vpisov`
        + (zaBrisanje.length ? `, odstranjenih ${zaBrisanje.length}` : "") + ".");
      naObjavljeno();
    } catch (e) {
      setNapaka(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }

  return { vrednost, nastavi, predlagajMesec, objavi, busy, sporocilo, napaka,
           spremenjenih, predlaganih, poParafi, odsotni,
           pripravljen: !!poParafi };
}

function NzvView({ month, profile }){
  const [podatki, setPodatki] = useState(null); // null dokler se ne naloži; { "koda|datum": "parafa, parafa2" }
  const [izpeljano, setIzpeljano] = useState({}); // iste ključe, a le za izpeljane celice (glej nalozizPodatkeNzv)
  const [saNast, setSaNast] = useState(null); // izmenična zasedba SA (glej saStolpec)
  const [odstopanja, setOdstopanja] = useState([]); // kje se objava razhaja s pravili nadomeščanja
  const [brezNosilca, setBrezNosilca] = useState([]); // enote, za katere pravila sploh ni
  const [osvezi, setOsvezi] = useState(0);
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setPodatki(null); setEntries(null);
    nalozizPodatkeNzv(startISO, endISO).then(({ podatki, entries, izpeljano, saNast, odstopanja, enoteBrezNosilca }) => {
      if (cancelled) return;
      setEntries(entries);
      setIzpeljano(izpeljano || {});
      setSaNast(saNast);
      setOdstopanja(odstopanja || []);
      setBrezNosilca(enoteBrezNosilca || []);
      setPodatki(podatki);
    });
    return () => { cancelled = true; };
  }, [startISO, endISO, osvezi]);

  // Odstopanja po celici - za oznako v mreži. FLEXI (samo "ročno") celice
  // NE označi: to ni napaka, ampak način dela (uporabnikova odločitev).
  // Katere CELICE naj mreža označi: tiste, kjer je nosilec na enoti, ki je
  // pravilo zanj ne predvideva, in tiste, ki so ostale brez nikogar.
  const odstopanjaPoCelici = useMemo(() => {
    const m = {};
    (odstopanja || []).forEach(o => {
      if (o.vrsta === "nepokrita") { m[o.enota + "|" + o.datum] = o; return; }
      if (o.vrsta !== "napacnaEnota") return;
      (o.napacne || []).forEach(e => { m[e + "|" + o.datum] = o; });
    });
    return m;
  }, [odstopanja]);

  // Klic je BREZ pogoja in pred vsakim zgodnjim izhodom - React zahteva,
  // da se stanja kličejo vedno v istem vrstnem redu.
  const ur = nzvUrejanjeStanje({
    month, podatki: podatki || {}, izpeljano, days,
    naObjavljeno: () => setOsvezi(k => k + 1),
  });
  const jeAdmin = !!(profile && profile.role === "admin");
  const [urejam, setUrejam] = useState(false);

  if (podatki === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div className="wardPrintArea">
      {jeAdmin && (
        <NzvUrejevalnik ur={ur} urejam={urejam} setUrejam={setUrejam} />
      )}
      <OdstopanjaNzv odstopanja={odstopanja} brezNosilca={brezNosilca} />
      {profile && profile.role === "admin" && saNast && (
        <SaNastavitveUrejanje saNast={saNast} naShranjeno={() => setOsvezi(k => k + 1)} />
      )}
      {urejam && jeAdmin && ur.poParafi && (
        <datalist id="nzvParafe">
          {Object.keys(ur.poParafi).sort().map(par => (
            <option key={par} value={par}>{ur.poParafi[par].full_name}</option>
          ))}
        </datalist>
      )}
      <div className="wardScroller">
        <table className="wardTable wardTableNzv">
          <thead>
            <tr>
              <th className="name">Datum</th>
              {NZV_STOLPCI.map(([koda, naziv]) => <th key={koda}>{naziv}</th>)}
              <th className="dez">Dežurstvo</th>
              <th>LD</th>
              <th>IZOB</th>
              <th>BS</th>
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={isWeekend ? "weekend" : ""}>
                  <td className="name">{datumSlo(dn.datum)} {dn.dan}</td>
                  {NZV_STOLPCI.map(([koda]) => {
                    const o = odstopanjaPoCelici[kljucOdstopanja(koda) + "|" + dn.datum];
                    const kljuc = koda + "|" + dn.datum;
                    if (urejam && jeAdmin && !isWeekend && !window.Prazniki.jeDelaProstDan(dn.datum)) {
                      const besedilo = ur.vrednost(koda, dn.datum);
                      const opomba = opozoriloCelice(besedilo, dn.datum, ur.poParafi, ur.odsotni);
                      return (
                        <td key={koda} className={"enotaCell" + (opomba ? " odstopanje" : "")}
                            title={opomba || undefined}>
                          <input type="text" value={besedilo} list="nzvParafe"
                            onChange={e => ur.nastavi(koda, dn.datum, e.target.value)}
                            aria-label={koda + " " + datumSlo(dn.datum)}
                            style={{width:"100%", minWidth:56, textAlign:"center", fontSize:12,
                                    padding:"3px 2px", border:"1px solid var(--line)",
                                    borderRadius:6, background:"var(--surface)", color:"var(--text)"}} />
                        </td>
                      );
                    }
                    return (
                    <td key={koda} title={o ? opisOdstopanja(o) : undefined}
                        className={"enotaCell"
                          + (izpeljano[kljuc] ? " izpeljano" : "")
                          + (o ? " odstopanje" : "")}>
                      {podatki[kljuc] || ""}
                    </td>
                    );
                  })}
                  <td className="enotaCell dez">{podatki["DEZ|" + dn.datum] || ""}</td>
                  <td className="enotaCell">{podatki["LD|" + dn.datum] || ""}</td>
                  <td className="enotaCell">{podatki["IZOB|" + dn.datum] || ""}</td>
                  <td className="enotaCell">{podatki["BS|" + dn.datum] || ""}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <InfoToggle>
        Celice prikazujejo parafe (Imenik → admin lahko nastavi natančno parafo osebe; brez nastavitve aplikacija
        sama izpelje grobo privzeto iz priimka). Enote/Dežurstvo prikazujejo, kdo pokriva katero enoto posamezen dan
        – iz objavljenega razporeda (Generator → NZV → Vodstvena pokritost/Dežurstva). LD/IZOB/BS prikazujejo
        odsotnosti (letni dopust/strokovno izobraževanje/bolniška) iz Želje → Razpredelnica za ta dan – to so
        omejitve, ki jih generator upošteva pri sestavi razporeda, tu prikazane skupaj s končnim razporedom za
        pregled na enem mestu. <b>Bledeje</b> zapisana parafa ni objavljen vnos, ampak izpeljana stalna zasedba:
        nosilec enote (Imenik → Razpredelnica → Nadomeščanja) je na svoji enoti vsak delovni dan, ob njegovi
        odsotnosti pa je prikazan njegov nadomeščevalec. Objavljen razpored ima vedno prednost pred izpeljavo.
        Stolpca <b>SA DOP</b> in <b>SA POP</b> se izmenjujeta tedensko (v poletnih mesecih je SA samo dopoldne) –
        administrator pravilo popravi v vrstici nad mrežo. <b>URGENCA 2 (U2)</b> nima samodejnega pravila: kdo je
        tam, določi administrator z objavo razporeda (uvoz iz Google Sheets, stolpec »U2«).
        Prazna celica pomeni, da enota nima nosilca in za ta dan ni objavljenega vnosa.
      </InfoToggle>
      <RazporedPodpisi entries={entries} />
    </div>
  );
}


// "Po oddelkih" je na izrecno navodilo omejen na 6 SMS/TZN oddelkov + FLEXI
// + en virtualen "NZV" (vodje/admin, dežurstva vključena) - ostali oddelki
// (DEZ, NEDEZ, PDZN, SOBO ...) tu niso na voljo, ne glede na vlogo.
const PO_ODDELKIH_KODE = ["B", "C", "C1", "D", "E1", "E2", "FLEXI"];

// Uvoz razporeda živi samo tu (ena sama, testirana pot za VSE skupine -
// 6 oddelkov + FLEXI + NZV), zavihek "Oddelki" v admin.html pa nanj
// napoti prek "index.html?uvoz=1&oddelek=…&mesec=…". Vrne null, kadar
// naslov tega ne zahteva; sicer {oddelek, mesec}, kjer je posamezno polje
// null, če vrednost ni veljavna - naslov je zunanji vhod (uporabnik ga
// lahko poljubno spremeni ali deli naprej), zato se oddelek preveri proti
// znanim kodam, mesec pa proti obliki YYYY-MM, namesto da bi se mu
// zaupalo. Neveljavna vrednost pomeni "uporabi privzeto", ne napake.
function preberiUvozIzNaslova(search){
  const p = new URLSearchParams(search || "");
  if (p.get("uvoz") !== "1") return null;
  const oddelek = (p.get("oddelek") || "").trim().toUpperCase();
  const mesec = (p.get("mesec") || "").trim();
  return {
    oddelek: (PO_ODDELKIH_KODE.includes(oddelek) || oddelek === "NZV") ? oddelek : null,
    mesec: /^\d{4}-(0[1-9]|1[0-2])$/.test(mesec) ? mesec : null,
  };
}

// ---------------------------------------------------------------------
// Uvoz iz Google Sheets (admin) – javna povezava ("vsak s povezavo lahko
// ogleda"), brez OAuth, isti mehanizem kot imenik.html (ImportUtils.
// preberiGoogleSheet). Namenoma ISTA oblika, ki jo ta stran tudi izvozi
// (glava "Datum, Dan, ..."), da je krog izvozi→uredi v Sheets→uvozi
// nazaj preprost in predvidljiv. Piše naravnost v razpored -
// dovoljeno samo adminu (RLS schedule_write_admin to tudi vsili na
// strežniku, ne samo tu).
// ---------------------------------------------------------------------
// Če stolpec pokriva_oddelek v bazi še ne obstaja (shema, razdelek 34 -
// supabase/dodaj-pokriva-oddelek.sql še ni bil pognan), Postgres zavrne
// CEL upsert. To ne sme pomeniti, da uvoz razporeda nenadoma sploh ne dela:
// v tem primeru zapise shranimo brez tega polja in to POVEMO, namesto da bi
// uporabnik dobil nerazumljivo napako o neznanem stolpcu.
let opozoriloPokrivaOddelek = null;
function jeManjkajocPokrivaOddelek(error){
  if (!error) return false;
  // 42703 = undefined_column; PostgREST vrne tudi PGRST204 s sporočilom o
  // stolpcu, ki ga ni v predpomnilniku sheme.
  return error.code === "42703" || error.code === "PGRST204"
    || /pokriva_oddelek/i.test((error.message || "") + (error.details || ""));
}
async function shraniZapiseRazporeda(zapisi){
  for (let i = 0; i < zapisi.length; i += 200) {
    const kos = zapisi.slice(i, i + 200);
    const { error } = await client.from("razpored").upsert(kos, { onConflict: "employee_id,work_date" });
    if (!error) continue;
    if (!jeManjkajocPokrivaOddelek(error)) throw error;
    opozoriloPokrivaOddelek = "Stolpca za pokriti oddelek (FLEXI) v bazi še ni, zato je razpored shranjen brez njega. "
      + "Administrator naj v Supabase požene supabase/dodaj-pokriva-oddelek.sql in uvoz ponovi.";
    const brez = kos.map(({ pokriva_oddelek, ...ostalo }) => ostalo);
    const { error: e2 } = await client.from("razpored").upsert(brez, { onConflict: "employee_id,work_date" });
    if (e2) throw e2;
  }
}

// Isti upsert vzorec kot zelje.html (odsotnosti, ključ full_name+work_date) -
// za NZV uvoz stolpcev LD/IZOB/BS (glej uvoziNzv).
async function shraniDopusteNzv(dopusti){
  for (let i = 0; i < dopusti.length; i += 200) {
    const { error } = await client.from("odsotnosti").upsert(dopusti.slice(i, i + 200), { onConflict: "full_name,work_date" });
    if (error) throw error;
  }
}

// dezurni_zdravniki (glej obdelajZdravnikiVrstice) - ključ work_date+kind, ni
// vezan na profile.id (zdravniki nimajo profila).
async function shraniZapiseZdravnikov(zapisi){
  for (let i = 0; i < zapisi.length; i += 200) {
    const { error } = await client.from("dezurni_zdravniki").upsert(zapisi.slice(i, i + 200), { onConflict: "work_date,kind" });
    if (error) throw error;
  }
}

// Uvoz uradnega PDF "Razporeditev zaposlenih v UA in DEŽ" (glej
// obdelajZdravnikiVrstice) - na voljo ne glede na izbrani oddelek/kontekst
// zgoraj, ker dezurni_zdravniki ni vezan na oddelek.
async function uvoziZdravnike(file, ciljniMesec){
  const { vrsteVrstic } = await window.ImportUtils.preberiDatoteko(file);
  if (!vrsteVrstic.length) throw new Error("Prazna datoteka.");
  const { zapisi, najdenDatum } = obdelajZdravnikiVrstice(vrsteVrstic, ciljniMesec);
  if (!najdenDatum) throw new Error(`V datoteki ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} - preveri, da gre za pravi mesečni dokument "Razporeditev zaposlenih v UA in DEŽ".`);
  await shraniZapiseZdravnikov(zapisi);
  return `Uvoženih ${zapisi.length} zapisov (dežurni zdravniki).`;
}

// Samo prava ISO oblika šteje za "vrstico s podatki" - podpisne vrstice na
// dnu izvoza ("Zadnja sprememba:", "Pripravil/-a:" …) imajo v prvem
// stolpcu besedilo, ki ga normalizirajDatum() vrne nespremenjeno (ni
// prepoznana oblika), zato golo "if (!datum)" ne bi zadostovalo za
// preskok teh vrstic pri uvozu.
const ISO_DATUM_RX = /^\d{4}-\d{2}-\d{2}$/;
// Vrstica vloge v realni predlogi ("SMS / TZN", "DMS / DZN") - uporabljeno
// za razločevanje "vrstice vloge" od "vrstice imen" pri iskanju glave bloka.
const VLOGA_RX = /SMS|DMS|TZN|DZN/i;

// Realni Google Sheets ("2026 SMS RAZPORED" ipd.) NISO en sam blok z eno
// glavo na vrhu - vsak oddelčni zavihek ima VEČ mesecev zloženih drug pod
// drugim, vsak s svojo glavo (imena, 2-3 vrstice nad prvim dnevom, glej
// najdiVrsticoImen) in podpisnim blokom na dnu. Ta funkcija sprehodi CELO
// datoteko, poišče vse strnjene sklope datumskih vrstic (en sklop = en
// mesečni blok), za vsak sklop poišče njegovo glavo, in vrne SAMO tiste
// dni, ki spadajo v [startISO, endISO] - to deluje ENAKO za realno
// večmesečno predlogo IN za enostavno enomesečno obliko, ki jo izvozi ta
// aplikacija (glej pripraviIzvoz).
function najdiVrsticoImen(vrsteVrstic, zacetekBloka){
  for (let i = zacetekBloka - 1, korakov = 0; i >= 0 && korakov < 6; i--, korakov++) {
    const vrstica = vrsteVrstic[i] || [];
    if (ISO_DATUM_RX.test(window.ImportUtils.normalizirajDatum(vrstica[0]))) return null; // prejšnji blok - obupaj
    const celica = (vrstica[2] || "").trim();
    if (!celica) continue; // prazna vrstica (naslov meseca ima vsebino samo v stolpcu A, ne C) - išči višje
    if (VLOGA_RX.test(celica)) continue; // vrstica vloge (SMS/TZN …) - imena so še eno vrstico višje
    return i; // prva "navadna" vrstica z vsebino = imena
  }
  return null;
}

// obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciGlavo, offset,
// obdelajVrstico) sprehodi en strnjen sklop datumskih vrstic od indeksa i
// naprej, poišče glavo (imena/enote) zanj in za vsako vrstico ZNOTRAJ
// [startISO,endISO] pokliče obdelajVrstico(vrstica, glava, datum, j). "offset"
// = koliko uvodnih (ne-podatkovnih) stolpcev pred imeni/enotami - 2 za
// oddelke (Datum, Dan kot ločena stolpca, glej realno predlogo "2026 SMS
// RAZPORED"), 1 za NZV (samo Datum, BREZ ločenega stolpca Dan - glej
// realno predlogo "Letni dopusti in omejitve za NZV", ki ima glavo "DATUM |
// PDZN | SOBO | …" brez vmesnega "Dan"). Vrne indeks tik za sklopom.
// "j" (indeks vrstice v vrsteVrstic) je dodan kot 4. argument obdelajVrstico
// - obstoječa dva klicatelja (uvoziOddelek/uvoziNzv) ga ne sprejemata in ga
// JS preprosto prezre; uporablja ga samo pripraviPosodobitveOddelka (pisanje
// nazaj v Sheets), ki potrebuje pravo številko vrstice v listu, ne samo
// vsebine.
// Google Sheets API (values.get, glej GSheetsExport.preberiVrednosti) prazne
// VMESNE vrstice vrne kot [] namesto da bi jih izpustil - ista stvar se
// zgodi tudi v pravih dokumentih, ki imajo tu in tam prazno vrstico "za
// zrak" (vizualni presledek med tedni ipd.). Prej je katera koli taka
// vrstica sredi bloka nepovratno PREKINILA branje - vse dneve ZA njo je
// tiho izpustila, čeprav so bili dejansko del istega, še odprtega bloka
// (najden šele s fixture testom, glej skripte/preveri-zapis-v-sheets.mjs).
function vrsticaJePrazna(vrstica){
  return !vrstica || vrstica.length === 0 || vrstica.every(c => (c == null ? "" : String(c)).trim() === "");
}

function obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciGlavo, offset, obdelajVrstico, stanje){
  const glavaIdx = poisciGlavo(vrsteVrstic, i);
  const glava = glavaIdx != null ? vrsteVrstic[glavaIdx].slice(offset) : [];
  let j = i, praznihZapored = 0;
  while (j < vrsteVrstic.length) {
    // Prazno vrstico preskoči (blok se še ne konča) - a ne v nedogled, da
    // se namesto naslednjega meseca ne "poje" ves prazen prostor do njega.
    if (vrsticaJePrazna(vrsteVrstic[j])) {
      if (++praznihZapored > 20) break;
      j++; continue;
    }
    praznihZapored = 0;
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[j][0]);
    if (!ISO_DATUM_RX.test(datum)) break;
    if (datum >= startISO && datum <= endISO) {
      stanje.najdenDatum = true;
      if (glava.length) { stanje.najdenaGlava = true; obdelajVrstico(vrsteVrstic[j], glava, datum, j); }
    }
    j++;
  }
  return j;
}

async function uvoziMojRazpored(url, myId, deptCode, ciljniMesec){
  if (!deptCode) throw new Error("Nimaš nastavljenega oddelka v profilu (Imenik) – uvoz zahteva primarni oddelek.");
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["datum", "dan", "izmena"], ["datum"]);
  const zapisi = objekti
    .map(o => ({ ...o, datum: window.ImportUtils.normalizirajDatum(o.datum) }))
    .filter(o => ISO_DATUM_RX.test(o.datum) && o.datum >= startISO && o.datum <= endISO)
    .map(o => ({
      employee_id: myId, department_code: deptCode,
      work_date: o.datum,
      shift_code: o.izmena === "Prosto" ? "" : o.izmena,
    }));
  if (!zapisi.length) throw new Error("Ni najdenih vrstic za izbrani mesec (pričakovana glava: Datum, Dan, Izmena).");
  await shraniZapiseRazporeda(zapisi);
  return `Uvoženih ${zapisi.length} dni.`;
}

// Glava stolpcev je kratko ime "Priimek X." (glej priimekZacetnica) - enako
// kot ta stran izvozi in kot ga uporablja realna predloga "2026 SMS
// RAZPORED" ("DŽINIĆ A." ipd.). Če se dve osebi ujemata na isto kratko ime
// (redko, a mogoče - npr. dva "Novak A."), ju je z golim kratkim imenom
// nemogoče razločiti, zato tak stolpec preskočimo in ga javimo kot
// neujemanje, namesto da bi tvegali napačno osebo.
function kratkaImenaMapa(profili){
  const m = {};
  const podvojena = new Set();
  (profili || []).forEach(p => {
    const kratko = window.Imena.kratkiKljuc(p.full_name);
    if (kratko in m) { podvojena.add(kratko); } else { m[kratko] = p.id; }
  });
  podvojena.forEach(k => delete m[k]);
  return { poKratkem: m, podvojena };
}

// Čist izračun (brez omrežja/baze) - iz surovih vrstic (vira ni pomembno, ali
// so prišle prek Google Sheets URL-ja ali iz naloženega Excela, glej
// uvoziDatotekoPametno spodaj) izračuna zapise za razpored. Ločeno od
// uvoziOddelek, da isto logiko lahko uporabita OBA vira vrstic.
function obdelajOddelekVrstice(vrsteVrstic, wardCode, ciljniMesec, poKratkem){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const zapisi = [];
  const neujemanja = new Set();
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[i][0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, najdiVrsticoImen, 2, (vrstica, imena, datum) => {
      imena.forEach((ime, idx) => {
        const id = poKratkem[window.Parafa.kratkoKljuc(ime)];
        if (!id) { if (ime) neujemanja.add(ime); return; }
        const sifra = (vrstica[2 + idx] || "").trim();
        zapisi.push({ employee_id: id, department_code: wardCode, work_date: datum, shift_code: sifra === "Prosto" ? "" : sifra });
      });
    }, stanje);
  }
  return { zapisi, neujemanja, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava };
}

// FLEXI zavihek uradne predloge ima DRUGAČNO obliko kot ostalih 6 oddelkov:
// vsaka oseba zaseda PAR stolpcev (oddelek te izmene + izmena), ker flexi
// kader vsak dan pokriva DRUG oddelek, ne vedno istega - department_code
// torej NI fiksen za ves list (kot pri obdelajOddelekVrstice), ampak se
// prebere iz podatkov. Ime osebe je v glavi NAD stolpcem IZMENE (drugi od
// dveh), stolpec pred njim (oddelek) nima lastne glave - potrjeno na pravi
// uporabnikovi datoteki ("2026_SMS_RAZPORED.xlsx", zavihek FLEXI).
//
// Ta zavihek ima tudi POSEBNOST, ki je pri ostalih 6 oddelkih ni: isto ime
// se v glavi VRSTICE lahko pojavi VEČKRAT (opaženo na pravi datoteki - cel
// blok stolpcev se v isti vrstici enkrat ponovi, z DELNO drugačnimi
// vrednostmi za isti dan). Ker ni zanesljivega načina vedeti, kateri od
// dveh je pravi, se uporabi PRVA (skrajno leva) pojavitev vsakega imena,
// druga pa se tiho prezre - varnejše kot uganjevanje, kateri je pravi.
const IME_S_PIKO_RX = /^\S.*\s[A-ZČŠŽĐĆ]\.\s*$/;
function najdiVrsticoImenFlexi(vrsteVrstic, zacetekBloka){
  for (let i = zacetekBloka - 1, korakov = 0; i >= 0 && korakov < 6; i--, korakov++) {
    const vrstica = vrsteVrstic[i] || [];
    if (ISO_DATUM_RX.test(window.ImportUtils.normalizirajDatum(vrstica[0]))) return null;
    const imaIme = vrstica.some((c, idx) => idx >= 2 && IME_S_PIKO_RX.test((c || "").trim().toUpperCase()));
    if (!imaIme) continue;
    return i;
  }
  return null;
}
// FLEXI kader gre VEDNO v department_code "FLEXI" (svojo skupino), oznaka
// pokritega oddelka pa v pokriva_oddelek (shema, razdelek 34).
//
// Prej je šel v department_code pokriti oddelek, kar je imelo dve slabi
// posledici: (1) kombinirane oznake ("C/E2", "C1/D" - oseba tisti dan
// pokriva dva oddelka) tuji ključ na oddelki zavrne, zato jih je uvoz
// PRESKOČIL - na avgustu 2026 je tako odpadlo 87 vpisov; (2) tisti, ki so
// se shranili, so pristali pod tujim oddelkom, zato je zavihek FLEXI ostal
// PRAZEN, čeprav je uvoz javil "FLEXI (87)".
//
// Tako je tudi bližje uradni preglednici: oddelčni zavihki pri teh ljudeh
// nimajo vpisa, ampak samo opombo "glej razpored FLEXI".
function obdelajFlexiVrstice(vrsteVrstic, ciljniMesec, poKratkem){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const zapisi = [];
  const neujemanja = new Set();
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let steviloDodatnih = 0;
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[i][0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, najdiVrsticoImenFlexi, 0, (vrstica, glavaVrstica, datum) => {
      const videneOsebe = new Set();
      for (let c = 2; c < glavaVrstica.length; c++) {
        const ime = (glavaVrstica[c] || "").trim();
        // Stolpec "DODATNO C/E2 7-19" ni oseba, ampak POVZETEK: v celico se
        // vpiše priimek tistega, ki tisti dan pokriva C/E2 7-19. Preverjeno
        // na pravi datoteki (2026_SMS_RAZPORED_2.xlsx): od 114 takih celic
        // jih ima 95 isto izmeno že zapisano pri osebi sami v tem zavihku,
        // preostalih 19 pa na njenem matičnem oddelčnem zavihku (npr. Jereb
        // S. 13. 6. -> zavihek C "DNEVNA12", Šabić 25. 7. -> C "DNEVNA12
        // C/E2"). Vpisati ga posebej bi zato pomenilo PREPISATI oddelčno
        // izmeno iste osebe (razpored dovoli en zapis na oseba/dan).
        // Ne uvozimo ga, a v poročilu povemo, da obstaja.
        if (/^DODATNO\b/i.test(ime)) {
          if ((vrstica[c] || "").trim()) steviloDodatnih++; // štej samo izpolnjene celice, ne praznih dni
          continue;
        }
        if (!ime || !IME_S_PIKO_RX.test(ime.toUpperCase())) continue; // ni oblike "Priimek I." - opomba/naslov stolpca, ne oseba
