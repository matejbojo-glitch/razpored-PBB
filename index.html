<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Razpored · Begunje</title>
<meta name="description" content="Mesečni razpored dela zdravstvene nege, Psihiatrična bolnišnica Begunje" />
<meta name="theme-color" content="#FAF8F1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Razpored" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="theme.css" />

<style>
  /* Stran-specifično za index.html: samo tisk v PDF na točno 1 stran
     (PrintFit.natisni izračuna --print-scale). Vse ostalo (barve,
     gumbi, kartice, tabela …) prihaja iz theme.css. */
  @media print{
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th{ background:#f2f2f2 !important; }
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important;
      zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr{ break-inside:avoid; page-break-inside:avoid; }
    #printMy{ zoom: var(--print-scale, 1); }
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .wrap{ max-width:100% !important; }
  }

  /* "Moj razpored" na zaslonu ostane en stolpec pod drugim (nespremenjeno,
     ne glede na obračanje zaslona) - razred "pdfCols" se doda samo tik pred
     klicem PrintFit.natisni (glej App spodaj) in odstrani po tiskanju
     ("afterprint"), da so tedni v PDF izvozu razporejeni v več stolpcih in
     cel mesec pride na eno stran. Namenoma NI znotraj @media print zgoraj:
     PrintFit.natisni izmeri scrollHeight elementa PRED klicem window.print()
     (torej pred aktivacijo @media print), zato mora biti postavitev že
     spremenjena OB MERJENJU, ne šele med dejanskim tiskanjem. */
  #printMy.pdfCols .weeksGrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px; }

  /* "Po oddelkih" — tabela postavljena kot uradna predloga "2026 SMS
     RAZPORED": dnevi v vrsticah (stolpec "Dan" je zdaj samo datum, ne ime
     osebe), osebe v stolpcih glave. Vikend obarva celo vrstico (kot v
     predlogi), ne posamezne celice; lastni stolpec (bralec sam) je rahlo
     poudarjen. */
  table.wardTableT td.name, table.wardTableT th.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; }
  table.wardTableT tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  table.wardTableT thead th.me{ background: rgba(var(--accent-rgb),.15); }

  /* Namizje (širši zaslon) IN ležeča postavitev telefona (manifest.json
     orientation zdaj "any", ne več zaklenjeno na pokončno) - na izrecno
     željo naj bo cela preglednica "Po oddelkih" prek celega zaslona in cel
     mesec viden brez vodoravnega drsenja: tabela dobi table-layout:fixed in
     polno širino namesto naravne širine na celico (isti vzorec kot mreža v
     zelje.html). Na ozkem pokončnem telefonu ostane naravna širina +
     vodoravno drsenje (fiksna postavitev bi tam stisnila stolpce oseb na
     neberljivo majhno). "Moj razpored" ostane nespremenjen ne glede na
     zaslon - glej "pdfCols" zgoraj za PDF izvoz. */
  @media (min-width:900px), (orientation: landscape){
    .wardScroller{ overflow-x:visible; }
    table.wardTableT{ width:100%; table-layout:fixed; }
    table.wardTableT th.name, table.wardTableT td.name{ width:70px; }
    table.wardTableT th:not(.name), table.wardTableT td:not(.name){ width:auto; min-width:0; }
  }
  @media (min-width:900px){
    .wrap.wide{ max-width: 1400px; }
  }

  /* NZV — dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe), po
     uradni predlogi "Letni dopusti in omejitve za NZV". Manjše pisave, ker
     je stolpcev veliko (17 enot + Dežurstvo); celica prikaže polno ime
     osebe, ki to enoto ta dan pokriva (ne ročno kodirane kratice iz
     predloge - zanesljive samodejne kratice iz "full_name" niso izvedljive
     brez ločenega polja za priimek). */
  table.wardTableNzv th, table.wardTableNzv td{ font-size:10.5px; padding:5px 3px; }
  table.wardTableNzv td.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; font-size:11px; }
  table.wardTableNzv td.enotaCell{ text-align:center; white-space:normal; word-break:break-word; }
  table.wardTableNzv th.dez, table.wardTableNzv td.dez{ background: rgba(179,64,42,.07); font-weight:700; }
  table.wardTableNzv tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  @media (min-width:900px), (orientation: landscape){
    table.wardTableNzv{ width:100%; table-layout:fixed; }
    table.wardTableNzv td.name{ width:60px; }
    table.wardTableNzv th:not(.name):not(.dez), table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
    table.wardTableNzv th.dez, table.wardTableNzv td.dez{ width:90px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="babel.min.js"></script>
<script src="supabase-js.min.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="print-fit.js"></script>
<script src="xlsx.core.min.js"></script>
<script src="export-utils.js"></script>
<script src="gsheets-client.js"></script>
<script src="export-buttons.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const { client } = RazporedAuth;

const DAN_IME = { PO:"ponedeljek", TO:"torek", SR:"sreda", ČE:"četrtek", PE:"petek", SO:"sobota", NE:"nedelja" };
const DNI = ["PO","TO","SR","ČE","PE","SO","NE"];
const DELOVNI_ČAS = {
  "dopoldan": "05.50–14.00",
  "popoldan": "13.50–21.00",
  "popoldan do 19": "13.50–19.00",
  "popoldan do 19h": "13.50–19.00",
  "NOČNA": "20.50–06.00",
  "NOČNA od 19": "18.50–06.00",
  "NOČNA od 19h": "18.50–06.00",
  "NOČNA12": "17.50–06.00",
  "DNEVNA12": "05.50–18.00",
  "KPU": "koriščenje prostih ur",
  "LD": "letni dopust",
};

function classify(sifra){
  const t = (sifra || "").toLowerCase();
  if (t.startsWith("dežurstvo") || t.startsWith("dezurstvo")) return "dez";
  if (t.startsWith("ld")) return "off";
  if (t.startsWith("kpu")) return "off";
  if (t.startsWith("prisoten")) return "dop"; // pogled "Vodje" - na svojem oddelku (ni odsoten)
  if (t.includes("nočna12")) return "h12";
  if (t.includes("dnevna12")) return "h12";
  if (t.startsWith("nočna")) return "noc";
  if (t.startsWith("dopoldan")) return "dop";
  if (t.startsWith("popoldan")) return "pop";
  return "off";
}
const BARVE = { dop:"#4F9B6B", pop:"#C9713F", noc:"#4A67B0", h12:"#8560A8", off:"#8B8672", dez:"#B3402A" };

function shiftLabel(sifra){
  if (!sifra) return "Prosto";
  return sifra;
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthRange(monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { startISO:start, endISO:end };
}
function daysInRange(startISO, endISO){
  const out = [];
  let d = new Date(startISO + "T00:00:00");
  const end = new Date(endISO + "T00:00:00");
  while (d.getTime() <= end.getTime()){
    const wd = (d.getDay() + 6) % 7; // 0=PO..6=NE
    const p = n => String(n).padStart(2,"0");
    out.push({ datum: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, dan: DNI[wd] });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function MyScheduleView({ userId, month }){
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEntries(null);
    client.from("schedule_entries").select("work_date, shift_code")
      .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  const byDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.work_date] = e.shift_code; });
    return m;
  }, [entries]);

  const iso = todayISO();
  const todaySifra = byDate[iso];
  const todayCls = classify(todaySifra);

  const tedni = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach(dn => {
      if (dn.dan === "PO" || !cur){ cur = []; out.push(cur); }
      cur.push(dn);
    });
    return out;
  }, [days]);

  if (entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div id="printMy">
      {startISO <= iso && iso <= endISO && (
        <div className="todayCard">
          <div className="lbl">Danes · {new Date(iso+"T00:00:00").toLocaleDateString("sl-SI",{day:"numeric",month:"long"})}</div>
          <div className="shift">
            <span className="dot" style={{background: BARVE[todayCls]}}></span>
            <div>
              <div className="shiftName">{shiftLabel(todaySifra)}</div>
              <div className="shiftTime">{DELOVNI_ČAS[todaySifra] || ""}</div>
            </div>
          </div>
        </div>
      )}

      <div className="weeksGrid">
        {tedni.map((teden, i) => (
          <div key={i}>
            <div className="weekLabel">Teden {i+1}</div>
            {teden.map(dn => {
              const sifra = byDate[dn.datum];
              const cls = classify(sifra);
              const isToday = dn.datum === iso;
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              const d = new Date(dn.datum + "T00:00:00");
              return (
                <div key={dn.datum} className={"dayRow" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "")}>
                  <div className="dnum">
                    <div className="n">{d.getDate()}</div>
                    <div className="d">{dn.dan}</div>
                  </div>
                  <div className={"chip" + (cls==="off" ? " off" : "")} style={{background: cls==="off" ? "transparent" : (BARVE[cls] + "26"), border: "1px solid " + (cls==="off" ? "var(--line)" : BARVE[cls])}}>
                    <span className="dot" style={{background: BARVE[cls]}}></span>
                    <span className="txt">{shiftLabel(sifra)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function WardView({ deptCode, month, myId }){
  const [employees, setEmployees] = useState(null);
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEmployees(null); setEntries(null);
    client.from("profiles").select("id, full_name").eq("department_code", deptCode).order("full_name")
      .then(({ data }) => { if (!cancelled) setEmployees(data || []); });
    client.from("schedule_entries").select("employee_id, work_date, shift_code")
      .eq("department_code", deptCode).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [deptCode, startISO, endISO]);

  const byEmpDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.employee_id + "|" + e.work_date] = e.shift_code; });
    return m;
  }, [entries]);

  if (employees === null || entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;
  if (employees.length === 0) return <p className="sub" style={{marginTop:16}}>Za ta oddelek še ni dodeljenih zaposlenih.</p>;

  // Dnevi v vrsticah, osebe v stolpcih - kot uradna predloga "2026 SMS
  // RAZPORED" (posneta iz posnetkov zaslona uporabnika), ne osebe v
  // vrsticah/dnevi v stolpcih kot prej. Z realnim mesecem (do 31 vrstic) je
  // to tudi lažje pregledati na enem zaslonu kot 31 stolpcev.
  return (
    <div>
      <div className="wardScroller">
        <table className="wardTable wardTableT">
          <thead>
            <tr>
              <th className="name">Dan</th>
              {employees.map(z => (
                <th key={z.id} className={z.id === myId ? "me" : ""}>
                  <a href={"imenik.html?id=" + z.id} style={{color:"inherit", textDecoration:"none"}}>{z.full_name}</a>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={isWeekend ? "weekend" : ""}>
                  <td className="name">{new Date(dn.datum+"T00:00:00").getDate()} {dn.dan}</td>
                  {employees.map(z => {
                    const sifra = byEmpDate[z.id + "|" + dn.datum];
                    const cls = classify(sifra);
                    const isMe = z.id === myId;
                    return (
                      <td key={z.id} className={"cell" + (isMe ? " me" : "")}>
                        <span className="swatch" style={{background: BARVE[cls] + "33", color: "var(--text)"}} title={sifra}>
                          {cls==="off" ? "–" : (sifra||"").slice(0,3)}
                        </span>
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="li"><span className="dot" style={{background:"var(--dop)"}}></span>Dopoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--pop)"}}></span>Popoldan</span>
        <span className="li"><span className="dot" style={{background:"var(--noc)"}}></span>Nočna</span>
        <span className="li"><span className="dot" style={{background:"var(--h12)"}}></span>12-urna</span>
        <span className="li"><span className="dot" style={{background:"var(--off)"}}></span>LD / KPU / prosto</span>
      </div>
    </div>
  );
}

// NZV: dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe kot pri
// WardView) - po uradni predlogi "Letni dopusti in omejitve za NZV". Celica
// = kdo pokriva to enoto ta dan (schedule_entries.department_code je še
// vedno lahko ena od teh starih kod - glej supabase/schema.sql sekcija 23,
// namenoma niso izbrisane iz departments prav zaradi te uporabe). Ločeno
// od WardView, ker gre za popolnoma drugačno obliko (enote, ne osebe).
const NZV_ENOTE = [
  ["PDZN", "PDZN"], ["SOBO", "SOBO"], ["ZO", "ŽO"], ["E1", "E1"], ["E2", "E2"], ["D", "D"], ["MO", "MO"],
  ["B", "B"], ["C", "C"], ["C1", "C1"], ["PO", "PO"], ["A", "A"], ["B1B2", "B1,B2"], ["DB", "DB"],
  ["SA", "SA"], ["URGENCA", "URGENCA"], ["U2", "U2"],
];

function NzvView({ month }){
  const [podatki, setPodatki] = useState(null); // null dokler se ne naloži; { "koda|datum": "ime, ime2" }
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setPodatki(null);
    const kode = [...NZV_ENOTE.map(([k]) => k), "DEZ"];
    client.from("schedule_entries").select("department_code, work_date, profiles(full_name)")
      .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => {
        if (cancelled) return;
        const m = {};
        (data || []).forEach(r => {
          if (!r.profiles) return;
          const key = r.department_code + "|" + r.work_date;
          m[key] = m[key] ? m[key] + ", " + r.profiles.full_name : r.profiles.full_name;
        });
        setPodatki(m);
      });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  if (podatki === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div>
      <div className="wardScroller">
        <table className="wardTable wardTableNzv">
          <thead>
            <tr>
              <th className="name">Dan</th>
              {NZV_ENOTE.map(([koda, naziv]) => <th key={koda}>{naziv}</th>)}
              <th className="dez">Dežurstvo</th>
            </tr>
          </thead>
          <tbody>
            {days.map(dn => {
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              return (
                <tr key={dn.datum} className={isWeekend ? "weekend" : ""}>
                  <td className="name">{new Date(dn.datum+"T00:00:00").getDate()} {dn.dan}</td>
                  {NZV_ENOTE.map(([koda]) => (
                    <td key={koda} className="enotaCell">{podatki[koda + "|" + dn.datum] || ""}</td>
                  ))}
                  <td className="enotaCell dez">{podatki["DEZ|" + dn.datum] || ""}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="hint" style={{marginTop:10}}>
        Prikazuje, kdo pokriva katero enoto posamezen dan — iz objavljenega razporeda (Generator → NZV →
        Vodstvena pokritost/Dežurstva). Prazna celica pomeni, da za ta dan/enoto (še) ni objavljenega vnosa.
      </p>
    </div>
  );
}

// "Po oddelkih" je na izrecno navodilo omejen na 6 SMS/TZN oddelkov + FLEXI
// + en virtualen "NZV" (vodje/admin, dežurstva vključena) - ostali oddelki
// (DEZ, NEDEZ, PDZN, SOBO ...) tu niso na voljo, ne glede na vlogo.
const PO_ODDELKIH_KODE = ["B", "C", "C1", "D", "E1", "E2", "FLEXI"];

function App(){
  const [auth, setAuth] = useState(null); // { session, profile }
  const [depts, setDepts] = useState([]);
  const [view, setView] = useState("my");
  const [month, setMonth] = useState(currentMonthStr());
  const [wardCode, setWardCode] = useState(null);
  const [unread, setUnread] = useState(0);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setAuth(res);
      const dept = res.profile ? res.profile.department_code : null;
      const jeKoordinator = res.profile && (res.profile.role === "admin" || res.profile.role === "vodja");
      // Navaden zaposleni je zaklenjen na svoj oddelek (če ta sploh spada med
      // PO_ODDELKIH_KODE) - admin/vodja lahko brskata po vseh, tudi po NZV.
      setWardCode(jeKoordinator ? dept : (PO_ODDELKIH_KODE.includes(dept) ? dept : null));
      RazporedAuth.unreadNotificationCount(res.session.user.id).then(setUnread);
    });
  }, []);

  useEffect(() => {
    client.from("departments").select("code, name").order("code").then(({ data }) => {
      const imenaPoKodi = {};
      (data || []).forEach(d => { imenaPoKodi[d.code] = d.name; });
      const seznam = PO_ODDELKIH_KODE.map(k => ({ code: k, name: imenaPoKodi[k] || k }));
      seznam.push({ code: "NZV", name: "NZV — vodje, administratorji (+ dežurstva)" });
      setDepts(seznam);
    });
  }, []);

  useEffect(() => {
    if ("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
    setShowInstall(false);
  };

  // Excel/Google Sheets izvoz — kliče ga kompaktni ikonski meni ob polju
  // Mesec (glej RazporedIzvoz compact spodaj). PDF izvoz (PrintFit) dela
  // neposredno nad izrisano tabelo/kartico, tu pa gre za surove podatke
  // (glave+vrstice), zato ju je treba znova prebrati - isti poizvedbi kot
  // MyScheduleView/WardView, samo na zahtevo namesto stalno v komponenti.
  const pripraviIzvoz = async () => {
    const { startISO, endISO } = monthRange(month);
    const days = daysInRange(startISO, endISO);
    if (view === "my") {
      const { data } = await client.from("schedule_entries").select("work_date, shift_code")
        .eq("employee_id", auth.session.user.id).gte("work_date", startISO).lte("work_date", endISO);
      const byDate = {}; (data || []).forEach(r => { byDate[r.work_date] = r.shift_code; });
      return [{
        ime: "Moj razpored",
        glave: ["Datum", "Dan", "Izmena"],
        vrstice: days.map(dn => [dn.datum, dn.dan, shiftLabel(byDate[dn.datum])]),
      }];
    }

    // view === "ward"
    if (wardCode === "NZV") {
      // Isto obliko (dnevi v vrsticah, ENOTE v stolpcih) kot na zaslonu -
      // glej NzvView - usklajeno z uradno predlogo "Letni dopusti in
      // omejitve za NZV".
      const kode = [...NZV_ENOTE.map(([k]) => k), "DEZ"];
      const { data } = await client.from("schedule_entries").select("department_code, work_date, profiles(full_name)")
        .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO);
      const m = {};
      (data || []).forEach(r => {
        if (!r.profiles) return;
        const key = r.department_code + "|" + r.work_date;
        m[key] = m[key] ? m[key] + ", " + r.profiles.full_name : r.profiles.full_name;
      });
      return [{
        ime: "NZV",
        glave: ["Datum", "Dan", ...NZV_ENOTE.map(([, naziv]) => naziv), "Dežurstvo"],
        vrstice: days.map(dn => [
          dn.datum, dn.dan,
          ...NZV_ENOTE.map(([koda]) => m[koda + "|" + dn.datum] || ""),
          m["DEZ|" + dn.datum] || "",
        ]),
      }];
    }

    // Isto transponirano obliko (dnevi v vrsticah, osebe v stolpcih) kot na
    // zaslonu (glej WardView) - usklajeno z uradno predlogo "2026 SMS RAZPORED".
    const naslovOddelka = (depts.find(d => d.code === wardCode) || {}).name || wardCode;
    const [{ data: profili }, { data }] = await Promise.all([
      client.from("profiles").select("id, full_name").eq("department_code", wardCode).order("full_name"),
      client.from("schedule_entries").select("employee_id, work_date, shift_code")
        .eq("department_code", wardCode).gte("work_date", startISO).lte("work_date", endISO),
    ]);
    const zaposleni = profili || [];
    const byEmpDate = {};
    (data || []).forEach(r => { byEmpDate[r.employee_id + "|" + r.work_date] = r.shift_code; });
    return [{
      ime: naslovOddelka,
      glave: ["Datum", "Dan", ...zaposleni.map(z => z.full_name)],
      vrstice: days.map(dn => [dn.datum, dn.dan, ...zaposleni.map(z => shiftLabel(byEmpDate[z.id + "|" + dn.datum]))]),
    }];
  };

  if (!auth) return null; // requireAuth preusmeri, če ni prijave

  const { session, profile } = auth;
  const jeKoordinator = profile && (profile.role === "admin" || profile.role === "vodja");
  // Navaden zaposleni sme "Po oddelkih" videti SAMO, če njegov lasten oddelek
  // sploh spada med PO_ODDELKIH_KODE (ostali oddelki tu niso na voljo) -
  // admin/vodja vidita zavihek vedno, saj lahko brskata po vseh (tudi NZV).
  const smePoOddelkih = jeKoordinator || PO_ODDELKIH_KODE.includes(profile ? profile.department_code : null);

  return (
    <div className={"wrap" + (view === "ward" ? " wide" : "")}>
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout/>
      <header className="top">
        <div className="wordmark">
          <img className="logoSmall" src="logo-pbb.png" alt="" />
          <span className="mark">Razpored</span>
        </div>
        <p className="sub">{new Date(month+"-01").toLocaleDateString("sl-SI",{month:"long", year:"numeric"})} · Psihiatrična bolnišnica Begunje</p>
        <div className="whoRow no-print">
          <span className="who">Prijavljen: <b>{profile ? profile.full_name : session.user.email}</b></span>
        </div>

        <div className="segmented no-print" role="tablist">
          <button role="tab" aria-selected={view==="my"} onClick={() => setView("my")}>Moj razpored</button>
          {smePoOddelkih && (
            <button role="tab" aria-selected={view==="ward"} onClick={() => setView("ward")}>Po oddelkih</button>
          )}
        </div>

        {view==="ward" && smePoOddelkih && (
          <div className="field no-print">
            <label htmlFor="wd">Oddelek</label>
            {jeKoordinator ? (
              <select id="wd" value={wardCode || ""} onChange={e => setWardCode(e.target.value)}>
                <option value="" disabled>Izberi oddelek …</option>
                {depts.map(d => <option key={d.code} value={d.code}>{d.name}</option>)}
              </select>
            ) : (
              <select id="wd" value={wardCode || ""} disabled>
                <option value={wardCode || ""}>{(depts.find(d => d.code === wardCode) || {}).name || wardCode}</option>
              </select>
            )}
          </div>
        )}
        <div className="field no-print">
          <label htmlFor="mm">Mesec</label>
          <div style={{display:"flex", gap:8, alignItems:"center"}}>
            <input id="mm" type="month" value={month} onChange={e => setMonth(e.target.value)} style={{flex:1, minWidth:0}} />
            <RazporedIzvoz
              compact
              naslov={(view === "ward" ? "razpored-" + wardCode : "moj-razpored") + "-" + month}
              pripravi={pripraviIzvoz}
              pdf={{
                label: "Izvozi v PDF (" + (view === "ward" ? "A4 ležeče" : "A4 pokončno") + ", 1 stran)",
                onClick: () => {
                  const el = view === "ward" ? document.querySelector(".wardScroller") : document.getElementById("printMy");
                  // "pdfCols" razporedi tedne v več stolpcev SAMO za izvoz (glej
                  // CSS zgoraj) - doda se pred merjenjem/tiskanjem, odstrani po
                  // "afterprint", da se živ zaslon nikoli ne spremeni.
                  if (view === "my" && el) {
                    el.classList.add("pdfCols");
                    const pocistiPoTiskanju = () => {
                      el.classList.remove("pdfCols");
                      window.removeEventListener("afterprint", pocistiPoTiskanju);
                    };
                    window.addEventListener("afterprint", pocistiPoTiskanju);
                  }
                  PrintFit.natisni(el, { orientacija: view === "ward" ? "landscape" : "portrait" });
                },
              }}
            />
          </div>
        </div>
      </header>

      {view==="my" && <MyScheduleView userId={session.user.id} month={month} />}
      {view==="ward" && wardCode && (
        wardCode === "NZV"
          ? <NzvView month={month} />
          : <WardView deptCode={wardCode} month={month} myId={session.user.id} />
      )}
      {view==="ward" && !wardCode && <p className="sub" style={{marginTop:16}}>Izberi oddelek zgoraj.</p>}

      {showInstall && (
        <div className="installBar no-print">
          <div>
            <div className="t">Namesti na domači zaslon</div>
            <div className="s">Odpira se kot samostojna aplikacija, brez brskalnika.</div>
          </div>
          <button className="btn btn-primary btn-sm" onClick={install}>Namesti</button>
        </div>
      )}

      <footer className="foot">
        <p><b>Razpored PBB</b> — prijavljen dostop. Za spremembe ali zamenjave uporabi "Menjava" spodaj.</p>
        <p>Razpored temelji na osnovnem kalupu; dejanske spremembe (bolniška, odobrene menjave) se odražajo sproti. Preverite tudi na oglasni deski oddelka.</p>
      </footer>

      <RazporedNav active="index" role={profile ? profile.role : "user"} unread={unread} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
