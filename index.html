        const kljucIme = window.Parafa.kratkoKljuc(ime);
        if (videneOsebe.has(kljucIme)) continue; // ponovljen blok stolpcev - obdrži samo prvo (levo) pojavitev
        videneOsebe.add(kljucIme);
        const oddelek = (vrstica[c - 1] || "").trim().toUpperCase();
        const sifra = (vrstica[c] || "").trim();
        if (!oddelek && !sifra) continue;
        const id = poKratkem[kljucIme];
        if (!id) { neujemanja.add(ime); continue; }
        if (!oddelek) continue; // izmena brez oddelka (npr. posebna opomba) - ni pravega vpisa za razpored
        zapisi.push({
          employee_id: id, department_code: "FLEXI", work_date: datum,
          shift_code: sifra === "Prosto" ? "" : sifra,
          pokriva_oddelek: oddelek,
        });
      }
    }, stanje);
  }
  if (steviloDodatnih) {
    neujemanja.add(`stolpec "DODATNO C/E2 7-19" ni uvožen (${steviloDodatnih} celic) - je povzetek, ` +
      "kdo pokriva C/E2 7-19; ta izmena je zapisana že pri osebi sami");
  }
  return { zapisi, neujemanja, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava };
}

async function uvoziOddelek(url, wardCode, ciljniMesec){
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  if (!vrsteVrstic.length) throw new Error("Prazna datoteka.");
  const { data: profili } = await client.from("profili").select("id, full_name");
  const { poKratkem, podvojena } = kratkaImenaMapa(profili);
  // FLEXI ima drugačno obliko (par stolpcev oddelek+izmena na osebo,
  // department_code se prebere iz podatkov, ne fiksen za ves list) - glej
  // obdelajFlexiVrstice. Potrebuje tudi seznam veljavnih kod oddelkov
  // (tuji ključ na oddelki), da neznana/kombinirana oznaka (npr. "C/E2",
  // opažena v pravi datoteki) ne zavrne celotnega zapisa.
  let zapisiRes;
  if (wardCode === "FLEXI") {
    zapisiRes = obdelajFlexiVrstice(vrsteVrstic, ciljniMesec, poKratkem);
  } else {
    zapisiRes = obdelajOddelekVrstice(vrsteVrstic, wardCode, ciljniMesec, poKratkem);
  }
  const { zapisi, neujemanja, najdenDatum, najdenaGlava } = zapisiRes;
  podvojena.forEach(k => neujemanja.add(k + " (ujema se z več osebami - uredi ročno)"));
  if (!zapisi.length) {
    if (!najdenDatum) throw new Error(`Ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} v tej datoteki/zavihku. Najverjetnejši vzrok: povezava kaže na NAPAČEN ZAVIHEK – v Google Sheets klikni zavihek za ta oddelek (dno zaslona) in šele PO TEM kopiraj naslov iz naslovne vrstice (mora vsebovati "#gid=..."); sicer se vedno uvozi prvi zavihek v dokumentu.`);
    if (!najdenaGlava) throw new Error("Najdene vrstice za izbrani mesec, a nad njimi ni najti vrstice z imeni oseb.");
    throw new Error(`Najdene vrstice za izbrani mesec, a nobeno ime se ni ujemalo z osebo v aplikaciji: ${[...neujemanja].join(", ")}. Če so imena videti pravilna, je verjetno kriv napačen zavihek (glej zgoraj) – preveri, da povezava kaže na zavihek TEGA oddelka.`);
  }
  opozoriloPokrivaOddelek = null;
  await shraniZapiseRazporeda(zapisi);
  return `Uvoženih ${zapisi.length} vpisov.` + (neujemanja.size ? ` Brez ujemanja imena: ${[...neujemanja].join(", ")}.` : "")
    + (opozoriloPokrivaOddelek ? " " + opozoriloPokrivaOddelek : "");
}

// ---------------------------------------------------------------------
// Pisanje NAZAJ v Google Sheets – samo za oddelčne zavihke (kot uvoziOddelek
// zgoraj), ne za "Moj razpored"/NZV (drugačna oblika, glej "kasneje" v
// pogovoru z uporabnikom). Piše SAMO v celice, ki jih uvoziOddelek tudi
// prebere - iste (vrstica, stolpec) koordinate, izračunane z isto logiko
// iskanja bloka/glave. Zato:
//   - imena, vloge, naslov meseca, podpisni blok in oblikovanje v listu
//     ostanejo NEDOTAKNJENI (nobena od teh celic ni v seznamu posodobitev),
//   - oseba, ki v listu (še) nima svojega stolpca (ker v Sheetsu še ni bila
//     dodana), se tiho izpusti - funkcija NIKOLI ne doda novega stolpca ali
//     vrstice, samo prepiše obstoječe.
// Za pravilno poravnavo vrstic MORA klicatelj prebrati list prek
// GSheetsExport.preberiVrednosti (Sheets API), NE prek
// ImportUtils.preberiGoogleSheet (javni CSV izvoz) - slednji izpusti prazne
// vrstice in bi s tem premaknil indekse vrstic glede na resnične številke
// vrstic v listu.
function pripraviPosodobitveOddelka(vrsteVrstic, ciljniMesec, employees, byEmpDate){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const poKratkem = {};
  const podvojena = new Set();
  (employees || []).forEach(z => {
    // Isti ključ kot pri uvozu (window.Imena.kratkiKljuc) - dobesedna
    // primerjava nizov je puščala neujemanja pri različnem zapisu
    // strešic (Bećirović / Bečirović).
    const kratko = window.Imena.kratkiKljuc(z.full_name);
    if (kratko in poKratkem) podvojena.add(kratko); else poKratkem[kratko] = z;
  });
  podvojena.forEach(k => delete poKratkem[k]);
  const posodobitve = [];
  const neujemanja = new Set();
  podvojena.forEach(k => neujemanja.add(k + " (ujema se z več osebami - uredi ročno)"));
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum((vrsteVrstic[i] || [])[0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, najdiVrsticoImen, 2, (vrstica, imena, datum, j) => {
      imena.forEach((ime, idx) => {
        const z = poKratkem[window.Parafa.kratkoKljuc(ime)];
        if (!z) { if (ime) neujemanja.add(ime); return; }
        const trenutna = byEmpDate[z.id + "|" + datum] || "";
        posodobitve.push({ vrstica: j, stolpec: 2 + idx, vrednost: trenutna });
      });
    }, stanje);
  }
  return { posodobitve, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava, neujemanja };
}

async function zapisiOddelekVSheets(url, wardCode, ciljniMesec){
  if (!window.GSheetsExport || !window.GSheetsExport.jeNastavljeno()) {
    throw new Error("Pisanje v Google Sheets še ni nastavljeno – manjka Google Client ID (glej GSHEETS-SETUP.md).");
  }
  const { startISO, endISO } = monthRange(ciljniMesec);
  const [{ data: employees }, { data: entries }] = await Promise.all([
    client.from("profili").select("id, full_name").eq("department_code", wardCode).order("full_name"),
    client.from("razpored").select("employee_id, work_date, shift_code")
      .eq("department_code", wardCode).gte("work_date", startISO).lte("work_date", endISO),
  ]);
  if (!employees || !employees.length) throw new Error("Za ta oddelek še ni dodeljenih zaposlenih.");
  const byEmpDate = {};
  (entries || []).forEach(e => { byEmpDate[e.employee_id + "|" + e.work_date] = e.shift_code; });

  const { naslovLista, vrsteVrstic } = await window.GSheetsExport.preberiVrednosti(url);
  const { posodobitve, najdenDatum, najdenaGlava, neujemanja } = pripraviPosodobitveOddelka(vrsteVrstic, ciljniMesec, employees, byEmpDate);
  if (!posodobitve.length) {
    if (!najdenDatum) throw new Error(`V zavihku "${naslovLista}" ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} - preveri, da povezava kaže na pravi zavihek (klikni zavihek za ta oddelek, šele nato kopiraj povezavo).`);
    if (!najdenaGlava) throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nad njimi ni najti vrstice z imeni oseb.`);
    throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nobeno ime v listu se ni ujemalo z zaposlenim v aplikaciji: ` + [...neujemanja].join(", "));
  }
  const rezultat = await window.GSheetsExport.zapisiVObstojeciList(url, posodobitve);
  return `Zapisanih ${rezultat.stevilo} celic v zavihek "${rezultat.list}".`
    + (neujemanja.size ? ` Brez ujemanja imena (celica v Sheetsu ni bila spremenjena): ${[...neujemanja].join(", ")}.` : "");
}

// NZV predloga ima glavo (enote) VEDNO neposredno nad prvim dnem tega
// bloka (naslov meseca je še eno vrstico višje, glej realno predlogo
// "Letni dopusti in omejitve za NZV") - offset -1 je zato dovolj, brez
// potrebe po VLOGA_RX preskakovanju kot pri uvoziOddelek.
// Ista glava je v resničnih datotekah zapisana z različnimi presledki:
// aplikacija piše "B1,B2", uporabnikova datoteka pa "B1, B2". Ker se je
// primerjalo znak za znak, je bil CEL stolpec B1/B2 (Mavri Tratnik, Šubic,
// Bizjak - vsak delovni dan) tiho preskočen. Zato pred primerjavo iz obeh
// strani odstranimo presledke in poenotimo velikost črk. "SA DOP" -> "SADOP"
// se pri tem ne zaleti v nič drugega (preverjeno v preveri-nzv-sheets.mjs).
function nzvKljucGlave(naziv){
  return String(naziv || "").replace(/\s+/g, "").toUpperCase();
}
function nzvNazivVKodoNorm(){
  const vir = nzvNazivVKodo();
  const m = {};
  Object.keys(vir).forEach(k => { m[nzvKljucGlave(k)] = vir[k]; });
  return m;
}

// Vrstica z glavami enot za blok, ki se začne pri "zacetekBloka".
//
// Prej se je pogledala natanko ENA vrstica višje. V pravi datoteki pa med
// glavo in prvim datumom stoji PRAZNA vrstica - tako je na vseh 20 mesečnih
// listih datoteke "Letni dopusti in omejitve za NZV". Posledica: glava se ni
// našla nikoli in uvoz je tiho prinesel NIČ. (Oddelčni uvoz je hodil navzgor
// že prej - glej najdiVrsticoImen v sheets-mreza.js; manjkalo je samo tu.)
//
// Namesto "prva vrstica z neprazno drugo celico" zahtevamo, da se vsaj DVE
// celici res ujameta z znano enoto. Naslovna vrstica ("SEPTEMBER 2026") ali
// kakšna opomba tako ne more biti zamenjana za glavo.
// 8 in ne 2: v starejših listih (npr. "Razpored APRIL 2025") stoji med
// glavo in prvim pravim datumom še nekaj vrstic z besedilnimi datumi
// ("31. mar.", "1. apr."), ki jih aplikacija ne prebere kot datum. Iskanje
// navzgor je varno, ker zahtevamo DVE ujemajoči se glavi enot - naslovna
// vrstica ali podatkovna vrstica tega pogoja ne izpolni.
const NZV_GLAVA_NAJVEC_NAZAJ = 8;
const NZV_GLAVA_NAJMANJ_ZADETKOV = 2;
function poisciEnoteNzv(vrsteVrstic, zacetekBloka){
  const nazivVKodo = nzvNazivVKodoNorm();
  for (let i = zacetekBloka - 1, korakov = 0; i >= 0 && korakov < NZV_GLAVA_NAJVEC_NAZAJ; i--, korakov++) {
    const vrstica = vrsteVrstic[i] || [];
    // Nad nami je že prejšnji mesečni blok - glave tega bloka ni.
    if (ISO_DATUM_RX.test(window.ImportUtils.normalizirajDatum(vrstica[0]))) return null;
    const zadetki = vrstica.slice(1).filter(c => nazivVKodo[nzvKljucGlave(c)]).length;
    if (zadetki >= NZV_GLAVA_NAJMANJ_ZADETKOV) return i;
  }
  return null;
}

// Stolpci LD/IZOB/BS niso razpored (razpored), ampak odsotnost
// (odsotnosti) - glej NZV_KIND_KODA. Zapisi zanje gredo v drugo tabelo,
// zato jih uvoziNzv loči na dva izhodna seznama (zapisi/dopusti).
const NZV_ODSOTNOST_KIND = { LD: "ld", IZOB: "sti", BS: "bs" };

// Uvoz uradnega dokumenta "Razporeditev zaposlenih v UA in DEŽ" (mesečni
// PDF, glej pdfKoscjiVTabelo v import-utils.js - po njej ima ta dokument 3
// stolpce: datum+dan+ime "Urgenca ZDR" (pogosto ena sama celica, ker sta si
// datum in ime v izvirniku blizu), "Dežurstvo ZDR", "Dežurstvo dipl.
// m.s./zn." - zadnji stolpec je isti 14-osebni krog, ki ga aplikacija že
// pozna prek NZV uvoza (obdelajNzvVrstice, DEZ oddelek), zato ga TU
// namenoma NE uvažamo ponovno - samo prva dva, ki ju aplikacija doslej ni
// poznala (zdravniki nimajo profila/računa, glej dezurni_zdravniki v
// schema.sql - namenjena SAMO prikazu imena, ne pravemu uporabniku).
// Uradni dokument "Razporeditev zaposlenih v UA in DEŽ" ima PET stolpcev:
//   datum | dan | Urgenca ZDR | Dežurstvo ZDR | Dežurstvo dipl. m.s./zn.
//
// Prej je koda predpostavljala, da sta datum IN ime v isti celici, za
// "Dežurstvo ZDR" pa je jemala stolpec 1 - to je kratica dneva. Posledica
// je bila, da je v "Moj razpored" ob dežurstvu pisalo "DEŽ: TO" oziroma
// "DEŽ: ČE" namesto imena zdravnika. Potrjeno na pravi datoteki
// (september 2026), zato se stolpci odslej poiščejo po GLAVI, ne po
// fiksnih mestih.
const ZDR_DAN_RX = /^(PO|TO|SR|ČE|PE|SO|NE)$/;

// Datum v PDF-ju je pogosto razbit s presledki - tudi znotraj števke
// ("1 0 . 9 . 2026" je 10. 9. 2026), zato pred primerjavo odstranimo VSE
// presledke. Vrne "LLLL-MM-DD" ali null.
function zdrDatum(celica){
  const t = String(celica || "").replace(/\s+/g, "");
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(t);
  if (!m) return null;
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}

// Mesta stolpcev iz vrstice z naslovi. Če je ni (drugačna izdaja
// dokumenta), pade nazaj na razpored, kakršen je v vseh doslej videnih
// datotekah.
const ZDR_PRIVZETI_STOLPCI = { urgenca: 2, dezurstvo: 3, sestra: 4 };
function najdiStolpceZdravnikov(vrsteVrstic){
  for (const v of (vrsteVrstic || [])) {
    let urgenca = -1, dezurstvo = -1, sestra = -1;
    v.forEach((c, i) => {
      const t = String(c || "").toLowerCase().replace(/\s+/g, " ").trim();
      if (t.startsWith("urgenca")) urgenca = i;
      else if (t.startsWith("dežurstvo zdr") || t.startsWith("dezurstvo zdr")) dezurstvo = i;
      else if (t.includes("m.s.") || t.includes("dipl. m")) sestra = i;
    });
    if (urgenca >= 0 && dezurstvo >= 0) {
      return { urgenca, dezurstvo, sestra: sestra >= 0 ? sestra : dezurstvo + 1 };
    }
  }
  return ZDR_PRIVZETI_STOLPCI;
}

// "Tjaša Petrič ( Vlade Milanović )" pomeni zamenjavo (uporabnikom
// potrjeno): PRVO ime je zdravnik, ki dejansko dela, ime v oklepaju je
// bilo prvotno razporejeno. Oklepaj se v PDF-ju včasih razlije v naslednji
// stolpec in ostane NEZAPRT ("Tjaša Petrič ( Špela Žagar Gabron"), zato
// režemo od prvega oklepaja naprej, ne šele od zaprtega.
function zdrIme(celica){
  return String(celica || "").split("(")[0].replace(/\s+/g, " ").trim();
}

function obdelajZdravnikiVrstice(vrsteVrstic, ciljniMesec){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const stolpci = najdiStolpceZdravnikov(vrsteVrstic);
  const zapisi = [];
  let najdenDatum = false;
  let zadnjiDatum = null;
  for (const vrstica of (vrsteVrstic || [])) {
    // Datum je lahko v prvi ali (redkeje) drugi celici - poiščemo ga,
    // namesto da bi vztrajali pri stolpcu 0.
    let datum = null;
    for (let i = 0; i < Math.min(2, vrstica.length); i++) {
      datum = zdrDatum(vrstica[i]);
      if (datum) break;
    }
    if (!datum) continue;
    // Dnevi si v pravem dokumentu sledijo po naraščajočem datumu - ko se
    // datum ne poveča (ali se vrne nazaj), smo zapustili pravo tabelo
    // (podpisni/opombni blok na dnu lahko naključno vsebuje niz, videti kot
    // datum, npr. "Velja od: 1. 9. 2026" - potrjeno na pravi datoteki).
    if (zadnjiDatum && datum <= zadnjiDatum) break;
    zadnjiDatum = datum;
    if (datum < startISO || datum > endISO) continue;
    najdenDatum = true;

    const vzemi = (i) => {
      const c = zdrIme(vrstica[i]);
      // Kratica dneva ni ime - varovalka, če se stolpci kdaj zamaknejo.
      return (!c || ZDR_DAN_RX.test(c.toUpperCase())) ? "" : c;
    };
    const urgenca = vzemi(stolpci.urgenca);
    const dezurstvo = vzemi(stolpci.dezurstvo);
    const sestra = vzemi(stolpci.sestra);
    if (urgenca) zapisi.push({ work_date: datum, kind: "urgenca", full_name: urgenca });
    if (dezurstvo) zapisi.push({ work_date: datum, kind: "dezurstvo", full_name: dezurstvo });
    // Tretji stolpec je dežurna dipl. m.s./zn. - iz NZV uvoza je znana samo
    // takrat, ko je naložena TISTA datoteka; tu jo dobimo iz uradnega
    // dokumenta, da so vsi trije krogi vidni na enem mestu.
    if (sestra) zapisi.push({ work_date: datum, kind: "sestra", full_name: sestra });
  }
  return { zapisi, najdenDatum };
}

// Ista vloga kot kratkaImenaMapa, samo za parafe (uvoziNzv/uvoziDatotekoPametno).
// "datum" (mesec ali dan) izbere pravo stran prestopa 1.10.2026 (glej
// parafaOd) - vsak klic je za EN ciljni mesec, ki nikoli ne sega čez
// prestop, zato zadostuje ena skupna vrednost za ves seznam profilov.
function parafaMapa(profili, datum){
  // Razreševanje živi v parafa.js (window.Parafa.lastniki): izrecno
  // nastavljena parafa premaga izpeljano, zato dva sodelavca z enakim
  // začetkom priimka nista več videti kot trk. Prej je uvoz OBA preskočil.
  const { poParafi, podvojene } = window.Parafa.lastniki(profili, datum);
  return { poParafi, podvojene: new Set(podvojene) };
}

// Uradna predloga piše stolpec DEŽURSTVO drugače kot vse ostale enote: NE
// parafo (npr. "GA"), ampak POLNO IME osebe (npr. "Grega Arnež") - potrjeno
// na pravi naloženi datoteki (uporabnikov Excel, avgust/september 2026).
// Nekaj imen ima pred sabo tudi naziv ("dr. Tanja Torkar") - "vreča besed"
// primerjava (imenaSeUjemataNzv) bi zaradi dodatne besede "DR." sicer
// zgrešila ujemanje, zato ga tu odstranimo. Samo znane, nedvoumne
// akademske/strokovne kratice na ZAČETKU imena - ne kar koli, da se ne
// izgubi noben pravi del imena.
const NAZIV_OSEBE_RX = /^(dr|mag|prim|doc|prof|as)\.\s*/i;
function ocistiNazivOsebe(s){ return (s || "").replace(NAZIV_OSEBE_RX, "").trim(); }

// Čist izračun (brez omrežja/baze), analogen obdelajOddelekVrstice zgoraj -
// ločen od uvoziNzv, da isto logiko uporablja tudi uvoziDatotekoPametno
// (glej spodaj), ki jo poganja na VSAKEM listu naložene datoteke.
// "profili" (id + full_name) je za ujemanje stolpca DEŽURSTVO po IMENU -
// ista vloga kot poParafi za vse ostale stolpce, glej zgoraj.
function obdelajNzvVrstice(vrsteVrstic, ciljniMesec, poParafi, myId, profili){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const nazivVKodo = nzvNazivVKodoNorm();
  const zapisi = [];
  const dopusti = [];
  const neujemanja = new Set();
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[i][0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciEnoteNzv, 1, (vrstica, stolpci, datum) => {
      stolpci.forEach((naziv, idx) => {
        const virKoda = nazivVKodo[nzvKljucGlave(naziv)];
        if (!virKoda) return;
        const vsebina = (vrstica[1 + idx] || "").trim();
        if (!vsebina) return;
        if (virKoda in NZV_ODSOTNOST_KIND) {
          vsebina.split(",").map(s => s.trim()).filter(Boolean).forEach(parafa => {
            const oseba = poParafi[parafa.toUpperCase()];
            if (!oseba) { neujemanja.add(parafa); return; }
            dopusti.push({ full_name: oseba.full_name, work_date: datum, kind: NZV_ODSOTNOST_KIND[virKoda], created_by: myId });
          });
          return;
        }
        if (virKoda === "DEZ") {
          vsebina.split(",").map(s => ocistiNazivOsebe(s)).filter(Boolean).forEach(ime => {
            const oseba = (profili || []).find(p => imenaSeUjemataNzv(p.full_name, ime));
            if (!oseba) { neujemanja.add(ime); return; }
            // Brez "stolpec": dežurstvo ni enota, ampak stanje - glej zdruziNzvZapise.
            zapisi.push({ employee_id: oseba.id, department_code: "DEZ", work_date: datum, shift_code: "DEŽURSTVO" });
          });
          return;
        }
        const { department_code: koda, shift_code: sifra } = nzvZapisZaStolpec(virKoda);
        vsebina.split(",").map(s => s.trim()).filter(Boolean).forEach(parafa => {
          const oseba = poParafi[parafa.toUpperCase()];
          if (!oseba) { neujemanja.add(parafa); return; }
          zapisi.push({ employee_id: oseba.id, department_code: koda, work_date: datum,
                        shift_code: sifra, stolpec: virKoda });
        });
      });
    }, stanje);
  }
  return { zapisi: zdruziNzvZapise(zapisi), dopusti, neujemanja,
           najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava };
}

// Kaj se za dani stolpec NZV mreže zapiše v razpored.
//
// SA DOP in SA POP pišeta isto department_code "SA", ločeno samo prek
// shift_code (glej razvrstiSA) - "SA" sama ni prava izbirna koda oddelka.
// Dežurstvo ni enota, ampak stanje, zato ima svojo šifro izmene.
//
// Ena sama funkcija za uvoz IN za urejanje mreže v aplikaciji: če bi bili
// dve kopiji, bi se isti stolpec nekoč zapisal drugače, odvisno od tega,
// po kateri poti je prišel.
function nzvZapisZaStolpec(koda){
  if (koda === "SADOP") return { department_code: "SA", shift_code: "Dopoldne" };
  if (koda === "SAPOP") return { department_code: "SA", shift_code: "Popoldne" };
  if (koda === "DEZ") return { department_code: "DEZ", shift_code: "DEŽURSTVO" };
  return { department_code: koda, shift_code: window.NzvZasedba.IZMENA_PRISOTEN };
}

// Vpisi za razpored iz CELE mreže enega meseca - obratna smer od
// nalozizPodatkeNzv. Uporablja jo urejanje NZV mreže v aplikaciji.
//
// "vrednost(koda, datum)" vrne to, kar v celici piše ("DŽA, ALU").
// Zapisi gredo skozi isti zdruziNzvZapise kot uvoz, zato ista oseba na
// več enotah istega dne pristane v ENEM zapisu (pokriva_oddelek).
function nzvVnosiIzMreze(opts){
  const vrednost = opts.vrednost, datumi = opts.datumi || [], poParafi = opts.poParafi || {};
  const kode = opts.kode || [];
  const surovi = [];
  const neznane = new Set();
  datumi.forEach(datum => {
    if (window.Prazniki.jeDelaProstDan(datum)) return;
    kode.forEach(koda => {
      String(vrednost(koda, datum) || "").split(",").map(x => x.trim()).filter(Boolean)
        .forEach(parafa => {
          const oseba = poParafi[parafa.toUpperCase()];
          if (!oseba) { neznane.add(parafa); return; }
          const { department_code, shift_code } = nzvZapisZaStolpec(koda);
          surovi.push({
            employee_id: oseba.id, department_code, work_date: datum, shift_code,
            // Dežurstvo nima svojega stolpca enote - glej zdruziNzvZapise.
            stolpec: koda === "DEZ" ? undefined : koda,
          });
        });
    });
  });
  return { zapisi: zdruziNzvZapise(surovi), neznane: [...neznane] };
}

// Združevanje zapisov iste osebe in dneva (razpored ima unique
// (employee_id, work_date), oseba pa je pogosto na več enotah) je zdaj v
// skupnem nzv-zasedba.js, ker isto pravilo potrebuje tudi objava razporeda
// NZV iz Generatorja. Dve izvedbi istega pravila sta pri razporedu
// nevarni: uvoz bi enoto ohranil, objava pa jo tiho izgubila.
const zdruziNzvZapise = window.NzvZasedba.zdruziNzvZapise;

async function uvoziNzv(url, ciljniMesec, myId){
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  if (!vrsteVrstic.length) throw new Error("Prazna datoteka.");
  const { data: profili } = await client.from("profili").select("id, full_name, parafa, parafa_pred_oktobrom_2026");
  const { poParafi, podvojene } = parafaMapa(profili, ciljniMesec);
  const { zapisi, dopusti, neujemanja, najdenDatum, najdenaGlava } = obdelajNzvVrstice(vrsteVrstic, ciljniMesec, poParafi, myId, profili);
  podvojene.forEach(k => neujemanja.add(k + " (parafa se ujema z več osebami - popravi v Imeniku)"));
  if (!zapisi.length && !dopusti.length) {
    if (!najdenDatum) throw new Error(`Ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} v tej datoteki/zavihku - preveri, da si prilepil pravo povezavo (in pravi zavihek/mesec).`);
    if (!najdenaGlava) throw new Error("Najdene vrstice za izbrani mesec, a nad njimi ni najti vrstice z glavami enot.");
    throw new Error("Najdene vrstice za izbrani mesec, a nobena parafa se ni ujemala z osebo v aplikaciji: " + [...neujemanja].join(", "));
  }
  await Promise.all([
    zapisi.length ? shraniZapiseRazporeda(zapisi) : Promise.resolve(),
    dopusti.length ? shraniDopusteNzv(dopusti) : Promise.resolve(),
  ]);
  const deli = [];
  if (zapisi.length) deli.push(`${zapisi.length} vpisov razporeda`);
  if (dopusti.length) deli.push(`${dopusti.length} vpisov odsotnosti (LD/IZOB/BS)`);
  return `Uvoženih: ${deli.join(", ")}.` + (neujemanja.size ? ` Brez ujemanja parafe: ${[...neujemanja].join(", ")}.` : "");
}

// "Pametni uvoz" - ena naložena datoteka (lahko z več zavihki, kot pravi
// delovni zvezek "2026 SMS RAZPORED") namesto ročnega lepljenja povezave za
// vsak oddelek/mesec posebej. Vsak list se prepozna samodejno:
//   - ime lista se ujema z znano kodo oddelka (PO_ODDELKIH_KODE, npr. "C1",
//     "FLEXI") -> oddelčni razpored (obdelajOddelekVrstice) - IME lista je
//     tu edini zanesljiv način vedeti, kateri oddelek gre v ta stolpec
//     razpored (vsebina sama po sebi tega ne pove);
//   - sicer poskusi NZV obliko (obdelajNzvVrstice) - ta je prepoznana po
//     VSEBINI glave (enote kot PDZN/SOBO/... so že v vrsticah), zato ne
//     potrebuje imena lista po vzorcu - obdrži se samo, če je za izbrani
//     mesec dejansko kaj našel;
//   - sicer je list preskočen (npr. "KALUP", "kopije", "jesen" v pravi
//     predlogi) - uporabnik dobi seznam preskočenih listov v sporočilu, da
//     ve, da ni bilo tiho prezrto.
function razvrstiListe(listi){
  const oddelki = [];
  const preostali = [];
  (listi || []).forEach(l => {
    const koda = (l.naziv || "").trim().toUpperCase();
    if (PO_ODDELKIH_KODE.includes(koda)) oddelki.push({ koda, vrsteVrstic: l.vrsteVrstic });
    else preostali.push(l);
  });
  return { oddelki, preostali };
}

// En sam SQL "upsert" stavek (INSERT ... ON CONFLICT DO UPDATE) v Postgresu
// zavrne, če isti stavek dvakrat "prizadene" isto vrstico (napaka "ON
// CONFLICT DO UPDATE command cannot affect row a second time") - to se v
// resnici zgodi, če ista oseba za isti dan nastopa v VEČ zavihkih naenkrat
// (npr. FLEXI pokritost, ki je hkrati omenjena tudi v matičnem oddelku).
// Ta pomožna funkcija na SEZNAMU zapisov obdrži samo zadnjo vrednost za
// vsak ključ (oseba+dan) - uporablja jo uvoziDatotekoPametno spodaj, PRED
// vsakim posameznim klicem shraniZapiseRazporeda/shraniDopusteNzv, da se
// napaka sploh ne more zgoditi.
function zdruziPoKljucu(vrstice, kljucFn){
  const m = new Map();
  const podvojeni = new Set();
  vrstice.forEach(v => {
    const k = kljucFn(v);
    if (m.has(k)) podvojeni.add(k);
    m.set(k, v); // zadnja vrednost zmaga
  });
  return { edinstveni: [...m.values()], podvojeni };
}

// V pravi preglednici "2026 SMS RAZPORED" se isti mesec pojavi tudi večkrat
// (v "Letni dopusti" je december 2026 notri trikrat). Tiho vzeti zadnjega bi
// pomenilo, da se v razpored zapiše morda opuščena različica in nihče ne
// izve. Zato tu najdemo VSE bloke za ciljni mesec in - kadar jih je več -
// vprašamo uporabnika prek "izberiBlok". Izbrani blok obdrži svoji glavni
// vrstici (imena in mesec), da ga naprej bere ista koda kot doslej.
async function izlusciIzbraneBloke(oddelki, ciljniMesec, izberiBlok){
  if (!window.RazporedOblike) return oddelki;
  const [leto, mesec] = String(ciljniMesec).split("-").map(Number);
  const out = [];
  for (const o of oddelki) {
    const bloki = window.RazporedOblike.blokiZaMesec(
      window.RazporedOblike.najdiBloke(o.vrsteVrstic), leto, mesec);
    if (bloki.length < 2) { out.push(o); continue; }
    const izbran = izberiBlok ? await izberiBlok({ koda: o.koda, bloki }) : null;
    if (!izbran) throw new Error(
      `Uvoz preklican: v zavihku ${o.koda} je ${bloki.length} različic tega meseca, izbrana pa ni nobena.`);
    out.push({
      koda: o.koda,
      vrsteVrstic: o.vrsteVrstic.slice(Math.max(0, izbran.vrsticaImen), izbran.vrsticaDo + 1),
      izbranBlok: izbran,
    });
  }
  return out;
}

async function uvoziDatotekoPametno(file, ciljniMesec, myId, izberiBlok){
  const { listi } = await window.ImportUtils.preberiVseListe(file);
  if (!listi || !listi.length) throw new Error("Prazna datoteka.");
  const razvrsceni = razvrstiListe(listi);
  const preostali = razvrsceni.preostali;
  const oddelki = await izlusciIzbraneBloke(razvrsceni.oddelki, ciljniMesec, izberiBlok);

  opozoriloPokrivaOddelek = null;
  const [{ data: profiliKratki }, { data: profiliParafa }] = await Promise.all([
    client.from("profili").select("id, full_name"),
    client.from("profili").select("id, full_name, parafa, parafa_pred_oktobrom_2026"),
  ]);
  const { poKratkem, podvojena } = kratkaImenaMapa(profiliKratki);
  const { poParafi, podvojene } = parafaMapa(profiliParafa, ciljniMesec);

  const neujemanja = new Set();
  podvojena.forEach(k => neujemanja.add(k + " (ujema se z več osebami - uredi ročno)"));
  podvojene.forEach(k => neujemanja.add(k + " (parafa se ujema z več osebami - popravi v Imeniku)"));

  // Vsak list se zapiše V SVOJEM lastnem klicu (ne enem skupnem upsert-u čez
  // vse liste skupaj) - če ista oseba za isti dan nastopa v dveh zavihkih,
  // to naravno pomeni "kasnejši zavihek prepiše prejšnjega za ta dan"
  // namesto da bi Postgres zavrnil celoten uvoz (glej zdruziPoKljucu zgoraj).
  let steviloRazporeda = 0, steviloOdsotnosti = 0;
  const povzetekOddelki = [];
  for (const { koda, vrsteVrstic } of oddelki) {
    // FLEXI ima drugačno obliko (par stolpcev oddelek+izmena na osebo) -
    // glej obdelajFlexiVrstice.
    const { zapisi, neujemanja: neu } = koda === "FLEXI"
      ? obdelajFlexiVrstice(vrsteVrstic, ciljniMesec, poKratkem)
      : obdelajOddelekVrstice(vrsteVrstic, koda, ciljniMesec, poKratkem);
    neu.forEach(n => neujemanja.add(koda + ": " + n));
    if (!zapisi.length) continue;
    const { edinstveni, podvojeni } = zdruziPoKljucu(zapisi, z => z.employee_id + "|" + z.work_date);
    if (podvojeni.size) neujemanja.add(`${koda}: ${podvojeni.size} podvojenih vpisov (ista oseba/dan večkrat v tem zavihku) - uporabljena zadnja vrednost`);
    await shraniZapiseRazporeda(edinstveni);
    steviloRazporeda += edinstveni.length;
    povzetekOddelki.push(`${koda} (${edinstveni.length})`);
  }

  const preskoceni = [];
  for (const l of preostali) {
    const { zapisi, dopusti, neujemanja: neu } = obdelajNzvVrstice(l.vrsteVrstic, ciljniMesec, poParafi, myId, profiliParafa);
    if (!zapisi.length && !dopusti.length) { preskoceni.push(l.naziv); continue; }
    neu.forEach(n => neujemanja.add(l.naziv + ": " + n));
    const { edinstveni: eZapisi, podvojeni: pZapisi } = zdruziPoKljucu(zapisi, z => z.employee_id + "|" + z.work_date);
    const { edinstveni: eDopusti, podvojeni: pDopusti } = zdruziPoKljucu(dopusti, d => d.full_name + "|" + d.work_date);
    if (pZapisi.size || pDopusti.size) neujemanja.add(`${l.naziv}: ${pZapisi.size + pDopusti.size} podvojenih vpisov (ista oseba/dan večkrat v tem zavihku) - uporabljena zadnja vrednost`);
    await Promise.all([
      eZapisi.length ? shraniZapiseRazporeda(eZapisi) : Promise.resolve(),
      eDopusti.length ? shraniDopusteNzv(eDopusti) : Promise.resolve(),
    ]);
    steviloRazporeda += eZapisi.length;
    steviloOdsotnosti += eDopusti.length;
  }

  if (!steviloRazporeda && !steviloOdsotnosti) {
    throw new Error(
      `V datoteki ni prepoznanih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]}. ` +
      `Prepoznani oddelčni listi: ${oddelki.map(o => o.koda).join(", ") || "noben"}.` +
      (preskoceni.length ? ` Neprepoznani listi (preveri ime zavihka/vsebino): ${preskoceni.join(", ")}.` : "")
    );
  }
  const deli = [];
  if (povzetekOddelki.length) deli.push("oddelki: " + povzetekOddelki.join(", "));
  if (steviloOdsotnosti) deli.push(`${steviloOdsotnosti} vpisov odsotnosti (LD/IZOB/BS)`);
  let besedilo = `Uvoženih skupaj ${steviloRazporeda + steviloOdsotnosti} vpisov` + (deli.length ? " (" + deli.join("; ") + ")" : "") + ".";
  if (preskoceni.length) besedilo += ` Preskočeni listi (niso prepoznani kot oddelek ali NZV za izbrani mesec): ${preskoceni.join(", ")}.`;
  if (neujemanja.size) besedilo += ` Opombe: ${[...neujemanja].join(", ")}.`;
  if (opozoriloPokrivaOddelek) besedilo += " " + opozoriloPokrivaOddelek;
  return besedilo;
}

// Enak namen kot pripraviPosodobitveOddelka (glej tam), a za NZV obliko:
// stolpci so ENOTE (znane, fiksne po nzvNazivVKodo), ne osebe, zato tu ne
// primerjamo glave z znanim naborom ljudi, ampak vsak naziv stolpca v listu
// prevedemo nazaj v kodo in poiščemo njegovo trenutno vrednost v "podatki"
// (glej nalozizPodatkeNzv) - to samodejno podpre tudi drugačen vrstni red
// stolpcev, kot ga ima NZV_STOLPCI, dokler so nazivi enaki uradni predlogi.
function pripraviPosodobitveNzv(vrsteVrstic, ciljniMesec, podatki){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const nazivVKodo = nzvNazivVKodoNorm();
  const posodobitve = [];
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum((vrsteVrstic[i] || [])[0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciEnoteNzv, 1, (vrstica, stolpci, datum, j) => {
      stolpci.forEach((naziv, idx) => {
        const koda = nazivVKodo[nzvKljucGlave(naziv)];
        if (!koda) return;
        posodobitve.push({ vrstica: j, stolpec: 1 + idx, vrednost: podatki[koda + "|" + datum] || "" });
      });
    }, stanje);
  }
  return { posodobitve, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava };
}

async function zapisiNzvVSheets(url, ciljniMesec){
  if (!window.GSheetsExport || !window.GSheetsExport.jeNastavljeno()) {
    throw new Error("Pisanje v Google Sheets še ni nastavljeno – manjka Google Client ID (glej GSHEETS-SETUP.md).");
  }
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { podatki } = await nalozizPodatkeNzv(startISO, endISO);
  const { naslovLista, vrsteVrstic } = await window.GSheetsExport.preberiVrednosti(url);
  const { posodobitve, najdenDatum, najdenaGlava } = pripraviPosodobitveNzv(vrsteVrstic, ciljniMesec, podatki);
  if (!posodobitve.length) {
    if (!najdenDatum) throw new Error(`V zavihku "${naslovLista}" ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} - preveri, da povezava kaže na pravi zavihek (klikni zavihek za ta oddelek, šele nato kopiraj povezavo).`);
    if (!najdenaGlava) throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nad njimi ni najti vrstice z glavami enot.`);
    throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nobena glava stolpca v listu se ni ujemala z znano enoto NZV.`);
  }
  const rezultat = await window.GSheetsExport.zapisiVObstojeciList(url, posodobitve);
  return `Zapisanih ${rezultat.stevilo} celic v zavihek "${rezultat.list}".`;
}

// Shrani zadnjo uporabljeno povezavo LOČENO za vsak kontekst (Moj
// razpored/vsak oddelek/NZV posebej - "več povezav" - admin ima ločen
// dokument za HOSPITAL in za NZV, oddelki pa so lahko celo ločeni zavihki
// znotraj istega dokumenta), da mu jih ni treba ob vsakem preklopu znova
// lepiti.
function kljucUvoza(kontekst){ return "razpored-uvoz-url-" + (kontekst || "my"); }

// Odpiranje NI notranje stanje te komponente: sprožilna ikona živi v
// fiksni vrstici ikon zgoraj desno (RazporedLogout "pred"), sama pa mora
// ostati zunaj nje, ker je ta vrstica z-index kontekst – modalno okno v
// njej bi se stackalo skupaj z njo. Zato "odprto"/"naZapri" prideta od
// strani, tu pa se izriše samo okno.
function UvozIzSheets({ profile, wardCode, myId, month, onUvozeno, odprto, naZapri }){
  const kontekst = wardCode || "my";
  const [url, setUrl] = useState(() => { try { return localStorage.getItem(kljucUvoza(kontekst)) || ""; } catch (e) { return ""; } });
  const [busy, setBusy] = useState(null); // "moj" | "oddelek" | null
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    setMsg(null);
    try { setUrl(localStorage.getItem(kljucUvoza(kontekst)) || ""); } catch (e) { setUrl(""); }
  }, [kontekst]);

  if (!profile || profile.role !== "admin") return null;

  const spremeniUrl = (v) => {
    setUrl(v);
    try { localStorage.setItem(kljucUvoza(kontekst), v); } catch (e) { /* zasebni način ipd. - ni usodno */ }
  };

  const nalozi = async (tip) => {
    if (!url.trim()) { setMsg({ ok: false, text: "Vnesi povezavo do Google Sheets." }); return; }
    setBusy(tip); setMsg(null);
    try {
      let besedilo;
      if (tip === "moj") besedilo = await uvoziMojRazpored(url.trim(), myId, profile.department_code, month);
      else if (wardCode === "NZV") besedilo = await uvoziNzv(url.trim(), month, myId);
      else besedilo = await uvoziOddelek(url.trim(), wardCode, month);
      setMsg({ ok: true, text: besedilo });
      onUvozeno();
    } catch (e) {
      setMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setBusy(null);
    }
  };

  // Najlažja pot za uporabnika (glej pogovor) - namesto da za VSAK oddelek
  // posebej lepi pravo #gid= povezavo, naloži EN Excel izvoz (lahko z več
  // zavihki, cel delovni zvezek) in aplikacija sama prepozna vsebino
  // vsakega lista (glej uvoziDatotekoPametno). Na voljo ne glede na to, kateri
  // zavihek/oddelek je trenutno izbran zgoraj - naložena datoteka se obdela
  // v celoti. Isti gumb lahko uporabiš večkrat (nova datoteka, popravljena
  // različica, naslednji mesec …) - vsak nov uvoz samo prepiše/dopolni
  // obstoječe vpise za zadevni dan, nič se ne podvoji (upsert po datumu).
  // Kadar je v enem zavihku več različic istega meseca, uvoz obstane tukaj in
  // počaka na odločitev. Obljuba se razreši, ko uporabnik klikne - ali
  // zavrne, kar uvoz ustavi, namesto da bi tiho vzel zadnjo različico.
  const [izbira, setIzbira] = useState(null);
  const izberiBlok = (podatki) => new Promise(resolve => {
    setIzbira({ ...podatki, odgovori: (blok) => { setIzbira(null); resolve(blok); } });
  });

  const nalozizDatoteko = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // da lahko isto datoteko izbereš tudi drugič zapored
    if (!file) return;
    setBusy("datoteka"); setMsg(null);
    try {
      const besedilo = await uvoziDatotekoPametno(file, month, myId, izberiBlok);
      setMsg({ ok: true, text: besedilo });
      onUvozeno();
    } catch (err) {
      setMsg({ ok: false, text: err.message || String(err) });
    } finally {
      setBusy(null);
    }
  };

  // Ločen uvoz za "Razporeditev zaposlenih v UA in DEŽ" (dežurni zdravniki -
  // glej obdelajZdravnikiVrstice/dezurni_zdravniki) - na voljo ne glede na
  // izbrani oddelek/kontekst, ker ti podatki niso vezani na oddelek.
  const nalozizZdravnike = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBusy("zdravniki"); setMsg(null);
    try {
      const besedilo = await uvoziZdravnike(file, month);
      setMsg({ ok: true, text: besedilo });
    } catch (err) {
      setMsg({ ok: false, text: err.message || String(err) });
    } finally {
      setBusy(null);
    }
  };

  // Piše nazaj za navadne oddelke IN za NZV (uvoziOddelek/pripraviPosodobitveOddelka
  // in uvoziNzv/pripraviPosodobitveNzv obe najdeta iste koordinate, ki jih uvoz tudi
  // prebere) - samo "Moj razpored" te možnosti (še) nima, ker gre za osebno, ne
  // deljeno tabelo. Zahteva potrditev, ker piše v deljen, ročno voden dokument z
  // realno zgodovino/podpisi - napačna povezava (napačen zavihek) bi lahko
  // prepisala tuje celice.
  const zapisiNazaj = async () => {
    if (!url.trim()) { setMsg({ ok: false, text: "Vnesi povezavo do Google Sheets." }); return; }
    if (!window.confirm(
      `To bo prepisalo obstoječe celice s podatki za ${MESECI[Number(month.split("-")[1]) - 1]} ${month.split("-")[0]} v zavihku, na katerega kaže zgornja povezava, s trenutnim stanjem iz aplikacije.\n\n` +
      "Imena/nazivi stolpcev, oblika in podpisni blok ostanejo nedotaknjeni - spremenijo se samo celice s podatki. To dejanje ni mogoče razveljaviti (razen ročno, v Google Sheets prek Zgodovina različic).\n\nNadaljujem?"
    )) return;
    setBusy("zapis"); setMsg(null);
    try {
      const besedilo = wardCode === "NZV" ? await zapisiNzvVSheets(url.trim(), month) : await zapisiOddelekVSheets(url.trim(), wardCode, month);
      setMsg({ ok: true, text: besedilo });
    } catch (e) {
      setMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setBusy(null);
    }
  };

  // Napredna, redkeje uporabljena funkcija (samo admin) - v modalnem oknu,
  // da glavni zaslon ostane čist (na telefonu se odpre z dna).
  if (!odprto) return null;
  return (
    <div className="no-print">
        {izbira && (
          <div className="modalOzadje" role="dialog" aria-modal="true" aria-label="Izberi različico meseca"
               style={{zIndex: 60}}>
            <div className="modalOkno">
              <div className="modalGlava">
                <h3>Katera različica velja?</h3>
              </div>
              <p className="hint" style={{marginTop:0}}>
                V zavihku <b>{izbira.koda}</b> je za ta mesec <b>{izbira.bloki.length} različic</b>.
                Aplikacija ne ugiba, katera je prava – izberi jo sam. Uvozila se bo samo izbrana.
              </p>
              <div className="card">
                {izbira.bloki.map((b, i) => (
                  <button key={i} type="button" className="dlMenuItem" style={{width:"100%", textAlign:"left"}}
                          onClick={() => izbira.odgovori(b)}>
                    <b>{b.opis}</b>
                    <div className="hint" style={{margin:"2px 0 0"}}>
                      {b.verzija ? b.verzija + " · " : ""}
                      {b.izpolnjenih} izpolnjenih celic · {b.imena.filter(Boolean).length} oseb
                    </div>
                  </button>
                ))}
              </div>
              <button type="button" className="btnGhost" style={{marginTop:8}}
                      onClick={() => izbira.odgovori(null)}>Prekliči uvoz</button>
            </div>
          </div>
        )}
        <div className="modalOzadje" role="dialog" aria-modal="true" aria-label="Uvoz iz Google Sheets"
          onClick={e => { if (e.target === e.currentTarget) naZapri(); }}>
        <div className="modalOkno">
          <div className="modalGlava">
            <h3>📥 Uvoz razporeda</h3>
            <button type="button" className="modalZapri" aria-label="Zapri" onClick={naZapri}>✕</button>
          </div>

          <p className="hint" style={{marginTop:0, marginBottom:6}}>
            <b>Najlažje:</b> naloži Excel izvoz razporeda (.xlsx) – lahko cel delovni zvezek z več zavihki (npr. cel
            dokument "2026 SMS RAZPORED"). Aplikacija sama prepozna, kateri zavihek je kateri oddelek/mesec, in
            uvozi vse naenkrat, ne glede na to, kateri oddelek je trenutno izbran zgoraj. Datoteko lahko naložiš
            tudi večkrat zapored (nova različica, naslednji mesec …) – vsak nov uvoz samo prepiše/dopolni obstoječe
            vpise, nič se ne podvoji.
          </p>
          <div className="field" style={{ marginTop: 0, marginBottom: 12 }}>
            <label className="dlBtn" style={{display:"inline-block", cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1}}>
              {busy === "datoteka" ? "Uvažam …" : "📁 Naloži datoteko (samodejno)"}
              <input type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}} disabled={!!busy} onChange={nalozizDatoteko} />
            </label>
          </div>

          <p className="hint" style={{marginTop:0, marginBottom:6}}>
            Ločeno: uradni mesečni PDF "Razporeditev zaposlenih v UA in DEŽ" – vpiše, kateri zdravnik je dežuren
            (Urgenca ZDR/Dežurstvo ZDR), da se to imenu prikaže poleg dežurstva v "Moj razpored". Ni vezano na
            izbrani oddelek zgoraj.
          </p>
          <div className="field" style={{ marginTop: 0, marginBottom: 12 }}>
            <label className="dlBtn" style={{display:"inline-block", cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1}}>
              {busy === "zdravniki" ? "Uvažam …" : "🩺 Naloži dežurstvo zdravnikov (PDF)"}
              <input type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}} disabled={!!busy} onChange={nalozizZdravnike} />
            </label>
          </div>

          <details>
            <summary className="hint" style={{cursor:"pointer", marginBottom:8}}>Ali ročno, po povezavi do Google Sheets (za posamezen zavihek)</summary>
            <div className="field" style={{ marginTop: 8 }}>
              <label htmlFor="gsUrl">
                Uvoz iz Google Sheets za {kontekst === "my" ? "Moj razpored" : (kontekst === "NZV" ? "NZV" : "oddelek " + kontekst)} (deljeno kot "vsak s povezavo lahko ogleda")
              </label>
              <input id="gsUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..." value={url} onChange={e => spremeniUrl(e.target.value)} />
            </div>
            <p className="hint" style={{marginTop:2, marginBottom:10}}>
              Pomembno pri dokumentu z več zavihki (en na oddelek): odpri zavihek ZA TA ODDELEK v Google Sheets
              (klikni njegovo ime na dnu preglednice) in šele nato kopiraj povezavo iz naslovne vrstice - ta mora
              vsebovati "#gid=…". Če povezavo kopiraš, ne da bi prej kliknil zavihek, se vedno uporabi prvi zavihek v
              dokumentu, ne tisti, ki ga pričakuješ.
            </p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="dlBtn" type="button" disabled={!!busy} onClick={() => nalozi("moj")}>
              {busy === "moj" ? "Uvažam …" : "📥 Uvozi Moj razpored"}
            </button>
            <button className="dlBtn" type="button" disabled={!!busy || !wardCode} onClick={() => nalozi("oddelek")}>
              {busy === "oddelek" ? "Uvažam …" : "📥 Uvozi " + (wardCode === "NZV" ? "NZV" : "Oddelki")}
            </button>
            {wardCode && (
              <button className="dlBtn" type="button" disabled={!!busy} onClick={zapisiNazaj}>
                {busy === "zapis" ? "Zapisujem …" : "📤 Zapiši nazaj v Sheets"}
              </button>
            )}
          </div>
            <p className="hint" style={{marginTop:6}}>
              Uvozi/zapiše samo mesec, ki je trenutno izbran zgoraj ({MESECI[Number(month.split("-")[1]) - 1]} {month.split("-")[0]}) -
              povezava lahko kaže na zavihek z več meseci (kot realna predloga), aplikacija sama poišče pravi blok. Vsak
              gumb/oddelek si zapomni svojo zadnjo povezavo posebej. "Zapiši nazaj" prepiše SAMO obstoječe celice, ki jih
              uvoz tudi prebere (izmene po osebah za oddelke; enote/Dežurstvo/LD/IZOB/BS za NZV) - novih
              oseb/stolpcev/vrstic ne dodaja, oblike in podpisnega bloka se ne dotakne.
            </p>
          </details>
          {msg && <p className={msg.ok ? "okMsg" : "err"} style={{ marginTop: 8 }}>{msg.text}</p>}
        </div>
        </div>
    </div>
  );
}

// Zložljiva pomoč - dolgo pojasnjevalno besedilo skrito za "?" gumbom,
// da glavni zaslon ostane čist (namesto vedno vidnega odstavka).
function InfoToggle({ children }){
  const [odprto, setOdprto] = useState(false);
  return (
    <div className="no-print" style={{ marginTop: 10, display: "flex", alignItems: "flex-start", gap: 8 }}>
      <button type="button" className="infoToggle" aria-expanded={odprto} aria-label="Pomoč" onClick={() => setOdprto(o => !o)}>?</button>
      {odprto && <div className="infoPanel hint" style={{ margin: 0 }}>{children}</div>}
    </div>
  );
}

// ---------------------------------------------------------------------
// Uvodni nagovor ob prvih odprtjih: namestitev na domači zaslon in vklop
// obvestil.
//
// Zakaj sploh: potisna obvestila na iPhonu delujejo IZKLJUČNO, če je
// aplikacija dodana na domači zaslon in odprta od tam. Safari dogodka
// "beforeinstallprompt" nikoli ne sproži, zato uporabnik iPhona brez tega
// ne dobi nobenega namiga – obvestil preprosto ne bo, brez napake in brez
// pojasnila. Ob uvedbi za celotno ekipo bi to pomenilo, da bi velik del
// mislil, da obveščanje ne dela, čeprav dela.
//
// Kartica se pokaže SAMO, kadar je še kaj za storiti, in jo je mogoče
// zapreti; zaprtje si zapomnimo. Kdor je vse uredil, je nikoli ne vidi.
// ---------------------------------------------------------------------
const UVOD_ZAPRT = "razpored-uvod-zaprt";

function jeIOS(){
  // iPad z novejšim iPadOS se predstavlja kot Mac, zato še preverba na dotik.
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function jeSamostojna(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
    || navigator.standalone === true;
}

function Uvod({ myId, deferredPrompt, naNamesti }){
  const [zaprt, setZaprt] = useState(() => {
    try { return localStorage.getItem(UVOD_ZAPRT) === "1"; } catch (e) { return false; }
  });
  const [pushStanje, setPushStanje] = useState(null); // null = še preverjam
  const [busy, setBusy] = useState(false);
  const [napaka, setNapaka] = useState(null);

  useEffect(() => {
    if (window.RazporedPush) RazporedPush.stanje().then(setPushStanje);
    else setPushStanje("nepodprto");
  }, []);

  const zapri = () => {
    setZaprt(true);
    try { localStorage.setItem(UVOD_ZAPRT, "1"); } catch (e) { /* zasebni način */ }
  };

  const vklopiObvestila = async () => {
    setBusy(true); setNapaka(null);
    try {
      await RazporedPush.vklopi(myId);
      setPushStanje("vklopljeno");
    } catch (e) {
      setNapaka(e.message || String(e));
    } finally { setBusy(false); }
  };

  if (zaprt || pushStanje === null) return null;

  const samostojna = jeSamostojna();
  const ios = jeIOS();
  // Na iPhonu je namestitev POGOJ za obvestila, zato dokler ni nameščena,
  // gumba za obvestila sploh ne ponujamo - vodil bi v tiho napako.
  const kaziNamestitev = !samostojna && (ios || !!deferredPrompt);
  const kaziObvestila = pushStanje === "izklopljeno" && (!ios || samostojna);
  const kaziBlokirano = pushStanje === "zavrnjeno";

  if (!kaziNamestitev && !kaziObvestila && !kaziBlokirano) return null;

  return (
    <div className="uvodKarta no-print">
      <button className="uvodZapri" onClick={zapri} aria-label="Zapri">×</button>
      <div className="uvodNaslov">Da ti razpored pride na telefon</div>

      {kaziNamestitev && (
        <div className="uvodKorak">
          <div className="uvodStevilka">1</div>
          <div>
            <b>Dodaj na domači zaslon</b>
            {ios ? (
              <div className="uvodOpis">
                V Safariju pritisni <b>Deli</b> (kvadratek s puščico navzgor) → <b>Dodaj na začetni zaslon</b> →
                <b> Dodaj</b>. Nato aplikacijo odpri s te ikone.
                <div style={{marginTop:4}}>Na iPhonu je to <b>nujno</b> – brez tega obvestila ne delujejo.</div>
              </div>
            ) : (
              <div className="uvodOpis">Odpira se kot samostojna aplikacija, brez brskalnika.</div>
            )}
            {!ios && deferredPrompt && (
              <button className="uvodGumb" onClick={naNamesti}>Namesti</button>
            )}
          </div>
        </div>
      )}

      {kaziObvestila && (
        <div className="uvodKorak">
          <div className="uvodStevilka">{kaziNamestitev ? 2 : 1}</div>
          <div>
            <b>Vklopi obvestila</b>
            <div className="uvodOpis">
              Obvestilo dobiš ob objavi novega razporeda, ob premiku tvoje menjave in kot opomnik dan pred
              nočno izmeno ali dežurstvom. Velja za to napravo.
            </div>
            <button className="uvodGumb" onClick={vklopiObvestila} disabled={busy}>
              {busy ? "Trenutek …" : "🔔 Vklopi obvestila"}
            </button>
            {napaka && <div className="uvodOpis" style={{color:"var(--danger)"}}>{napaka}</div>}
          </div>
        </div>
      )}

      {kaziBlokirano && (
        <div className="uvodKorak">
          <div className="uvodStevilka">!</div>
          <div>
            <b>Obvestila so blokirana</b>
            <div className="uvodOpis">
              Brskalnik jih je za to stran zavrnil. Odblokiraj jih prek ikone ključavnice ob naslovu strani,
              nato osveži.
            </div>
          </div>
        </div>
      )}

      <div className="uvodOpis" style={{marginTop:10}}>
        Kadar koli pozneje: <b>Nastavitve → Obvestila</b>.
      </div>
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null); // { session, profile }
  const [depts, setDepts] = useState([]);
  // Uvoz razporeda živi TU (en sam, testiran uvoz za vse oddelke + FLEXI +
  // NZV), zavihek "Oddelki" v admin.html pa nanj napoti prek naslova
  // "index.html?uvoz=1&oddelek=…&mesec=…" - tako je uvoz na voljo tudi iz
  // administracije, brez podvajanja uvozne logike na drugi strani (in s
  // tem brez tveganja, da bi se kopiji sčasoma razšli).
  const zacetniUvoz = useMemo(() => {
    try { return preberiUvozIzNaslova(window.location.search); } catch (e) { return null; }
  }, []);

  const [view, setView] = useState(zacetniUvoz && zacetniUvoz.oddelek ? "ward" : "my");
  const [month, setMonth] = useState((zacetniUvoz && zacetniUvoz.mesec) || currentMonthStr());
  const [wardCode, setWardCode] = useState((zacetniUvoz && zacetniUvoz.oddelek) || null);
  const [unread, setUnread] = useState(0);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [reloadKey, setReloadKey] = useState(0); // dvigne se po uvozu iz Google Sheets, da se pogled znova naloži
  // Uvozno okno odpira ikona 📥 v fiksni vrstici zgoraj desno (poleg ⚙ in
  // 🚪), samo okno pa se izriše niže – zato stanje živi tu, med obema.
  const [uvozOdprt, setUvozOdprt] = useState(!!zacetniUvoz);
  // Ko je uvozno okno enkrat odprto prek ?uvoz=1, parametre pobrišemo iz
  // naslova - sicer bi se okno znova odprlo ob vsakem osveževanju strani
  // (in ob delitvi povezave). Stanje komponente je že prebrano zgoraj.
  useEffect(() => {
    if (!zacetniUvoz) return;
    try { window.history.replaceState({}, "", window.location.pathname); } catch (e) { /* ni usodno */ }
  }, [zacetniUvoz]);
  // "Obrni na ležeči prikaz" - na telefonu s samodejnim obračanjem zaslona
  // IZKLOPLJENIM (pogosto v nastavitvah Androida) se @media (orientation:
  // landscape) nikoli ne sproži, zaslon pa fizično ostane ozek (portret) ne
  // glede na to, kako uporabnik drži telefon. Prvi poskus (samo širša
  // postavitev tabele prek CSS razreda) je zato samo stiskal stolpce v
  // isto ozko širino - video posnetek uporabnika je to potrdil. Zato gumb
  // zdaj namesto tega dejansko ZAVRTI celo stran za 90° prek CSS transform
  // (glej html.sirsiPogled body v <style> zgoraj) - to resnično poveča
  // razpoložljivo širino, ne le prikaže tabelo drugače.
  const [sirsiPogled, setSirsiPogled] = useState(() => {
    try { return localStorage.getItem("razpored-sirsi-pogled") === "1"; } catch (e) { return false; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle("sirsiPogled", sirsiPogled);
    try { localStorage.setItem("razpored-sirsi-pogled", sirsiPogled ? "1" : "0"); } catch (e) { /* zasebni način ipd. - ni usodno */ }
  }, [sirsiPogled]);

  // Če telefon FIZIČNO postane ležeč (uporabnik ga med ogledom obrne, ali
  // ima samodejno obračanje vklopljeno), ročni zasuk (rotate(90deg) na
  // body, glej <style> zgoraj) samodejno ugasnemo. Uporabnikov posnetek
  // zaslona je pokazal pravi hrošč te kombinacije: PRAVA ležeča orientacija
  // + še vedno aktiven ročni zasuk je stran stisnila v majhen pas na sredini
  // zaslona (100vh/100vw sta bila izračunana za staro, pokončno stanje in
  // se ob fizičnem obratu nista zanesljivo preračunala). Ko je telefon
  // resnično ležeč, ga @media (orientation: landscape) že sam po sebi
  // pravilno prikaže široko - ročni zasuk takrat samo škodi, zato ga takoj
  // izklopimo, še preden pride do konflikta (namesto da bi se zanašali na
  // to, da se @media (orientation: portrait) zgoraj pravočasno prereši).
  // resnicnoLezece skriva gumb "Obrni na ležeči prikaz" v pravi ležeči
  // orientaciji - tam bi klik nanj takoj sam sebe razveljavil (zgornji
  // efekt ga vrne na false), torej bi bil gumb viden, a brez učinka
  // (uporabnik je natanko to opazil na posnetku).
  const [resnicnoLezece, setResnicnoLezece] = useState(false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(orientation: landscape)");
    const naOrientacijo = () => {
      setResnicnoLezece(mq.matches);
      if (mq.matches) setSirsiPogled(false);
    };
    naOrientacijo();
    if (mq.addEventListener) mq.addEventListener("change", naOrientacijo);
    else mq.addListener(naOrientacijo); // starejši WebView brez addEventListener na MediaQueryList
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", naOrientacijo);
      else mq.removeListener(naOrientacijo);
    };
  }, []);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setAuth(res);
      const dept = res.profile ? res.profile.department_code : null;
      // Razpored je viden vsem zaposlenim za VSE oddelke (dogovorjeno) - enako,
      // kot že velja v bazi (schedule_select: "to authenticated using (true)").
      // Privzeto se odpre svoj oddelek, preklop na katerega koli drugega pa je
      // prost; kdor oddelka nima, začne na prvem v seznamu.
      setWardCode(PO_ODDELKIH_KODE.includes(dept) ? dept : PO_ODDELKIH_KODE[0]);
      RazporedAuth.unreadNotificationCount(res.session.user.id).then(setUnread);
    });
  }, []);

  useEffect(() => {
    client.from("oddelki").select("code, name").order("code").then(({ data }) => {
      const imenaPoKodi = {};
      (data || []).forEach(d => { imenaPoKodi[d.code] = d.name; });
      const seznam = PO_ODDELKIH_KODE.map(k => ({ code: k, name: imenaPoKodi[k] || k }));
      seznam.push({ code: "NZV", name: "NZV – vodje, administratorji (+ dežurstva)" });
      setDepts(seznam);
    });
  }, []);

  useEffect(() => {
    if ("serviceWorker" in navigator){
      // updateViaCache:"none" prepreči, da bi brskalnik sam sw.js stregel
      // iz HTTP predpomnilnika - sicer nova različica (in s tem osvežene
      // skupne .js datoteke) do uporabnika lahko pride šele čez ure.
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
    }
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
  };

  // Excel/Google Sheets izvoz – kliče ga kompaktni ikonski meni ob polju
  // Mesec (glej RazporedIzvoz compact spodaj). PDF izvoz (PrintFit) dela
  // neposredno nad izrisano tabelo/kartico, tu pa gre za surove podatke
  // (glave+vrstice), zato ju je treba znova prebrati - isti poizvedbi kot
  // MyScheduleView/WardView, samo na zahtevo namesto stalno v komponenti.
  // Podpisne vrstice na dnu izvoza (Datum objave/Zadnja sprememba/Pripravil/
  // Pregledal in odobril) - ista logika kot RazporedPodpisi na zaslonu, samo
  // kot dodatne vrstice v podatkih namesto ločenega HTML bloka, po vzoru
  // uradnih predlog. Prva celica vsake vrstice je namenoma prazna (uvoz jo
  // prepozna kot ne-datumsko vrstico in jo preskoči - glej ISO_DATUM_RX).
  const podpisneVrstice = async (entries, stolpcev) => {
    const prazno = new Array(stolpcev).fill("");
    const objava = (entries || []).reduce((min, e) => (e.created_at && (!min || e.created_at < min.created_at)) ? e : min, null);
    const zadnja = (entries || []).reduce((max, e) => (e.updated_at && (!max || e.updated_at > max)) ? e.updated_at : max, null);
    const [{ data: koord }, { data: pripravilProfil }] = await Promise.all([
      client.from("profili").select("full_name, job_title").eq("is_koordinator", true).limit(1).maybeSingle(),
      objava && objava.created_by
        ? client.from("profili").select("full_name, job_title").eq("id", objava.created_by).maybeSingle()
        : Promise.resolve({ data: null }),
    ]);
    const nazivIme = (p) => p ? p.full_name + (p.job_title ? ", " + p.job_title : "") : "";
    const vrstice = [];
    vrstice.push(["Datum objave razporeda:", objava && objava.created_at ? window.Datum.sloSCasom(objava.created_at) : "ni podatka", ...prazno.slice(2)]);
    vrstice.push(["Zadnja sprememba:", zadnja ? window.Datum.sloSCasom(zadnja) : "ni podatka", ...prazno.slice(2)]);
    if (pripravilProfil) vrstice.push(["Pripravil/-a:", nazivIme(pripravilProfil), ...prazno.slice(2)]);
    if (koord) vrstice.push(["Pregledal in odobril:", nazivIme(koord), ...prazno.slice(2)]);
    return vrstice;
  };

  const pripraviIzvoz = async () => {
    const { startISO, endISO } = monthRange(month);
    const days = daysInRange(startISO, endISO);
    if (view === "my") {
      const { data } = await client.from("razpored").select("work_date, shift_code")
        .eq("employee_id", auth.session.user.id).gte("work_date", startISO).lte("work_date", endISO);
      const byDate = {}; (data || []).forEach(r => { byDate[r.work_date] = r.shift_code; });
      // Isto dopolnjevanje kot na zaslonu (glej MyScheduleView): brez tega
      // je bil izvoz za vodje skoraj prazen, čeprav je zaslon poln.
      // auth.profile in ne kasneje razstavljeni "profile": ta je v tej
      // funkciji deklariran šele NIŽE, zato bi bralec upravičeno podvomil
      // v vrstni red - tu ni razloga za to negotovost.
      const jaz = auth.profile;
      if (jaz && jaz.department_code === "NZV" && jaz.full_name) {
        const { data: nosilci } = await client.from("nosilci_oddelkov")
          .select("full_name, enote, odsotnost_tip, odsotnost_do");
        const moj = (nosilci || []).find(n => n.enote && imenaSeUjemataNzv(n.full_name, jaz.full_name));
        window.NzvZasedba.stalnaZasedba(moj, days.map(dn => dn.datum), d => !!byDate[d])
          .forEach(x => { byDate[x.datum] = x.sifra; });
      }
      return [{
        ime: "Moj razpored",
        glave: ["Datum", "Dan", "Izmena"],
        vrstice: days.map(dn => [datumSlo(dn.datum), dn.dan, shiftLabel(byDate[dn.datum])]),
      }];
    }

    // view === "ward"
    if (wardCode === "NZV") {
      // Isto obliko (dnevi v vrsticah, ENOTE v stolpcih, parafe namesto
      // polnih imen, SA razdeljena na dopoldan/popoldan, LD/IZOB/BS povzetek
      // odsotnosti) kot na zaslonu - glej NzvView/nalozizPodatkeNzv -
      // usklajeno z uradno predlogo "Letni dopusti in omejitve za NZV".
      const { podatki: m, entries: data } = await nalozizPodatkeNzv(startISO, endISO);
      // SAMO en uvodni stolpec ("Datum", dan že vsebovan v besedilu) - za
      // razliko od oddelčnih tabel realna predloga "Letni dopusti in
      // omejitve za NZV" NIMA ločenega stolpca "Dan" (glava se začne
      // neposredno "DATUM | PDZN | SOBO | …").
      const glaveKoncne = ["Dežurstvo", "LD", "IZOB", "BS"];
      return [{
        ime: "NZV",
        glave: ["Datum", ...NZV_STOLPCI.map(([, naziv]) => naziv), ...glaveKoncne],
        vrstice: [
          ...days.map(dn => [
            datumSlo(dn.datum) + " " + dn.dan,
            ...NZV_STOLPCI.map(([koda]) => m[koda + "|" + dn.datum] || ""),
            m["DEZ|" + dn.datum] || "", m["LD|" + dn.datum] || "", m["IZOB|" + dn.datum] || "", m["BS|" + dn.datum] || "",
          ]),
          ...(await podpisneVrstice(data, NZV_STOLPCI.length + 1 + glaveKoncne.length)),
        ],
      }];
    }

    // Isto transponirano obliko (dnevi v vrsticah, osebe v stolpcih glave -
    // kratka imena "Priimek X." kot na zaslonu) kot na zaslonu (glej
    // WardView) - usklajeno z uradno predlogo "2026 SMS RAZPORED". Druga
    // vrstica podatkov (prazen Datum/Dan) je vloga vsake osebe (SMS/TZN ali
    // DMS/DZN), po vzoru iste predloge.
    const naslovOddelka = (depts.find(d => d.code === wardCode) || {}).name || wardCode;
    // Vnosi se berejo PO OSEBAH, ne po razpored.department_code -
    // ista razlika kot v WardView: FLEXI kader ima vnose zapisane pod
    // oddelkom, ki ga tisti dan pokriva (department_code = "FLEXI",
    // pokriva_oddelek = ciljni oddelek), pri starejših uvozih pa celo pod
    // samim ciljnim oddelkom. Filtriranje po department_code je zato
    // puščalo cele stolpce prazne.
    const { data: profili } = await client.from("profili")
      .select("id, full_name, role").eq("department_code", wardCode).order("full_name");
    const zaposleni = profili || [];
    const { data } = zaposleni.length
      ? await client.from("razpored")
          .select("employee_id, work_date, shift_code, department_code, pokriva_oddelek, created_at, created_by, updated_at")
          .in("employee_id", zaposleni.map(z => z.id))
          .gte("work_date", startISO).lte("work_date", endISO)
      : { data: [] };
    const byEmpDate = {};
    (data || []).forEach(r => {
      // Ista oznaka kot na zaslonu: pri FLEXI pove, kateri oddelek oseba
      // ta dan pokriva ("C: dopoldan"), sicer je pred izmeno ni.
      const pokrivaSurovo = r.pokriva_oddelek || (r.department_code !== wardCode ? r.department_code : null);
      const pokriva = window.NzvZasedba.jeDelovisce(pokrivaSurovo) ? pokrivaSurovo : null;
      byEmpDate[r.employee_id + "|" + r.work_date] = (pokriva ? pokriva + ": " : "") + shiftLabel(r.shift_code);
    });
    return [{
      ime: naslovOddelka,
      glave: ["Datum", "Dan", ...zaposleni.map(z => priimekZacetnica(z.full_name))],
      vrstice: [
        ["", "", ...zaposleni.map(z => z.role === "user" ? "SMS / TZN" : "DMS / DZN")],
        ...days.map(dn => [datumSlo(dn.datum), dn.dan, ...zaposleni.map(z => byEmpDate[z.id + "|" + dn.datum] || "")]),
        ...(await podpisneVrstice(data, zaposleni.length + 2)),
      ],
    }];
  };

  if (!auth) return null; // requireAuth preusmeri, če ni prijave

  const { session, profile } = auth;
  // "Po oddelkih" je odprt vsem prijavljenim, za vse oddelke. Pravice za
  // pisanje (generiranje, objava) in odobritve ostajajo nespremenjene - te
  // še naprej ločuje vloga, tako v vmesniku kot v RLS politikah.

  // Izvoz je ikona v isti fiksni vrstici kot uvoz/nastavitve/odjava, zato
  // je element definiran tu in podan navzdol – prej je stal v vrstici z
  // izbirnikom meseca in ji jemal širino.
  const izvozniVir = (
        <RazporedIzvozVir
          naziv={view === "ward" ? (wardCode === "NZV" ? "NZV" : "Oddelek " + (wardCode || "")) : "Moj razpored"}
          naslov={(view === "ward" ? "razpored-" + wardCode : "moj-razpored") + "-" + month}
          pripravi={pripraviIzvoz}
          pdf={{
            label: "Izvozi v PDF (" + (view === "ward" ? "A4 ležeče" : "A4 pokončno") + ", 1 stran)",
            onClick: () => {
              const el = view === "ward" ? document.querySelector(".wardPrintArea") : document.getElementById("printMy");
              // "pdfCols" razporedi tedne v več stolpcev SAMO za izvoz (glej
              // CSS zgoraj) - doda se pred merjenjem/tiskanjem, odstrani po
              // "afterprint", da se živ zaslon nikoli ne spremeni.
              if (view === "my" && el) {
                el.classList.add("pdfCols");
                const pocistiPoTiskanju = () => {
                  el.classList.remove("pdfCols");
                  window.removeEventListener("afterprint", pocistiPoTiskanju);
                };
                window.addEventListener("afterprint", pocistiPoTiskanju);
              }
              PrintFit.natisni(el, { orientacija: view === "ward" ? "landscape" : "portrait" });
            },
          }}
          ical={view === "my" ? {
            onClick: async () => {
              const { startISO, endISO } = monthRange(month);
              const { data } = await client.from("razpored").select("work_date, shift_code")
                .eq("employee_id", session.user.id).gte("work_date", startISO).lte("work_date", endISO);
              const byDate = {}; (data || []).forEach(r => { byDate[r.work_date] = r.shift_code; });
              const dnevi = daysInRange(startISO, endISO);
              prenesiICS(ustvariICS(dnevi, byDate), "moj-razpored-" + month + ".ics");
            },
          } : undefined}
        />
  );

  return (
    <div className={"wrap"
      // "Moj razpored" je na namizju širši: mesec se izriše v več stolpcih
      // (glej .weeksGrid v theme.css), da ga ni treba prevrteti čez cel
      // zaslon - pri 1440px je bilo prej vidnih ~6 dni, levo in desno pa
      // prazen prostor. Na telefonu ostane vse nespremenjeno.
      + (view === "my" ? " mesecStolpci" : "")
      + (view === "ward" ? " wide polna" : "")
      // Razpredelnica dobi VSO širino zaslona (ne le 1400 px kot oddelčni
      // razpored): 31 dni × osebe se drugače ne izriše na en zaslon.
      + (view === "stanje" ? " wide polna cezZaslon" : "")}>
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout pred={
        <React.Fragment>
          <RazporedOrodja/>
        </React.Fragment>
      }/>
      {profile && profile.role === "admin" && (
        <RazporedUvozVir
          kljuc="razpored"
          ikona="📗"
          naziv="Razpored iz Google Sheets"
          opis={view === "ward" ? (wardCode === "NZV" ? "NZV" : "oddelek " + (wardCode || "–")) : "Moj razpored"}
          onClick={() => setUvozOdprt(true)}
        />
      )}
      <header className="top">
        <div className="wordmark">
          <img className="logoSmall" src="logo-pbb.png" alt="" />
          <span className="mark">Razpored</span>
        </div>
        <p className="sub">{window.Datum.mesecLeto(month)} · Psihiatrična bolnišnica Begunje</p>
        <div className="whoRow no-print">
          <span className="who">Prijavljen: <b>{profile ? profile.full_name : session.user.email}</b></span>
        </div>

        {/* Štirje zavihki. Na ŠIROKEM zaslonu ostanejo besedni, kot so bili
            (uporabnikova izrecna zahteva: "spletna verzija ostane tako kot
            je"). Na telefonu bi štiri polne besede razbile vrstico, zato
            se tam izriše ikona z drobnim napisom pod njo - napis ostane,
            ker sta "Oddelki" in "Razpredelnica" s samo ikono preveč
            podobna. Ikona je vedno v besedilu gumba in skrita na širokem
            zaslonu prek CSS, da je vrstni red in dostopnost enaka. */}
        <div className="segmented segIkone no-print" role="tablist">
          {[
            ["my", "Moj razpored", "Moj", "🗓️"],
            ["ward", "Oddelki", "Oddelki", "👥"],
            ["stanje", "Razpredelnica", "Razpredelnica", "▦"],
            ["dez", "Dežurstvo", "Dežurstvo", "🌙"],
          ].map(([koda, naziv, kratko, ikona]) => (
            <button key={koda} role="tab" aria-selected={view===koda} title={naziv}
              onClick={() => setView(koda)}>
              <span className="segIkona" aria-hidden="true">{ikona}</span>
              <span className="segNaziv">{naziv}</span>
              <span className="segKratko">{kratko}</span>
            </button>
          ))}
        </div>

        {view==="ward" && (
          <div className="field no-print">
            <label htmlFor="wd">Oddelek</label>
            <select id="wd" value={wardCode || ""} onChange={e => setWardCode(e.target.value)}>
              <option value="" disabled>Izberi oddelek …</option>
              {depts.map(d => <option key={d.code} value={d.code}>{d.name}</option>)}
            </select>
          </div>
        )}
        {/* Razpredelnica ima svoj izbirnik meseca in oddelka (prišla je z
            njima iz Imenika), zato bi bila zgornja dva odvečna in bi si
            nasprotovala. */}
        {view !== "stanje" && <div className="field no-print">
          <label htmlFor="mmSel">Mesec</label>
          <div style={{display:"flex", gap:8, alignItems:"center"}}>
            <select id="mmSel" value={Number(month.split("-")[1])}
              onChange={e => setMonth(month.split("-")[0] + "-" + String(e.target.value).padStart(2,"0"))}
              style={{flex:"1 1 auto", minWidth:0}}>
              {MESECI.map((m, i) => <option key={i} value={i+1}>{m}</option>)}
            </select>
            <select id="ySel" value={Number(month.split("-")[0])}
              onChange={e => setMonth(e.target.value + "-" + month.split("-")[1])}
              style={{flex:"0 0 auto", minWidth:0}}>
              {Array.from({length:5}, (_, i) => new Date().getFullYear() - 1 + i).map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>}
        {view === "ward" && !resnicnoLezece && (
          <button type="button" className="dlBtn no-print" style={{marginTop:10}}
            aria-pressed={sirsiPogled} onClick={() => setSirsiPogled(s => !s)}>
            {sirsiPogled ? "📱 Nazaj na pokončni prikaz" : "🔄 Obrni na ležeči prikaz"}
          </button>
        )}
      </header>

      {izvozniVir}
      <UvozIzSheets
        profile={profile}
        wardCode={view === "my" ? null : wardCode}
        myId={session.user.id}
        month={month}
        onUvozeno={() => setReloadKey(k => k + 1)}
        odprto={uvozOdprt}
        naZapri={() => setUvozOdprt(false)}
      />

      {view==="my" && <MyScheduleView key={"my" + reloadKey} userId={session.user.id} month={month}
        jeNzv={!!profile && profile.department_code === "NZV"} />}
      {view==="ward" && wardCode && (
        wardCode === "NZV"
          ? <NzvView key={"nzv" + reloadKey} month={month} profile={profile} />
          : <WardView key={"ward" + reloadKey} deptCode={wardCode} month={month} myId={session.user.id} />
      )}
      {view==="ward" && !wardCode && <p className="sub" style={{marginTop:16}}>Izberi oddelek zgoraj.</p>}
      {/* Razpredelnica in Dežurstvo sta prišla sem iz Imenika oz. iz
          razporeda NZV (uporabnikova zahteva, avgust 2026) - oboje sodi k
          Razporedu, ne drugam. */}
      {view==="stanje" && <StanjeRazpredelnica key={"stanje" + reloadKey} oddelki={depts} />}
      {view==="dez" && <DezurstvoPregled key={"dez" + reloadKey} month={month} myId={session.user.id} />}
      {/* Menjave se izpišejo POD mesečnim razporedom in samo adminu
          (uporabnikova izrecna zahteva) - navadni zaposleni jih vidi na
          strani "Menjava". Ni vezano na izbrani oddelek: menjava lahko
          poteka tudi med osebama z različnih oddelkov. */}
      {view==="ward" && wardCode && profile && profile.role === "admin" && (
        <MenjaveVMesecu key={"menjave" + reloadKey} month={month} />
      )}

      <Uvod myId={session.user.id} deferredPrompt={deferredPrompt} naNamesti={install} />

      <footer className="foot">
        <p><b>Razpored PBB</b> – prijavljen dostop. Za spremembe ali zamenjave uporabi »Menjava« spodaj.</p>
        <p>Razpored temelji na osnovnem kalupu; dejanske spremembe (bolniška, odobrene menjave) se odražajo sproti. Preverite tudi na oglasni deski oddelka.</p>
      </footer>

      <RazporedNav active="index" role={profile ? profile.role : "user"} unread={unread} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
