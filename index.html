<head>

<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  /* Stran-specifično za index.html: samo tisk v PDF na točno 1 stran
     (PrintFit.natisni izračuna --print-scale). Vse ostalo (barve,
     gumbi, kartice, tabela …) prihaja iz theme.css. */
  @media print{
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th{ background:#f2f2f2 !important; }
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important; }
    .wardPrintArea{ zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr{ break-inside:avoid; page-break-inside:avoid; }
    #printMy{ zoom: var(--print-scale, 1); }
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .wrap{ max-width:100% !important; }
  }

  /* "Moj razpored" na zaslonu ostane en stolpec pod drugim (nespremenjeno,
     ne glede na obračanje zaslona) - razred "pdfCols" se doda samo tik pred
     klicem PrintFit.natisni (glej App spodaj) in odstrani po tiskanju
     ("afterprint"), da so tedni v PDF izvozu razporejeni v več stolpcih in
     cel mesec pride na eno stran. Namenoma NI znotraj @media print zgoraj:
     PrintFit.natisni izmeri scrollHeight elementa PRED klicem window.print()
     (torej pred aktivacijo @media print), zato mora biti postavitev že
     spremenjena OB MERJENJU, ne šele med dejanskim tiskanjem. */
  #printMy.pdfCols .weeksGrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px; }

  /* "Po oddelkih" — tabela postavljena kot uradna predloga "2026 SMS
     RAZPORED": dnevi v vrsticah (stolpec "Dan" je zdaj samo datum, ne ime
     osebe), osebe v stolpcih glave. Vikend obarva celo vrstico (kot v
     predlogi), ne posamezne celice; lastni stolpec (bralec sam) je rahlo
     poudarjen. */
  table.wardTableT td.name, table.wardTableT th.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; }
  table.wardTableT tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  table.wardTableT thead th.me{ background: rgba(var(--accent-rgb),.15); }

  /* Namizje (širši zaslon) IN ležeča postavitev telefona (manifest.json
     orientation zdaj "any", ne več zaklenjeno na pokončno) - na izrecno
     željo naj bo cela preglednica "Po oddelkih" prek celega zaslona in cel
     mesec viden brez vodoravnega drsenja: tabela dobi table-layout:fixed in
     polno širino namesto naravne širine na celico (isti vzorec kot mreža v
     zelje.html). Na ozkem pokončnem telefonu ostane naravna širina +
     vodoravno drsenje (fiksna postavitev bi tam stisnila stolpce oseb na
     neberljivo majhno). "Moj razpored" ostane nespremenjen ne glede na
     zaslon - glej "pdfCols" zgoraj za PDF izvoz. */
  @media (min-width:900px), (orientation: landscape){
    .wardScroller{ overflow-x:visible; }
    table.wardTableT{ width:100%; table-layout:fixed; }
    table.wardTableT th.name, table.wardTableT td.name{ width:70px; }
    table.wardTableT th:not(.name), table.wardTableT td:not(.name){ width:auto; min-width:0; }
    /* Cele kode izmen ("popoldan do 19", "NOČNA od 19") so predolge za
       enakomerno razdeljen stolpec pri table-layout:fixed - privzeti
       white-space:nowrap (theme.css) bi jih pustil vizualno preliti čez
       sosednje celice. Raje se prelomijo v dve vrstici znotraj SVOJEGA
       stolpca. */
    table.wardTableT td:not(.name){ white-space:normal; }
  }
  @media (min-width:900px){
  }

  /* NZV — dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe), po
     uradni predlogi "Letni dopusti in omejitve za NZV". Manjše pisave, ker
     je stolpcev veliko (17 enot + Dežurstvo); celica prikaže polno ime
     osebe, ki to enoto ta dan pokriva (ne ročno kodirane kratice iz
     predloge - zanesljive samodejne kratice iz "full_name" niso izvedljive
     brez ločenega polja za priimek). */
  table.wardTableNzv th, table.wardTableNzv td{ font-size:10.5px; padding:5px 3px; }
  table.wardTableNzv td.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; font-size:11px; }
  table.wardTableNzv td.enotaCell{ text-align:center; white-space:normal; word-break:break-word; }
  table.wardTableNzv th.dez, table.wardTableNzv td.dez{ background: rgba(179,64,42,.07); font-weight:700; }
  table.wardTableNzv tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  @media (min-width:900px), (orientation: landscape){
    table.wardTableNzv{ width:100%; table-layout:fixed; }
    table.wardTableNzv td.name{ width:60px; }
    table.wardTableNzv th:not(.name):not(.dez), table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
    table.wardTableNzv th.dez, table.wardTableNzv td.dez{ width:90px; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const { client } = RazporedAuth;

const DAN_IME = { PO:"ponedeljek", TO:"torek", SR:"sreda", ČE:"četrtek", PE:"petek", SO:"sobota", NE:"nedelja" };
const DNI = ["PO","TO","SR","ČE","PE","SO","NE"];
const MESECI = ["Januar","Februar","Marec","April","Maj","Junij","Julij","Avgust","September","Oktober","November","December"];

// Datum kot v uradnih predlogah ("1. 9. 2026", brez vodilnih ničel) namesto
// ISO - samo za PRIKAZ/izvoz na tej strani; interno (poizvedbe, ključi) se
// še vedno povsod uporablja ISO "YYYY-MM-DD".
function datumSlo(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return `${d}. ${m}. ${y}`;
}

// Kratko ime za prikaz na "Po oddelkih" (samo TA stran - full_name se nikjer
// drugje v aplikaciji ne skrajša), po vzoru uradne predloge "2026 SMS
// RAZPORED" ("DŽINIĆ A."): PRIIMEK (lahko iz več besed, npr. "Mavri
// Tratnik") + presledek + prva črka IMENA (zadnja beseda) + piko. full_name
// je v aplikaciji dosledno shranjen kot "Priimek Ime" (glej npr.
// DEZURNI_OSNOVA_DO_31_8_2026 v admin.html).
function priimekZacetnica(fullName){
  const deli = (fullName || "").trim().split(/\s+/);
  if (deli.length < 2) return (fullName || "").toUpperCase();
  const ime = deli[deli.length - 1];
  const priimek = deli.slice(0, -1).join(" ");
  return `${priimek} ${ime[0]}.`.toUpperCase();
}

// Parafa za NZV celice (po vzoru "Letni dopusti in omejitve za NZV" -
// "BOJ", "DŽA" ipd.) - uporabi ročno nastavljeno profiles.parafa (Imenik),
// sicer groba samodejna privzeta vrednost (prve 3 črke priimka), ki jo
// admin lahko ročno popravi, če se dve osebi ujemata.
// PREDPOSTAVKA: full_name je zapisan kot "Priimek Ime" (tako je povsod v
// aplikaciji), zato je priimek VSE RAZEN zadnje besede — s tem so zajeti
// tudi dvobesedni priimki ("Mavri Tratnik Magdalena" -> "MAV"). Dokler so
// bili nekateri zapisani obratno, je ta funkcija zanje vračala prve tri
// črke OSEBNEGA imena ("Aldin Gazibara" -> "ALD" namesto "GAZ").
function autoParafa(fullName){
  const deli = (fullName || "").trim().split(/\s+/);
  const priimek = deli.length > 1 ? deli.slice(0, -1).join("") : (deli[0] || "");
  return priimek.slice(0, 3).toUpperCase();
}
function parafaOd(profil){
  return (profil && profil.parafa) ? profil.parafa : autoParafa(profil ? profil.full_name : "");
}
// Prikaz ur izmene pride iz skupnega delovni-cas.js (edini vir resnice) —
// prej je bila ista tabela zapisana še enkrat tu in še enkrat v admin.html.
const DELOVNI_ČAS = Object.fromEntries(
  Object.entries(window.DelovniCas.IZMENE)
    .filter(([, v]) => v.ure != null) // brez dežurstva: ure so odvisne od dneva v tednu
    .map(([k, v]) => [k, v.zacetek.replace(":", ".") + "\u2013" + v.konec.replace(":", ".")])
);
DELOVNI_ČAS["KPU"] = "koriščenje prostih ur";
DELOVNI_ČAS["LD"] = "letni dopust";

function classify(sifra){
  // Brez presledkov: iz Sheets pride tudi "DNEVNA 12F" ali "NOČNA 12".
  const t = (sifra || "").toLowerCase().replace(/\s+/g, "");
  if (t.startsWith("dežurstvo") || t.startsWith("dezurstvo")) return "dez";
  if (t.startsWith("ld")) return "ld"; // letni dopust - lastna (zelena) barva, ločeno od KPU/prostega (sivo)
  if (t.startsWith("kpu")) return "off";
  if (t.startsWith("prisoten")) return "dop"; // pogled "Vodje" - na svojem oddelku (ni odsoten)
  if (t.includes("nočna12")) return "h12";
  if (t.includes("dnevna12")) return "h12";
  if (t.startsWith("nočna")) return "noc";
  if (t.startsWith("dopoldan")) return "dop";
  if (t.startsWith("popoldan")) return "pop";
  return "off";
}
const BARVE = { dop:"#4F9B6B", pop:"#C9713F", noc:"#4A67B0", h12:"#8560A8", off:"#8B8672", ld:"#2F6B4A", dez:"#B3402A" };

function shiftLabel(sifra){
  if (!sifra) return "Prosto";
  return sifra;
}

// ---------------------------------------------------------------------
// Izvoz osebnega razporeda v .ics (iCal) - za sinhronizacijo z osebnim
// koledarjem na telefonu (Google Calendar, Apple Calendar …). Deluje
// izključno lokalno v brskalniku (generira in prenese datoteko, brez
// zunanje storitve/računa) - odpre se z gumbom "Uvozi" v koledarski
// aplikaciji uporabnika, ni žive dvosmerne sinhronizacije.
// ---------------------------------------------------------------------
function parsirajUrniObseg(niz){
  // "05.50–14.00" -> { start:"05:50", end:"14:00", cezPolnoc:false }
  if (!niz || !niz.includes("–")) return null;
  const [s, e] = niz.split("–").map(x => x.trim().replace(".", ":"));
  if (!/^\d{2}:\d{2}$/.test(s) || !/^\d{2}:\d{2}$/.test(e)) return null;
  return { start: s, end: e, cezPolnoc: e < s };
}
function icsDatumUra(iso, hhmm){
  return iso.replace(/-/g, "") + "T" + hhmm.replace(":", "") + "00";
}
function dodajDni(iso, n){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function icsPobegni(besedilo){
  return String(besedilo || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
}
function ustvariICS(dnevi, byDate){
  const zdaj = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const dogodki = [];
  dnevi.forEach(dn => {
    const sifra = byDate[dn.datum];
    if (!sifra) return; // prost dan - ni dogodka
    const obseg = parsirajUrniObseg(DELOVNI_ČAS[sifra]);
    const uid = "razpored-pbb-" + dn.datum + "-" + Math.random().toString(36).slice(2, 8) + "@razpored.netlify.app";
    if (obseg) {
      const konecDatum = obseg.cezPolnoc ? dodajDni(dn.datum, 1) : dn.datum;
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART:" + icsDatumUra(dn.datum, obseg.start),
        "DTEND:" + icsDatumUra(konecDatum, obseg.end),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    } else {
      // LD/KPU/DEŽURSTVO/neznana koda - brez natančnih ur, celodnevni dogodek
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART;VALUE=DATE:" + dn.datum.replace(/-/g, ""),
        "DTEND;VALUE=DATE:" + dodajDni(dn.datum, 1).replace(/-/g, ""),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    }
  });
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Razpored PBB//SL", "CALSCALE:GREGORIAN",
    ...dogodki, "END:VCALENDAR",
  ].join("\r\n");
}
function prenesiICS(vsebina, ime){
  const blob = new Blob([vsebina], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = ime; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthRange(monthStr){
  const [y,m] = monthStr.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { startISO:start, endISO:end };
}
function daysInRange(startISO, endISO){
  const out = [];
  let d = new Date(startISO + "T00:00:00");
  const end = new Date(endISO + "T00:00:00");
  while (d.getTime() <= end.getTime()){
    const wd = (d.getDay() + 6) % 7; // 0=PO..6=NE
    const p = n => String(n).padStart(2,"0");
    out.push({ datum: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, dan: DNI[wd] });
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function MyScheduleView({ userId, month }){
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEntries(null);
    client.from("schedule_entries").select("work_date, shift_code")
      .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data }) => { if (!cancelled) setEntries(data || []); });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  const byDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.work_date] = e.shift_code; });
    return m;
  }, [entries]);

  const iso = todayISO();
  const todaySifra = byDate[iso];
  const todayCls = classify(todaySifra);

  const tedni = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach(dn => {
      if (dn.dan === "PO" || !cur){ cur = []; out.push(cur); }
      cur.push(dn);
    });
    return out;
  }, [days]);

  if (entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div id="printMy">
      {startISO <= iso && iso <= endISO && (
        <div className="todayCard">
          <div className="lbl">Danes · {new Date(iso+"T00:00:00").toLocaleDateString("sl-SI",{day:"numeric",month:"long"})}</div>
          <div className="shift">
            <span className="dot" style={{background: BARVE[todayCls]}}></span>
            <div>
              <div className="shiftName">{shiftLabel(todaySifra)}</div>
              <div className="shiftTime">{DELOVNI_ČAS[todaySifra] || ""}</div>
            </div>
          </div>
        </div>
      )}

      <div className="weeksGrid">
        {tedni.map((teden, i) => (
          <div key={i}>
            <div className="weekLabel">Teden {i+1}</div>
            {teden.map(dn => {
              const sifra = byDate[dn.datum];
              const cls = classify(sifra);
              const isToday = dn.datum === iso;
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              const d = new Date(dn.datum + "T00:00:00");
              return (
                <div key={dn.datum} className={"dayRow" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "")}>
                  <div className="dnum">
                    <div className="n">{d.getDate()}</div>
                    <div className="d">{dn.dan}</div>
                  </div>
                  <div className={"chip" + (cls==="off" ? " off" : "")} style={{background: cls==="off" ? "transparent" : (BARVE[cls] + "26"), border: "1px solid " + (cls==="off" ? "var(--line)" : BARVE[cls])}}>
                    <span className="dot" style={{background: BARVE[cls]}}></span>
                    <span className="txt">{shiftLabel(sifra)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// Skupen "podpisni" blok pod tabelo na "Po oddelkih" - po vzoru uradnih
// predlog (Datum objave + Zadnja sprememba + Pripravil/-a + Pregledal in
// odobril, vsi RESNIČNI, ne pogojno prikazani). "Datum objave"/"Pripravil"
// izhajata iz created_at/created_by NAJSTAREJŠEGA zapisa v mesecu (kdo je
// razpored prvič objavil); "Zadnja sprememba" iz max(updated_at); oboje
// samodejno vzdržuje schedule_entries_touch() sprožilec (schema.sql sekcija
// 25) - velja za VSE poti pisanja (generator v admin.html, ta uvoz), ne
// samo za novo kodo. "Pregledal in odobril" = koordinator (profiles.
// is_koordinator). Naziv za podpis (job_title) je admin-urejljiv v Imeniku.
function RazporedPodpisi({ entries }){
  const [koordinator, setKoordinator] = useState(null);
  const [pripravil, setPripravil] = useState(null);

  useEffect(() => {
    let cancelled = false;
    client.from("profiles").select("full_name, job_title").eq("is_koordinator", true).limit(1).maybeSingle()
      .then(({ data }) => { if (!cancelled) setKoordinator(data || null); });
    return () => { cancelled = true; };
  }, []);

  const objava = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((min, e) => (e.created_at && (!min || e.created_at < min.created_at)) ? e : min, null);
  }, [entries]);

  const zadnja = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((max, e) => (e.updated_at && (!max || e.updated_at > max)) ? e.updated_at : max, null);
  }, [entries]);

  const pripravilId = objava ? objava.created_by : null;
  useEffect(() => {
    let cancelled = false;
    if (!pripravilId) { setPripravil(null); return; }
    client.from("profiles").select("full_name, job_title").eq("id", pripravilId).maybeSingle()
      .then(({ data }) => { if (!cancelled) setPripravil(data || null); });
    return () => { cancelled = true; };
  }, [pripravilId]);

  const oblikujDatum = (iso) => iso
    ? new Date(iso).toLocaleString("sl-SI", {day:"numeric", month:"numeric", year:"numeric", hour:"2-digit", minute:"2-digit"})
    : "ni podatka";

  return (
    <div className="card" style={{marginTop:10, fontSize:13}}>
      <p style={{margin:"0 0 6px"}}><b>Datum objave razporeda:</b> {oblikujDatum(objava && objava.created_at)}</p>
      <p style={{margin:"0 0 6px"}}><b>Zadnja sprememba v razporedu:</b> {oblikujDatum(zadnja)}</p>
      {pripravil && (
        <p style={{margin:"0 0 6px"}}><b>Pripravil/-a:</b> {pripravil.full_name}{pripravil.job_title ? ", " + pripravil.job_title : ""}</p>
      )}
      {koordinator && (
        <p style={{margin:0}}><b>Pregledal in odobril:</b> {koordinator.full_name}{koordinator.job_title ? ", " + koordinator.job_title : ""}</p>
      )}
    </div>
  );
}

function WardView({ deptCode, month, myId }){
  const [employees, setEmployees] = useState(null);
  const [entries, setEntries] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEmployees(null); setEntries(null);

// NZV: dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe kot pri
// WardView) - po uradni predlogi "Letni dopusti in omejitve za NZV". Celica
// = kdo pokriva to enoto ta dan (schedule_entries.department_code je še
// vedno lahko ena od teh starih kod - glej supabase/schema.sql sekcija 23,
// namenoma niso izbrisane iz departments prav zaradi te uporabe). Ločeno
// od WardView, ker gre za popolnoma drugačno obliko (enote, ne osebe).
const NZV_ENOTE = [
  ["PDZN", "PDZN"], ["SOBO", "SOBO"], ["ZO", "ŽO"], ["E1", "E1"], ["E2", "E2"], ["D", "D"], ["MO", "MO"],
  ["B", "B"], ["C", "C"], ["C1", "C1"], ["PO", "PO"], ["A", "A"], ["B1B2", "B1,B2"], ["DB", "DB"],
  ["URGENCA", "URGENCA"], ["U2", "U2"],
];
// "SA" nima nobenega samodejnega generatorja (za razliko od ostalih enot) -
// v uradni predlogi je razdeljena na dva stolpca (dopoldan/popoldan), zato
// tu isto razdelimo po vsebini shift_code (glej razvrstiSA spodaj), namesto
// da bi uvajali dva nova department_code (SA ostaja ena sama koda v bazi).
function razvrstiSA(sifra){
  const t = (sifra || "").toLowerCase();
  if (t.includes("pop")) return "SAPOP";
  return "SADOP"; // privzeto dopoldan, če ni prepoznano drugače
}
// Vrstni red stolpcev v uradni predlogi ima "SA DOP"/"SA POP" MED "DB" in
// "URGENCA" (ne na koncu, kot bi bil naiven vrstni red NZV_ENOTE+dodatek) -
// zato tu sestavimo pravi prikazni vrstni red ločeno od NZV_ENOTE (ki ostaja
// nespremenjen, ker ga poizvedba in uvoz uporabljata brez odvisnosti od
// vrstnega reda stolpcev).
const NZV_STOLPCI = (() => {
  const brezUrgence = NZV_ENOTE.filter(([k]) => k !== "URGENCA" && k !== "U2");
  const urgencaU2 = NZV_ENOTE.filter(([k]) => k === "URGENCA" || k === "U2");
  return [...brezUrgence, ["SADOP", "SA DOP"], ["SAPOP", "SA POP"], ...urgencaU2];
})();
// Zadnji trije stolpci uradne predloge ("LD", "IZOB", "BS") niso enote, ampak
// POVZETEK odsotnosti tega dne (glej leave_entries.kind) - kdo je ta dan na
// letnem dopustu / strokovnem izobraževanju / bolniški. Isti vir kot Želje →
// Razpredelnica (zelje.html), tu prikazan skupaj s končnim razporedom, ker
// gre za "omejitve, ki se vežejo na razpored za določen mesec".
const NZV_KIND_KODA = { ld: "LD", sti: "IZOB", bs: "BS" };

function normalizirajImeNzv(s){ return (s || "").trim().toUpperCase().replace(/\s+/g, " "); }
// Ista "vreča besed" primerjava kot imenaSeUjemata v zelje.html
// (leave_entries.full_name je prosto besedilo iz statičnega roster-seznama,
// ne nujno enak zapis kot profiles.full_name) - namerno podvojeno tu namesto
// deljene datoteke, glej opombo ob classify()/BARVE v drugih straneh.
function imenaSeUjemataNzv(a, b){
  const na = normalizirajImeNzv(a), nb = normalizirajImeNzv(b);
  if (!na || !nb) return false;
  return na.split(" ").sort().join(" ") === nb.split(" ").sort().join(" ");
}

// Naziv stolpca (kot v uradni predlogi) -> notranja koda. Skupno za izris,
// izvoz, uvoz IN pisanje nazaj, da se štirje kraji ne razidejo.
function nzvNazivVKodo(){
  const m = { "Dežurstvo": "DEZ", "DEŽURSTVO": "DEZ", "SA DOP": "SADOP", "SA POP": "SAPOP", "LD": "LD", "IZOB": "IZOB", "BS": "BS" };
  NZV_ENOTE.forEach(([koda, naziv]) => { m[naziv] = koda; });
  return m;
}

// Skupno nalaganje podatkov za izris/izvoz/pisanje-nazaj NZV pogleda -
// "podatki" = { "KODA|datum": "parafa, parafa2" } za vse enote + DEZ +
// LD/IZOB/BS (iz leave_entries, ujemano po imenu na profiles).
async function nalozizPodatkeNzv(startISO, endISO){
  const kode = [...NZV_ENOTE.map(([k]) => k), "SA", "DEZ"];
  const [{ data: entries }, { data: dopusti }, { data: profili }] = await Promise.all([
    client.from("schedule_entries").select("department_code, work_date, shift_code, created_at, created_by, updated_at, profiles(full_name, parafa)")
      .in("department_code", kode).gte("work_date", startISO).lte("work_date", endISO),
    client.from("leave_entries").select("full_name, work_date, kind")
      .in("kind", ["ld", "sti", "bs"]).gte("work_date", startISO).lte("work_date", endISO),
    client.from("profiles").select("full_name, parafa"),
  ]);
  const podatki = {};
  (entries || []).forEach(r => {
    if (!r.profiles) return;
    const koda = r.department_code === "SA" ? razvrstiSA(r.shift_code) : r.department_code;
    const key = koda + "|" + r.work_date;
    const parafa = parafaOd(r.profiles);
    podatki[key] = podatki[key] ? podatki[key] + ", " + parafa : parafa;
  });
  (dopusti || []).forEach(d => {
    const koda = NZV_KIND_KODA[d.kind];
    if (!koda) return;
    const ujem = (profili || []).find(p => imenaSeUjemataNzv(p.full_name, d.full_name));
    const parafa = ujem ? parafaOd(ujem) : d.full_name;
    const key = koda + "|" + d.work_date;
    podatki[key] = podatki[key] ? podatki[key] + ", " + parafa : parafa;
  });
  return { podatki, entries: entries || [] };
}

// "Po oddelkih" je na izrecno navodilo omejen na 6 SMS/TZN oddelkov + FLEXI
// + en virtualen "NZV" (vodje/admin, dežurstva vključena) - ostali oddelki
// (DEZ, NEDEZ, PDZN, SOBO ...) tu niso na voljo, ne glede na vlogo.
const PO_ODDELKIH_KODE = ["B", "C", "C1", "D", "E1", "E2", "FLEXI"];

// ---------------------------------------------------------------------
// Uvoz iz Google Sheets (admin) — javna povezava ("vsak s povezavo lahko
// ogleda"), brez OAuth, isti mehanizem kot imenik.html (ImportUtils.
// preberiGoogleSheet). Namenoma ISTA oblika, ki jo ta stran tudi izvozi
// (glava "Datum, Dan, ..."), da je krog izvozi→uredi v Sheets→uvozi
// nazaj preprost in predvidljiv. Piše naravnost v schedule_entries -
// dovoljeno samo adminu (RLS schedule_write_admin to tudi vsili na
// strežniku, ne samo tu).
// ---------------------------------------------------------------------
async function shraniZapiseRazporeda(zapisi){
  for (let i = 0; i < zapisi.length; i += 200) {
    const { error } = await client.from("schedule_entries").upsert(zapisi.slice(i, i + 200), { onConflict: "employee_id,work_date" });
    if (error) throw error;
  }
}

// Isti upsert vzorec kot zelje.html (leave_entries, ključ full_name+work_date) -
// za NZV uvoz stolpcev LD/IZOB/BS (glej uvoziNzv).
async function shraniDopusteNzv(dopusti){
  for (let i = 0; i < dopusti.length; i += 200) {
    const { error } = await client.from("leave_entries").upsert(dopusti.slice(i, i + 200), { onConflict: "full_name,work_date" });
    if (error) throw error;
  }
}

// Samo prava ISO oblika šteje za "vrstico s podatki" - podpisne vrstice na
// dnu izvoza ("Zadnja sprememba:", "Pripravil/-a:" …) imajo v prvem
// stolpcu besedilo, ki ga normalizirajDatum() vrne nespremenjeno (ni
// prepoznana oblika), zato golo "if (!datum)" ne bi zadostovalo za
// preskok teh vrstic pri uvozu.
const ISO_DATUM_RX = /^\d{4}-\d{2}-\d{2}$/;
// Vrstica vloge v realni predlogi ("SMS / TZN", "DMS / DZN") - uporabljeno
// za razločevanje "vrstice vloge" od "vrstice imen" pri iskanju glave bloka.
const VLOGA_RX = /SMS|DMS|TZN|DZN/i;

// Realni Google Sheets ("2026 SMS RAZPORED" ipd.) NISO en sam blok z eno
// glavo na vrhu - vsak oddelčni zavihek ima VEČ mesecev zloženih drug pod
// drugim, vsak s svojo glavo (imena, 2-3 vrstice nad prvim dnevom, glej
// najdiVrsticoImen) in podpisnim blokom na dnu. Ta funkcija sprehodi CELO
// datoteko, poišče vse strnjene sklope datumskih vrstic (en sklop = en
// mesečni blok), za vsak sklop poišče njegovo glavo, in vrne SAMO tiste
// dni, ki spadajo v [startISO, endISO] - to deluje ENAKO za realno
// večmesečno predlogo IN za enostavno enomesečno obliko, ki jo izvozi ta
// aplikacija (glej pripraviIzvoz).
function najdiVrsticoImen(vrsteVrstic, zacetekBloka){
  for (let i = zacetekBloka - 1, korakov = 0; i >= 0 && korakov < 6; i--, korakov++) {
    const vrstica = vrsteVrstic[i] || [];
    if (ISO_DATUM_RX.test(window.ImportUtils.normalizirajDatum(vrstica[0]))) return null; // prejšnji blok - obupaj
    const celica = (vrstica[2] || "").trim();
    if (!celica) continue; // prazna vrstica (naslov meseca ima vsebino samo v stolpcu A, ne C) - išči višje
    if (VLOGA_RX.test(celica)) continue; // vrstica vloge (SMS/TZN …) - imena so še eno vrstico višje
    return i; // prva "navadna" vrstica z vsebino = imena
  }
  return null;
}

// obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciGlavo, offset,
// obdelajVrstico) sprehodi en strnjen sklop datumskih vrstic od indeksa i
// naprej, poišče glavo (imena/enote) zanj in za vsako vrstico ZNOTRAJ
// [startISO,endISO] pokliče obdelajVrstico(vrstica, glava, datum, j). "offset"
// = koliko uvodnih (ne-podatkovnih) stolpcev pred imeni/enotami - 2 za
// oddelke (Datum, Dan kot ločena stolpca, glej realno predlogo "2026 SMS
// RAZPORED"), 1 za NZV (samo Datum, BREZ ločenega stolpca Dan - glej
// realno predlogo "Letni dopusti in omejitve za NZV", ki ima glavo "DATUM |
// PDZN | SOBO | …" brez vmesnega "Dan"). Vrne indeks tik za sklopom.
// "j" (indeks vrstice v vrsteVrstic) je dodan kot 4. argument obdelajVrstico
// - obstoječa dva klicatelja (uvoziOddelek/uvoziNzv) ga ne sprejemata in ga
// JS preprosto prezre; uporablja ga samo pripraviPosodobitveOddelka (pisanje
// nazaj v Sheets), ki potrebuje pravo številko vrstice v listu, ne samo
// vsebine.
// Google Sheets API (values.get, glej GSheetsExport.preberiVrednosti) prazne
// VMESNE vrstice vrne kot [] namesto da bi jih izpustil - ista stvar se
// zgodi tudi v pravih dokumentih, ki imajo tu in tam prazno vrstico "za
// zrak" (vizualni presledek med tedni ipd.). Prej je katera koli taka
// vrstica sredi bloka nepovratno PREKINILA branje - vse dneve ZA njo je
// tiho izpustila, čeprav so bili dejansko del istega, še odprtega bloka
// (najden šele s fixture testom, glej skripte/preveri-zapis-v-sheets.mjs).
function vrsticaJePrazna(vrstica){
  return !vrstica || vrstica.length === 0 || vrstica.every(c => (c == null ? "" : String(c)).trim() === "");
}

function obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciGlavo, offset, obdelajVrstico, stanje){
  const glavaIdx = poisciGlavo(vrsteVrstic, i);
  const glava = glavaIdx != null ? vrsteVrstic[glavaIdx].slice(offset) : [];
  let j = i, praznihZapored = 0;
  while (j < vrsteVrstic.length) {
    // Prazno vrstico preskoči (blok se še ne konča) - a ne v nedogled, da
    // se namesto naslednjega meseca ne "poje" ves prazen prostor do njega.
    if (vrsticaJePrazna(vrsteVrstic[j])) {
      if (++praznihZapored > 20) break;
      j++; continue;
    }
    praznihZapored = 0;
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[j][0]);
    if (!ISO_DATUM_RX.test(datum)) break;
    if (datum >= startISO && datum <= endISO) {
      stanje.najdenDatum = true;
      if (glava.length) { stanje.najdenaGlava = true; obdelajVrstico(vrsteVrstic[j], glava, datum, j); }
    }
    j++;
  }
  return j;
}

async function uvoziMojRazpored(url, myId, deptCode, ciljniMesec){
  if (!deptCode) throw new Error("Nimaš nastavljenega oddelka v profilu (Imenik) — uvoz zahteva primarni oddelek.");
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  const objekti = window.ImportUtils.vVrsticeObjekte(vrsteVrstic, ["datum", "dan", "izmena"], ["datum"]);
  const zapisi = objekti
    .map(o => ({ ...o, datum: window.ImportUtils.normalizirajDatum(o.datum) }))
    .filter(o => ISO_DATUM_RX.test(o.datum) && o.datum >= startISO && o.datum <= endISO)
    .map(o => ({
      employee_id: myId, department_code: deptCode,
      work_date: o.datum,
      shift_code: o.izmena === "Prosto" ? "" : o.izmena,
    }));
  if (!zapisi.length) throw new Error("Ni najdenih vrstic za izbrani mesec (pričakovana glava: Datum, Dan, Izmena).");
  await shraniZapiseRazporeda(zapisi);
  return `Uvoženih ${zapisi.length} dni.`;
}

// Glava stolpcev je kratko ime "Priimek X." (glej priimekZacetnica) - enako
// kot ta stran izvozi in kot ga uporablja realna predloga "2026 SMS
// RAZPORED" ("DŽINIĆ A." ipd.). Če se dve osebi ujemata na isto kratko ime
// (redko, a mogoče - npr. dva "Novak A."), ju je z golim kratkim imenom
// nemogoče razločiti, zato tak stolpec preskočimo in ga javimo kot
// neujemanje, namesto da bi tvegali napačno osebo.
function kratkaImenaMapa(profili){
  const m = {};
  const podvojena = new Set();
  (profili || []).forEach(p => {
    const kratko = priimekZacetnica(p.full_name).toUpperCase();
    if (kratko in m) { podvojena.add(kratko); } else { m[kratko] = p.id; }
  });
  podvojena.forEach(k => delete m[k]);
  return { poKratkem: m, podvojena };
}

async function uvoziOddelek(url, wardCode, ciljniMesec){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  if (!vrsteVrstic.length) throw new Error("Prazna datoteka.");
  const { data: profili } = await client.from("profiles").select("id, full_name");
  const { poKratkem, podvojena } = kratkaImenaMapa(profili);
  const neujemanja = new Set();
  podvojena.forEach(k => neujemanja.add(k + " (ujema se z več osebami - uredi ročno)"));
  const zapisi = [];
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[i][0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, najdiVrsticoImen, 2, (vrstica, imena, datum) => {
      imena.forEach((ime, idx) => {
        const id = poKratkem[(ime || "").trim().toUpperCase()];
        if (!id) { if (ime) neujemanja.add(ime); return; }
        const sifra = (vrstica[2 + idx] || "").trim();
        zapisi.push({ employee_id: id, department_code: wardCode, work_date: datum, shift_code: sifra === "Prosto" ? "" : sifra });
      });
    }, stanje);
  }
  if (!zapisi.length) {
    if (!stanje.najdenDatum) throw new Error(`Ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} v tej datoteki/zavihku. Najverjetnejši vzrok: povezava kaže na NAPAČEN ZAVIHEK — v Google Sheets klikni zavihek za ta oddelek (dno zaslona) in šele PO TEM kopiraj naslov iz naslovne vrstice (mora vsebovati "#gid=..."); sicer se vedno uvozi prvi zavihek v dokumentu.`);
    if (!stanje.najdenaGlava) throw new Error("Najdene vrstice za izbrani mesec, a nad njimi ni najti vrstice z imeni oseb.");
    throw new Error(`Najdene vrstice za izbrani mesec, a nobeno ime se ni ujemalo z osebo v aplikaciji: ${[...neujemanja].join(", ")}. Če so imena videti pravilna, je verjetno kriv napačen zavihek (glej zgoraj) — preveri, da povezava kaže na zavihek TEGA oddelka.`);
  }
  await shraniZapiseRazporeda(zapisi);
  return `Uvoženih ${zapisi.length} vpisov.` + (neujemanja.size ? ` Brez ujemanja imena: ${[...neujemanja].join(", ")}.` : "");
}

// ---------------------------------------------------------------------
// Pisanje NAZAJ v Google Sheets — samo za oddelčne zavihke (kot uvoziOddelek
// zgoraj), ne za "Moj razpored"/NZV (drugačna oblika, glej "kasneje" v
// pogovoru z uporabnikom). Piše SAMO v celice, ki jih uvoziOddelek tudi
// prebere - iste (vrstica, stolpec) koordinate, izračunane z isto logiko
// iskanja bloka/glave. Zato:
//   - imena, vloge, naslov meseca, podpisni blok in oblikovanje v listu
//     ostanejo NEDOTAKNJENI (nobena od teh celic ni v seznamu posodobitev),
//   - oseba, ki v listu (še) nima svojega stolpca (ker v Sheetsu še ni bila
//     dodana), se tiho izpusti - funkcija NIKOLI ne doda novega stolpca ali
//     vrstice, samo prepiše obstoječe.
// Za pravilno poravnavo vrstic MORA klicatelj prebrati list prek
// GSheetsExport.preberiVrednosti (Sheets API), NE prek
// ImportUtils.preberiGoogleSheet (javni CSV izvoz) - slednji izpusti prazne
// vrstice in bi s tem premaknil indekse vrstic glede na resnične številke
// vrstic v listu.
function pripraviPosodobitveOddelka(vrsteVrstic, ciljniMesec, employees, byEmpDate){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const poKratkem = {};
  const podvojena = new Set();
  (employees || []).forEach(z => {
    const kratko = priimekZacetnica(z.full_name).toUpperCase();
    if (kratko in poKratkem) podvojena.add(kratko); else poKratkem[kratko] = z;
  });
  podvojena.forEach(k => delete poKratkem[k]);
  const posodobitve = [];
  const neujemanja = new Set();
  podvojena.forEach(k => neujemanja.add(k + " (ujema se z več osebami - uredi ročno)"));
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum((vrsteVrstic[i] || [])[0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, najdiVrsticoImen, 2, (vrstica, imena, datum, j) => {
      imena.forEach((ime, idx) => {
        const z = poKratkem[(ime || "").trim().toUpperCase()];
        if (!z) { if (ime) neujemanja.add(ime); return; }
        const trenutna = byEmpDate[z.id + "|" + datum] || "";
        posodobitve.push({ vrstica: j, stolpec: 2 + idx, vrednost: trenutna });
      });
    }, stanje);
  }
  return { posodobitve, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava, neujemanja };
}

async function zapisiOddelekVSheets(url, wardCode, ciljniMesec){
  if (!window.GSheetsExport || !window.GSheetsExport.jeNastavljeno()) {
    throw new Error("Pisanje v Google Sheets še ni nastavljeno — manjka Google Client ID (glej GSHEETS-SETUP.md).");
  }
  const { startISO, endISO } = monthRange(ciljniMesec);
  const [{ data: employees }, { data: entries }] = await Promise.all([
    client.from("profiles").select("id, full_name").eq("department_code", wardCode).order("full_name"),
    client.from("schedule_entries").select("employee_id, work_date, shift_code")
      .eq("department_code", wardCode).gte("work_date", startISO).lte("work_date", endISO),
  ]);
  if (!employees || !employees.length) throw new Error("Za ta oddelek še ni dodeljenih zaposlenih.");
  const byEmpDate = {};
  (entries || []).forEach(e => { byEmpDate[e.employee_id + "|" + e.work_date] = e.shift_code; });

  const { naslovLista, vrsteVrstic } = await window.GSheetsExport.preberiVrednosti(url);
  const { posodobitve, najdenDatum, najdenaGlava, neujemanja } = pripraviPosodobitveOddelka(vrsteVrstic, ciljniMesec, employees, byEmpDate);
  if (!posodobitve.length) {
    if (!najdenDatum) throw new Error(`V zavihku "${naslovLista}" ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} - preveri, da povezava kaže na pravi zavihek (klikni zavihek za ta oddelek, šele nato kopiraj povezavo).`);
    if (!najdenaGlava) throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nad njimi ni najti vrstice z imeni oseb.`);
    throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nobeno ime v listu se ni ujemalo z zaposlenim v aplikaciji: ` + [...neujemanja].join(", "));
  }
  const rezultat = await window.GSheetsExport.zapisiVObstojeciList(url, posodobitve);
  return `Zapisanih ${rezultat.stevilo} celic v zavihek "${rezultat.list}".`
    + (neujemanja.size ? ` Brez ujemanja imena (celica v Sheetsu ni bila spremenjena): ${[...neujemanja].join(", ")}.` : "");
}

// NZV predloga ima glavo (enote) VEDNO neposredno nad prvim dnem tega
// bloka (naslov meseca je še eno vrstico višje, glej realno predlogo
// "Letni dopusti in omejitve za NZV") - offset -1 je zato dovolj, brez
// potrebe po VLOGA_RX preskakovanju kot pri uvoziOddelek.
function poisciEnoteNzv(vrsteVrstic, zacetekBloka){
  const i = zacetekBloka - 1;
  if (i < 0) return null;
  if (ISO_DATUM_RX.test(window.ImportUtils.normalizirajDatum((vrsteVrstic[i] || [])[0]))) return null;
  return (vrsteVrstic[i][1] || "").trim() ? i : null;
}

// Stolpci LD/IZOB/BS niso razpored (schedule_entries), ampak odsotnost
// (leave_entries) - glej NZV_KIND_KODA. Zapisi zanje gredo v drugo tabelo,
// zato jih uvoziNzv loči na dva izhodna seznama (zapisi/dopusti).
const NZV_ODSOTNOST_KIND = { LD: "ld", IZOB: "sti", BS: "bs" };

async function uvoziNzv(url, ciljniMesec, myId){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { vrsteVrstic } = await window.ImportUtils.preberiGoogleSheet(url);
  if (!vrsteVrstic.length) throw new Error("Prazna datoteka.");
  const nazivVKodo = nzvNazivVKodo();
  const { data: profili } = await client.from("profiles").select("id, full_name, parafa");
  const poParafi = {};
  const podvojene = new Set();
  (profili || []).forEach(p => {
    const parafa = parafaOd(p).toUpperCase();
    if (parafa in poParafi) { podvojene.add(parafa); } else { poParafi[parafa] = p; }
  });
  podvojene.forEach(k => delete poParafi[k]);
  const neujemanja = new Set();
  podvojene.forEach(k => neujemanja.add(k + " (parafa se ujema z več osebami - popravi v Imeniku)"));
  const zapisi = [];
  const dopusti = [];
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum(vrsteVrstic[i][0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciEnoteNzv, 1, (vrstica, stolpci, datum) => {
      stolpci.forEach((naziv, idx) => {
        const virKoda = nazivVKodo[naziv];
        if (!virKoda) return;
        const vsebina = (vrstica[1 + idx] || "").trim();
        if (!vsebina) return;
        if (virKoda in NZV_ODSOTNOST_KIND) {
          vsebina.split(",").map(s => s.trim()).filter(Boolean).forEach(parafa => {
            const oseba = poParafi[parafa.toUpperCase()];
            if (!oseba) { neujemanja.add(parafa); return; }
            dopusti.push({ full_name: oseba.full_name, work_date: datum, kind: NZV_ODSOTNOST_KIND[virKoda], created_by: myId });
          });
          return;
        }
        // SA DOP/SA POP pišeta isto department_code "SA", ločeno samo prek
        // shift_code (glej razvrstiSA) - "SA" sama ni prava izbirna koda.
        const koda = virKoda === "SADOP" || virKoda === "SAPOP" ? "SA" : virKoda;
        const sifra = virKoda === "SADOP" ? "dopoldan" : virKoda === "SAPOP" ? "popoldan" : (koda === "DEZ" ? "DEŽURSTVO" : "PRISOTEN");
        vsebina.split(",").map(s => s.trim()).filter(Boolean).forEach(parafa => {
          const oseba = poParafi[parafa.toUpperCase()];
          if (!oseba) { neujemanja.add(parafa); return; }
          zapisi.push({ employee_id: oseba.id, department_code: koda, work_date: datum, shift_code: sifra });
        });
      });
    }, stanje);
  }
  if (!zapisi.length && !dopusti.length) {
    if (!stanje.najdenDatum) throw new Error(`Ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} v tej datoteki/zavihku - preveri, da si prilepil pravo povezavo (in pravi zavihek/mesec).`);
    if (!stanje.najdenaGlava) throw new Error("Najdene vrstice za izbrani mesec, a nad njimi ni najti vrstice z glavami enot.");
    throw new Error("Najdene vrstice za izbrani mesec, a nobena parafa se ni ujemala z osebo v aplikaciji: " + [...neujemanja].join(", "));
  }
  await Promise.all([
    zapisi.length ? shraniZapiseRazporeda(zapisi) : Promise.resolve(),
    dopusti.length ? shraniDopusteNzv(dopusti) : Promise.resolve(),
  ]);
  const deli = [];
  if (zapisi.length) deli.push(`${zapisi.length} vpisov razporeda`);
  if (dopusti.length) deli.push(`${dopusti.length} vpisov odsotnosti (LD/IZOB/BS)`);
  return `Uvoženih: ${deli.join(", ")}.` + (neujemanja.size ? ` Brez ujemanja parafe: ${[...neujemanja].join(", ")}.` : "");
}

// Enak namen kot pripraviPosodobitveOddelka (glej tam), a za NZV obliko:
// stolpci so ENOTE (znane, fiksne po nzvNazivVKodo), ne osebe, zato tu ne
// primerjamo glave z znanim naborom ljudi, ampak vsak naziv stolpca v listu
// prevedemo nazaj v kodo in poiščemo njegovo trenutno vrednost v "podatki"
// (glej nalozizPodatkeNzv) - to samodejno podpre tudi drugačen vrstni red
// stolpcev, kot ga ima NZV_STOLPCI, dokler so nazivi enaki uradni predlogi.
function pripraviPosodobitveNzv(vrsteVrstic, ciljniMesec, podatki){
  const { startISO, endISO } = monthRange(ciljniMesec);
  const nazivVKodo = nzvNazivVKodo();
  const posodobitve = [];
  const stanje = { najdenDatum: false, najdenaGlava: false };
  let i = 0;
  while (i < vrsteVrstic.length) {
    const datum = window.ImportUtils.normalizirajDatum((vrsteVrstic[i] || [])[0]);
    if (!ISO_DATUM_RX.test(datum)) { i++; continue; }
    i = obdelajBlok(vrsteVrstic, i, startISO, endISO, poisciEnoteNzv, 1, (vrstica, stolpci, datum, j) => {
      stolpci.forEach((naziv, idx) => {
        const koda = nazivVKodo[naziv];
        if (!koda) return;
        posodobitve.push({ vrstica: j, stolpec: 1 + idx, vrednost: podatki[koda + "|" + datum] || "" });
      });
    }, stanje);
  }
  return { posodobitve, najdenDatum: stanje.najdenDatum, najdenaGlava: stanje.najdenaGlava };
}

async function zapisiNzvVSheets(url, ciljniMesec){
  if (!window.GSheetsExport || !window.GSheetsExport.jeNastavljeno()) {
    throw new Error("Pisanje v Google Sheets še ni nastavljeno — manjka Google Client ID (glej GSHEETS-SETUP.md).");
  }
  const { startISO, endISO } = monthRange(ciljniMesec);
  const { podatki } = await nalozizPodatkeNzv(startISO, endISO);
  const { naslovLista, vrsteVrstic } = await window.GSheetsExport.preberiVrednosti(url);
  const { posodobitve, najdenDatum, najdenaGlava } = pripraviPosodobitveNzv(vrsteVrstic, ciljniMesec, podatki);
  if (!posodobitve.length) {
    if (!najdenDatum) throw new Error(`V zavihku "${naslovLista}" ni najdenih vrstic za ${MESECI[Number(ciljniMesec.split("-")[1]) - 1]} ${ciljniMesec.split("-")[0]} - preveri, da povezava kaže na pravi zavihek (klikni zavihek za ta oddelek, šele nato kopiraj povezavo).`);
    if (!najdenaGlava) throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nad njimi ni najti vrstice z glavami enot.`);
    throw new Error(`Najdene vrstice za izbrani mesec v zavihku "${naslovLista}", a nobena glava stolpca v listu se ni ujemala z znano enoto NZV.`);
  }
  const rezultat = await window.GSheetsExport.zapisiVObstojeciList(url, posodobitve);
  return `Zapisanih ${rezultat.stevilo} celic v zavihek "${rezultat.list}".`;
}

// Shrani zadnjo uporabljeno povezavo LOČENO za vsak kontekst (Moj
// razpored/vsak oddelek/NZV posebej - "več povezav" - admin ima ločen
// dokument za HOSPITAL in za NZV, oddelki pa so lahko celo ločeni zavihki
// znotraj istega dokumenta), da mu jih ni treba ob vsakem preklopu znova
// lepiti.
function kljucUvoza(kontekst){ return "razpored-uvoz-url-" + (kontekst || "my"); }

// Odpiranje NI notranje stanje te komponente: sprožilna ikona živi v
// fiksni vrstici ikon zgoraj desno (RazporedLogout "pred"), sama pa mora
// ostati zunaj nje, ker je ta vrstica z-index kontekst — modalno okno v
// njej bi se stackalo skupaj z njo. Zato "odprto"/"naZapri" prideta od
// strani, tu pa se izriše samo okno.
function UvozIzSheets({ profile, wardCode, myId, month, onUvozeno, odprto, naZapri }){
  const kontekst = wardCode || "my";
  const [url, setUrl] = useState(() => { try { return localStorage.getItem(kljucUvoza(kontekst)) || ""; } catch (e) { return ""; } });
  const [busy, setBusy] = useState(null); // "moj" | "oddelek" | null
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    setMsg(null);
    try { setUrl(localStorage.getItem(kljucUvoza(kontekst)) || ""); } catch (e) { setUrl(""); }
  }, [kontekst]);

  if (!profile || profile.role !== "admin") return null;

  const spremeniUrl = (v) => {
    setUrl(v);
    try { localStorage.setItem(kljucUvoza(kontekst), v); } catch (e) { /* zasebni način ipd. - ni usodno */ }
  };

  const nalozi = async (tip) => {
    if (!url.trim()) { setMsg({ ok: false, text: "Vnesi povezavo do Google Sheets." }); return; }
    setBusy(tip); setMsg(null);
    try {
      let besedilo;
      if (tip === "moj") besedilo = await uvoziMojRazpored(url.trim(), myId, profile.department_code, month);
      else if (wardCode === "NZV") besedilo = await uvoziNzv(url.trim(), month, myId);
      else besedilo = await uvoziOddelek(url.trim(), wardCode, month);
      setMsg({ ok: true, text: besedilo });
      onUvozeno();
    } catch (e) {
      setMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setBusy(null);
    }
  };

  // Piše nazaj za navadne oddelke IN za NZV (uvoziOddelek/pripraviPosodobitveOddelka
  // in uvoziNzv/pripraviPosodobitveNzv obe najdeta iste koordinate, ki jih uvoz tudi
  // prebere) - samo "Moj razpored" te možnosti (še) nima, ker gre za osebno, ne
  // deljeno tabelo. Zahteva potrditev, ker piše v deljen, ročno voden dokument z
  // realno zgodovino/podpisi - napačna povezava (napačen zavihek) bi lahko
  // prepisala tuje celice.
  const zapisiNazaj = async () => {
    if (!url.trim()) { setMsg({ ok: false, text: "Vnesi povezavo do Google Sheets." }); return; }
    if (!window.confirm(
      `To bo prepisalo obstoječe celice s podatki za ${MESECI[Number(month.split("-")[1]) - 1]} ${month.split("-")[0]} v zavihku, na katerega kaže zgornja povezava, s trenutnim stanjem iz aplikacije.\n\n` +
      "Imena/nazivi stolpcev, oblika in podpisni blok ostanejo nedotaknjeni - spremenijo se samo celice s podatki. To dejanje ni mogoče razveljaviti (razen ročno, v Google Sheets prek Zgodovina različic).\n\nNadaljujem?"
    )) return;
    setBusy("zapis"); setMsg(null);
    try {
      const besedilo = wardCode === "NZV" ? await zapisiNzvVSheets(url.trim(), month) : await zapisiOddelekVSheets(url.trim(), wardCode, month);
      setMsg({ ok: true, text: besedilo });
    } catch (e) {
      setMsg({ ok: false, text: e.message || String(e) });
    } finally {
      setBusy(null);
    }
  };

  // Napredna, redkeje uporabljena funkcija (samo admin) - v modalnem oknu,
  // da glavni zaslon ostane čist (na telefonu se odpre z dna).
  if (!odprto) return null;
  return (
    <div className="no-print">
        <div className="modalOzadje" role="dialog" aria-modal="true" aria-label="Uvoz iz Google Sheets"
          onClick={e => { if (e.target === e.currentTarget) naZapri(); }}>
        <div className="modalOkno">
          <div className="modalGlava">
            <h3>📥 Uvoz iz Google Sheets</h3>
            <button type="button" className="modalZapri" aria-label="Zapri" onClick={naZapri}>✕</button>
          </div>
          <div className="field" style={{ marginTop: 0 }}>
            <label htmlFor="gsUrl">
              Uvoz iz Google Sheets za {kontekst === "my" ? "Moj razpored" : (kontekst === "NZV" ? "NZV" : "oddelek " + kontekst)} (deljeno kot "vsak s povezavo lahko ogleda")
            </label>
            <input id="gsUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..." value={url} onChange={e => spremeniUrl(e.target.value)} />
          </div>
          <p className="hint" style={{marginTop:2, marginBottom:10}}>
            Pomembno pri dokumentu z več zavihki (en na oddelek): odpri zavihek ZA TA ODDELEK v Google Sheets
            (klikni njegovo ime na dnu preglednice) in šele nato kopiraj povezavo iz naslovne vrstice - ta mora
            vsebovati "#gid=…". Če povezavo kopiraš, ne da bi prej kliknil zavihek, se vedno uporabi prvi zavihek v
            dokumentu, ne tisti, ki ga pričakuješ.
          </p>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="dlBtn" type="button" disabled={!!busy} onClick={() => nalozi("moj")}>
              {busy === "moj" ? "Uvažam …" : "📥 Uvozi Moj razpored"}
            </button>
            <button className="dlBtn" type="button" disabled={!!busy || !wardCode} onClick={() => nalozi("oddelek")}>
              {busy === "oddelek" ? "Uvažam …" : "📥 Uvozi " + (wardCode === "NZV" ? "NZV" : "Oddelki")}
            </button>
            {wardCode && (
              <button className="dlBtn" type="button" disabled={!!busy} onClick={zapisiNazaj}>
                {busy === "zapis" ? "Zapisujem …" : "📤 Zapiši nazaj v Sheets"}
              </button>
            )}
          </div>
          <p className="hint" style={{marginTop:6}}>
            Uvozi/zapiše samo mesec, ki je trenutno izbran zgoraj ({MESECI[Number(month.split("-")[1]) - 1]} {month.split("-")[0]}) -
            povezava lahko kaže na zavihek z več meseci (kot realna predloga), aplikacija sama poišče pravi blok. Vsak
            gumb/oddelek si zapomni svojo zadnjo povezavo posebej. "Zapiši nazaj" prepiše SAMO obstoječe celice, ki jih
            uvoz tudi prebere (izmene po osebah za oddelke; enote/Dežurstvo/LD/IZOB/BS za NZV) - novih
            oseb/stolpcev/vrstic ne dodaja, oblike in podpisnega bloka se ne dotakne.
          </p>
          {msg && <p className={msg.ok ? "okMsg" : "err"} style={{ marginTop: 8 }}>{msg.text}</p>}
        </div>
        </div>
    </div>
  );
}

// Zložljiva pomoč - dolgo pojasnjevalno besedilo skrito za "?" gumbom,
// da glavni zaslon ostane čist (namesto vedno vidnega odstavka).
function InfoToggle({ children }){
  const [odprto, setOdprto] = useState(false);
  return (
    <div className="no-print" style={{ marginTop: 10, display: "flex", alignItems: "flex-start", gap: 8 }}>
      <button type="button" className="infoToggle" aria-expanded={odprto} aria-label="Pomoč" onClick={() => setOdprto(o => !o)}>?</button>
      {odprto && <div className="infoPanel hint" style={{ margin: 0 }}>{children}</div>}
    </div>
  );
}

// ---------------------------------------------------------------------
// Uvodni nagovor ob prvih odprtjih: namestitev na domači zaslon in vklop
// obvestil.
//
// Zakaj sploh: potisna obvestila na iPhonu delujejo IZKLJUČNO, če je
// aplikacija dodana na domači zaslon in odprta od tam. Safari dogodka
// "beforeinstallprompt" nikoli ne sproži, zato uporabnik iPhona brez tega
// ne dobi nobenega namiga — obvestil preprosto ne bo, brez napake in brez
// pojasnila. Ob uvedbi za celotno ekipo bi to pomenilo, da bi velik del
// mislil, da obveščanje ne dela, čeprav dela.
//
// Kartica se pokaže SAMO, kadar je še kaj za storiti, in jo je mogoče
// zapreti; zaprtje si zapomnimo. Kdor je vse uredil, je nikoli ne vidi.
// ---------------------------------------------------------------------
const UVOD_ZAPRT = "razpored-uvod-zaprt";

function jeIOS(){
  // iPad z novejšim iPadOS se predstavlja kot Mac, zato še preverba na dotik.
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function jeSamostojna(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
    || navigator.standalone === true;
}

function Uvod({ myId, deferredPrompt, naNamesti }){
  const [zaprt, setZaprt] = useState(() => {
    try { return localStorage.getItem(UVOD_ZAPRT) === "1"; } catch (e) { return false; }
  });
  const [pushStanje, setPushStanje] = useState(null); // null = še preverjam
  const [busy, setBusy] = useState(false);
  const [napaka, setNapaka] = useState(null);

  useEffect(() => {
    if (window.RazporedPush) RazporedPush.stanje().then(setPushStanje);
    else setPushStanje("nepodprto");
  }, []);

  const zapri = () => {
    setZaprt(true);
    try { localStorage.setItem(UVOD_ZAPRT, "1"); } catch (e) { /* zasebni način */ }
  };

  const vklopiObvestila = async () => {
    setBusy(true); setNapaka(null);
    try {
      await RazporedPush.vklopi(myId);
      setPushStanje("vklopljeno");
    } catch (e) {
      setNapaka(e.message || String(e));
    } finally { setBusy(false); }
  };

  if (zaprt || pushStanje === null) return null;

  const samostojna = jeSamostojna();
  const ios = jeIOS();
  // Na iPhonu je namestitev POGOJ za obvestila, zato dokler ni nameščena,
  // gumba za obvestila sploh ne ponujamo - vodil bi v tiho napako.
  const kaziNamestitev = !samostojna && (ios || !!deferredPrompt);
  const kaziObvestila = pushStanje === "izklopljeno" && (!ios || samostojna);
  const kaziBlokirano = pushStanje === "zavrnjeno";

  if (!kaziNamestitev && !kaziObvestila && !kaziBlokirano) return null;

  return (
    <div className="uvodKarta no-print">
      <button className="uvodZapri" onClick={zapri} aria-label="Zapri">×</button>
      <div className="uvodNaslov">Da ti razpored pride na telefon</div>

      {kaziNamestitev && (
        <div className="uvodKorak">
          <div className="uvodStevilka">1</div>
          <div>
            <b>Dodaj na domači zaslon</b>
            {ios ? (
              <div className="uvodOpis">
                V Safariju pritisni <b>Deli</b> (kvadratek s puščico navzgor) → <b>Dodaj na začetni zaslon</b> →
                <b> Dodaj</b>. Nato aplikacijo odpri s te ikone.
                <div style={{marginTop:4}}>Na iPhonu je to <b>nujno</b> — brez tega obvestila ne delujejo.</div>
              </div>
            ) : (
              <div className="uvodOpis">Odpira se kot samostojna aplikacija, brez brskalnika.</div>
            )}
            {!ios && deferredPrompt && (
              <button className="uvodGumb" onClick={naNamesti}>Namesti</button>
            )}
          </div>
        </div>
      )}

      {kaziObvestila && (
        <div className="uvodKorak">
          <div className="uvodStevilka">{kaziNamestitev ? 2 : 1}</div>
          <div>
            <b>Vklopi obvestila</b>
            <div className="uvodOpis">
              Obvestilo dobiš ob objavi novega razporeda, ob premiku tvoje menjave in kot opomnik dan pred
              nočno izmeno ali dežurstvom. Velja za to napravo.
            </div>
            <button className="uvodGumb" onClick={vklopiObvestila} disabled={busy}>
              {busy ? "Trenutek …" : "🔔 Vklopi obvestila"}
            </button>
            {napaka && <div className="uvodOpis" style={{color:"var(--danger)"}}>{napaka}</div>}
          </div>
        </div>
      )}

      {kaziBlokirano && (
        <div className="uvodKorak">
          <div className="uvodStevilka">!</div>
          <div>
            <b>Obvestila so blokirana</b>
            <div className="uvodOpis">
              Brskalnik jih je za to stran zavrnil. Odblokiraj jih prek ikone ključavnice ob naslovu strani,
              nato osveži.
            </div>
          </div>
        </div>
      )}

      <div className="uvodOpis" style={{marginTop:10}}>
        Kadar koli pozneje: <b>Nastavitve → Obvestila</b>.
      </div>
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null); // { session, profile }
  const [depts, setDepts] = useState([]);
  const [view, setView] = useState("my");
  const [month, setMonth] = useState(currentMonthStr());
  const [wardCode, setWardCode] = useState(null);
  const [unread, setUnread] = useState(0);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [reloadKey, setReloadKey] = useState(0); // dvigne se po uvozu iz Google Sheets, da se pogled znova naloži
  // Uvozno okno odpira ikona 📥 v fiksni vrstici zgoraj desno (poleg ⚙ in
  // 🚪), samo okno pa se izriše niže — zato stanje živi tu, med obema.
  const [uvozOdprt, setUvozOdprt] = useState(false);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => {
      if (!res) return;
      setAuth(res);
      const dept = res.profile ? res.profile.department_code : null;
      // Razpored je viden vsem zaposlenim za VSE oddelke (dogovorjeno) - enako,
      // kot že velja v bazi (schedule_select: "to authenticated using (true)").
      // Privzeto se odpre svoj oddelek, preklop na katerega koli drugega pa je
      // prost; kdor oddelka nima, začne na prvem v seznamu.
      setWardCode(PO_ODDELKIH_KODE.includes(dept) ? dept : PO_ODDELKIH_KODE[0]);
      RazporedAuth.unreadNotificationCount(res.session.user.id).then(setUnread);
    });
  }, []);

  useEffect(() => {
    client.from("departments").select("code, name").order("code").then(({ data }) => {
      const imenaPoKodi = {};
      (data || []).forEach(d => { imenaPoKodi[d.code] = d.name; });
      const seznam = PO_ODDELKIH_KODE.map(k => ({ code: k, name: imenaPoKodi[k] || k }));
      seznam.push({ code: "NZV", name: "NZV — vodje, administratorji (+ dežurstva)" });
      setDepts(seznam);
    });
  }, []);

  useEffect(() => {
    if ("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
  };

  // Excel/Google Sheets izvoz — kliče ga kompaktni ikonski meni ob polju
  // Mesec (glej RazporedIzvoz compact spodaj). PDF izvoz (PrintFit) dela
  // neposredno nad izrisano tabelo/kartico, tu pa gre za surove podatke
  // (glave+vrstice), zato ju je treba znova prebrati - isti poizvedbi kot
  // MyScheduleView/WardView, samo na zahtevo namesto stalno v komponenti.
  // Podpisne vrstice na dnu izvoza (Datum objave/Zadnja sprememba/Pripravil/
  // Pregledal in odobril) - ista logika kot RazporedPodpisi na zaslonu, samo
  // kot dodatne vrstice v podatkih namesto ločenega HTML bloka, po vzoru
  // uradnih predlog. Prva celica vsake vrstice je namenoma prazna (uvoz jo
  // prepozna kot ne-datumsko vrstico in jo preskoči - glej ISO_DATUM_RX).
  const podpisneVrstice = async (entries, stolpcev) => {
    const prazno = new Array(stolpcev).fill("");
    const objava = (entries || []).reduce((min, e) => (e.created_at && (!min || e.created_at < min.created_at)) ? e : min, null);
    const zadnja = (entries || []).reduce((max, e) => (e.updated_at && (!max || e.updated_at > max)) ? e.updated_at : max, null);
    const [{ data: koord }, { data: pripravilProfil }] = await Promise.all([
      client.from("profiles").select("full_name, job_title").eq("is_koordinator", true).limit(1).maybeSingle(),
      objava && objava.created_by
        ? client.from("profiles").select("full_name, job_title").eq("id", objava.created_by).maybeSingle()
        : Promise.resolve({ data: null }),
    ]);
    const nazivIme = (p) => p ? p.full_name + (p.job_title ? ", " + p.job_title : "") : "";
    const vrstice = [];
    vrstice.push(["Datum objave razporeda:", objava && objava.created_at ? new Date(objava.created_at).toLocaleString("sl-SI") : "ni podatka", ...prazno.slice(2)]);
    vrstice.push(["Zadnja sprememba:", zadnja ? new Date(zadnja).toLocaleString("sl-SI") : "ni podatka", ...prazno.slice(2)]);
    if (pripravilProfil) vrstice.push(["Pripravil/-a:", nazivIme(pripravilProfil), ...prazno.slice(2)]);
    if (koord) vrstice.push(["Pregledal in odobril:", nazivIme(koord), ...prazno.slice(2)]);
    return vrstice;
  };

  const pripraviIzvoz = async () => {
    const { startISO, endISO } = monthRange(month);
    const days = daysInRange(startISO, endISO);
    if (view === "my") {
      const { data } = await client.from("schedule_entries").select("work_date, shift_code")
        .eq("employee_id", auth.session.user.id).gte("work_date", startISO).lte("work_date", endISO);
      const byDate = {}; (data || []).forEach(r => { byDate[r.work_date] = r.shift_code; });
      return [{
        ime: "Moj razpored",
        glave: ["Datum", "Dan", "Izmena"],
        vrstice: days.map(dn => [datumSlo(dn.datum), dn.dan, shiftLabel(byDate[dn.datum])]),
      }];
    }

    // view === "ward"
    if (wardCode === "NZV") {
      // Isto obliko (dnevi v vrsticah, ENOTE v stolpcih, parafe namesto
      // polnih imen, SA razdeljena na dopoldan/popoldan, LD/IZOB/BS povzetek
      // odsotnosti) kot na zaslonu - glej NzvView/nalozizPodatkeNzv -
      // usklajeno z uradno predlogo "Letni dopusti in omejitve za NZV".
      const { podatki: m, entries: data } = await nalozizPodatkeNzv(startISO, endISO);
      // SAMO en uvodni stolpec ("Datum", dan že vsebovan v besedilu) - za
      // razliko od oddelčnih tabel realna predloga "Letni dopusti in
      // omejitve za NZV" NIMA ločenega stolpca "Dan" (glava se začne
      // neposredno "DATUM | PDZN | SOBO | …").
      const glaveKoncne = ["Dežurstvo", "LD", "IZOB", "BS"];
      return [{
        ime: "NZV",
        glave: ["Datum", ...NZV_STOLPCI.map(([, naziv]) => naziv), ...glaveKoncne],
        vrstice: [
          ...days.map(dn => [
            datumSlo(dn.datum) + " " + dn.dan,
            ...NZV_STOLPCI.map(([koda]) => m[koda + "|" + dn.datum] || ""),
            m["DEZ|" + dn.datum] || "", m["LD|" + dn.datum] || "", m["IZOB|" + dn.datum] || "", m["BS|" + dn.datum] || "",
          ]),
          ...(await podpisneVrstice(data, NZV_STOLPCI.length + 1 + glaveKoncne.length)),
        ],
      }];
    }

    // Isto transponirano obliko (dnevi v vrsticah, osebe v stolpcih glave -
    // kratka imena "Priimek X." kot na zaslonu) kot na zaslonu (glej
    // WardView) - usklajeno z uradno predlogo "2026 SMS RAZPORED". Druga
    // vrstica podatkov (prazen Datum/Dan) je vloga vsake osebe (SMS/TZN ali
    // DMS/DZN), po vzoru iste predloge.
    const naslovOddelka = (depts.find(d => d.code === wardCode) || {}).name || wardCode;
    const [{ data: profili }, { data }] = await Promise.all([
      client.from("profiles").select("id, full_name, role").eq("department_code", wardCode).order("full_name"),
      client.from("schedule_entries").select("employee_id, work_date, shift_code, created_at, created_by, updated_at")
        .eq("department_code", wardCode).gte("work_date", startISO).lte("work_date", endISO),
    ]);
    const zaposleni = profili || [];
    const byEmpDate = {};
    (data || []).forEach(r => { byEmpDate[r.employee_id + "|" + r.work_date] = r.shift_code; });
    return [{
      ime: naslovOddelka,
      glave: ["Datum", "Dan", ...zaposleni.map(z => priimekZacetnica(z.full_name))],
      vrstice: [
        ["", "", ...zaposleni.map(z => z.role === "user" ? "SMS / TZN" : "DMS / DZN")],
        ...days.map(dn => [datumSlo(dn.datum), dn.dan, ...zaposleni.map(z => shiftLabel(byEmpDate[z.id + "|" + dn.datum]))]),
        ...(await podpisneVrstice(data, zaposleni.length + 2)),
      ],
    }];
  };

  if (!auth) return null; // requireAuth preusmeri, če ni prijave

  const { session, profile } = auth;
  // "Po oddelkih" je odprt vsem prijavljenim, za vse oddelke. Pravice za
  // pisanje (generiranje, objava) in odobritve ostajajo nespremenjene - te
  // še naprej ločuje vloga, tako v vmesniku kot v RLS politikah.

  // Izvoz je ikona v isti fiksni vrstici kot uvoz/nastavitve/odjava, zato
  // je element definiran tu in podan navzdol — prej je stal v vrstici z
  // izbirnikom meseca in ji jemal širino.
  const izvozniVir = (
        <RazporedIzvozVir
          naziv={view === "ward" ? (wardCode === "NZV" ? "NZV" : "Oddelek " + (wardCode || "")) : "Moj razpored"}
          naslov={(view === "ward" ? "razpored-" + wardCode : "moj-razpored") + "-" + month}
          pripravi={pripraviIzvoz}
          pdf={{
            label: "Izvozi v PDF (" + (view === "ward" ? "A4 ležeče" : "A4 pokončno") + ", 1 stran)",
            onClick: () => {
              const el = view === "ward" ? document.querySelector(".wardPrintArea") : document.getElementById("printMy");
              // "pdfCols" razporedi tedne v več stolpcev SAMO za izvoz (glej
              // CSS zgoraj) - doda se pred merjenjem/tiskanjem, odstrani po
              // "afterprint", da se živ zaslon nikoli ne spremeni.
              if (view === "my" && el) {
                el.classList.add("pdfCols");
                const pocistiPoTiskanju = () => {
                  el.classList.remove("pdfCols");
                  window.removeEventListener("afterprint", pocistiPoTiskanju);
                };
                window.addEventListener("afterprint", pocistiPoTiskanju);
              }
              PrintFit.natisni(el, { orientacija: view === "ward" ? "landscape" : "portrait" });
            },
          }}
          ical={view === "my" ? {
            onClick: async () => {
              const { startISO, endISO } = monthRange(month);
              const { data } = await client.from("schedule_entries").select("work_date, shift_code")
                .eq("employee_id", session.user.id).gte("work_date", startISO).lte("work_date", endISO);
              const byDate = {}; (data || []).forEach(r => { byDate[r.work_date] = r.shift_code; });
              const dnevi = daysInRange(startISO, endISO);
              prenesiICS(ustvariICS(dnevi, byDate), "moj-razpored-" + month + ".ics");
            },
          } : undefined}
        />
  );

  return (
    <div className={"wrap" + (view === "ward" ? " wide polna" : "")}>
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout pred={
        <React.Fragment>
          <RazporedUvozIkona/>
          <RazporedOrodja/>
        </React.Fragment>
      }/>
      {profile && profile.role === "admin" && (
        <RazporedUvozVir
          ikona="📗"
          naziv="Razpored iz Google Sheets"
          opis={view === "ward" ? (wardCode === "NZV" ? "NZV" : "oddelek " + (wardCode || "—")) : "Moj razpored"}
          onClick={() => setUvozOdprt(true)}
        />
      )}
      <header className="top">
        <div className="wordmark">
          <img className="logoSmall" src="logo-pbb.png" alt="" />
          <span className="mark">Razpored</span>
        </div>
        <p className="sub">{new Date(month+"-01").toLocaleDateString("sl-SI",{month:"long", year:"numeric"})} · Psihiatrična bolnišnica Begunje</p>
        <div className="whoRow no-print">
          <span className="who">Prijavljen: <b>{profile ? profile.full_name : session.user.email}</b></span>
        </div>

        <div className="segmented no-print" role="tablist">
          <button role="tab" aria-selected={view==="my"} onClick={() => setView("my")}>Moj razpored</button>
          <button role="tab" aria-selected={view==="ward"} onClick={() => setView("ward")}>Po oddelkih</button>
        </div>

        {view==="ward" && (
          <div className="field no-print">
            <label htmlFor="wd">Oddelek</label>
            <select id="wd" value={wardCode || ""} onChange={e => setWardCode(e.target.value)}>
              <option value="" disabled>Izberi oddelek …</option>
              {depts.map(d => <option key={d.code} value={d.code}>{d.name}</option>)}
            </select>
          </div>
        )}
        <div className="field no-print">
          <label htmlFor="mmSel">Mesec</label>
          <div style={{display:"flex", gap:8, alignItems:"center"}}>
            <select id="mmSel" value={Number(month.split("-")[1])}
              onChange={e => setMonth(month.split("-")[0] + "-" + String(e.target.value).padStart(2,"0"))}
              style={{flex:"1 1 auto", minWidth:0}}>
              {MESECI.map((m, i) => <option key={i} value={i+1}>{m}</option>)}
            </select>
            <select id="ySel" value={Number(month.split("-")[0])}
              onChange={e => setMonth(e.target.value + "-" + month.split("-")[1])}
              style={{flex:"0 0 auto", minWidth:0}}>
              {Array.from({length:5}, (_, i) => new Date().getFullYear() - 1 + i).map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
      </header>

      {izvozniVir}
      <UvozIzSheets
        profile={profile}
        wardCode={view === "my" ? null : wardCode}
        myId={session.user.id}
        month={month}
        onUvozeno={() => setReloadKey(k => k + 1)}
        odprto={uvozOdprt}
        naZapri={() => setUvozOdprt(false)}
      />

      {view==="my" && <MyScheduleView key={"my" + reloadKey} userId={session.user.id} month={month} />}
      {view==="ward" && wardCode && (
        wardCode === "NZV"
          ? <NzvView key={"nzv" + reloadKey} month={month} />
          : <WardView key={"ward" + reloadKey} deptCode={wardCode} month={month} myId={session.user.id} />
      )}
      {view==="ward" && !wardCode && <p className="sub" style={{marginTop:16}}>Izberi oddelek zgoraj.</p>}

      <Uvod myId={session.user.id} deferredPrompt={deferredPrompt} naNamesti={install} />

      <footer className="foot">
        <p><b>Razpored PBB</b> — prijavljen dostop. Za spremembe ali zamenjave uporabi "Menjava" spodaj.</p>
        <p>Razpored temelji na osnovnem kalupu; dejanske spremembe (bolniška, odobrene menjave) se odražajo sproti. Preverite tudi na oglasni deski oddelka.</p>
      </footer>

      <RazporedNav active="index" role={profile ? profile.role : "user"} unread={unread} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
