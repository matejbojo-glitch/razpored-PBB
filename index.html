<!-- Temni način sledi nastavitvi naprave (glej prefers-color-scheme v theme.css);
     brez te vrstice bi vrstica brskalnika/PWA ostala kremna nad temno stranjo. -->

<!-- Pisava Fraunces neblokirno: media="print" pomeni, da datoteka ne
     zadržuje izrisa; ko se naloži, jo onload preklopi na "all". Če se
     ne naloži (požarni zid, ni signala), stran deluje naprej z
     rezervno pisavo. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      media="print" onload="this.media='all'" />

<style>
  /* Stran-specifično za index.html: samo tisk v PDF na točno 1 stran
     (PrintFit.natisni izračuna --print-scale). Vse ostalo (barve,
     gumbi, kartice, tabela …) prihaja iz theme.css. */
  @media print{
    table.wardTable td.name, table.wardTable th.name{ background:#fff !important; }
    table.wardTable thead th{ background:#f2f2f2 !important; }
    .wardScroller{ overflow:visible !important; max-height:none !important; border:none !important; }
    .wardPrintArea{ zoom: var(--print-scale, 1); }
    table.wardTable thead th, table.wardTable td.name, table.wardTable th.name{ position:static !important; }
    table.wardTable tr{ break-inside:avoid; page-break-inside:avoid; }
    #printMy{ zoom: var(--print-scale, 1); }
    :root{ --bg:#fff; --bg-grad:#fff; --surface:#fff; --surface-2:#f2f2f2; --line:#ccc; --text:#000; --muted:#444; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; background:#fff !important; }
    .wrap{ max-width:100% !important; }
  }

  /* "Moj razpored" na zaslonu ostane en stolpec pod drugim (nespremenjeno,
     ne glede na obračanje zaslona) - razred "pdfCols" se doda samo tik pred
     klicem PrintFit.natisni (glej App spodaj) in odstrani po tiskanju
     ("afterprint"), da so tedni v PDF izvozu razporejeni v več stolpcih in
     cel mesec pride na eno stran. Namenoma NI znotraj @media print zgoraj:
     PrintFit.natisni izmeri scrollHeight elementa PRED klicem window.print()
     (torej pred aktivacijo @media print), zato mora biti postavitev že
     spremenjena OB MERJENJU, ne šele med dejanskim tiskanjem. */
  #printMy.pdfCols .weeksGrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px; }

  /* "Po oddelkih" – tabela postavljena kot uradna predloga "2026 SMS
     RAZPORED": dnevi v vrsticah (stolpec "Dan" je zdaj samo datum, ne ime
     osebe), osebe v stolpcih glave. Vikend obarva celo vrstico (kot v
     predlogi), ne posamezne celice; lastni stolpec (bralec sam) je rahlo
     poudarjen. */
  /* Datum mora biti viden CEL ("1.8.2026 PO"). Splošno pravilo za td.name
     (theme.css) reže besedilo s "…", kar je pri 64 px pomenilo "1.8.20…". */
  table.wardTableT td.name, table.wardTableT th.name{
    width:88px; min-width:88px; text-align:center; white-space:nowrap;
    overflow:visible; text-overflow:clip;
  }
  /* FLEXI: kateri oddelek oseba ta dan pokriva (lahko dva, npr. "C/E2") -
     nad kodo izmene, v svoji vrstici, da se ne zamenja z izmeno. */
  .pokriva{
    display:block; font-size:9.5px; font-weight:800; letter-spacing:.03em;
    color: var(--accent-2); margin-bottom:1px;
  }
  table.wardTableT tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  table.wardTableT thead th.me{ background: rgba(var(--accent-rgb),.15); }

  /* Namizje (širši zaslon) IN ležeča postavitev telefona (manifest.json
     orientation zdaj "any", ne več zaklenjeno na pokončno) - na izrecno
     željo naj bo cela preglednica "Po oddelkih" prek celega zaslona in cel
     mesec viden brez vodoravnega drsenja: tabela dobi table-layout:fixed in
     polno širino namesto naravne širine na celico (isti vzorec kot mreža v
     zelje.html). Na ozkem pokončnem telefonu ostane naravna širina +
     vodoravno drsenje (fiksna postavitev bi tam stisnila stolpce oseb na
     neberljivo majhno). "Moj razpored" ostane nespremenjen ne glede na
     zaslon - glej "pdfCols" zgoraj za PDF izvoz. */
  @media (min-width:900px), (orientation: landscape){
    .wardScroller{ overflow-x:visible; }
    table.wardTableT{ width:100%; table-layout:fixed; }
    table.wardTableT th.name, table.wardTableT td.name{ width:88px; }
    table.wardTableT th:not(.name), table.wardTableT td:not(.name){ width:auto; min-width:0; }
    /* Cele kode izmen ("popoldan do 19", "NOČNA od 19") so predolge za
       enakomerno razdeljen stolpec pri table-layout:fixed - privzeti
       white-space:nowrap (theme.css) bi jih pustil vizualno preliti čez
       sosednje celice. Raje se prelomijo v dve vrstici znotraj SVOJEGA
       stolpca. */
    table.wardTableT td:not(.name){ white-space:normal; }
  }
  @media (min-width:900px){
  }
  /* "Širši prikaz" mora DEJANSKO zavrteti zaslon (ne samo prilepiti široko
     tabelo na ozek pokončni zaslon - to bi tabelo samo stisnilo, ne
     razširilo, kar se je zgodilo pri prvem poskusu, glej posnetek
     zaslona uporabnika). Zato na ozkem pokončnem zaslonu CELO stran
     (body) vizualno zavrtimo za 90° - klasičen "prisilno ležeče" trik za
     telefone s samodejnim obračanjem, izklopljenim v nastavitvah
     Androida. width/height sta zamenjana (100vh/100vw), da telefon
     DEJANSKO dobi širino svoje višine (~700-900px), ne samo CSS namig na
     nespremenjeni ozki širini. transform na body ustvari nov "containing
     block" tudi za position:fixed elemente znotraj njega (vrstica ikon,
     spodnji meni), zato se zavrtijo skupaj z ostalo vsebino. Na napravi,
     ki je JE dejansko ležeča (ali širši zaslon), se ta blok sploh ne
     uporabi (orientation:portrait pogoj) - gumb tam ni potreben, a ostane
     brez učinka, če bi ga kdo vseeno kliknil. */
  @media (orientation: portrait){
    html.sirsiPogled body{
      position: fixed;
      top: 0; left: 0;
      width: 100vh;
      height: 100vw;
      transform-origin: top left;
      transform: rotate(90deg) translateY(-100%);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
  }
  /* Ista postavitev kot zgoraj, a NA ZAHTEVO prek gumba "Širši prikaz"
     (glej WideToggle v App), namesto da bi bila odvisna od tega, ali
     naprava DEJANSKO javi ležečo orientacijo - telefon s samodejnim
     obračanjem, izklopljenim v nastavitvah Androida, orientation:landscape
     nikoli ne sproži, ne glede na to, kako ga uporabnik drži. */
  html.sirsiPogled .wardScroller{ overflow-x:visible; }
  html.sirsiPogled table.wardTableT{ width:100%; table-layout:fixed; }
  html.sirsiPogled table.wardTableT th.name, html.sirsiPogled table.wardTableT td.name{ width:88px; }
  html.sirsiPogled table.wardTableT th:not(.name), html.sirsiPogled table.wardTableT td:not(.name){ width:auto; min-width:0; }
  html.sirsiPogled table.wardTableT td:not(.name){ white-space:normal; }

  /* NZV – dnevi v vrsticah, organizacijske ENOTE v stolpcih (ne osebe), po
     uradni predlogi "Letni dopusti in omejitve za NZV". Manjše pisave, ker
     je stolpcev veliko (17 enot + Dežurstvo); celica prikaže polno ime
     osebe, ki to enoto ta dan pokriva (ne ročno kodirane kratice iz
     predloge - zanesljive samodejne kratice iz "full_name" niso izvedljive
     brez ločenega polja za priimek). */
  table.wardTableNzv th, table.wardTableNzv td{ font-size:10.5px; padding:5px 3px; }
  table.wardTableNzv td.name{ width:64px; min-width:0; text-align:center; white-space:nowrap; font-size:11px; }
  table.wardTableNzv td.enotaCell{ text-align:center; white-space:normal; word-break:break-word; }
  /* Izpeljana (ne objavljena) zasedba enote - stalni nosilec oz. njegov
     nadomeščevalec. Bledeje, da se na prvi pogled loči od objavljenega
     razporeda; glej nalozizPodatkeNzv. */
  table.wardTableNzv td.enotaCell.izpeljano{ opacity:.62; font-style:italic; }
  /* Celica, kjer se objava ne ujema s pravilom nadomeščanja - opozorilo,
     ne napaka: razpored ostane, kot je objavljen. */
  table.wardTableNzv td.enotaCell.odstopanje{ box-shadow: inset 3px 0 0 var(--pop); }
  /* Vrstica z nastavitvijo izmenične zasedbe SA (samo administrator).
     Nad mrežo, ker je učinek takoj viden v stolpcih SA DOP/SA POP. */
  .saNastavitve{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin:0 0 10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:var(--radius-sm); background:var(--surface-2);
    color:var(--text); font-size:13px;
  }
  .saNastavitve select, .saNastavitve input{
    padding:4px 6px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--text); font:inherit;
  }
  .saNastavitve .napaka{ color:var(--danger); flex-basis:100%; }
  @media print{ .saNastavitve{ display:none; } }
  table.wardTableNzv th.dez, table.wardTableNzv td.dez{ background: rgba(var(--danger-rgb),.07); font-weight:700; }
  table.wardTableNzv tbody tr.weekend td{ background: rgba(201,113,63,.08); }
  @media (min-width:900px), (orientation: landscape){
    table.wardTableNzv{ width:100%; table-layout:fixed; }
    table.wardTableNzv td.name{ width:60px; }
    table.wardTableNzv th:not(.name):not(.dez), table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
    table.wardTableNzv th.dez, table.wardTableNzv td.dez{ width:90px; }
  }
  html.sirsiPogled table.wardTableNzv{ width:100%; table-layout:fixed; }
  html.sirsiPogled table.wardTableNzv td.name{ width:60px; }
  html.sirsiPogled table.wardTableNzv th:not(.name):not(.dez), html.sirsiPogled table.wardTableNzv td.enotaCell:not(.dez){ width:auto; min-width:0; }
  html.sirsiPogled table.wardTableNzv th.dez, html.sirsiPogled table.wardTableNzv td.dez{ width:90px; }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const { client } = RazporedAuth;

const DAN_IME = { PO:"ponedeljek", TO:"torek", SR:"sreda", ČE:"četrtek", PE:"petek", SO:"sobota", NE:"nedelja" };
const MESECI = ["Januar","Februar","Marec","April","Maj","Junij","Julij","Avgust","September","Oktober","November","December"];

// Datum kot v uradnih predlogah ("1. 9. 2026", brez vodilnih ničel) namesto
// ISO - samo za PRIKAZ/izvoz na tej strani; interno (poizvedbe, ključi) se
// še vedno povsod uporablja ISO "YYYY-MM-DD".
// Ena sama oblika datuma za vso aplikacijo - glej datum.js.
function datumSlo(iso){ return window.Datum.slo(iso); }

// Kratko ime za prikaz na "Po oddelkih" (samo TA stran - full_name se nikjer
// drugje v aplikaciji ne skrajša), po vzoru uradne predloge "2026 SMS
// RAZPORED" ("DŽINIĆ A."): PRIIMEK (lahko iz več besed, npr. "Mavri
// Tratnik") + presledek + prva črka IMENA (zadnja beseda) + piko. full_name
// je v aplikaciji dosledno shranjen kot "Priimek Ime" (glej npr.
// DEZURNI_OSNOVA_DO_31_8_2026 v admin.html).
function priimekZacetnica(fullName){
  const deli = (fullName || "").trim().split(/\s+/);
  if (deli.length < 2) return (fullName || "").toUpperCase();
  const ime = deli[deli.length - 1];
  const priimek = deli.slice(0, -1).join(" ");
  return `${priimek} ${ime[0]}.`.toUpperCase();
}

// Parafa za NZV celice (po vzoru "Letni dopusti in omejitve za NZV" -
// "BOJ", "DŽA" ipd.) - uporabi ročno nastavljeno profili.parafa (Imenik),
// sicer groba samodejna privzeta vrednost (prve 3 črke priimka), ki jo
// admin lahko ročno popravi, če se dve osebi ujemata.
// PREDPOSTAVKA: full_name je zapisan kot "Priimek Ime" (tako je povsod v
// aplikaciji), zato je priimek VSE RAZEN zadnje besede – s tem so zajeti
// tudi dvobesedni priimki ("Mavri Tratnik Magdalena" -> "MAV"). Dokler so
// bili nekateri zapisani obratno, je ta funkcija zanje vračala prve tri
// črke OSEBNEGA imena ("Aldin Gazibara" -> "ALD" namesto "GAZ").
// Logika paraf je v skupni parafa.js (edini vir resnice) - isto preslikavo
// oznaka → OSEBA potrebuje tudi Imenik (pregled paraf), podvojena pa bi
// bila nevarna: tiho razhajanje med kopijama bi pomenilo izmeno, pripisano
// napačnemu človeku. Tu ostaneta samo imeni, ki ju uporablja preostala koda
// te strani.
const PARAFA_PRESTOP = window.Parafa.PRESTOP;
function autoParafa(fullName){ return window.Parafa.auto(fullName); }
function parafaOd(profil, datum){ return window.Parafa.zaDatum(profil, datum); }
// Prikaz ur izmene pride iz skupnega delovni-cas.js (edini vir resnice) –
// prej je bila ista tabela zapisana še enkrat tu in še enkrat v admin.html.
const DELOVNI_ČAS = Object.fromEntries(
  Object.entries(window.DelovniCas.IZMENE)
    .filter(([, v]) => v.ure != null) // brez dežurstva: ure so odvisne od dneva v tednu
    .map(([k, v]) => [k, v.zacetek.replace(":", ".") + "\u2013" + v.konec.replace(":", ".")])
);
DELOVNI_ČAS["KPU"] = "koriščenje prostih ur";
DELOVNI_ČAS["LD"] = "letni dopust";

// Razvrstitev izmen in barve živijo v izmene.js - en sam vir za vse
// zaslone. Prej je imel ta zaslon svojo, grobo različico (7 skupin),
// Imenik pa polno uradno legendo (22 kratic z natančnimi barvami), zato
// je bila ista izmena tu ena barva in tam druga.
const classify = window.Izmene.skupina;

// Kar se izpiše v celici. "PRISOTEN" je notranja koda, ki jo aplikacija
// zapiše za vodje/administratorje na njihovi enoti; uporabniku pa se mora
// brati kot navadna izmena - "dopoldan" (uporabnikova izrecna zahteva).
// Zapisana koda se NE spremeni: po nji se ravna obračun ur (glej NI_DELO
// v delovni-cas.js), zato bi tiha zamenjava kode spremenila zavihek Plače.
// Kar uporabnik VIDI namesto surove šifre iz baze. Šifre so zgodovinske in
// neenotne ("dopoldan", "NOČNA", "PRISOTEN"), naziv v uradni legendi
// (izmene.js) pa je enoten in pravilno zapisan: "Dopoldne", "Popoldne",
// "Nočna". Šifra v bazi se NE spreminja - ostaja tak zapis, kot je v
// bolnišničnih preglednicah, sicer bi aplikacija v uradni Google Sheet
// pisala drugo besedo, kot je v njem zdaj.
function shiftLabel(sifra){
  if (!sifra) return "Prosto";
  return window.Izmene.naziv(sifra) || sifra;
}

// ---------------------------------------------------------------------
// Izvoz osebnega razporeda v .ics (iCal) - za sinhronizacijo z osebnim
// koledarjem na telefonu (Google Calendar, Apple Calendar …). Deluje
// izključno lokalno v brskalniku (generira in prenese datoteko, brez
// zunanje storitve/računa) - odpre se z gumbom "Uvozi" v koledarski
// aplikaciji uporabnika, ni žive dvosmerne sinhronizacije.
// ---------------------------------------------------------------------
function parsirajUrniObseg(niz){
  // "05.50–14.00" -> { start:"05:50", end:"14:00", cezPolnoc:false }
  if (!niz || !niz.includes("–")) return null;
  const [s, e] = niz.split("–").map(x => x.trim().replace(".", ":"));
  if (!/^\d{2}:\d{2}$/.test(s) || !/^\d{2}:\d{2}$/.test(e)) return null;
  return { start: s, end: e, cezPolnoc: e < s };
}
function icsDatumUra(iso, hhmm){
  return iso.replace(/-/g, "") + "T" + hhmm.replace(":", "") + "00";
}
function dodajDni(iso, n){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function icsPobegni(besedilo){
  return String(besedilo || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
}
function ustvariICS(dnevi, byDate){
  const zdaj = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const dogodki = [];
  dnevi.forEach(dn => {
    const sifra = byDate[dn.datum];
    if (!sifra) return; // prost dan - ni dogodka
    const obseg = parsirajUrniObseg(DELOVNI_ČAS[sifra]);
    const uid = "razpored-pbb-" + dn.datum + "-" + Math.random().toString(36).slice(2, 8) + "@razpored.netlify.app";
    if (obseg) {
      const konecDatum = obseg.cezPolnoc ? dodajDni(dn.datum, 1) : dn.datum;
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART:" + icsDatumUra(dn.datum, obseg.start),
        "DTEND:" + icsDatumUra(konecDatum, obseg.end),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    } else {
      // LD/KPU/DEŽURSTVO/neznana koda - brez natančnih ur, celodnevni dogodek
      dogodki.push(
        "BEGIN:VEVENT",
        "UID:" + uid,
        "DTSTAMP:" + zdaj,
        "DTSTART;VALUE=DATE:" + dn.datum.replace(/-/g, ""),
        "DTEND;VALUE=DATE:" + dodajDni(dn.datum, 1).replace(/-/g, ""),
        "SUMMARY:" + icsPobegni(shiftLabel(sifra)),
        "END:VEVENT"
      );
    }
  });
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Razpored PBB//SL", "CALSCALE:GREGORIAN",
    ...dogodki, "END:VCALENDAR",
  ].join("\r\n");
}
function prenesiICS(vsebina, ime){
  const blob = new Blob([vsebina], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = ime; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function currentMonthStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
// Koledarski izračuni so v datum.js - en sam vir za vse strani. Prej je
// imela vsaka svojo različico istih računov, ponekod v lokalnem času in
// drugod v UTC; izidi so bili enaki, a nič ni jamčilo, da tako ostane.
const monthRange = window.Datum.obseg;
const daysInRange = window.Datum.dnevi;

// Delovnik NZV (vodje/administratorji) – pravilo, ki ga je uporabnik
// večkrat izrecno ponovil in ga prikaz doslej ni upošteval:
//
//   * redni delovnik je od PONEDELJKA DO PETKA;
//   * SOBOTA in NEDELJA sta PROSTI - razen če je tisti dan dežurstvo;
//   * letni dopust (LD) velja samo za delovne dni; vikend sredi dopusta
//     ni "dopust", ampak navaden prost dan;
//   * dežurstvo med tednom se opravlja PO redni prisotnosti (15:30-07:00,
//     glej delovni-cas.js), zato tak dan pomeni oboje: "PRISOTEN +
//     DEŽURSTVO". Vikend dežurstvo traja 07:00-07:00 in redne prisotnosti
//     ob njem ni, zato ostane samo "DEŽURSTVO".
//
// Zakaj je to prikazno pravilo in ne popravek podatkov: razpored
// ima na (employee_id, work_date) en sam zapis, zato prisotnost in
// dežurstvo istega dne ne moreta obstajati kot dve vrstici - ob uvozu
// zadnji prepiše prejšnjega. Ker je "med tednom dežuren" po definiciji
// tudi "med tednom prisoten", je oboje mogoče pravilno izpeljati iz enega
// zapisa, brez spremembe sheme.
//
// Velja SAMO za NZV: oddelčni kader (B/C/C1/D/E1/E2/FLEXI) vikende dela
// normalno in ima prave kode izmen (dopoldan, NOČNA12 …), ki se jih to
// pravilo ne sme dotakniti.
// "datum" je neobvezen; kadar je podan, se poleg sobote/nedelje upošteva
// tudi dela prost PRAZNIK (uporabnikova izrecna dopolnitev pravila).
function nzvPrikaz(sifra, danKratica, jeNzv, datum, enota){
  const vikend = danKratica === "SO" || danKratica === "NE"
    || (datum ? window.Prazniki.jePraznik(datum) : false);
  const jeDezurstvo = classify(sifra) === "dez";
  // Delovišče se pripiše izmeni ("dopoldan C1"), da "Moj razpored" pove ne
  // le KDAJ, ampak tudi KJE. Ob nadomeščanju je to lahko tudi več enot
  // ("E2, E1") - takrat se izpišeta obe, ker oseba tisti dan pokriva obe.
  // Delovišče v oklepaju, na ISTI vrstici kot izmena: "Dopoldne (MO)".
  // Zaposleni mora na prvi pogled vedeti ne le KDAJ, ampak tudi KJE je
  // tisti dan razpisan (uporabnikova zahteva).
  // Enota se pripiše SAMO, kadar oseba tisti dan res dela. Na dopustu,
  // bolniški ali strokovnem izobraževanju ni na nobeni enoti, zato bi
  // "Letni dopust (MO)" bralca zavedel (uporabnikovo pravilo iz
  // Razpredelnice: "ob dopustu se ne izpiše").
  const naDelu = window.Izmene.stanje(sifra) === "delo"
    || window.Izmene.stanje(sifra) === "dezurstvo";
  const formatirajEnotoZaPrikaz = (v) => {
    if (!v && v !== 0) return "";
    if (typeof window !== "undefined" && typeof window.formatirajOddelke === "function") {
      return window.formatirajOddelke(v, null);
    }
    return String(v).split(/[\/,+]/)
      .map(part => {
        const p = String(part).trim();
        if (!p) return "";
        return p.replace(/ZO/gi, "ŽO");
      })
      .filter(Boolean)
      .filter((part, idx, arr) => arr.indexOf(part) === idx)
      .join(", ");
  };
  const zEnoto = (besedilo) => {
    const prikazEnote = formatirajEnotoZaPrikaz(enota);
    return (prikazEnote && naDelu ? besedilo + " (" + prikazEnote + ")" : besedilo);
  };
  // "Dežurstvo" z veliko začetnico kot lastno ime izmene, ne z verzalkami:
  // v uradni legendi je zapisano tako, verzalke pa na zaslonu delujejo kot
  // vpitje (uporabnikova pripomba).
  // Naziv dnevnega dela in dežurstva vzameta iz legende (izmene.js), da
  // se zapis ne razide s preostalo aplikacijo.
  if (jeDezurstvo) {
    const dez = window.Izmene.naziv("DEŽURSTVO").replace(/\s*\(NZV\)\s*$/, "");
    return vikend ? dez : zEnoto(window.Izmene.naziv("dopoldan")) + " + " + dez;
  }
  // shiftLabel PRED dodajanjem enote: brez tega bi se enota pripela surovi
  // šifri in uporabnik bi videl "PRISOTEN C1" namesto "Dopoldne C1".
  if (!jeNzv || !vikend) return sifra ? zEnoto(shiftLabel(sifra)) : sifra;
  return ""; // NZV vikend brez dežurstva: prosto (tudi sredi letnega dopusta)
}

// nzvPrikaz vrne ŽE pripravljeno besedilo za zaslon ("Dopoldne (MO) +
// Dežurstvo"), ne šifre izmene. Če bi ga pognali še skozi shiftLabel, bi
// ga legenda prebrala kot šifro (vnos() pobriše presledke in pike, zato
// se "dopoldne(mo)+dežurstvo" ujame z /^dopoldne/) in ga skrčila nazaj na
// golo "Dopoldne" - enota in dežurstvo bi tiho izginila. Prazno besedilo
// pomeni prost dan; "Prosto" tu, ker ga nzvPrikaz namenoma ne izpiše sam
// (pri NZV vikendu vrne "" tudi sredi letnega dopusta).
function prikazNaZaslonu(prikaz){
  return prikaz || "Prosto";
}

// Zdravniki posameznega dne, pripravljeni za izpis. Uradni dokument ima
// dva stolpca in isti dan sta lahko zasedena z različnima zdravnikoma, zato
// se izpišeta oba, vsak s svojo kratico ("DEŽ" = Dežurstvo ZDR, "URG" =
// Urgenca ZDR). Dežurstvo gre prvo, ker je za dežurno medicinsko sestro
// najbolj neposredno relevantno.
function zdravnikiZaDan(zapis){
  if (!zapis) return [];
  // SAMO dežurni zdravnik. Urgentni (URG) se tu NE izpisuje: dežurna
  // medicinska sestra ga ne potrebuje, dve vrstici pod izmeno pa sta na
  // telefonu odveč (uporabnikova zahteva). Podatek se še naprej uvaža iz
  // uradnega PDF-ja in je viden v Razpored -> "Dežurstva - urgenca in NZV".
  return zapis.dezurstvo ? [{ oznaka: "DEŽ", ime: zapis.dezurstvo }] : [];
}

// Zakaj imena dežurnega zdravnika ni - kot besedilo, ki ga vidi uporabnik.
// Vrne null, kadar opozorila NI treba prikazati.
//
// Brez tega je odpoved TIHA: če tabele dezurni_zdravniki ni (shema še ni
// pognana) ali za mesec ni naloženega PDF-ja, poizvedba ne vrne nič in
// poleg DEŽURSTVA se preprosto ne izpiše nič - uporabnik nima načina
// izvedeti, zakaj. Isti razred napake kot prazna NZV mreža ob dvoumnem
// PostgREST joinu.
//
// Opozorilo se prikaže SAMO, kadar ima oseba ta mesec res kakšno
// dežurstvo - sicer bi ga videli vsi, tudi tisti, ki jih zdravniki sploh
// ne zadevajo.
function zdravnikiOpozoriloBesedilo(imamDezurstvo, stanje){
  if (!imamDezurstvo) return null;
  if (stanje === "nalagam" || stanje === "ok") return null;
  if (stanje === "ni-tabele") {
    return "Imena dežurnega zdravnika še ni mogoče prikazati: v bazi manjka tabela dežurnih zdravnikov. " +
      "Administrator naj v Supabase (SQL Editor) požene supabase/schema.sql - razdelek 32.";
  }
  return "Za ta mesec ni naloženega razporeda dežurnih zdravnikov. Administrator ga naloži z ikono 📥 " +
    "zgoraj desno → »🩺 Naloži dežurstvo zdravnikov (PDF)« - uradni mesečni dokument " +
    "»Razporeditev zaposlenih v UA in DEŽ«.";
}

function MyScheduleView({ userId, month, jeNzv }){
  const [entries, setEntries] = useState(null);
  const [dopustiLD, setDopustiLD] = useState([]); // datumi (ISO), ko je oseba na LD po odsotnosti
  const { startISO, endISO } = monthRange(month);
  const days = useMemo(() => daysInRange(startISO, endISO), [startISO, endISO]);

  useEffect(() => {
    let cancelled = false;
    setEntries(null);
    // Poleg izmene potrebujemo tudi DELOVIŠČE, da "Moj razpored" pove ne
    // le KDAJ, ampak tudi KJE ("dopoldan C1"). Pri FLEXI je pravi oddelek
    // v pokriva_oddelek (department_code je takrat "FLEXI"). Ta stolpec v
    // starejših bazah morda še ne obstaja, zato ob napaki poizvedbo
    // ponovimo brez njega - prikaz izmene ne sme pasti zaradi delovišča.
    client.from("razpored").select("work_date, shift_code, department_code, pokriva_oddelek")
      .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (!error) { setEntries(data || []); return; }
        client.from("razpored").select("work_date, shift_code, department_code")
          .eq("employee_id", userId).gte("work_date", startISO).lte("work_date", endISO)
          .then(({ data: d2 }) => { if (!cancelled) setEntries(d2 || []); });
      });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  // LD (letni dopust) je za marsikoga vpisan samo v Želje → Razpredelnica
  // (odsotnosti), ne v razpored (za NZV/vodje objavljen razpored
  // ne piše po osebi kot pri SMS oddelkih, glej nalozizPodatkeNzv zgoraj) -
  // brez tega je "Moj razpored" za te osebe kazal dopust kot navaden prost
  // dan. Dopolnimo SAMO dneve, ki v razpored še nimajo vrednosti
  // (glej byDate spodaj) - objavljene izmene se nikoli ne prepišejo.
  useEffect(() => {
    let cancelled = false;
    setDopustiLD([]);
    client.from("profili").select("full_name").eq("id", userId).maybeSingle().then(({ data: profil }) => {
      if (cancelled || !profil) return Promise.resolve();
      return client.from("odsotnosti").select("full_name, work_date")
        .eq("kind", "ld").gte("work_date", startISO).lte("work_date", endISO)
        .then(({ data }) => {
          if (cancelled) return;
          setDopustiLD((data || []).filter(d => imenaSeUjemataNzv(d.full_name, profil.full_name)).map(d => d.work_date));
        });
    });
    return () => { cancelled = true; };
  }, [userId, startISO, endISO]);

  // Dežurni zdravniki (dezurni_zdravniki, glej uvoziZdravnike) - samo za prikaz
  // poleg DEŽURSTVA, niso vezani na osebo/employee_id (zdravniki nimajo
  // profila). Uradni dokument ima DVA ločena stolpca - "Urgenca ZDR" in
  // "Dežurstvo ZDR" - in isti dan sta lahko zasedena z RAZLIČNIMA
  // zdravnikoma. Prej se je izpisal samo eden (prednost "Dežurstvo ZDR"),
  // kar je za nekoga, ki je tisto noč dežuren, premalo: sodeluje z obema.
  // Zato hranimo oba, ključ je datum -> { dezurstvo, urgenca }.
  const [zdravnikiPoDatumu, setZdravnikiPoDatumu] = useState({});
  // Če te poizvedbe ni mogoče izvesti (tabela še ne obstaja) ali za mesec
  // ni podatkov, se je to doslej TIHO požrlo in ime zdravnika se preprosto
  // ni izpisalo - uporabnik ni imel načina izvedeti, zakaj. Stanje zato
  // hranimo in ga spodaj pojasnimo (ista past kot pri prazni NZV mreži).
  const [zdravnikiStanje, setZdravnikiStanje] = useState("nalagam"); // "nalagam" | "ok" | "ni-tabele" | "prazno"
  useEffect(() => {
    let cancelled = false;
    setZdravnikiPoDatumu({});
    setZdravnikiStanje("nalagam");
    client.from("dezurni_zdravniki").select("work_date, kind, full_name")
      .gte("work_date", startISO).lte("work_date", endISO)
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error) {
          // 42P01 = relacija ne obstaja (shema še ni pognana).
          const manjkaTabela = error.code === "42P01" || /does not exist|schema cache/i.test(error.message || "");
          setZdravnikiStanje(manjkaTabela ? "ni-tabele" : "prazno");
          return;
        }
        const m = {};
        (data || []).forEach(r => {
          if (!r.full_name) return;
          if (!m[r.work_date]) m[r.work_date] = {};
          m[r.work_date][r.kind] = r.full_name;
        });
        setZdravnikiPoDatumu(m);
        setZdravnikiStanje(Object.keys(m).length ? "ok" : "prazno");
      });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  // Stalna zasedba nosilca enote: za vodje se dnevni razpored ne objavlja,
  // zato je "Moj razpored" tem osebam kazal prazne delovne dneve - isti
  // manjko kot v NZV mreži in v Imenik -> Razpredelnici. Pravilo je v
  // nzv-zasedba.js (en sam vir); tu preberemo samo SVOJ zapis nosilca.
  const [mojNosilec, setMojNosilec] = useState(null);
  // Lastno ime potrebuje tudi izračun enote po dnevih (spodaj), zato ga
  // shranimo, namesto da bi profil brali dvakrat.
  const [mojeIme, setMojeIme] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setMojNosilec(null); setMojeIme(null);
    if (!jeNzv) return;
    client.from("profili").select("full_name").eq("id", userId).maybeSingle().then(({ data: profil }) => {
      if (cancelled || !profil) return;
      setMojeIme(profil.full_name);
      return client.from("nosilci_oddelkov").select("full_name, enote, odsotnost_tip, odsotnost_do")
        .then(({ data }) => {
          if (cancelled) return;
          const moj = (data || []).find(n => n.enote && imenaSeUjemataNzv(n.full_name, profil.full_name));
          setMojNosilec(moj || null);
        });
    });
    return () => { cancelled = true; };
  }, [userId, jeNzv]);

  // Enota po dnevih za NZV: isti izračun kot v Imeniku -> Razpredelnica in
  // v "Po oddelkih" (nzv-zasedba.js). Zato "Moj razpored" ob nadomeščanju
  // pokaže enoto, na kateri oseba TA DAN res je - ne stalne.
  const [enotaNaDan, setEnotaNaDan] = useState({});
  useEffect(() => {
    let cancelled = false;
    setEnotaNaDan({});
    if (!jeNzv || !mojeIme) return;
    Promise.all([
      client.from("nosilci_oddelkov").select("full_name, enote, odsotnost_tip, odsotnost_do"),
      client.from("nadomescanja").select("*").then(r => r, () => ({ data: [] })),
      client.from("nzv_nastavitve").select("*").then(r => r, () => ({ data: [] })),
      client.from("odsotnosti").select("full_name, work_date, kind").gte("work_date", startISO).lte("work_date", endISO),
    ]).then(([{ data: nosilci }, { data: pari }, { data: nast }, { data: odsotnosti }]) => {
      if (cancelled) return;
      const kljucIme = window.Imena.kljuc;
      const saNast = window.NzvZasedba.saNastavitveIz(nast || []);
      const poImenu = {};
      (nosilci || []).forEach(v => { poImenu[kljucIme(v.full_name)] = v; });
      const odsotenNa = {};
      (odsotnosti || []).forEach(r => { odsotenNa[kljucIme(r.full_name) + "|" + r.work_date] = true; });
      const jeOdsoten = (ime, datum) => {
        const v = poImenu[kljucIme(ime)];
        if (v && window.NzvZasedba.trajnoOdsoten(v, datum)) return true;
        return !!odsotenNa[kljucIme(ime) + "|" + datum];
      };
      const out = {};
      const mojKljuc = kljucIme(mojeIme);
      days.forEach(dn => {
        if (window.Prazniki.jeDelaProstDan(dn.datum)) return;
        const vrstice = window.NzvZasedba.razporedDneva({
          nosilci: nosilci || [],
          pari: pari || [],
          kljuc: kljucIme,
          jeOdsoten: ime => jeOdsoten(ime, dn.datum),
          saKoda: window.NzvZasedba.saStolpec(dn.datum, saNast),
          veljavne: window.NzvZasedba.KODE_STOLPCEV,
        });
        const moj = vrstice.find(v => kljucIme(v.nosilec.full_name) === mojKljuc);
        if (moj && moj.enote) out[dn.datum] = moj.enote;
      });
      setEnotaNaDan(out);
    });
    return () => { cancelled = true; };
  }, [jeNzv, mojeIme, startISO, endISO, days]);

  // Delovišče za en dan. Trije viri po vrsti, od najbolj do najmanj
  // natančnega:
  //   1. izračun po dnevih zgoraj (NZV, upošteva nadomeščanja),
  //   2. objavljen vnos - a SAMO, če je to res oddelek: DEZ/NEDEZ/NZV/
  //      FLEXI so pripadnost skupini, ne kraj dela (glej nzv-zasedba.js).
  //      Prav zato je na dežurni dan pisalo "Dopoldne (DEZ)" - dopoldne
  //      oseba dela na svoji enoti, dežurstvo je šele zvečer.
  //   3. lastna stalna enota iz nosilci_oddelkov.
  const enotaZaDan = useMemo(() => {
    const jeDelovisce = window.NzvZasedba.jeDelovisce;
    const izVnosa = {};
    (entries || []).forEach(e => {
      const pokriva = (e.pokriva_oddelek || "").trim();
      const oddelek = (e.department_code || "").trim();
      const kje = jeDelovisce(pokriva) ? pokriva : (jeDelovisce(oddelek) ? oddelek : "");
      if (kje) izVnosa[e.work_date] = kje;
    });
    const lastna = (mojNosilec && mojNosilec.enote) || "";
    return (datum) => {
      const vrednost = enotaNaDan[datum] || izVnosa[datum] || lastna;
      if (!vrednost) return "";
      // "lastna" se preda naprej, da je vrstni red splošen: lastna enota
      // vedno prva, prevzeta za njo - ne le pri paru MO/ŽO.
      return window.normalizirajNazivOddelka(vrednost, lastna);
    };
  }, [entries, enotaNaDan, mojNosilec]);

  const byDate = useMemo(() => {
    const m = {};
    (entries || []).forEach(e => { m[e.work_date] = e.shift_code; });
    dopustiLD.forEach(datum => { if (!m[datum]) m[datum] = "LD"; });
    // Izpeljana prisotnost zapolni samo prazne delovne dneve - objavljena
    // izmena, dežurstvo in dopust imajo vedno prednost.
    window.NzvZasedba.stalnaZasedba(mojNosilec, days.map(dn => dn.datum), d => !!m[d])
      .forEach(x => { m[x.datum] = x.sifra; });
    return m;
  }, [entries, dopustiLD, mojNosilec, days]);

  const iso = todayISO();
  const todayDan = (days.find(d => d.datum === iso) || {}).dan;
  const todaySifra = byDate[iso];
  const todayPrikaz = nzvPrikaz(todaySifra, todayDan, jeNzv, iso, enotaZaDan(iso));
  const todayCls = classify(todayPrikaz === "" ? "" : todaySifra);

  const tedni = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach(dn => {
      if (dn.dan === "PO" || !cur){ cur = []; out.push(cur); }
      cur.push(dn);
    });
    return out;
  }, [days]);

  // Ime dežurnega zdravnika se izpiše samo ob dnevih z dežurstvom. Če ima
  // uporabnik ta mesec dežurstvo, imena pa ni nikjer, je to okvara, ki jo
  // je treba POJASNITI - drugače izgleda, kot da aplikacija ne dela.
  const imamDezurstvo = useMemo(
    () => days.some(dn => classify(byDate[dn.datum]) === "dez"),
    [days, byDate]
  );
  const zdravnikiOpozorilo = zdravnikiOpozoriloBesedilo(imamDezurstvo, zdravnikiStanje);

  if (entries === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  return (
    <div id="printMy">
      {startISO <= iso && iso <= endISO && (
        <div className="todayCard">
          <div className="lbl">Danes · {window.Datum.slo(iso)}</div>
          <div className="shift">
            {/* Ista barva kot v vrstici tega dne spodaj - iz uradne
                legende (izmene.js), ne iz grobe skupine. */}
            <span className="dot" style={{background: todayPrikaz === "" || !todaySifra
              ? window.Izmene.STANJE_BARVA.prosto.barva : window.Izmene.barva(todaySifra)}}></span>
            <div>
              <div className="shiftName">{prikazNaZaslonu(todayPrikaz)}</div>
              <div className="shiftTime">{DELOVNI_ČAS[todaySifra] || ""}</div>
              {todayCls === "dez" && zdravnikiZaDan(zdravnikiPoDatumu[iso]).map(z => (
                <div key={z.oznaka} className="shiftTime">🩺 {z.oznaka}: {z.ime}</div>
              ))}
            </div>
          </div>
        </div>
      )}

      {zdravnikiOpozorilo && (
        <div className="warnBox">🩺 {zdravnikiOpozorilo}</div>
      )}

      <div className="weeksGrid">
        {tedni.map((teden, i) => (
          <div key={i}>
            <div className="weekLabel">Teden {i+1}</div>
            {teden.map(dn => {
              const sifra = byDate[dn.datum];
              // Barva se vedno računa iz IZVIRNE kode (npr. "PRISOTEN +
              // DEŽURSTVO" se mora obarvati kot dežurstvo, ne kot prisotnost),
              // besedilo pa iz pravila NZV delovnika.
              const prikaz = nzvPrikaz(sifra, dn.dan, jeNzv, dn.datum, enotaZaDan(dn.datum));
              const cls = classify(prikaz === "" ? "" : sifra);
              // Barva iz URADNE legende (izmene.js), ista kot v Imenik →
              // Razpredelnica in v "Po oddelkih". Prej je bila tu ena od
              // sedmih grobih skupin, zato je bila npr. nočna 12 v enem
              // pogledu vijolična in v drugem temno modra.
              const jePrazno = !sifra || prikaz === "" || window.Izmene.jeProst(sifra);
              const barvaDneva = jePrazno ? null : window.Izmene.barva(sifra);
              const isToday = dn.datum === iso;
              const isWeekend = dn.dan === "SO" || dn.dan === "NE";
              const d = new Date(dn.datum + "T00:00:00");
              return (
                <div key={dn.datum} className={"dayRow" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "")}>
                  <div className="dnum">
                    <div className="n">{d.getDate()}</div>
                    <div className="d">{dn.dan}</div>
                  </div>
                  {/* Dežurstvo je edina izmena, ki se izriše POLNO zapolnjeno
                      (bela pisava na opekasti podlagi) - tako se na prvi
                      pogled loči od letnega dopusta, ki je prav tako rdečkast,
                      a le rahlo obarvan. Ostale izmene ostanejo lahke
                      (15% podlaga + obroba v svoji barvi). */}
                  <div className={"chip" + (jePrazno ? " off" : "") + (cls==="dez" ? " polna" : "")}
                    style={{
                      background: cls==="dez" ? barvaDneva : (jePrazno ? "transparent" : barvaDneva + "26"),
                      border: "1px solid " + (jePrazno ? "var(--line)" : barvaDneva),
                      color: cls==="dez" ? window.Izmene.barvaBesedila(barvaDneva) : undefined,
                    }}>
                    <span className="dot" style={{background: cls==="dez" ? "#fff" : (barvaDneva || "var(--off)")}}></span>
                    <span style={{minWidth:0, overflow:"hidden"}}>
                      <span className="txt">{prikazNaZaslonu(prikaz)}</span>
                      {cls === "dez" && zdravnikiZaDan(zdravnikiPoDatumu[dn.datum]).map(z => (
                        <span key={z.oznaka} className="txt" style={{display:"block", fontSize:11, fontWeight:400, opacity:0.9, lineHeight:1.4}}>
                          🩺 {z.oznaka}: {z.ime}
                        </span>
                      ))}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// Skupen "podpisni" blok pod tabelo na "Po oddelkih" - po vzoru uradnih
// predlog (Datum objave + Zadnja sprememba + Pripravil/-a + Pregledal in
// odobril, vsi RESNIČNI, ne pogojno prikazani). "Datum objave"/"Pripravil"
// izhajata iz created_at/created_by NAJSTAREJŠEGA zapisa v mesecu (kdo je
// razpored prvič objavil); "Zadnja sprememba" iz max(updated_at); oboje
// samodejno vzdržuje schedule_entries_touch() sprožilec (schema.sql sekcija
// 25) - velja za VSE poti pisanja (generator v admin.html, ta uvoz), ne
// samo za novo kodo. "Pregledal in odobril" = koordinator (profili.
// is_koordinator). Naziv za podpis (job_title) je admin-urejljiv v Imeniku.
function RazporedPodpisi({ entries }){
  const [koordinator, setKoordinator] = useState(null);
  const [pripravil, setPripravil] = useState(null);

  useEffect(() => {
    let cancelled = false;
    client.from("profili").select("full_name, job_title").eq("is_koordinator", true).limit(1).maybeSingle()
      .then(({ data }) => { if (!cancelled) setKoordinator(data || null); });
    return () => { cancelled = true; };
  }, []);

  const objava = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((min, e) => (e.created_at && (!min || e.created_at < min.created_at)) ? e : min, null);
  }, [entries]);

  const zadnja = useMemo(() => {
    if (!entries || !entries.length) return null;
    return entries.reduce((max, e) => (e.updated_at && (!max || e.updated_at > max)) ? e.updated_at : max, null);
  }, [entries]);

  const pripravilId = objava ? objava.created_by : null;
  useEffect(() => {
    let cancelled = false;
    if (!pripravilId) { setPripravil(null); return; }
    client.from("profili").select("full_name, job_title").eq("id", pripravilId).maybeSingle()
      .then(({ data }) => { if (!cancelled) setPripravil(data || null); });
    return () => { cancelled = true; };
  }, [pripravilId]);

  const oblikujDatum = (iso) => iso
    ? window.Datum.sloSCasom(iso)
    : "ni podatka";

  return (
    <div className="card" style={{marginTop:10, fontSize:13}}>
      <p style={{margin:"0 0 6px"}}><b>Datum objave razporeda:</b> {oblikujDatum(objava && objava.created_at)}</p>
      <p style={{margin:"0 0 6px"}}><b>Zadnja sprememba v razporedu:</b> {oblikujDatum(zadnja)}</p>
      {pripravil && (
        <p style={{margin:"0 0 6px"}}><b>Pripravil/-a:</b> {pripravil.full_name}{pripravil.job_title ? ", " + pripravil.job_title : ""}</p>
      )}
      {koordinator && (
        <p style={{margin:0}}><b>Pregledal in odobril:</b> {koordinator.full_name}{koordinator.job_title ? ", " + koordinator.job_title : ""}</p>
      )}
    </div>
  );
}

// "Menjave v tem mesecu" POD mesečnim razporedom (samo admin) - doslej so
// bile menjave vidne izključno na ločeni strani "Menjava", ne pa ob
// razporedu, ki ga koordinator dejansko pregleduje. Ista poizvedba kot
// MenjaveMeseca v obrazec.html (obrazci, vrsta "menjava_sluzbe", brez
// osnutkov), le da je filtrirana na PRIKAZANI mesec (ne na tekoči).
//
// POMEMBNO: ko koordinator menjavo potrdi, se izmeni v razpored
// zamenjata SAMODEJNO (obrazec_potrdi_koordinator, schema.sql sekcija 22) -
// ta seznam je torej pregled/revizija ("kdo je zamenjal s kom"), ne korak,
// ki bi ga bilo treba ročno prenesti v razpored. Zato je tudi tik pod
// tabelo: razpored zgoraj že vsebuje učinek teh menjav.
const MENJAVA_STATUS_NAZIV = {
  caka_sodelavca: "čaka sodelavca",
  caka_vodjo: "čaka vodjo",
  caka_koordinatorja: "čaka koordinatorja",
  zakljucen: "potrjeno",
  zavrnjen: "zavrnjeno",
  preklican: "preklicano",
};
function menjavaPillRazred(status){
  if (status === "zakljucen") return "pill ok";
  if (status === "zavrnjen" || status === "preklican") return "pill danger";
  return "pill warn"; // vse "caka_*" stopnje
}
function MenjaveVMesecu({ month }){
  const [vrstice, setVrstice] = useState(null);
  const { startISO, endISO } = monthRange(month);

  useEffect(() => {
    let cancelled = false;
    setVrstice(null);
    client.from("obrazci")
      .select("id, status, je_dezurstvo, polja, vlagatelj:profili!obrazci_vlagatelj_id_fkey(full_name), sodelavec:profili!obrazci_sodelavec_id_fkey(full_name)")
      .eq("vrsta", "menjava_sluzbe").neq("status", "osnutek")
      .filter("polja->>datum_a", "gte", startISO).filter("polja->>datum_a", "lte", endISO)
      .order("ustvarjen", { ascending: false })
      .then(({ data }) => { if (!cancelled) setVrstice(data || []); });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  const dan = (iso) => window.Datum.slo(iso) || "–";

  return (
    <div className="no-print" style={{marginTop:24}}>
      <h2 className="section">Menjave v tem mesecu</h2>
      <p className="hint" style={{marginTop:0}}>
        Potrjena menjava je v razporedu zgoraj že upoštevana – izmeni se zamenjata samodejno ob potrditvi koordinatorja.
      </p>
      {vrstice === null && <p className="sub">Nalagam …</p>}
      {vrstice !== null && vrstice.length === 0 && <p className="sub">V tem mesecu ni nobene menjave.</p>}
      {vrstice !== null && vrstice.length > 0 && (
        <div className="card" style={{padding:0}}>
          {vrstice.map(r => {
            const p = r.polja || {};
            return (
              <div key={r.id} style={{display:"flex", alignItems:"center", justifyContent:"space-between",
                gap:12, padding:"10px 14px", borderBottom:"1px solid var(--line)"}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700, fontSize:14}}>
                    {r.vlagatelj ? r.vlagatelj.full_name : "?"} ↔ {r.sodelavec ? r.sodelavec.full_name : "?"}
                    {r.je_dezurstvo && <span className="pill muted" style={{marginLeft:6}}>dežurstvo</span>}
                  </div>
                  <div style={{fontSize:12, color:"var(--muted)", marginTop:2}}>
                    {dan(p.datum_a)} ⇄ {dan(p.datum_b)}
                  </div>
                </div>
                <span className={menjavaPillRazred(r.status)}>{MENJAVA_STATUS_NAZIV[r.status] || r.status}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------
// Razpredelnica stanja (PRENESENA iz Imenika, avgust 2026).
//
// Uporabnikova zahteva: razpredelnica sodi k Razporedu, ne k Imeniku -
// tam je bila najdena po naključju, ker se je iskalo ljudi, ne razporeda.
// V Imeniku je zato ni več; ostal je Seznam, Parafe in Stanje dopusta.
//
// Spodnje konstante so prišle z njo. Vse so tanki ovoji nad skupnimi
// moduli (izmene.js, imena.js), da ostane en sam vir barv, kratic in
// pravil ujemanja imen za VSE zaslone.
// ---------------------------------------------------------------------
const IZMENA_KRATICE = window.Izmene.KRATICE;
const STANJE_BARVA = window.Izmene.STANJE_BARVA;
const vnosPoKratici = window.Izmene.poKratici;
const izmenaKratica = window.Izmene.kratica;
const izmenaBarva = window.Izmene.barva;
const stanjeIzKode = window.Izmene.stanje;
const imenaSeUjemataBrezStresic = window.Imena.seUjemata;
// "MAVRI TRATNIK MAGDALENA" -> "Mavri": v ozkem stolpcu pregleda
// nadomeščanj zadošča priimek, polno ime je v opisu ob kazalcu.
const kratkoIme = window.Imena.kratkoIme;
// odsotnosti.kind -> kratica iz uradne legende. "omejitev" (rumena
// želja) NI odsotnost - oseba je na delu, le z omejitvijo - zato null.
const KIND_KRATICA = { ld: "LD", bs: "BS", sti: "STI", omejitev: null };

function NadomescanjaPregled(){
  const [vrstice, setVrstice] = useState(null);
  const [odprto, setOdprto] = useState(false);

  useEffect(() => {
    let cancelled = false;
    Promise.all([
      client.from("nosilci_oddelkov").select("full_name, enote").order("full_name"),
      client.from("nadomescanja").select("*"),
      client.from("profili").select("full_name"),
    ]).then(([{ data: nosilci }, { data: pary }, { data: osebe }]) => {
      if (cancelled) return;
      const p = [...(pary || [])].sort((a, b) => (a.prednost || 1) - (b.prednost || 1));
      // Prikažemo SAMO vrstice, ki se povežejo z resnično osebo v
      // aplikaciji. V bazi so se namreč znašle podvojene vrstice s
      // pokvarjenim zapisom imena ("ALUKIÄ† DINO" namesto "ALUKIĆ DINO" -
      // UTF-8, prebran kot Latin-1). Te se z nikomer ne ujamejo in so bile
      // v pregledu videti kot prazne vrstice. Očistijo se s skripto
      // supabase/nzv-pocisti-pokvarjena-imena.sql; ta filter pa poskrbi,
      // da tak zapis nikoli ne pride na zaslon.
      const jeResnicna = ime => (osebe || []).some(o => imenaSeUjemataBrezStresic(o.full_name, ime));
      // Imena primerjamo prek skupnega modula in ne dobesedno - viri jih
      // pišejo z različnimi strešicami in v drugem vrstnem redu.
      const ujem = (a, b) => imenaSeUjemataBrezStresic(a, b);
      setVrstice((nosilci || []).filter(n => jeResnicna(n.full_name)).map(n => ({
        oseba: n.full_name,
        enote: n.enote || "",
        mene: p.filter(v => ujem(v.nosilec, n.full_name)).map(v => kratkoIme(v.nadomesca)),
        pokrivam: p.filter(v => ujem(v.nadomesca, n.full_name))
          .map(v => kratkoIme(v.nosilec) + (v.enota ? " (" + v.enota + ")" : "")),
      })));
    });
    return () => { cancelled = true; };
  }, []);

  if (!vrstice || !vrstice.length) return null;
  return (
    <div className="card" style={{marginTop:16, padding:"10px 12px"}}>
      <button type="button" onClick={() => setOdprto(o => !o)} aria-expanded={odprto}
        style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none",
          padding:0, cursor:"pointer", font:"inherit", color:"inherit"}}>
        <span className="infoToggle" aria-hidden="true">i</span>
        <span style={{fontSize:12, fontWeight:700}}>Pregled nadomeščanj</span>
        <span style={{fontSize:11, color:"var(--muted)"}}>{odprto ? "skrij" : "pokaži"}</span>
      </button>
      {odprto && (
        <div className="infoPanel">
          <p className="hint" style={{marginTop:0}}>
            Kdo koga nadomešča ob odsotnosti (letni dopust, bolniška). Puščica pomeni vrstni red: kdo je prvi na
            vrsti in kdo prevzame, če je odsoten tudi prvi. V oklepaju je enota, ki jo nadomeščevalec dejansko
            prevzame – ta ni nujno cel nabor enot odsotnega.
          </p>
          <div className="tableScroller">
            <table className="wardTable">
              <thead>
                <tr>
                  <th className="name">Oseba</th>
                  <th>Enote</th>
                  <th>Nadomeščajo mene</th>
                  <th>Pokrivam</th>
                </tr>
              </thead>
              <tbody>
                {vrstice.map(v => (
                  <tr key={v.oseba}>
                    <td className="name">{v.oseba}</td>
                    <td>{v.enote}</td>
                    <td>{v.mene.length ? v.mene.join(" → ") : <span style={{color:"var(--muted)"}}>– ni zapisano –</span>}</td>
                    <td>{v.pokrivam.length ? v.pokrivam.join(", ") : <span style={{color:"var(--muted)"}}>–</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// Dežurstvo - cel obrazec po uradnem mesečnem dokumentu "Razporeditev
// zaposlenih v urgentno ambulanto in neprekinjeno zdravstveno varstvo".
//
// Trije stolpci, kot jih ima uradni PDF:
//   Urgenca ZDR              zdravnik (dezurni_zdravniki, kind "urgenca")
//   Dežurstvo ZDR            zdravnik (dezurni_zdravniki, kind "dezurstvo")
//   Dežurstvo dipl. m.s./zn. negovalni kader
//
// Negovalni kader se bere iz OBJAVLJENEGA razporeda (razpored,
// izmena DEŽURSTVO), ne iz uvoženega PDF-ja: potrjena menjava dežurstva
// izmeni v razporedu zamenja samodejno (obrazec_potrdi_koordinator,
// schema.sql sekcija 22), zato je razpored edini vir, ki menjave že
// vsebuje. Uradni PDF (dezurni_zdravniki, kind "sestra") se uporabi samo kot
// rezerva za dneve, za katere razpored še ni objavljen - da mesec ni
// prazen, dokler ga koordinator ne objavi.
//
// Zdravnikov se ne da zamenjati (nimajo profila/računa v aplikaciji),
// zato sta prva dva stolpca samo prikaz iz uvoženega dokumenta.
//
// Pogled je NAMENOMA samo bralen (uporabnikova odločitev): generiranje in
// popravljanje dežurstev ostane v Generatorju, da se ne ustvari drugo
// mesto, kjer se razpored spreminja.
function DezurstvoPregled({ month, myId }){
  const [dnevi, setDnevi] = useState(null);
  const [napaka, setNapaka] = useState(null);
  const { startISO, endISO } = monthRange(month);
  const tabelaRef = useRef();

  useEffect(() => {
    let cancelled = false;
    setDnevi(null); setNapaka(null);
    Promise.all([
      // "profili!employee_id(...)": razpored ima tri tuje ključe na
      // profili, zato bi nedoločen vgnezden zapis PostgREST zavrnil kot
      // dvoumen (glej preveri-vgnezdeni-join.mjs).
      RazporedAuth.vseStrani((od, doV) =>
        client.from("razpored")
          .select("employee_id, work_date, shift_code, profili!employee_id(full_name)")
          .gte("work_date", startISO).lte("work_date", endISO).range(od, doV)
      ).then(data => ({ data })),
      client.from("dezurni_zdravniki").select("work_date, kind, full_name")
        .gte("work_date", startISO).lte("work_date", endISO)
        .then(r => (r.error ? { data: [], error: r.error } : r), () => ({ data: [], error: null })),
      // Potrjene menjave - samo za oznako ↔ ob imenu. Sama izmena je v
      // razporedu že zamenjana, to je le vidno opozorilo, da se je menjava
      // zgodila (isto kot v Razpredelnici).
      client.from("menjave_javno").select("vlagatelj_id, sodelavec_id, datum_a, datum_b")
        .or(`and(datum_a.gte.${startISO},datum_a.lte.${endISO}),and(datum_b.gte.${startISO},datum_b.lte.${endISO})`)
        .then(r => (r.error ? { data: [] } : r), () => ({ data: [] })),
    ]).then(([{ data: vpisi, error: napakaVpisov }, { data: zdravniki, error: napakaZdravnikov }, { data: menjave }]) => {
      if (cancelled) return;
      if (napakaVpisov) { setNapaka(napakaVpisov.message || String(napakaVpisov)); setDnevi([]); return; }

      const sestraIzRazporeda = {};   // datum -> [{ime, id}]
      const menjaniDnevi = new Set();
      (menjave || []).forEach(o => {
        if (o.vlagatelj_id && o.datum_a) menjaniDnevi.add(o.vlagatelj_id + "|" + o.datum_a);
        if (o.sodelavec_id && o.datum_b) menjaniDnevi.add(o.sodelavec_id + "|" + o.datum_b);
      });
      (vpisi || []).forEach(v => {
        if (window.Izmene.stanje(v.shift_code) !== "dezurstvo") return;
        if (!v.profili) return;
        (sestraIzRazporeda[v.work_date] = sestraIzRazporeda[v.work_date] || []).push({
          ime: v.profili.full_name,
          id: v.employee_id,
          zamenjano: menjaniDnevi.has(v.employee_id + "|" + v.work_date),
        });
      });

      const zdrPoDnevu = {};
      (zdravniki || []).forEach(z => {
        (zdrPoDnevu[z.work_date] = zdrPoDnevu[z.work_date] || {})[z.kind] = z.full_name;
      });
      if (napakaZdravnikov) {
        const manjkaTabela = napakaZdravnikov.code === "42P01"
          || /does not exist|schema cache/i.test(napakaZdravnikov.message || "");
        setNapaka(manjkaTabela
          ? "Zdravnikov ni: tabela dezurni_zdravniki še ne obstaja (poženi supabase/schema.sql, razdelek 32)."
          : "Zdravnikov ni bilo mogoče prebrati: " + (napakaZdravnikov.message || ""));
      }

      setDnevi(daysInRange(startISO, endISO).map(dn => ({
        datum: dn.datum,
        dan: dn.dan,
        urgenca: (zdrPoDnevu[dn.datum] || {}).urgenca || "",
        dezurstvoZdr: (zdrPoDnevu[dn.datum] || {}).dezurstvo || "",
        // Objavljen razpored ima prednost; uradni PDF je rezerva.
        sestre: sestraIzRazporeda[dn.datum]
          || ((zdrPoDnevu[dn.datum] || {}).sestra
              ? [{ ime: (zdrPoDnevu[dn.datum] || {}).sestra, id: null, zamenjano: false, izPdf: true }]
              : []),
      })));
    });
    return () => { cancelled = true; };
  }, [startISO, endISO]);

  if (dnevi === null) return <p className="sub" style={{marginTop:16}}>Nalagam …</p>;

  const prazno = dnevi.every(d => !d.urgenca && !d.dezurstvoZdr && !d.sestre.length);

  return (
    <div className="wardPrintArea">
      <p className="sub no-print" style={{marginTop:0}}>
        Razporeditev zaposlenih v urgentno ambulanto in neprekinjeno zdravstveno varstvo ·{" "}
        {window.Datum.mesecLeto(month)}
      </p>
      {napaka && <p className="hint no-print" style={{color:"var(--danger)"}}>{napaka}</p>}
      {prazno && !napaka && (
        <p className="hint no-print">
          Za ta mesec ni podatkov. Dežurstva negovalnega kadra se prikažejo, ko je razpored objavljen
          (Generator → NZV → Dežurstva), zdravniki pa, ko admin naloži uradni PDF (⬇ → »Naloži dežurstvo zdravnikov«).
        </p>
      )}
      <div className="wardScroller" ref={tabelaRef}>
        <table className="wardTable wardTableT dezTabela">
          <thead>
            <tr>
              <th className="name">Dan</th>
              {/* Na telefonu krajše glave, sicer tretji stolpec potisne
                  tabelo čez rob in imena se odrežejo. */}
              <th><span className="dezDatumPoln">Urgenca ZDR</span><span className="dezDatumKratek">Urgenca</span></th>
              <th><span className="dezDatumPoln">Dežurstvo ZDR</span><span className="dezDatumKratek">Dež. ZDR</span></th>
              <th><span className="dezDatumPoln">Dežurstvo dipl. m.s./zn.</span><span className="dezDatumKratek">Dež. m.s./zn.</span></th>
            </tr>
          </thead>
          <tbody>
            {dnevi.map(dn => {
              const vikend = dn.dan === "SO" || dn.dan === "NE";
              const praznik = window.Prazniki.naziv(dn.datum);
              return (
                <tr key={dn.datum} className={vikend || praznik ? "weekend" : ""}>
                  {/* Na telefonu brez letnice ("5.8. SR"), na širokem
                      zaslonu cel datum - vse tri stolpce je treba videti
                      hkrati, sicer se dežurstva ne da prebrati z ene roke. */}
                  <td className="name" title={praznik || undefined}>
                    <span className="dezDatumKratek">{Number(dn.datum.slice(8,10))}.{Number(dn.datum.slice(5,7))}.</span>
                    <span className="dezDatumPoln">{datumSlo(dn.datum)}</span>
                    {" " + dn.dan}{praznik ? " *" : ""}
                  </td>
                  <td className="cell">{dn.urgenca}</td>
                  <td className="cell">{dn.dezurstvoZdr}</td>
                  <td className="cell">
                    {dn.sestre.map(o => (
                      <span key={o.ime} className={"dezOseba" + (o.id === myId ? " jaz" : "")}
                        title={o.izPdf ? "Iz uradnega dokumenta – razpored za ta dan še ni objavljen"
                             : (o.zamenjano ? "Po potrjeni menjavi" : o.ime)}>
                        {o.ime}
                        {o.zamenjano && <span aria-hidden="true"> ↔</span>}
                        {o.izPdf && <span aria-hidden="true"> *</span>}
                      </span>
                    ))}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="legend">
        <span className="li">↔ dežurstvo je bilo zamenjano s potrjeno menjavo</span>
        <span className="li">* podatek iz uradnega dokumenta (razpored za ta dan še ni objavljen)</span>
        <span className="li">Zdravnikov ni mogoče zamenjati v aplikaciji – vpiše jih uradni dokument.</span>
      </div>
    </div>
  );
}

function StanjeRazpredelnica({ oddelki }){
  const [mesec, setMesec] = useState(() => new Date().toISOString().slice(0, 7));
  const [oddelek, setOddelek] = useState("");
  const [osebe, setOsebe] = useState(null);
  // "id|datum" -> { stanje, kratica, barva } - kratica in barva sta iz
  // uradne legende (IZMENA_KRATICE), stanje pa služi razvrstitvi v legendi.
  const [poDnevih, setPoDnevih] = useState({});
  // "id|datum" za dneve, ki jih je spremenila POTRJENA menjava. Sama izmena
  // je v razpored že zamenjana (to naredi obrazec_potrdi_koordinator
  // v bazi), tu gre samo za vidno oznako, da se menjava tudi opazi.
  // Vidna je vsem zaposlenim in za vse mesece (pogled menjave_javno).
  const [menjani, setMenjani] = useState({});
  // Legenda je privzeto zložena: na telefonu je odprta zavzela skoraj cel
  // prvi zaslon in tabela je padla pod rob.
  const [legendaOdprta, setLegendaOdprta] = useState(false);
  // "id osebe" -> vrstica iz nosilci_oddelkov (enote, nadomešča …)
  const [nosilci, setNosilci] = useState({});
  // "ENOTA|datum" -> [id osebe]: kdo iz NZV tisti dan pokriva to enoto.
  // Obratna smer od enotaNaDan (ta pove, kje je posamezna oseba) - rabimo
  // jo, ker se razpredelnica gleda tudi PO ODDELKU: "kdo je danes za C1?"
  const [nosilciEnote, setNosilciEnote] = useState({});

  // Koledarski izračuni so v datum.js, vikend pa v prazniki.js - en sam
  // vir za vse strani.
  const dnevi = useMemo(() => {
    const [y, m] = mesec.split("-").map(Number);
    const out = [];
    for (let d = 1; d <= window.Datum.zadnjiDan(y, m); d++) {
      const iso = window.Datum.iso(y, m, d);
      out.push({ iso, dan: d, vikend: window.Prazniki.jeVikend(iso) });
    }
    return out;
  }, [mesec]);

  useEffect(() => {
    let cancelled = false;
    setOsebe(null); setPoDnevih({});
    const { startISO, endISO } = window.Datum.obseg(mesec);
    Promise.all([
      client.from("profili").select("id, full_name, role, department_code").order("full_name"),
      // Nosilci oddelkov (vodje/administratorji): katere enote pokrivajo in
      // KDO jih nadomešča ob odsotnosti. Vir je uradna predloga NZV, glej
      // supabase/nzv-nosilci-oddelkov.sql. Ločena tabela od profili, ker
      // gre za organizacijsko vlogo, ne za uporabniški račun.
      client.from("nosilci_oddelkov").select("full_name, inicialke, enote, odsotnost_tip, odsotnost_do"),
      // Pokrivanja so VZAJEMNA in VEČKRATNA (npr. Alukića nadomeščata
      // Bojić IN Džamastagić), zato svoja tabela parov, ne en stolpec -
      // glej supabase/nzv-nadomescanja.sql.
      client.from("nadomescanja").select("*"),
      // "profili!employee_id" je nujno: razpored ima več tujih
      // ključev na profili, zato bi nedoločen vgnezden zapis PostgREST
      // zavrnil kot dvoumen (glej preveri-vgnezdeni-join.mjs).
      // department_code/pokriva_oddelek: OBJAVLJEN razpored NZV pove, na
      // kateri enoti kdo tisti dan je. Koordinator v mreži NZV marsikaj
      // določi ročno, zato mora objavljeno prevladati nad izpeljavo po
      // pravilih nadomeščanja - sicer bi ta zaslon kazal pravilo, mreža
      // NZV pa dejansko stanje.
      RazporedAuth.vseStrani((od, doV) =>
        client.from("razpored").select("employee_id, work_date, shift_code, department_code, pokriva_oddelek")
          .gte("work_date", startISO).lte("work_date", endISO).range(od, doV)
      ).then(data => ({ data })),
      client.from("odsotnosti").select("full_name, work_date, kind")
        .gte("work_date", startISO).lte("work_date", endISO),
      // Potrjene menjave - samo za oznako v celici. Beremo iz pogleda
      // menjave_javno (shema, sekcija 33), ne iz obrazci: RLS na obrazci
      // navadnemu uporabniku pokaže tuje menjave le za TEKOČI mesec, zato
      // je oznaka za druge mesece manjkala. Pogled izpostavi samo kdo/s
      // kom/katera dva dneva - brez opomb in razlogov iz obrazca - in
      // vsebuje izključno potrjene menjave.
      client.from("menjave_javno").select("vlagatelj_id, sodelavec_id, datum_a, datum_b")
        .or(`and(datum_a.gte.${startISO},datum_a.lte.${endISO}),and(datum_b.gte.${startISO},datum_b.lte.${endISO})`),
    ]).then(([{ data: profili }, { data: nosilci }, { data: pokrivanja }, { data: vpisi }, { data: odsotnosti }, { data: menjave }]) => {
      if (cancelled) return;
      const seznam = profili || [];
      setOsebe(seznam);

      // Nosilce povežemo z osebami po imenu: nosilci_oddelkov hrani ime kot
      // besedilo (nima povezave na profil), zapis pa se lahko razlikuje po
      // vrstnem redu besed in po strešicah ("Dijana Lelić" / "Lelič
      // Dijana"), zato primerjamo vrečo besed brez strešic.
      const nosilecPoOsebi = {};
      (nosilci || []).forEach(n => {
        const oseba = seznam.find(p => imenaSeUjemataBrezStresic(p.full_name, n.full_name));
        if (oseba) nosilecPoOsebi[oseba.id] = n;
      });

      // Obe smeri iz iste tabele parov:
      //   mene  = kdo nadomešča MENE (po vrstnem redu prednosti),
      //   jaz   = koga (in katero enoto) pokrivam JAZ.
      const vrsti = [...(pokrivanja || [])].sort((a, b) => (a.prednost || 1) - (b.prednost || 1));
      seznam.forEach(p => {
        const mene = vrsti.filter(v => imenaSeUjemataBrezStresic(p.full_name, v.nosilec));
        const jaz  = vrsti.filter(v => imenaSeUjemataBrezStresic(p.full_name, v.nadomesca));
        if (!mene.length && !jaz.length) return;
        nosilecPoOsebi[p.id] = Object.assign({}, nosilecPoOsebi[p.id] || {}, {
          nadomescajoMene: mene.map(v => v.nadomesca),
          pokrivam: jaz.map(v => ({ koga: v.nosilec, enota: v.enota })),
        });
      });
      setNosilci(nosilecPoOsebi);
      const m2 = {};
      // Nosilec po ID-ju osebe, da spodnja izpeljava ne rabi znova iskati
      // po imenu. Vzame samo tiste z zapisanimi enotami - kdor jih nima,
      // ni nosilec oddelka in se mu prisotnost ne izpeljuje.
      const zapisNosilca = {};
      (nosilci || []).forEach(n => {
        if (!n.enote) return;
        const oseba = seznam.find(p => imenaSeUjemataBrezStresic(p.full_name, n.full_name));
        if (oseba) zapisNosilca[oseba.id] = n;
      });
      // Kdo je NZV: vodje in administratorji. Zanje velja poseben
      // delovnik (glej nzvProstDan spodaj); oddelčni kader dela vikende
      // in praznike normalno.
      const jeNzvOseba = {};
      seznam.forEach(p => { jeNzvOseba[p.id] = JE_NZV_VLOGA.has(p.role); });

      (vpisi || []).forEach(v => {
        // PRAVILO NZV: ponedeljek-petek redni delovnik; sobota, nedelja in
        // dela prosti prazniki so PROSTI, razen če je tisti dan dežurstvo.
        // Brez tega je razpredelnica kazala vodjo na delu v nedeljo
        // (Alukić Dino 2. 8. "LD", 9. in 16. 8. "DOP").
        if (jeNzvOseba[v.employee_id]
            && window.Prazniki.jeDelaProstDan(v.work_date)
            && stanjeIzKode(v.shift_code) !== "dezurstvo") return;
        m2[v.employee_id + "|" + v.work_date] = {
          stanje: stanjeIzKode(v.shift_code),
          kratica: izmenaKratica(v.shift_code),
          barva: izmenaBarva(v.shift_code),
          sifra: v.shift_code,
        };
      });
      // Odsotnosti se vpisujejo po IMENU (odsotnosti nima employee_id),
      // zato jih povežemo prek imena; razpored ima prednost samo tam, kjer
      // je izmena/dežurstvo - odsotnost prepiše privzeto "delo".
      const poImenu = {};
      seznam.forEach(p => { poImenu[(p.full_name || "").trim().toUpperCase()] = p.id; });
      (odsotnosti || []).forEach(o => {
        const kratica = KIND_KRATICA[o.kind];
        if (!kratica) return;
        const id = poImenu[(o.full_name || "").trim().toUpperCase()];
        if (!id) return;
        const k = id + "|" + o.work_date;
        if (m2[k] && m2[k].stanje === "dezurstvo") return; // dežurstvo je dejansko opravljeno delo
        // Dopust/bolniška se za NZV vodijo samo za DELOVNE dni - vikend ali
        // praznik sredi dopusta je navaden prost dan, ne "LD".
        if (jeNzvOseba[id] && window.Prazniki.jeDelaProstDan(o.work_date)) return;
        // Odsotnost iz Želja nima kode izmene, poznamo pa vrsto, zato jo
        // preslikamo v isto uradno kratico (LD / BS / STI).
        const vnos = vnosPoKratici(kratica);
        m2[k] = { stanje: vnos ? vnos[5] : "dopust", kratica, barva: vnos ? vnos[4] : "#E06666", sifra: kratica };
      });
      // ---- Stalna zasedba nosilcev enot -----------------------------
      // Za vodje in administratorje se dnevni razpored ne objavlja -
      // njihova enota je stalna in zapisana v nosilci_oddelkov. Brez tega
      // so cele vrstice ostajale prazne (Mušič, Tomaževič, Pogačnik …),
      // razpored pa je bil videti, kot da se konča sredi meseca.
      //
      // Isto pravilo kot v NZV mreži (Po oddelkih -> NZV): en sam vir v
      // nzv-zasedba.js. Objavljen vnos in odsotnost imata prednost -
      // izpeljava zapolni samo tisto, kar je ostalo prazno.
      // Na kateri enoti je NZV oseba posamezen dan PO DEJANSKEM RAZPOREDU
      // (upoštevaje preselitev ob tuji odsotnosti in prevzem zapuščene
      // enote) - isto pravilo kot v NZV mreži, glej nzv-zasedba.js.
      // Brez tega je bilo pod imenom videti samo stalno enoto, ki ob
      // nadomeščanju ni bila resnična.
      const nosilciSeznam = Object.keys(zapisNosilca).map(id => zapisNosilca[id]);
      const idPoKljucu = {};
      Object.keys(zapisNosilca).forEach(id => {
        idPoKljucu[window.Imena.kljuc(zapisNosilca[id].full_name)] = id;
      });
      const enotaNaDan = {}; // "id|datum" -> "C1" oz. "B, C"
      const poEnotiId = {};  // "ENOTA|datum" -> [id osebe]
      // Ime -> id po VSEH profilih, ne le po nosilcih enot: objavljen
      // razpored lahko na enoto postavi tudi koga, ki v nosilci_oddelkov
      // ni zapisan kot nosilec (vskoči nekdo tretji). Če bi se iskalo samo
      // med nosilci, bi tak vpis tiho izpadel iz seznama pod oddelkom.
      const idPoImenuNzv = {};
      seznam.forEach(p => { idPoImenuNzv[window.Imena.kljuc(p.full_name)] = p.id; });
      if (nosilciSeznam.length || (vpisi || []).length) {
        const odsotenDan = new Set();
        (odsotnosti || []).forEach(o => {
          if (o.kind === "ld" || o.kind === "bs" || o.kind === "sti") {
            odsotenDan.add(window.Imena.kljuc(o.full_name) + "|" + o.work_date);
          }
        });
        // Objavljeni vnosi NZV oseb po dnevih - ti prevladajo nad izpeljavo.
        const objavljeno = {};
        (vpisi || []).forEach(v => {
          if (!jeNzvOseba[v.employee_id]) return;
          if (window.Prazniki.jeDelaProstDan(v.work_date)) return;
          const kode = window.NzvZasedba.enoteIzZapisa(v);
          if (!kode.length) return;
          const oseba = seznam.find(p => p.id === v.employee_id);
          if (!oseba) return;
          (objavljeno[v.work_date] = objavljeno[v.work_date] || []).push({ ime: oseba.full_name, kode });
        });
        // En sam izračun za OBA pogleda na tem zaslonu: kje je posamezna
        // oseba (vrstica pod imenom) in kdo pokriva posamezen oddelek
        // (vrstice NZV pod oddelčnim kadrom). Prej sta bila dva izpeljana
        // zapisa iz istega klica; zdaj je vir en sam, zato se ne moreta
        // razhajati - tudi kadar objava prepiše pravilo.
        const poEnoti = window.NzvZasedba.zasedbaEnot({
          objavljeno,
          nosilci: nosilciSeznam,
          pari: pokrivanja || [],
          kljuc: window.Imena.kljuc,
          datumi: dnevi.map(d => d.iso),
          jeOdsoten: (ime, datum) => odsotenDan.has(window.Imena.kljuc(ime) + "|" + datum)
            || window.NzvZasedba.trajnoOdsoten(
                 nosilciSeznam.find(v => window.Imena.kljuc(v.full_name) === window.Imena.kljuc(ime)), datum),
          jeProstDan: iso => window.Prazniki.jeDelaProstDan(iso),
          saKodaZa: () => "SA",
        });
        // Naziv enote za prikaz ("ZO" se piše "ŽO", "B1B2" pa "B1,B2").
        const nazivEnote = {};
        window.NzvZasedba.STOLPCI.forEach(([koda, naziv]) => { nazivEnote[koda] = naziv; });
        const kodePoOsebi = {}; // "id|datum" -> [koda]
        Object.keys(poEnoti).forEach(k => {
          const [koda, datum] = k.split("|");
          poEnoti[k].forEach(ime => {
            const id = idPoImenuNzv[window.Imena.kljuc(ime)];
            if (!id) return;
            (poEnotiId[koda + "|" + datum] = poEnotiId[koda + "|" + datum] || []).push(id);
            (kodePoOsebi[id + "|" + datum] = kodePoOsebi[id + "|" + datum] || []).push(koda);
          });
        });
        // Zapis enot POD IMENOM osebe.
        //
        // Za dneve, ki se izpeljejo po pravilu, se vzame besedilo iz
        // razporedDneva, ne sestavljeno iz kod: sestavljene enote se v
        // uradni predlogi pišejo kot celota ("UA/SA" pomeni "ena od obeh",
        // ne "URGENCA in SA"), sestavljanje iz kod pa bi ta pomen izgubilo.
        // Za dneve z OBJAVLJENIM razporedom pa velja objava, zato se zapis
        // sestavi iz njenih enot.
        dnevi.forEach(d => {
          if (window.Prazniki.jeDelaProstDan(d.iso)) return;
          if (objavljeno[d.iso] && objavljeno[d.iso].length) return;   // objava, glej spodaj
          window.NzvZasedba.razporedDneva({
            nosilci: nosilciSeznam,
            pari: pokrivanja || [],
            kljuc: window.Imena.kljuc,
            jeOdsoten: ime => odsotenDan.has(window.Imena.kljuc(ime) + "|" + d.iso)
              || window.NzvZasedba.trajnoOdsoten(
                   nosilciSeznam.find(v => window.Imena.kljuc(v.full_name) === window.Imena.kljuc(ime)), d.iso),
            saKoda: "SA",
          }).forEach(({ nosilec, enote }) => {
            const id = idPoImenuNzv[window.Imena.kljuc(nosilec.full_name)];
            if (id && enote) enotaNaDan[id + "|" + d.iso] = enote;
          });
        });
        Object.keys(objavljeno).forEach(datum => {
          objavljeno[datum].forEach(v => {
            const id = idPoImenuNzv[window.Imena.kljuc(v.ime)];
            if (!id) return;
            enotaNaDan[id + "|" + datum] = v.kode.map(koda => nazivEnote[koda] || koda).join(", ");
          });
        });
      }

      Object.keys(zapisNosilca).forEach(id => {
        // Katere dneve dopolniti in s čim, pove skupni modul - pravilo
        // (delovni dan, daljša odsotnost, prednost objavljenega vnosa) je
        // eno samo za vse tri zaslone. Tu ga samo prevedemo v celico z
        // uradno kratico in barvo iz legende.
        window.NzvZasedba.stalnaZasedba(
          zapisNosilca[id],
          dnevi.map(d => d.iso),
          iso => !!m2[id + "|" + iso],
        ).forEach(x => {
          const vnos = vnosPoKratici(x.sifra) || vnosPoKratici(izmenaKratica(x.sifra));
          m2[id + "|" + x.datum] = {
            stanje: vnos ? vnos[5] : stanjeIzKode(x.sifra),
            kratica: izmenaKratica(x.sifra),
            barva: izmenaBarva(x.sifra),
            sifra: x.sifra,
            izpeljano: true,
          };
        });
      });
      // Enota se pripne na celico, ki tisti dan že obstaja - torej samo
      // tam, kjer oseba res dela. Ob dopustu ali bolniški je ne izpišemo,
      // ker tisti dan ni na nobeni enoti.
      Object.keys(enotaNaDan).forEach(k => {
        if (m2[k] && m2[k].stanje !== "dopust" && m2[k].stanje !== "bolniska") {
          m2[k] = { ...m2[k], enota: enotaNaDan[k] };
        }
      });
      setPoDnevih(m2);
      setNosilciEnote(poEnotiId);

      const mm = {};
      (menjave || []).forEach(o => {
        if (o.vlagatelj_id && o.datum_a) mm[o.vlagatelj_id + "|" + o.datum_a] = true;
        if (o.sodelavec_id && o.datum_b) mm[o.sodelavec_id + "|" + o.datum_b] = true;
      });
      setMenjani(mm);
    });
    return () => { cancelled = true; };
  }, [mesec]);

  const prikazane = useMemo(() => {
    if (!osebe) return [];
    return oddelek ? osebe.filter(o => o.department_code === oddelek) : osebe;
  }, [osebe, oddelek]);

  // Nosilci NZV za izbrani oddelek: v seznam sodijo vsi, ki ta oddelek
  // pokrivajo vsaj en dan v mesecu - torej tudi tisti, ki je vskočil samo
  // za en dan namesto odsotnega. Izpišejo se pod oddelčnim kadrom, ker
  // niso člani oddelka, ampak so zanj tisti dan odgovorni.
  const nzvVrstice = useMemo(() => {
    if (!oddelek || !osebe || !window.NzvZasedba.jeDelovisce(oddelek)) return [];
    const dnevPoId = {};
    dnevi.forEach(d => {
      (nosilciEnote[oddelek + "|" + d.iso] || []).forEach(id => {
        (dnevPoId[id] = dnevPoId[id] || new Set()).add(d.iso);
      });
    });
    return Object.keys(dnevPoId)
      .map(id => ({ oseba: osebe.find(o => o.id === id), dnevi: dnevPoId[id] }))
      .filter(v => v.oseba)
      .sort((a, b) => a.oseba.full_name.localeCompare(b.oseba.full_name, "sl"));
  }, [oddelek, osebe, dnevi, nosilciEnote]);

  return (
    <React.Fragment>
      <h2 className="section">Razpredelnica stanja</h2>
      <p className="hint" style={{marginTop:0}}>
        Kdo je na dani dan na delu, na dežurstvu, na dopustu, na bolniški ali prost. Združuje objavljen razpored in
        vpise iz Želja, vključno s <b>potrjenimi menjavami</b> za vse mesece (te so v razporedu že zamenjane, v celici pa označene z ↔).
        Kratice so uradne, iz dokumenta <i>Razpored delovnega časa</i> – vsaka ima svojo barvo, glej legendo spodaj.
      </p>
      <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginBottom:10}}>
        <div className="field" style={{marginBottom:0, maxWidth:200}}>
          <label htmlFor="stanjeMesec">Mesec</label>
          <input id="stanjeMesec" type="month" value={mesec} onChange={e => setMesec(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0, maxWidth:220}}>
          <label htmlFor="stanjeOddelek">Oddelek</label>
          <select id="stanjeOddelek" value={oddelek} onChange={e => setOddelek(e.target.value)}>
            <option value="">Vsi oddelki</option>
            {(oddelki || []).map(o => <option key={o.code} value={o.code}>{o.code} – {o.name}</option>)}
          </select>
        </div>
      </div>

      {/* Legenda je privzeto zložena za gumbom "i", da tabela ostane na
          vrhu zaslona - na telefonu je zavzela skoraj cel prvi zaslon.
          Odprta je mreža z DVEMA stolpcema (kratica | razlaga), da so vse
          vrstice enako poravnane: kratica vedno prva in vedno enako
          široka, razlaga vedno na isti navpičnici. */}
      <div className="card" style={{marginBottom:10, padding:"10px 12px"}}>
        <button type="button" onClick={() => setLegendaOdprta(o => !o)}
          aria-expanded={legendaOdprta}
          style={{display:"flex", alignItems:"center", gap:8, background:"none", border:"none",
            padding:0, cursor:"pointer", font:"inherit", color:"inherit"}}>
          <span className="infoToggle" aria-hidden="true">i</span>
          <span style={{fontSize:12, fontWeight:700}}>Legenda kratic</span>
          <span style={{fontSize:11, color:"var(--muted)"}}>{legendaOdprta ? "skrij" : "pokaži"}</span>
        </button>

        {legendaOdprta && (
          <div className="infoPanel">
            {["delo", "dezurstvo", "dopust", "bolniska", "prosto"].map(skupina => {
              const vnosi = IZMENA_KRATICE.filter(v => v[5] === skupina);
              if (!vnosi.length) return null;
              return (
                <div key={skupina} style={{marginBottom:10}}>
                  <div style={{fontSize:11, color:"var(--muted)", marginBottom:4}}>{STANJE_BARVA[skupina].naziv}</div>
                  <div style={{display:"grid", gridTemplateColumns:"48px 1fr", gap:"5px 10px", alignItems:"baseline"}}>
                    {vnosi.map(([, kratica, naziv, cas, barva]) => (
                      <React.Fragment key={kratica}>
                        <b style={{background:barva, color:window.Izmene.barvaBesedila(barva), borderRadius:4,
                          padding:"2px 0", fontSize:11, textAlign:"center", letterSpacing:".02em"}}>{kratica}</b>
                        <span style={{fontSize:12}}>
                          {naziv}
                          {cas ? <span style={{color:"var(--muted)"}}> · {cas}</span> : null}
                        </span>
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              );
            })}
            <div style={{fontSize:11, color:"var(--muted)", paddingTop:8, borderTop:"1px solid var(--line)"}}>
              Prazna celica = prost dan oz. oseba ta dan ni v razporedu. <b>Siva</b> celica pomeni kodo izmene, ki je ni
              v tej legendi – postavi kazalec nanjo za izvirni zapis. Kotna oznaka <b>↔</b> pomeni, da je bila
              izmena zamenjana s potrjeno menjavo. <b>Bledeje in ležeče</b> zapisana kratica ni objavljen vnos, ampak
              stalna zasedba enote: nosilec oddelka je na svoji enoti vsak delovni dan (za NZV velja PON–PET, vikendi
              in prazniki so prosti, razen dežurstva). Objavljen razpored in odsotnost imata vedno prednost.
              Vir kratic:
              <i> Razpored delovnega časa – Služba za ZN in oskrbo</i> (velja od 1. 7. 2022).
            </div>
          </div>
        )}
      </div>

      {osebe === null && <p className="hint">Nalagam …</p>}
      {osebe !== null && prikazane.length === 0 && <p className="hint">Za izbrani oddelek ni oseb.</p>}
      {osebe !== null && prikazane.length > 0 && (
