  /* Barve, radiji in sence so v theme.css (naložen zgoraj) - tu jih NE
     podvajamo. Prej je imela vsaka stran svojo kopijo in te so se
     razšle: --ok je bil tu #4C8C63, v theme.css #4F9B6B, --ok-rgb pa
     se ni podvajal - zato sta imeli znački .pill.ok ozadje iz ene

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);

    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  .wordmark .tag{ font-size:11.5px; color:var(--accent-ink); background:var(--accent); font-weight:800;
    padding:2px 8px; border-radius:999px; }
  .backlink{ display:inline-block; margin: 4px 14px 0 0; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px; text-decoration-color:var(--line); }

  .tabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); padding:4px;
    border-radius:999px; margin-top:14px; overflow-x:auto; }
  .tabs button{ flex:0 0 auto; border:0; background:transparent; color:var(--muted); padding:9px 14px;
    border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
  .uploadRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .fileBtn{ background: var(--surface-2); border:1px solid var(--line); color:var(--text); font-weight:700;
    padding:9px 14px; border-radius: var(--radius-sm); font-size:13px; cursor:pointer; }
  .fileBtn input{ display:none; }
  .statusMsg{ font-size:12.5px; color: var(--ok); }

  table.fair{ width:100%; border-collapse:separate; border-spacing:0; margin-top:14px; font-size:13px; }
  table.fair th{ text-align:left; color:var(--muted); font-weight:700; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.03em; padding:7px 8px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  table.fair th.active{ color: var(--accent-2); }
  table.fair td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.fair tr.top td{ background: rgba(var(--danger-rgb),0.08); }
  table.fair tr.bottom td{ background: rgba(var(--ok-rgb),0.08); }
  .bar{ height:6px; border-radius:3px; background: var(--surface-2); overflow:hidden; margin-top:4px; min-width:60px; }
  .bar i{ display:block; height:100%; background: var(--accent); }
  .bar.cool i{ background: var(--cool); }
  .num{ font-variant-numeric: tabular-nums; font-weight:700; }
  .rank{ display:inline-block; width:20px; color:var(--muted); font-size:11px; }

  .legend2{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; }
  .legend2 .li{ display:flex; align-items:center; gap:6px; }
  .sw{ width:10px; height:10px; border-radius:3px; }

  .dlBtn{ margin-top:16px; width:100%; background: transparent; color: var(--text); border:1px solid var(--line);
    padding:11px; border-radius: var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
    table.fair tr{ break-inside:avoid; page-break-inside:avoid; }

<script type="text/babel" data-presets="react">
// Uporabljamo dejanski Supabase klient iz RazporedAuth, ki ga inicializira supabase-client.js.
const client = (typeof window !== "undefined" && window.RazporedAuth && window.RazporedAuth.client) || null;

const { useState, useMemo, useEffect, useRef } = React;

const PODSKUPINA_NAZIV = { A:"A · rotacijski izmenski kader", B:"B · dnevni z občasnim REDI", C:"C · izključno dnevni", D:"D · dolgotrajna odsotnost" };

function download(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function normalizirajNazivOddelka(v) {
  if (typeof window !== "undefined" && typeof window.formatirajOddelke === "function") {
    return window.formatirajOddelke(v, null);
  }
  var s = String(v || "").trim();
  if (!s) return "";
  return s.split(/[\/,+]/)
    .map(function (del) {
      var d = String(del).trim();
      if (!d) return "";
      // Po CELI BESEDI, ne po podnizu: sicer se "IZOB" izpiše kot "IŽOB".
      d = d.replace(/(^|[\/,+\s])ZO(?=$|[\/,+\s])/gi, "$1ŽO");
      d = d.replace(/B1B2/gi, "B1,B2");
      return d;
    })
    .filter(Boolean)
    .filter(function (value, idx, arr) { return arr.indexOf(value) === idx; })
    .join(", ");
}

function useSort(data, defaultKey){
  const [key, setKey] = useState(defaultKey);
  const [dir, setDir] = useState(-1);
  const sorted = useMemo(() => {
    const arr = data.slice();
    arr.sort((a,b) => (a[key]-b[key]) * dir);
    return arr;
  }, [data, key, dir]);
  const onSort = (k) => { if (k===key) setDir(d=>-d); else { setKey(k); setDir(-1); } };
  return { sorted, key, dir, onSort };
}

function Th({ label, k, sortKey, onSort }){
  return <th className={k===sortKey ? "active" : ""} onClick={() => onSort(k)}>{label}{k===sortKey ? " ▾" : ""}</th>;
}

function FairBar({ value, max, cool }){
  return <div className={"bar" + (cool ? " cool" : "")}><i style={{width: (max>0 ? 100*value/max : 0)+"%"}}></i></div>;
}

// ---------------------------------------------------------------------
// Dopust: PRESELJENO iz Generatorja (admin.html) v Statistiko - uporabnikova
// zahteva, september 2026. Vsebina je nespremenjena, le zavihek stoji zdaj
// tam, kjer je ostalo spremljanje stanj.
//
// Ujemanje imen je v imena.js (skupni modul za vse zaslone) - v Generatorju
// je bil ta ovoj poimenovan imenaSeUjemataAdmin.
const imenaSeUjemata = window.Imena.seUjemata;
//
// Mesečni uvoz stanja dopusta iz Kadrisa (ime, šifra zaposlenega/
// "Mat.št", leto, mesec, DOPUST) + pregled z mesečnim trendom. employee_code
// je edini stabilen ključ med meseci (zaporedna št. se spreminja, imena se
// včasih zapišejo drugače) - povezuje se s kadrovski_podatki.employee_code,
// če je znan, sicer poskusi ujemanje po imenu (vreča besed). Ob vsakem uvozu
// sprožilec v shemi drži kadrovski_podatki.leave_balance_days/asof
// usklajena z najnovejšim mesecem (Imenik torej vedno kaže isto stanje).
// ---------------------------------------------------------------------
const DOPUST_GLAVE_MAPA = {
  full_name: ["full_name", "priimek in ime", "ime in priimek", "ime"],
  employee_code: ["employee_code", "mat.št", "mat št", "mat.st", "mat st", "šifra zaposlenega", "sifra zaposlenega"],
  leto: ["leto", "year"],
  mesec: ["mesec", "month"],
  dnevi: ["dnevi", "dopust", "stanje", "stanje dopusta"],
};
const MESECI_SL2 = ["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];

function DopustTab(){
  const [obdobja, setObdobja] = useState(null);
  const [obdobje, setObdobje] = useState("");
  const [vrstice, setVrstice] = useState([]);
  const [iskanje, setIskanje] = useState("");
  const [sort, setSort] = useState({ polje: "full_name", smer: 1 });
  const [uvozBusy, setUvozBusy] = useState(false);
  const [uvozMsg, setUvozMsg] = useState(null);
  const [predogled, setPredogled] = useState(null); // { zapisi, leto, mesec, novih, spremenjenih, enakih, manjkajoci }
  const fileRef = useRef();

  const nalozi = async () => {
    const { data } = await client.from("stanje_dopusta_obdobja").select("*");
    setObdobja(data || []);
    if (data && data.length && !obdobje) setObdobje(data[0].leto + "-" + data[0].mesec);
  };
  useEffect(() => { nalozi(); }, []);

  useEffect(() => {
    if (!obdobje) { setVrstice([]); return; }
    const [leto, mesec] = obdobje.split("-").map(Number);
    client.from("stanje_dopusta_pregled").select("*").eq("leto", leto).eq("mesec", mesec)
      .then(({ data }) => setVrstice(data || []));
  }, [obdobje]);

  const uvoziDatoteko = async (file) => {
    if (!file) return;
    setUvozBusy(true); setUvozMsg(null); setPredogled(null);
    try {
      const { vrsteVrstic, tip } = await window.ImportUtils.preberiDatoteko(file);
      if (tip === "pdf-besedilo") { setUvozMsg("V tem PDF-ju ni bilo mogoče prepoznati stolpcev (videti je kot navadno besedilo, ne preglednica) – uporabi CSV/Excel ali PDF s pravo tabelo."); return; }
      const { objekti, najdeniStolpci } = window.ImportUtils.vVrsticeObjekteGlave(vrsteVrstic, DOPUST_GLAVE_MAPA);
      if (!najdeniStolpci.includes("employee_code") || !najdeniStolpci.includes("dnevi")) {
        setUvozMsg("V datoteki ni bilo mogoče najti stolpcev za šifro zaposlenega (Mat.št) in DOPUST.");
        return;
      }
      const zapisi = objekti
        .map(o => ({
          full_name: (o.full_name || "").trim().toUpperCase(),
          employee_code: (o.employee_code || "").trim(),
          leto: Number(o.leto) || null,
          mesec: Number(o.mesec) || null,
          dnevi: o.dnevi !== "" && !isNaN(Number(o.dnevi)) ? Number(o.dnevi) : null,
        }))
        .filter(z => z.employee_code && z.dnevi != null);
      if (!zapisi.length) { setUvozMsg("Datoteka ne vsebuje uporabnih vrstic."); return; }

      // Obdobje: iz datoteke, če ga ima; sicer trenutni mesec (admin lahko
      // pred potrditvijo popravi spodaj).
      const zdaj = new Date();
      const leto = zapisi.find(z => z.leto)?.leto || zdaj.getFullYear();
      const mesec = zapisi.find(z => z.mesec)?.mesec || (zdaj.getMonth() + 1);

      // Zadnje znano stanje vsake osebe (za primerjavo novo/spremenjeno/enako).
      const { data: zgodovina } = await client.from("zgodovina_stanja_dopusta")
        .select("employee_code, leto, mesec, dnevi")
        .order("leto", { ascending: false }).order("mesec", { ascending: false });
      const zadnje = new Map();
      (zgodovina || []).forEach(r => { if (!zadnje.has(r.employee_code)) zadnje.set(r.employee_code, Number(r.dnevi)); });

      // Poveži z obstoječimi profili: najprej po employee_code
      // (kadrovski_podatki), sicer po imenu (vreča besed).
      const { data: hrPodatki } = await client.from("kadrovski_podatki").select("profile_id, employee_code");
      const { data: profili } = await client.from("profili").select("id, full_name");
      const poEmployeeCode = new Map((hrPodatki || []).filter(h => h.employee_code).map(h => [h.employee_code, h.profile_id]));

      const zVsebino = zapisi.map(z => {
        let profile_id = poEmployeeCode.get(z.employee_code) || null;
        if (!profile_id) {
          const ujemanje = (profili || []).find(p => imenaSeUjemata(p.full_name, z.full_name));
          if (ujemanje) profile_id = ujemanje.id;
        }
        const prej = zadnje.has(z.employee_code) ? zadnje.get(z.employee_code) : undefined;
        const vrsta = prej === undefined ? "nov" : (prej !== z.dnevi ? "sprem" : "enako");
        return { ...z, leto, mesec, profile_id, prej, vrsta };
      });

      const obstojeci = await client.from("zgodovina_stanja_dopusta").select("employee_code").then(r => new Set((r.data || []).map(x => x.employee_code)));
      const vNovem = new Set(zVsebino.map(z => z.employee_code));
      const { data: vsiZgodovina } = await client.from("zgodovina_stanja_dopusta").select("employee_code, full_name").order("full_name");
      const znaniZaEnkrat = new Map();
      (vsiZgodovina || []).forEach(r => { if (!znaniZaEnkrat.has(r.employee_code)) znaniZaEnkrat.set(r.employee_code, r.full_name); });
      const manjkajoci = [...znaniZaEnkrat.entries()].filter(([koda]) => !vNovem.has(koda)).map(([, ime]) => ime);

      setPredogled({
        zapisi: zVsebino, leto, mesec,
        novih: zVsebino.filter(z => z.vrsta === "nov").length,
        spremenjenih: zVsebino.filter(z => z.vrsta === "sprem").length,
        enakih: zVsebino.filter(z => z.vrsta === "enako").length,
        manjkajoci,
      });
      setUvozMsg(`Prebranih ${zVsebino.length} vrstic iz "${file.name}" – preveri predogled spodaj pred potrditvijo.`);
    } catch (e) {
      setUvozMsg("Napaka pri branju datoteke: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const potrdiUvoz = async () => {
    if (!predogled) return;
    setUvozBusy(true);
    try {
      const { data: { user } } = await client.auth.getUser();
      const zapisi = predogled.zapisi.map(z => ({
        employee_code: z.employee_code, full_name: z.full_name, leto: predogled.leto, mesec: predogled.mesec,
        dnevi: z.dnevi, profile_id: z.profile_id, uvozeno: new Date().toISOString(), uvozil: user ? user.id : null,
      }));
      for (let i = 0; i < zapisi.length; i += 200) {
        const { error } = await client.from("zgodovina_stanja_dopusta").upsert(zapisi.slice(i, i + 200), { onConflict: "employee_code,leto,mesec" });
        if (error) throw error;
      }
      setUvozMsg(`Uvoženih ${zapisi.length} vrstic za ${MESECI_SL2[predogled.mesec - 1]} ${predogled.leto}.`);
      setPredogled(null);
      await nalozi();
      setObdobje(predogled.leto + "-" + predogled.mesec);
    } catch (e) {
      setUvozMsg("Uvoz ni uspel: " + (e.message || String(e)));
    } finally {
      setUvozBusy(false);
    }
  };

  const razvrsti = (polje) => setSort(s => ({ polje, smer: s.polje === polje ? -s.smer : 1 }));

  const filtrirano = useMemo(() => {
    const s = iskanje.trim().toLowerCase();
    let v = !s ? vrstice : vrstice.filter(r =>
      (r.full_name || "").toLowerCase().includes(s) || String(r.employee_code).includes(s)
    );
    v = v.slice().sort((a, b) => {
      const x = a[sort.polje], y = b[sort.polje];
      if (typeof x === "string") return sort.smer * String(x).localeCompare(String(y), "sl");
      return sort.smer * ((x == null ? -1e9 : Number(x)) - (y == null ? -1e9 : Number(y)));
    });
    return v;
  }, [vrstice, iskanje, sort]);

  const izvoziCSV = () => {
    if (!filtrirano.length) return;
    const [leto, mesec] = obdobje.split("-");
    const csv = "full_name,employee_code,dnevi,sprememba\n" + filtrirano.map(r =>
      [`"${(r.full_name||"").replace(/"/g,'""')}"`, r.employee_code, r.dnevi, r.sprememba ?? ""].join(",")
    ).join("\n") + "\n";
    download(`dopust-${leto}-${String(mesec).padStart(2,"0")}.csv`, csv);
  };

  const skupaj = filtrirano.reduce((s, r) => s + Number(r.dnevi), 0);
  const maxDnevi = Math.max(1, ...filtrirano.map(r => Number(r.dnevi) || 0));
  const brezRacuna = filtrirano.filter(r => !r.profile_id).length;
  const brezDopusta = filtrirano.filter(r => Number(r.dnevi) === 0).length;

  return (
    <div>
      <h2 className="section no-print">Mesečno stanje dopusta (Kadris)</h2>
      <p className="hint no-print">
        Vsak mesec naloži izvoz iz Kadrisa (stolpci: Priimek in ime, Mat.št/šifra zaposlenega, Leto, Mesec, DOPUST).
        Šifra zaposlenega je edini stabilen ključ med meseci – ista oseba se ne podvoji, tudi če se ime kdaj zapiše
        drugače. Ponoven uvoz istega meseca obstoječo vrstico posodobi, ne podvoji. Stanje se samodejno prikaže tudi
        v Imeniku pri posamezni osebi (najnovejši mesec).
      </p>
      <div className="card no-print">
        <RazporedUvozVir kljuc="stanje-dopusta" ikona="🏖" naziv="Stanje dopusta (Kadris)"
          opis="CSV / Excel – mat. št., leto, mesec, dnevi"
          onClick={() => fileRef.current && fileRef.current.click()} />
        <input ref={fileRef} type="file" accept={window.ImportUtils.PODPRTE_PRIPONE} style={{display:"none"}}
          onChange={e => { uvoziDatoteko(e.target.files[0]); e.target.value = ""; }} />
        <button className="dlBtn" disabled={uvozBusy} onClick={() => fileRef.current && fileRef.current.click()}>
          {uvozBusy ? "Nalagam …" : "📤 Uvoz mesečnega stanja iz datoteke"}
        </button>
        {uvozMsg && <p className="hint" style={{marginTop:8, marginBottom:0}}>{uvozMsg}</p>}
      </div>

      {predogled && (
        <div className="card no-print">
          <h3 style={{marginTop:0}}>Predogled – {MESECI_SL2[predogled.mesec - 1]} {predogled.leto}</h3>
          <p className="hint">{predogled.novih} novih · {predogled.spremenjenih} spremenjenih · {predogled.enakih} nespremenjenih</p>
          {predogled.manjkajoci.length > 0 && (
            <p className="hint">V tem izvozu jih ni (bodo iz prejšnjih uvozov, podatki ostanejo): {predogled.manjkajoci.join(", ")}</p>
          )}
          <button className="genBtn" onClick={potrdiUvoz} disabled={uvozBusy}>{uvozBusy ? "Uvažam …" : "Potrdi uvoz"}</button>
          <button className="dlBtn" style={{marginLeft:8}} onClick={() => setPredogled(null)}>Prekliči</button>
        </div>
      )}

      <div className="card">
        <div className="row" style={{alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div className="field">
            <label htmlFor="dobd">Obdobje</label>
            <select id="dobd" value={obdobje} onChange={e => setObdobje(e.target.value)}>
              {(obdobja || []).length === 0 && <option value="">– ni podatkov –</option>}
              {(obdobja || []).map(o => (
                <option key={o.leto+"-"+o.mesec} value={o.leto+"-"+o.mesec}>{MESECI_SL2[o.mesec-1]} {o.leto} – {o.stevilo_oseb} oseb</option>
              ))}
            </select>
          </div>
          <div className="field" style={{flex:1, minWidth:180}}>
            <label htmlFor="disc">Iskanje</label>
            <input id="disc" type="text" placeholder="Ime ali šifra zaposlenega …" value={iskanje} onChange={e => setIskanje(e.target.value)} />
          </div>
        </div>
        <RazporedIzvozVir
          naziv="Stanje dopusta"
          dodatno={[{ label: "Izvozi CSV", onClick: izvoziCSV }]}
          naslov={(() => { const [leto, mesec] = obdobje.split("-"); return `dopust-${leto}-${String(mesec).padStart(2,"0")}`; })()}
          pripravi={() => {
            if (!filtrirano.length) throw new Error("Ni podatkov za izvoz.");
            return [{
              ime: "Dopust",
              glave: ["Priimek in ime", "Šifra zaposlenega", "Dnevi", "Sprememba"],

                  const besedilo = s == null ? "–" : (s > 0 ? "+" : "") + s;
                  return (
                    <tr key={r.id}>
                      <td>{r.full_name}</td>
                      <td>{r.employee_code}</td>
                      <td style={{minWidth:120}}>
                        <strong>{r.dnevi}</strong>

                            tem mesecu - kvota po osebi (annual_leave_total) v tem
                            izvozu ni na voljo, zato bi bil odstotek izmišljen. */}
                        <div className="bar" title={`${r.dnevi} dni · najvišje stanje ta mesec: ${maxDnevi}`}>

                        </div>
                      </td>
                      <td style={{color:barva, fontWeight:700}}>{besedilo}</td>
                      <td>{r.profile_id ? "povezan" : "ni računa"}</td>
                    </tr>
                  );
                })}

            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function DopustPregled({ oddelki }){
  const [vrstice, setVrstice] = useState(null);
  // "ključ imena" -> [ISO datumi z vpisanim LD]. Ključ je iz imena.js, ker
  // se zapis imena med viri razlikuje (uvoz z velikimi črkami).
  const [ldPoOsebi, setLdPoOsebi] = useState({});
  const [q, setQ] = useState("");

  useEffect(() => {
    if (!client || typeof client.from !== "function") {
      setVrstice([]);
      return;
    }

    client.from("profili")
      .select("id, full_name, department_code, kadrovski_podatki(annual_leave_total, leave_balance_days, leave_balance_asof)")
      .order("full_name")
      .then(({ data }) => {
        setVrstice((data || []).map(p => {
          const hr = Array.isArray(p.kadrovski_podatki) ? p.kadrovski_podatki[0] : p.kadrovski_podatki;
          return {
            id: p.id,
            full_name: p.full_name,
            department_code: p.department_code,
            annual_leave_total: hr ? hr.annual_leave_total : null,
            leave_balance_days: hr ? hr.leave_balance_days : null,
            leave_balance_asof: hr ? hr.leave_balance_asof : null,
          };
        }));
      })
      .catch(() => setVrstice([]));

    // Dnevi letnega dopusta, vpisani v Željah. Iz njih se izpelje
    // preostanek (dopust.js): stanje iz Kadrisa se NE prepisuje, ker bi ga
    // naslednji uvoz povozil - odšteje se le, kar je bilo vpisano po
    // njegovem dnevu. Berejo se VSI LD dnevi (ne le od enega dne naprej),
    // ker ima vsaka oseba svoj "stanje na dan"; odreže jih dopust.js.
    client.from("odsotnosti").select("full_name, work_date").eq("kind", "ld")
      .then(({ data }) => {
        const poKljucu = {};
        (data || []).forEach(r => {
          const k = window.Imena.kljuc(r.full_name);
          if (!k) return;
          (poKljucu[k] = poKljucu[k] || []).push(r.work_date);
        });
        setLdPoOsebi(poKljucu);
      }, () => setLdPoOsebi({}));
  }, []);

  const imeOddelka = useMemo(() => {
    const m = {};
    (oddelki || []).forEach(o => { m[o.code] = normalizirajNazivOddelka(o.name || o.code); });
    return m;
  }, [oddelki]);

  const filtrirano = useMemo(() => {
    if (!vrstice) return [];
    const s = q.trim().toLowerCase();
    if (!s) return vrstice;
    return vrstice.filter(v =>
      (v.full_name || "").toLowerCase().includes(s) ||
      (imeOddelka[v.department_code] || "").toLowerCase().includes(s)
    );
  }, [vrstice, q, imeOddelka]);

  const manjkaPodatek = filtrirano.filter(v => v.leave_balance_days == null).length;
  // Preostanek po ISTEM pravilu kot v Imeniku (dopust.js).
  const stanjeZa = (v) => window.Dopust.stanje({
    kvota: v.annual_leave_total, kadris: v.leave_balance_days, naDan: v.leave_balance_asof,
    ldDatumi: ldPoOsebi[window.Imena.kljuc(v.full_name)] || [],
  });

  if (!vrstice) return <p className="hint">Nalagam …</p>;

  return (
    <div className="card" style={{marginTop:12}}>
      <div className="searchWrap no-print" style={{marginBottom:8}}>
        <span className="ic">🔍</span>
        <input type="search" placeholder="Išči po imenu ali oddelku …" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <p className="hint no-print" style={{marginTop:0}}>
        {filtrirano.length} oseb{manjkaPodatek > 0 ? ` – ${manjkaPodatek} brez vnesenega stanja dopusta (dopolni ob uvozu HR podatkov ali ročno na profilu osebe)` : ""}.
      </p>
      <p className="hint no-print" style={{marginTop:0}}>
        <b>Preostanek</b> je izpeljan: stanje iz Kadrisa minus dnevi letnega dopusta, vpisani v
        Željah PO dnevu tega stanja (štejejo samo delovni dnevi). Kadrisovo polje ostane
        nespremenjeno – naslednji uvoz ga osveži in odštevanje se začne od novega dne. Zato se
        dan, ki ga prekrije STI, sam vrne v kvoto.
      </p>
      <div style={{overflowX:"auto"}}>
        <table className="fair">
          <thead>
            <tr><th>Zaposleni</th><th>Oddelek</th><th>Letni dopust</th><th>Kadris (dni)</th><th>Vpisano po tem</th><th>Preostanek (dni)</th><th>Stanje na dan</th></tr>
          </thead>
          <tbody>
            {filtrirano.map(v => {
              const datum = (window.Datum && typeof window.Datum.slo === "function") ? window.Datum.slo(v.leave_balance_asof) : (v.leave_balance_asof || "–");
              const s = stanjeZa(v);
              return (
                <tr key={v.id}>
                  <td>{v.full_name}</td>
                  <td>{imeOddelka[v.department_code] || normalizirajNazivOddelka(v.department_code) || "–"}</td>
                  <td>{v.annual_leave_total != null ? v.annual_leave_total : "–"}</td>
                  <td>{v.leave_balance_days != null ? v.leave_balance_days : "–"}</td>
                  <td>{s.porabljeno ? "− " + s.porabljeno : "–"}</td>
                  <td>{s.preostanek != null ? <b>{s.preostanek}</b> : <span className="hint" style={{margin:0}}>ni podatka</span>}</td>
                  <td>{datum || "–"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function KpiKartice({ postavke }){

// Vodoravni stolpčni graf s poudarkom na ODSTOPANJU od povprečja:
// nad povprečjem rdeče (preobremenjen), pod povprečjem modro (premalo),
// v okviru ±10 % olivno (v redu). Prav to je vprašanje pravičnosti.
function StolpcniGraf({ podatki, kljuc, naslov, enota }){
  const vrednosti = podatki.map(z => z[kljuc] || 0);
  const max = Math.max(1, ...vrednosti);
  const povprecje = vrednosti.length ? vrednosti.reduce((a, b) => a + b, 0) / vrednosti.length : 0;
  const razvrsceni = podatki.slice().sort((a, b) => (b[kljuc] || 0) - (a[kljuc] || 0));

  return (
    <div className="card" style={{marginTop:12}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:10, flexWrap:"wrap"}}>
        <b style={{fontSize:14}}>{naslov}</b>
        <span className="hint" style={{margin:0}}>povprečje {povprecje.toFixed(1)} {enota}</span>
      </div>
      <div style={{marginTop:8}}>
        {razvrsceni.map(z => {
          const v = z[kljuc] || 0;
          const odstopanje = povprecje > 0 ? (v - povprecje) / povprecje : 0;
          const razred = odstopanje > 0.10 ? "nad" : (odstopanje < -0.10 ? "pod" : "");
          return (
            <div className="grafVrstica" key={z.ime}>
              <span className="ime" title={z.ime}>{z.ime}</span>
              <span className="stolpec"><i className={razred} style={{width: (100 * v / max) + "%"}}></i></span>
              <span className="st">{v}</span>
            </div>
          );
        })}
      </div>
      <div className="legend" style={{marginTop:10}}>
        <span className="li"><span className="dot" style={{background:"var(--danger)"}}></span>nad povprečjem (&gt;10 %)</span>
        <span className="li"><span className="dot" style={{background:"var(--accent)"}}></span>v okviru</span>
        <span className="li"><span className="dot" style={{background:"var(--noc)"}}></span>pod povprečjem</span>
      </div>
    </div>
  );
}

// Toplotna karta: vrstica = zaposleni, celica = ena mera obremenitve,
// intenzivnost = koliko odstopa od NAJVEČJE vrednosti v tem stolpcu.
// Namen je hitro najti vrstico, ki je "povsod temna" = preobremenjen.
function ToplotnaKarta({ podatki, mere }){
  const maxi = {};
  mere.forEach(m => { maxi[m.kljuc] = Math.max(1, ...podatki.map(z => z[m.kljuc] || 0)); });

  // Vsota normaliziranih mer = groba skupna obremenitev, po njej razvrstimo.
  const zSkupno = podatki.map(z => ({
    ...z,
    _skupno: mere.reduce((v, m) => v + (z[m.kljuc] || 0) / maxi[m.kljuc], 0),
  })).sort((a, b) => b._skupno - a._skupno);

  return (
    <div className="card" style={{marginTop:12}}>
      <b style={{fontSize:14}}>Toplotna karta obremenjenosti</b>
      <p className="hint" style={{marginTop:4}}>
        Temnejša celica = višja vrednost glede na najbolj obremenjenega pri tej meri. Vrstice so razvrščene
        po skupni obremenitvi, zato so najbolj obremenjeni zgoraj.
      </p>
      <div className="heatVrstica" style={{marginTop:8, fontWeight:800}}>
        <span className="ime"></span>
        <span className="heatCelice" style={{gap:6}}>
          {mere.map(m => (
            <span key={m.kljuc} style={{fontSize:11, color:"var(--muted)", width:44, textTransform:"uppercase", letterSpacing:".04em"}}>
              {m.kratko}
            </span>
          ))}
        </span>
      </div>
      {zSkupno.map(z => (
        <div className="heatVrstica" key={z.ime}>
          <span className="ime" title={z.ime}>{z.ime}</span>
          <span className="heatCelice" style={{gap:6}}>
            {mere.map(m => {
              const v = z[m.kljuc] || 0;
              const delez = v / maxi[m.kljuc];
              return (
                <span key={m.kljuc} className="heatCelica"
                  style={{
                    width:44,
                    background: delez > 0 ? `rgba(var(--danger-rgb), ${(0.12 + 0.78 * delez).toFixed(3)})` : "var(--surface-2)",
                    color: delez > 0.55 ? "#fff" : "var(--text)",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    // 10.5px je bilo za 212 celic s številkami premalo; celica
                    // je široka 44px, zato 12px brez težav gre noter.
                    fontSize:12, fontWeight:700,
                  }}
                  title={`${z.ime} – ${m.naziv}: ${v}`}>
                  {v}
                </span>
              );
            })}
          </span>
        </div>
      ))}
    </div>
  );
}

function SmsTab({ baseline, onUpdate }){
  const [status, setStatus] = useState(null);
  const { sorted, key, dir, onSort } = useSort(baseline.podatki, "nedpraz");
  const maxNedpraz = Math.max(1, ...baseline.podatki.map(z => z.nedpraz));
  const maxNocne = Math.max(1, ...baseline.podatki.map(z => z.nocne));

  // Razpon (najvec - najmanj) je pri pravicnosti povednejsi od povprecja:
  // pove, kako velika je razlika med najbolj in najmanj obremenjenim.
  const kpi = useMemo(() => {
    const p = baseline.podatki;
    if (!p.length) return [];
    const povp = (k) => p.reduce((a, z) => a + (z[k] || 0), 0) / p.length;
    const nocne = p.map(z => z.nocne || 0);
    return [
      { oznaka: "Zaposlenih", vrednost: p.length },
      { oznaka: "Povpr. nočnih", vrednost: povp("nocne").toFixed(1) },
      { oznaka: "Razpon nočnih", vrednost: (Math.max(...nocne) - Math.min(...nocne)), pod: "največ − najmanj" },
      { oznaka: "Povpr. ned./praz.", vrednost: povp("nedpraz").toFixed(1) },
    ];
  }, [baseline.podatki]);

  const onFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const delta = Dashboard.deltaFromKalupExport(json);
        const n = Object.keys(delta).length;
        onUpdate(Dashboard.mergeSmsBaseline(baseline.podatki, delta));
        setStatus({ ok:true, msg: `Dodano: ${n} zaposlenih iz naloženega izvoza.` });
      } catch (err) {
        setStatus({ ok:false, msg: "Datoteka ni veljaven izvoz iz generatorja kalupa: " + err.message });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div>
      {/* Orodje za uvoz je zloženo in POD vsebino: uporablja se enkrat na
          mesec, prej pa je s celotnim opisom zasedlo prvi zaslon telefona,
          tako da statistike (zaradi katere je stran odprta) ni bilo videti
          brez drsenja. */}
      <details className="navodilo no-print" style={{marginTop:10}}>
        <summary>Dodaj mesec (uvoz JSON)</summary>
        <p className="hint" style={{marginTop:8}}>Naložite JSON, ki ga je izdelal generator kalupa (admin.html → kartica Kalup → »Prenesi JSON«). Prišteje se k spodnji osnovi.</p>
        <div className="card">
          <div className="uploadRow">
            <label className="fileBtn">⬆ Izberi datoteko<input type="file" accept="application/json" onChange={onFile} /></label>
            {status && <span className={"statusMsg" + (status.ok ? "" : " err")}>{status.msg}</span>}
          </div>
        </div>
      </details>

      <h2 className="section">Pregled – {baseline.obdobje}</h2>
      <KpiKartice postavke={kpi} />
      <StolpcniGraf podatki={baseline.podatki} kljuc="nocne" naslov="Nočne izmene po zaposlenih" enota="nočnih" />
      <StolpcniGraf podatki={baseline.podatki} kljuc="nedpraz" naslov="Nedelje in prazniki po zaposlenih" enota="dni" />
      <ToplotnaKarta podatki={baseline.podatki} mere={[
        { kljuc:"nocne", kratko:"Nočne", naziv:"nočne izmene" },
        { kljuc:"nedpraz", kratko:"Ned/pr", naziv:"nedelje in prazniki" },
        { kljuc:"vikend", kratko:"Vikend", naziv:"vikendi" },
        { kljuc:"delo", kratko:"Dnevi", naziv:"delovni dnevi" },
      ]} />

      <h2 className="section">Podrobna razpredelnica</h2>
      <p className="hint">Kliknite naslov stolpca za razvrstitev. Obarvane vrstice: zgoraj (oranžno) največ nedelj/praznikov, spodaj (zeleno) najmanj.</p>
      <div style={{overflowX:"auto"}}>
        <table className="fair">
          <thead><tr>
            <th></th><th>Zaposleni</th><th>Enota</th>
            <Th label="Delovni dnevi" k="delo" sortKey={key} onSort={onSort} />
            <Th label="Nočne izmene" k="nocne" sortKey={key} onSort={onSort} />
            <Th label="Ned. + prazniki" k="nedpraz" sortKey={key} onSort={onSort} />
            <Th label="Vikend" k="vikend" sortKey={key} onSort={onSort} />
            <Th label="LD" k="ld" sortKey={key} onSort={onSort} />
            <Th label="KPU" k="kpu" sortKey={key} onSort={onSort} />
          </tr></thead>
          <tbody>
            {sorted.map((z, i) => (
              <tr key={z.ime} className={i<3 ? "top" : (i>=sorted.length-3 ? "bottom" : "")}>
                <td className="rank">{i+1}</td>
                <td>{z.ime}</td>
                <td>{z.enota}</td>
                <td className="num">{z.delo}</td>
                <td className="num">{z.nocne}<FairBar value={z.nocne} max={maxNocne} cool/></td>
                <td className="num">{z.nedpraz}<FairBar value={z.nedpraz} max={maxNedpraz}/></td>
                <td className="num">{z.vikend}</td>
                <td className="num">{z.ld}</td>
                <td className="num">{z.kpu}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <RazporedIzvozVir
        naziv="SMS / TZN"
        dodatno={[{ label: "Prenesi posodobljeno osnovo (JSON)",
                    onClick: () => download("osnova-sms-posodobljeno.json", { obdobje: baseline.obdobje, podatki: baseline.podatki }) }]}
        naslov={`pravicnost-sms-${baseline.obdobje}`}
        pripravi={() => [{
          ime: "SMS-TZN",
          glave: ["#", "Zaposleni", "Enota", "Delovni dnevi", "Nočne izmene", "Ned. + prazniki", "Vikend", "LD", "KPU"],
          vrstice: sorted.map((z, i) => [i+1, z.ime, z.enota, z.delo, z.nocne, z.nedpraz, z.vikend, z.ld, z.kpu]),
        }]}
      />
      {/* Izvozi so v meniju ikone ⬇ zgoraj desno. */}
    </div>
  );
}

function DezTab({ baseline, onUpdate }){

  const maxDez = Math.max(1, ...baseline.podatki.map(z => z.dezurstva));

  const kpi = useMemo(() => {
    const p = baseline.podatki;
    if (!p.length) return [];
    const dez = p.map(z => z.dezurstva || 0);
    const skupaj = dez.reduce((a, b) => a + b, 0);
    return [
      { oznaka: "V obtoku", vrednost: p.length, pod: "zaposlenih" },
      { oznaka: "Skupaj dežurstev", vrednost: skupaj },
      { oznaka: "Povprečje", vrednost: (skupaj / p.length).toFixed(1) },
      { oznaka: "Razpon", vrednost: (Math.max(...dez) - Math.min(...dez)), pod: "največ − najmanj" },
    ];
  }, [baseline.podatki]);

  const onFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        if (!json.stanje) throw new Error("manjka polje 'stanje'");
        onUpdate(Dashboard.mergeDezBaseline(baseline.podatki, json.stanje));
        setStatus({ ok:true, msg: `Dodano: ${json.stanje.length} zaposlenih iz naloženega izvoza dežurstev.` });
      } catch (err) {
        setStatus({ ok:false, msg: "Datoteka ni veljaven izvoz generatorja dežurstev: " + err.message });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div>
      {/* Zloženo in pod vsebino - glej razlago pri istem orodju zgoraj. */}
      <details className="navodilo no-print" style={{marginTop:10}}>
        <summary>Dodaj mesec (uvoz JSON)</summary>
        <p className="hint" style={{marginTop:8}}>Naložite JSON iz generatorja dežurstev (admin.html → kartica Dežurstva → »Prenesi JSON«). Posodobi se samo število dežurstev – ure/REDI/NZV zahtevajo uvoz iz Kadrisa (faza 4).</p>

            <label className="fileBtn">⬆ Izberi datoteko<input type="file" accept="application/json" onChange={onFile} /></label>
            {status && <span className={"statusMsg" + (status.ok ? "" : " err")}>{status.msg}</span>}
          </div>
        </div>
      </details>

      <h2 className="section">Pregled – {baseline.obdobje}</h2>
      <KpiKartice postavke={kpi} />
      <StolpcniGraf podatki={baseline.podatki} kljuc="dezurstva" naslov="Dežurstva po zaposlenih" enota="dežurstev" />

      <h2 className="section">Podrobna razpredelnica</h2>
      <p className="hint">To je isti seznam, ki ga admin.html uporabi kot izhodišče za naslednji generiran mesec – po nalaganju novega meseca tu prenesite posodobljeno osnovo in jo ročno vnesite v generator.</p>
      <div style={{overflowX:"auto"}}>
        <table className="fair">
          <thead><tr>
            <th></th><th>Zaposleni</th><th>Enota</th>
            <Th label="Dežurstva" k="dezurstva" sortKey={key} onSort={onSort} />
            <Th label="Delovnih ur" k="ure" sortKey={key} onSort={onSort} />
            <Th label="REDI ur" k="redi" sortKey={key} onSort={onSort} />
            <Th label="NZV ur" k="nzv" sortKey={key} onSort={onSort} />
          </tr></thead>
          <tbody>
            {sorted.map((z, i) => (
              <tr key={z.ime} className={i<3 ? "top" : (i>=sorted.length-3 ? "bottom" : "")}>
                <td className="rank">{i+1}</td>
                <td>{z.ime}</td>
                <td>{z.enota}</td>
                <td className="num">{z.dezurstva}<FairBar value={z.dezurstva} max={maxDez}/></td>
                <td className="num">{z.ure}</td>
                <td className="num">{z.redi}</td>
                <td className="num">{z.nzv}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="hint" style={{marginTop:14}}>Najmanj dežurstev (spodaj, zeleno) naj generator prednostno razporedi naslednji mesec – to že počne samodejno, če tu prenešeno osnovo prepišete v admin.html.</p>
      <RazporedIzvozVir
        naziv="Dežurstva"
        dodatno={[{ label: "Prenesi posodobljeno osnovo (JSON)",
                    onClick: () => download("osnova-dezurstva-posodobljeno.json", { obdobje: baseline.obdobje, podatki: baseline.podatki }) }]}
        naslov={`pravicnost-dezurstva-${baseline.obdobje}`}
        pripravi={() => [{
          ime: "Dežurstva",
          glave: ["#", "Zaposleni", "Enota", "Dežurstva", "Delovnih ur", "REDI ur", "NZV ur"],
          vrstice: sorted.map((z, i) => [i+1, z.ime, z.enota, z.dezurstva, z.ure, z.redi, z.nzv]),
        }]}
      />

    </div>
  );
}

// ---------------------------------------------------------------------
function NedezTab({ baseline }){
  const { sorted, key, dir, onSort } = useSort(baseline.podatki, "noc");
  const maxNoc = Math.max(1, ...baseline.podatki.map(z => z.noc));
  return (
    <div>
      <h2 className="section">Stanje – {baseline.obdobje}</h2>
      <p className="hint">Za to skupino (zaposleni brez 24-urnega dežurstva) generator še ne obstaja, zato tu ni nalaganja novih mesecev – samo pregled zadnjega znanega stanja iz analize Kadrisa.</p>
      <div style={{overflowX:"auto"}}>
        <table className="fair">
          <thead><tr>
            <th></th><th>Zaposleni</th><th>Enota</th><th>Podskupina</th>
            <Th label="Delovnih ur" k="ure" sortKey={key} onSort={onSort} />
            <Th label="REDI ur" k="redi" sortKey={key} onSort={onSort} />
            <Th label="Nočnih ur" k="noc" sortKey={key} onSort={onSort} />
            <Th label="Nedelj" k="ned" sortKey={key} onSort={onSort} />
          </tr></thead>
          <tbody>
            {sorted.map((z, i) => (
              <tr key={z.ime}>
                <td className="rank">{i+1}</td>
                <td>{z.ime}</td>
                <td>{z.enota}</td>
                <td style={{fontSize:11, color:"var(--muted)"}}>{PODSKUPINA_NAZIV[z.podskupina] || z.podskupina}</td>
                <td className="num">{z.ure}</td>
                <td className="num">{z.redi}</td>
                <td className="num">{z.noc}<FairBar value={z.noc} max={maxNoc} cool/></td>
                <td className="num">{z.ned}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <RazporedIzvozVir
        naziv="Nedežurni"
        naslov={`pravicnost-nedezurni-${baseline.obdobje}`}
        pripravi={() => [{
          ime: "Nedežurni",
          glave: ["#", "Zaposleni", "Enota", "Podskupina", "Delovnih ur", "REDI ur", "Nočnih ur", "Nedelj"],
          vrstice: sorted.map((z, i) => [i+1, z.ime, z.enota, PODSKUPINA_NAZIV[z.podskupina] || z.podskupina, z.ure, z.redi, z.noc, z.ned]),
        }]}
      />
    </div>
  );
}

function App({ role, ogled, profil }){
  const [data, setData] = useState(null);
  // Zavihek se lahko določi z naslovom ("dashboard.html?tab=dopust"), ker
  // stran "Uvoz" na uvoz stanja dopusta kaže sem - odkar je ta zavihek
  // preseljen iz Generatorja (september 2026). Naslov je zunanji vhod,
  // zato se vrednost preveri proti znanim zavihkom; neznana pomeni
  // privzeto, ne napake.
  const [tab, setTab] = useState(() => {
    try {
      const t = new URLSearchParams(window.location.search).get("tab");
      return ["sms", "dez", "nedez", "dopust"].includes(t) ? t : "sms";
    } catch (e) { return "sms"; }
  });
  const [oddelki, setOddelki] = useState([]);

  React.useEffect(() => {
    fetch("dashboard-baseline.json").then(r => r.json()).then(setData).catch(() => {});
  }, []);

  React.useEffect(() => {
    if (!client || typeof client.from !== "function") {
      setOddelki([]);
      return;
    }

    client.from("oddelki").select("code, name").order("code").then(({ data }) => setOddelki(data || [])).catch(() => setOddelki([]));
  }, []);

  const update = (key, novi) => setData(d => ({ ...d, [key]: { ...d[key], podatki: novi } }));

  return (
    <div className="wrap wide">
      <RazporedOgledTrak aktivno={ogled} profil={profil}/>
      <RazporedLogout pred={<RazporedOrodja/>}/>
      <header className="top">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Statistika</span><span className="tag">za koordinatorje</span></div>
        <p className="sub">Psihiatrična bolnišnica Begunje · kumulativno spremljanje obremenitev</p>
        <div className="tabs no-print" role="tablist">
          <button role="tab" aria-selected={tab==="sms"} onClick={() => setTab("sms")}>SMS/TZN</button>
          <button role="tab" aria-selected={tab==="dez"} onClick={() => setTab("dez")}>Dežurni DMS/DZN</button>
          <button role="tab" aria-selected={tab==="nedez"} onClick={() => setTab("nedez")}>Nedežurni DMS/DZN</button>
          {role === "admin" && (
            <button role="tab" aria-selected={tab==="dopust"} onClick={() => setTab("dopust")}>Stanje dopusta</button>
          )}
        </div>
        <RazporedIzvozVir
          naziv="Cela stran"
          pdf={{ label: "Izvozi v PDF (A4 pokončno)",
                 onClick: () => PrintFit.natisni(null, { orientacija:"portrait" }) }}
        />
      </header>

      {!data && <p className="hint">Nalagam osnovne podatke …</p>}
      {data && tab==="sms" && <SmsTab baseline={data.osnova_sms} onUpdate={(n) => update("osnova_sms", n)} />}
      {data && tab==="dez" && <DezTab baseline={data.osnova_dez} onUpdate={(n) => update("osnova_dez", n)} />}
      {data && tab==="nedez" && <NedezTab baseline={data.osnova_nedez} />}
      {role === "admin" && tab==="dopust" && (
        <React.Fragment>
          <DopustPregled oddelki={oddelki} />
          {/* Preseljeno iz Generatorja (uporabnikova zahteva, september
              2026): mesečni uvoz stanja dopusta iz Kadrisa in pregled po
              obdobjih. Stoji pod trenutnim stanjem, ker to stanje ravno
              ta uvoz posodablja (sprožilec v shemi drži
              kadrovski_podatki.leave_balance_days usklajen z najnovejšim
              uvoženim mesecem). Svoj naslov ima že sam. */}
          <DopustTab />
        </React.Fragment>
      )}

      <footer className="foot no-print">
        <p><b>Modul 3 – nadzorna plošča pravičnosti.</b> Osnova SMS/TZN je iz obdobja 1. 1.–30. 9. 2026 (56 oseb), osnova dežurnih DMS/DZN iz 1. 1.–30. 9. 2026 (14 oseb, analiza "Dežurstva 2026"), osnova nedežurnih DMS/DZN iz 1. 1.–31. 7. 2026 (11 oseb) – vse iz analiz Kadrisa.</p>
        <p>Nalaganje novega meseca posodobi samo v tej seji odprtega brskalnika. Za trajno shrambo prenesite posodobljeno osnovo in jo shranite namesto te datoteke, ali počakajte na fazo 4 (skupna baza).</p>
      </footer>

      <RazporedNav active="dashboard" role={role} unread={0} />
    </div>
  );
}
function Gate(){
  const [ok, setOk] = useState(false);
  const [role, setRole] = useState("vodja");
  const [ogled, setOgled] = useState(false);
  const [profil, setProfil] = useState(null);

  useEffect(() => {
    const auth = typeof window !== "undefined" ? window.RazporedAuth : null;
    if (!auth || typeof auth.requireRole !== "function") {
      setRole("vodja");
      setOgled(false);
      setProfil(null);
      setOk(true);
      return;
    }

    auth.requireRole(["admin","vodja"]).then(res => {
      if (res) {
        setRole(res.profile.role);
        setOgled(!!res.ogled);
        setProfil(res.profile);
      }
      setOk(true);
    }).catch(() => setOk(true));
  }, []);

  if (!ok) return <div className="wrap wide"><p className="hint">Nalagam …</p></div>;
  return <App role={role} ogled={ogled} profil={profil}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Gate/>);
</script>
</body>
</html>
