<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Menjave · Begunje</title>
<meta name="theme-color" content="#FAF8F1" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="theme.css" />

<style>
  :root{
    --bg: #FAF8F1; --bg-grad: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2EEDF;
    --line: #E1D9C2; --text: #2B2712; --muted: #8A7F5E; --accent: #A79448; --accent-2: #6E5F2A; --accent-ink: #2B2712;
    --danger: #B3402A; --danger-bg: #FBEAE6; --ok: #4C8C63; --ok-bg: #EAF3EC;
    --radius: 16px; --radius-sm: 10px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg) 60%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100dvh; padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{ max-width: 640px; margin:0 auto; padding: 0 16px 60px; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; border-radius:8px; }

  header.top{ position:sticky; top:0; z-index:20; background: linear-gradient(180deg, var(--bg) 78%, transparent);
    padding: calc(env(safe-area-inset-top) + 18px) 0 10px; }
  .wordmark{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .wordmark .logoSmall{ height:28px; width:auto; }
  .wordmark .mark{ font-weight:800; font-size:20px; letter-spacing:-0.02em; }
  .sub{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  .backlink{ display:inline-block; margin: 8px 14px 0 0; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px; text-decoration-color:var(--line); background:none; border:0; cursor:pointer; padding:0; font-family:inherit; }

  h2.section{ font-size:15px; font-weight:800; margin: 24px 0 4px; letter-spacing:-0.01em; }
  p.hint{ color:var(--muted); font-size:13px; margin: 4px 0 14px; line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:10px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  select, input[type=date], textarea{
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius: var(--radius-sm); font-size:14px; width:100%; font-family:inherit;
  }
  textarea{ resize:vertical; min-height:60px; }
  .shiftPreview{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .submitBtn{ margin-top:6px; width:100%; background: var(--accent); color: var(--accent-ink); border:0;
    padding:13px; border-radius: var(--radius-sm); font-weight:800; font-size:15px; cursor:pointer; }
  .submitBtn:disabled{ opacity:.5; cursor:default; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
  .pill.wait{ background: rgba(167,148,72,.18); color: var(--accent-2); }
  .pill.ok{ background: var(--ok-bg); color: var(--ok); }
  .pill.no{ background: var(--danger-bg); color: var(--danger); }

  .entry{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
  .entry:last-child{ border-bottom:0; }
  .entry .who{ font-weight:700; font-size:13.5px; }
  .entry .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .entry .note{ font-size:12.5px; margin-top:4px; color:var(--text); }
  .entry .actions{ display:flex; gap:6px; flex:0 0 auto; }
  .actBtn{ border:0; border-radius:8px; padding:7px 11px; font-size:12px; font-weight:800; cursor:pointer; }
  .actBtn.yes{ background: var(--ok); color:#12281A; }
  .actBtn.no{ background: var(--danger); color:#2A1608; }

  .empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .err{ color:var(--danger); font-size:13px; margin-top:8px; }

  footer.foot{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); line-height:1.6; }

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    html, body{ margin:0; padding:0; }
    .no-print{ display:none !important; }
    .wrap{ max-width:100% !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
<script src="babel.min.js"></script>
<script src="supabase-js.min.js"></script>
<script src="supabase-client.js"></script>
<script src="nav.js"></script>
<script src="print-fit.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const { client } = RazporedAuth;

const STATUS_LABEL = {
  pending_lead: { text: "Čaka na vodjo", cls: "wait" },
  pending_admin: { text: "Čaka na administratorja", cls: "wait" },
  approved: { text: "Odobreno", cls: "ok" },
  rejected_by_lead: { text: "Zavrnil vodja", cls: "no" },
  rejected_by_admin: { text: "Zavrnil administrator", cls: "no" },
};

const SWAP_SELECT = "*, requester:profiles!swap_requests_requester_id_fkey(full_name), target:profiles!swap_requests_target_id_fkey(full_name)";

function fmtDate(iso){
  return new Date(iso + "T00:00:00").toLocaleDateString("sl-SI", { day:"numeric", month:"short", year:"numeric" });
}

function StatusPill({ status }){
  const s = STATUS_LABEL[status] || { text: status, cls: "wait" };
  return <span className={"pill " + s.cls}>{s.text}</span>;
}

function NovPredlog({ myId, colleagues, onSubmitted }){
  const [targetId, setTargetId] = useState("");
  const [myDate, setMyDate] = useState("");
  const [targetDate, setTargetDate] = useState("");
  const [myShift, setMyShift] = useState(undefined);
  const [targetShift, setTargetShift] = useState(undefined);
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (!myDate){ setMyShift(undefined); return; }
    client.from("schedule_entries").select("shift_code").eq("employee_id", myId).eq("work_date", myDate).maybeSingle()
      .then(({ data }) => setMyShift(data ? data.shift_code : ""));
  }, [myId, myDate]);

  useEffect(() => {
    if (!targetId || !targetDate){ setTargetShift(undefined); return; }
    client.from("schedule_entries").select("shift_code").eq("employee_id", targetId).eq("work_date", targetDate).maybeSingle()
      .then(({ data }) => setTargetShift(data ? data.shift_code : ""));
  }, [targetId, targetDate]);

  const submit = async () => {
    setErr(null);
    if (!targetId || !myDate || !targetDate){ setErr("Izberi sodelavca in oba datuma."); return; }
    setBusy(true);
    try {
      const { error } = await client.rpc("submit_swap_request", {
        p_target_id: targetId, p_requester_date: myDate, p_target_date: targetDate, p_note: note.trim() || null,
      });
      if (error) throw error;
      setTargetId(""); setMyDate(""); setTargetDate(""); setNote("");
      onSubmitted();
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="card">
      <div className="field">
        <label htmlFor="col">Sodelavec, s katerim želiš zamenjati</label>
        <select id="col" value={targetId} onChange={e => setTargetId(e.target.value)}>
          <option value="">Izberi …</option>
          {colleagues.map(c => <option key={c.id} value={c.id}>{c.full_name}</option>)}
        </select>
      </div>
      <div className="row2">
        <div className="field">
          <label htmlFor="md">Tvoj datum</label>
          <input id="md" type="date" value={myDate} onChange={e => setMyDate(e.target.value)} />
          {myShift !== undefined && <div className="shiftPreview">Trenutno: {myShift || "prosto"}</div>}
        </div>
        <div className="field">
          <label htmlFor="td">Datum sodelavca</label>
          <input id="td" type="date" value={targetDate} onChange={e => setTargetDate(e.target.value)} />
          {targetShift !== undefined && <div className="shiftPreview">Trenutno: {targetShift || "prosto"}</div>}
        </div>
      </div>
      <div className="field">
        <label htmlFor="nt">Opomba (neobvezno)</label>
        <textarea id="nt" value={note} onChange={e => setNote(e.target.value)} placeholder="npr. razlog za menjavo" />
      </div>
      <button className="submitBtn" onClick={submit} disabled={busy}>{busy ? "Pošiljam …" : "Predlagaj menjavo"}</button>
      {err && <p className="err">{err}</p>}
    </div>
  );
}

function MojeMenjave({ rows }){
  if (rows.length === 0) return <p className="empty">Nimaš še nobenega predloga menjave.</p>;
  return (
    <div className="card">
      {rows.map(r => (
        <div className="entry" key={r.id}>
          <div>
            <div className="who">
              <a href={"imenik.html?id=" + r.requester_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.requester.full_name}</a>
              {" ↔ "}
              <a href={"imenik.html?id=" + r.target_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.target.full_name}</a>
            </div>
            <div className="meta">{fmtDate(r.requester_date)} ⇄ {fmtDate(r.target_date)}</div>
            {r.note && <div className="note">{r.note}</div>}
          </div>
          <StatusPill status={r.status} />
        </div>
      ))}
    </div>
  );
}

function OdobritevVodja({ rows, onDecide }){
  const [busyId, setBusyId] = useState(null);
  if (rows.length === 0) return <p className="empty">Trenutno ni predlogov, ki čakajo tvojo odobritev.</p>;
  const decide = async (id, approve) => {
    setBusyId(id);
    try {
      const { error } = await client.rpc("decide_swap_lead", { p_swap_id: id, p_approve: approve, p_note: null });
      if (error) throw error;
      onDecide();
    } catch (e) { alert(e.message || String(e)); }
    finally { setBusyId(null); }
  };
  return (
    <div className="card">
      {rows.map(r => (
        <div className="entry" key={r.id}>
          <div>
            <div className="who">
              <a href={"imenik.html?id=" + r.requester_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.requester.full_name}</a>
              {" ↔ "}
              <a href={"imenik.html?id=" + r.target_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.target.full_name}</a>
            </div>
            <div className="meta">{fmtDate(r.requester_date)} ⇄ {fmtDate(r.target_date)}</div>
            {r.note && <div className="note">{r.note}</div>}
          </div>
          <div className="actions">
            <button className="actBtn yes" disabled={busyId===r.id} onClick={() => decide(r.id, true)}>Odobri</button>
            <button className="actBtn no" disabled={busyId===r.id} onClick={() => decide(r.id, false)}>Zavrni</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function OdobritevAdmin({ rows, onDecide }){
  const [busyId, setBusyId] = useState(null);
  if (rows.length === 0) return <p className="empty">Trenutno ni predlogov, ki čakajo dokončno odobritev.</p>;
  const decide = async (id, approve) => {
    setBusyId(id);
    try {
      const { error } = await client.rpc("decide_swap_admin", { p_swap_id: id, p_approve: approve, p_note: null });
      if (error) throw error;
      onDecide();
    } catch (e) { alert(e.message || String(e)); }
    finally { setBusyId(null); }
  };
  return (
    <div className="card">
      {rows.map(r => (
        <div className="entry" key={r.id}>
          <div>
            <div className="who">
              <a href={"imenik.html?id=" + r.requester_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.requester.full_name}</a>
              {" ↔ "}
              <a href={"imenik.html?id=" + r.target_id} style={{color:"inherit", textDecoration:"none", borderBottom:"1px dotted var(--muted)"}}>{r.target.full_name}</a>
            </div>
            <div className="meta">{fmtDate(r.requester_date)} ⇄ {fmtDate(r.target_date)} · odobril vodja</div>
            {r.note && <div className="note">{r.note}</div>}
          </div>
          <div className="actions">
            <button className="actBtn yes" disabled={busyId===r.id} onClick={() => decide(r.id, true)}>Potrdi</button>
            <button className="actBtn no" disabled={busyId===r.id} onClick={() => decide(r.id, false)}>Zavrni</button>
          </div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(null);
  const [colleagues, setColleagues] = useState([]);
  const [mine, setMine] = useState([]);
  const [pendingLead, setPendingLead] = useState([]);
  const [pendingAdmin, setPendingAdmin] = useState([]);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(() => {
    RazporedAuth.requireAuth().then(res => { if (res) setAuth(res); });
  }, []);

  const reload = useCallback(() => setReloadKey(k => k + 1), []);

  useEffect(() => {
    if (!auth) return;
    const myId = auth.session.user.id;

    client.from("profiles").select("id, full_name").neq("id", myId).order("full_name")
      .then(({ data }) => setColleagues(data || []));

    client.from("swap_requests").select(SWAP_SELECT)
      .or(`requester_id.eq.${myId},target_id.eq.${myId}`)
      .order("created_at", { ascending: false })
      .then(({ data }) => setMine(data || []));

    if (auth.profile && auth.profile.role === "vodja"){
      client.from("swap_requests").select(SWAP_SELECT).eq("status", "pending_lead")
        .order("created_at", { ascending: true })
        .then(({ data }) => setPendingLead(data || []));
    }
    if (auth.profile && auth.profile.role === "admin"){
      client.from("swap_requests").select(SWAP_SELECT).eq("status", "pending_admin")
        .order("created_at", { ascending: true })
        .then(({ data }) => setPendingAdmin(data || []));
    }

    // Ob obisku strani označi obvestila kot prebrana.
    client.from("notifications").update({ read_at: new Date().toISOString() })
      .eq("user_id", myId).is("read_at", null).then(() => {});
  }, [auth, reloadKey]);

  if (!auth) return null;
  const { profile } = auth;

  return (
    <div className="wrap">
      <RazporedOgledTrak aktivno={auth.ogled} profil={profile}/>
      <RazporedLogout/>
      <header className="top">
        <div className="wordmark"><img className="logoSmall" src="logo-pbb.png" alt="" /><span className="mark">Menjave izmen</span></div>
        <p className="sub">{profile ? profile.full_name : ""} · {RazporedAuth.ROLE_LABEL[profile ? profile.role : "user"]}</p>
      </header>

      {profile && profile.role === "admin" && (
        <React.Fragment>
          <h2 className="section">Čaka dokončno odobritev (2. stopnja)</h2>
          <OdobritevAdmin rows={pendingAdmin} onDecide={reload} />
        </React.Fragment>
      )}

      {profile && profile.role === "vodja" && (
        <React.Fragment>
          <h2 className="section">Čaka tvojo odobritev (1. stopnja, tvoja ekipa)</h2>
          <OdobritevVodja rows={pendingLead} onDecide={reload} />
        </React.Fragment>
      )}

      <h2 className="section no-print">Nov predlog menjave</h2>
      <p className="hint no-print">Predlagaj menjavo izmene s sodelavcem. Predlog najprej pregleda vodja tvoje ekipe, nato še administrator — šele takrat se razpored dejansko spremeni.</p>
      <div className="no-print"><NovPredlog myId={auth.session.user.id} colleagues={colleagues} onSubmitted={reload} /></div>

      <h2 className="section">Moje menjave</h2>
      <MojeMenjave rows={mine} />
      <button className="submitBtn no-print" style={{marginTop:10}} onClick={() => PrintFit.natisni(null, { orientacija:"portrait" })}>📄 Izvozi v PDF (A4 pokončno)</button>

      <footer className="foot no-print">
        <p><b>Dvostopenjska odobritev.</b> 1. stopnja: vodja tvoje ekipe. 2. stopnja: administrator — šele po tem se izmeni dejansko zamenjata v razporedu. Obvestila o spremembi statusa dobiš v aplikaciji (oznaka ob "Menjave" spodaj).</p>
      </footer>

      <RazporedNav active="menjave" role={profile ? profile.role : "user"} unread={0} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
